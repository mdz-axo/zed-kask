[files]
ignore-files = true
ignore-hidden = false
extend-exclude = [
    ".git/",

    # Typewriter model names used for agent branch names aren't typos.
    "crates/agent_ui/src/branch_names.rs",

    # Contributor names aren't typos.
    ".mailmap",

    # File suffixes aren't typos.
    "crates/theme/src/icon_theme.rs",
    "crates/extensions_ui/src/extension_suggest.rs",

    # Some mock data is flagged as typos.
    "crates/assistant_tools/src/web_search_tool.rs",

    # Suppress false positives in database schema.
    "crates/collab/migrations/20251208000000_test_schema.sql",

    # Vendored JSON schemas from SchemaStore.
    "crates/json_schema_store/src/schemas/",

    # Not our typos.
    "crates/livekit_api/",
    # Vim makes heavy use of partial typing tables.
    "crates/vim/",
    # Editor, file finder, and fuzzy matching rely on partial typing and custom in-string syntax.
    "crates/file_finder/src/file_finder_tests.rs",
    "crates/fuzzy_nucleo/src/strings.rs",
    "crates/editor/src/editor_tests.rs",
    "crates/editor/src/edit_prediction_tests.rs",
    # There are some names in the test data that are incorrectly flagged as typos.
    "crates/git/test_data/blame_incremental_complex",
    "crates/git/test_data/golden/blame_incremental_complex.json",
    # We have some base64-encoded data that is incorrectly being flagged.
    "crates/rpc/src/auth.rs",
    # glsl isn't recognized by this tool.
    "extensions/glsl/languages/glsl/",
    # Protols is the name of the language server.
    "extensions/proto/extension.toml",
    "extensions/proto/src/language_servers/protols.rs",
    # Windows likes its abbreviations.
    "crates/gpui_windows/src/directx_renderer.rs",
    "crates/gpui_windows/src/events.rs",
    "crates/gpui_windows/src/direct_write.rs",
    "crates/gpui_windows/src/window.rs",
    # Some typos in the base mdBook CSS.
    "docs/theme/css/",
    # Automatically generated JS.
    "docs/theme/c15t@*.js",
    # Spellcheck triggers on `|Fixe[sd]|` regex part.
    "script/danger/dangerfile.ts",
    # File type extensions are not typos
    "crates/zed/resources/windows/zed.iss",
    # typos-cli doesn't understand our `vˇariable` markup
    "crates/editor/src/hover_links.rs",
    # typos-cli doesn't understand `setis` is intentional test case
    "crates/editor/src/code_completion_tests.rs",
    # Linux repository structure is not a valid text, hence we should not check it for typos
    "crates/project_panel/benches/linux_repo_snapshot.txt",
    # Some multibuffer test cases have word fragments that register as typos
    "crates/multi_buffer/src/multi_buffer_tests.rs",
    # Macos apis
    "crates/gpui_macos/src/dispatcher.rs",
    # Tests contain partially incomplete words (by design)
    "crates/edit_prediction_cli/src/split_commit.rs",
    "crates/edit_prediction_metrics/src/kept_rate.rs",
    # Eval examples contain intentionally partial words (e.g. "secur" for "secure")
    "crates/edit_prediction_cli/evals/",
    # Tests contain `baˇr` that cause `"ba" should be "by" or "be".`-like false-positives
    "crates/editor/src/document_symbols.rs",

    # Research artifacts contain proper nouns (esports team names, player
    # handles, locales) that typos flags as false positives. These are data,
    # not prose. ~3048 of 3376 typos findings live here.
    "tasks/",
    "assets/",
    # This plan doc enumerates typo examples (real and false-positive) as
    # evidence — typos flags its own example list. It is documentation of the
    # remediation, not prose to be checked.
    "kask/docs/plans/ci-typos-buf-jobs.md",
    # The audit config mirrors the extend-ignore-re regexes from typos.toml
    # (policy layer) so the weekly audit job can run without the allowlist.
    # The regex strings contain typo-like fragments (e.g. `cl[ist]`, `guage`)
    # that typos flags. Excluding it keeps the per-PR job green; the weekly
    # audit job excludes it from its own scan via --exclude.
    "typos-audit.toml",
]

[default]
check-filename = true
extend-ignore-re = [
    # PNG is a file format, not a typo
    "PNG",
    'cl\[ist]',
    '\[lan\]guage',
    '"ba"',
    "doas",
    # ProtoLS crate with tree-sitter Protobuf grammar.
    "protols",
    # x11rb SelectionNotifyEvent struct field
    "requestor",
    # macOS version
    "Big Sur",
    # Not an actual typo but an intentionally invalid color, in `color_extractor`
    "#fof",
    # Stripped version of reserved keyword `type`
    "typ",
    # AMD GPU Services
    "ags",
    # AMD GPU Services
    "AGS",
    # "noet" is a vim variable (ideally to ignore locally)
    "noet",
    # Yarn Plug'n'Play
    "PnP",
    # `image` crate method: Delay::from_numer_denom_ms
    "numer",
    # Abbreviation for foreignObject in mermaid SVG processing
    "fo",
    # Mermaid CSS class name for state diagram composites
    "composit",
    # Used in truncating tests to ensure byte-length vs char like in café
    "caf…",
    # Closure params and short identifiers in code: |anc| (ancestor), |iy|
    # (income_yearly), nd (Lisp count-not-done var), strat (strategy var).
    # These are handled as extend-words too; the regex is a belt-and-suspenders
    # for any case where the token appears without word boundaries.
    "\\banc\\b",
    "\\biy\\b",
    "\\bnd\\b",
    "\\bstrat\\b",
    # Suffix lists in salience.rs: -ful, -ment, -ance, -ence.
    "\\bful\\b",
    "\\bment\\b",
    # mis- prefix compounds: mis-classified, mis-sourced, mis-flag.
    "mis-",
    # vim :bd[elete] command syntax (optional spelling).
    "elete",
    # Upstream test fixture identifier.
    "GHIzJ",
    # Intentionally non-matching query in project search tests
    "NOTHINGmATCHEStHIS",
]

[default.extend-words]
# Boris Beizer — software testing theorist (Software Testing Techniques, 1990).
# Used across the bug-hunt skill and test-harness docs.
Beizer = "Beizer"
beizer = "beizer"
# ratatui is a real Rust crate (terminal UI framework).
ratatui = "ratatui"
# OT = Optimality Theory (linguistics), used in the pragmatic-semantics skill.
OT = "OT"
# Adam Pease — ontology author (SUMO, Ontology Portal).
Pease = "Pease"
# FIBO ontology namespace fragment (fibo-fnd-... = Foundations).
fnd = "fnd"
# Financial abbreviation for "shares" in economic-profit tooling.
Shs = "Shs"
# LoRA adapter matrix: W + (α/r)·BA.
BA = "BA"
# TCP congestion control: Additive Increase Multiplicative Decrease.
AIMD = "AIMD"
# Year-over-Year (financial).
YOY = "YOY"
# scap = screen capture crate.
scap = "scap"
Scap = "Scap"
# Acceptable spelling variants.
invokable = "invokable"
writeable = "writeable"
overrideable = "overrideable"
# Mermaid diagram node IDs (CFR_FRON, FALS, etc.).
FRON = "FRON"
FALS = "FALS"
# ETO = Environment-Task-Operator (research framework).
ETO = "ETO"
# German word in a metacognition template.
Lokal = "Lokal"
# Both "unparseable" and "unparsable" are attested in major dictionaries
# (Merriam-Webster, OED). The codebase prose standard is "unparsable" (45:1);
# "unparseable" survives only as: (a) the codegraph Complexity::Unparseable
# enum variant (serialized to DB as {"Unparseable"}), (b) SQL/template
# strings matching the DB-stored enum value, and (c) upstream Zed code
# (crates/swarm_panel, crates/collab) outside our remediation scope.
# The reg.skill.manifest telemetry span names were renamed to `unparsable`
# on 2026-08-17 (ci-sweep follow-up issue #5) — no consumer filtered on the
# old `unparseable` names, so the rename was safe and the per-file typos
# exclusions for skill_loader.rs / event.rs were dropped.
unparseable = "unparseable"
Unparseable = "Unparseable"
# RunPod GraphQL API field name — upstream spells it "Celcius". We cannot
# rename it without breaking the API query.
Celcius = "Celcius"
# clonable: acceptable variant spelling (cloneable / clonable).
clonable = "clonable"
# These appear in doc comments as intentional examples of typos
# (e.g. "a typo like `visibilty` would be silently accepted").
visibilty = "visibilty"
intger = "intger"
calibraton = "calibraton"
appliable = "appliable"
# cenarios: appears as the tail of **S**cenarios in a SCAD mnemonic where
# the leading S is bolded separately.
cenarios = "cenarios"
# grep -rPn flag (Perl regex + line numbers).
Pn = "Pn"
# Lisp variable in hypothesis-framer manifest: (let ((mis ...)) ...)
mis = "mis"
# null in is_null / SQL contexts.
null = "null"
# SQL fragments in test fixtures and schema comments.
UPDAT = "UPDAT"
DELET = "DELET"
INSER = "INSER"
BVE = "BVE"
# Test data fragment in text crate tests.
Iz = "Iz"
# Intentional typo example used in manifest_load_validation tests and the
# bundle::manifest doc comment — pins that a misspelled `category` value is a
# load error, not a silent "not a skill" classification.
catgory = "catgory"
# MUC-7: the Seventh Message Understanding Conference's Named Entity
# Recognition shared task (a proper noun cited in the structured-extraction
# skill's identify-entities template). Not the word "much".
MUC = "MUC"
