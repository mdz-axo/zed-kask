[build]
# zed-kask: D46 — cap concurrent rustc for EVERY cargo invocation in this
# workspace (rust-analyzer flycheck, editor tasks, agent builds — anything
# that doesn't pass an explicit --jobs). Uncapped, cargo spawns one rustc
# per core; on this workspace (400+ upstream crates + kask crates + 17 MCP
# servers) that pegs every core and crashes dev machines. The cap is 16,
# tuned for the 24-core dev box (2/3 of cores — full parallelism without
# starving foreground/editor processes). Machines with fewer cores should
# override with CARGO_BUILD_JOBS=<n>. Explicit --jobs flags (install.sh,
# script/clippy) override this and stay authoritative.
# Pinned by kask/scripts/build/check-build-profile.sh.
jobs = 16
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

[alias]
xtask = "run --package xtask --"
perf-test = ["test", "--profile", "release-fast", "--lib", "--bins", "--tests", "--all-features", "--config", "target.'cfg(true)'.runner='cargo run -p perf --release'", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]"]
# Keep similar flags here to share some ccache
perf-compare = ["run", "--profile", "release-fast", "-p", "perf", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]", "--", "compare"]

[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # This cfg will reduce the size of `windows::core::Error` from 16 bytes to 4 bytes
    "-C",
    "target-feature=+crt-static", # This fixes the linking issue when compiling livekit on Windows
]

# We need lld to link libwebrtc.a successfully on aarch64-linux
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
MACOSX_DEPLOYMENT_TARGET = "10.15.7"
