# zed-kask release — builds prebuilt binaries and uploads them to a GitHub
# Release on tag push. Fork-specific: runs on standard GitHub Actions runners
# (no Namespace, no sccache, no zed-industries gating).
#
# Trigger: push a tag matching `v*` (e.g. `v0.31.0`).
#
# Artifacts (one archive per target):
#   zed-kask-<triple>.tar.gz   (Linux, macOS)
#   zed-kask-<triple>.zip      (Windows)
#   SHA256SUMS                  (checksums for all archives)
#
# Each archive contains:
#   zed-kask            (the CLI / editor binary)
#   hkask-mcp-*         (10 MCP server binaries)
#
# Users install via:
#   curl -fsSL https://raw.githubusercontent.com/mdz-axo/zed-kask/main/kask/scripts/build/install-binary.sh | bash

name: kask-release

on:
  push:
    tags:
      - 'v*'
  schedule:
    # Nightly build at 08:00 UTC — publishes to the `nightly` tag.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  # Packages to build — generated from kask/scripts/build/mcp-servers.txt
  # (single source of truth, verified by kask/scripts/check-mcp-servers.sh
  # against BUILTIN_SERVERS in kask/crates/hkask-mcp-server/src/hkask_mcp_server.rs).
  # The list is materialized into --package args in the build step below.

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            archive: zed-kask-x86_64-unknown-linux-gnu.tar.gz
            archive_cmd: tar -czf
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: zed-kask-aarch64-unknown-linux-gnu.tar.gz
            archive_cmd: tar -czf
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: zed-kask-x86_64-apple-darwin.tar.gz
            archive_cmd: tar -czf
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: zed-kask-aarch64-apple-darwin.tar.gz
            archive_cmd: tar -czf
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: zed-kask-x86_64-pc-windows-msvc.zip
            archive_cmd: 7z a
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: kask-release-${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ./script/linux

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          # Materialize --package args from mcp-servers.txt (single source of truth).
          packages="--package zed"
          while IFS= read -r server; do
            case "$server" in
              ''|\#*) continue ;;
            esac
            packages="$packages --package $server"
          done < kask/scripts/build/mcp-servers.txt
          cargo build --release --target ${{ matrix.target }} $packages

      - name: Collect and archive binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-artifacts
          bin_dir="target/${{ matrix.target }}/release"
          # Copy zed-kask + all MCP server binaries
          cp "$bin_dir/zed-kask" release-artifacts/
          for bin in "$bin_dir"/hkask-mcp-*; do
            [ -f "$bin" ] || continue
            cp "$bin" release-artifacts/
          done
          # Strip debug symbols (non-fatal)
          strip release-artifacts/* 2>/dev/null || true
          # Create the archive from inside release-artifacts so paths are flat
          cd release-artifacts
          ${{ matrix.archive_cmd }} "../${{ matrix.archive }}" *

      - name: Collect and archive binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $binDir = "target/${{ matrix.target }}/release"
          Copy-Item "$binDir/zed-kask.exe" release-artifacts/
          Get-ChildItem "$binDir/hkask-mcp-*.exe" | ForEach-Object {
            Copy-Item $_.FullName release-artifacts/
          }
          7z a ${{ matrix.archive }} release-artifacts/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (for nightly tag move)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-artifacts
          # Flatten: artifacts/<archive-name>/<archive-file> → release-artifacts/
          find ./artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release-artifacts/ \;
          # Generate checksums
          cd release-artifacts
          sha256sum * > SHA256SUMS
          ls -lR .

      - name: Determine tag
        id: tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            # Manual dispatch — use the provided tag.
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Nightly build — move the `nightly` tag to the current commit.
            git tag -f nightly ${{ github.sha }}
            git push -f origin nightly
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
          else
            # Tag push — use the pushed tag.
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release-artifacts/*
          # Nightly builds get a generated body; tag pushes get auto-generated notes.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          # Nightly releases replace the previous one with the same tag.
          make_latest: ${{ steps.tag.outputs.tag == 'nightly' && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  # Serialize all release runs (tag pushes, scheduled nightlies, manual
  # dispatches) on a single group. The nightly path force-moves the
  # `nightly` tag and writes to GitHub Releases — concurrent runs would
  # race on both surfaces. A single group prevents that (BH-18).
  group: kask-release
  cancel-in-progress: false
