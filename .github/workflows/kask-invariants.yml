# zed-kask invariant gates — the compile/function/quality contract.
#
# Recomposed 2026-11-26 for fast, non-masking, bounded CI:
# - check (seconds, every push + PR, NO cancel-in-progress): single upfront
#   apt-get (jq, ripgrep), runs every static/hygiene/citation/duplication/
#   installer gate in a non-masking battery so one red gate never hides
#   downstream failures (fixing the streak where reg-canonical masked
#   duplication-pin/ratchet and selftests).
# - gate-selftests (parallel with check, every push + PR, NO cancel-in-progress):
#   single upfront apt-get (mold, ripgrep, jq), runs every
#   kask/scripts/check-*-selftest.sh in a non-masking loop.
# - lean-spec-pins (seconds/minutes, every push + PR, cancel-in-progress):
#   cached ~/.elan, positive Lean spec pins pass and negative controls fail.
# - kask-tests (minutes, every push + PR, cancel-in-progress):
#   installs mold, libasound2-dev, nasm, jq, ffmpeg, poppler-utils, and
#   protobuf-compiler (required by cdk-signatory's prost-build), then runs
#   clippy, kask/scripts/test (nextest --profile kask), MCP registration pins,
#   MCP reconnect integration, and test-evidence selftest.
# - zed-check (minutes, main pushes only, cancel-in-progress):
#   installs script/linux + mold + cargo-nextest, runs cargo check -p zed,
#   and runs the zed-path kask seam lib tests under cargo nextest (60s per-test
#   timeout from .config/nextest.toml so a hung test fails in 60s instead of
#   burning the entire job timeout).
#
# Every cargo invocation resolves the pinned toolchain from
# rust-toolchain.toml on first use (rustup auto-install).
name: Kask invariants

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Seconds-tier: NO concurrency group — every push's check runs to
    # completion, so a red verdict is never erased by a superseding push
    # (EUREKA-3 non-erasure invariant).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install static-gate CLI deps (jq, ripgrep)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq ripgrep
      - name: Static, hygiene, citation, duplication & installer gates (non-masking)
        run: |
          set +e
          failed_gates=()
          run_gate() {
            local name="$1"
            shift
            echo "::group::$name"
            "$@"
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::gate FAILED ($rc): $name"
              failed_gates+=("$name")
            fi
          }

          run_gate "§13.1 — no hKask crate depends on a zed-kask crate" bash kask/scripts/check-hkask-no-zed-deps.sh
          run_gate "Zed isolation — upstream packaging/updater surfaces stay deleted" bash kask/scripts/build/check-zed-isolation.sh
          run_gate "Installer publication — staged atomic publish" bash kask/scripts/build/check-publish-paths.sh
          run_gate "Installer uninstall + jq locality" bash kask/scripts/build/check-uninstall-paths.sh
          run_gate "Build monitor — tree-attributed interval sampling" bash kask/scripts/build/check-build-monitor.sh
          run_gate "Build profile seam — MCP servers build cheap" bash kask/scripts/build/check-build-profile.sh
          run_gate "Lean dependency — pinned toolchain install" bash kask/scripts/build/check-lean-toolchain.sh
          run_gate "Formatting — cargo fmt --all -- --check" cargo fmt --all -- --check
          run_gate "Citation gate — docs citations" bash kask/scripts/check-docs-citations.sh
          run_gate "Citation gate — citation drift" bash kask/scripts/check-docs-citation-drift.sh
          run_gate "Citation gate — code->docs citations" bash kask/scripts/check-code-docs-citations.sh
          run_gate "Dead-code allows — baseline ratchet" bash kask/scripts/check-no-new-dead-code-allows.sh
          run_gate "String errors — no Result<_, String> in hkask library code" bash kask/scripts/check-string-errors.sh
          run_gate "Zero Python — no interpreter surface under kask/ or workflows" bash kask/scripts/check-no-python.sh
          run_gate "Structural traps — no net-new unwrap() beyond baseline" bash kask/scripts/check-structural-traps.sh
          run_gate "MCP tool-behavior contract tests — Parameters seam coverage" bash kask/scripts/check-mcp-tool-tests.sh
          run_gate "MCP packaging — installer inventory matches runtime" bash kask/scripts/check-mcp-servers.sh
          run_gate "MCP registration pins — every server carries tool_surface_pin!" bash kask/scripts/check-mcp-registration.sh
          run_gate "Regulation namespaces — reg.* spans are canonical" bash kask/scripts/check-reg-canonical.sh
          run_gate "Provider profiles — every adopted vendor has a registry profile" bash kask/scripts/check-provider-profiles.sh
          run_gate "Crate hygiene — unsafe gated" bash kask/scripts/check-unsafe-forbid.sh
          run_gate "Crate hygiene — versions in sync" bash kask/scripts/check-version-sync.sh
          run_gate "http_client manifest — serde derive self-declared (D99)" bash kask/scripts/check-http-client-derive.sh
          run_gate "Fork layout — no mod.rs" bash kask/scripts/check-no-mod-rs.sh
          run_gate "GPUI-side timers — no smol::Timer" bash kask/scripts/check-no-smol-timer.sh
          run_gate "Duplication scan-base pin — current with upstream base" bash kask/scripts/check-duplication-pin.sh

          pin="$(head -n1 kask/scripts/duplication-scan-base.txt | tr -d '[:space:]')"
          if [ -n "$pin" ] && ! git cat-file -e "$pin^{commit}" 2>/dev/null; then
            git fetch origin "$pin" --depth=1 || true
          fi
          run_gate "Duplication ratchet — no net-new clone clusters beyond baseline" bash kask/scripts/check-duplication-ratchet.sh
          run_gate "Installer best practices — shellcheck, corpus stage, registry" bash kask/scripts/build/check-install-best-practices.sh

          if [ "${#failed_gates[@]}" -gt 0 ]; then
            echo "----"
            echo "FAILED gates (${#failed_gates[@]}):"
            printf '  - %s\n' "${failed_gates[@]}"
            exit 1
          fi
          echo "All static, hygiene, citation, duplication, and installer gates passed."

  gate-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Seconds/minutes-tier: NO concurrency group — selftest regressions must
    # never be silently cancelled by a follow-up push.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install selftest CLI & linker deps (mold, ripgrep, jq)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold ripgrep jq
      - name: Gate selftests — every kask/scripts/check-*-selftest.sh fails on a violation (non-masking)
        run: |
          set +e
          failed_selftests=()
          total=0
          for selftest in kask/scripts/check-*-selftest.sh; do
            total=$((total + 1))
            out="$(bash "$selftest" 2>&1)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::selftest FAILED ($rc): $selftest"
              printf '%s\n' "$out" >&2
              failed_selftests+=("$selftest")
            fi
          done
          if [ "${#failed_selftests[@]}" -gt 0 ]; then
            echo "----"
            echo "FAILED selftests (${#failed_selftests[@]}/$total):"
            printf '  - %s\n' "${failed_selftests[@]}"
            exit 1
          fi
          echo "All $total gate selftests passed."

  lean-spec-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lean-spec-pins
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Lean toolchain cache — elan + pinned lean4
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('kask/lean/lean-toolchain', 'kask/scripts/build/install-common.sh') }}
      - name: Spec pins — every positive checks clean; every negative control fails
        run: bash kask/scripts/check-lean-spec-pins.sh

  kask-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-kask-tests
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: kask-tests
      - uses: taiki-e/install-action@nextest
      - name: Install native build & runtime deps (mold, ALSA, nasm, jq, ffmpeg, poppler-utils, protobuf-compiler)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold libasound2-dev nasm jq ffmpeg poppler-utils protobuf-compiler
      - name: Headless audio — ALSA null default output
        run: printf 'pcm.!default { type null }\n' | sudo tee /etc/asound.conf
      - name: Kask clippy — workspace deny-lint profile over every kask crate
        run: bash kask/scripts/check-clippy.sh
      - name: Kask subtree — canonical runner (nextest --profile kask; fails if zero tests ran)
        run: bash kask/scripts/test
      - name: MCP registration pins — every server's exact-name pin executes
        run: |
          while IFS= read -r server; do
            case "$server" in
              ''|'#'*) continue ;;
            esac
            bash kask/scripts/cargo-test-nonzero.sh \
              -p "$server" tool_names_match_live_router -- --test-threads=1
          done < kask/scripts/build/mcp-servers.txt
      - name: MCP reconnect — isolated fixture processes (serial; fails if zero tests ran)
        run: bash kask/scripts/cargo-test-nonzero.sh --locked -p hkask-mcp --features test-fixture --test reconnect_integration -- --test-threads=1
      - name: Test evidence — real failure, correction, and rejection controls
        run: |
          cargo build --locked -p hkask-regulation --bin check_test_evidence
          bash kask/scripts/evaluate-test-evidence-selftest.sh "$PWD/target/debug/check_test_evidence"

  zed-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-zed-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: zed-check
      - uses: taiki-e/install-action@nextest
      - name: Install zed Linux build deps (script/linux) + mold linker
        run: |
          script/linux
          sudo apt-get install -y -qq mold
      - name: Full workspace — cargo check -p zed
        run: cargo check -p zed
      - name: Zed-path kask seam tests — agent + agent_skills + settings_ui + media_panel (nextest with 60s per-test timeout)
        run: cargo nextest run -p agent -p agent_skills -p settings_ui -p media_panel --lib --no-fail-fast --no-tests auto
