# zed-kask CI — runs on standard GitHub Actions runners (no Namespace, no sccache).
# This workflow is fork-specific and does not replace upstream's run_tests.yml
# (which is gated on repository_owner == 'zed-industries' and skipped on forks).
#
# The test job does NOT spin up a postgres service: kask reads
# HKASK_DATABASE_URL (not DATABASE_URL) and HKASK_DB_PROVIDER defaults to
# sqlite, so a postgres service would provide zero kask coverage. Add it back
# only when a kask crate's tests explicitly require postgres (set
# HKASK_DB_PROVIDER=postgres + HKASK_DATABASE_URL=... in the env block).
name: kask-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  CC: clang
  CXX: clang++

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Clippy
        run: ./script/clippy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-test-ubuntu-24.04
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests
        # Exclude tests that cannot pass on a standard GPU-less ubuntu-24.04 runner:
        #  - wgpu_atlas tests require a real wgpu adapter (no Vulkan ICD on the runner)
        #  - test_extension_store_with_test_extension has an internal 60s timeout for
        #    WASM extension install that is exceeded under CI load
        #  - test_random_worktree_changes / test_random_multibuffer are 100-iteration
        #    randomized stress tests that exceed the 60s nextest slow-timeout on a
        #    2-core runner (upstream runs them on 16x32 Namespace runners with 300s
        #    overrides; see .config/nextest.toml)
        # None of these exercise kask code. The bracket colorization test is deliberately
        # NOT excluded — reproduce it locally if it fails.
        run: >-
          cargo nextest run --workspace --no-fail-fast --no-tests=warn
          -E 'not (test(before_frame_skips_uploads_for_removed_texture) | test(remove_deallocates_tile_space_for_reuse) | test(test_extension_store_with_test_extension) | test(test_random_worktree_changes) | test(test_random_multibuffer))'

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-build-ubuntu-24.04
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Build all binaries
        run: cargo build --workspace --bins

  skill-span-namespace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check skill span namespace standard
        run: cd kask && bash scripts/check-skill-span-namespace.sh

  reg-canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check reg.* canonical namespace registration
        run: cd kask && bash scripts/check-reg-canonical.sh

  mcp-servers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check mcp-servers.txt matches BUILTIN_SERVERS
        run: cd kask && bash scripts/check-mcp-servers.sh
