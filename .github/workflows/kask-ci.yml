# zed-kask CI — runs on standard GitHub Actions runners (no Namespace, no sccache).
# This workflow is fork-specific and does not replace upstream's run_tests.yml
# (which is gated on repository_owner == 'zed-industries' and skipped on forks).
#
# The test job does NOT spin up a postgres service: kask reads
# HKASK_DATABASE_URL (not DATABASE_URL) and HKASK_DB_PROVIDER defaults to
# sqlite, so a postgres service would provide zero kask coverage. Add it back
# only when a kask crate's tests explicitly require postgres (set
# HKASK_DB_PROVIDER=postgres + HKASK_DATABASE_URL=... in the env block).
name: kask-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  CC: clang
  CXX: clang++

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Clippy
        run: ./script/clippy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-test-ubuntu-24.04
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests
        # Exclude tests that cannot pass on a standard GPU-less ubuntu-24.04 runner:
        #  - wgpu_atlas tests require a real wgpu adapter (no Vulkan ICD on the runner)
        #  - test_extension_store_with_test_extension has an internal 60s timeout for
        #    WASM extension install that is exceeded under CI load
        #  - test_random_worktree_changes / test_random_multibuffer are 100-iteration
        #    randomized stress tests that exceed the 60s nextest slow-timeout on a
        #    2-core runner (upstream runs them on 16x32 Namespace runners with 300s
        #    overrides; see .config/nextest.toml)
        # None of these exercise kask code. The bracket colorization test is deliberately
        # NOT excluded — reproduce it locally if it fails.
        run: >-
          cargo nextest run --workspace --no-fail-fast --no-tests=warn
          -E 'not (test(before_frame_skips_uploads_for_removed_texture) | test(remove_deallocates_tile_space_for_reuse) | test(test_extension_store_with_test_extension) | test(test_random_worktree_changes) | test(test_random_multibuffer))'
      - name: Run kask tests with trace collection
        # Collect kask-specific test traces for the evolving test harness.
        # Writes to kask/traces/<run-id>/ — see kask/docs/plans/evolving-test-harness.md
        run: cd kask && ./scripts/test --trace || true
        continue-on-error: true
      - name: Run mutation testing (scoped)
        # Mutation testing on core kask crates — the non-degenerate oracle for
        # bug-finding ability. Scoped to keep CI runtime reasonable.
        # Writes mutation_score to kask/traces/<run-id>/metrics.json
        run: >-
          cd kask &&
          RUN_ID="$(ls -t traces 2>/dev/null | head -1 || echo '')" &&
          if [ -n "$RUN_ID" ] && command -v cargo-mutants >/dev/null 2>&1; then
            cargo mutants --output-format json --in-place -p hkask-types -p hkask-capability -p hkask-templates --timeout-seconds 60 > /tmp/mutants-out.json 2>&1 || true;
            if [ -f /tmp/mutants-out.json ] && command -v jq >/dev/null 2>&1; then
              TOTAL=$(jq 'length' /tmp/mutants-out.json 2>/dev/null || echo 0);
              KILLED=$(jq '[.[] | select(.status == "killed")] | length' /tmp/mutants-out.json 2>/dev/null || echo 0);
              if [ "$TOTAL" -gt 0 ]; then
                SCORE=$(echo "scale=4; $KILLED / $TOTAL" | bc 2>/dev/null || echo 0);
                METRICS="traces/$RUN_ID/metrics.json";
                if [ -f "$METRICS" ]; then
                  jq --argjson ms "$SCORE" '.mutation_score = $ms' "$METRICS" > tmp.json && mv tmp.json "$METRICS";
                fi;
              fi;
            fi;
          fi
        continue-on-error: true
      - name: Upload trace artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kask-traces
          path: kask/traces/
          retention-days: 14
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-build-ubuntu-24.04
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Build all binaries
        run: cargo build --workspace --bins

  skill-span-namespace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check skill span namespace standard
        run: cd kask && bash scripts/check-skill-span-namespace.sh

  reg-canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check reg.* canonical namespace registration
        run: cd kask && bash scripts/check-reg-canonical.sh

  mcp-servers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check mcp-servers.txt matches BUILTIN_SERVERS
        run: cd kask && bash scripts/check-mcp-servers.sh

  hkask-no-zed-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check hKask crates do not depend on zed-kask crates (DIVERGENCE.md §13.1)
        run: cd kask && bash scripts/check-hkask-no-zed-deps.sh

  kali-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce security regression library (status: enforced entries)
        run: cd kask && bash scripts/check-kali-regressions.sh

  unsafe-forbid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check unsafe-gating attributes on kask crate roots (RR-0020)
        run: cd kask && bash scripts/check-unsafe-forbid.sh

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-deps-ubuntu-24.04
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete