# zed-kask CI — runs on standard GitHub Actions runners (no Namespace, no sccache).
# This workflow is fork-specific and does not replace upstream's run_tests.yml
# (which is gated on repository_owner == 'zed-industries' and skipped on forks).
#
# The test job does NOT spin up a postgres service: kask storage is SQLite-only,
# so a postgres service would provide zero kask coverage.
name: kask-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  schedule:
    # Weekly allowlist-drift audit (Sundays 09:00 UTC). Runs typos WITHOUT the
    # extend-words/extend-exclude allowlists and reports new findings as a
    # warning issue, not a CI failure. Makes allowlist accumulation visible
    # without breaking per-PR CI. See `typos-allowlist-audit` job below.
    - cron: '0 9 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  CC: clang
  CXX: clang++

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-clippy-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Clippy
        run: ./script/clippy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-test-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests
        # Scope to kask crates only (the 33 packages under kask/). The fork's CI
        # exists to gate kask changes; upstream Zed's 261 other crates are covered
        # by upstream's own run_tests.yml (gated on repository_owner ==
        # 'zed-industries', skipped on forks). Compiling test deps for all 294
        # workspace packages previously exhausted the 87G runner disk after 38
        # minutes of building (the job died before running a single test).
        # Scoping cuts the compile to ~33 crates and ~2945 tests.
        #
        # The bracket colorization test is deliberately NOT excluded — reproduce
        # it locally if it fails.
        run: >-
          cargo nextest run --no-fail-fast --no-tests=warn
          -p 'hkask-*' -p kask_bridge
          -E 'not (test(before_frame_skips_uploads_for_removed_texture) | test(remove_deallocates_tile_space_for_reuse) | test(test_extension_store_with_test_extension) | test(test_random_worktree_changes) | test(test_random_multibuffer) | test(test_generator_function_outline) | test(test_peers_following_each_other) | test(test_editing_files))'
      # NOTE: the trace-collection + mutation-testing steps were removed
      # 2026-08-04. They depended on kask/scripts/test, which was deleted in
      # 009b04066a ("Remove dead kask scripts, SQL, and docs"); the steps had
      # been silently no-op'ing behind `|| true` + continue-on-error ever
      # since (no traces/<run-id>/ was created, so the mutation step's RUN_ID
      # guard never fired). Restore them together with a real trace script if
      # the evolving-test-harness pipeline (kask/docs/plans/
      # evolving-test-harness.md) is revived.

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-build-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Build all binaries
        run: cargo build --workspace --bins

  skill-span-namespace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check skill span namespace standard
        run: cd kask && bash scripts/check-skill-span-namespace.sh

  reg-canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check reg.* canonical namespace registration
        run: cd kask && bash scripts/check-reg-canonical.sh

  mcp-servers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check mcp-servers.txt matches BUILTIN_SERVERS
        run: cd kask && bash scripts/check-mcp-servers.sh

  version-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check manifests, banners, and MCP provenance match the workspace release version
        run: cd kask && bash scripts/check-version-sync.sh

  hkask-no-zed-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check hKask crates do not depend on zed-kask crates (DIVERGENCE.md §13.1)
        run: cd kask && bash scripts/check-hkask-no-zed-deps.sh

  kali-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      # The gate runs `cargo test -p <crate> --lib` for cargo-test-kind
      # entries, so it needs an explicit toolchain + cache (without these it
      # only worked via rustup auto-install of rust-toolchain.toml — slow and
      # implicit).
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-kali-regressions-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: "Enforce security regression library (status: enforced entries)"
        run: cd kask && bash scripts/check-kali-regressions.sh

  # Added 2026-08-12 (kali-audit pass 7). Before this job existed, cargo-deny was
  # never run in CI, so a doubled quote in kask/deny.toml made the ENTIRE
  # supply-chain policy unparsable-and-inert with no signal at all. The explicit
  # `--config` matters: cargo-deny only auto-discovers deny.toml at the workspace
  # root, and a bare `cargo deny check` here silently falls back to defaults and
  # reports every documented ignore as an error.
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Fails the build if deny.toml stops parsing, if a new advisory appears
      # without a documented ignore, if a banned crate returns, if a
      # non-allowlisted license appears, or if a dependency is pulled from an
      # unenumerated git source.
      - name: Supply-chain audit (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path Cargo.toml --config kask/deny.toml check

  kali-regressions-selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Self-test injects synthetic grep-kind violations only — no cargo-test
      # entries, so no toolchain/cache is needed. If the self-test ever grows
      # a cargo-test case, add the toolchain + cache steps here.
      - name: "Verify the kali-regressions gate can actually fail"
        run: cd kask && bash scripts/check-kali-regressions-selftest.sh

  # Self-tests for the pure-shell invariant gates. Each injects a synthetic
  # violation into a temp tree and asserts the gate catches it — so a future
  # regression in the gate's grep/condition logic cannot silently vacate it.
  # (CI gate sweep follow-up issue #6: a gate that can't fail doesn't enforce.)
  reg-creep-selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Verify the reg-creep gate can actually fail"
        run: cd kask && bash scripts/check-reg-creep-selftest.sh

  forecast-conformance-selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Verify the forecast-conformance gate can actually fail"
        run: cd kask && bash scripts/check-forecast-conformance-selftest.sh

  unsafe-forbid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check unsafe-gating attributes on kask crate roots (RR-0020)
        run: cd kask && bash scripts/check-unsafe-forbid.sh

  # CI-05: pure-shell invariant gates that need no toolchain. Each script
  # greps the kask tree for a specific contract violation.
  invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check string errors (no Result<_, String>)
        run: cd kask && bash scripts/check-string-errors.sh
      - name: Check forecast conformance
        run: cd kask && bash scripts/check-forecast-conformance.sh
      - name: Check reg creep
        run: cd kask && bash scripts/check-reg-creep.sh
      - name: Check MCP tool tests
        run: cd kask && bash scripts/check-mcp-tool-tests.sh
      - name: Check LoRA training regressions
        run: cd kask && bash scripts/check-lora-training-regressions.sh
      - name: Check zed-kask isolation from upstream Zed
        run: cd kask && bash scripts/build/check-zed-isolation.sh
      - name: Check uninstall paths
        run: cd kask && bash scripts/build/check-uninstall-paths.sh

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-deps-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          # Pinned to match the version developers run locally, so CI and local
          # agree on what counts as "unused". taiki-e/install-action@v2 fetches
          # the latest release tag by default; bump this explicitly when upgrading.
          tool: cargo-machete@0.9.2
      - name: Check for unused dependencies (cargo-machete)
        run: cargo machete

  # Spelling and proto-format gates. These run locally via ./script/clippy
  # (when the tools are installed and GITHUB_ACTIONS is unset) but were not
  # previously enforced in CI — a typo or proto-format drift could merge
  # without signal. Both are fast (<15s) and need no toolchain or cache.
  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          # Pinned to match the version developers run locally, so CI and
          # local agree on what counts as a typo. taiki-e/install-action@v2
          # fetches the latest release tag by default; bump this explicitly
          # when upgrading, same discipline as cargo-machete@0.9.2 above.
          tool: typos@v1.49.0
      - name: Check for spelling errors
        run: typos --config typos.toml

  buf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to the v1.50.0 release commit (a47c93e0b1648d5651a065437926377d060baa99)
      # rather than the floating @v1 major tag. A new buf release can surface
      # new lint findings and break CI without a code change; pinning makes
      # upgrades an explicit, reviewable bump. Same discipline as cargo-machete.
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99  # v1.50.0
      - name: Lint protobuf
        run: buf lint crates/proto/proto
      - name: Check protobuf formatting
        run: buf format --diff --exit-code crates/proto/proto

  # The nightly `unused_crate_dependencies` lint catches a class that
  # `cargo machete` cannot: a dep in `[dependencies]` that the lib target
  # never `use`s (e.g. `tokio` declared for the bin's `#[tokio::main]`
  # but not used in the lib). Lib roots with a legitimate bin-needs-dep
  # case carry `#![allow(unused_crate_dependencies)]` with an explanatory
  # comment.
  unused-deps-nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-unused-deps-nightly-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Check for unused crate dependencies (nightly lint, kask crates only)
        run: cd kask && bash scripts/check-unused-deps.sh

  # Weekly audit of the typos allowlist (follow-up issue #7). The per-PR
  # `typos` job enforces the allowlist; this job runs typos WITHOUT the
  # `[default.extend-words]` and `[files] extend-exclude` allowlists and
  # reports the delta as a warning. Each exclusion is a potential future
  # false-negative — a new typo matching an allowlisted word would be silently
  # missed. This job makes accumulation visible without breaking per-PR CI.
  #
  # Runs only on schedule (not on push/PR) to avoid noise. Findings are
  # surfaced as job output for manual triage — the job never fails, because
  # the unallowlisted typos include the false positives the allowlist exists
  # to suppress. The value is the DELTA between runs, not the absolute count.
  typos-allowlist-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: typos@v1.49.0
      - name: "Run typos WITHOUT the allowlist (warning-only — review the delta)"
        # --words / --files flags disable the extend-words / extend-exclude
        # sections, exposing every finding the allowlist currently suppresses.
        # continue-on-error makes the job non-blocking; the output is the signal.
        continue-on-error: true
        run: |
          echo "## Typos allowlist audit (weekly)"
          echo "Findings below are suppressed by typos.toml's allowlist."
          echo "Review the DELTA from last week — new entries may indicate a"
          echo "real typo that matches an allowlisted word."
          echo ""
          typos --config typos.toml --format json 2>/dev/null | head -200 || true
          echo ""
          echo "(Job is non-blocking. Triage new findings and either fix the typo"
          echo "or confirm the allowlist entry is still justified.)"