# zed-kask CI — runs on standard GitHub Actions runners (no Namespace, no sccache).
# This workflow is fork-specific and does not replace upstream's run_tests.yml
# (which is gated on repository_owner == 'zed-industries' and skipped on forks).
#
# The test job does NOT spin up a postgres service: kask reads
# HKASK_DATABASE_URL (not DATABASE_URL) and HKASK_DB_PROVIDER defaults to
# sqlite, so a postgres service would provide zero kask coverage. Add it back
# only when a kask crate's tests explicitly require postgres (set
# HKASK_DB_PROVIDER=postgres + HKASK_DATABASE_URL=... in the env block).
name: kask-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  CC: clang
  CXX: clang++

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-clippy-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Clippy
        run: ./script/clippy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-test-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests
        # Exclude tests that cannot pass on a standard GPU-less ubuntu-24.04 runner:
        #  - wgpu_atlas tests require a real wgpu adapter (no Vulkan ICD on the runner)
        #  - test_extension_store_with_test_extension has an internal 60s timeout for
        #    WASM extension install that is exceeded under CI load
        #  - test_random_worktree_changes / test_random_multibuffer are 100-iteration
        #    randomized stress tests that exceed the 60s nextest slow-timeout on a
        #    2-core runner (upstream runs them on 16x32 Namespace runners with 300s
        #    overrides; see .config/nextest.toml)
        # None of these exercise kask code. The bracket colorization test is deliberately
        # NOT excluded — reproduce it locally if it fails.
        run: >-
          cargo nextest run --workspace --no-fail-fast --no-tests=warn
          -E 'not (test(before_frame_skips_uploads_for_removed_texture) | test(remove_deallocates_tile_space_for_reuse) | test(test_extension_store_with_test_extension) | test(test_random_worktree_changes) | test(test_random_multibuffer))'
      # NOTE: the trace-collection + mutation-testing steps were removed
      # 2026-08-04. They depended on kask/scripts/test, which was deleted in
      # 009b04066a ("Remove dead kask scripts, SQL, and docs"); the steps had
      # been silently no-op'ing behind `|| true` + continue-on-error ever
      # since (no traces/<run-id>/ was created, so the mutation step's RUN_ID
      # guard never fired). Restore them together with a real trace script if
      # the evolving-test-harness pipeline (kask/docs/plans/
      # evolving-test-harness.md) is revived.

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-build-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Build all binaries
        run: cargo build --workspace --bins

  skill-span-namespace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check skill span namespace standard
        run: cd kask && bash scripts/check-skill-span-namespace.sh

  reg-canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check reg.* canonical namespace registration
        run: cd kask && bash scripts/check-reg-canonical.sh

  mcp-servers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check mcp-servers.txt matches BUILTIN_SERVERS
        run: cd kask && bash scripts/check-mcp-servers.sh

  version-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check manifests, banners, and MCP provenance match the workspace release version
        run: cd kask && bash scripts/check-version-sync.sh

  hkask-no-zed-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check hKask crates do not depend on zed-kask crates (DIVERGENCE.md §13.1)
        run: cd kask && bash scripts/check-hkask-no-zed-deps.sh

  kali-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      # The gate runs `cargo test -p <crate> --lib` for cargo-test-kind
      # entries, so it needs an explicit toolchain + cache (without these it
      # only worked via rustup auto-install of rust-toolchain.toml — slow and
      # implicit).
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-kali-regressions-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: ./script/linux
      - name: "Enforce security regression library (status: enforced entries)"
        run: cd kask && bash scripts/check-kali-regressions.sh

  kali-regressions-selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Self-test injects synthetic grep-kind violations only — no cargo-test
      # entries, so no toolchain/cache is needed. If the self-test ever grows
      # a cargo-test case, add the toolchain + cache steps here.
      - name: "Verify the kali-regressions gate can actually fail"
        run: cd kask && bash scripts/check-kali-regressions-selftest.sh

  unsafe-forbid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check unsafe-gating attributes on kask crate roots (RR-0020)
        run: cd kask && bash scripts/check-unsafe-forbid.sh

  # CI-05: pure-shell invariant gates that need no toolchain. Each script
  # greps the kask tree for a specific contract violation. ci-contract-check.sh
  # is intentionally omitted here — it shells out to cargo, so it belongs in
  # a job with a Rust toolchain (it is currently run as part of the test job
  # via kask/scripts/check-kali-regressions.sh's cargo-test-kind entries).
  invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check string errors (no Result<_, String>)
        run: cd kask && bash scripts/check-string-errors.sh
      - name: Check forecast conformance
        run: cd kask && bash scripts/check-forecast-conformance.sh
      - name: Check convergence weights
        run: cd kask && bash scripts/check-convergence-weights.sh
      - name: Check reg creep
        run: cd kask && bash scripts/check-reg-creep.sh
      - name: Check MCP tool tests
        run: cd kask && bash scripts/check-mcp-tool-tests.sh
      - name: Check LoRA training regressions
        run: cd kask && bash scripts/check-lora-training-regressions.sh

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kask-deps-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete