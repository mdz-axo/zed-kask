[package]
name = "nostr_panel"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/nostr_panel.rs"

[dependencies]
agent-client-protocol.workspace = true
editor.workspace = true
fs.workspace = true
anyhow.workspace = true
acp_thread.workspace = true
# An event's claimed time, shown as UTC text, and the Timeline's local
# rows and day dividers. `time_format`'s API takes `time`'s types, so the
# panel names both; `chrono` is gone.
time.workspace = true
time_format.workspace = true
gpui.workspace = true
# The blurhash decoder writes its pixels as an `image` buffer, the form
# GPUI's `RenderImage` takes.
image.workspace = true
# The Nostr servers' ids, tool names and event shape. The panel links
# neither server: the relay brings an LMDB store and an HTTP listener, the
# client a relay client, and neither belongs in the editor process.
hkask-types.workspace = true
# The reader's own identity (`kask.nostr.npub`), read from the live
# settings for the Following feed. Public data only.
kask_bridge.workspace = true
hkask_steer.workspace = true
hkask_tool_invoker.workspace = true
hkask_media_widget.workspace = true
log.workspace = true
markdown.workspace = true
hkask_panel_ui.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
# The `Settings` trait `KaskSettings::get_global` comes from.
settings.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Feature-propagation-only dev-deps: not `use`d in source. Same trap as
# `media_panel`'s: a build that turns on `remote/test-support` exposes the
# `Mock` variants of the remote connection types, and the match arms that
# handle them are gated on the consuming crate's own `test-support`, so all
# three must be on together.
project = { workspace = true, features = ["test-support"] }
remote_connection = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
theme.workspace = true
workspace = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-machete]
ignored = ["remote_connection"]
