[package]
name = "swarm_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/swarm_panel.rs"

[features]
# Without `workspace/test-support`, `--all-features` builds enable
# `remote/test-support` (via `acp_thread` -> `project` -> `remote`), which
# exposes `RemoteConnectionIdentity::Mock` in the `remote` crate without the
# matching cfg-gated match arm in `workspace/src/persistence.rs`, causing a
# non-exhaustive match error. `remote_connection/test-support` is needed for
# the same reason: `remote_connection` matches on `RemoteConnectionOptions`
# whose `Mock` variant is gated on `remote`'s `test-support`, and the match
# arm is gated on `remote_connection`'s own `test-support`. Both must be in
# sync with `remote/test-support` whenever it is on.
test-support = ["workspace/test-support", "remote_connection/test-support"]

[dependencies]
agent-client-protocol.workspace = true
editor.workspace = true
fs.workspace = true
gpui.workspace = true
hkask-types.workspace = true
hkask-mcp-kata-kanban.workspace = true
hkask_conversation_injector.workspace = true
hkask_steer.workspace = true
hkask_tool_invoker.workspace = true
hkask-mcp-swarm.workspace = true
kask_bridge.workspace = true

log.workspace = true
marketplace_ui_common.workspace = true
project.workspace = true
# Feature-propagation-only dep: not `use`d in source, but it must be a
# NORMAL dependency (not a dev-dep) so the `test-support` feature's
# `remote_connection/test-support` request reaches the normal-dependency
# unit that `cargo check --all-features` builds. As a dev-dep the request
# reached only the dev unit, and plain `cargo check --all-features
# -p swarm_panel` failed E0004 (`remote/test-support` on via
# `workspace/test-support`, `remote_connection`'s Mock match arm off).
# The feature still gates when it is on, so `cargo test -p swarm_panel`
# (without `--all-features`) does not leak `remote/test-support` into
# the graph.
remote_connection.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
ui.workspace = true
workspace.workspace = true
anyhow.workspace = true

[package.metadata.cargo-machete]
ignored = ["remote_connection"]
