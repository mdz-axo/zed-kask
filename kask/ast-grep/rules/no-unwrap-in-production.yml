# .rules: "No `unwrap()` in production code — use `?` to propagate errors;
# in test code prefer `expect` with a message."
#
# Structural, not textual: the pattern matches the call expression, so
# string literals and comments never match (a textual grep false-positives
# on both). `not.inside` excludes `#[cfg(test)]` modules by syntax —
# in tree-sitter-rust `#[cfg(test)]` is a preceding sibling `attribute_item`
# of `mod_item` (`follows`), and `stopBy: end` walks all ancestor nodes
# (without `stopBy: end`, `inside` checks only the immediate parent).
# Standalone test submodule files (`tests.rs`, `*_tests.rs`, `test_support.rs`)
# carry their `#[cfg(test)]` on the `mod` declaration in the parent file
# and are excluded via `ignores`.
id: no-unwrap-in-production
language: Rust
severity: error
message: "unwrap() in production code — propagate with `?` (tests: expect with a message)"
ignores:
  - '**/tests.rs'
  - '**/*_tests.rs'
  - '**/test_support.rs'
rule:
  pattern: $X.unwrap()
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        pattern: '#[cfg(test)]'