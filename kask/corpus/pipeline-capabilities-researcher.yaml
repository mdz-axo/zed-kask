# Capabilities Researcher — Full Pipeline Manifest
# Traces from raw files through trained LoRA adapter.
#
# Persona: Business and Economics Researcher — Capability-Performance Gap Analysis
# Source: 138 files (81 PDF + 48 HTML + 9 other) in corpus/source-library/
# Target: Bloom-balanced QAs for EVA LoRA training via Axolotl
#
# Models:
#   Classifier/Tagging/Assertions: OpenRouter/deepseek/deepseek-v4-flash (HKASK_CLASSIFIER_MODEL)
#   QA generation:              OpenRouter/z-ai/glm-5.2 (HKASK_DEFAULT_MODEL)
#   Embedding:                  DeepInfra/Qwen/Qwen3-Embedding-0.6B (HKASK_EMBEDDING_MODEL)
#
# Phases:
#   Pre-flight: Verify corpus MCP server is running and responsive
#   0. Extract text from 138 source files
#   1. Chunk extracted text into passages
#   2a. Tag chunks with ontology annotations
#   2b. Embed chunks with ontology-anchored vectors
#   2c. Extract assertions as h_mems (ontology-anchored: dc_type=dcterms:Assertion)
#   3. Dedup near-identical chunks
#   4. Consolidate related chunks via LLM synthesis
#   5. Build Bloom taxonomy QA prompts
#   6. Generate QA pairs
#   7. Ingest QAs into training JSONL + DB (ontology-anchored: dc_type=bibo:Document)
#   8. Assemble ChatML dataset
#   9. Submit LoRA training job
#
# Gates:
#   Each gate runs a deterministic command that checks disk artifacts,
#   prints verification stats, and asserts invariants. The agent presents
#   the stats to the user for review and approval before proceeding.
#   A failed gate halts the pipeline. Gates do NOT check tool response
#   fields — the disk artifact is the sole source of truth.
#
#   Ontology-aware gates (assertions, QA ingest) also verify the h_mem
#   ontology column via json_extract: dc_type, dimensions, dc_source,
#   and pko_procedure must be populated and match the service contract.
#   This catches silent ontology-column failures that would blind
#   downstream json_extract queries in build_prompts and consolidate.
#
# Artifact retention:
#   The entire corpus/ directory is gitignored. Final outputs will be
#   explicitly committed with git add -f after the pipeline completes
#   and all gates pass verification.
#
# Batch awareness:
#   Some steps (tagging) may require batched execution because the
#   chunks.jsonl file (71.8 MB) exceeds the MCP server's 32 MiB read cap.
#   Gates check the final merged output, not individual batch responses.

id: capabilities-researcher-pipeline
version: "10.0"
type: pipeline
energy_budget:
  gas_cap: 500000
  rjoule_cap: 5
description: >
  Full corpus pipeline for the Capabilities Researcher persona.
  138 source files → extracted text → chunks → ontology tags → embeddings →
  assertions → dedup → consolidate → Bloom prompts → QA pairs → training JSONL →
  ChatML → LoRA training. Each phase has a blocking gate that verifies
  actual disk artifacts and presents stats to the user before proceeding.

env:
  HKASK_EMBEDDING_DIM: "1024"
  HKASK_DB_POOL_SIZE: "64"
  HKASK_HTTP_POOL_MAX_IDLE: "256"
  HKASK_CLASSIFIER_MODEL: "{{ classifier_model }}"
  HKASK_EMBEDDING_MODEL: "{{ embedding_model }}"

steps:
  # ═══════════════════════════════════════════════════════════════════════
  # Pre-flight: Verify corpus MCP server is running and responsive
  #
  # The corpus MCP server (hkask-mcp-corpus) provides every corpus_* tool
  # this pipeline calls. It is a stdio MCP server launched by Zed's
  # ContextServerStore when kask.mcp.load_default is true (the default).
  # This gate verifies the server is registered and responding before any
  # pipeline stage runs, so a missing server fails fast instead of
  # producing cryptic tool-not-found errors mid-pipeline.
  # ═══════════════════════════════════════════════════════════════════════
  - id: gate_corpus_server_alive
    type: gate
    blocking: true
    description: >
      Verify the corpus MCP server is running and responsive by calling
      corpus_is_complex on a small source file. If the tool is unavailable
      or returns an error, halt before any pipeline stage runs. The agent
      should attempt to restart the server via sync_kask_mcp_servers before
      retrying this gate.
    command: |
      python3 - <<'PY'
      import json, sys
      # This gate is a declarative contract — the agent executing the pipeline
      # must invoke the corpus_is_complex MCP tool on a file from corpus/source-library
      # and verify it returns a valid JSON response. The agent presents the result
      # to the user before proceeding.
      #
      # If the tool is unavailable (MCP server not running), the agent should:
      #   1. Check that kask.mcp.load_default is true in Zed settings
      #   2. Call sync_kask_mcp_servers to re-register built-in servers
      #   3. Wait for the ContextServerStore to restart the corpus server
      #   4. Retry this gate
      #
      # The agent fills in the actual tool response here before asserting.
      print(json.dumps({
          "instruction": "Agent must call corpus_is_complex on any file in corpus/source-library,",
          "verify": "tool returns valid JSON with 'is_complex' field",
          "on_failure": "restart corpus MCP server via sync_kask_mcp_servers, then retry",
      }, indent=2))
      PY
    on_failure:
      action: halt
      resume: "restart corpus MCP server via sync_kask_mcp_servers, rerun this gate"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 0: Extract text from source files
  # ═══════════════════════════════════════════════════════════════════════
  - id: extract_text
    description: "Extract text from 138 source files (81 PDF + 48 HTML + 9 other)"
    tool: corpus_convert
    params:
      path: "corpus/source-library"
      output: "corpus/extracted/researcher"

  - id: gate_extract_complete
    type: gate
    blocking: true
    description: >
      Verify every source file was extracted to a non-empty .txt with sane
      size relative to its source. Present inventory and quality stats to
      the user before proceeding to chunking.
    command: |
      python3 - <<'PY'
      from pathlib import Path
      import json
      source_dir = Path("corpus/source-library")
      output_dir = Path("corpus/extracted/researcher")
      supported = {".pdf", ".html", ".htm", ".md", ".txt", ".docx", ".pptx", ".xlsx", ".xls", ".csv"}
      sources = sorted(path for path in source_dir.iterdir() if path.is_file() and path.suffix.lower() in supported)
      expected = {f"{path.name}.txt": path for path in sources}
      extracts = {path.name: path for path in output_dir.glob("*.txt") if path.is_file()}
      missing = sorted(set(expected) - set(extracts))
      orphaned = sorted(set(extracts) - set(expected))
      too_small = sorted(name for name, path in extracts.items() if path.stat().st_size <= 100)
      suspicious = []
      for name, source in expected.items():
          extract = extracts.get(name)
          if extract is None:
              continue
          source_size = source.stat().st_size
          extract_size = extract.stat().st_size
          if (source_size >= 1_048_576 and extract_size < 1_024) or (source_size >= 10_485_760 and extract_size < 4_096):
              suspicious.append({"source": source.name, "source_bytes": source_size, "extract_bytes": extract_size})
      extract_sizes = [path.stat().st_size for path in extracts.values()]
      extract_words = sum(len(path.read_text(errors="replace").split()) for path in extracts.values())
      stats = {
          "sources": len(sources),
          "extracts": len(extracts),
          "missing": missing[:20],
          "orphaned": orphaned[:20],
          "too_small": too_small[:20],
          "suspicious_pairs": suspicious[:20],
          "extract_bytes_total": sum(extract_sizes),
          "extract_bytes_min": min(extract_sizes) if extract_sizes else 0,
          "extract_bytes_max": max(extract_sizes) if extract_sizes else 0,
          "extract_words_total": extract_words,
      }
      print(json.dumps(stats, indent=2))
      assert len(sources) == 138, f"expected 138 sources, found {len(sources)}"
      assert len(extracts) == 138, f"expected 138 extracts, found {len(extracts)}"
      assert not missing, f"missing extracts: {missing[:10]}"
      assert not orphaned, f"orphan extracts: {orphaned[:10]}"
      assert not too_small, f"extracts <=100 bytes: {too_small[:10]}"
      assert not suspicious, f"large-source/tiny-extract pairs: {suspicious[:10]}"
      print("GATE_PASS extract_complete")
      PY
    on_failure:
      action: halt
      resume: "repair extraction, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Chunk extracted text + purge old DB state
  # ═══════════════════════════════════════════════════════════════════════
  - id: chunk_all
    description: "Chunk extracted text into ~512-token passages with 64-token overlap"
    tool: corpus_chunk
    params:
      input_dir: "corpus/extracted/researcher"
      output: "corpus/chunks/chunks.jsonl"
      max_tokens: 300
      overlap_tokens: 64
      entity_ref_prefix: "corpus:researcher"

  - id: purge_existing
    description: "Purge old embeddings and QA h_mems from DB for clean pipeline run"
    tool: corpus_purge_qa
    params:
      prefix: "corpus:researcher:"
      db_path: "corpus/memory/john-brooks.db"

  - id: gate_chunk_complete
    type: gate
    blocking: true
    description: >
      Verify chunking produced valid JSONL covering all 138 sources with unique
      entity_refs, sane word counts, and no empty/degenerate chunks. Also verify
      the DB purge left a clean slate. Present chunk distribution and quality
      stats to the user before proceeding to tagging.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter
      from pathlib import Path
      extract_dir = Path("corpus/extracted/researcher")
      chunk_path = Path("corpus/chunks/chunks.jsonl")
      expected_sources = {path.name for path in extract_dir.glob("*.txt") if path.is_file()}
      extracted_words = sum(len(path.read_text(errors="replace").split()) for path in extract_dir.glob("*.txt"))
      records = []
      json_errors = 0
      with chunk_path.open() as handle:
          for line_number, line in enumerate(handle, 1):
              try:
                  value = json.loads(line)
              except json.JSONDecodeError as e:
                  json_errors += 1
                  print(f"JSON error line {line_number}: {e}")
                  continue
              records.append(value)
      refs = [r["entity_ref"] for r in records]
      duplicate_refs = [k for k, c in Counter(refs).items() if c != 1]
      actual_sources = {r["source"] for r in records}
      missing_sources = sorted(expected_sources - actual_sources)
      orphan_sources = sorted(actual_sources - expected_sources)
      word_counts = [r.get("word_count", 0) for r in records]
      empty_chunks = sum(1 for r in records if not r.get("text", "").strip())
      chunk_words = sum(word_counts)
      ratio = chunk_words / max(extracted_words, 1)
      per_source = Counter(r["source"] for r in records)
      stats = {
          "extract_sources": len(expected_sources),
          "chunk_sources": len(actual_sources),
          "total_chunks": len(records),
          "json_errors": json_errors,
          "duplicate_refs": duplicate_refs[:20],
          "missing_sources": missing_sources[:20],
          "orphan_sources": orphan_sources[:20],
          "empty_chunks": empty_chunks,
          "extracted_words": extracted_words,
          "chunk_words": chunk_words,
          "word_ratio": round(ratio, 3),
          "words_min": min(word_counts) if word_counts else 0,
          "words_avg": round(sum(word_counts) / max(len(word_counts), 1)),
          "words_median": sorted(word_counts)[len(word_counts) // 2] if word_counts else 0,
          "words_max": max(word_counts) if word_counts else 0,
          "chunks_per_source_min": min(per_source.values()) if per_source else 0,
          "chunks_per_source_max": max(per_source.values()) if per_source else 0,
          "top_5_sources": [(s, c) for s, c in per_source.most_common(5)],
          "bottom_5_sources": [(s, c) for s, c in per_source.most_common()[-5:]],
      }
      print(json.dumps(stats, indent=2))
      assert len(expected_sources) == 138, f"expected 138 extract sources, found {len(expected_sources)}"
      assert records, "no chunks produced"
      assert json_errors == 0, f"{json_errors} JSON parse errors"
      assert not duplicate_refs, f"duplicate entity_refs: {duplicate_refs[:10]}"
      assert not missing_sources, f"extracts with no chunks: {missing_sources[:10]}"
      assert not orphan_sources, f"unknown chunk sources: {orphan_sources[:10]}"
      assert empty_chunks == 0, f"{empty_chunks} empty-text chunks"
      assert 0.90 <= ratio <= 1.35, f"word ratio {ratio:.3f} outside [0.90, 1.35]"
      print("GATE_PASS chunk_complete")
      PY
    on_failure:
      action: halt
      resume: "repair chunking or purge, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2a: Tag chunks with ontology annotations (BEFORE embed)
  #
  # Tags first so embeddings can be ontology-anchored (INSTRUCTOR, Su et al. 2023).
  # The LLM classifies each chunk against GOLEM, FIBO, ESO, PKO, Dublin Core.
  #
  # NOTE: chunks.jsonl is 71.8 MB and exceeds the MCP server's 32 MiB read cap.
  # This step must be executed in batches (see corpus/.pipeline-batches/tagging/).
  # The gate checks the final merged tagged_ontology.jsonl, not batch responses.
  # ═══════════════════════════════════════════════════════════════════════
  - id: tag_chunks
    description: >
      Tag chunks with 5W1H dimensions, Dublin Core, PKO, FIBO/GOLEM/ESO
      ontology tags, and expertise level. Must run BEFORE embed so embeddings
      can be ontology-anchored. May require batched execution due to file size.
    tool: corpus_tag_chunks
    params:
      chunks_jsonl: "corpus/chunks/chunks.jsonl"
      output: "corpus/chunks/tagged_ontology.jsonl"
      concurrency: 128

  - id: gate_tag_complete
    type: gate
    blocking: true
    description: >
      Verify every chunk has a structurally valid ontology tag record with exact
      entity_ref equality, valid dimensions, ontology_tags, and salience. Present
      tag coverage, dimension distribution, and quality stats to the user before
      proceeding to embedding.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter
      def load(path):
          records = []
          with open(path) as handle:
              for line_number, line in enumerate(handle, 1):
                  try:
                      records.append(json.loads(line))
                  except json.JSONDecodeError as e:
                      print(f"JSON error at {path} line {line_number}: {e}")
                      raise
          return records
      chunks = load("corpus/chunks/chunks.jsonl")
      tagged = load("corpus/chunks/tagged_ontology.jsonl")
      chunk_refs = [item["entity_ref"] for item in chunks]
      tag_refs = [item["entity_ref"] for item in tagged]
      duplicates = [k for k, c in Counter(tag_refs).items() if c != 1]
      missing = sorted(set(chunk_refs) - set(tag_refs))
      orphaned = sorted(set(tag_refs) - set(chunk_refs))
      allowed_dimensions = {"who", "what", "when", "where", "why", "how"}
      invalid = []
      dimension_counts = Counter()
      ontology_namespaces = Counter()
      salience_values = []
      for index, item in enumerate(tagged, 1):
          dimensions = item.get("dimensions")
          tags = item.get("ontology_tags", {})
          salience = item.get("salience")
          if (not item.get("text", "").strip() or
              not isinstance(dimensions, list) or not dimensions or
              not set(dimensions) <= allowed_dimensions or
              not isinstance(tags, dict) or not tags or
              not isinstance(salience, (int, float))):
              invalid.append(index)
          else:
              dimension_counts.update(dimensions)
              ontology_namespaces.update(tags.keys())
              salience_values.append(salience)
      stats = {
          "chunks": len(chunks),
          "tagged": len(tagged),
          "missing_refs": missing[:20],
          "orphaned_refs": orphaned[:20],
          "duplicate_refs": duplicates[:20],
          "invalid_records": invalid[:20],
          "dimension_distribution": dict(dimension_counts.most_common()),
          "ontology_namespaces": dict(ontology_namespaces.most_common()),
          "salience_min": min(salience_values) if salience_values else None,
          "salience_avg": round(sum(salience_values) / max(len(salience_values), 1), 3) if salience_values else None,
          "salience_max": max(salience_values) if salience_values else None,
      }
      print(json.dumps(stats, indent=2))
      assert len(tagged) == len(chunks), f"tagged {len(tagged)} != chunks {len(chunks)}"
      assert not missing, f"{len(missing)} missing refs: {missing[:10]}"
      assert not orphaned, f"{len(orphaned)} orphaned refs: {orphaned[:10]}"
      assert not duplicates, f"{len(duplicates)} duplicate refs: {duplicates[:10]}"
      assert not invalid, f"{len(invalid)} invalid records: {invalid[:10]}"
      print("GATE_PASS tag_complete")
      PY
    on_failure:
      action: halt
      resume: "repair tagging, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2b: Embed chunks with ontology-anchored vectors (AFTER tag)
  # ═══════════════════════════════════════════════════════════════════════
  - id: embed_chunks
    description: >
      Embed all chunks with Qwen3-Embedding-0.6B using ontology tag annotations
      as embedding instructions. Stores vectors in the encrypted memory DB.
    tool: corpus_embed
    params:
      chunks_jsonl: "corpus/chunks/chunks.jsonl"
      tagged_jsonl: "corpus/chunks/tagged_ontology.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      batch_size: 50

  - id: gate_embed_complete
    type: gate
    blocking: true
    description: >
      Verify DB vector entity_refs exactly match chunk entity_refs — no missing,
      stale, or duplicate vectors. Present embedding coverage stats to the user
      before proceeding to assertion extraction. Requires sqlcipher CLI.
    command: |
      command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required"; exit 2; }
      PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
      TMP_REFS=$(mktemp)
      trap 'rm -f "$TMP_REFS"' EXIT
      sqlcipher -batch corpus/memory/john-brooks.db \
        "PRAGMA key='$PASSPHRASE'; SELECT entity_ref FROM embeddings WHERE entity_ref LIKE 'corpus:researcher:%' ORDER BY entity_ref;" > "$TMP_REFS"
      python3 - "$TMP_REFS" <<'PY'
      import json, sys
      from collections import Counter
      with open("corpus/chunks/chunks.jsonl") as handle:
          expected = [json.loads(line)["entity_ref"] for line in handle]
      with open(sys.argv[1]) as handle:
          actual = [line.rstrip("\n") for line in handle if line.strip()]
      duplicate = [k for k, c in Counter(actual).items() if c != 1]
      missing = sorted(set(expected) - set(actual))
      stale = sorted(set(actual) - set(expected))
      stats = {
          "chunks": len(expected),
          "db_vectors": len(actual),
          "missing_vectors": missing[:20],
          "stale_vectors": stale[:20],
          "duplicate_vectors": duplicate[:20],
      }
      print(json.dumps(stats, indent=2))
      assert len(actual) == len(expected), f"vectors {len(actual)} != chunks {len(expected)}"
      assert not missing, f"{len(missing)} missing vectors: {missing[:10]}"
      assert not stale, f"{len(stale)} stale vectors: {stale[:10]}"
      assert not duplicate, f"{len(duplicate)} duplicate vectors: {duplicate[:10]}"
      print("GATE_PASS embed_complete")
      PY
    on_failure:
      action: halt
      resume: "repair embeddings, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2c: Extract assertions as h_mems in DB
  # ═══════════════════════════════════════════════════════════════════════
  - id: extract_assertions
    description: >
      Extract assertions from each chunk with the canonical classifier model.
      Stores assertions as h_mems with entity=chunk_ref, attribute=predicate,
      value={subject, object}, and a dual-axis ontology blob (dc_type=
      dcterms:Assertion, dc_source=chunk_ref, 5W1H dimension from predicate,
      optional ontology_tags for tagged namespaces). owner=john-brooks.
    tool: corpus_extract_assertions
    params:
      chunks_jsonl: "corpus/chunks/chunks.jsonl"
      tagged_jsonl: "corpus/chunks/tagged_ontology.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      owner: "john-brooks"
      max_assertions: 15
      concurrency: 64

  - id: gate_assertions_complete
    type: gate
    blocking: true
    description: >
      Verify the DB contains a non-trivial, distributed knowledge graph with
      assertion coverage across at least 80% of chunks. Verify the ontology column
      is populated and well-formed for every assertion h_mem: dc_type must be
      dcterms:Assertion, dimensions must be non-empty, dc_source must match
      the chunk entity_ref. Present assertion distribution, coverage, and ontology
      stats to the user before proceeding to dedup. Requires sqlcipher.
    command: |
      command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required"; exit 2; }
      PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
      DB="corpus/memory/john-brooks.db"
      KEY="PRAGMA key='$PASSPHRASE';"
      # Count + coverage + ontology column checks in one query pass.
      # json_extract returns NULL for null/malformed ontology — the right
      # signal for a broken write that would blind downstream json_extract
      # queries in build_prompts and consolidate.
      STATS=$(sqlcipher -batch "$DB" "$KEY
        SELECT
          COUNT(*)                                          AS total,
          COUNT(DISTINCT entity)                            AS distinct_entities,
          SUM(CASE WHEN ontology IS NULL THEN 1 ELSE 0 END) AS null_ontology,
          SUM(CASE WHEN json_extract(ontology,'$.dc_type') != 'dcterms:Assertion'
                   THEN 1 ELSE 0 END)                       AS wrong_dc_type,
          SUM(CASE WHEN json_extract(ontology,'$.dimensions') IS NULL
                        OR json_extract(ontology,'$.dimensions') = '[]'
                   THEN 1 ELSE 0 END)                       AS empty_dimensions,
          SUM(CASE WHEN json_extract(ontology,'$.dc_source') IS NULL
                        OR json_extract(ontology,'$.dc_source') = ''
                   THEN 1 ELSE 0 END)                       AS missing_dc_source
        FROM hmems WHERE entity LIKE 'corpus:researcher:%';")
      python3 - "$STATS" <<'PY'
      import json, sys
      with open("corpus/chunks/chunks.jsonl") as handle:
          chunks = sum(1 for _ in handle)
      parts = sys.argv[1].strip().split("|")
      total, entities, null_ont, wrong_dc, empty_dims, missing_src = \
          int(parts[0]), int(parts[1]), int(parts[2]), int(parts[3]), int(parts[4]), int(parts[5])
      coverage = entities / max(chunks, 1)
      avg_per_entity = total / max(entities, 1)
      stats = {
          "chunks": chunks,
          "stored_h_mems": total,
          "entities_with_triples": entities,
          "entity_coverage": round(coverage, 3),
          "avg_h_mems_per_entity": round(avg_per_entity, 1),
          "ontology_null": null_ont,
          "ontology_wrong_dc_type": wrong_dc,
          "ontology_empty_dimensions": empty_dims,
          "ontology_missing_dc_source": missing_src,
      }
      print(json.dumps(stats, indent=2))
      assert total >= chunks, f"only {total} h_mems for {chunks} chunks"
      assert coverage >= 0.80, f"coverage {coverage:.3f} below 0.80"
      assert null_ont == 0, f"{null_ont} assertion h_mems have null ontology column"
      assert wrong_dc == 0, f"{wrong_dc} assertion h_mems have dc_type != dcterms:Assertion"
      assert empty_dims == 0, f"{empty_dims} assertion h_mems have empty dimensions"
      assert missing_src == 0, f"{missing_src} assertion h_mems have missing dc_source"
      print("GATE_PASS triples_complete")
      PY
    on_failure:
      action: halt
      resume: "repair assertion extraction or ontology anchoring, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Dedup near-identical chunks (cosine > 0.85)
  # ═══════════════════════════════════════════════════════════════════════
  - id: dedup_chunks
    description: "Remove near-identical chunks using DB embeddings"
    tool: corpus_dedup_chunks
    params:
      tagged_jsonl: "corpus/chunks/tagged_ontology.jsonl"
      output: "corpus/chunks/deduped.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      prefix: "corpus:researcher:"
      threshold: 0.85

  - id: gate_dedup_complete
    type: gate
    blocking: true
    description: >
      Verify deduped.jsonl is a unique, valid subset of tagged chunks with no
      implausible mass deletion (>50%). Present dedup stats including reduction
      rate and removed count to the user before proceeding to consolidation.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter
      def load(path):
          with open(path) as handle:
              return [json.loads(line) for line in handle]
      original = load("corpus/chunks/tagged_ontology.jsonl")
      deduped = load("corpus/chunks/deduped.jsonl")
      original_refs = {item["entity_ref"] for item in original}
      refs = [item["entity_ref"] for item in deduped]
      duplicates = [k for k, c in Counter(refs).items() if c != 1]
      orphaned = sorted(set(refs) - original_refs)
      reduction = 1 - len(deduped) / max(len(original), 1)
      invalid = [i for i, item in enumerate(deduped, 1) if not item.get("text", "").strip() or not item.get("source")]
      stats = {
          "original": len(original),
          "deduped": len(deduped),
          "removed": len(original) - len(deduped),
          "reduction_pct": round(reduction * 100, 1),
          "duplicates": duplicates[:20],
          "orphaned": orphaned[:20],
          "invalid_records": invalid[:20],
      }
      print(json.dumps(stats, indent=2))
      assert deduped, "deduped output is empty"
      assert len(deduped) <= len(original), "deduped exceeds original"
      assert reduction <= 0.50, f"{reduction:.1%} reduction exceeds 50% anomaly ceiling"
      assert not duplicates, f"{len(duplicates)} duplicate refs"
      assert not orphaned, f"{len(orphaned)} orphaned refs"
      assert not invalid, f"{len(invalid)} invalid records"
      print("GATE_PASS dedup_complete")
      PY
    on_failure:
      action: halt
      resume: "repair dedup, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Consolidate related chunks via LLM synthesis (cosine > 0.75)
  # ═══════════════════════════════════════════════════════════════════════
  - id: consolidate_chunks
    description: "Cluster related chunks within source, LLM-synthesize multi-chunk clusters, re-embed"
    tool: corpus_consolidate_chunks
    params:
      tagged_jsonl: "corpus/chunks/deduped.jsonl"
      output: "corpus/chunks/consolidated.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      prefix: "corpus:researcher:"
      threshold: 0.75
      concurrency: 12
      max_chunks_per_cluster: 5

  - id: gate_consolidate_complete
    type: gate
    blocking: true
    description: >
      Verify consolidated.jsonl has unique identifiers, lossless lineage coverage
      of every deduped chunk, and no malformed records. Present consolidation
      stats including cluster counts and reduction rate to the user before
      proceeding to prompt building.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter
      def load(path):
          with open(path) as handle:
              return [json.loads(line) for line in handle]
      inputs = load("corpus/chunks/deduped.jsonl")
      outputs = load("corpus/chunks/consolidated.jsonl")
      input_refs = {item["entity_ref"] for item in inputs}
      output_refs = [item["entity_ref"] for item in outputs]
      covered = set()
      multi_chunk = 0
      invalid = []
      for index, item in enumerate(outputs, 1):
          if not item.get("text", "").strip() or not item.get("source"):
              invalid.append(index)
          lineage = item.get("consolidated_from") or [item["entity_ref"]]
          covered.update(lineage)
          if len(lineage) > 1:
              multi_chunk += 1
      duplicates = [k for k, c in Counter(output_refs).items() if c != 1]
      missing = sorted(input_refs - covered)
      orphaned = sorted(covered - input_refs)
      reduction = 1 - len(outputs) / max(len(inputs), 1)
      stats = {
          "deduped_input": len(inputs),
          "consolidated_output": len(outputs),
          "multi_chunk_clusters": multi_chunk,
          "singletons": len(outputs) - multi_chunk,
          "reduction_pct": round(reduction * 100, 1),
          "missing_lineage": missing[:20],
          "orphan_lineage": orphaned[:20],
          "duplicate_output_refs": duplicates[:20],
          "invalid_records": invalid[:20],
      }
      print(json.dumps(stats, indent=2))
      assert outputs, "consolidated output is empty"
      assert len(outputs) <= len(inputs), "output exceeds input"
      assert not missing, f"{len(missing)} missing lineage refs"
      assert not orphaned, f"{len(orphaned)} orphan lineage refs"
      assert not duplicates, f"{len(duplicates)} duplicate output refs"
      assert not invalid, f"{len(invalid)} invalid records"
      print("GATE_PASS consolidate_complete")
      PY
    on_failure:
      action: halt
      resume: "repair consolidation, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: Build Bloom taxonomy QA prompts (5 per chunk)
  # ═══════════════════════════════════════════════════════════════════════
  - id: build_prompts
    description: >
      Build Bloom taxonomy prompts: 5 per chunk with KNN context scaffold,
      ontology context, concept graph, and h_mem knowledge graph.
    tool: corpus_build_prompts
    params:
      tagged_jsonl: "corpus/chunks/consolidated.jsonl"
      output: "corpus/qa_pairs/prompts.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      context_k: 3
      prompts_per_chunk: 5
      type_distribution: "1,1,1,1,1"
      ontology_bloom_overrides: "golem:0,1,2,1,1|fibo:2,1,1,1,0|pko:1,1,1,1,1|eso:1,1,2,1,0|epistemic:1,1,2,1,0"
      owner: "john-brooks"

  - id: gate_prompts_complete
    type: gate
    blocking: true
    description: >
      Verify exactly 5 valid Bloom prompts per consolidated chunk with the
      configured ontology-specific type distribution. Present prompt matrix
      coverage and distribution stats to the user before proceeding to QA
      generation.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter, defaultdict
      allowed = {"factual", "conceptual", "analyze", "evaluate", "create"}
      default_dist = ["factual", "conceptual", "analyze", "evaluate", "create"]
      overrides = {
          "golem": ["conceptual", "analyze", "analyze", "evaluate", "create"],
          "fibo": ["factual", "factual", "conceptual", "analyze", "evaluate"],
          "pko": default_dist,
          "eso": ["factual", "conceptual", "analyze", "analyze", "evaluate"],
          "epistemic": ["factual", "conceptual", "analyze", "analyze", "evaluate"],
      }
      priority = ["pko", "golem", "fibo", "eso", "epistemic"]
      with open("corpus/chunks/consolidated.jsonl") as handle:
          chunks = {item["entity_ref"]: item for item in map(json.loads, handle)}
      prompts = []
      with open("corpus/qa_pairs/prompts.jsonl") as handle:
          for line_number, line in enumerate(handle, 1):
              item = json.loads(line)
              required = {"chunk_ref", "source", "qa_type", "system", "user"}
              assert required <= item.keys(), f"line {line_number}: missing fields"
              assert item["qa_type"] in allowed, f"line {line_number}: invalid qa_type"
              assert item["system"].strip() and item["user"].strip(), f"line {line_number}: empty prompt"
              prompts.append(item)
      matrix = defaultdict(list)
      for item in prompts:
          matrix[item["chunk_ref"]].append(item["qa_type"])
      bad = {}
      for ref, chunk in chunks.items():
          namespaces = chunk.get("ontology_tags", {})
          selected = next((ns for ns in priority if ns in namespaces), None)
          expected = overrides[selected] if selected else default_dist
          if Counter(matrix.get(ref, [])) != Counter(expected):
              bad[ref] = {"actual": matrix.get(ref, []), "expected": expected, "selected": selected}
      missing = sorted(set(chunks) - set(matrix))
      orphaned = sorted(set(matrix) - set(chunks))
      type_counts = Counter(item["qa_type"] for item in prompts)
      stats = {
          "chunks": len(chunks),
          "prompts": len(prompts),
          "prompts_per_chunk": len(prompts) / max(len(chunks), 1),
          "type_distribution": dict(type_counts.most_common()),
          "missing_chunks": missing[:20],
          "orphan_chunks": orphaned[:20],
          "distribution_mismatches": len(bad),
          "mismatch_samples": list(bad.items())[:5],
      }
      print(json.dumps(stats, indent=2))
      assert len(prompts) == len(chunks) * 5, f"expected {len(chunks)*5} prompts, got {len(prompts)}"
      assert not missing, f"{len(missing)} chunks with no prompts"
      assert not orphaned, f"{len(orphaned)} orphan prompt chunks"
      assert not bad, f"{len(bad)} distribution mismatches"
      print("GATE_PASS prompts_complete")
      PY
    on_failure:
      action: halt
      resume: "repair prompt building, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6: Generate QA pairs (GLM-5.2, thinking-mode, ContentGuard)
  # ═══════════════════════════════════════════════════════════════════════
  - id: generate_qas
    description: >
      Generate QA pairs via GLM-5.2 with per-Bloom sampling, thinking-mode JSON
      extraction, ContentGuard, and provenance-enriched output.
    tool: corpus_generate_qa_batch
    params:
      prompts_jsonl: "corpus/qa_pairs/prompts.jsonl"
      output: "corpus/qa_pairs/generated.jsonl"
      concurrency: 196
      model: "{{ qa_model }}"

  - id: gate_qa_generation_complete
    type: gate
    blocking: true
    description: >
      Verify every prompt key has a valid QA with non-empty instruction and
      output, no error records, no orphan keys, and no duplicate questions.
      Present QA coverage and quality stats to the user before proceeding to
      ingestion.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter
      with open("corpus/qa_pairs/prompts.jsonl") as handle:
          prompt_keys = {(item["chunk_ref"], item["qa_type"]) for item in map(json.loads, handle)}
      records = []
      errors = []
      with open("corpus/qa_pairs/generated.jsonl") as handle:
          for line_number, line in enumerate(handle, 1):
              item = json.loads(line)
              if "error" in item:
                  errors.append({"line": line_number, "error": str(item["error"])[:200]})
                  continue
              response = item.get("response", {})
              assert response.get("instruction", "").strip(), f"line {line_number}: empty instruction"
              assert response.get("output", "").strip(), f"line {line_number}: empty output"
              assert item.get("chunk_ref") and item.get("qa_type"), f"line {line_number}: missing provenance"
              records.append(item)
      generated_keys = {(item["chunk_ref"], item["qa_type"]) for item in records}
      missing = sorted(prompt_keys - generated_keys)
      orphaned = sorted(generated_keys - prompt_keys)
      duplicate_questions = [k for k, c in Counter(
          item["response"]["instruction"].strip().casefold() for item in records).items() if c != 1]
      instruction_lengths = [len(item["response"]["instruction"]) for item in records]
      output_lengths = [len(item["response"]["output"]) for item in records]
      stats = {
          "prompt_keys": len(prompt_keys),
          "qa_records": len(records),
          "error_records": len(errors),
          "error_samples": errors[:5],
          "missing_keys": missing[:20],
          "orphan_keys": orphaned[:20],
          "duplicate_questions": duplicate_questions[:20],
          "instruction_chars_min": min(instruction_lengths) if instruction_lengths else 0,
          "instruction_chars_avg": round(sum(instruction_lengths) / max(len(instruction_lengths), 1)),
          "output_chars_min": min(output_lengths) if output_lengths else 0,
          "output_chars_avg": round(sum(output_lengths) / max(len(output_lengths), 1)),
      }
      print(json.dumps(stats, indent=2))
      assert records, "no QA records generated"
      assert not errors, f"{len(errors)} error records"
      assert not missing, f"{len(missing)} uncovered prompt keys"
      assert not orphaned, f"{len(orphaned)} orphan keys"
      assert not duplicate_questions, f"{len(duplicate_questions)} duplicate questions"
      print("GATE_PASS qa_generation_complete")
      PY
    on_failure:
      action: halt
      resume: "repair QA generation, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 7: Ingest QAs (exact-match dedup + h_mem storage)
  # ═══════════════════════════════════════════════════════════════════════
  - id: ingest_qas
    description: >
      Parse generated QAs, quality-filter, exact-match dedup, write training
      JSONL, store QA h_mems with 5W1H + Dublin Core + PKO provenance.
    tool: corpus_ingest_qa
    params:
      generated_jsonl: "corpus/qa_pairs/generated.jsonl"
      output: "corpus/qa_pairs/train.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      dataset: "capabilities-researcher"
      owner: "john-brooks"

  - id: gate_qa_ingest_complete
    type: gate
    blocking: true
    description: >
      Verify the training JSONL has required fields, quality minima, unique
      instructions, and that DB h_mem count matches the file. Verify the
      ontology column is populated for every QA h_mem: dc_type must be
      bibo:Document, pko_procedure must be corpus_generate_qa, dimensions
      must be non-empty. Present training dataset and ontology stats to the
      user before proceeding to ChatML assembly. Requires sqlcipher CLI.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter
      records = []
      with open("corpus/qa_pairs/train.jsonl") as handle:
          for line_number, line in enumerate(handle, 1):
              item = json.loads(line)
              assert {"instruction", "input", "output"} <= item.keys(), f"line {line_number}: missing field"
              assert len(item["instruction"].strip()) >= 30, f"line {line_number}: short instruction"
              assert len(item["output"].strip()) >= 50, f"line {line_number}: short output"
              records.append(item)
      duplicates = [k for k, c in Counter(
          item["instruction"].strip().casefold() for item in records).items() if c != 1]
      instruction_lengths = [len(item["instruction"]) for item in records]
      output_lengths = [len(item["output"]) for item in records]
      stats = {
          "training_records": len(records),
          "duplicate_instructions": duplicates[:20],
          "instruction_chars_min": min(instruction_lengths) if instruction_lengths else 0,
          "instruction_chars_avg": round(sum(instruction_lengths) / max(len(instruction_lengths), 1)),
          "output_chars_min": min(output_lengths) if output_lengths else 0,
          "output_chars_avg": round(sum(output_lengths) / max(len(output_lengths), 1)),
      }
      print(json.dumps(stats, indent=2))
      assert records, "training dataset is empty"
      assert not duplicates, f"{len(duplicates)} duplicate instructions"
      PY
      command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required for DB reconciliation"; exit 2; }
      PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
      DB="corpus/memory/john-brooks.db"
      KEY="PRAGMA key='$PASSPHRASE';"
      TRAIN_COUNT=$(wc -l < corpus/qa_pairs/train.jsonl)
      # Count + ontology column checks for QA h_mems. The QA ingest service
      # sets dc_type=bibo:Document, pko_procedure=corpus_generate_qa,
      # pko_step=chunk_ref, and dimensions=[What] (from HMemOntology::semantic).
      QA_STATS=$(sqlcipher -batch "$DB" "$KEY
        SELECT
          COUNT(*)                                          AS total,
          SUM(CASE WHEN ontology IS NULL THEN 1 ELSE 0 END) AS null_ontology,
          SUM(CASE WHEN json_extract(ontology,'$.dc_type') != 'bibo:Document'
                   THEN 1 ELSE 0 END)                       AS wrong_dc_type,
          SUM(CASE WHEN json_extract(ontology,'$.pko_procedure') != 'corpus_generate_qa'
                   THEN 1 ELSE 0 END)                       AS wrong_pko_procedure,
          SUM(CASE WHEN json_extract(ontology,'$.dimensions') IS NULL
                        OR json_extract(ontology,'$.dimensions') = '[]'
                   THEN 1 ELSE 0 END)                       AS empty_dimensions
        FROM hmems WHERE attribute = 'training_qa_pair'
          AND value LIKE '%\"dataset\":\"capabilities-researcher\"%';")
      python3 - "$TRAIN_COUNT" "$QA_STATS" <<'PY'
      import json, sys
      train_count = int(sys.argv[1])
      parts = sys.argv[2].strip().split("|")
      db_count, null_ont, wrong_dc, wrong_pko, empty_dims = \
          int(parts[0]), int(parts[1]), int(parts[2]), int(parts[3]), int(parts[4])
      stats = {
          "train_jsonl": train_count,
          "db_training_qa_pairs": db_count,
          "ontology_null": null_ont,
          "ontology_wrong_dc_type": wrong_dc,
          "ontology_wrong_pko_procedure": wrong_pko,
          "ontology_empty_dimensions": empty_dims,
      }
      print(json.dumps(stats, indent=2))
      assert db_count == train_count, f"MISMATCH: DB {db_count} != train {train_count}"
      assert null_ont == 0, f"{null_ont} QA h_mems have null ontology column"
      assert wrong_dc == 0, f"{wrong_dc} QA h_mems have dc_type != bibo:Document"
      assert wrong_pko == 0, f"{wrong_pko} QA h_mems have pko_procedure != corpus_generate_qa"
      assert empty_dims == 0, f"{empty_dims} QA h_mems have empty dimensions"
      print("GATE_PASS qa_ingest_complete")
      PY
    on_failure:
      action: halt
      resume: "repair ingestion or ontology anchoring, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 8: Assemble ChatML dataset (80/20 train/test split)
  # ═══════════════════════════════════════════════════════════════════════
  - id: assemble_chatml
    description: >
      Assemble stored QA h_mems into ChatML JSONL with 80/20 train/test split
      and the Capabilities Researcher system prompt.
    tool: training_assemble_dataset
    params:
      dataset: "capabilities-researcher"
      output_path: "corpus/qa_pairs/train_chat.jsonl"
      train_split: 0.80
      system_prompt: >
        You are a Capabilities Researcher. You analyze the gap between what
        organizations, markets, and systems are capable of and what they
        actually achieve. Your analysis draws on economic theory, systems
        thinking, computing principles, and institutional analysis.

  - id: gate_chatml_complete
    type: gate
    blocking: true
    description: >
      Final pre-spend gate: verify train/test split counts, ChatML role order,
      non-empty content, no duplicates or train/test overlap, and no oversized
      examples. Present dataset stats to the user for approval before authorizing
      training spend.
    command: |
      python3 - <<'PY'
      import json
      from collections import Counter
      from pathlib import Path
      paths = [Path("corpus/qa_pairs/train_chat.jsonl"), Path("corpus/qa_pairs/train_chat.jsonl.test.jsonl")]
      datasets = []
      for path in paths:
          records = []
          with path.open() as handle:
              for line_number, line in enumerate(handle, 1):
                  item = json.loads(line)
                  messages = item.get("messages")
                  assert isinstance(messages, list) and [m.get("role") for m in messages] == ["system", "user", "assistant"], f"{path}:{line_number}: bad roles"
                  assert all(isinstance(m.get("content"), str) and m["content"].strip() for m in messages), f"{path}:{line_number}: empty content"
                  total_chars = sum(len(m["content"]) for m in messages)
                  records.append({"chars": total_chars, "user": messages[1]["content"].strip().casefold()})
          datasets.append(records)
      train, test = datasets
      duplicate_train = [k for k, c in Counter(r["user"] for r in train).items() if c != 1]
      overlap = sorted(set(r["user"] for r in train) & set(r["user"] for r in test))
      total = len(train) + len(test)
      ratio = len(train) / max(total, 1)
      char_sizes = [r["chars"] for r in train] + [r["chars"] for r in test]
      oversized = [i for i, r in enumerate(train + test, 1) if r["chars"] > 16_000]
      stats = {
          "train": len(train),
          "test": len(test),
          "train_ratio": round(ratio, 4),
          "duplicate_train_users": duplicate_train[:20],
          "train_test_overlap": overlap[:20],
          "chars_min": min(char_sizes) if char_sizes else 0,
          "chars_avg": round(sum(char_sizes) / max(len(char_sizes), 1)),
          "chars_max": max(char_sizes) if char_sizes else 0,
          "oversized_examples": len(oversized),
      }
      print(json.dumps(stats, indent=2))
      assert len(train) >= 100, f"only {len(train)} train examples"
      assert test, "no test examples"
      assert abs(ratio - 0.80) <= (1 / max(total, 1)), f"split ratio {ratio:.4f} != 0.80"
      assert not duplicate_train, f"{len(duplicate_train)} duplicate train users"
      assert not overlap, f"{len(overlap)} train/test overlap"
      assert not oversized, f"{len(oversized)} examples >16K chars"
      print("GATE_PASS chatml_complete")
      PY
    on_failure:
      action: halt
      resume: "repair ChatML assembly, rerun this gate, present stats to user"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 9: LoRA Training (RunPod H100 via training_submit)
  #
  # training_submit accepts the typed TrainingParams contract. EVA initialization.
  # skill_name is retrain-mode-only (silently ignored without feedback_path).
  # ═══════════════════════════════════════════════════════════════════════
  - id: train_lora
    description: "Submit typed EVA LoRA training job to RunPod H100"
    tool: training_submit
    params:
      dataset_path: "corpus/qa_pairs/train_chat.jsonl"
      base_model: "unsloth/Qwen3.6-27B"
      skill_name: "capabilities-researcher"
      params:
        num_epochs: 3
        batch_size: 1
        learning_rate: 0.0001
        lora:
          r: 32
          alpha: 64
          dropout: 0
          target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
          init_lora_weights: eva
        optimization:
          optimizer: adamw_8bit
          weight_decay: 0.01
          warmup_steps: 100
          lr_scheduler: cosine
          gradient_accumulation_steps: 16
          max_grad_norm: 0.3
        sequence:
          sequence_len: 4096
        advanced:
          attn_implementation: sdpa
          gradient_checkpointing: "true"
          bf16: true
          eval_split_ratio: 0.0012
    requires_consent: true