- ordinal: 17
  description: Verify exactly 5 valid Bloom prompts per consolidated chunk with the configured ontology-specific type distribution.
    Present prompt matrix coverage and distribution stats to the user before proceeding to QA generation.
  id: gate_prompts_complete
  action: gate
  command: |
    python3 - <<'PY'
    import json
    from collections import Counter, defaultdict
    allowed = {"factual", "conceptual", "analyze", "evaluate", "create"}
    default_dist = ["factual", "conceptual", "analyze", "evaluate", "create"]
    overrides = {
        "golem": ["conceptual", "analyze", "analyze", "evaluate", "create"],
        "fibo": ["factual", "factual", "conceptual", "analyze", "evaluate"],
        "pko": default_dist,
        "eso": ["factual", "conceptual", "analyze", "analyze", "evaluate"],
        "epistemic": ["factual", "conceptual", "analyze", "analyze", "evaluate"],
    }
    priority = ["pko", "golem", "fibo", "eso", "epistemic"]
    with open("corpus/chunks/consolidated.jsonl") as handle:
        chunks = {item["entity_ref"]: item for item in map(json.loads, handle)}
    prompts = []
    with open("corpus/qa_pairs/prompts.jsonl") as handle:
        for line_number, line in enumerate(handle, 1):
            item = json.loads(line)
            required = {"chunk_ref", "source", "qa_type", "system", "user"}
            assert required <= item.keys(), f"line {line_number}: missing fields"
            assert item["qa_type"] in allowed, f"line {line_number}: invalid qa_type"
            assert item["system"].strip() and item["user"].strip(), f"line {line_number}: empty prompt"
            prompts.append(item)
    matrix = defaultdict(list)
    for item in prompts:
        matrix[item["chunk_ref"]].append(item["qa_type"])
    bad = {}
    for ref, chunk in chunks.items():
        namespaces = chunk.get("ontology_tags", {})
        selected = next((ns for ns in priority if ns in namespaces), None)
        expected = overrides[selected] if selected else default_dist
        if Counter(matrix.get(ref, [])) != Counter(expected):
            bad[ref] = {"actual": matrix.get(ref, []), "expected": expected, "selected": selected}
    missing = sorted(set(chunks) - set(matrix))
    orphaned = sorted(set(matrix) - set(chunks))
    type_counts = Counter(item["qa_type"] for item in prompts)
    stats = {
        "chunks": len(chunks),
        "prompts": len(prompts),
        "prompts_per_chunk": len(prompts) / max(len(chunks), 1),
        "type_distribution": dict(type_counts.most_common()),
        "missing_chunks": missing[:20],
        "orphan_chunks": orphaned[:20],
        "distribution_mismatches": len(bad),
        "mismatch_samples": list(bad.items())[:5],
    }
    print(json.dumps(stats, indent=2))
    assert len(prompts) == len(chunks) * 5, f"expected {len(chunks)*5} prompts, got {len(prompts)}"
    assert not missing, f"{len(missing)} chunks with no prompts"
    assert not orphaned, f"{len(orphaned)} orphan prompt chunks"
    assert not bad, f"{len(bad)} distribution mismatches"
    print("GATE_PASS prompts_complete")
    PY
  on_failure:
    action: halt
    resume: repair prompt building, rerun this gate, present stats to user
