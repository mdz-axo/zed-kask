- ordinal: 21
  description: 'Verify the training JSONL has required fields, quality minima, unique instructions, and that DB h_mem count
    matches the file. Verify the ontology column is populated for every QA h_mem: dc_type must be bibo:Document, pko_procedure
    must be corpus_generate_qa, dimensions must be non-empty. Present training dataset and ontology stats to the user before
    proceeding to ChatML assembly. Requires sqlcipher CLI.'
  id: gate_qa_ingest_complete
  action: gate
  command: |
    python3 - <<'PY'
    import json
    from collections import Counter
    records = []
    with open("corpus/qa_pairs/train.jsonl") as handle:
        for line_number, line in enumerate(handle, 1):
            item = json.loads(line)
            assert {"instruction", "input", "output"} <= item.keys(), f"line {line_number}: missing field"
            assert len(item["instruction"].strip()) >= 30, f"line {line_number}: short instruction"
            assert len(item["output"].strip()) >= 50, f"line {line_number}: short output"
            records.append(item)
    duplicates = [k for k, c in Counter(
        item["instruction"].strip().casefold() for item in records).items() if c != 1]
    instruction_lengths = [len(item["instruction"]) for item in records]
    output_lengths = [len(item["output"]) for item in records]
    stats = {
        "training_records": len(records),
        "duplicate_instructions": duplicates[:20],
        "instruction_chars_min": min(instruction_lengths) if instruction_lengths else 0,
        "instruction_chars_avg": round(sum(instruction_lengths) / max(len(instruction_lengths), 1)),
        "output_chars_min": min(output_lengths) if output_lengths else 0,
        "output_chars_avg": round(sum(output_lengths) / max(len(output_lengths), 1)),
    }
    print(json.dumps(stats, indent=2))
    assert records, "training dataset is empty"
    assert not duplicates, f"{len(duplicates)} duplicate instructions"
    PY
    command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required for DB reconciliation"; exit 2; }
    PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
    DB="corpus/memory/john-brooks.db"
    KEY="PRAGMA key='$PASSPHRASE';"
    TRAIN_COUNT=$(wc -l < corpus/qa_pairs/train.jsonl)
    # Count + ontology column checks for QA h_mems. The QA ingest service
    # sets dc_type=bibo:Document, pko_procedure=corpus_generate_qa,
    # pko_step=chunk_ref, and dimensions=[What] (from HMemOntology::semantic).
    QA_STATS=$(sqlcipher -batch "$DB" "$KEY
      SELECT
        COUNT(*)                                          AS total,
        SUM(CASE WHEN ontology IS NULL THEN 1 ELSE 0 END) AS null_ontology,
        SUM(CASE WHEN json_extract(ontology,'$.dc_type') != 'bibo:Document'
                 THEN 1 ELSE 0 END)                       AS wrong_dc_type,
        SUM(CASE WHEN json_extract(ontology,'$.pko_procedure') != 'corpus_generate_qa'
                 THEN 1 ELSE 0 END)                       AS wrong_pko_procedure,
        SUM(CASE WHEN json_extract(ontology,'$.dimensions') IS NULL
                      OR json_extract(ontology,'$.dimensions') = '[]'
                 THEN 1 ELSE 0 END)                       AS empty_dimensions
      FROM hmems WHERE attribute = 'training_qa_pair'
        AND value LIKE '%\"dataset\":\"capabilities-researcher\"%';")
    python3 - "$TRAIN_COUNT" "$QA_STATS" <<'PY'
    import json, sys
    train_count = int(sys.argv[1])
    parts = sys.argv[2].strip().split("|")
    db_count, null_ont, wrong_dc, wrong_pko, empty_dims = \
        int(parts[0]), int(parts[1]), int(parts[2]), int(parts[3]), int(parts[4])
    stats = {
        "train_jsonl": train_count,
        "db_training_qa_pairs": db_count,
        "ontology_null": null_ont,
        "ontology_wrong_dc_type": wrong_dc,
        "ontology_wrong_pko_procedure": wrong_pko,
        "ontology_empty_dimensions": empty_dims,
    }
    print(json.dumps(stats, indent=2))
    assert db_count == train_count, f"MISMATCH: DB {db_count} != train {train_count}"
    assert null_ont == 0, f"{null_ont} QA h_mems have null ontology column"
    assert wrong_dc == 0, f"{wrong_dc} QA h_mems have dc_type != bibo:Document"
    assert wrong_pko == 0, f"{wrong_pko} QA h_mems have pko_procedure != corpus_generate_qa"
    assert empty_dims == 0, f"{empty_dims} QA h_mems have empty dimensions"
    print("GATE_PASS qa_ingest_complete")
    PY
  on_failure:
    action: halt
    resume: repair ingestion or ontology anchoring, rerun this gate, present stats to user
