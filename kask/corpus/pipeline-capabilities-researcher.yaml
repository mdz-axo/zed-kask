# Capabilities Researcher — Full Pipeline Manifest (translated to general executor schema)
# Traces from raw files through trained LoRA adapter.
#
# Persona: Business and Economics Researcher — Capability-Performance Gap Analysis
# Source: 138 files (81 PDF + 48 HTML + 9 other) in corpus/source-library/
# Target: Bloom-balanced QAs for EVA LoRA training via Axolotl
#
# This manifest uses the general manifest executor's schema (FlowDef).
# Steps use action: execute (tool calls) and action: gate (verification scripts).
# Gates run shell commands via `sh -c` and check for GATE_PASS/GATE_FAIL.
#
# Paths are project-root-relative (the MCP server CWD is the project root).
# Sources must be staged at corpus/source-library/ before running.
# External deps: sqlcipher, python3 (checked by pre-flight gate).
#
# Phases:
#   Pre-flight: Verify corpus MCP server + external deps
#   0. Extract text from 138 source files
#   1. Chunk extracted text into passages
#   2a. Tag chunks with ontology annotations
#   2b. Embed chunks with ontology-anchored vectors
#   2c. Extract assertions as h_mems
#   3. Dedup near-identical chunks
#   4. Consolidate related chunks via LLM synthesis
#   5. Build Bloom taxonomy QA prompts
#   6. Generate QA pairs
#   7. Ingest QAs into training JSONL + DB
#   8. Assemble ChatML dataset
#   9. Submit LoRA training job (requires_consent)
#
# Gates:
#   Each gate runs a deterministic command that checks disk artifacts,
#   prints verification stats, and asserts invariants. A failed gate
#   halts the pipeline via on_failure: {action: halt}.
#
# Batch awareness:
#   Phase 2a (tagging) may require batched execution because the
#   chunks.jsonl file (~71.8 MB) exceeds the MCP server's 32 MiB read cap.
#   Gates check the final merged output, not individual batch responses.
#
# Artifact retention:
#   The entire corpus/ directory is gitignored. Final outputs will be
#   explicitly committed with git add -f after the pipeline completes
#   and all gates pass verification.

manifest:
  id: capabilities-researcher-pipeline
  name: Capabilities Researcher Pipeline
  version: '10.0'
  category: pipeline
  description: Full corpus pipeline for the Capabilities Researcher persona. 138 source files → extracted text → chunks →
    ontology tags → embeddings → assertions → dedup → consolidate → Bloom prompts → QA pairs → training JSONL → ChatML → LoRA
    training. Each phase has a blocking gate that verifies actual disk artifacts and presents stats to the user before proceeding.
steps:
- ordinal: 1
  description: |
    Extract text from 138 source files (81 PDF + 48 HTML + 9 other).
    The corpus_convert tool handles text-native PDFs, HTML, and other formats
    directly. Scanned PDFs that produce near-empty text are caught by the
    extract gate, which halts and directs the agent to run corpus_ocr on the
    flagged files before re-running extraction. This is the real liveness
    check — if the corpus MCP server is down, this step fails with an
    unavailable error.
  id: extract_text
  action: execute
  mcp: corpus_convert
  input_mapping:
    path: corpus/source-library
    output: corpus/extracted/researcher
- ordinal: 2
  description: Verify every source file was extracted to a non-empty .txt with sane size relative to its source. Present inventory
    and quality stats to the user before proceeding to chunking.
  id: gate_extract_complete
  action: gate
  command: |
    python3 - <<'PY'
    from pathlib import Path
    import json
    source_dir = Path("corpus/source-library")
    output_dir = Path("corpus/extracted/researcher")
    supported = {".pdf", ".html", ".htm", ".md", ".txt", ".docx", ".pptx", ".xlsx", ".xls", ".csv"}
    sources = sorted(path for path in source_dir.iterdir() if path.is_file() and path.suffix.lower() in supported)
    expected = {f"{path.name}.txt": path for path in sources}
    extracts = {path.name: path for path in output_dir.glob("*.txt") if path.is_file()}
    missing = sorted(set(expected) - set(extracts))
    orphaned = sorted(set(extracts) - set(expected))
    too_small = sorted(name for name, path in extracts.items() if path.stat().st_size <= 100)
    suspicious = []
    for name, source in expected.items():
        extract = extracts.get(name)
        if extract is None:
            continue
        source_size = source.stat().st_size
        extract_size = extract.stat().st_size
        if (source_size >= 1_048_576 and extract_size < 1_024) or (source_size >= 10_485_760 and extract_size < 4_096):
            suspicious.append({"source": source.name, "source_bytes": source_size, "extract_bytes": extract_size})
    extract_sizes = [path.stat().st_size for path in extracts.values()]
    extract_words = sum(len(path.read_text(errors="replace").split()) for path in extracts.values())
    # Per-extract word count — a 500-page book that produced 200 words is broken.
    per_extract_words = {name: len(path.read_text(errors="replace").split()) for name, path in extracts.items()}
    low_word_extracts = sorted(
        (name, words) for name, words in per_extract_words.items() if words < 50
    )
    stats = {
        "sources": len(sources),
        "extracts": len(extracts),
        "missing": missing[:20],
        "orphaned": orphaned[:20],
        "too_small": too_small[:20],
        "suspicious_pairs": suspicious[:20],
        "low_word_extracts": low_word_extracts[:20],
        "extract_bytes_total": sum(extract_sizes),
        "extract_bytes_min": min(extract_sizes) if extract_sizes else 0,
        "extract_bytes_max": max(extract_sizes) if extract_sizes else 0,
        "extract_words_total": extract_words,
    }
    print(json.dumps(stats, indent=2))
    assert len(sources) == 138, f"expected 138 sources, found {len(sources)}"
    assert len(extracts) == 138, f"expected 138 extracts, found {len(extracts)}"
    assert not missing, f"missing extracts: {missing[:10]}"
    assert not orphaned, f"orphan extracts: {orphaned[:10]}"
    assert not too_small, f"extracts <=100 bytes: {too_small[:10]}"
    assert not suspicious, f"large-source/tiny-extract pairs: {suspicious[:10]}"
    assert not low_word_extracts, f"extracts with <50 words: {low_word_extracts[:10]}"
    print("GATE_PASS extract_complete")
    PY
  on_failure:
    action: halt
    resume: |
      For suspicious_pairs and low_word_extracts: the source PDFs are likely
      scanned/image-based. Run corpus_ocr on each flagged file, then re-run
      corpus_convert on the source directory. For missing extracts: check
      file permissions and format support. After repair, rerun this gate.
- ordinal: 3
  description: Chunk extracted text into ~256-token passages (paragraph-level, the HkaskSettings default) with 64-token overlap. Falls through to HKASK_CHUNK_MAX_TOKENS env var if set.
  id: chunk_all
  action: execute
  mcp: corpus_chunk
  input_mapping:
    input_dir: corpus/extracted/researcher
    output: corpus/chunks/chunks.jsonl
    overlap_tokens: 64
    entity_ref_prefix: corpus:researcher
- ordinal: 4
  description: Purge old embeddings and QA h_mems from DB for clean pipeline run
  id: purge_existing
  action: execute
  mcp: corpus_purge_qa
  input_mapping:
    prefix: 'corpus:researcher:'
    db_path: corpus/memory/john-brooks.db
- ordinal: 5
  description: Verify chunking produced valid JSONL covering all 138 sources with unique entity_refs, sane word counts, and
    no empty/degenerate chunks. Also verify the DB purge left a clean slate. Present chunk distribution and quality stats
    to the user before proceeding to tagging.
  id: gate_chunk_complete
  action: gate
  command: |
    python3 - <<'PY'
    import json
    from collections import Counter
    from pathlib import Path
    extract_dir = Path("corpus/extracted/researcher")
    chunk_path = Path("corpus/chunks/chunks.jsonl")
    expected_sources = {path.name for path in extract_dir.glob("*.txt") if path.is_file()}
    extracted_words = sum(len(path.read_text(errors="replace").split()) for path in extract_dir.glob("*.txt"))
    records = []
    json_errors = 0
    with chunk_path.open() as handle:
        for line_number, line in enumerate(handle, 1):
            try:
                value = json.loads(line)
            except json.JSONDecodeError as e:
                json_errors += 1
                print(f"JSON error line {line_number}: {e}")
                continue
            records.append(value)
    refs = [r["entity_ref"] for r in records]
    duplicate_refs = [k for k, c in Counter(refs).items() if c != 1]
    actual_sources = {r["source"] for r in records}
    missing_sources = sorted(expected_sources - actual_sources)
    orphan_sources = sorted(actual_sources - expected_sources)
    word_counts = [r.get("word_count", 0) for r in records]
    empty_chunks = sum(1 for r in records if not r.get("text", "").strip())
    chunk_words = sum(word_counts)
    ratio = chunk_words / max(extracted_words, 1)
    per_source = Counter(r["source"] for r in records)
    # Chunk-size quality bounds. The chunker uses HkaskSettings::DEFAULT_CHUNK_MAX_TOKENS
    # (256 tokens ≈ 192 words) with overlap_tokens=64 (≈48 words min, clamped to
    # max/4). Sentence-boundary alignment allows some slack, but chunks outside
    # [10, 384] words indicate a broken chunker — either degenerate tiny chunks
    # or paragraphs that weren't split at all.
    expected_max_words = 192  # tokens_to_words(256)
    words_min_floor = 10      # no chunk should be below 10 words
    words_max_ceiling = expected_max_words * 2  # 384 — 2x slack for long paragraphs
    undersized = [i for i, wc in enumerate(word_counts) if wc < words_min_floor]
    oversized = [i for i, wc in enumerate(word_counts) if wc > words_max_ceiling]
    stats = {
        "extract_sources": len(expected_sources),
        "chunk_sources": len(actual_sources),
        "total_chunks": len(records),
        "json_errors": json_errors,
        "duplicate_refs": duplicate_refs[:20],
        "missing_sources": missing_sources[:20],
        "orphan_sources": orphan_sources[:20],
        "empty_chunks": empty_chunks,
        "extracted_words": extracted_words,
        "chunk_words": chunk_words,
        "word_ratio": round(ratio, 3),
        "words_min": min(word_counts) if word_counts else 0,
        "words_avg": round(sum(word_counts) / max(len(word_counts), 1)),
        "words_median": sorted(word_counts)[len(word_counts) // 2] if word_counts else 0,
        "words_max": max(word_counts) if word_counts else 0,
        "undersized_chunks": undersized[:20],
        "oversized_chunks": oversized[:20],
        "expected_max_words": expected_max_words,
        "chunks_per_source_min": min(per_source.values()) if per_source else 0,
        "chunks_per_source_max": max(per_source.values()) if per_source else 0,
        "top_5_sources": [(s, c) for s, c in per_source.most_common(5)],
        "bottom_5_sources": [(s, c) for s, c in per_source.most_common()[-5:]],
    }
    print(json.dumps(stats, indent=2))
    assert len(expected_sources) == 138, f"expected 138 extract sources, found {len(expected_sources)}"
    assert records, "no chunks produced"
    assert json_errors == 0, f"{json_errors} JSON parse errors"
    assert not duplicate_refs, f"duplicate entity_refs: {duplicate_refs[:10]}"
    assert not missing_sources, f"extracts with no chunks: {missing_sources[:10]}"
    assert not orphan_sources, f"unknown chunk sources: {orphan_sources[:10]}"
    assert empty_chunks == 0, f"{empty_chunks} empty-text chunks"
    assert 0.90 <= ratio <= 1.35, f"word ratio {ratio:.3f} outside [0.90, 1.35]"
    assert not undersized, f"{len(undersized)} chunks below {words_min_floor} words: {undersized[:10]}"
    assert not oversized, f"{len(oversized)} chunks above {words_max_ceiling} words: {oversized[:10]}"
    print("GATE_PASS chunk_complete")
    PY
  on_failure:
    action: halt
    resume: repair chunking or purge, rerun this gate, present stats to user
- ordinal: 6
  description: Tag chunks with 5W1H dimensions, Dublin Core, PKO, FIBO/GOLEM/ESO ontology tags, and expertise level. Must
    run BEFORE embed so embeddings can be ontology-anchored. May require batched execution due to file size.
  id: tag_chunks
  action: execute
  mcp: corpus_tag_chunks
  input_mapping:
    chunks_jsonl: corpus/chunks/chunks.jsonl
    output: corpus/chunks/tagged_ontology.jsonl
    concurrency: 128
- ordinal: 7
  description: Verify every chunk has a structurally valid ontology tag record with exact entity_ref equality, valid dimensions,
    ontology_tags, and salience. Present tag coverage, dimension distribution, and quality stats to the user before proceeding
    to embedding.
  id: gate_tag_complete
  action: gate
  command: |
    python3 - <<'PY'
    import json
    from collections import Counter
    def load(path):
        records = []
        with open(path) as handle:
            for line_number, line in enumerate(handle, 1):
                try:
                    records.append(json.loads(line))
                except json.JSONDecodeError as e:
                    print(f"JSON error at {path} line {line_number}: {e}")
                    raise
        return records
    chunks = load("corpus/chunks/chunks.jsonl")
    tagged = load("corpus/chunks/tagged_ontology.jsonl")
    chunk_refs = [item["entity_ref"] for item in chunks]
    tag_refs = [item["entity_ref"] for item in tagged]
    duplicates = [k for k, c in Counter(tag_refs).items() if c != 1]
    missing = sorted(set(chunk_refs) - set(tag_refs))
    orphaned = sorted(set(tag_refs) - set(chunk_refs))
    allowed_dimensions = {"who", "what", "when", "where", "why", "how"}
    invalid = []
    dimension_counts = Counter()
    ontology_namespaces = Counter()
    salience_values = []
    for index, item in enumerate(tagged, 1):
        dimensions = item.get("dimensions")
        tags = item.get("ontology_tags", {})
        salience = item.get("salience")
        if (not item.get("text", "").strip() or
            not isinstance(dimensions, list) or not dimensions or
            not set(dimensions) <= allowed_dimensions or
            not isinstance(tags, dict) or not tags or
            not isinstance(salience, (int, float))):
            invalid.append(index)
        else:
            dimension_counts.update(dimensions)
            ontology_namespaces.update(tags.keys())
            salience_values.append(salience)
    stats = {
        "chunks": len(chunks),
        "tagged": len(tagged),
        "missing_refs": missing[:20],
        "orphaned_refs": orphaned[:20],
        "duplicate_refs": duplicates[:20],
        "invalid_records": invalid[:20],
        "dimension_distribution": dict(dimension_counts.most_common()),
        "ontology_namespaces": dict(ontology_namespaces.most_common()),
        "salience_min": min(salience_values) if salience_values else None,
        "salience_avg": round(sum(salience_values) / max(len(salience_values), 1), 3) if salience_values else None,
        "salience_max": max(salience_values) if salience_values else None,
    }
    print(json.dumps(stats, indent=2))
    assert len(tagged) == len(chunks), f"tagged {len(tagged)} != chunks {len(chunks)}"
    assert not missing, f"{len(missing)} missing refs: {missing[:10]}"
    assert not orphaned, f"{len(orphaned)} orphaned refs: {orphaned[:10]}"
    assert not duplicates, f"{len(duplicates)} duplicate refs: {duplicates[:10]}"
    assert not invalid, f"{len(invalid)} invalid records: {invalid[:10]}"
    print("GATE_PASS tag_complete")
    PY
  on_failure:
    action: halt
    resume: repair tagging, rerun this gate, present stats to user
- ordinal: 8
  description: Embed all chunks with Qwen3-Embedding-0.6B using ontology tag annotations as embedding instructions. Stores
    vectors in the encrypted memory DB.
  id: embed_chunks
  action: execute
  mcp: corpus_embed
  input_mapping:
    chunks_jsonl: corpus/chunks/chunks.jsonl
    tagged_jsonl: corpus/chunks/tagged_ontology.jsonl
    db_path: corpus/memory/john-brooks.db
    batch_size: 50
- ordinal: 9
  description: Verify DB vector entity_refs exactly match chunk entity_refs — no missing, stale, or duplicate vectors. Present
    embedding coverage stats to the user before proceeding to assertion extraction. Requires sqlcipher CLI.
  id: gate_embed_complete
  action: gate
  command: |
    command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required"; exit 2; }
    PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
    TMP_REFS=$(mktemp)
    trap 'rm -f "$TMP_REFS"' EXIT
    sqlcipher -batch corpus/memory/john-brooks.db \
      "PRAGMA key='$PASSPHRASE'; SELECT entity_ref FROM embeddings WHERE entity_ref LIKE 'corpus:researcher:%' ORDER BY entity_ref;" > "$TMP_REFS"
    python3 - "$TMP_REFS" <<'PY'
    import json, sys
    from collections import Counter
    with open("corpus/chunks/chunks.jsonl") as handle:
        expected = [json.loads(line)["entity_ref"] for line in handle]
    with open(sys.argv[1]) as handle:
        actual = [line.rstrip("\n") for line in handle if line.strip()]
    duplicate = [k for k, c in Counter(actual).items() if c != 1]
    missing = sorted(set(expected) - set(actual))
    stale = sorted(set(actual) - set(expected))
    stats = {
        "chunks": len(expected),
        "db_vectors": len(actual),
        "missing_vectors": missing[:20],
        "stale_vectors": stale[:20],
        "duplicate_vectors": duplicate[:20],
    }
    print(json.dumps(stats, indent=2))
    assert len(actual) == len(expected), f"vectors {len(actual)} != chunks {len(expected)}"
    assert not missing, f"{len(missing)} missing vectors: {missing[:10]}"
    assert not stale, f"{len(stale)} stale vectors: {stale[:10]}"
    assert not duplicate, f"{len(duplicate)} duplicate vectors: {duplicate[:10]}"
    print("GATE_PASS embed_complete")
    PY
  on_failure:
    action: halt
    resume: repair embeddings, rerun this gate, present stats to user
- ordinal: 10
  description: Extract assertions from each chunk with the canonical classifier model. Stores assertions as h_mems with entity=chunk_ref,
    attribute=predicate, value={subject, object}, and a dual-axis ontology blob (dc_type= dcterms:Assertion, dc_source=chunk_ref,
    5W1H dimension from predicate, optional ontology_tags for tagged namespaces). owner=john-brooks.
  id: extract_assertions
  action: execute
  mcp: corpus_extract_assertions
  input_mapping:
    chunks_jsonl: corpus/chunks/chunks.jsonl
    tagged_jsonl: corpus/chunks/tagged_ontology.jsonl
    db_path: corpus/memory/john-brooks.db
    owner: john-brooks
    max_assertions: 15
    concurrency: 64
- ordinal: 11
  description: 'Verify the DB contains a non-trivial, distributed knowledge graph with assertion coverage across at least
    80% of chunks. Verify the ontology column is populated and well-formed for every assertion h_mem: dc_type must be dcterms:Assertion,
    dimensions must be non-empty, dc_source must match the chunk entity_ref. Present assertion distribution, coverage, and
    ontology stats to the user before proceeding to dedup. Requires sqlcipher.'
  id: gate_assertions_complete
  action: gate
  command: |
    command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required"; exit 2; }
    PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
    DB="corpus/memory/john-brooks.db"
    KEY="PRAGMA key='$PASSPHRASE';"
    # Count + coverage + ontology column checks in one query pass.
    # json_extract returns NULL for null/malformed ontology — the right
    # signal for a broken write that would blind downstream json_extract
    # queries in build_prompts and consolidate.
    STATS=$(sqlcipher -batch "$DB" "$KEY
      SELECT
        COUNT(*)                                          AS total,
        COUNT(DISTINCT entity)                            AS distinct_entities,
        SUM(CASE WHEN ontology IS NULL THEN 1 ELSE 0 END) AS null_ontology,
        SUM(CASE WHEN json_extract(ontology,'$.dc_type') != 'dcterms:Assertion'
                 THEN 1 ELSE 0 END)                       AS wrong_dc_type,
        SUM(CASE WHEN json_extract(ontology,'$.dimensions') IS NULL
                      OR json_extract(ontology,'$.dimensions') = '[]'
                 THEN 1 ELSE 0 END)                       AS empty_dimensions,
        SUM(CASE WHEN json_extract(ontology,'$.dc_source') IS NULL
                      OR json_extract(ontology,'$.dc_source') = ''
                 THEN 1 ELSE 0 END)                       AS missing_dc_source
      FROM hmems WHERE entity LIKE 'corpus:researcher:%';")
    python3 - "$STATS" <<'PY'
    import json, sys
    with open("corpus/chunks/chunks.jsonl") as handle:
        chunks = sum(1 for _ in handle)
    parts = sys.argv[1].strip().split("|")
    total, entities, null_ont, wrong_dc, empty_dims, missing_src = \
        int(parts[0]), int(parts[1]), int(parts[2]), int(parts[3]), int(parts[4]), int(parts[5])
    coverage = entities / max(chunks, 1)
    avg_per_entity = total / max(entities, 1)
    stats = {
        "chunks": chunks,
        "stored_h_mems": total,
        "entities_with_triples": entities,
        "entity_coverage": round(coverage, 3),
        "avg_h_mems_per_entity": round(avg_per_entity, 1),
        "ontology_null": null_ont,
        "ontology_wrong_dc_type": wrong_dc,
        "ontology_empty_dimensions": empty_dims,
        "ontology_missing_dc_source": missing_src,
    }
    print(json.dumps(stats, indent=2))
    assert total >= chunks, f"only {total} h_mems for {chunks} chunks"
    assert coverage >= 0.80, f"coverage {coverage:.3f} below 0.80"
    assert null_ont == 0, f"{null_ont} assertion h_mems have null ontology column"
    assert wrong_dc == 0, f"{wrong_dc} assertion h_mems have dc_type != dcterms:Assertion"
    assert empty_dims == 0, f"{empty_dims} assertion h_mems have empty dimensions"
    assert missing_src == 0, f"{missing_src} assertion h_mems have missing dc_source"
    print("GATE_PASS triples_complete")
    PY
  on_failure:
    action: halt
    resume: repair assertion extraction or ontology anchoring, rerun this gate, present stats to user
- ordinal: 12
  description: Remove near-identical chunks using DB embeddings
  id: dedup_chunks
  action: execute
  mcp: corpus_dedup_chunks
  input_mapping:
    tagged_jsonl: corpus/chunks/tagged_ontology.jsonl
    output: corpus/chunks/deduped.jsonl
    db_path: corpus/memory/john-brooks.db
    prefix: 'corpus:researcher:'
    threshold: 0.85
- ordinal: 13
  description: Verify deduped.jsonl is a unique, valid subset of tagged chunks with no implausible mass deletion (>50%). Present
    dedup stats including reduction rate and removed count to the user before proceeding to consolidation.
  id: gate_dedup_complete
  action: gate
  command: |
    python3 - <<'PY'
    import json
    from collections import Counter
    def load(path):
        with open(path) as handle:
            return [json.loads(line) for line in handle]
    original = load("corpus/chunks/tagged_ontology.jsonl")
    deduped = load("corpus/chunks/deduped.jsonl")
    original_refs = {item["entity_ref"] for item in original}
    refs = [item["entity_ref"] for item in deduped]
    duplicates = [k for k, c in Counter(refs).items() if c != 1]
    orphaned = sorted(set(refs) - original_refs)
    reduction = 1 - len(deduped) / max(len(original), 1)
    invalid = [i for i, item in enumerate(deduped, 1) if not item.get("text", "").strip() or not item.get("source")]
    stats = {
        "original": len(original),
        "deduped": len(deduped),
        "removed": len(original) - len(deduped),
        "reduction_pct": round(reduction * 100, 1),
        "duplicates": duplicates[:20],
        "orphaned": orphaned[:20],
        "invalid_records": invalid[:20],
    }
    print(json.dumps(stats, indent=2))
    assert deduped, "deduped output is empty"
    assert len(deduped) <= len(original), "deduped exceeds original"
    assert reduction <= 0.50, f"{reduction:.1%} reduction exceeds 50% anomaly ceiling"
    assert not duplicates, f"{len(duplicates)} duplicate refs"
    assert not orphaned, f"{len(orphaned)} orphaned refs"
    assert not invalid, f"{len(invalid)} invalid records"
    print("GATE_PASS dedup_complete")
    PY
  on_failure:
    action: halt
    resume: repair dedup, rerun this gate, present stats to user
- ordinal: 14
  description: Cluster related chunks within source, LLM-synthesize multi-chunk clusters, re-embed
  id: consolidate_chunks
  action: execute
  mcp: corpus_consolidate_chunks
  input_mapping:
    tagged_jsonl: corpus/chunks/deduped.jsonl
    output: corpus/chunks/consolidated.jsonl
    db_path: corpus/memory/john-brooks.db
    prefix: 'corpus:researcher:'
    threshold: 0.75
    concurrency: 12
    max_chunks_per_cluster: 5
- ordinal: 15
  description: Verify consolidated.jsonl has unique identifiers, lossless lineage coverage of every deduped chunk, and no
    malformed records. Present consolidation stats including cluster counts and reduction rate to the user before proceeding
    to prompt building.
  id: gate_consolidate_complete
  action: gate
  command: |
    python3 - <<'PY'
    import json
    from collections import Counter
    def load(path):
        with open(path) as handle:
            return [json.loads(line) for line in handle]
    inputs = load("corpus/chunks/deduped.jsonl")
    outputs = load("corpus/chunks/consolidated.jsonl")
    input_refs = {item["entity_ref"] for item in inputs}
    output_refs = [item["entity_ref"] for item in outputs]
    covered = set()
    multi_chunk = 0
    invalid = []
    for index, item in enumerate(outputs, 1):
        if not item.get("text", "").strip() or not item.get("source"):
            invalid.append(index)
        lineage = item.get("consolidated_from") or [item["entity_ref"]]
        covered.update(lineage)
        if len(lineage) > 1:
            multi_chunk += 1
    duplicates = [k for k, c in Counter(output_refs).items() if c != 1]
    missing = sorted(input_refs - covered)
    orphaned = sorted(covered - input_refs)
    reduction = 1 - len(outputs) / max(len(inputs), 1)
    stats = {
        "deduped_input": len(inputs),
        "consolidated_output": len(outputs),
        "multi_chunk_clusters": multi_chunk,
        "singletons": len(outputs) - multi_chunk,
        "reduction_pct": round(reduction * 100, 1),
        "missing_lineage": missing[:20],
        "orphan_lineage": orphaned[:20],
        "duplicate_output_refs": duplicates[:20],
        "invalid_records": invalid[:20],
    }
    print(json.dumps(stats, indent=2))
    assert outputs, "consolidated output is empty"
    assert len(outputs) <= len(inputs), "output exceeds input"
    assert not missing, f"{len(missing)} missing lineage refs"
    assert not orphaned, f"{len(orphaned)} orphan lineage refs"
    assert not duplicates, f"{len(duplicates)} duplicate output refs"
    assert not invalid, f"{len(invalid)} invalid records"
    print("GATE_PASS consolidate_complete")
    PY
  on_failure:
    action: halt
    resume: repair consolidation, rerun this gate, present stats to user
