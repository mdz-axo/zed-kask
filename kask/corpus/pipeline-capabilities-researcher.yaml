- ordinal: 23
  description: 'Final pre-spend gate: verify train/test split counts, ChatML role order, non-empty content, no duplicates
    or train/test overlap, and no oversized examples. Present dataset stats to the user for approval before authorizing training
    spend.'
  id: gate_chatml_complete
  action: gate
  command: |
    python3 - <<'PY'
    import json
    from collections import Counter
    from pathlib import Path
    paths = [Path("corpus/qa_pairs/train_chat.jsonl"), Path("corpus/qa_pairs/train_chat.jsonl.test.jsonl")]
    datasets = []
    for path in paths:
        records = []
        with path.open() as handle:
            for line_number, line in enumerate(handle, 1):
                item = json.loads(line)
                messages = item.get("messages")
                assert isinstance(messages, list) and [m.get("role") for m in messages] == ["system", "user", "assistant"], f"{path}:{line_number}: bad roles"
                assert all(isinstance(m.get("content"), str) and m["content"].strip() for m in messages), f"{path}:{line_number}: empty content"
                total_chars = sum(len(m["content"]) for m in messages)
                records.append({"chars": total_chars, "user": messages[1]["content"].strip().casefold()})
        datasets.append(records)
    train, test = datasets
    duplicate_train = [k for k, c in Counter(r["user"] for r in train).items() if c != 1]
    overlap = sorted(set(r["user"] for r in train) & set(r["user"] for r in test))
    total = len(train) + len(test)
    ratio = len(train) / max(total, 1)
    char_sizes = [r["chars"] for r in train] + [r["chars"] for r in test]
    oversized = [i for i, r in enumerate(train + test, 1) if r["chars"] > 16_000]
    stats = {
        "train": len(train),
        "test": len(test),
        "train_ratio": round(ratio, 4),
        "duplicate_train_users": duplicate_train[:20],
        "train_test_overlap": overlap[:20],
        "chars_min": min(char_sizes) if char_sizes else 0,
        "chars_avg": round(sum(char_sizes) / max(len(char_sizes), 1)),
        "chars_max": max(char_sizes) if char_sizes else 0,
        "oversized_examples": len(oversized),
    }
    print(json.dumps(stats, indent=2))
    assert len(train) >= 100, f"only {len(train)} train examples"
    assert test, "no test examples"
    assert abs(ratio - 0.80) <= (1 / max(total, 1)), f"split ratio {ratio:.4f} != 0.80"
    assert not duplicate_train, f"{len(duplicate_train)} duplicate train users"
    assert not overlap, f"{len(overlap)} train/test overlap"
    assert not oversized, f"{len(oversized)} examples >16K chars"
    print("GATE_PASS chatml_complete")
    PY
  on_failure:
    action: halt
    resume: repair ChatML assembly, rerun this gate, present stats to user
