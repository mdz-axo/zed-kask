[workspace]
resolver = "2"
members = [
    # Core crates
    "crates/hkask-services-core",
    "crates/hkask-services-self-heal",
    "crates/hkask-goal",
    "crates/hkask-services-inference",

    # Ontology bridge crates (v0.31.0)
    "crates/hkask-bridge-dublincore",

    "crates/hkask-services-kata-kanban",
    "crates/hkask-services-runtime",
    "crates/hkask-services-corpus",
    "crates/hkask-services-context",
    "crates/hkask-services-compose",
    "crates/hkask-condenser",
    "crates/hkask-types",
    "crates/kask_bridge",
    "crates/hkask-forecast",
    "crates/hkask-capability",
    "crates/hkask-inference",
    "crates/hkask-guard",

    "crates/hkask-storage",
    "crates/hkask-memory",
    "crates/hkask-regulation",
    "crates/hkask-templates",
    "crates/hkask-pods",
    "crates/hkask-keystore",
    "crates/hkask-ledger",

    "crates/hkask-mcp-server",
    "crates/hkask-mcp",

    "crates/hkask-test-harness",
    # MCP servers
    "mcp-servers/hkask-mcp-condenser",
    "mcp-servers/hkask-mcp-research",
    "mcp-servers/hkask-mcp-companies",
    "mcp-servers/hkask-mcp-media",
    "mcp-servers/hkask-mcp-corpus",
    "mcp-servers/hkask-mcp-training",
    "mcp-servers/hkask-mcp-kata-kanban",
    "mcp-servers/hkask-mcp-curator",
    "mcp-servers/hkask-mcp-codegraph",
    "mcp-servers/hkask-mcp-scenarios",
]

exclude = ["fuzz"]

[workspace.package]
version = "0.31.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mdz-axo/hKask"

[workspace.dependencies]
# ── Dependencies that differ from or are not in the root workspace ──────────
# All shared deps are inherited from the root Cargo.toml [workspace.dependencies].
# Only kask-specific deps that the root doesn't define, or that need different
# features, live here.

# Async runtime — kask needs "full" (rt-multi-thread for #[tokio::main],
# sync, time, etc.) while zed's root workspace has bare tokio = "1".
tokio = { version = "1", features = ["full"] }

# Storage — aligned to zed's rusqlite 0.32 to avoid libsqlite3-sys links conflict.
# zed's sqlez pulls libsqlite3-sys 0.30.1 via rusqlite 0.32; kask must match.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "blob", "backup"] }
r2d2_sqlite = "0.25"

# MCP protocol (not in root workspace)
rmcp = "1"

# Templating (root uses minijinja but with different feature set)
minijinja = { version = "2", features = ["loader", "serde", "json", "internal_safe_search"] }

# Serialization — kask-specific YAML variant
serde_yaml_neo = "0.11"

# CLI (not in root workspace with these features)
clap = { version = "4", features = ["derive", "env"] }

# Utilities not in root workspace or with different features
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon", "text"] }

# Keychain / Secrets (not in root workspace)
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

# TUI (not in root workspace)
ratatui = "0.28"
crossterm = "0.28"

# Matrix protocol (not in root workspace)
matrix-sdk = { version = "0.16", default-features = false, features = ["rustls-tls"] }

# SQL (not in root workspace)
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }

# LLM guard (not in root workspace)
llm-guard = "0.2"

# ── Dependencies inherited from root workspace ──────────────────────────────
# These are defined in the root Cargo.toml [workspace.dependencies] and
# kask crates reference them via { workspace = true }. They are listed here
# only for documentation — do not re-declare them.
#
# reqwest, r2d2, blake3, aes-gcm, argon2, sha2, hmac, ed25519-dalek,
# zeroize, hex, subtle, serde, serde_json, schemars, thiserror, anyhow,
# tracing, tracing-subscriber, uuid, rand, walkdir, tempfile, async-trait,
# regex, futures-util, async-stream, url, dotenvy, tree-sitter, tree-sitter-rust,
# tokio-util, axum, utoipa, utoipa-axum

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("hedera"))', 'cfg(kani)'] }
