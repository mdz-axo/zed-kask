[package]
name = "hkask-mcp-scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scenario planning MCP server — MAIA event-tree forecasting with Fermi decomposition and Bayesian calibration"

[lib]
name = "hkask_mcp_scenarios"
path = "src/hkask_mcp_scenarios.rs"

[[bin]]
name = "hkask-mcp-scenarios"
path = "src/main.rs"

[dependencies]
hkask-mcp-server.workspace = true
hkask-bridge-ontology.workspace = true
hkask-types.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
hkask-forecast.workspace = true
hkask-mcp-prediction-markets.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
