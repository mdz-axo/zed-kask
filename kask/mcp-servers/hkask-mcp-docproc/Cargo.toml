[package]
name = "hkask-mcp-docproc"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "Unified document processing MCP server: format conversion, OCR, chunking, parsing, and QA generation"
publish = false

[lib]
name = "hkask_mcp_docproc"
path = "src/lib.rs"

[[bin]]
name = "hkask-mcp-docproc"
path = "src/main.rs"

[dependencies]
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
hkask-types = { path = "../../crates/hkask-types" }
hkask-memory = { path = "../../crates/hkask-memory" }
hkask-guard = { path = "../../crates/hkask-guard" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }
tempfile = { workspace = true }
dirs = "6"
regex = { workspace = true }
minijinja = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
docx-rs = "0.4"
calamine = "0.36"
pptx-to-md = "0.1"

[dev-dependencies]
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
