[package]
name = "hkask-mcp-codegraph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Code understanding MCP server — semantic code graph with tree-sitter indexing"

[dependencies]
hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-inference.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }

rusqlite = { workspace = true, features = ["bundled"] }

# Ontology vocabulary bridge — concept URIs for the reg.tool span ontology tag.
hkask-bridge-ontology.workspace = true

# Codegraph engine dependencies
sqlite-vec.workspace = true
thiserror = { workspace = true }
blake3 = { workspace = true }
walkdir = { workspace = true }
uuid = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }

[lib]
name = "hkask_mcp_codegraph"
path = "src/hkask_mcp_codegraph.rs"

[[bin]]
name = "hkask-mcp-codegraph"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true
hkask-test-harness.workspace = true
