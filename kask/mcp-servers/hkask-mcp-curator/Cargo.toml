[package]
name = "hkask-mcp-curator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curator MCP server — system observability, escalation management, and regulatory memory access"

[dependencies]
hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-storage = { path = "../../crates/hkask-storage" }
hkask-memory.workspace = true
hkask-services-core = { path = "../../crates/hkask-services-core" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
chrono.workspace = true

[lib]
name = "hkask_mcp_curator"
path = "src/hkask_mcp_curator.rs"

[[bin]]
name = "hkask-mcp-curator"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
uuid.workspace = true
