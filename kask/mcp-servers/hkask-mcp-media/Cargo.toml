[package]
name = "hkask-mcp-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Media generation MCP server (image, video, audio, 3D via fal.ai and other providers)"

[features]
default = []

[dependencies]
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
hkask-types = { path = "../../crates/hkask-types" }
hkask-inference = { path = "../../crates/hkask-inference" }

hkask-templates = { path = "../../crates/hkask-templates" }
hkask-storage = { path = "../../crates/hkask-storage" }

rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
minijinja = "2"
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_neo.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true

walkdir.workspace = true
sha2.workspace = true
base64.workspace = true
image.workspace = true
imageproc.workspace = true
ab_glyph = "0.2"
uuid.workspace = true
nom-exif = "3"

[lib]
name = "hkask_mcp_media"
path = "src/hkask_mcp_media.rs"

[[bin]]
name = "hkask-mcp-media"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true

tokio = { workspace = true, features = ["macros", "rt"] }
