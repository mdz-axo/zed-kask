[package]
name = "hkask-mcp-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Media generation MCP server (image, video, audio, 3D via AtlasCloud and DeepInfra)"

[features]
default = []

[dependencies]
hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-inference = { path = "../../crates/hkask-inference" }
hkask-bridge-ontology = { path = "../../crates/hkask-bridge-ontology" }

hkask-templates.workspace = true
hkask-storage = { path = "../../crates/hkask-storage" }

rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
minijinja.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_neo.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true

walkdir.workspace = true
sha2.workspace = true
base64.workspace = true
image.workspace = true
ab_glyph.workspace = true
uuid.workspace = true
nom-exif.workspace = true

[lib]
name = "hkask_mcp_media"
path = "src/hkask_mcp_media.rs"

[[bin]]
name = "hkask-mcp-media"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

tokio = { workspace = true, features = ["macros", "rt"] }
