[package]
name = "hkask-mcp-swarm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent swarm MCP server — Agent Bestiary World catalogue, workspaces, and Xaman Ek curator"

[lib]
name = "hkask_mcp_swarm"
path = "src/hkask_mcp_swarm.rs"

[[bin]]
name = "hkask-mcp-swarm"
path = "src/main.rs"

[dependencies]
hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-ledger.workspace = true
hkask-inference = { path = "../../crates/hkask-inference" }
hkask-guard.workspace = true
hkask-storage = { path = "../../crates/hkask-storage" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
dirs = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
proptest = { workspace = true }
