[package]
name = "hkask-mcp-companies"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Company financial data MCP server — FMP + EODHD dual-provider integration for global fundamental analysis"

[lib]
name = "hkask_mcp_companies"
path = "src/hkask_mcp_companies.rs"

[[bin]]
name = "hkask-mcp-companies"
path = "src/main.rs"

[dependencies]
hkask-mcp-server.workspace = true
hkask-mcp-portfolio.workspace = true
hkask-types.workspace = true
hkask-bridge-ontology = { path = "../../crates/hkask-bridge-ontology" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true

	rusqlite.workspace = true
	uuid.workspace = true
	rand.workspace = true
base64.workspace = true
regex.workspace = true
dirs.workspace = true
hkask-forecast.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true
hkask-test-harness.workspace = true
