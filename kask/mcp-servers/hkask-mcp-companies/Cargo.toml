[package]
name = "hkask-mcp-companies"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "Company financial data MCP server — FMP + EODHD dual-provider integration for global fundamental analysis"
publish = false

[lib]
name = "hkask_mcp_companies"
path = "src/lib.rs"

[[bin]]
name = "hkask-mcp-companies"
path = "src/main.rs"

[dependencies]
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
hkask-types = { path = "../../crates/hkask-types" }
hkask-ledger = { path = "../../crates/hkask-ledger" }
hkask-forecast = { path = "../../crates/hkask-forecast" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
dirs = "6"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
