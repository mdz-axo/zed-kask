[package]
name = "hkask-mcp-nostr-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nostr client MCP server — reports the Nostr identity configured in settings. It receives no credential, holds no key and cannot sign: it depends on hkask-nostr-core (public operations) and never on hkask-nostr-signer"

[lib]
name = "hkask_mcp_nostr_client"
path = "src/hkask_mcp_nostr_client.rs"

[[bin]]
name = "hkask-mcp-nostr-client"
path = "src/main.rs"

[features]
# The local test relays in `src/test_support.rs`. Never enabled by the
# installer: a build with this feature can be pointed at loopback relays.
test-fixture = ["dep:nostr-sdk", "nostr-sdk/local-relay", "tokio/net"]

[dependencies]
hkask-bridge-ontology.workspace = true
hkask-mcp-server.workspace = true
# Public Nostr operations only. This server parses untrusted relay text, so it
# must never depend on hkask-nostr-signer; `pin hkask-mcp-nostr-client
# hkask-nostr-signer` (plan, "Tested commands") checks that.
hkask-nostr-core.workspace = true
hkask-types.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
# The relay client and, under `test-fixture`, the test relay. The same exact
# pin and TLS provider the relay server uses (operator ruling 2026-11-12).
# Optional until the first tool that contacts a relay lands: today only the
# test relays use it.
nostr-sdk = { workspace = true, optional = true, features = ["aws_lc_rs", "rustls-tls-webpki-roots"] }

[build-dependencies]
regex.workspace = true

[dev-dependencies]
# Tests build identifiers at run time from a throwaway key (an `nsec`-shaped
# value in the `npub` field, for one), so no key is written into a test file.
bech32.workspace = true
hkask-mcp-test-support.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
