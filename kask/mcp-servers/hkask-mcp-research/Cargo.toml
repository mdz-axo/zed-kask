[package]
name = "hkask-mcp-research"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "Web search, extraction, and feed-based research MCP server"
publish = false

[lib]
name = "hkask_mcp_research"
path = "src/lib.rs"

[[bin]]
name = "hkask-mcp-research"
path = "src/main.rs"

[dependencies]
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
hkask-types = { path = "../../crates/hkask-types" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
feed-rs = "2.4"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
