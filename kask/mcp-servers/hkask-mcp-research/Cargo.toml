[package]
name = "hkask-mcp-research"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web search, extraction, evidence scoring, and research-run ledger MCP server"

[lib]
name = "hkask_mcp_research"
path = "src/hkask_mcp_research.rs"

[[bin]]
name = "hkask-mcp-research"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]

hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-inference.workspace = true
hkask-storage.workspace = true
# Ontology vocabulary bridge — fixture-guarded concept URIs (the
# `pko:StepVerification` / `dcterms:references` result keys route through
# its constants, never string literals).
hkask-bridge-ontology.workspace = true

rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
r2d2.workspace = true


chrono.workspace = true
schemars.workspace = true
thiserror.workspace = true
async-trait.workspace = true
blake3.workspace = true
futures-util.workspace = true
regex.workspace = true
pdf-extract.workspace = true
# HTML parsing for the keyless extractor's page text (research/page_text.rs).
html5ever.workspace = true

[dev-dependencies]
# tool_behavior.rs drives the real tool surface through Parameters<T>:
# web_ping happy path, web_* invalid-argument and credential-missing error
# paths, and the research-run ledger on an in-memory database.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Unit tests exercise the shared NoopInferencePort seam; enable the
# test-fixture gate on the server crate for this crate's test builds.
hkask-mcp-test-support.workspace = true

[build-dependencies]
regex.workspace = true
