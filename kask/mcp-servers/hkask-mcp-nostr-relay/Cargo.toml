[package]
name = "hkask-mcp-nostr-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nostr relay MCP server — a loopback relay over an LMDB event store that archives events by operator-allowlisted authors, with its own accept layer (refuses web-page origins), one admission rule for the websocket and sync paths, and tools to read status, query the archive, sync from public relays, and read the admission log"

[lib]
name = "hkask_mcp_nostr_relay"
path = "src/hkask_mcp_nostr_relay.rs"

[[bin]]
name = "hkask-mcp-nostr-relay"
path = "src/main.rs"

[dependencies]
hkask-bridge-ontology.workspace = true
hkask-mcp-server.workspace = true
hkask-types.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
url.workspace = true
# The relay engine and its store. Exact pins (root manifest): the SDK states
# its API is unstable and 0.45.6 is the only un-yanked 0.45 release. The SDK's
# default TLS provider (ring) is replaced by aws-lc-rs, the provider the rest
# of the workspace installs.
nostr-sdk = { workspace = true, features = ["local-relay", "aws_lc_rs", "rustls-tls-webpki-roots"] }
nostr-lmdb.workspace = true
rustls.workspace = true
# The accept layer: an HTTP/1 listener in front of the relay engine, so a
# request can be refused before it becomes a websocket.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
sha1.workspace = true

[build-dependencies]
regex.workspace = true

[dev-dependencies]
hkask-mcp-test-support.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tempfile.workspace = true

[lints]
workspace = true
