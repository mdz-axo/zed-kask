[package]
name = "hkask-mcp-replica"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "Style replica MCP server — embed author corpora, compose prose, list styles"
publish = false

[lib]
name = "hkask_mcp_replica"
path = "src/lib.rs"

[[bin]]
name = "hkask-mcp-replica"
path = "src/main.rs"

[dependencies]
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
hkask-types = { path = "../../crates/hkask-types" }
hkask-keystore = { path = "../../crates/hkask-keystore" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde_yaml_neo = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
