[package]
name = "hkask-mcp-experimentation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimentation MCP server — the experiment registry for the sharded experimentation program (repair plan §P8): registered experiments with pre-registered Brier-scored predictions, variant lineages with roles, sealed eval contracts, fitness records (caller-asserted report references), and selection fossils across the five artifact layers"

[lib]
name = "hkask_mcp_experimentation"
path = "src/hkask_mcp_experimentation.rs"

[[bin]]
name = "hkask-mcp-experimentation"
path = "src/main.rs"

[dependencies]
hkask-bridge-ontology.workspace = true
hkask-mcp-server.workspace = true
hkask-storage.workspace = true
hkask-types.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
regex.workspace = true

[dev-dependencies]
# The tool-behavior contract suite (tests/tool_behavior.rs) drives the eight
# tools through their Parameters seams — #[tokio::test] needs rt + macros.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The concurrent-selection race test needs a multi-connection file-backed pool
# (the in-memory helper is max_size(1) — it serializes at the pool and
# cannot reproduce the race).
tempfile.workspace = true

[lints]
workspace = true
