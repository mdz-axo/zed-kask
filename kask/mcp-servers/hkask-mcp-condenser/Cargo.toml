[package]
name = "hkask-mcp-condenser"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "Context condensation MCP server — thin wrapper around hkask-condenser domain crate"
publish = false

[lib]
name = "hkask_mcp_condenser"
path = "src/lib.rs"

[[bin]]
name = "hkask-mcp-condenser"
path = "src/main.rs"

[dependencies]
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
hkask-types = { path = "../../crates/hkask-types" }
hkask-memory = { path = "../../crates/hkask-memory" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
