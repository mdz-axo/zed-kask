[package]
name = "hkask-mcp-condenser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Context condensation MCP server — thin wrapper around hkask-condenser domain crate"

[dependencies]
hkask-condenser.workspace = true
hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-memory.workspace = true
hkask-storage.workspace = true
hkask-inference.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
anyhow.workspace = true



[lib]
name = "hkask_mcp_condenser"
path = "src/hkask_mcp_condenser.rs"

[[bin]]
name = "hkask-mcp-condenser"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
hkask-test-harness.workspace = true
