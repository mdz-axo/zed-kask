[package]
name = "hkask-mcp-portfolio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portfolio MCP server — general-purpose transaction-ledger portfolio store (stocks, prediction-event portfolios, CMP indices) with materialized daily holdings and returns views"

[lib]
name = "hkask_mcp_portfolio"
path = "src/hkask_mcp_portfolio.rs"

[[bin]]
name = "hkask-mcp-portfolio"
path = "src/main.rs"

[dependencies]
hkask-mcp-server.workspace = true
hkask-spreadsheet.workspace = true
hkask-types.workspace = true
hkask-bridge-ontology.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
chrono.workspace = true
rusqlite.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest = { workspace = true }
# Test-only edge (cargo permits dev-dependency cycles): the schema-recovery
# tests seed the mixed shared-DB scenario from companies' real DDL so the
# fixture cannot drift from the schema companies actually creates.
hkask-mcp-companies.workspace = true

[lints]
workspace = true

