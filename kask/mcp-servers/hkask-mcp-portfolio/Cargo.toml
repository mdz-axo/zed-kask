[package]
name = "hkask-mcp-portfolio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portfolio MCP server — general-purpose transaction-ledger portfolio store (stocks, prediction-event portfolios, CMP indices) with materialized daily holdings and returns views"

[lib]
name = "hkask_mcp_portfolio"
path = "src/hkask_mcp_portfolio.rs"

[[bin]]
name = "hkask-mcp-portfolio"
path = "src/main.rs"

[dependencies]
hkask-mcp-server.workspace = true
hkask-types.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
chrono.workspace = true
rusqlite.workspace = true
uuid.workspace = true
dirs.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true
hkask-test-harness.workspace = true
