[package]
name = "hkask-mcp-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified corpus MCP server — gather, process, and output: document conversion, OCR, chunking, tagging, embedding, QA generation, training data, style replicas, and prose composition"

[dependencies]
# Shared infrastructure
hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-verification.workspace = true

# Ontology bridges — vocabulary constants for metadata, provenance, and domain predicates
hkask-bridge-ontology.workspace = true

# OCR pipeline (from markitdown)
hkask-inference.workspace = true


image.workspace = true

base64.workspace = true
reqwest.workspace = true

# Office format backends (S2: backend/pipeline separation)
# docx-rs: DOCX reader (paragraphs, tables, lists, headings)
docx-rs.workspace = true
# calamine: XLSX/XLS/ODS reader (pure Rust, MIT)
calamine.workspace = true
# pptx-to-md: PPTX/ODP reader (extracts slide text to markdown)
pptx-to-md.workspace = true

# Knowledge pipeline (from doc-knowledge)
hkask-memory.workspace = true
hkask-storage.workspace = true

# Persona/style services (folded in from hkask-services-{compose,corpus,inference,runtime})
hkask-keystore.workspace = true
hkask-ledger.workspace = true

# Protocol + utilities

rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "process"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true

thiserror.workspace = true
async-trait.workspace = true

tempfile.workspace = true
regex.workspace = true
minijinja.workspace = true

serde_yaml_neo.workspace = true

# Folded-service dependencies
uuid.workspace = true
chrono.workspace = true
pdf-extract.workspace = true
anyhow.workspace = true

# Service layer (shared settings, models, paths)
hkask-services-core.workspace = true

[lib]
name = "hkask_mcp_corpus"
path = "src/hkask_mcp_corpus.rs"

[[bin]]
name = "hkask-mcp-corpus"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
rand.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true
tempfile.workspace = true
hkask-test-harness.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
