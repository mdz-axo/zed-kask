[package]
name = "hkask-mcp-cloud-gateway"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "mTLS + DelegationToken transport adapter for remote MCP access to hKask"
publish = false

[dependencies]
hkask-types = { path = "../../crates/hkask-types" }
hkask-capability = { path = "../../crates/hkask-capability" }
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror.workspace = true
x509-parser = "0.17"

[lib]
name = "hkask_mcp_cloud_gateway"
path = "src/lib.rs"

[[bin]]
name = "hkask-cloud-gateway"
path = "src/main.rs"
