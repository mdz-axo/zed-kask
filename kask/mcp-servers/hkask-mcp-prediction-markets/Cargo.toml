[package]
name = "hkask-mcp-prediction-markets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prediction-markets data-service MCP server — annotated Polymarket/Kalshi market-implied probabilities with reliability, calibration, volatility, and dual-axis (PKO/Dublin Core) ontology mapping for forecasting consumers"

[lib]
name = "hkask_mcp_prediction_markets"
path = "src/hkask_mcp_prediction_markets.rs"

[[bin]]
name = "hkask-mcp-prediction-markets"
path = "src/main.rs"

[[bin]]
name = "semantic_map_catalogs"
path = "src/bin/semantic_map_catalogs.rs"

[[bin]]
name = "fetch_contracts"
path = "src/bin/fetch_contracts.rs"

[dependencies]
hkask-mcp-server.workspace = true
hkask-mcp-portfolio.workspace = true
hkask-types.workspace = true
hkask-forecast.workspace = true
hkask-inference.workspace = true
hkask-bridge-ontology.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid.workspace = true
reqwest.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-tungstenite = { workspace = true, features = ["tokio", "tokio-rustls-manual-roots", "tokio-runtime"] }
futures.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
