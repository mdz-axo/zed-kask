[package]
name = "hkask-mcp-regulation"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "Regulation span history query MCP server — runtime telemetry for security skills"
publish = false

[lib]
name = "hkask_mcp_regulation"
path = "src/lib.rs"

[[bin]]
name = "hkask-mcp-regulation"
path = "src/main.rs"

[dependencies]
hkask-mcp-server = { path = "../../crates/hkask-mcp-server" }
hkask-types = { path = "../../crates/hkask-types" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
