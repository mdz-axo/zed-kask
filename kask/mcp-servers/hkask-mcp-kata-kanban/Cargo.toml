[package]
name = "hkask-mcp-kata-kanban"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kata-Kanban workflow coordination MCP server"

[dependencies]
hkask-mcp-server.workspace = true
hkask-types.workspace = true
hkask-storage.workspace = true
# Folded from hkask-services-kata-kanban
hkask-services-core.workspace = true
hkask-regulation.workspace = true
hkask-templates.workspace = true
hkask-inference.workspace = true
# Local swarm delegation — kanban_task_spawn delegates to local agents via the
# shared local-swarm runtime (ledger + inference + guard + agent executor).
hkask-mcp-swarm.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }

tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_neo.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
minijinja.workspace = true
schemars.workspace = true

[lib]
name = "hkask_mcp_kata_kanban"
path = "src/hkask_mcp_kata_kanban.rs"

[[bin]]
name = "hkask-mcp-kata-kanban"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json.workspace = true
proptest.workspace = true
hkask-test-harness.workspace = true
