id: RR-0013
title: "ToolTaint not used in MCP tool registration"
surface: mcp
cwe: CWE-284
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0008
nist_ssdf: PW.4.1
discovered_in: crates/hkask-ports/src/tool.rs
discovered_by: kali-audit
discovered_at: 2026-07-17
severity: medium
detection:
  kind: grep
  # PRESENCE check: ToolInfo must carry a taint field. hkask-ports was
  # merged away; ToolInfo now lives in hkask-tool-port/src/tool_port.rs
  # (taint field at ~L92) and ToolTaint in hkask-types/src/tool_taint.rs.
  semantics: presence
  pattern: 'ToolTaint|tool_taint'
  include: "crates/hkask-tool-port/src/tool_port.rs"
mitigation: "Add a taint: ToolTaint field to ToolInfo so every MCP tool is labeled Source/Sink/Pure/Endorser."
source: "https://arxiv.org/pdf/2505.23643 — Microsoft Research FIDES"
ci_gate: scripts/check-kali-regressions.sh
status: obsolete
note: "FIDES taint machinery deleted 2026-08-12. The gate was structurally present but operationally inert: `has_untrusted_input` was always false (the read path looked for legacy `__taint__` markers the write path stopped emitting) and every MCP tool was hardcoded `ToolTaint::Pure`, so the Source->Sink block could never fire. Operator decision was to simplify rather than repair: `ToolTaint`, `DefaultPolicy`, `PolicyVerdict`, `runtime_policy` wiring, `taint_of_key`, `StepResult.taint` and `check_untrusted_input` are all removed. Superseded by RR-0064, which forbids re-adding an inert gate. Do not resurrect this entry."
