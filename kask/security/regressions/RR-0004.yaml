id: RR-0004
title: "Library crates missing #![forbid(unsafe_code)] attribute"
surface: code
cwe: CWE-732
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0008
nist_ssdf: PW.6.1
discovered_in: crates/hkask-guard/src/lib.rs, crates/hkask-types/src/lib.rs, crates/hkask-ports/src/lib.rs, crates/hkask-templates/src/lib.rs
discovered_by: kali-audit
discovered_at: 2026-07-17
severity: high
detection:
  kind: grep
  # PRESENCE check: the attribute must appear in the security-critical crate
  # roots (kask convention: named root files, not lib.rs; hkask-ports was
  # merged into hkask-types/hkask-capability). Full 38-crate coverage is
  # enforced mechanically by scripts/check-unsafe-forbid.sh (CI job
  # unsafe-forbid); this entry pins the three most security-critical roots
  # inside the regression library itself.
  semantics: presence
  pattern: '#!\[forbid\(unsafe_code\)\]'
  include: "crates/hkask-types/src/hkask_types.rs crates/hkask-templates/src/hkask_templates.rs"
mitigation: "Add #![forbid(unsafe_code)] as the first line of src/lib.rs in all hkask-* library crates that do not use unsafe blocks."
source: "https://anssi-fr.github.io/rust-guide/ — ANSSI Secure Rust Guidelines"
ci_gate: scripts/check-kali-regressions.sh
status: enforced
note: "hkask-guard crate deleted 2026-08-10; removed from the include list. The other two crates remain in scope."
