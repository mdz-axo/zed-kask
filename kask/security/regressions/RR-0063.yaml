id: RR-0063
title: "Ed25519 signing-key material must not transit unzeroized String/Vec buffers"
surface: code
cwe: CWE-226
owasp_llm_2025: LLM02
atlas_tactic: AML.TA0010
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-keystore/src/signing.rs:92-93, :103-108, :34-35; kask/crates/hkask-keystore/src/keychain.rs:84, :133
discovered_by: kali-audit
discovered_at: 2026-08-12
severity: medium
detection:
  kind: grep
  # The VULNERABLE idiom: hex-encoding a secret key into a plain String. The fix
  # wraps it (Zeroizing::new(hex::encode(...))), which this pattern no longer
  # matches.
  pattern: 'hex::encode\(signing_key\.to_bytes\(\)\)'
  include: "crates/hkask-keystore/src/signing.rs"
mitigation: |
  The publisher signing key (used for kask skill marketplace manifest signing)
  passes through four unzeroized buffers:

    kask/crates/hkask-keystore/src/signing.rs:92-93
      let key_hex = hex::encode(signing_key.to_bytes());   // raw 32-byte secret
      keychain.store_by_key(&format!("signing-keys/{publisher}"), &key_hex)

    kask/crates/hkask-keystore/src/signing.rs:103-108   (load path, 3 copies)
      let bytes = hex::decode(&key_hex).ok()?;   // Vec<u8>, unzeroized
      let mut arr = [0u8; 32];                   // stack array, not zeroized
      arr.copy_from_slice(&bytes);
      Some(SigningKey::from_bytes(&arr))

    kask/crates/hkask-keystore/src/signing.rs:34-35
      let mut secret_bytes = [0u8; 32];          // not Zeroizing, not zeroized
      rand::rng().fill_bytes(&mut secret_bytes);

  `SigningKey` itself IS covered — ed25519-dalek is built with the `zeroize`
  feature (Cargo.toml:25) and implements ZeroizeOnDrop, so the doc claim at
  signing.rs:28-31 is accurate. The buffers that FEED it are not, which is the
  gap: the raw private scalar is left in heap/stack memory freed without wiping.

  Same class, lower impact:
    - Keychain::retrieve / retrieve_by_key (keychain.rs:84, :133) return bare
      String while the sibling resolve() correctly returns Zeroizing<Vec<u8>>
      (:208). Two accessor families with different hygiene invites callers onto
      the unprotected one.
    - aes-gcm resolves WITHOUT its `zeroize` feature (verified with
      `cargo tree -p hkask-keystore -i aes-gcm -e features`), so the GHASH subkey
      in the long-lived EncryptionService (encryption.rs:45-47) is not wiped on
      drop. Defense-in-depth only — the Argon2-derived key that produced it IS
      zeroized (encryption.rs:117-136).
    - keychain.rs:184 `bytes.to_vec()` escapes Zeroizing; on the UTF-8 error path
      the resulting FromUtf8Error owns the passphrase bytes and drops unwiped.
      (No log leak — FromUtf8Error's Display omits contents.)

  Missing failure signal (.rules): load_signing_key (signing.rs:101-112) collapses
  keychain-unavailable, corrupt-hex, and wrong-length into an unlogged `None`,
  indistinguishable from "no key configured". Add a log::warn! classifying each
  failure branch.

  Fix: wrap key_hex and the intermediate buffers in zeroize::Zeroizing; return
  Zeroizing<String> from retrieve*; enable the aes-gcm `zeroize` feature; log the
  load_signing_key failure classification.

  Verified clean in the same pass, recorded so it is not re-litigated: NO secret
  value reaches any log, error string, or Debug impl — every tracing call logs
  metadata or a key NAME only (keychain.rs:218, :228, :240, :257;
  encryption.rs:135), and neither Keychain nor EncryptionService derives Debug.
  #![forbid(unsafe_code)] is present (hkask_keystore.rs:1, cfg_attr(not(test)))
  with zero unsafe in production code. The Argon2/HKDF/passphrase paths are
  correctly Zeroizing-wrapped end to end. No `let _ =` discards. `subtle` is
  absent but CORRECTLY so: there is no secret-comparison site in the crate at all
  (signature verification delegates to ed25519_dalek::verify_strict,
  signing.rs:68) — do not add subtle as cargo-cult; add it if and when a
  passphrase/token comparison is introduced.
source: "https://anssi-fr.github.io/rust-guide/ — ANSSI Secure Rust Guidelines (secret lifetime); https://cwe.mitre.org/data/definitions/226.html"
ci_gate: scripts/check-kali-regressions.sh
status: pending
note: "Open finding as of 2026-08-12 — no fix attempted in the discovering audit. Scope caveat: whether the bare-String weakness propagates depends on the 4 external callers of Keychain::retrieve* (hkask-mcp-server credentials.rs, hkask-services-core config.rs, hkask-mcp-corpus persona/mod.rs, kask_bridge identity.rs), which were not audited."
