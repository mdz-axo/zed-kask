mitigation: "DelegationToken carries no expires_at field. is_valid_for checks only (resource, resource_id, action) equality. All tokens are no-expiry. If token expiry is re-introduced, add an expires_at field, an is_valid_for_at method that rejects expired tokens, and wire it into McpRuntime::invoke in the same change. See .rules: Token expiry is NOT enforced."
