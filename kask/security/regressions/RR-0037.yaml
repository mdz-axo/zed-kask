id: RR-0037
title: "Heal templates must not emit executable RunCommand/SetEnv actions"
surface: template
cwe: CWE-78
owasp_llm_2025: LLM01
atlas_tactic: AML.TA0005
nist_ssdf: PW.4.1
discovered_in: kask/registry/templates/heal/*.j2
discovered_by: kali-audit
discovered_at: 2026-07-31
severity: medium
detection:
  kind: grep
  pattern: 'RunCommand|SetEnv'
  include: "--include=*.j2 registry/templates/heal"
mitigation: "Heal templates propose only CreateDefaultFile actions with placeholder content; the dead heal-callback plumbing (HealCallback, heal_error_cb, with_heal_cb) was removed from the executor after repo-wide grep confirmed zero call sites. The old vocabulary instructed the model to run shell commands and grep API keys into its own output (secret exfiltration by design). If a heal executor is ever wired up, it must gate on a typed capability + operator confirmation — never execute LLM-proposed shell commands."
source: "Cycle 3 kali-audit — template action-vocabulary review (defense layers 1/3/4)"
ci_gate: scripts/check-kali-regressions.sh
status: enforced
