id: RR-0060
title: "MCP child processes must not inherit parent-process secrets (env_clear before the filtered per-server env)"
surface: config
cwe: CWE-497
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0008
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-mcp/src/runtime.rs:294, crates/context_server/src/transport/stdio_transport.rs:37
discovered_by: kali-audit
discovered_at: 2026-08-12
severity: high
detection:
  kind: cargo-test
  # Behavioral, not textual: assert a spawned child's environment does not carry
  # a secret absent from its allowlist. A grep for `env_clear` would pass the
  # moment someone writes the call, even in a branch that never runs.
  # Mutation-verified 2026-08-12: replacing the clear+passthrough construction
  # with inherit-all makes this test FAIL with "child inherited parent secret
  # DEEPINFRA_API_KEY", so the gate can actually detect the regression.
  pattern: "spawned_child_env_excludes_non_allowlisted_secrets"
  include: "crates/hkask-mcp/src/runtime.rs"
mitigation: |
  `env_clear()` is called on NO MCP spawn path:
    $ grep -rn "env_clear" --include=*.rs crates/context_server/ \
        kask/crates/hkask-mcp/ crates/zed/src/
    (no output)

  Both spawn sites only ADD to an inherited environment:
    - kask/crates/hkask-mcp/src/runtime.rs:294 — `Command::new(&binary)` then
      `cmd.env(k, v)` per extra_env entry. std::process::Command inherits the
      parent env unless env_clear() is called.
    - crates/context_server/src/transport/stdio_transport.rs:37 —
      `command.envs(binary.env.unwrap_or_default())`, additive.

  Meanwhile the parent deliberately loads every provider API key into its own
  environment (crates/zed/src/main.rs:379, `dotenvy::from_path`) and injects the
  SMTP password (main.rs:1591, `std::env::set_var("HKASK_SMTP_PASSWORD", ...)`).

  Consequence: all 13 MCP servers inherit DEEPINFRA_API_KEY, OPENROUTER_API_KEY,
  ATLASCLOUD_API_KEY, HKASK_SMTP_PASSWORD and every other .env/shell secret
  regardless of their allowlist. `portfolio`, allowlisted `Some(&[])`/`Some(&[])`,
  receives all of them. The intent documented at
  kask/crates/kask_bridge/src/mcp_servers.rs:405 ("a server that only needs
  DEEPINFRA_API_KEY won't receive HKASK_SMTP_PASSWORD") holds only for
  keychain-only secrets, NOT for the .env deployment main.rs:344 supports as
  first-class.

  Why the existing tests miss it: the three blast-radius tests
  (curator_credentials_do_not_include_data_service_keys:690,
  codegraph_credentials_do_not_include_smtp_password:718,
  media_credentials_only_include_used_keys:860) all exercise
  `filter_credentials_for_server` in isolation. None asserts anything about a
  spawned child's actual environment, so every one passes while children inherit
  the secrets they claim to exclude. Testing the filter is not testing the
  boundary.

  Fix: in kask/crates/hkask-mcp/src/runtime.rs, call `cmd.env_clear()` before
  applying extra_env, then re-add only the explicitly required base vars (PATH,
  HOME, locale/TZ) plus the filtered per-server set. Per .rules, remediation goes
  in kask/ — for the upstream stdio_transport.rs path either add a D-seam entry
  plus a test in the same PR, or route kask servers exclusively through
  McpRuntime. Ship with the test named above.

  Severity note: this is now the widest hole on the authority surface, because the
  per-call capability gate that used to sit in front of tool dispatch was removed
  as vacuous (RR-0056) — these allowlists carry more of the load than they did.
source: "https://cwe.mitre.org/data/definitions/497.html — Exposure of Sensitive System Information; OWASP LLM06:2025 Excessive Agency"
ci_gate: scripts/check-kali-regressions.sh
status: enforced
note: |
  Fixed 2026-08-12 in the discovering audit. `start_server_with_env`
  (kask/crates/hkask-mcp/src/runtime.rs) now calls `cmd.env_clear()` and rebuilds
  the child environment from `PASSTHROUGH_ENV_VARS` (12 non-secret plumbing vars,
  each justified in its doc comment) plus the caller's filtered per-server set.
  Four tests in `runtime::env_isolation_tests` pin the boundary: secrets excluded,
  allowlisted credentials still delivered, non-secret plumbing retained, and
  PASSTHROUGH_ENV_VARS itself contains no credential-shaped name (that last one
  blocks the tempting "fix" of widening the passthrough list instead of the
  server's allowlist).

  REMAINING SCOPE: the upstream zed host path,
  crates/context_server/src/transport/stdio_transport.rs:37
  (`command.envs(...)`, additive, no env_clear), is NOT covered by this fix.
  Per .rules that is an upstream file, so remediation belongs behind a D-seam or
  by routing kask servers exclusively through McpRuntime. kask's own MCP servers
  launch via McpRuntime (crates/zed/src/main.rs:2178 start_server_with_env), which
  is fixed; a context-server-hosted MCP server would still inherit.
