mitigation: "Call propagate_taint_for_binding(v, k) before context.insert(k, bound) at every input_mapping call site. Without it, inline-Jinja bindings ({{ step_N_result }}) lose their Source taint label — context.insert is a plain HashMap method with no taint awareness, and the FIDES Source→Sink block is silently bypassed."
