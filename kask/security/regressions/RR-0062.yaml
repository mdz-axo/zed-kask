id: RR-0062
title: "Untrusted free-text must not be bare-interpolated into prompt templates (no autoescape: tojson/delimiting is the only structural boundary)"
surface: template
cwe: CWE-1336
owasp_llm_2025: LLM01
atlas_tactic: AML.TA0005
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-templates/src/template_renderer.rs:337-338 and :179, kask/registry/templates/**/*.j2
discovered_by: kali-audit
discovered_at: 2026-08-12
severity: medium
detection:
  kind: grep
  # The VULNERABLE idiom, not the presence of a type: a heal template pasting a
  # raw error string straight into instruction context. Scoped narrowly because a
  # tree-wide "bare {{ }}" grep would match ~1652 legitimate sites and be useless
  # as a gate. Broaden only with a real allowlist of reviewed sites.
  pattern: '\{\{ *(error|error_message|raw_prompt|file_content|template_content) *\}\}'
  include: "--include=*.j2 registry/templates/heal registry/templates/curator registry/templates/registry/selectors"
mitigation: |
  There is no autoescape on any prompt template. The production Environment never
  calls set_auto_escape_callback (kask/crates/hkask-templates/src/template_renderer.rs:337-338,
  which sets only UndefinedBehavior::Lenient), and the per-render template is
  registered under the EXTENSIONLESS synthetic name "step" (:179), so minijinja's
  default_auto_escape_callback returns AutoEscape::None. `set_auto_escape_callback`
  appears nowhere in the repo.

  For prose prompts that is arguably correct — HTML/JSON-escaping into a prompt
  would corrupt it. The consequence is that `| tojson` and hand-written delimiters
  are the ONLY structural boundary between untrusted content and instruction text.

  Measured: 404 .j2 files, 2189 same-line {{ }} sites, 537 (24.5%) using tojson,
  1652 bare. The tojson discipline IS working where it matters most — only 13 bare
  interpolations reference a step_N_result/prev_step/tool_output name (8 of those
  in one skill). The gap is free-text payloads:
    docproc/extract-hmems.j2:94        {{ text }}
    docproc/tag-chunks.j2:65           {{ text }}
    listening/apply-template.j2:194    {{ chunk }}
    diataxis-diagram/present-diagram.j2:12  {{ file_content }}
    registry/selectors/selector.j2:22  {{ raw_prompt }}
    web/search-quick.j2:25             {{ description }}   (network-sourced)
    heal/*.j2:26-27                    {{ error }} / {{ error_message }}  (8 files)
    curator/template-healer.j2:33      {{ template_content }}  (a failed
                                       template's own Jinja source, pasted into a
                                       prompt whose job is rewriting templates)

  Delimiting exists in places (<passage> tags, fenced blocks) but a payload
  containing the closing delimiter escapes it, and no sanitizer runs before render
  — template_renderer.rs:185 passes the context through verbatim via
  minijinja::Value::from_serialize.

  Fix, in order of preference:
    1. `| tojson` for untrusted values (quotes + escapes, and it is already the
       house style for step results), or
    2. a random-nonce delimiter the payload cannot guess, rather than a fixed
       fence the payload can close.
  Do NOT add a content scanner that pattern-matches for injection strings: that is
  exactly what D4 removed after the RoleOverride `system:` substring pattern
  false-positived on legitimate rendering. Structural escaping cannot
  false-positive; substring matching can.

  Two adjacent items found in the same pass, outside this entry's grep scope:
    - heal/self-heal.j2 sits in an RR-0037-gated directory but advertises
      shell.exec to the model (:22), instructs running `ls -la` (:36), accepts a
      free-form "action" string (:55), and carries no "never emit shell commands"
      line — unlike its siblings (command_not_found.j2:43). RR-0037's
      `RunCommand|SetEnv` pattern reports green regardless. Consider broadening
      RR-0037's include from registry/templates/heal to all of
      registry/templates/.
    - training/trl-sft.j2:37,65 interpolate bare values into Python STRING
      LITERALS (`base_model = "{{ base_model }}"`), a quote-escape sink; context
      is populated unescaped at
      kask/mcp-servers/hkask-mcp-training/src/providers/trl_harness.rs:84,96.

  Verified clean, recorded so a future audit need not re-derive it: zero `| safe`,
  `| e`, `| escape`, `| indent` in all 404 files; zero dynamic {% include %}
  (all literal, so no template-injection sink of that class); path traversal
  defended by safe_template_join (:34) with tests at :417-447 and :472-481
  (RR-0002); all 9 {% raw %} blocks balanced and documentation-only.
source: "https://arxiv.org/html/2403.14720v1 — Microsoft Research Spotlighting (data/instruction separation); OWASP LLM01:2025"
ci_gate: scripts/check-kali-regressions.sh
status: pending
note: "Open finding as of 2026-08-12. Exploitability is Undetermined (U3 in the audit log): injectable prompt text is established, tool execution is not — that depends on the agent's tool gate, a layer this pass did not audit."
