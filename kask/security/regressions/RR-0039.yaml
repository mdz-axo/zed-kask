id: RR-0039
title: "Redaction prefixes must be lowercase to match the lowercased scan text (case-sensitivity bypass)"
surface: code
cwe: CWE-178
owasp_llm_2025: LLM07
atlas_tactic: AML.TA0010
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-inference/src/openai_compat.rs
discovered_by: kali-audit post-implementation review (guidelines-verify)
discovered_at: 2026-07-31
severity: high
detection:
  kind: cargo-test
  pattern: "sanitize_error_body_redacts_authorization_without_bearer"
  include: "crates/hkask-inference/src/openai_compat.rs"
mitigation: "SECRET_PREFIXES are matched against the ASCII-lowercased body, so every prefix must be lowercase; the original list had \"Authorization:\" / \"Bearer \" (uppercase), which never matched — the existing Bearer test passed only because the incidental lowercase \"sk-\" prefix in the token value redacted from that position instead. A test that exercises prefix X but passes via prefix Y is theater: every redaction prefix needs its own test asserting its specific shape is removed (Authorization: Basic, Authorization: Bearer with a non-sk token). Header-style prefixes redact to end-of-line (scheme words like Basic/Bearer would otherwise shield the secret); opaque token prefixes redact to end-of-token."
source: "Cycle 3 kali-audit — guidelines-verify review of RR-0035 implementation"
ci_gate: scripts/check-kali-regressions.sh
status: enforced
