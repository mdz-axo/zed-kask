id: RR-0030
title: "reasoning / reasoning_delta channels bypass scan_output in GuardedInferencePort (OWASP LLM07 bypass)"
surface: code
cwe: CWE-200
owasp_llm_2025: LLM07
atlas_tactic: AML.TA0010
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-guard/src/guarded_inference.rs
discovered_by: kali-audit
discovered_at: 2026-07-31
severity: high
detection:
  kind: cargo-test
  pattern: "canary_in_reasoning_field_is_redacted"
  include: "crates/hkask-guard/src/guarded_inference.rs"
mitigation: "Scan result.reasoning alongside result.text in every GuardedInferencePort method (sanitize_reasoning helper), and accumulate reasoning_delta in GuardedStream so the end-of-stream scan sees the thinking channel. Thinking-mode models (Qwen3, GLM-5.2, DeepSeek-R1) routinely echo system-prompt content — including the canary — into the reasoning trace; an unscanned reasoning channel silently defeats RR-0006/0014 canary detection and leaks secrets past Layer 7 output filtering. Adding a text field to InferenceResult without scanning it in the guard is an unguarded exfiltration channel the compiler cannot flag."
source: "Cycle 3 kali-audit — guard layer coverage gap (defense layers 7/8)"
ci_gate: scripts/check-kali-regressions.sh
status: obsolete
note: "hkask-guard crate deleted 2026-08-10. GuardedInferencePort and scan_output no longer exist."
