id: RR-0041
title: "OcapConfig struct or required_capabilities re-introduction (dead config, no enforcement point)"
surface: code
cwe: CWE-1188
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0008
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-tool-port/src/token_types.rs
discovered_by: kali-audit
discovered_at: 2026-08-04
severity: medium
detection:
  kind: grep
  pattern: 'OcapConfig|required_capabilities|template_capabilities|CapabilityAwareValidator'
  include: "crates/ mcp-servers/"
mitigation: "OcapConfig, required_capabilities, template_capabilities (SQL table), and CapabilityAwareValidator were removed as dead code. CapabilityAwareValidator had zero production call sites and expected flat strings while manifests wrote objects. The enforced boundaries are the inference IPC per-request tool_allowlist, the per-agent mcp_tools allowlist, and the per-server MCP env/credential allowlists. Do not re-add these without wiring them into one of those boundaries. NOTE (2026-08-12): McpRuntime::invoke is no longer a gate — its capability check was removed as vacuous (see RR-0056); do not cite it as an enforcement point."
source: ".rules: Manifest ocap: is declared config, not a security gate"
ci_gate: scripts/check-kali-regressions.sh
status: enforced