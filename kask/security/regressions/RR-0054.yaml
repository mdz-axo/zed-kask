id: RR-0054
title: "reg.widget.* span namespaces emitted by widget crates must be registered in CANONICAL_NAMESPACES"
surface: runtime
cwe: CWE-778
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0010
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-types/src/event.rs
discovered_by: runtime-posture-monitor
discovered_at: 2026-08-10
severity: high
detection:
  kind: grep
  # PRESENCE check: the reg.widget parent namespace must be registered in
  # CANONICAL_NAMESPACES. The hierarchical is_canonical function makes
  # reg.widget.* children valid via ancestor match. Without the parent
  # entry, 6 namespaces emitted across 7 widget crates are unregistered —
  # any consumer that validates against CANONICAL_NAMESPACES rejects them.
  semantics: presence
  pattern: '"reg\.widget"'
  include: "crates/hkask-types/src/event.rs"
mitigation: "Add \"reg.widget\" to CANONICAL_NAMESPACES in kask/crates/hkask-types/src/event.rs. The hierarchical is_canonical function makes adding just the parent sufficient for all children (reg.widget.render, reg.widget.disagree, reg.widget.graph_render, reg.widget.evidence_set, reg.widget.whatif_discarded, reg.widget.reask) to validate. Emitted via tracing::info!(target: ...) which bypasses SpanNamespace::new validation, so they compile and run today, but any consumer that validates against CANONICAL_NAMESPACES rejects them — a silent telemetry gap."
source: "Static emitter-wiring audit (runtime-posture-monitor adapted) — namespace registration coverage"
ci_gate: scripts/check-kali-regressions.sh
status: enforced
