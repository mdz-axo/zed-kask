id: RR-0005
title: "GuardConfig::default() reads environment variables (hidden parameter)"
surface: code
cwe: CWE-732
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0007
nist_ssdf: PW.6.1
discovered_in: crates/hkask-guard/src/pipeline.rs
discovered_by: kali-audit
discovered_at: 2026-07-17
severity: medium
detection:
  kind: grep
  # The bug: env::var inside Default::default(). The fix: Default returns
  # pure 32,000; from_env() reads the env var explicitly. grep is line-based
  # and cannot express "env::var inside fn default()" (the old multiline
  # pattern with a literal \n never matched anything — a vacuous gate).
  # PRESENCE proxy: the explicit `from_env` seam must exist; its removal is
  # the signal that env reading collapsed back into Default::default().
  # Verify the intra-function property manually when pipeline.rs config
  # code changes.
  semantics: presence
  pattern: 'pub fn from_env'
  include: "crates/hkask-guard/src/pipeline.rs"
mitigation: "Use GuardConfig::from_env() for env-var-driven config. Default::default() must return the pure default (32,000) without touching the environment."
source: "hKask Magna Carta P3 — no hidden parameters"
ci_gate: scripts/check-kali-regressions.sh
status: obsolete
note: "hkask-guard crate deleted 2026-08-10. GuardConfig no longer exists."
