id: RR-0051
title: "Research providers must not embed raw provider error bodies via body.chars().take(200) (RR-0035 class)"
surface: code
cwe: CWE-209
owasp_llm_2025: LLM07
atlas_tactic: AML.TA0010
nist_ssdf: PW.4.1
discovered_in: kask/mcp-servers/hkask-mcp-research/src/research/providers/brave.rs
discovered_by: kali-audit
discovered_at: 2026-08-10
severity: medium
detection:
  kind: grep
  # ABSENCE check: the raw body.chars().take(200).collect::<String>() pattern
  # must NOT appear in the research providers. The 200-char truncation is a
  # size defense (CWE-400), not a secrecy defense (CWE-209) — a short secret
  # like sk-abc123 fits in 200 chars. The fix routes through sanitize_error_body
  # instead, which redacts secret prefixes before truncating.
  pattern: 'body\.chars\(\)\.take\(200\)'
  include: "mcp-servers/hkask-mcp-research/src/research/providers/"
mitigation: "Replace body.chars().take(200).collect::<String>() with hkask_inference::openai_compat::sanitize_error_body(&body) in brave.rs, tavily.rs, browserbase.rs, and firecrawl.rs. The 200-char truncation limits size but not secrecy — a short secret fits in 200 chars. sanitize_error_body redacts secret prefixes (authorization:, bearer, sk-, api_key, ghp_, AKIA, xoxb-, glpat-, eyJ) before truncating."
source: "Cycle 8 kali-audit — research provider error-channel leakage (defense layer 7); same class as RR-0035"
ci_gate: scripts/check-kali-regressions.sh
status: enforced
