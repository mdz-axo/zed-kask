id: RR-0045
title: "ManifestExecutor final-result extraction uses values().last() instead of ordinal-keyed lookup"
surface: code
cwe: CWE-440
owasp_llm_2025: N/A
atlas_tactic: N/A
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-templates/src/executor.rs
discovered_by: kali-audit
discovered_at: 2026-08-04
severity: high
detection:
  kind: grep
  pattern: 'values\(\)\.(last|next_back)\(\)'
  include: "kask/crates/hkask-templates/src/ kask/crates/kask_bridge/src/"
mitigation: "ManifestExecutor::execute_manifest returns HashMap<String, Value> with step_N_result keys. HashMap iteration order is randomized (RandomState), so values().last() picks an arbitrary step, not the final one. Use extract_final_step_result (in kask_bridge/src/skill_executor.rs or hkask-templates/src/executor.rs) which parses the ordinal from step_N_result keys and picks the highest. See .rules: ManifestExecutor final-result extraction must be ordinal-keyed."
source: ".rules: ManifestExecutor final-result extraction must be ordinal-keyed"
ci_gate: scripts/check-kali-regressions.sh
status: enforced