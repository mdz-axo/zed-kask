id: RR-0059
title: "cargo-deny sources/licenses must be satisfiable: allow-git enumerated, and the third-party license allowlist not applied to this workspace's own GPL crates"
surface: supply-chain
cwe: CWE-1357
owasp_llm_2025: LLM03
atlas_tactic: AML.TA0010
nist_ssdf: PW.4.1
discovered_in: kask/deny.toml ([sources] allow-git = [] with 25 git deps; [licenses] with no private.ignore)
discovered_by: kali-audit
discovered_at: 2026-08-12
severity: medium
detection:
  kind: grep
  # PRESENCE check: private.ignore must stay set. Without it the licenses check
  # emits 222 `rejected` errors of which 210 are this repo's own GPL crates,
  # which both fails the gate and buries the 4 genuine third-party rejections.
  semantics: presence
  pattern: '\[licenses\.private\]'
  include: "deny.toml"
mitigation: |
  Two config bugs made `cargo deny check` unpassable once it started parsing
  (see RR-0058), which is the likely reason nothing ran it:

  1. `[sources] allow-git = []` while the workspace declares 25 git
     dependencies -> 74 `source-not-allowed` errors. A gate guaranteed to be red
     is a gate nobody runs. Fixed by enumerating all 32 git hosts. Keep the list
     enumerated: adding a git dependency should be a deliberate supply-chain
     decision that shows up as a diff to this list, which is exactly the signal
     `unknown-git = "deny"` is supposed to give. Note the kask subtree itself
     declares ZERO git deps (all 32 kask manifests are registry- or
     path-sourced) — a new git dep under kask/ deserves scrutiny.

  2. `[licenses]` had no `private.ignore`, so the third-party allowlist was
     applied to this repo's own `GPL-3.0-or-later` crates -> 210 of 222
     rejections were first-party. That is a category error: the allowlist is a
     policy for third-party code, and zed-kask is itself GPL. Fixed with
     `[licenses.private] ignore = true`, plus explicit `exceptions` for the 4
     genuine third-party cases (ffmpeg-next/ffmpeg-sys-next WTFPL,
     libbz2-rs-sys bzip2-1.0.6, nvim-rs LGPL-3.0).

  Do not "fix" a red supply-chain gate by deleting the check or downgrading it to
  `warn`. Make it satisfiable and keep it failing on real changes.

  Known pin weaknesses tracked in the allow-git comment rather than silently
  accepted: crates/mermaid_render pins merman by MUTABLE `tag`
  ("v0.7.0-with-patches", force-movable upstream), and crates/etw_tracing pins
  wprcontrol by a 7-char abbreviated `rev`. Prefer full 40-hex `rev` for both.
source: "https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html and .../licenses/cfg.html"
ci_gate: .github/workflows/kask-ci.yml (cargo-deny job)
status: enforced
