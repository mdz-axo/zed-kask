id: RR-0028
title: "LLM JSON extraction uses first-brace to last-brace slice instead of brace-balanced scan (RR-0017 class)"
surface: llm-io
cwe: CWE-1336
owasp_llm_2025: LLM02
atlas_tactic: AML.TA0005
nist_ssdf: PW.4.1
discovered_in: kask/crates/hkask-templates/src/executor.rs, kask/crates/hkask-inference/src/fusion_orchestrator.rs, kask/mcp-servers/hkask-mcp-corpus/src/runtime/classify_impl.rs
discovered_by: kali-audit
discovered_at: 2026-07-31
severity: high
detection:
  kind: grep
  # Detect the vulnerable first-brace to last-brace slice pattern anywhere in
  # kask/ Rust code. The fix: use hkask_types::json_extract::extract_json_from_response
  # (brace-balanced) instead. RR-0017 was scoped to a single file and missed
  # three more sites in cycle 2; this regression scans the whole kask tree.
  # Excludes json_extract.rs (the secure implementation) and test modules
  # (which legitimately reference the pattern to assert against it).
  pattern: '\.find\([^)]*[{][^)]*\).*\.rfind\([^)]*[}][^)]*\)'
  include: "--include=*.rs --exclude-dir=json_extract ."
mitigation: "Use brace-balanced JSON extraction via hkask_types::json_extract::extract_json_from_response instead of the first-brace to last-brace slice. The secure primitive lives in hkask-types/src/json_extract.rs so all LLM-output parsers share it. The old approach silently merged an injected JSON block (echoed by the LLM in its reasoning preamble) with the model's real answer, allowing a poisoned chunk to control parsed output. Brace-balanced extraction returns exactly one top-level object, defeating the injection."
source: "Adversarial review of docproc ontology tagging (RR-0017) — same bug class found in three more files during cycle 2 kali-audit"
ci_gate: scripts/check-kali-regressions.sh
status: enforced