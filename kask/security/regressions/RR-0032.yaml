id: RR-0032
title: "Corpus MCP file tools must contain caller-supplied paths under the project root"
surface: mcp
cwe: CWE-22
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0006
nist_ssdf: PW.4.1
discovered_in: kask/mcp-servers/hkask-mcp-corpus/src/tools/corpus/mod.rs, tools/semantic/mod.rs, tools/tagging/ops.rs, tools/gather/mod.rs, tools/document.rs, corpus/discover/service.rs, hkask_mcp_corpus.rs
