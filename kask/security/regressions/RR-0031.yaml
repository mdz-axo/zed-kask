id: RR-0031
title: "Inference IPC unix socket lacks permission restriction and peer authentication"
surface: code
cwe: CWE-306
owasp_llm_2025: LLM07
atlas_tactic: AML.TA0010
nist_ssdf: PW.4.1
discovered_in: kask/crates/kask_bridge/src/inference_ipc_server.rs, kask/crates/hkask-inference/src/inference_ipc_client.rs
discovered_by: kali-audit
discovered_at: 2026-07-31
severity: high
detection:
  kind: cargo-test
  pattern: "socket_dir_is_private"
  include: "crates/kask_bridge/src/inference_ipc_server.rs"
mitigation: "Bind the socket inside a per-user 0700 directory ($XDG_RUNTIME_DIR/kask, falling back to temp_dir()/kask-inference-{uid}; chmod failure aborts startup), set the socket file to 0600 after bind, and verify peer uid via tokio's safe UnixStream::peer_cred() on Linux (mismatch: warn + drop). Previously the socket lived in world-listable /tmp with default umask and no peer auth — any local user could drive Generate/Embed/ListModels calls billed to the operator's API keys. The same commit caps read_line at MAX_IPC_LINE_BYTES (16 MiB) on both server and client via AsyncReadExt::take, closing an unbounded-memory-growth DoS (CWE-400) — enforced by capped_reader_rejects_overlong_line / read_response_line_rejects_overlong_line tests."
source: "Cycle 3 kali-audit — IPC boundary review (defense layer 6)"
ci_gate: scripts/check-kali-regressions.sh
status: enforced
