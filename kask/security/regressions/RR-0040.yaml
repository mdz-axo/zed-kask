id: RR-0040
title: "ocap: manifest block re-introduction (declared config, not a security gate)"
surface: config
cwe: CWE-1188
owasp_llm_2025: LLM06
atlas_tactic: AML.TA0008
nist_ssdf: PW.4.1
discovered_in: kask/registry/manifests/
