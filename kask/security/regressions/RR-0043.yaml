mitigation: "cx.background_spawn schedules on GPUI's thread-pool executor, which has no tokio reactor. Any future driving reqwest, tokio::time, tokio::process, or tokio::io panics with 'there is no reactor running'. Use gpui_tokio::Tokio::spawn(&*cx, async move { ... }) instead. The let _guard = Tokio::handle_async(&*cx).enter() pattern does NOT help — enter() sets a thread-local for the current scope, but the future is polled later on a different thread. See .rules: background_spawn of tokio-dependent futures panics at poll time."
source: ".rules: background_spawn of tokio-dependent futures panics at poll time"
