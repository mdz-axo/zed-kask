# Provider profile — FRED (Federal Reserve Economic Data). Structural
# contract pinned by kask/scripts/check-provider-profiles.sh; semantic
# reading owned by the provider-audit skill.
id: fred
name: FRED
status: active
roles:
  - prediction-markets-reference
keychain:
  slot: kask://credentials/fred
  env_var: HKASK_FRED_API_KEY
