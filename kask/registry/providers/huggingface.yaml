# Provider profile — HuggingFace. Structural contract pinned by
# kask/scripts/check-provider-profiles.sh; semantic reading owned by the
# provider-audit skill.
id: huggingface
name: HuggingFace
status: active
roles:
  - training-artifacts
  - model-weights-host
keychain:
  slot: kask://credentials/hf_token
  env_var: HF_TOKEN
consumed_capabilities:
  - capability: Runpod artifact publish path (datasets, adapters, models)
    source: kask/crates/kask_bridge/src/mcp_servers.rs (training server — HKASK_HF_ARTIFACT_OWNER, HKASK_HF_DATASET_REPO, HKASK_HF_MODEL_REPO)
  - capability: open-weight model hosting (base models for training)
    source: kask/mcp-servers/hkask-mcp-training/src/huggingface.rs
deliberate_non_consumption: []
data_terms:
  # # B3 retention anchor: dpv:StorageDuration (DPV 2.3, vendored at kask/crates/hkask-bridge-ontology/sources/dpv/, commit 79311a6664)
  extracted_at: "2026-10-13"
  trains_on_customer_data: >-
    no training clause in the privacy policy read (huggingface.co/privacy,
    extracted 2026-10-13); private repositories are access-controlled (404 to
    non-owners, per the Hub docs read via search 2026-10-13). An explicit
    train-on-private-content statement was not located in the pages read
    this run — evidence gap on the explicit stance.
  retention_published: >-
    yes — privacy policy section "B. Data retention": "We retain your
    Information for as long as necessary to deliver the Services, to
    comply with any applicable legal requirements..." (extracted 2026-10-13).
status_surface:
  status_page: >-
    https://status.huggingface.co live (HTTP 200, probed 2026-10-13).
  sla: none found (probed 2026-10-13).
pricing:
  machine_readable: >-
    pricing published (huggingface.co/pricing, HTTP 200, probed 2026-10-13); no
    machine-readable pricing source found this run.
first_audit_pending: false
