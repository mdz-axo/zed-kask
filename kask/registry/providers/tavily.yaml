# Provider profile — Tavily. Structural contract pinned by
# kask/scripts/check-provider-profiles.sh; semantic reading owned by the
# provider-audit skill.
id: tavily
name: Tavily
status: active
roles:
  - research-provider
  - companies-data
keychain:
  slot: kask://credentials/tavily
  env_var: HKASK_TAVILY_API_KEY
consumed_capabilities:
  - capability: web search (fast, answer boxes, content previews)
    source: kask/mcp-servers/hkask-mcp-research/src/research/providers/tavily.rs
  - capability: companies research search
    source: kask/crates/kask_bridge/src/mcp_servers.rs (companies server credentials)
deliberate_non_consumption: []
data_terms:
  # B3 retention anchor: dpv:StorageDuration (DPV 2.3, vendored at kask/crates/hkask-bridge-ontology/sources/dpv/, commit 79311a6664)
  extracted_at: "2026-10-13"
  trains_on_customer_data: >-
    yes, scoped to the AI Functionality — Terms of Service §6 (read
    2026-10-13): third-party AI providers "may use, process, analyze, and retain
    Customer Input submitted to the AI Functionality and Outputs
    generated by the AI Functionality for purposes of training,
    improving, developing, and enhancing" and "may incorporate insights
    derived from your Customer Input and Outputs into their respective
    training datasets". The basic search API is outside that section's
    definitions read this run.
  retention_published: >-
    yes — privacy policy (tavily.com/privacy, extracted 2026-10-13) carries a
    Data Retention section: information retained as necessary to provide
    the Services and per the stated periods therein.
  operator_ruling: >-
    accept-as-is (operator ruling 2026-10-13): the §6 third-party training
    clause is scoped to the AI Functionality; our consumption is the basic
    search API, outside that section's definitions on the 2026-10-13 read.
    Revisit if consumption expands to the AI Functionality or enters a
    sensitive-data path.
status_surface:
  status_page: >-
    https://status.tavily.com live (HTTP 200, probed 2026-10-13).
  sla: none found in the terms read 2026-10-13.
pricing:
  machine_readable: >-
    pricing published (tavily.com/pricing, HTTP 200, probed 2026-10-13); no
    machine-readable pricing source found this run.
first_audit_pending: false
