    https://status.exa.ai live (HTTP 200, probed 2026-10-13).
  sla: none found in the terms read 2026-10-13.
pricing:
  machine_readable: >-
    pricing published (exa.ai/pricing, HTTP 200, probed 2026-10-13); no
