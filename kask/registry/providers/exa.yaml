  env_var: HKASK_EXA_API_KEY
consumed_capabilities:
  - capability: neural/semantic web search
    source: kask/mcp-servers/hkask-mcp-research/src/research/providers/exa.rs
  - capability: companies research search
    source: kask/crates/kask_bridge/src/mcp_servers.rs (companies server credentials)
