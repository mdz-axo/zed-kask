# Provider profile — RunPod. Structural contract pinned by
# kask/scripts/check-provider-profiles.sh; semantic reading owned by the
# provider-audit skill.
#
# Scope narrowed 2026-10-17: the training-host role was retired with the
# training MCP server (model training is out of scope for the co-researcher
# mandate). The OCR-inference role is live and unaffected — the corpus
# pipeline resolves RunPod/kask-ocr through the D29 LanguageModelProvider.
id: runpod
name: RunPod
status: active
roles:
  - ocr-inference
keychain:
  slot: https://api.runpod.io
  env_var: RUNPOD_API_KEY
consumed_capabilities:
  - capability: dedicated LanguageModelProvider for OCR (RunPod/kask-ocr, olmOCR-2)
    source: DIVERGENCE.md D29
  - capability: Data Services settings row ("RunPod (serverless inference for OCR)")
    source: kask/crates/kask_bridge/src/inference_providers.rs
config_env: []  # the RUNPOD_* GPU/pod overrides were purged with the training server
deliberate_non_consumption:
  - capability: embeddings at the account api_url root
    reason: "no OpenAI-compatible root at https://api.runpod.io — each serverless
      endpoint carries its own https://api.runpod.io/v2/{endpoint_id}/openai/v1
      (kask/crates/kask_bridge/src/inference_providers.rs, serves_embeddings=false)"
data_terms:
  # B3 retention anchor: dpv:StorageDuration (DPV 2.3, vendored at kask/crates/hkask-bridge-ontology/sources/dpv/, commit 79311a6664)
  extracted_at: "2026-10-13"
  trains_on_customer_data: >-
    no training clause found in the privacy policy read
    (runpod.io/privacy, extracted 2026-10-13) — RunPod rents GPU capacity; the
    training workloads are the customer's own (BYO data/models).
  retention_published: >-
    yes — privacy policy "Information Retention" section (extracted
    2026-10-13): personal information generally retained to fulfill the purposes
    collected, subject to legal/accounting requirements.
status_surface:
  status_page: >-
    https://runpod.statuspage.io live (HTTP 200, probed 2026-10-13;
    status.runpod.io itself did not resolve).
  sla: >-
    yes — runpod.ai/service-level-agreement live (HTTP 200, probed 2026-10-13);
    FAQ text read 2026-10-13: "Runpod provides a 99.99% uptime SLA" (enterprise
    agreements add it as a contractual term).
pricing:
  machine_readable: >-
    pricing published (runpod.ai/pricing, HTTP 200, probed 2026-10-13); no
    machine-readable pricing source found this run.
first_audit_pending: false
