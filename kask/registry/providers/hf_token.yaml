# Provider profile — HuggingFace (the hf_token adoption). RETIRED 2026-11-11:
# archived in place per the provider-audit retirement pass (Step 9).
# Structural contract pinned by kask/scripts/check-provider-profiles.sh.
#
# This adoption ran 2026-11-04..2026-11-11 under the credential key
# `hf_token`: kask fetched model weights from the Hub for a llama.cpp
# server it launched itself. That stack was removed 2026-11-11 — local
# models are now installed and served by Ollama or llama.cpp outside kask —
# so the token has no reader. The dated readings below are preserved as the
# audit record, not as a live contract. The earlier training-era adoption is
# archived at huggingface.yaml.
id: hf_token
name: HuggingFace
status: retired
retired:
  date: "2026-11-11"
  reason: >-
    the one consumer (the kask model-weights fetcher) was removed with the
    kask-side private inference stack; private threads now run on models
    served by a local Ollama or llama.cpp install through the editor's
    built-in providers, which fetch their own weights.
  purged:
    - Data Services row HF_TOKEN
      (kask/crates/kask_bridge/src/inference_providers.rs, DATA_SERVICES)
    - the fetcher itself (the removed hkask-private-inference crate)
  retained_user_data:
    - Any existing kask://credentials/hf_token keychain entry is left in
      place, dormant and unread; nothing in the tree reads or writes it.
roles:
  - model-weights-host   # retired role — no in-tree consumer
keychain:
  slot: none
  env_var: ""
  note: retired-era record — over 2026-11-04..2026-11-11 the slot was
    kask://credentials/hf_token with env_var HF_TOKEN.
consumed_capabilities: []  # retired — no in-tree consumer remains
deliberate_non_consumption: []
data_terms:
  # B3 retention anchor: dpv:StorageDuration (DPV 2.3, vendored at
  # kask/crates/hkask-bridge-ontology/sources/dpv/)
  extracted_at: "2026-11-05"
  trains_on_customer_data: >-
    no training clause in the privacy policy re-read (huggingface.co/privacy,
    effective 2023-03-28, extracted 2026-11-05) — the §2 use purposes do not
    include model training on user content. An explicit
    train-on-private-content statement was not located — the same evidence
    gap the archived 2026-10-13 audit recorded, unchanged by this re-read.
  retention_published: >-
    yes — privacy policy §4.B "Data retention" (extracted 2026-11-05): "We
    retain your Information for as long as necessary to deliver the Services,
    to comply with any applicable legal requirements, to maintain security
    and prevent incidents and, in general, to pursue our legitimate
    interests."
status_surface:
  status_page: >-
    https://status.huggingface.co live (HTTP 200, "All services are online",
    last updated 2026-11-03; extracted 2026-11-05) — per-service uptime ~100%
    (Hub 99.989% over one 90-day window; git hosting and serving 99.997%).
    Degradations relevant to the weights-download role: slower downloads in
    the Asia-Pacific region (Sep 22 and Sep 25, 2026, CDN).
  sla: none found (re-probed 2026-11-05).
pricing:
  machine_readable: >-
    pricing published (huggingface.co/pricing, HTTP 200, extracted
    2026-11-05) — PRO $9/month, Hub storage $8-12/TB/month by volume tier,
    Spaces/Jobs GPU and Inference Endpoints hourly tables; no
    machine-readable pricing source found this run.
first_audit_pending: false
# B3/B4/B5 fields were read and dated 2026-11-05. The full inbound B1-B6 /
# outbound O1-O4 provider-audit pass for this adoption was never run; the
# adoption was retired first.
