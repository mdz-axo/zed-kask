# Template crate manifest for sankey-flow skill
# hKask v0.33.3
# Example-anchored Sankey diagramming — match, adapt, render

crate:
  name: sankey-flow
  version: "0.33.3"
  description: >
    Example-anchored Sankey flow diagramming. Matches a natural-language prompt
    against a library of canonical Sankey examples (income statement, budget,
    data pipeline, funnel, balance sheet, process flow), adapts the matched
    example's structure to the user's data, and renders Mermaid sankey-beta.
    Anchors flows to PKO (a Sankey is a visualization of a PKO Procedure).
    Per-domain conservation modes (mandatory/asserted/none). All diagrams
    render natively in Zed.

templates:
  - id: sankey-flow/sankey-examples
    name: "Canonical Sankey example library"
    path: sankey-examples.j2
    type: Include
    description: >
      Library of canonical Sankey structural templates (income statement, budget,
      data pipeline, funnel, balance sheet, process flow) with match triggers,
      node patterns, edge patterns, conservation modes, and filled instances.
      Included by the match and adapt templates as few-shot context.

  - id: sankey-flow/sankey-match
    name: "MATCH — classify domain and match against example library"
    path: sankey-match.j2
    type: KnowAct
    description: >
      Classify the prompt's domain, match it against the canonical example
      library by trigger phrases and structural similarity, and extract the
      user's actual nodes, edges, and weights in a single pass. Does NOT
      interrogate — missing data is marked as placeholder (value=1). For
      income statements with losses, negative profits flow into Total Revenue
      as sources (Revenue + |Loss| = Total Expenses).
    generates_spans:
      - reg.sankey-flow.match

  - id: sankey-flow/sankey-adapt
    name: "ADAPT — fill user data into matched example structure"
    path: sankey-adapt.j2
    type: KnowAct
    description: >
      Fill the user's extracted data into the matched canonical example's
      structure. Verify structure (node count, edge pattern, conservation
      mode), render Mermaid sankey-beta CSV with front-matter config, and wrap
      in a markdown document with description, conservation check, data sources
      with PROV-O provenance, and references. Single pass — no iteration loop.
      Self-corrects against the example structure if the draft deviates.
    generates_spans:
      - reg.sankey-flow.adapt

  - id: sankey-flow/present-sankey
    name: "Surface the finalized Sankey markdown as the cascade output"
    path: present-sankey.j2
    type: RenderAct
    description: >
      RenderAct — surfaces the finalized Sankey markdown (containing the fenced
      ```mermaid block) as the cascade's final output string. Flattens the
      adapt step's JSON object to a raw markdown string. Deterministic (no
      LLM call).