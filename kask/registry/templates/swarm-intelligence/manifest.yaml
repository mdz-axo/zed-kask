# Template crate manifest for swarm-intelligence skill
# hKask v0.35.0
# Decomposed into: SENSE → ORIENT → DECIDE → ACT → CHECK → CONVERGE
#
# Substrate ontology: Agent Bestiary World (ABW) swarm semantics — a swarm is
# an ABW workspace with hired agents; compound agents orchestrate via
# execute_agent / delegate_to_agent (delegation chains forbidden). rJoule (verified
# live 2026-08-02): own-agent hire via `/add` = flat 2 cr; third-party `/hire` =
# flat 5 cr base (quote `total` = base + required + optional); @mention 1 cr +
# tokens, delegation 1 cr + tokens. Thagard coherence scoring.
#
# Surface ontologies:
#   - Onto4MAT (Kiesel et al. 2022): Team { alignment, cohesion, separation,
#     influence }, Agent { speed, heading, energy, distanceToGoal }, Formation.
#   - Reynolds (1987) flocking: separation / alignment / cohesion as three
#     local rules sufficient for emergent flocking.
#   - PSO (Kennedy & Eberhart 1995): velocity update v ← ωv + c1·r1·(pbest−x)
#     + c2·r2·(gbest−x); c1 cognitive, c2 social, ω inertia.
#   - ACO (Dorigo 1992): pheromone deposition (strengthen good paths) /
#     evaporation (forget stale paths) as stigmergy.
#   - W3C SSN/SOSA: observable properties for swarm-state sensing.
#   - Ashby requisite variety; cybernetic 5-property loop assessment.
#
# Feedback loop: SENSE consumes prior_iteration.next_focus (emitted by the
# CONVERGE check when not converged) to direct the next iteration. The loop is
# autopoietic at the heuristic layer — each iteration's composition
# recommendation is a function of the prior measured swarm state.

crate:
  name: swarm-intelligence
  version: "0.35.0"
  description: >
    Convergent swarm-composition process for agent swarms. Senses current
    swarm state against the Onto4MAT multi-agent teaming ontology
    (alignment, cohesion, separation) and the swarm backend's APIs;
    orients by classifying the gap (variety deficit, coherence deficit,
    loop-break) via Ashby's requisite variety and PSO cognitive/social
    balance; decides composition adjustments isomorphic to PSO velocity
    tuning (c1/c2/omega), ACO pheromone deposition/evaporation, and
    Reynolds separation/alignment/cohesion; acts via gated
    swarm_delegate/swarm_delegate_local calls with a budget gate;
    checks by reconciling actual spend against the algedonic channel;
    and converges via a Cauchy criterion on the swarm-state distance
    metric. Mode-aware (v2 §15): in `abw` mode, fetches state from ABW
    REST and delegates via `swarm_delegate`; in `local` mode, reads the
    local agent registry + ledger and delegates via
    `swarm_delegate_local`. The ORIENT and DECIDE phases are
    mode-agnostic (they operate on the state shape, not the data
    source). Anchored to Reynolds (1987) flocking, Kennedy-Eberhart
    PSO, Dorigo ACO, Onto4MAT (Kiesel et al. 2022), W3C SSN/SOSA,
    Thagard coherence, Ashby requisite variety, and the ABW integration
    plan (zed-kask 2026-08-01). Composes pragmatic-cybernetics,
    kata-improvement, and essentialist. Emits reg.skill.swarm-intelligence.*
    spans. Any userpod may invoke this skill.

templates:
  - id: swarm-intelligence/swarm-sense
    name: "Sense current swarm state against Onto4MAT + backend APIs"
    path: swarm-sense.j2
    type: KnowAct
    description: >
      Measure the current swarm state. Mode-aware (v2 §15): in `abw` mode,
      fetch the ABW workspace roster (agents[], accepts[], produces[],
      capabilities, dependencies) and the wallet balance/transactions via
      hkask-mcp-swarm's `swarm_get_swarm`; in `local` mode, read the local
      agent registry via `swarm_list_local_agents` and the local ledger
      balance. Optionally probe an agent's consolidated knowledge graph via
      `swarm_search_knowledge` (fermi v0.10.26 — the embedder was broken
      platform-wide for 6 weeks and is now fixed) when the roster's
      accepts/produces is ambiguous about whether an agent covers a required
      transform. Compute Onto4MAT team properties: alignment
      (delegation-graph density from produces/accepts overlap), cohesion
      (fraction of required dependencies satisfied), separation (distinct
      (agent_type, model, temperature) tuples / agent count). Derive
      required_transforms from the task. Consumes prior_iteration.next_focus
      when present (feedback loop closure). Vacuous-truth defaults: empty
      required_transforms → variety_coverage 1.0 + trivial_task flag; empty
      swarm → diversity 0.0, variety 0.0.
    generates_spans:
      - reg.skill.swarm-intelligence.sense

  - id: swarm-intelligence/swarm-orient
    name: "Classify gap: variety deficit | coherence deficit | loop-break"
    path: swarm-orient.j2
    type: KnowAct
    description: >
      Classify the gap between sensed state and target condition into one of
      three deficit classes (or on-target): (a) variety deficit —
      required_transforms not covered; (b) coherence deficit — Thagard
      coherence flat/declining OR diversity below floor (premature
      convergence, the PSO/ACO failure mode); (c) loop-break — un-reconciled
      dispatches or un-acknowledged curator data-sharing. Mode-agnostic
      (v2 §15): operates on the state shape from SENSE, not the data source.
      Delegates to pragmatic-cybernetics for the 5-property assessment
      (polarity, delay, gain, closure, fidelity) when the deficit is a
      loop-break. Classifies the coordination problem (Axelrod): cooperation
      (repeated, shadow of the future) vs division-of-labor (one-shot,
      complementary capabilities).
    generates_spans:
      - reg.skill.swarm-intelligence.orient

  - id: swarm-intelligence/swarm-decide
    name: "Propose composition adjustments isomorphic to PSO/ACO/Reynolds tuning"
    path: swarm-decide.j2
    type: KnowAct
    description: >
      Propose composition adjustments mapped onto the swarm's hire/fire/delegate
      vocabulary (redundant duplicates are fired via `swarm_fire`, not just
      flagged), isomorphic to swarm-algorithm tuning: variety
      deficit → hire agents covering missing transforms (ACO pheromone
      deposition); coherence + low diversity → hire diverse agent (raise PSO
      c1, lower omega) and fire redundant duplicates (ACO evaporation,
      via `swarm_fire`);
      coherence + high diversity + low alignment → assign coordinator
      compound agent (raise PSO c2, Reynolds alignment); loop-break → emit
      reconciliation repair, not a composition change. Mode-agnostic (v2
      §15): operates on the state shape, not the data source. In local mode,
      "hire" means creating the agent card via `swarm_create_local_agent`
      (programmatic) or cloning from ABW via `swarm_clone_to_local` (no
      `swarm_hire_local` tool — §15.1.1 rejected; the team is emergent from
      the call pattern). When ORIENT attributes fault to a specific agent
      (Cybernetic Swarm Plan C6), propose a `reconfigure_agent` move via
      `swarm_generate_prompt` (seeded with the blamed agent's failure log)
      + `swarm_reconfigure_local_agent` (preserves id/type/deps, reloads the
      registry). Respects the
      no-delegation-chains invariant (delegates lose
      delegate_to_agent/execute_agent). References swarm-patterns.yaml for
      the tuning palette.
    generates_spans:
      - reg.skill.swarm-intelligence.decide

  - id: swarm-intelligence/swarm-act
    name: "Emit gated swarm_delegate / swarm_delegate_local with DispatchIntent"
    path: swarm-act.j2
    type: KnowAct
    description: >
      Emit the gated composition change. Mode-aware (v2 §15): in `abw`
      mode, the gate is the consent token from `swarm_request_consent`;
      in `local` mode there is NO funding gate and no consent token — the
      per-dispatch ceiling is the only local bound, and an unfunded or
      negative ledger does not block a delegation. For each proposed delegate, construct a
      DispatchIntent { swarm_id, task, estimated_credits, curator_involved
      (default false), data_shared }. If the operator Aborts, record the
      abort reason and emit no spend. Enforces the .rules "Advertised
      invariants need enforcement points" trap: the gate must actually
      block, not just warn.
    generates_spans:
      - reg.skill.swarm-intelligence.act

  - id: swarm-intelligence/swarm-check
    name: "Re-measure, compute swarm-state distance d, emit next_focus + algedonic"
    path: swarm-check.j2
    type: KnowAct
    description: >
      Re-measure the swarm state post-Act. Mode-aware (v2 §15): in `abw`
      mode, re-fetch workspace + wallet via `swarm_get_swarm`; in `local`
      mode, re-read the local agent registry + ledger balance. Compute the
      convergence metric: composite swarm-state distance d = sqrt(
      (1 - variety_coverage)^2 + max(0, diversity_floor - diversity)^2
      + (1 - loop_closure)^2 ). d = 0 means the target condition is met
      on all three axes. Emit next_focus (which axis dominates d). Emit
      the algedonic signal: in `abw` mode, any 402 or un-acknowledged
      curator dispatch; in `local` mode, a ceiling-exceeded PaymentRequired (NOT an
      insufficient-funds one — local delegation has no funding gate). Vacuous-truth default: zero
      dispatches → loop_closure 1.0 (vacuously satisfied).
    generates_spans:
      - reg.skill.swarm-intelligence.check

  - id: swarm-intelligence/swarm-compose-guide
    name: "Agent/swarm composition authoring + validation guidance"
    path: swarm-compose-guide.j2
    type: KnowAct
    description: >
      Reference/authoring KnowAct for agent and swarm composition. Given a
      composition request (surface: agent|swarm, mode: abw|local, action:
      suggest|validate, plus partial fields), it produces either suggested
      completions for unfilled fields (action=suggest) or a validation
      verdict over the supplied fields (action=validate). Encodes the
      canonical field definitions (name, agent_type, description,
      system_prompt, mission, agents) and the ABW/local backend
      considerations (credit-cost consent-gated catalogue vs local
      operator-funded filesystem registry). Mirrors the inline prompt used
      by the `swarm_ai_assist` MCP tool — this template is the single source
      of truth the panel and the cascade share. Consumed by the DECIDE
      phase when it proposes an `author_agent` move (no catalogue agent
      covers a required transform); also available for standalone
      invocation from the swarm panel.
    generates_spans:
      - reg.skill.swarm-intelligence.compose-guide

  # ── Reference documents (not executable .j2 templates) ──
  - id: swarm-intelligence/swarm-patterns
    name: "Reference: PSO/ACO/Reynolds/Onto4MAT tuning palette for ABW swarms"
    path: swarm-patterns.yaml
    type: RenderAct
    description: >
      Reference: the swarm-algorithm tuning palette mapped onto ABW's
      hire/fire/delegate vocabulary (fire via `swarm_fire` — redundancy
      moves fire duplicates via `swarm_fire`, not flag-for-manual-pruning). PSO velocity terms (c1
      cognitive, c2 social, omega inertia) → ABW composition moves. ACO
      pheromone deposition/evaporation → hire/fire-redundant. Reynolds
      separation/alignment/cohesion → diversity/coordination/coherence.
      Onto4MAT team properties as the measurable substrate. Includes the
      three deficit classes and their tuning responses, plus the canonical
      failure mode (premature convergence / diversity collapse) and its
      detection signal.
