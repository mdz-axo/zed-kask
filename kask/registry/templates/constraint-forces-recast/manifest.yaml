# Template crate manifest for constraint-forces-recast skill
# hKask v0.33.5

crate:
  name: constraint-forces-recast
  version: "0.33.5"
  description: >
    Core generative process for interdisciplinary concept generation. Recasts
    a seed concept from a source ontology A into a target ontology B's constraint
    context via minimal-satisfiability projection (the mutant is the nearest
    model of B to the seed concept, measured by structural delta / graph-edit
    distance). Produces a three-criterion mutant that is (i) expressible in
    A's signature (novel compounds permitted iff compositional — meaning is a
    function of parts per A's existing composition rules, no new axioms),
    (ii) absent from A (not subsumed by any existing A concept), (iii)
    consistent under B's axioms. Generates a relabel control (vocabulary swap
    without axiom application) and compares structural deltas — a valid
    mutant must outperform the relabel on structural delta, discriminating
    constraint-forces (M1) from random perturbation (M2). Runs an evolutionary
    loop over a seed set (from gradient-seeded-recombination or manually
    specified), keeping the Pareto frontier on (novelty, validity,
    cost-inverted) stable for ≥2 iterations. Anchored to Popper falsifiability
    (the three-criterion test is the falsifier), Platt strong inference (the
    relabel control is the discriminating test), and Pearl counterfactuals
    (the relabel is the do(not recast) counterfactual). The forcing operator
    is minimal-satisfiability projection — not entailment (too strong,
    projection not generation) and not bare satisfiability (too weak, doesn't
    discriminate M1 from M2). The weakened thesis T1': constraint-forces
    recasting is *a* mechanism for interdisciplinary *concept generation*,
    distinct from retrieval-and-grounding (evidence assembly, e.g. Elicit)
    and analogy (communication). Does not claim to be the only
    interdisciplinary operation. Scope boundary: translational research moves
    insights into the target vocabulary (translation); CFR keeps the mutant
    in the source vocabulary (recast). Different operations — CFR operates
    within translational steps but does not constitute translation.

templates:
  - id: constraint-forces-recast/cfr-represent
    name: "Represent seed concept as axiom graph"
    path: cfr-represent.j2
    type: KnowAct
    description: >
      Represent the seed concept c as an axiom graph: nodes are c's structural
      elements (classes, properties, relations); edges are the axioms connecting
      them. This is the input to the minimal-satisfiability projection.

  - id: constraint-forces-recast/cfr-violate
    name: "Identify B's axiom violations"
    path: cfr-violate.j2
    type: KnowAct
    description: >
      Identify B's axioms that c violates. For each of B's axioms, check whether
      c's structure satisfies it. Record the violations. If no violations, c
      already satisfies B — the minimal-satisfiability projection is the
      identity (no mutant; the degenerate recast-into-self case).

  - id: constraint-forces-recast/cfr-project
    name: "Minimal-satisfiability projection"
    path: cfr-project.j2
    type: KnowAct
    description: >
      Find the minimal structural modification of c that resolves all
      violations — the mutant m = argmin_{m ∈ Models(B)} Δ(c, m), where Δ is
      graph-edit distance. The minimality is what forces mutation: if c
      already satisfies B, no modification (degenerate); if c violates B, the
      smallest fix is the mutant. This is the forcing operator.

  - id: constraint-forces-recast/cfr-control
    name: "Generate relabel control"
    path: cfr-control.j2
    type: KnowAct
    description: >
      Generate the relabel control: swap c's vocabulary to B's terms without
      applying B's axioms (c → B's root class with c's terms relabeled). This
      is the M2 (random perturbation) control and the do(not recast)
      counterfactual.

  - id: constraint-forces-recast/cfr-three-criterion
    name: "Three-criterion test"
    path: cfr-three-criterion.j2
    type: KnowAct
    description: >
      Check the three criteria: (i) expressible in A's signature (novel
      compounds permitted iff compositional), (ii) absent from A (not
      subsumed by any existing A concept), (iii) consistent under B's axioms.
      This is the falsifier — a mutant that fails any criterion is not a
      three-criterion mutant.

  - id: constraint-forces-recast/cfr-compare
    name: "Compare mutant vs relabel structural delta"
    path: cfr-compare.j2
    type: KnowAct
    description: >
      Compare the mutant's structural delta to the relabel control's
      structural delta. The mutant must have a larger structural delta than
      the relabel. If mutant Δ ≤ relabel Δ, the recast did not mutate — it
      only relabeled. Report falsification of M1 for this cell.

  - id: constraint-forces-recast/cfr-frontier
    name: "Update Pareto frontier"
    path: cfr-frontier.j2
    type: KnowAct
    description: >
      Update the Pareto frontier on (novelty, validity, cost-inverted).
      Novelty = 1 - (max subsumption by A); validity = fraction of B's axioms
      satisfied; cost-inverted = 1 - (rater/reasoner effort, normalized). Merge
      current frontier with newly tested variants, keep non-dominated members,
      prune by crowding distance if frontier exceeds size limit.

