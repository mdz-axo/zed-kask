# Template crate manifest for eqm-improvement skill
# hKask v0.34.0
#
# Improvement instrument for forecast rationales. Reverse-engineers the
# reasoning patterns the 60 EQMs (Karvetski et al. 2026) specify. PDCA loop
# modeled on the metacognition skill's Improvement Kata structure. Composes
# with eqm (measurement) and kata-improvement (forecaster-level learning).

crate:
  name: eqm-improvement
  version: "0.34.0"
  description: >
    Improve a forecast rationale's quality by reverse-engineering the
    reasoning patterns the 60 EQMs (Karvetski et al. 2026) specify.
    Improvement Kata PDCA loop modeled on the metacognition skill: grasp
    current EQM scores, establish marker-level targets, predict which
    intervention will close the gap, experiment (rewrite the rationale),
    re-score, compute marker-space gap, Brier-score the prediction, and
    iterate to convergence. Preserves the forecast probability (alignment
    invariant). Grounds evidence in real sources via delegation to
    superforecasting/research/falsifiability — never fabricates.

templates:
  - id: eqm-improvement/eqm-imp-direction
    name: "Establish improvement direction"
    path: eqm-imp-direction.j2
    type: KnowAct
    description: >
      Kata Step 1 (Direction): establish the improvement direction — improve
      EQM passage rate, prioritizing red-flag elimination over green-flag
      polish. Confirm forecast probability preservation (alignment invariant).
    generates_spans:
      - reg.eqm_imp.direction

  - id: eqm-improvement/eqm-imp-current
    name: "Grasp current EQM scores"
    path: eqm-imp-current.j2
    type: KnowAct
    description: >
      Kata Step 2 (Grasp Current Condition): call market_score_rationale to
      score the current rationale. Receive failing_markers, red_flag_screen,
      composite_score. Measure, don't assume.
    generates_spans:
      - reg.eqm_imp.current

  - id: eqm-improvement/eqm-imp-target
    name: "Set marker-level targets from EQM descriptions"
    path: eqm-imp-target.j2
    type: KnowAct
    description: >
      Kata Step 3 (Establish Target Condition): set marker-level targets
      derived from EQM descriptions (what a 2 looks like). Prioritize red
      flags over green flags per the asymmetric signal.
    generates_spans:
      - reg.eqm_imp.target

  - id: eqm-improvement/eqm-imp-predict
    name: "Predict which intervention raises which marker"
    path: eqm-imp-predict.j2
    type: KnowAct
    description: >
      Kata Step 4 (Make a Prediction): predict which intervention will close
      the gap and by how much. Specific: "intervention X will raise marker Y
      from A to B." Carry confidence in [0,1] for Brier scoring.
    generates_spans:
      - reg.eqm_imp.predict

  - id: eqm-improvement/eqm-imp-experiment
    name: "Rewrite rationale per failing marker (delegates for evidence)"
    path: eqm-imp-experiment.j2
    type: KnowAct
    description: >
      Kata Step 5 (Experiment / Do): rewrite the rationale to address each
      failing marker, guided by the EQM description. Preserves forecast
      probability. Never fabricates evidence — delegates to
      superforecasting/research/falsifiability for real data.
    generates_spans:
      - reg.eqm_imp.experiment
