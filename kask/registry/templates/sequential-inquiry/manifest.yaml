# Template crate manifest for sequential-inquiry skill
# hKask v0.32.0

crate:
  name: sequential-inquiry
  version: "0.32.0"
  description: >
    Dynamic chain-of-thought reasoning engine following the Toyota Improvement
    Kata. Grasps the current understanding, establishes a target, predicts
    which deep-dive delegation will close the gap, runs the engine with
    delegation, and measures convergence deterministically (gap + Brier).
    Delegates to hypothesis-framer, mcda, diagnose, and falsifiability.

templates:
  - id: sequential-inquiry/sequential-inquiry-grasp
    name: "Improvement Kata Step 1: Grasp the current understanding"
    path: sequential-inquiry-grasp.j2
    type: KnowAct
    description: >
      Measure the agent's current understanding of the problem. Produces
      current_artifacts and current_procedure for gap computation.

  - id: sequential-inquiry/sequential-inquiry-target
    name: "Improvement Kata Step 2: Establish the target understanding"
    path: sequential-inquiry-target.j2
    type: KnowAct
    description: >
      Declare the target understanding — what sufficient understanding looks
      like for this problem. Produces target_artifacts and target_procedure.

  - id: sequential-inquiry/sequential-inquiry-predict
    name: "Improvement Kata Step 3: Predict which delegation will close the gap"
    path: sequential-inquiry-predict.j2
    type: KnowAct
    description: >
      Predict which deep-dive delegation will close the gap and by how much.
      Carry a confidence for Brier scoring.

  - id: sequential-inquiry/sequential-inquiry-engine
    name: "Improvement Kata Step 4: Run the inquiry engine with delegation"
    path: sequential-inquiry-engine.j2
    type: KnowAct
    description: >
      Core reasoning engine — advances the chain-of-thought with the predicted
      delegation. Generates, branches, revises, hypothesizes, and verifies.
      Re-measures the current condition after the experiment.

  - id: sequential-inquiry/sequential-inquiry-delegate-hypothesis-framer
    name: "Delegation target — frames a research question / testable hypothesis"
    path: sequential-inquiry-delegate-hypothesis-framer.j2
    type: KnowAct
    description: >
      Delegation target — frames a research question / testable hypothesis
      via FINER + PICO when the engine detects a question-framing subproblem.

  - id: sequential-inquiry/sequential-inquiry-delegate-mcda
    name: "Delegation target — multi-criteria decision analysis"
    path: sequential-inquiry-delegate-mcda.j2
    type: KnowAct
    description: >
      Delegation target — multi-criteria decision analysis when the engine
      detects a choice among alternatives requiring structured tradeoff.

  - id: sequential-inquiry/sequential-inquiry-delegate-diagnose
    name: "Delegation target — disciplined diagnosis loop"
    path: sequential-inquiry-delegate-diagnose.j2
    type: KnowAct
    description: >
      Delegation target — disciplined diagnosis loop when the engine detects
      a bug or regression requiring reproduce → anchor → hypothesize → fix.

  - id: sequential-inquiry/sequential-inquiry-delegate-falsifiability
    name: "Delegation target — eliminative inference engine"
    path: sequential-inquiry-delegate-falsifiability.j2
    type: KnowAct
    description: >
      Delegation target — eliminative inference engine when the engine branches
      on a counterfactual scenario or needs to rule out the untestable.
