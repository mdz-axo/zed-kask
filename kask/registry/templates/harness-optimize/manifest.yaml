crate:
  name: harness-optimize
  version: "0.35.0"
  description: >
    Suite-level test harness proposer. Reads raw execution traces from the
    trace filesystem, identifies under-tested areas via mutation analysis,
    and proposes test improvements. Dispatches to proptest in generate_only
    mode for specific functions. Cannot run tests (terminal disabled).

templates:
  - id: harness-optimize/harness-optimize-identify
    name: "Identify Test Gaps"
    path: harness-optimize-identify.j2
    type: KnowAct
    description: >
      Read trace filesystem for revisions N and N-1. Compare mutation scores,
      failure patterns, and bug-hunt findings to identify under-tested areas.

  - id: harness-optimize/harness-optimize-propose
    name: "Propose Test Improvements"
    path: harness-optimize-propose.j2
    type: KnowAct
    description: >
      Propose a test improvement diff based on the gap analysis. Dispatch to
      proptest in generate_only mode for specific under-tested functions.
      Cite specific trace files as evidence.

  - id: harness-optimize/harness-optimize-report
    name: "Report Proposed Changes"
    path: harness-optimize-report.j2
    type: KnowAct
    description: >
      Structured report of proposed test changes with rationale, evidence,
      and expected impact on mutation score and bug-find rate.