# Media — Stylize & Upscale Pipeline (FlowDef)
# Pre-defined pipeline (OpenMontage pattern): generate a base image, apply an
# artistic style transfer, then upscale. Fixed, known-good topology — the
# FlowDef executor chains tool outputs implicitly (no $references). Invoked via
# action: flowdef from a parent skill.

template_type: FlowDef
name: media_stylize_upscale
version: "1.0.0"
description: >
  Artistic stylization pipeline: generate a base image, apply a style transfer
  to give it a distinct visual treatment, then upscale the result to final
  resolution. Pre-defined multi-step pipeline — the agent supplies the subject
  and the target style; the step topology is fixed.

# primary_model is the model used by the generate step (the generate_image MCP
# tool's default, overridable via HKASK_MEDIA_IMAGE_GEN_MODEL). The stylize
# step routes through the image_apply_style MCP tool's configured model.
primary_model: "fal.ai/flux/dev"

# No fusion block — model selection is operator-configured via kask.fusion /
# HKASK_FUSION_PANEL_MODELS. Recommend the default image generation model
# (HKASK_MEDIA_IMAGE_GEN_MODEL) for the generate step and the fal.ai
# flux/dev img2img endpoint for the style-transfer step.

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

parameters:
  - name: subject
    type: string
    required: true
    description: "What to depict in the base image"
  - name: style
    type: string
    required: true
    description: "Artistic style to apply (e.g. oil painting, watercolor, cyberpunk neon, ukiyo-e)"
  - name: strength
    type: float
    default: 0.7
    description: "Style-transfer strength (0.0–1.0); higher = more stylized"
  - name: scale
    type: integer
    default: 4
    description: "Upscale factor (2 or 4)"

input_type: text
output_type: image_urls
latency: async
cost_tier: high

steps:
  - id: generate
    tool: generate_image
    description: "Generate the base image from the subject description"
    prompt: "{{ subject }}. Clean, well-composed base image suitable for style transfer."

  - id: stylize
    tool: image_apply_style
    description: "Apply the target artistic style to the base image"
    prompt: "Apply {{ style }} style"
    strength: "{{ strength }}"

  - id: upscale
    tool: upscale_image
    description: "Upscale the stylized result to final resolution"
    scale: "{{ scale }}"

# Pipeline (documentation):
# Phase 1: generate_image — base image
# Phase 2: image_apply_style — artistic style transfer
# Phase 3: upscale_image — final resolution
# Return: final stylized, upscaled image URL