# Template crate manifest for principle-constraints skill
# hKask v0.35.0

crate:
  name: principle-constraints
  version: "0.35.0"
  description: >
    Compiles a stated principle into a set of checkable, code-path-anchored
    constraints with named falsifiers. The skill's output is a *proposed*
    constraint set — a human reviews it before it becomes permanent, the
    same gate the paper (Where Agency Actually Lives, Axolotl Partners, 2026)
    demands for everything that touches permanent memory. Each emitted
    constraint carries: an assertion, an enforced_at location (file:line or
    "UNKNOWN — enforcement not located"), a falsifier (test name that must
    exist and pass), and a status (enforced | gap | unverified). The skill
    derives constraints by reading the enforcement code, not just by parsing
    the principle's prose — the manual pass on P1 (conclusions never promoted
    to verified fact) found five constraints in the code where the prose
    suggested two. Constraints without a located enforcement path are
    flagged as gaps; the gap is the skill's highest-value output. Sibling to
    constraint-forces-recast (which generates concepts satisfying a
    constraint set) — this skill generates the constraint set from a
    principle. Anchored to the paper's own discipline: a constraint that
    isn't tied to a code path or a test is Unsourced — tag it, do not promote
    it. The skill applies the verify-before-count-as-fact rule to its own
    output.

templates:
  - id: principle-constraints/principle-derive
    name: "Derive a checkable constraint set from a stated principle"
    path: principle-derive.j2
    type: KnowAct
    description: >
      Take a principle as input (prose statement + source citation) and emit
      a proposed constraint set. Each constraint is test-shaped: assertion,
      enforced_at (file:line or UNKNOWN), falsifier (test name), status
      (enforced | gap | unverified). The template instructs the agent to
      locate enforcement code via grep/codegraph, identify existing tests
      that pin the enforcement, and flag gaps where the principle is
      asserted but enforcement is missing. The output is a proposal — a
      human reviews it before any constraint becomes permanent.

  - id: principle-constraints/principle-verify
    name: "Verify a constraint set against the codebase"
    path: principle-verify.j2
    type: KnowAct
    description: >
      Take a previously-derived constraint set and verify each constraint
      against the current codebase: does enforced_at still point to real
      code? Does the falsifier test still exist and pass? Has the principle
      been weakened or strengthened since the constraint was derived? Emit
      a verification report with per-constraint status and a list of stale
      constraints requiring human review. This is the maintenance mode —
      run on architectural changes to detect constraint drift.