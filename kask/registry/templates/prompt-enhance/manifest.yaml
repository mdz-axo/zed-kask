# Template crate manifest for prompt-enhance skill
# hKask v0.33.3
#
# Streamlined from the former 15-step / 13-template design to a 4-step /
# 4-template single-pass pipeline. The former 7 typed rewrite variants
# (coding/reasoning/creative/classification/extraction/agent-task/meta),
# the collector, and the evolve step are removed — the rewrite is now unified
# into a single template (enhance-rewrite.j2) that performs the audit inline
# and applies type-specific moves based on the classification from step 1.
# enhance-audit.j2 is retained as an unreferenced artifact from the old design
# (it exists on disk and may be referenced by future skills, but the current
# process manifest folds the audit into the rewrite step).

crate:
  name: prompt-enhance
  version: "0.33.3"
  description: >
    General-purpose prompt enhancement skill for prompts destined for the
    zed-kask platform (skill .j2 templates, agent system prompts, chat/REPL
    prompts, infrastructure Jinja2 templates). Typed routing over a 7-type
    prompt taxonomy (coding, reasoning, creative, classification, extraction,
    agent-task, meta) with a 3-tier effort knob (low/medium/high). Single-pass
    pipeline: classify, rewrite (with inline audit), verify (decoupled critic
    at medium/high), output. Default output is the enhanced prompt returned
    inline in a copyable code block; optional file save or both.

templates:
  - id: prompt-enhance/enhance-classify
    name: "Phase 1 — Classify prompt type, select effort tier, synthesize proxy eval set"
    path: enhance-classify.j2
    type: KnowAct
    description: >
      Classify the input prompt against the 7-type taxonomy (coding, reasoning,
      creative, classification, extraction, agent-task, meta) using pragmatic-
      semantics IS/OUGHT + epistemic-mode axes. Select the effort tier
      (low/medium/high) and validate the output_format (inline/file/both,
      default inline). Synthesize a minimal proxy eval set (3-5 representative
      inputs) for medium/high tiers so downstream phases have a signal to
      optimize against. Produces the routing decision that drives step 2.
    generates_spans:
      - reg.prompt-enhance.classify

  - id: prompt-enhance/enhance-rewrite
    name: "Phase 2 — Inline audit + typed rewrite (unified)"
    path: enhance-rewrite.j2
    type: KnowAct
    description: >
      Inline audit + typed rewrite. Scans for unresolved placeholders, semantic
      fragility, and structural accretion, then applies type-specific rewrite
      moves based on the prompt_type from step 1. Folds the former separate
      audit step and 7 typed rewrite variants into a single LLM call. Produces
      the enhanced prompt, audit findings, and mutations applied.
    generates_spans:
      - reg.prompt-enhance.rewrite

  - id: prompt-enhance/enhance-verify
    name: "Phase 3 — Decoupled critic via grill-me self-challenge"
    path: enhance-verify.j2
    type: KnowAct
    description: >
      Decoupled critic. Runs grill-me self-challenge against the enhanced prompt
      across Recall -> Mechanism -> Rationale -> Edge Cases -> Synthesis.
      Decoupled from step 2 to prevent the self-confirming loop. Tier-scaled:
      1 round (Recall+Mechanism) at medium, 3 escalating rounds at high.
      Skipped at low tier. Produces a Solid/Partial/Gap rating per area.
    generates_spans:
      - reg.prompt-enhance.verify

  - id: prompt-enhance/enhance-output
    name: "Phase 4 — Format and deliver the enhanced prompt"
    path: enhance-output.j2
    type: KnowAct
    description: >
      Format the final enhanced prompt per output_format (inline/file/both).
      inline (default): return the prompt in a fenced code block with a
      one-line summary of changes and the audit findings table. file: write
      the prompt to a path the user specifies (or a derived default). both:
      inline + file. Always include a change-log section.
    generates_spans:
      - reg.prompt-enhance.output

  # enhance-audit.j2 is retained from the former multi-step design but is not
  # referenced by the current process manifest (the audit is folded into
  # enhance-rewrite.j2). Kept here so the bootstrap test's source_path check
  # passes and the template remains available for future re-decomposition.
  - id: prompt-enhance/enhance-audit
    name: "Audit prompt health via semantics, cybernetics, essentialist (unreferenced)"
    path: enhance-audit.j2
    type: KnowAct
    description: >
      Audit the input prompt through three lenses: pragmatic-semantics (classify
      claims by IS/OUGHT, epistemic mode, constraint force), pragmatic-cybernetics
      (feedback loop properties), and essentialist (deletion test + surface count).
      Not referenced by the current process manifest — the audit is folded into
      enhance-rewrite.j2. Retained for potential future re-decomposition.
    generates_spans:
      - reg.prompt-enhance.audit
