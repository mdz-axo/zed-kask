# Template crate manifest for graph-audit skill
# hKask v0.31.0
# Merged from codegraph + semantic-graph-audit + zoom-out (context-expansion)

crate:
  name: graph-audit
  version: "0.31.0"
  description: >
    Unified graph analysis templates. Code mode: discover, query, analyze,
    and assemble context from the code graph. Semantic mode: classify, analyze,
    detect, and report on any directed graph's health. Dual mode: both.
    Includes utility templates used by the hkask-mcp-codegraph MCP server.

templates:
  # -- Code mode flow templates (PDCA step-level prompts) --
  - id: graph-audit/code-discover
    name: "Discover and map the target codebase area"
    path: code-discover.j2
    type: KnowAct
    lexicon_terms: [discover, index, map, survey, structure]
    description: >
      Discover and map the target codebase area. Synthesizes index statistics
      and structure overview into a discovery summary with relevant crates
      and entry symbols for further traversal.

  - id: graph-audit/code-query
    name: "Query the code graph for symbols relevant to the goal"
    path: code-query.j2
    type: KnowAct
    lexicon_terms: [query, search, find, locate, identify]
    description: >
      Query the code graph for symbols relevant to the goal. Scores results
      by relevance, identifies traversal targets, and flags gaps.

  - id: graph-audit/code-analyze
    name: "Traverse the dependency graph and run quality analysis"
    path: code-analyze.j2
    type: KnowAct
    lexicon_terms: [traverse, analyze, impact, complexity, dead_code]
    description: >
      Traverse the dependency graph and run quality analysis. Organizes
      results into dependency maps, caller maps, impact analysis, and
      quality findings with fix suggestions.

  - id: graph-audit/code-context
    name: "Assemble token-budgeted context for downstream LLM use"
    path: code-context.j2
    type: KnowAct
    lexicon_terms: [context, assemble, budget, format, package]
    description: >
      Assemble token-budgeted context from gathered analysis results for
      downstream LLM use. Formats symbol definitions, doc comments, and
      key relationships within the specified token budget.

  - id: graph-audit/code-convergence-check
    name: "Compute coverage saturation convergence metric for code mode"
    path: code-convergence-check.j2
    type: KnowAct
    lexicon_terms: [evaluate, converge, classify, verify, assess]
    description: >
      Compute normalized convergence metric for code mode cycles.
      Outputs convergence_metric in [0,1], where 0 means discovery, query,
      traversal, analysis, and context assembly are complete.

  # -- Semantic mode flow templates --
  - id: graph-audit/semantic-classify
    name: "Force-classify every graph edge by constraint hierarchy"
    path: semantic-classify.j2
    type: KnowAct
    lexicon_terms: [classify, enforce, verify, assess, classify]
    description: >
      Force-classify every graph edge by the pragmatic-semantics constraint
      hierarchy (Prohibition > Guardrail > Guideline > Evidence > Hypothesis)
      with provenance and a per-edge rationale.

  - id: graph-audit/semantic-analyze
    name: "Evaluate graph health through four analytical lenses"
    path: semantic-analyze.j2
    type: KnowAct
    lexicon_terms: [analyze, evaluate, synthesize, assess, classify]
    description: >
      Evaluate graph health through four lenses: pragmatic-cybernetics
      (cycle 5-properties, Ashby requisite variety, Good Regulator),
      essentialist (deletion test, surface count, pass-through trace),
      grill-me (5-level gap probe), pragmatic-semantics (force coherence).

  - id: graph-audit/semantic-detect
    name: "Detect structural pathologies from graph topology"
    path: semantic-detect.j2
    type: KnowAct
    lexicon_terms: [detect, identify, classify, assess, verify]
    description: >
      Detect structural pathologies from graph topology: cycles, redundancies,
      gaps, orphans, fan-in/out anomalies, and force/structure mismatches.
      Severity reflects constraint force (a Prohibition cycle is critical).

  - id: graph-audit/semantic-report
    name: "Synthesize graph-health convergence metric and markdown report"
    path: semantic-report.j2
    type: KnowAct
    lexicon_terms: [synthesize, report, converge, evaluate, classify]
    description: >
      Synthesize the classification, four-lens analysis, and structural
      detection into a normalized graph-health convergence metric and a
      readable markdown report.

  # -- Dual mode convergence --
  - id: graph-audit/dual-convergence-check
    name: "Compute combined convergence metric for dual mode"
    path: dual-convergence-check.j2
    type: KnowAct
    lexicon_terms: [evaluate, converge, synthesize, verify, assess]
    description: >
      Compute combined convergence metric for dual mode (code coverage +
      graph health). Both must be sufficient for convergence.

  # -- Utility templates (used by the hkask-mcp-codegraph MCP server) --
  - id: graph-audit/symbol-summarize
    name: "Generate one-sentence summaries of code symbols"
    path: symbol-summarize.j2
    type: KnowAct
    lexicon_terms: [summarize, describe, classify]
    description: Generate one-sentence summaries of code symbols.

  - id: graph-audit/analysis-complexity
    name: "Analyze code complexity metrics for symbols and modules"
    path: analysis-complexity.j2
    type: KnowAct
    lexicon_terms: [analyze, measure, classify]
    description: Analyze code complexity metrics for symbols and modules.

  - id: graph-audit/analysis-dead-code
    name: "Detect dead code and unused symbols"
    path: analysis-dead-code.j2
    type: KnowAct
    lexicon_terms: [analyze, detect, classify]
    description: Detect dead code and unused symbols.

  - id: graph-audit/fix-suggestion
    name: "Generate fix suggestions for code issues"
    path: fix-suggestion.j2
    type: KnowAct
    lexicon_terms: [suggest, propose, fix]
    description: Generate fix suggestions for code issues.

  - id: graph-audit/symbol-embedding
    name: "Generate embeddings for code symbols"
    path: symbol-embedding.j2
    type: KnowAct
    lexicon_terms: [embed, encode, vectorize]
    description: Generate embeddings for code symbols.
