# Registry manifest for lora-training skill
# hKask v0.31.0 (refinement cycle 1)
# goal: Recommend a composable PEFT configuration from declared evidence while preserving operator authority; distinguish recommendation from readiness, and leave enforcement of established hard contracts to the runtime. v0.31.0: evolved from template-by-template invocation into a coordinated flow with mechanical PDCA loop closure, deeper capability reasoning over the full harness×trainer×host×cost space, prior-training-history consumption (Good Regulator), algedonic escalation, and honest convergence metrics.

crate:
  name: lora-training
  version: "0.31.0"
  visibility: public
  description: >
    LoRA/QLoRA training configuration and contract enforcement skill for
    hKask. Produces a composable PEFT recommendation via a deterministic
    8-gate refinement (adapter purpose, dataset analysis, inference
    constraint, memory budget, task distance, quality/cost trade-off, knowledge
    preservation, harness capability) — not a search (AutoPEFT-style BO is
    infeasible per training job).
    Training approach selection (G0-G5) precedes harness selection (G6) — the
    harness is selected based on its capability to efficiently process the
    declared dataset and produce the adapter type implied by G0. PDCA iteration
    loop: select-method → audit-config → convergence-check → revise → re-invoke.
    The skill recommends; the operator accepts, overrides, or rejects; the
    runtime enforces established hard contracts. Enforces the LoRA/QLoRA math
    contracts as quality gates: no-op-at-init invariant, merge
    equivalence, scaling form (α/r or α/√r), rank budget, trainable
    param count, frozen-base quantization, adapter dtype, gradient flow,
    no silent fp32 upcast, NF4 optimality, dataset size vs quality,
    eval protocol, lemon-pick analysis, intruder dimensions, knowledge
    preservation, harness-method compatibility. Anchored to LoRA
    (arXiv:2106.09685), QLoRA (arXiv:2305.14314), rsLoRA
    (arXiv:2312.03732), DoRA (arXiv:2402.09353), PiSSA
    (arXiv:2404.02948), LoRA-GA (arXiv:2407.05000), CorDA, EVA, Razin
    et al. intruder dimensions (arXiv:2410.21228), PEFT v0.19.0 config
    surface, and TRL v1.8.0 trainer taxonomy (SFTTrainer, DPOTrainer,
    KTOTrainer, ORPOTrainer, RewardTrainer — all implemented), and Ludwig
    v0.17 trainer taxonomy (SFT, DPO, KTO, ORPO, GRPO via trainer.type).
    Consumes security/regressions/ as input; proposes RR entries with surface:
    training. Emits reg.lora.* spans (P9). Decomposed into 4 phases:
    select-method → audit-config → report → convergence-check.

templates:
  - id: lora-training/preflight-dataset
    name: "Dataset format compatibility preflight with mapping code emission"
    path: preflight-dataset.j2
    type: KnowAct
    lexicon_terms: [detect, validate, format, dataset, mapping, compatibility]
    description: >
      v0.32.0: Detect dataset format, check compatibility against the expected
      format for the selected trainer/method, and emit copy-paste Python mapping
      code when a fixable column-name mismatch is found. Mirrors HF's
      dataset_inspector.py three-state pattern (Ready / NeedsMapping /
      Incompatible). Optional — skipped when dataset_path is absent. This is the
      runtime-evidence source for G-D0.

  - id: lora-training/select-method
    name: "Recommend composable PEFT configuration via 8-gate refinement with capability reasoning"
    path: select-method.j2
    type: KnowAct
    lexicon_terms: [select, decide, gate, method, config, training, harness, purpose, map]
    description: >
      Apply a deterministic 8-gate refinement without overwriting earlier
      constraints or operator requirements. v0.31.0: G6 reasons over the full
      capability space (3 harnesses × 6 trainers × 3 hosts × cost models) when
      provider_capabilities is supplied. G2 and G3 refine using
      prior_training_history when supplied (Good Regulator compliance). Consumes
      prior_iteration when present (mechanical PDCA loop closure via manifest).

  - id: lora-training/audit-config
    name: "Audit training config with algedonic escalation and citation enforcement"
    path: audit-config.j2
    type: KnowAct
    lexicon_terms: [audit, verify, gate, contract, evidence, config, harness, escalate]
    description: >
      Read training config, harness, runtime, and post-training evidence.
      Evaluate the applicable subset of 19 quality gates. v0.31.0: emits
      refuse_escalation for refuse findings (algedonic S1→S5 short-circuit)
      and rejects findings with config_value/code_presence/code_absence
      evidence_kind but null config_path/line (no-fiction enforcement,
      mechanical not voluntary). Consumes dataset_profile from G-D0 for G-D1
      dataset size/quality assessment. v0.32.0: consumes runtime_metrics for
      G-R1 runtime alert assessment (loss spikes, NaN gradients, vanishing
      loss) when supplied. v0.32.0: G-P1 persistence preflight verifies
      HuggingFace artifact persistence is configured before submit on
      ephemeral cloud hosts.

  - id: lora-training/report
    name: "Synthesize training-config findings and propose regressions"
    path: report.j2
    type: KnowAct
    lexicon_terms: [synthesize, report, regression, severity, gate, training]
    description: >
      Synthesize audit findings with concrete config evidence, source
      citations (arXiv paper sections + PEFT v0.19.0 doc sections),
      severity (critical/high/medium/low), gate ID, and remediation.
      Propose RR-NNNN.yaml entries with surface: training for CI-enforced
      config gates. Preserve the normalized Finding schema, identify contract
      gaps, and separate recommendation from phase-aware readiness. Produce
      verdicts from evidence-backed states without reclassifying findings.
