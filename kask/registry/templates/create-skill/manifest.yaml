# Template crate manifest for create-skill skill
# hKask v0.31.0

crate:
  name: create-skill
  version: "0.31.0"
  description: >
    Create a new kask skill as a complete registry crate: manifest.yaml +
    .j2 templates + process manifest (FlowDef with gas/rjoule/convergence
    blocks) + SKILL.md companion. Overrides the built-in Zed create-skill
    which only produces SKILL.md files. The kask-native version produces
    the full registry-first structure: template manifest with
    KnowAct/WordAct/FlowDef/RenderAct types, .j2 templates with [inference]
    frontmatter (contract, energy_cap, visibility
    generates_spans), process manifest with canonical actions
    (select/populate/compute/execute/feedback/validate/retrieve/render/
    flowdef/loop/choice/abort/escalate), gas/rjoule budgets, convergence
    block, OCAP capabilities, and the SKILL.md companion derived from the
    registry crate. Delegates to skill-maintenance-build for the
    mechanical scaffolding and skill-maintenance-validate for post-creation
    validation. Decomposed into phased templates: Describe → Scaffold →
    Validate → Convergence. Emits reg.create_skill.* spans. Any userpod
    may invoke this skill.

templates:
  - id: create-skill/create-skill-describe
    name: "Capture skill purpose, name, PDCA phases, delegates, span namespace"
    path: create-skill-describe.j2
    type: KnowAct
    description: >
      Capture the skill's purpose from the user's natural-language
      description. Choose a name (lowercase, hyphenated, 2-40 chars
      verb-noun or noun-noun, no reserved prefixes). Identify the PDCA
      phases the skill will have (most follow the bug-hunt pattern: a
      phased pipeline with feedback loop closure). Identify which skills
      this skill will compose (delegates). Identify the per-template span
      namespace (reg.<skill_name>.<phase>, ontology-derived); the ledger
      span_namespace is deterministic (reg.skill.<manifest.id>) and injected
      by the scaffold phase.
    generates_spans:
      - reg.create_skill.describe

  - id: create-skill/create-skill-scaffold
    name: "Generate full registry crate (manifest + templates + process manifest + SKILL.md)"
    path: create-skill-scaffold.j2
    type: KnowAct
    description: >
      Generate the full registry crate structure. Delegates to
      skill-maintenance-build for the mechanical scaffolding. Produces:
      (1) template manifest (kask/registry/templates/<name>/manifest.yaml)
      with crate metadata and template entries; (2) .j2 templates with
      [inference] frontmatter (template_type, contract
      energy_cap, visibility, generates_spans); (3) process manifest
      (kask/registry/manifests/<name>.yaml) with canonical actions
      gas/rjoule/convergence blocks, OCAP capabilities; (4) SKILL.md
      companion (.agents/skills/<name>/SKILL.md) derived from the registry
      crate.
    generates_spans:
      - reg.create_skill.scaffold

  - id: create-skill/create-skill-validate
    name: "Validate scaffolded crate against R1-R12, Z1-Z8, X1-X4, E1-E11"
    path: create-skill-validate.j2
    type: KnowAct
    description: >
      Validate the scaffolded crate against all check categories.
      Delegates to skill-maintenance-validate (its check catalog is
      authoritative — this template mirrors it). Checks: R1-R12 (registry:
      manifest exists, crate metadata, templates non-empty, template entry
      valid, template_type, contract, energy_cap range, visibility, .j2
      exists, [inference] frontmatter, jinja2 body); Z1-Z8 (companion:
      SKILL.md exists, frontmatter, name matches directory, description
      present, no Magna Carta violations, headless, no deprecated markers,
      derived from registry); X1-X4 (cross-artifact: registry exists, no
      orphan SKILL.md, no drift, bidirectional name match); E1-E11 (executor
      compliance: canonical actions, gas block + cap adequate, rjoule block,
      convergence block, category valid, template_refs resolvable,
      sub-manifest budgets, step description, ordinal sequence,
      ledger.span_namespace == reg.skill.<manifest.id> with no abolished
      spans: list). Produces fix suggestions for any failures.
    generates_spans:
      - reg.create_skill.validate
