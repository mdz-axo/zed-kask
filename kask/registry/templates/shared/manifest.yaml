# Shared template crate manifest
# hKask v0.33.0
#
# The shared convergence-check template has been removed. Convergence is now
# gated solely by the ConvergenceTracker (kask/crates/hkask-templates/src/
# convergence.rs), which reads the convergence signal pushed by each manifest's
# loop step via the `convergence_signal:` binding. The former
# `kata.convergence_check` compute primitive was removed — it was a dead
# diagnostic whose output was read by zero loop-gating paths. The shared Lisp
# invariant macros (lisp-invariants.j2) provide reusable `lisp.eval` form
# strings for skills that need deterministic structural checks (count,
# completeness, diversity, duplicates) on LLM-generated structured output.

crate:
  name: shared
  version: "0.33.0"
  description: >
    Shared templates used across multiple skill PDCA flows. Contains reusable
    Lisp invariant-check macros (lisp-invariants.j2) for `compute_ref: lisp.eval`
    steps — skills `{% include %}` the macro file and call the named macro to
    emit a validated Lisp `form:` string. The old convergence-check template has
    been removed — convergence is gated by the ConvergenceTracker, which reads
    the `convergence_signal:` binding from each manifest's loop step.

templates:
  - id: shared/lisp-invariants
    name: "Reusable Lisp invariant-check macros"
    path: lisp-invariants.j2
    type: RenderAct
    description: >
      Jinja macro library emitting Lisp `form:` strings for `lisp.eval` compute
      steps. Macros: `hypothesis_four_invariants` (count + completeness +
      diversity + duplicates for hypothesis sets), `field_completeness` (check
      named keys present on every item in a list), `count_in_range` (list length
      within bounds). Validated by the
      `dispatch_lisp_eval_hypothesis_four_invariants` test in
      kask/crates/hkask-templates/src/compute.rs. Skills `{% include %}` this
      file and call the macro in their `form:` field.
