# Template crate manifest for upstream-rebase skill
# hKask v0.33.7

crate:
  name: upstream-rebase
  version: "0.33.7"
  description: >
    Manage upstream Zed rebases for zed-kask. Decides per-D-seam-file strategy
    (git merge vs. mapped re-application), executes the chosen strategy, pins
    every kask-wiring deviation with a test, and updates DIVERGENCE.md. For
    divergent files, uses mapped re-application: extract the functional
    inventory, classify by constraint force, build the dependency DAG, re-apply
    onto clean upstream in topological order, and pin every unit with a test.

templates:
  - id: upstream-rebase/assess
    name: "Assess a D-seam file against the strategy decision rule"
    path: assess.j2
    type: KnowAct
    description: >
      Assess a D-seam file against the strategy decision rule. Extract line
      counts, kask call site count, marker count. Recommend merge vs. mapped
      re-application.
    generates_spans:
      - reg.upstream_rebase.assess

  - id: upstream-rebase/map
    name: "Extract functional inventory, classify by constraint force, build DAG"
    path: map.j2
    type: KnowAct
    description: >
      Extract the functional inventory (F1, F2, ...), classify each unit by
      constraint force, and build the dependency DAG.
    generates_spans:
      - reg.upstream_rebase.map

  - id: upstream-rebase/decide
    name: "Apply essentialist deletion test: full re-application vs. surgical marking"
    path: decide.j2
    type: KnowAct
    description: >
      Apply the essentialist deletion test: is full re-application necessary,
      or is surgical marking + pinning sufficient?
    generates_spans:
      - reg.upstream_rebase.decide

  - id: upstream-rebase/execute
    name: "Execute the chosen strategy: surgical marking or full re-application"
    path: execute.j2
    type: KnowAct
    description: >
      Execute the chosen strategy: add markers + pinning tests (surgical), or
      re-apply onto clean upstream in topological order (full re-application).
    generates_spans:
      - reg.upstream_rebase.execute

  - id: upstream-rebase/document
    name: "Update DIVERGENCE.md and produce the final report"
    path: document.j2
    type: KnowAct
    description: >
      Update DIVERGENCE.md and produce the final report.
    generates_spans:
      - reg.upstream_rebase.document