# Template crate manifest for replica skill
# hKask v0.31.0

crate:
  name: replica
  version: "0.31.0"
  description: >
    Replica corpus configuration generator. Produces corpus.yaml files for
    three replica classes: academic (discovered works), literary (public-domain
    texts), and exemplar/theme (mixed sources serving a domain or theme).
    Each class template extends corpus-base.j2 and carries ontology links
    (PKO, ESO, GOLEM, Dublin Core, FIBO) as structured comments. Output is
    validated against CorpusConfig via #[serde(deny_unknown_fields)] and
    parse tests in hkask-mcp-corpus.

templates:
  - id: replica/corpus-base
    name: "Shared scaffolding for all replica corpus.yaml generators"
    path: corpus-base.j2
    type: KnowAct
    lexicon_terms: [scaffold, shared, base]
    description: >
      Base template included by academic-corpus, literary-corpus, and
      exemplar-corpus. Emits the CorpusConfig fields common to all replica
      classes (author, embedding, chunking, validation, budget, entities,
      methods). Not rendered directly — extended by class templates.

  - id: replica/academic-corpus
    name: "Generate a corpus.yaml for an academic author replica"
    path: academic-corpus.j2
    type: KnowAct
    lexicon_terms: [catalog, document, synthesize]
    description: >
      Generates a corpus.yaml for an academic author replica from discovered
      academic works (Semantic Scholar, arXiv, web, YouTube transcripts).
      Ontology: PKO (process), ESO (epistemic), Dublin Core (document type).
      Budget: PerPage. corpus_type: "academic".

  - id: replica/literary-corpus
    name: "Generate a corpus.yaml for a literary author replica"
    path: literary-corpus.j2
    type: KnowAct
    lexicon_terms: [compose, narrate, embed]
    description: >
      Generates a corpus.yaml for a literary author replica from public-domain
      works (Gutenberg novels, essays, plays) and hand-curated foundational
      rules (critical essays, style manifestos). Ontology: GOLEM (narrative
      devices), Dublin Core (bibo:Book). Budget: Flat. corpus_type: "literary".

  - id: replica/exemplar-corpus
    name: "Generate a corpus.yaml for an exemplar/theme replica"
    path: exemplar-corpus.j2
    type: KnowAct
    lexicon_terms: [exemplify, theme, dimension]
    description: >
      Generates a corpus.yaml for a thematic replica — a literary or
      mixed-source corpus serving a specific domain or theme (e.g.,
      docs-as-code, capabilities research). Carries the full quality-dimension
      scaffolding (dimension_centroids, tag_sets, tag_weights). Budget shape
      is flexible: "absolute" (default), "flat", or "per_page". Ontology:
      Dublin Core, PKO, FIBO (if investment), ESO (if research), GOLEM (if
      literary). corpus_type: "literary" (hybrid).

  - id: replica/compound-corpus
    name: "Generate a corpus.yaml for a compound/mashup replica"
    path: compound-corpus.j2
    type: KnowAct
    lexicon_terms: [compose, mashup, blend]
    description: >
      Generates a corpus.yaml for a compound replica — a combination of two
      or more authors whose perspectives or styles are complementary. Supports
      three mashup strategies: mixture_of_experts (each author contributes a
      different structural layer), weighted_blend (authors blended by dimension
      weights), contrastive (authors at opposite ends of a quality axis). Works
      are grouped by contributor. Ontology: Dublin Core, GOLEM, PKO, FIBO, ESO.

  - id: replica/validate-corpus
    name: "Validate a generated corpus.yaml against the CorpusConfig contract"
    path: validate-corpus.j2
    type: KnowAct
    lexicon_terms: [validate, check, conform]
    description: >
      Validates a generated corpus.yaml against the CorpusConfig contract.
      Parses the rendered YAML via EmbedService::parse_config and reports
      parse success/failure, field coverage, and a convergence metric. This
      is the automated Check phase of the replica discovery PDCA loop.

  - id: replica/extract-concepts
    name: "Extract key concepts, places, and events from academic paper metadata…"
    path: extract-concepts.j2
    type: KnowAct
    lexicon_terms: [extract, classify, distill]
    description: >
      Extract key concepts, places, and events from academic paper metadata
      with semantic deduplication. Identifies recurring themes across
      an author's body of work.

  - id: replica/infer-methods
    name: "Infer methodological and stylistic patterns from representative…"
    path: infer-methods.j2
    type: KnowAct
    lexicon_terms: [infer, recognize, analyze]
    description: >
      Infer methodological and stylistic patterns from representative
      passages of an author's work. Produces method descriptions with
      optional stylometric signal thresholds.
