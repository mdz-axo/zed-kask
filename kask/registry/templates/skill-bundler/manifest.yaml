# Template crate manifest for skill-bundler skill
# hKask v0.35.0

crate:
  name: skill-bundler
  version: "0.35.0"
  description: >
    Run peer-level skills concurrently and merge their outputs into a single
    unified report. The bundler dispatches each skill in parallel, collects
    results, and synthesizes them — no iterative composition or convergence
    loop.

templates:
  - id: skill-bundler/bundler-merge
    name: "Merge parallel skill outputs into a unified report"
    path: bundler-merge.j2
    type: KnowAct
    description: >
      Merge the outputs of N concurrently-executed skills into a single
      cohesive report with per-skill summaries, cross-skill insights,
      conflict surfacing, and prioritized recommendations.