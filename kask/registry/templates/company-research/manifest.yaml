# Template crate manifest for company-research skill
# hKask v0.35.0
# Design: kask/docs/plans/efra-ai-to-kask-company-research-skill.md
#
# 14 templates mapping the 13 EFRA-AI agents (07 CATALOG eliminated — it is a
# classification utility not in pipeline.ts) plus two v0.35.0 additions:
# falstaffian-competitive-rotation (step 7) and economic-trajectory (step 11).
# The crate backs two flowdef manifests: company-research-flash (SCOUT → ... →
# LENS) and company-research-deep (COMPANY → FALSTAFFIAN → GORILLA →
# ECONOMIC TRAJECTORY → IMAGINE → THESIS).
#
# Three templates are DEEPEN agents (INTEL, VALUATION, COMPANY): they
# orchestrate native `action: execute` MCP tool calls in the flowdef and only
# do LLM synthesis over the tool outputs that arrive via input_mapping. The
# MCP tool calls themselves are NOT in the templates — they are first-class
# flowdef steps (see kask/docs/explanation/skill-mcp-integration.md).
#
# Cross-skill composition: the flash flowdef reuses `listening/apply-template`
# (step 3) and `kata-improvement/improvement-step1-direction` (step 9c) via
# `template_ref` — the same pattern superforecasting uses for
# `falsifiability/falsifiability-hypothesize`. The deep flowdef reuses
# `goal-analysis/judge` (step 14) and the falstaffian-competitive-rotation /
# economic-trajectory templates (steps 7, 11) which are cross-skill
# compositions anchored to the metacognition/falstaffian reference documents.

crate:
  name: company-research
  version: "0.35.0"
  description: >
    Equity research pipeline converted from EFRA-AI (Replicant-Partners).
    Two flowdefs: company-research-flash (SCOUT → INTEL → FORENSIC × 2 →
    CRITICAL FACTOR → VALUATION → COMMUNICATION → KATA → LENS) producing a
    flash note / initiation report, and company-research-deep (COMPANY →
    FALSTAFFIAN → GORILLA → ECONOMIC TRAJECTORY → IMAGINE → THESIS)
    producing a deep company analysis and investment thesis. The deep
    pipeline applies Falstaffian perspective rotation to the competitive
    framing before GORILLA scores it (structural defense against frame
    capture), and anchors IMAGINE on an economic trajectory probe
    (falling costs, Coasean shifts, Kauffman adjacent possible) that is
    challenged by the Falstaffian rotations. MCP tool calls
    (dcf_valuation, comparable_analysis, expectations_gap,
    scenario_impact_valuation, market_check_resolutions,
    market_calibration, market_cmp, evaluate_evidence,
    company_transcript, scenario_build, web_search, fetch) are native
    `action: execute` flowdef steps; templates do LLM synthesis over their
    outputs.

templates:
  # ── Flash pipeline (01–09) ──
  - id: company-research/scout-alpha-score
    name: "SCOUT — coverage universe optimizer (alpha score + excellence universe)"
    path: scout-alpha-score.j2
    type: WordAct
    description: >
      Agent 01 SCOUT. Computes the firm-specific alpha score (coverage gap ×
      0.30 + market cap fit × 0.20 + sector relevance × 0.25 + valuation
      anomaly × 0.25, plus EM GDP / Bessembinder / low-coverage bonuses up to
      +25) and applies the 11-criterion excellence universe (S1–S11) where
      `in_excellence_universe` is true. Emits `decision` (MUST_COVER /
      REVIEW_ZONE / DROP), `alpha_score`, `horizon_tag`, `downstream_mode`
      (valentine / gunn / dual). DROP is a terminal early-exit gate.

  - id: company-research/intel-mosaic
    name: "INTEL — business context + information mosaic (DEEPEN)"
    path: intel-mosaic.j2
    type: WordAct
    description: >
      Agent 02 INTEL (DEEPEN). Business-context 8-step + information mosaic.
      Consumes `research_search` and `web_search` MCP tool outputs (bound
      via input_mapping from prior `execute` steps in the flowdef) and the
      `listening/apply-template` earnings-call verdict (cross-skill step 3).
      Emits `mosaic_clear` (false = MNPI HALT terminal gate), `business_model`,
      `news_items`, `hypotheses` (PENDING / VALIDATED / UNRESOLVABLE
      lifecycle), `data_gaps`. Per .rules: failed MCP tools surface as
      `data_gaps` entries, never collapse to None.

  - id: company-research/forensic-pre-screen
    name: "FORENSIC — quick risk pre-screen (SEV-1..5)"
    path: forensic-pre-screen.j2
    type: WordAct
    description: >
      Agent 04 FORENSIC (pre-screen). Quick risk pre-screen across accounting
      red flags, governance, going-concern signals. Emits `severity` (SEV-1
      minor → SEV-5 fraud/restatement), `recommendation` (CLEAR+adj /
      CONDITIONAL / BLOCK), `eps_haircut`, `dr_add_bps`. BLOCK is a terminal
      early-exit gate. FORENSIC cannot be skipped (EFRA-AI invariant).

  - id: company-research/critical-factor
    name: "CRITICAL FACTOR — Bull/Base/Bear thesis engine"
    path: critical-factor.j2
    type: WordAct
    description: >
      Agent 03 CRITICAL FACTOR. Identifies the 3–5 critical factors that drive
      the business and constructs Bull / Base / Bear scenarios with EPS
      impact. Consumes `scenario_build` MCP tool output (bound via
      input_mapping) for structured scenario generation. Emits `factors`
      (empty = DROP terminal gate), `scenarios` (bull/base/bear with
      probabilities and EPS impact), `eps_impact_pct`. Cross-references
      `superforecasting/stage_3_probability_estimate` methodology for
      granular (0.35) vs round (0.50) probabilities.

  - id: company-research/forensic-full
    name: "FORENSIC — full audit (accruals, governance, management)"
    path: forensic-full.j2
    type: WordAct
    description: >
      Agent 04 FORENSIC (full). Full audit: accruals quality, governance
      (board independence, COB/CEO separation), management profile (owner-
      operator, capital allocation track record). Consumes
      `company_transcript` MCP tool output for management quotes. Emits
      `severity`, `recommendation` (BLOCK terminal gate), `management_quality`,
      `governance_score`, `accruals_score`. FORENSIC cannot be skipped.

  - id: company-research/valuation-8step
    name: "VALUATION — 8-step price target synthesis (DEEPEN)"
    path: valuation-8step.j2
    type: WordAct
    description: >
      Agent 05 VALUATION (DEEPEN). 8-step price target engine. Synthesizes
      over four native `execute` MCP tool outputs bound via input_mapping:
      `dcf_valuation` (7a), `comparable_analysis` (7b), `expectations_gap`
      (7c), `scenario_impact_valuation` (7d). Emits `pt_12m`, `rr_ratio`,
      `rating` (BUY/HOLD/UNDERPERFORM), `FaVeS` (variant expectations score),
      `confidence`, `data_gaps` (names any failed MCP tool with LLM-derived
      fallback estimate + confidence penalty per EFRA-AI L1/L2 fallback
      hierarchy). RR < 2:1 + UNDERPERFORM = DROP terminal gate.

  - id: company-research/communication-enter
    name: "COMMUNICATION — ENTER gate + CASCADE note"
    path: communication-enter.j2
    type: WordAct
    description: >
      Agent 06 COMMUNICATION. ENTER gate (Edge / New / Timely / Examples /
      Revealing — 5/5 = PUBLISH, 4/5 = ALERT, ≤3/5 = DROP) and CASCADE-format
      research note (Conclusion → Action → Scenarios → Catalysts → Data).
      Emits `publication_possible`, `enter_score`, `cascade_note`,
      `final_confidence`. Confidence < 0.50 = NO_PUBLISH (EFRA-AI invariant).

  - id: company-research/lens-five-frameworks
    name: "LENS — five-framework consistency audit"
    path: lens-five-frameworks.j2
    type: KnowAct
    description: >
      Agent 09 LENS. Consistency auditor. Applies the firm's five
      intellectual frameworks: Lens 1 The Loop (economic potential,
      technological capability, variant expectations, valuation anchor
      Value = Profits / (r − g), target return > 12%, max P/E < 25×), Lens 2
      Superforecasting (granular probabilities, inside/outside view balance,
      clashing forces, observable invalidation — cross-references
      `market_cmp` outside view), Lens 3 Dunning-Kruger (process_confidence
      vs final_confidence gap, overconfidence risk flag), Lens 4 Hidden
      Champions (Simon 8 characteristics), Lens 5 Kauffman / Adjacent Possible
      (ergodic vs nonergodic, new niches, Darwinian preadaptations). Emits
      `overall_verdict` (CONSISTENT / PARTIAL / INCONSISTENT), `key_tensions`,
      `pm_memo` (200 words). Never blocks publication.

  # ── Deep pipeline (10–13) + v0.35.0 additions ──
  - id: company-research/company-8part
    name: "COMPANY — deep 8-part company analysis (DEEPEN)"
    path: company-8part.j2
    type: WordAct
    description: >
      Agent 13 COMPANY (DEEPEN). Deep 8-part company analysis: Self-View,
      Business Franchise, Management Skill (CEO long-term + CFO working
      capital scorecards), Financial Profile (signposts + 3-stage valuation),
      Invisible Layer, Turd Blossom, Value Gorilla Elevator Pitch,
      Investment Thesis Statement. Consumes `company_transcript`,
      `dcf_valuation`, `comparable_analysis`, `web_search`, `fetch` MCP tool
      outputs (bound via input_mapping from prior `execute` steps). Emits
      `CompanyBoard` with all 8 sections, `data_gaps`.

  - id: company-research/falstaffian-competitive-rotation
    name: "FALSTAFFIAN — competitive perspective rotation (v0.35.0)"
    path: falstaffian-competitive-rotation.j2
    type: KnowAct
    description: >
      v0.35.0 addition. Rotates the competitive framing of the Company
      Board before GORILLA scores it. Applies Falstaffian semantic rotation
      shapes (predicate hollow, subject expansion, object inversion,
      direction reversal) to expose framing errors in the analyst
      narrative. Emits rotated_board with competitor-complement analysis,
      market creator vs participant classification (Wardley evolution
      axis), framing errors detected, and rotated competitive position.
      Anchored to MAIA "Falstaff: Give Me Life", "Competition: Readings
      vs Reality", "Company Analysis", "Thinking Like an Owner".
      Cross-references metacognition/falstaffian-perspective-engine shapes
      and decision tree.

  - id: company-research/gorilla-4dim
    name: "GORILLA — Value Gorilla 4-dimension framework"
    path: gorilla-4dim.j2
    type: WordAct
    description: >
      Agent 10 GORILLA. Value Gorilla 4-dimension framework with fixed
      methodology weights (Obvious Problem 25% / Invisible Gorilla 30% /
      Combinatorial Solution 25% / Choke Point 20%). Weights are fixed by
      firm methodology — NOT user-tunable, so mcda was rejected (essentialist
      Surface gate: adds ceremony for fixed weights). Scoring is a
      `lisp.eval` compute step in the flowdef, not an mcda call. In v0.35.0,
      GORILLA consumes the ROTATED board (from falstaffian-competitive-
      rotation), not the raw Company Board — the rotation corrects framing
      errors before scoring. Emits `gorilla_score`, `verdict` (GORILLA ≥75 /
      SMALL_ANIMAL 50-74 / PEDESTRIAN <50), per-dimension scores.

  - id: company-research/economic-trajectory
    name: "ECONOMIC TRAJECTORY — falling-cost / Coase / adjacent possible (v0.35.0)"
    path: economic-trajectory.j2
    type: KnowAct
    description: >
      v0.35.0 addition. Economically-anchored imagination scaffold.
      Identifies the falling-cost trajectory in the subject's industry
      (McAfee dematerialization), the design constraint being removed
      (MAIA bottleneck framework), the Coasean firm-boundary shifts
      (Kauffman economic web), the Kauffman adjacent possible nodes
      (never-before-born goods and services, Darwinian preadaptations),
      and convergence vectors (Diamandis). Emits economic_trajectory
      with falling_cost, constraint_being_removed, coasean_shifts,
      adjacent_possible_nodes, convergence_vectors, implications_for_
      subject, trajectory_velocity. IMAGINE consumes this as the anchor
      for its 5/10/20Y scenarios. Anchored to MAIA "Focus and
      Imagination", "More From Less", "Kauffman Readings", "The Future
      Is Faster", "Bottlenecks and Critical Mass", "Time Horizons".

  - id: company-research/imagine-longrange
    name: "IMAGINE — 5/10/20Y scenarios anchored on economic trajectory (v0.35.0)"
    path: imagine-longrange.j2
    type: WordAct
    description: >
      Agent 11 IMAGINE. Projects the business at 5, 10, 20 years and walks
      it back analytically. Digital Transformation Stages (MODEL / SHADOW /
      TWIN / SOURCE), Growth Driver Classification (innovation / demographic
      / both / neither). In v0.35.0, scenarios are ANCHORED on the economic
      trajectory probe (falling cost, constraint removal, adjacent
      possible) and CHALLENGED by the Falstaffian rotations (rotated
      competitive framing, framing errors detected). Consumes
      `scenario_build` MCP tool output and the `economic_trajectory` probe.
      Emits `ImagineBoard` with digital stage, growth driver, 3 scenarios
      (each with trajectory_anchor and falstaffian_challenge), 3–5
      falsifiable predictions (tagged by horizon, each with trajectory_
      basis), what's not on the page (anchored on adjacent possible),
      what's not in the price (anchored on trajectory implications),
      trajectory_anchoring, falstaffian_challenge.

  - id: company-research/thesis-three-pillars
    name: "THESIS — three-pillar investment thesis synthesis"
    path: thesis-three-pillars.j2
    type: KnowAct
    description: >
      Agent 12 THESIS. Synthesizes all prior research into a formal
      investment thesis covering the three pillars: Business Franchise (moat
      strength, value creation, durability), Management Quality (capital
      allocation, leadership), Valuation (3-stage: consensus →
      normalization → terminal). Quality gate verdict
      `investment_grade` / `needs_work` / `incomplete` is the deep pipeline
      convergence signal. Per .rules (LLM-improves-against-LLM-scored-target
      trap): the quality gate uses `goal-analysis` semantic evaluation, not
      self-assessment — wired as a cross-skill `select` step in the flowdef,
      not inside this template.

  # ── Cross-skill adapter templates (v0.36.0) ──
  # Thin adapters that compose a perspective skill's reusable template into
  # the equity-research context. Each adapter carries an equity-research
  # contract (input/output schema) and delegates the methodology to the
  # upstream skill's template via prompt structure. They do NOT re-implement
  # the upstream skill — they specialize it.

  - id: company-research/intel-semantic-classify
    name: "INTEL — pragmatic-semantics certainty classification (v0.36.0)"
    path: intel-semantic-classify.j2
    type: KnowAct
    description: >
      v0.36.0 cross-skill adapter. Adapts pragmatic-semantics/
      semantics-classify-statement to the INTEL mosaic. Classifies every
      news_item and hypothesis by ontological mode (IS/OUGHT), epistemic
      mode (declarative/probabilistic/subjunctive), constraint force, and
      provenance — BEFORE downstream steps consume the intel. Prevents
      certainty-level drift: a management quote treated as an ontological
      fact, a scenario treated as a forecast. Emits semantic_tags and
      certainty_drift_risk that downstream templates (forensic, critical-
      factor, valuation) consume via intel_bundle.semantic_tags.

  - id: company-research/gorilla-capability-reason
    name: "GORILLA — capabilities-reasoner floor/ceiling/maturity (v0.36.0)"
    path: gorilla-capability-reason.j2
    type: KnowAct
    description: >
      v0.36.0 cross-skill adapter. Adapts capabilities-reasoner/
      capability-reason to the GORILLA 4-dim framework. Types each GORILLA
      dimension (Obvious Problem, Invisible Gorilla, Combinatorial Solution,
      Choke Point) against a capability registry with floor, ceiling, and
      maturity-gate limits. The GORILLA score (0–100) is the elicited
      potential; the capability assessment determines whether that score
      is credible against the company's observed behavior and maturity.
      Emits capability_assessments, floor_violations, ceiling_violations,
      maturity_blocks. A maturity block on a dimension means the lisp.eval
      scoring step should treat that dimension's score as nil, not as the
      elicited value.

  - id: company-research/thesis-essentialist
    name: "THESIS — essentialist 3-gate eliminative interrogation (v0.36.0)"
    path: thesis-essentialist.j2
    type: KnowAct
    description: >
      v0.36.0 cross-skill adapter. Adapts essentialist/essentialist-flow to
      the three-pillar investment thesis. Runs a single pass of the 3-gate
      protocol (Exist, Surface, Contract) on the thesis to enforce parsimony
      — does each pillar earn its place? Is the thesis at the right
      abstraction level? Can it be stated more tersely? Mode is autonomous
      (no human in the loop during the pipeline). The elimination_report feeds
      the goal-analysis quality gate as additional evidence — it does not
      block the thesis directly.

  - id: company-research/kata-calibration-measure
    name: "KATA — metacognition calibration gap measurement (v0.36.0)"
    path: kata-calibration-measure.j2
    type: KnowAct
    description: >
      v0.36.0 cross-skill adapter. Adapts metacognition/meta-experiment to
      close the flash pipeline's open kata loop. Flash step 20 (kata-
      improvement-step1-direction) sets the direction but never measures the
      gap. This step measures the analyst's calibration gap using the
      market_calibration Brier score (step 19) and resolved_outcomes (step
      18), then re-measures the current condition. Emits calibration_gap
      (0.0 calibrated → 1.0 maximum gap) that LENS (step 23) consumes as a
      6th axis alongside the existing five frameworks.

# FlowDef orchestrators — two flowdefs mirroring EFRA-AI's two-pipeline
# structure. See registry/manifests/company-research-flash.yaml and
# registry/manifests/company-research-deep.yaml.
flowdef:
  flash: registry/manifests/company-research-flash.yaml
  deep: registry/manifests/company-research-deep.yaml
