# Gradient shape taxonomy for GSR (cross-ontology recombination)
# Inherits from gradient-hunter's gradient-shapes.yaml; adds cross-ontology substrate annotations.
# hKask v0.33.0

shapes:
  - id: sharp_cliff
    name: "Sharp cliff (Canny step edge)"
    ontology_anchor: "Image processing — Canny step edge"
    substrate_annotation: "A clean boundary between a populated recombination surface and an unpopulated one. The recast was never attempted."
    intervention: "Add the wire — attempt the recast."
    fractal_recurrence: "Recurrs at concept-pair, ontology-pair, and domain-pair scales."

  - id: roof_edge
    name: "Roof edge (derivative discontinuity)"
    ontology_anchor: "Image processing — derivative discontinuity"
    substrate_annotation: "A gradual transition. The recombination surface was partially attempted — some concepts recast, others not."
    intervention: "Complete the partial recast."
    fractal_recurrence: "Recurrs at concept-pair and ontology-pair scales."

  - id: wombling_boundary
    name: "Wombling boundary (spatial statistics)"
    ontology_anchor: "Spatial statistics — Womble 1951"
    substrate_annotation: "A boundary that is not a clean edge but a zone of rapid change. The recombination surface is fuzzy."
    intervention: "Sharpen the boundary — clarify which concepts are recast and which are not."
    fractal_recurrence: "Recurrs at ontology-pair and domain-pair scales."

  - id: regression_discontinuity
    name: "Regression discontinuity (causal inference)"
    ontology_anchor: "Causal inference — Thistlethwaite & Campbell 1960"
    substrate_annotation: "A jump at a specific threshold (e.g., ontologies above a certain complexity threshold have recombination surfaces; below, they don't)."
    intervention: "Investigate the threshold — what property of the ontology determines whether recombination is attempted?"
    fractal_recurrence: "Recurrs at ontology-pair scale."

  - id: topological_hole
    name: "Topological hole (persistent homology)"
    ontology_anchor: "Computational topology — persistent homology"
    substrate_annotation: "The mapping exists conceptually but was never wired — a hole in the recombination graph."
    intervention: "Wire the mapping — the concept-level mapping is findable but the implementation is missing."
    fractal_recurrence: "Recurrs at concept-pair and ontology-pair scales."

  - id: oracle_gap
    name: "Oracle gap (software engineering)"
    ontology_anchor: "Software engineering — Petrova et al. ISSRE 2023"
    substrate_annotation: "The recombination surface exists in theory but there is no way to verify the recast's validity (no oracle, no test)."
    intervention: "Build the oracle — add a three-criterion test (CFR) to verify the recast."
    fractal_recurrence: "Recurrs at concept-pair scale."

  - id: frustrated_landscape
    name: "Frustrated landscape (spin glass)"
    ontology_anchor: "Statistical physics — Parisi 1979; Nobel 2021"
    substrate_annotation: "Competing constraints prevent the recombination from settling — the recast is attempted but keeps reverting because the target ontology's axioms conflict with each other for this concept."
    intervention: "Reshape the landscape — identify the competing constraints and resolve the frustration."
    fractal_recurrence: "Recurrs at concept-pair scale."

  - id: allosteric_population_shift
    name: "Allosteric population shift (biochemistry)"
    ontology_anchor: "Biochemistry — Monod-Wyman-Changeux 1965"
    substrate_annotation: "The recombination surface shifts due to a distal change in the ontology landscape — a change in ontology C affects the A→B recombination."
    intervention: "Restore the distal coupling — fix the change in C, not the A→B surface."
    fractal_recurrence: "Recurrs at domain-pair scale."

reason_classes:
  - id: mcar
    name: "Intentional boundary (MCAR)"
    description: "The recombination surface is unpopulated by design."
  - id: mar
    name: "Explainable gap (MAR)"
    description: "The recombination surface is unpopulated for a known reason."
  - id: mnar
    name: "Forgotten wire (MNAR)"
    description: "The mapping exists conceptually but was never wired."
  - id: mnar_drift
    name: "Stale refactor (MNAR drift)"
    description: "The recombination surface existed but was lost in a refactor."
  - id: mnar_missing_abstraction
    name: "Scope creep (MNAR missing abstraction)"
    description: "The abstraction layer that would host the recombination was never created."
  - id: metastable_trap
    name: "Metastable trap (spin glass non-ergodic)"
    description: "The recombination was attempted but the system relaxed back."
  - id: broken_allosteric_coupling
    name: "Broken allosteric coupling"
    description: "The recombination surface shifts due to a distal change."

priority_order:
  - broken_allosteric_coupling
  - metastable_trap
  - mnar
  - mnar_drift
  - mnar_missing_abstraction
  - mar
  - mcar
