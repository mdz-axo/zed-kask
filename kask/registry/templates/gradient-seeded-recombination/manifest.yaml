# Template crate manifest for gradient-seeded-recombination skill
# hKask v0.33.0

crate:
  name: gradient-seeded-recombination
  version: "0.33.0"
  description: >
    Substrate-analysis process for interdisciplinary concept generation.
    Inventories a set of ontology namespaces (the project's 6 domain-supplement
    namespaces + 2 universal axes + 5W1H core, or extended via OBO Foundry /
    OntoBee / BioPortal with per-ontology license check), builds a complete-graph
    prior (every ontology should have a recombination surface with every other),
    maps the actual recombination field, detects gradients between populated and
    unpopulated regions using the gradient-hunter eight-shape taxonomy, generates
    reason hypotheses via the seven-class taxonomy, prioritizes sites, and selects
    seed concepts (most central by graph degree). Produces a reusable gradient map
    consumed by constraint-forces-recast. Anchored to Parisi spin glass theory
    (non-ergodicity, frustration, metastable valleys) for the substrate and the
    gradient-hunter eight-shape ontology for the surface. Distinct from
    gradient-hunter: GSR hunts gradients between ontologies (cross-ontology
    recombination sites), while gradient-hunter hunts gradients within a codebase
    or telemetry field.

templates:
  - id: gradient-seeded-recombination/gsr-inventory
    name: "Inventory ontology namespaces"
    path: gsr-inventory.j2
    type: KnowAct
    description: >
      Enumerate the ontology namespaces in the registry. Each entry carries the
      namespace id, its axioms, its term signature, and its key concepts. When
      external sources are configured (OBO Foundry, OntoBee, BioPortal), fetch
      and parse the registry YAML / OWL, checking per-ontology license before
      caching. The project's default registry is the 6 domain-supplement
      namespaces (FIBO, ESO, GOLEM, ML-Schema, OMC, SUMO) + 2 universal axes
      (PKO, DC+BIBO) + 5W1H core.

  - id: gradient-seeded-recombination/gsr-prior
    name: "Build complete-graph prior"
    path: gsr-prior.j2
    type: KnowAct
    description: >
      Build the expected-field model: the complete graph K_n on the n ontologies,
      where every ontology should have a populated recombination surface with
      every other. The prior is the gradient-hunter convention prior: "every pair
      should have a populated recombination surface." Delegates to
      pragmatic-cybernetics for variety engineering when no convention prior is
      available.

  - id: gradient-seeded-recombination/gsr-map
    name: "Map actual recombination field"
    path: gsr-map.j2
    type: KnowAct
    description: >
      Map the actual recombination field in the registry with the same granularity
      as the prior. For each ordered pair (A, B), check whether a recombination
      surface exists — i.e., whether any concept in A has been recast into B's
      constraint context. Delegates to graph-audit (code mode) for topology
      extraction when hunting topology gradients.

  - id: gradient-seeded-recombination/gsr-detect
    name: "Detect and classify gradients"
    path: gsr-detect.j2
    type: KnowAct
    description: >
      Compare prior to actual. Classify each gradient by its shape using the
      eight ontological anchors (sharp cliff, roof edge, wombling boundary,
      regression discontinuity, topological hole, oracle gap, frustrated
      landscape, allosteric population shift). Record location, shape, scale,
      domain, fractal recurrence, populated side, desert side, magnitude. The
      fractal recurrence check is mandatory.

  - id: gradient-seeded-recombination/gsr-hypothesize
    name: "Generate reason hypotheses"
    path: gsr-hypothesize.j2
    type: KnowAct
    description: >
      For each detected gradient, generate multiple hypotheses for why it exists
      using the seven-class reason taxonomy: intentional boundary (MCAR),
      explainable gap (MAR), forgotten wire (MNAR), stale refactor (MNAR drift),
      scope creep (MNAR missing abstraction), metastable trap (spin glass
      non-ergodic), broken allosteric coupling. Delegates to falsifiability for
      counterfactual discrimination and to metacognition for prior perspective
      rotation.

  - id: gradient-seeded-recombination/gsr-prioritize
    name: "Prioritize recombination sites"
    path: gsr-prioritize.j2
    type: KnowAct
    description: >
      Compile detected gradients and their reason hypotheses into a structured,
      prioritized ranking. Prioritizes by reason class (broken allosteric
      coupling > metastable trap > MNAR > MAR > MCAR), then fractal recurrence,
      then magnitude, then populated-side criticality. Emits lessons_learned
      and pattern_signatures for the next iteration's prior.

  - id: gradient-seeded-recombination/gsr-select-seeds
    name: "Select seed concepts"
    path: gsr-select-seeds.j2
    type: KnowAct
    description: >
      For each high-priority recombination site, select the seed concept as the
      most central concept in the source ontology — the concept with the highest
      degree in the ontology's concept graph (most sub- and super-class relations).
      Central concepts have the richest structure to mutate; peripheral concepts
      produce trivial mutants.

  - id: gradient-seeded-recombination/gsr-gradient-shapes
    name: "Gradient shape taxonomy reference"
    path: gsr-gradient-shapes.yaml
    type: RenderAct
    description: >
      Reference: the eight gradient shape ontology with fractal recurrence,
      reason classes, and priority ordering. Inherits from gradient-hunter's
      gradient-shapes.yaml; GSR adds the cross-ontology substrate
      annotations. This is a RenderAct reference document — the detect
      step (gsr-detect.j2) describes the shapes inline in its prompt, and
      this YAML provides the machine-readable taxonomy for programmatic
      consumption by downstream tools. It is not a flow input; it is a
      reference consumed by the detect step's template_ref resolution.
