# Template crate manifest for swarm-compose-guide skill
# hKask v0.35.0
#
# Note: this skill references a template in the swarm-intelligence crate
# (swarm-intelligence/swarm-compose-guide.j2). The crate manifest is kept
# here for R1 compliance (every skill needs a crate manifest), but the
# template lives in the swarm-intelligence directory.

crate:
  name: swarm-compose-guide
  version: "0.35.0"
  description: >
    Agent/swarm composition authoring and validation aid. Given partial form
    inputs, renders the swarm-compose-guide Jinja2 guidance template and
    returns either suggested completions for unfilled fields or a validation
    verdict over the supplied fields. Read-only authoring aid.

templates:
  - id: swarm-intelligence/swarm-compose-guide
    name: "Swarm compose guide"
    path: ../swarm-intelligence/swarm-compose-guide.j2
    type: KnowAct
    description: >
      Renders guidance for agent/swarm composition forms. Returns suggested
      completions (action=suggest) or a validation verdict (action=validate)
      over the supplied fields. Used by the swarm panel's AI Assist / Validate
      buttons via the swarm_ai_assist MCP tool.