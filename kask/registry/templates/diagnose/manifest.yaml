# Template crate manifest for diagnose skill
# hKask v0.31.0

crate:
  name: diagnose
  version: "0.31.0"
  description: >
    Disciplined diagnosis loop for hard bugs and performance regressions.
    Cybernetic debugging: build feedback loop → reproduce → hypothesise →
    instrument → fix → regression-test. Aligned with Regulation sense→orient→decide→act.

templates:
  - id: diagnose/diagnose-spec-anchor
    name: "Anchor a bug diagnosis to the code graph via Dublin Core + PKO ontology"
    path: diagnose-spec-anchor.j2
    type: KnowAct
    description: >
      Anchor a bug diagnosis to the actual code structure using a dual
      ontology: Dublin Core classifies the THING affected (entity type,
      identifier, source, subject domain derived from graph position) and
      PKO classifies the FLOW the bug occurs in (call chain as Procedure,
      each function as Step, bug as IssueOccurrence at a StepExecution).
      Uses codegraph_query/traverse/impact MCP tools. Phase 0 of the
      diagnosis pipeline. Replaces spec-anchoring — the bug is grounded in
      the real code graph, not a specification document.

  - id: diagnose/diagnose-loop
    name: "Build a feedback loop for the bug"
    path: diagnose-loop.j2
    type: KnowAct
    description: >
      Build a feedback loop for the bug. Evaluate repro strategies, select the
      fastest deterministic signal, and confirm the bug reproduces before hypothesising.

  - id: diagnose/diagnose-instrument
    name: "Instrument the code with targeted probes mapped to specific hypotheses"
    path: diagnose-instrument.j2
    type: KnowAct
    description: >
      Instrument the code with targeted probes mapped to specific hypotheses.
      Change one variable at a time. Use tagged diagnostic logs or breakpoints.

  - id: diagnose/diagnose-fix
    name: "Apply fix with regression test (before the fix)"
    path: diagnose-fix.j2
    type: KnowAct
    description: >
      Apply fix with regression test (before the fix). Verify original repro
      no longer reproduces. Clean up instrumentation. Write post-mortem.

