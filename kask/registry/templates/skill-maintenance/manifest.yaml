# Template crate manifest for skill-maintenance skill
# hKask v0.35.0

crate:
  name: skill-maintenance
  version: "0.35.0"
  description: >
    Skill lifecycle management and maintenance. Registry crate (manifest.yaml + *.j2)
    is the canonical source of truth; SKILL.md is a generated companion.
    Audit staleness, coverage gaps, and quality. List, build, validate, install
    translate, and prune skills. Pairs with skill-discovery and skill-bundler.

templates:
  - id: skill-maintenance/skill-maintenance-validate
    name: "Validate skills against registry format and quality checks"
    path: skill-maintenance-validate.j2
    type: KnowAct
    description: >
      Validate skills against registry format and quality checks. Check manifest
      structure, .j2 frontmatter (template_type, contract, visibility).
      SKILL.md is validated as secondary companion.

  - id: skill-maintenance/skill-maintenance-build
    name: "Scaffold a new registry crate from a user description"
    path: skill-maintenance-build.j2
    type: KnowAct
    description: >
      Scaffold a new registry crate from a user description. Generate manifest.yaml
      with crate metadata, template entries, and . Generate companion
      SKILL.md from the registry crate. Validate and confirm before writing.

  - id: skill-maintenance/skill-maintenance-translate
    name: "Forward translation: convert a classified source skill into a hKask…"
    path: skill-maintenance-translate.j2
    type: KnowAct
    description: >
      Forward translation: convert a classified source skill into a hKask registry crate
      (manifest.yaml + *.j2 templates). Map source elements to hKask equivalents
      drop concepts with no equivalent, produce validated output with translation summary.

  - id: skill-maintenance/skill-maintenance-reverse
    name: "Reverse translation: generate a SKILL.md companion from a registry…"
    path: skill-maintenance-reverse.j2
    type: KnowAct
    description: >
      Reverse translation: generate a SKILL.md companion from a registry crate.
      Read manifest.yaml for crate metadata, read .j2 templates for methodology
      produce a markdown companion suitable for the Zed coding agent.

  - id: skill-maintenance/skill-maintenance-prose
    name: "Prose-only derivation: synthesize the \"When to Use\" and…"
    path: skill-maintenance-prose.j2
    type: KnowAct
    description: >
      Prose-only derivation: synthesize the "When to Use" and "Instructions"
      sections of a SKILL.md from a registry crate, emitted as raw markdown.
      Used by the skill-maintenance skill or agent panel alongside the
      mechanically-built skeleton (frontmatter, templates table, constraints)
      — the LLM only writes the prose that needs synthesis, not the structural
      parts copied from the registry.

  - id: skill-maintenance/skill-maintenance-audit
    name: "Run staleness and health audit for target scope"
    path: skill-maintenance-audit.j2
    type: KnowAct
    description: >
      Run staleness and health audit for target scope. Checks R1-R12 registry
      rules, Z1-Z8 companion checks, X1-X4 cross-artifact checks. Used by the
      FlowDef manifest as step 1 of the maintenance PDCA loop.

  - id: skill-maintenance/skill-maintenance-coverage
    name: "Run corpus coverage analysis for uncovered/partial capabilities"
    path: skill-maintenance-coverage.j2
    type: KnowAct
    description: >
      Run corpus coverage analysis for uncovered/partial capabilities.
      Maps common task patterns against the existing skill corpus, identifies
      what is covered, uncovered, and partial. Used by the FlowDef manifest
      as step 2 of the maintenance PDCA loop.


