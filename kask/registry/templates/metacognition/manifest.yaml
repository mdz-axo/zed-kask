# Template crate manifest for metacognition skill
# hKask v0.31.0

crate:
  name: metacognition
  version: "0.31.0"
  description: >
    General-purpose metacognitive reasoning templates. Decomposes goals into
    sub-goals, self-assesses progress, calibrates strategy based on prior
    outcomes and ellipsis findings, computes convergence, detects ellipses
    (what is missing) via Bloom's method, applies Falstaffian perspective
    rotation, and improves itself through GEPA evolutionary optimization.
    Any userpod can use these templates for self-reflection.

templates:
  # ── Skill flow templates (Improvement Kata PDCA steps) ──
  - id: metacognition/meta-grasp-current
    name: "Improvement Kata Step 1: Grasp the current metacognitive condition"
    path: meta-grasp-current.j2
    type: KnowAct
    description: >
      Measure the agent's actual metacognitive state right now. Identify
      obstacles, surface assumptions, count grounded claims, enumerate
      options. Produces current_artifacts and current_procedure for gap
      computation.

  - id: metacognition/meta-establish-target
    name: "Improvement Kata Step 2: Establish the target condition"
    path: meta-establish-target.j2
    type: KnowAct
    description: >
      Declare the target metacognitive state — what sufficient meta-knowledge
      looks like for this goal. Produces target_artifacts and target_procedure
      for gap computation.

  - id: metacognition/meta-predict
    name: "Improvement Kata Step 3: Make a prediction"
    path: meta-predict.j2
    type: KnowAct
    description: >
      Predict which calibration will close the gap and by how much. Carry a
      confidence in [0,1]. The Brier score tracks whether the confidence is
      calibrated.

  - id: metacognition/meta-experiment
    name: "Improvement Kata Step 4: Experiment (Do)"
    path: meta-experiment.j2
    type: KnowAct
    description: >
      Apply the predicted calibration — Falstaffian perspective rotation,
      ellipsis analysis, or strategy adjustment. Re-measure the current
      condition after the experiment. Produces new current_artifacts and
      current_procedure.

  # ── Falstaffian perspective engine (reference documents) ──
  # These YAML files are reference analysis documents, not executable .j2
  # templates. They define the Falstaffian shapes, experience calibration,
  # and variance analysis that the metacognition skill uses for perspective
  # rotation. They are registered as type: RenderAct for discovery and
  # documentation purposes — they are not rendered by minijinja.
  - id: metacognition/falstaffian-perspective-engine
    name: "Reference: three-fold structure (shapes, experience, spirit) with…"
    path: falstaffian-perspective-engine.yaml
    type: RenderAct
    description: >
      Reference: three-fold structure (shapes, experience, spirit) with
      metacognitive application steps and shape selection decision tree.

  - id: metacognition/falstaffian-shapes
    name: "Reference: seven semantic graph transformation operators — the…"
    path: falstaffian-shapes.yaml
    type: RenderAct
    description: >
      Reference: seven semantic graph transformation operators — the
      Falstaffian shapes with input/output structures and tension components.

  - id: metacognition/falstaffian-variance-analysis
    name: "Reference: three-pass variance calibration with agreement matrix and…"
    path: falstaffian-variance-analysis.yaml
    type: RenderAct
    description: >
      Reference: three-pass variance calibration with agreement matrix and
      final taxonomy of core, secondary, and candidate shapes.