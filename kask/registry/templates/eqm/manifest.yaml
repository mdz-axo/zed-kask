# Template crate manifest for eqm skill
# hKask v0.34.0
#
# Measurement instrument for forecast-rationale quality. Scores rationales
# against the 60 EQMs from Karvetski et al. (2026) via the
# market_score_rationale MCP tool, aggregates to forecast-level and
# forecaster-level composites, validates against realized outcomes, and
# emits calibration feedback. Composes with eqm-improvement (consumer)
# and superforecasting (overconfidence_bias feeds stage 16).

crate:
  name: eqm
  version: "0.34.0"
  description: >
    Explanation Quality Markers measurement instrument. Scores forecast
    rationales against the 60 EQMs from Karvetski et al. (2026, Forecasting
    Research Institute) via the market_score_rationale MCP tool, aggregates
    to forecast-level and forecaster-level composites, validates against
    realized outcomes (Brier) with gaming detection, and emits an
    overconfidence_bias signal that feeds back into superforecasting's
    calibration-adjustment step. Asymmetric: strong red-flag screen, weak
    green-flag detector.

templates:
  - id: eqm/eqm-select
    name: "Choose EQM subset and gather rationale corpus"
    path: eqm-select.j2
    type: KnowAct
    description: >
      Choose the EQM subset (predictive_12 default, full_60, or domain_tuned)
      and gather the rationale corpus. Prepares the scoring batch and cost
      estimate.
    generates_spans:
      - reg.eqm.select

  - id: eqm/eqm-score
    name: "Score rationales via market_score_rationale MCP tool"
    path: eqm-score.j2
    type: KnowAct
    description: >
      Call market_score_rationale (hkask-mcp-prediction-markets) per rationale.
      Collect per-rationale EqmResult: composite_score, scores, red_flags,
      green_flags. The MCP tool is the single source of truth for 12-EQM
      LLM scoring.
    generates_spans:
      - reg.eqm.score

  - id: eqm/eqm-aggregate
    name: "Aggregate to forecast-level and forecaster-level composites"
    path: eqm-aggregate.j2
    type: KnowAct
    description: >
      Aggregate per-rationale scores to forecast-level and forecaster-level
      composites. Apply the asymmetric decision rule: red_flag_screen (high
      confidence) vs green_flag_endorsement (weak). Compute overconfidence_bias.
    generates_spans:
      - reg.eqm.aggregate

  - id: eqm/eqm-validate
    name: "Validate against realized outcomes with gaming detection"
    path: eqm-validate.j2
    type: KnowAct
    description: >
      If realized_outcomes present: correlate EQM composite with accuracy
      (Brier), check directional-hypothesis match. If scores rose but
      accuracy didn't improve → gaming_suspected verdict. If outcomes
      absent → Undetermined (not Ready-with-empty).
    generates_spans:
      - reg.eqm.validate

  - id: eqm/eqm-catalog
    name: "Full 60-EQM reference catalog"
    path: eqm-catalog.yaml
    type: RenderAct
    description: >
      Reference document: the full 60 EQM definitions from Karvetski et al.
      (2026), organized by category (good_habits / warning_signs). The 12
      most predictive are marked predictive: true. Single source of truth
      for EQM definitions; the MCP tool's KEY_EQMS const carries the
      predictive 12.
