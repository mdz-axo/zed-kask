# Template manifest for capabilities-research-pipeline

crate:
  name: capabilities-research-pipeline
  description: >
    Templates for the Capabilities Research Pipeline flowdef — PDCA
    kata-pivot reflection (strategic method switching) and final
    extraction report compilation.

templates:
  - id: capabilities-research-pipeline/pdca-kata-pivot
    name: "PDCA Kata-Pivot Reflection"
    path: pdca-kata-pivot.j2
    type: KnowAct
    description: >
      Metacognition + kata-improvement reflection for a failed PDCA
      completion gate. Diagnoses WHY the current strategy failed and
      proposes a STRATEGIC PIVOT to a different method (not just
      tweaked parameters). Follows the Toyota Improvement Kata:
      understand direction → grasp current condition → establish
      target → experiment.

  - id: capabilities-research-pipeline/extraction-report
    name: "Corpus Extraction Report"
    path: extraction-report.j2
    type: KnowAct
    description: >
      Compiles the final corpus extraction report from per-phase
      completion verdicts, chunk counts, tag coverage, embedding
      success rates, and h_mem storage counts.