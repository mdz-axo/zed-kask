# Template crate manifest for gradient-hunter skill
# hKask v0.31.0

crate:
  name: gradient-hunter
  version: "0.31.0"
  description: >
    Find steep gradients between populated and unpopulated regions of a
    codebase/telemetry/test field and investigate the reason for the gradient.
    The signal is in the gradient shape and its cause, not in the absence
    itself. Requires building a prior model of the expected field, measuring
    the actual field, detecting gradients against the prior, generating
    hypotheses for why each gradient exists (intentional boundary vs.
    forgotten wire vs. stale refactor vs. scope creep vs. metastable trap vs.
    broken allosteric coupling), and classifying the reason. Anchored to a
    substrate ontology (statistical physics — Parisi's spin glass theory:
    non-ergodicity, frustration, rugged energy landscapes, metastable
    valleys, ultrametricity, replica symmetry breaking) and seven surface
    gradient-shape ontologies drawn from spatial statistics (wombling),
    causal inference (regression discontinuity), missing data theory
    (Rubin's MCAR/MAR/MNAR), computational topology (persistent homology),
    image processing (edge detection), software engineering (oracle gap),
    and biochemistry/biophysics (Monod's allostery: polymorphic catalysts,
    conformational ensembles, population shift, quantum tunneling — with an
    agentic-orchestrator corollary). Decomposed into phased templates:
    Prior (build expected-field model) → Map (measure actual field) →
    Detect (classify gradient shape + scale + domain + fractal recurrence) →
    Hypothesize (generate reason hypotheses via Rubin + spin glass +
    allostery) → Report (structured gradient report with priority ranking) →
    Convergence (composite metric + next_prior_focus for loop closure).
    Composes graph-audit (code mode, field topology extraction),
    pragmatic-cybernetics (variety engineering for prior modeling),
    falsifiability (counterfactual hypothesis discrimination), and
    metacognition (prior perspective rotation). Emits reg.gradient.* spans
    for observability (P12). Any userpod may invoke this skill.

templates:
  - id: gradient-hunter/gradient-prior
    name: "Build prior model of expected field (sibling/convention/principle)"
    path: gradient-prior.j2
    type: KnowAct
    description: >
      Build a prior model of the expected field. Without a prior, you can
      only detect absences, not gradients. The prior comes from one of
      three sources in order of preference: sibling prior (a populated
      region structurally similar to the target), convention prior (a
      documented convention like a .rules trap), or principle prior (a
      design principle). Records source, scope, and confidence. Delegates
      to pragmatic-cybernetics for variety engineering when no sibling or
      convention prior is available.
    generates_spans:
      - reg.gradient.prior

  - id: gradient-hunter/gradient-map
    name: "Map actual field with prior's granularity (delegate graph-audit for topology)"
    path: gradient-map.j2
    type: KnowAct
    description: >
      Measure the actual field in the target region with the same granularity
      as the prior. The field is whatever is being hunted: test presence,
      span emission, log statements, error-handling branches, paired
      comments, manifest entries. Delegates to graph-audit (code mode) for
      topology extraction (call graph, dependency graph, span emission
      sites) when hunting topology gradients (orphan nodes, missing edges,
      disconnected components).
    generates_spans:
      - reg.gradient.map

  - id: gradient-hunter/gradient-detect
    name: "Detect gradients and classify shape, scale, domain, fractal recurrence"
    path: gradient-detect.j2
    type: KnowAct
    description: >
      Compare prior to actual. Classify each gradient by its shape using
      the eight ontological anchors (sharp cliff, roof edge, wombling
      boundary, regression discontinuity, topological hole, oracle gap,
      frustrated landscape, allosteric population shift). Record location,
      shape, scale, domain, fractal recurrence (does this shape appear at
      other scales or in other domains?), populated side, desert side,
      magnitude. The fractal recurrence check is mandatory — a shape that
      recurs at multiple scales/domains is the system's characteristic
      pattern. References gradient-shapes.yaml for the shape taxonomy.
    generates_spans:
      - reg.gradient.detect

  - id: gradient-hunter/gradient-hypothesize
    name: "Generate reason hypotheses via Rubin + spin glass + allostery taxonomy"
    path: gradient-hypothesize.j2
    type: KnowAct
    description: >
      For each gradient, generate multiple hypotheses for why it exists.
      Use the seven-class reason taxonomy: intentional boundary (MCAR),
      explainable gap (MAR), forgotten wire (MNAR), stale refactor (MNAR
      drift), scope creep (MNAR missing abstraction), metastable trap
      (spin glass non-ergodic), broken allosteric coupling (ensemble
      redistribution). Delegates to falsifiability for counterfactual
      hypothesis discrimination ("if this desert were intentional, what
      else would be true?") and to metacognition for prior perspective
      rotation (different priors surface different gradients).
    generates_spans:
      - reg.gradient.hypothesize

  - id: gradient-hunter/gradient-report
    name: "Compile structured gradient report with priority ranking"
    path: gradient-report.j2
    type: KnowAct
    description: >
      Compile detected gradients into a structured report. Each gradient
      entry includes location, shape, ontology anchor, scale, domain,
      fractal recurrence, prior, populated side, desert side, magnitude,
      reason hypotheses, recommended reason, and action. Prioritizes by
      reason class (broken allosteric coupling > metastable trap > MNAR >
      MAR > MCAR), then fractal recurrence, then magnitude, then
      populated-side criticality. Emits lessons_learned and
      pattern_signatures for the next iteration's prior (feedback loop
      closure).
    generates_spans:
      - reg.gradient.report


  # ── Reference documents (not executable .j2 templates) ──
  - id: gradient-hunter/gradient-shapes
    name: "Reference: eight gradient shape ontology with fractal recurrence and reason classes"
    path: gradient-shapes.yaml
    type: RenderAct
    description: >
      Reference: eight gradient shapes drawn from seven academic domains
      (image processing, spatial statistics, causal inference, computational
      topology, software engineering, statistical physics, biochemistry/
      biophysics). Each shape includes ontology, anchor concept, meaning,
      reason family, and fractal recurrence across scales. Includes the
      seven-class reason taxonomy (Rubin MCAR/MAR/MNAR + spin glass
      metastable trap + allostery broken coupling) and priority ordering.
      Substrate ontology (spin glass) explains why gradients exist at all.
