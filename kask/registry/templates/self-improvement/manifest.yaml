# Template crate manifest for self-improvement skill
# hKask v0.34.0

crate:
  name: self-improvement
  version: "0.34.0"
  description: >
    General multi-purpose self-improvement skill for FM-based agents. Implements
    the unified self-induced update operator. Drives persistent, endogenous
    adaptation across two pathways — Foundation Model Improvement and
    Scaffolding Improvement — through intrinsic generative demonstrations,
    intrinsic evaluative feedback, and extrinsic exploratory experience.

templates:
  - id: self-improvement/si-kata-direction
    name: "Kata Step 1: Understand the Direction"
    path: si-kata-direction.j2
    type: WordAct
    description: >
      Improvement Kata Step 1 — understand the strategic direction from the
      level above and articulate the challenge.

  - id: self-improvement/si-kata-current
    name: "Kata Step 2: Grasp the Current Condition"
    path: si-kata-current.j2
    type: WordAct
    description: >
      Improvement Kata Step 2 — gather facts and data to establish the
      baseline state of the agent's current capabilities.

  - id: self-improvement/si-kata-target
    name: "Kata Step 3: Establish the Next Target Condition"
    path: si-kata-target.j2
    type: WordAct
    description: >
      Improvement Kata Step 3 — set a measurable, time-bounded target beyond
      the current knowledge threshold.

  - id: self-improvement/si-select-pathway
    name: "Select improvement pathway"
    path: si-select-pathway.j2
    type: KnowAct
    description: >
      Select between Foundation Model Improvement and Scaffolding Improvement
      pathways based on the current Kata state and available resources.

  - id: self-improvement/si-execute-improvement
    name: "Execute the selected improvement"
    path: si-execute-improvement.j2
    type: WordAct
    description: >
      Execute the improvement action selected by si-select-pathway — either
      an FM improvement step or a Scaffolding improvement step.

  - id: self-improvement/si-evaluate-improvement
    name: "Evaluate the improvement result"
    path: si-evaluate-improvement.j2
    type: KnowAct
    description: >
      Evaluate the outcome of the executed improvement against the target
      condition and produce a Brier-scored assessment.

  - id: self-improvement/si-commit-or-rollback
    name: "Commit or rollback the improvement"
    path: si-commit-or-rollback.j2
    type: KnowAct
    description: >
      Decide whether to commit the improvement (persist the change) or
      rollback (revert to the prior state) based on the evaluation.

  - id: self-improvement/si-exec-fm-demos
    name: "FM improvement: generative demonstrations"
    path: si-exec-fm-demos.j2
    type: WordAct
    description: >
      Foundation Model Improvement pathway — generate intrinsic demonstrations
      by sampling execution trajectories and reflecting on them.

  - id: self-improvement/si-exec-fm-experience
    name: "FM improvement: exploratory experience"
    path: si-exec-fm-experience.j2
    type: WordAct
    description: >
      Foundation Model Improvement pathway — acquire extrinsic exploratory
      experience by running the agent in novel environments.

  - id: self-improvement/si-exec-fm-feedback
    name: "FM improvement: evaluative feedback"
    path: si-exec-fm-feedback.j2
    type: WordAct
    description: >
      Foundation Model Improvement pathway — process intrinsic evaluative
      feedback from the improvement cycle.

  - id: self-improvement/si-exec-scaffold-full
    name: "Scaffolding: full scaffold update"
    path: si-exec-scaffold-full.j2
    type: WordAct
    description: >
      Scaffolding Improvement pathway — update the full scaffold (prompt,
      memory, tool configuration) based on the improvement evaluation.

  - id: self-improvement/si-exec-scaffold-memory
    name: "Scaffolding: memory update"
    path: si-exec-scaffold-memory.j2
    type: WordAct
    description: >
      Scaffolding Improvement pathway — update the agent's memory
      configuration based on the improvement evaluation.

  - id: self-improvement/si-exec-scaffold-prompt
    name: "Scaffolding: prompt update"
    path: si-exec-scaffold-prompt.j2
    type: WordAct
    description: >
      Scaffolding Improvement pathway — update the agent's system prompt
      based on the improvement evaluation.

  - id: self-improvement/si-exec-scaffold-tool
    name: "Scaffolding: tool update"
    path: si-exec-scaffold-tool.j2
    type: WordAct
    description: >
      Scaffolding Improvement pathway — update the agent's tool
      configuration based on the improvement evaluation.