manifest:
  id: qa-triage-cycle
  category: qa-script
  name: QA Triage Cycle
  version: 0.31.0
  description: 'QA triage cycle using only hKask infrastructure: runs contract and property tests, classifies
    failures via Gemma 4 26B, branches on confidence, and retries flaky tests. No external fuzzers required.

    '
  editor: system
  visibility: Public
gas:
  cap: 50000
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: cargo test -p hkask-regulation -p hkask-types -p hkask-storage -p hkask-keystore -p hkask-capability
    2>&1 | tail -30
  description: Run contract and property tests across priority crates
  branching:
    success: 2
    failure: 2
- ordinal: 2
  action: classify
  classifier: qa-triage
  description: 'Test suite: hKask priority crates (regulation, types, storage, keystore, capability).
    Property-based tests use proptest for randomized input generation. Classify any failures by type (panic,
    assertion, logic error, flake) and confidence.'
  branching:
    high_confidence: 3
    medium_confidence: 4
    low_confidence: 5
    flake: 6
    unparseable: 5
    classifier_unavailable: 7
- ordinal: 3
  action: run_command
  command: "echo '[QA:autonomous] High-confidence failure detected \u2014 review proposed fix in classifier\
    \ output'"
  description: "High-confidence classification \u2014 candidate for auto-repair"
- ordinal: 4
  action: run_command
  command: "echo '[QA:autonomous] Medium-confidence failure \u2014 escalate for human review'"
  description: Medium-confidence failure needs human judgment
- ordinal: 5
  action: run_command
  command: "echo '[QA:autonomous] Low-confidence or unparseable \u2014 flag for investigation'"
  description: Low-confidence failure requires developer investigation
  terminal: true
- ordinal: 6
  action: loop
  command: echo 'retry_flake'
  description: Retry flaky test
  max_iterations: 3
  branching:
    success: 1
    loop_exhausted: 5
- ordinal: 7
  action: run_command
  command: "echo '[QA:autonomous] Classifier unavailable \u2014 raw test output available for manual review'"
  description: Classifier unavailable, manual review needed
  terminal: true
ledger:
  emit_spans: true
  span_namespace: reg.skill.qa-triage-cycle
