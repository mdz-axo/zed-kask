# Structured Extraction Process Manifest
# ℏKask v0.35.0 — Structured extraction as convergent PDCA

manifest:
  id: structured-extraction
  category: skill
  name: Structured Extraction
  description: >
    Convergent structured extraction process. Identifies entities, extracts
    relations, maps data to schema, computes extraction convergence, and
    iterates until coverage and unresolved-field risk are acceptable.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: source_text
    type: string
    required: false
  - name: target_schema
    type: object
    required: true
  - name: extraction_hints
    type: array
    required: false

ledger:
  span_namespace: reg.skill.structured-extraction

steps:
  - ordinal: 1
    action: select
    description: Identify entities in source text against target schema.
    renderer: minijinja
    template_ref: structured-extraction/identify-entities
    timeout_seconds: 60
    input_mapping:
      source_text: "{{ task | default(source_text) }}"
      target_schema: "{{ target_schema }}"
      extraction_hints: "{{ extraction_hints | default([]) }}"

  - ordinal: 2
    action: select
    description: Extract semantic relations between identified entities.
    renderer: minijinja
    template_ref: structured-extraction/extract-relations
    timeout_seconds: 60
    input_mapping:
      source_text: "{{ source_text }}"
      entities: "{{ step_1_result.entities | default([]) }}"

  - ordinal: 3
    action: select
    description: Map entities and relations to target schema.
    renderer: minijinja
    template_ref: structured-extraction/map-to-schema
    timeout_seconds: 60
    input_mapping:
      source_text: "{{ source_text }}"
      target_schema: "{{ target_schema }}"
      entities: "{{ step_1_result.entities | default([]) }}"
      relations: "{{ step_2_result.relations | default([]) }}"
      unmapped_text: "{{ step_1_result.unmapped_text | default([]) }}"

  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      COMPUTE EXTRACTION GAP: Deterministic Lisp computation that turns
      the schema-mapping output into a scalar convergence signal.
      Lower = more converged (higher coverage, fewer unresolved fields).
      The score is `(1 - coverage_ratio) + unresolved_penalty` where
      unresolved_penalty is `min(unresolved_count / total_fields, 0.5)`.
      A complete extraction with no unresolved fields scores 0.0; a sparse
      one approaches 1.0. No `default(1.0)` fallback: if the mapping step
      omitted `field_coverage`, `assoc` returns nil and the score falls
      back to 1.0 via the nil-guard — a real measurement ("no coverage
      reported"), surfaced rather than masked.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((cov (assoc "field_coverage" step_3_result))
              (unresolved (assoc "unresolved_fields" step_3_result)))
          (let ((ratio (if (is_null cov) 0.0 (let ((r (assoc "coverage_ratio" cov))) (if (numberp r) r 0.0))))
                (total (if (is_null cov) 1 (let ((t (assoc "total_fields" cov))) (if (numberp t) t 1))))
                (uc (if (is_null unresolved) 0 (length unresolved))))
            (let ((penalty (if (> total 0) (/ uc total) 0)))
              (let ((penalty (if (> penalty 0.5) 0.5 penalty)))
                (+ (- 1.0 ratio) penalty)))))
      env:
        step_3_result: "{{ step_3_result }}"

  - ordinal: 5
    action: loop
    description: Re-enter extraction cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the extraction gap from the lisp.eval step (ordinal 4) into
      # convergence_signal. No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_4_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
