# Structured Extraction Process Manifest
# ℏKask v0.32.0 — Structured extraction as convergent PDCA

manifest:
  id: structured-extraction
  category: skill
  name: Structured Extraction
  description: >
    Convergent structured extraction process. Identifies entities, extracts
    relations, maps data to schema, computes extraction convergence, and
    iterates until coverage and unresolved-field risk are acceptable.
  functional_role: flowdef
  version: 0.32.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: source_text
    type: string
    required: true
  - name: target_schema
    type: object
    required: true
  - name: extraction_hints
    type: array
    required: false

ledger:
  span_namespace: reg.skill.structured-extraction

steps:
  - ordinal: 1
    action: select
    description: Identify entities in source text against target schema.
    renderer: minijinja
    template_ref: structured-extraction/identify-entities
    gas_cap: 5000
    timeout_seconds: 60
    input_mapping:
      source_text: "{{ source_text }}"
      target_schema: "{{ target_schema }}"
      extraction_hints: "{{ extraction_hints | default([]) }}"

  - ordinal: 2
    action: select
    description: Extract semantic relations between identified entities.
    renderer: minijinja
    template_ref: structured-extraction/extract-relations
    gas_cap: 4500
    timeout_seconds: 60
    input_mapping:
      source_text: "{{ source_text }}"
      entities: "{{ step_1_result.entities | default([]) }}"

  - ordinal: 3
    action: select
    description: Map entities and relations to target schema.
    renderer: minijinja
    template_ref: structured-extraction/map-to-schema
    gas_cap: 5000
    timeout_seconds: 60
    input_mapping:
      source_text: "{{ source_text }}"
      target_schema: "{{ target_schema }}"
      entities: "{{ step_1_result.entities | default([]) }}"
      relations: "{{ step_2_result.relations | default([]) }}"
      unmapped_text: "{{ step_1_result.unmapped_text | default([]) }}"

  - ordinal: 4
    action: compute
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 5
    action: loop
    description: Re-enter extraction cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      kata_hypotenuse: "{{ step_4_result.convergence_metric | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
