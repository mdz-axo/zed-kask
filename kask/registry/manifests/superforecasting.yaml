# Superforecasting Process Manifest
# ℏKask v0.35.0 — Tetlock pipeline as convergent PDCA
# Inside view (stage 3) is split: hypothesis generation → falsifiability-hypothesize,
# counterfactual necessary-conditions → falsifiability-counterfactual, probability
# estimation + anchor adjustment → superforecasting/stage_3_probability_estimate.
#
# Co-evolution Phase 1: three native MCP execute steps close the calibration
# loop that the skill's comments previously described but never implemented:
#   - Step 4: market_match (outside-view anchor from prediction markets)
#   - Step 16: scenario_score (persist forecast for later Brier scoring)
#   - Step 18: scenario_calibration (fetch prior Brier/overconfidence curve)
# The loop: forecast → persist → market resolves → Brier score →
#   scenario_calibration reads Brier → overconfidence_score feeds step 20 →
#     next forecast is calibrated.

manifest:
  id: superforecasting
  category: skill
  name: Superforecasting
  description: >
    Convergent eight-stage forecasting process. Runs triage, decomposition,
    outside view, then an inside view that delegates hypothesis generation and
    counterfactual analysis to the falsifiability skill and estimates
    probabilities against the outside-view anchor. Then Bayesian evidence
    update, synthesis, calibration, and forecast recording, then computes
    convergence for iterative refinement.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 5
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: forecasting_question
    type: string
    required: false
  - name: domain
    type: string
    required: false
  - name: time_horizon
    type: string
    required: false
  - name: resolution_criteria
    type: string
    required: false
  - name: expiration_date
    type: string
    required: false
  - name: new_evidence
    type: array
    required: false
  - name: prior_probability
    type: number
    required: false
    description: Prior iteration's final probability for materiality delta check
  - name: overconfidence_bias
    type: number
    required: false
    description: >
      Signed calibration bias (positive = overconfident). Fed to the
      step-20 compute (apply_calibration_adjustment) as a fallback when the
      scenario_calibration execute step (18) returns insufficient data.
      Sources, in priority order: (1) the scenario_calibration execute step
      (18), which fetches the overconfidence_score from the scenarios MCP
      forecast store — the canonical Brier-scored calibration curve; (2) the
      `eqm` skill's feedback step (overconfidence_bias computed from EQM
      red-flag dominance), which the invoking agent fetches by running `eqm`
      on the prior iteration's rationale before re-invoking superforecasting;
      (3) 0.0 (no adjustment).
  - name: market_context
    type: array
    required: false
    description: >
      Annotated prediction-market records for the forecasting question.
      Fetched natively by the market_match execute step (4) from
      hkask-mcp-prediction-markets. Each element is a confidence-tiered
      MarketRecord candidate carrying probability + reliability_tier +
      calibration + ontology mapping. Merged into stage 2's outside-view
      `knowns` so a market-implied base rate anchors the reference class.
      This input is retained as a cascade-level override — the invoking agent
      may pre-populate it to bypass the market_match step's fetch (e.g. when
      the prediction-markets server is offline). When absent, step 4 fetches
      it deterministically.
  - name: expert_prior
    type: array
    required: false
    description: >
      Annotated expert-judgment forecast records for the forecasting
      question, fetched by the invoking agent from the LEAP RSS feed
      (`rss_search` on the `fri-leap` / `fri-leap-reports` streams,
      optionally paginated via `rss_get_entries`) or from any other
      expert-judgment source. Each element carries:
      `question` (the LEAP question text), `median_probability` (the
      median expert forecast), `superforecaster_median` (if available),
      `public_median` (if available), `interquartile_range` (if
      available), `time_horizon` (e.g. '2030', '2050', '2100'),
      `scenario` (e.g. 'rapid AI progress', 'slow AI progress',
      'unconditional'), `rationale_excerpt` (optional), `source_url`
      (the LEAP report URL), `wave` (e.g. 'Wave 10'). Merged into stage
      2's outside-view `knowns` so an expert-judgment base rate anchors the
      reference class alongside any market-implied base rate. Absent = no
      expert anchor (cascade runs on LLM reference classes +
      market_context only).

ledger:
  span_namespace: reg.skill.superforecasting

steps:
  - ordinal: 1
    action: select
    description: Triage forecasting question difficulty and tractability.
    renderer: minijinja
    template_ref: superforecasting/stage_0_triage
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ task | default(forecasting_question) }}"
      domain: "{{ domain | default(null) }}"
      time_horizon: "{{ time_horizon | default(null) }}"

  - ordinal: 2
    action: select
    description: Fermi-decompose forecasting question into sub-questions.
    renderer: minijinja
    template_ref: superforecasting/stage_1_fermi_decompose
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      triage_output: "{{ step_1_result }}"

  - ordinal: 3
    action: compute
    description: >
      Deterministic Fermi calibration — confidence-weighted average of the
      sub-question estimates produced by stage 1. Replaces the LLM's arithmetic
      with the canonical hkask_forecast::calibrate_from_fermi primitive.
      Produces fermi_estimate (the inside-view estimate) consumed by the
      outside-view adjustment compute step.
    compute_ref: calibrate_from_fermi
    timeout_seconds: 5
    input_mapping:
      questions: "{{ step_2_result.sub_questions | default([]) }}"

  # ── Outside-view market anchor (native MCP execute step) ──
  # Fetches prediction-market candidates for the forecasting question via
  # market_match. The result (an array of confidence-tiered MarketRecord
  # candidates) feeds the outside-view step's market_context input, replacing
  # the former agent-mediated fetch. market_match refuses low-confidence
  # matches rather than anchoring on a wrong-event market — an empty result
  # is a valid signal that no relevant market exists, not an error.
  - ordinal: 4
    action: execute
    description: >
      Fetch prediction-market candidates for the forecasting question via
      market_match (hkask-mcp-prediction-markets). Deterministic outside-view
      anchor — the market-implied probability is the strongest reference-class
      base rate when a relevant market exists. Result lands in step_4_result
      and feeds the outside-view step's market_context input.
    mcp: market_match
    timeout_seconds: 60
    input_mapping:
      question: "{{ forecasting_question }}"
      limit: 5
    on_failure:
      action: report
      resume: >
        market_match failed — the prediction-markets MCP server may be down or
        the base-events registry may be empty. Restart the server via
        sync_kask_mcp_servers and re-invoke, or proceed without a market anchor
        by passing market_context: [] as a cascade input.

  - ordinal: 5
    action: select
    description: Build outside-view base-rate anchor.
    renderer: minijinja
    template_ref: superforecasting/stage_2_outside_view
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      sub_questions: "{{ step_2_result.sub_questions | default([]) }}"
      knowns: "{{ step_2_result.knowns | default([]) }}"
      market_context: "{{ step_4_result | default([]) }}"
      expert_prior: "{{ expert_prior | default([]) }}"

  - ordinal: 6
    action: compute
    description: >
      Deterministic outside-view adjustment — shrinkage estimator blending the
      LLM-produced base rate (starting_probability) with the Fermi inside
      estimate. Uses hkask_forecast::outside_view_adjustment. The reference_count
      is proxied by the number of reference classes the LLM identified
      (base_rates array length) — more classes means more data, less shrinkage.
      Produces calibrated + confidence, the anchor consumed by the
      probability-estimate stage.
    compute_ref: outside_view_adjustment
    timeout_seconds: 5
    input_mapping:
      base_rate: "{{ step_5_result.starting_probability | default(0.5) }}"
      inside_estimate: "{{ step_3_result.calibrated | default(0.5) }}"
      reference_count: "{{ step_5_result.base_rates | default([]) | length }}"

  - ordinal: 7
    action: select
    description: >
      Delegate causal-hypothesis generation to the falsifiability skill
      (Chamberlin multiple working hypotheses — forced diversity, Platt-form
      predictions, falsifiers, vibe discardal). Replaces the generation half of
      the former inside-view step.
    renderer: minijinja
    template_ref: falsifiability/falsifiability-hypothesize
    timeout_seconds: 150
    input_mapping:
      admitted_target: "{{ forecasting_question }}"
      domain: "{{ domain | default('forecasting') }}"
      context: "{{ {'sub_questions': step_2_result.sub_questions | default([]), 'outside_view': step_5_result} }}"

  - ordinal: 8
    action: select
    description: >
      Delegate necessary-conditions counterfactual analysis to the falsifiability
      skill (Pearl do-operator). For each hypothesis construct the minimal
      counterfactual and derive its testable consequence. Replaces the
      required-conditions half of the former inside-view step.
    renderer: minijinja
    template_ref: falsifiability/falsifiability-counterfactual
    timeout_seconds: 150
    input_mapping:
      hypotheses: "{{ step_7_result.hypotheses | default([]) }}"
      admitted_target: "{{ forecasting_question }}"
      domain: "{{ domain | default('forecasting') }}"

  - ordinal: 9
    action: select
    description: >
      Estimate per-hypothesis probabilities (informed by each counterfactual's
      testable consequence), enforce internal consistency, and estimate the
      conditional probability tree. The remaining inside-view work after
      generation and counterfactual analysis were delegated. The starting
      probability now comes from the deterministic outside-view compute step
      (step_6_result.calibrated), not the LLM's raw starting_probability. The
      tree combination is no longer LLM-estimated — stage 3 emits the tree
      (tree_nodes) and the next compute step (combine_tree_probabilities)
      derives tree_combined_probability via the exact chain-rule
      marginalization.
    renderer: minijinja
    template_ref: superforecasting/stage_3_probability_estimate
    timeout_seconds: 150
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      hypotheses: "{{ step_7_result.hypotheses | default([]) }}"
      counterfactuals: "{{ step_8_result.counterfactuals | default([]) }}"
      starting_probability: "{{ step_6_result.calibrated | default(0.5) }}"
      outside_view_output: "{{ step_5_result }}"
      sub_question_tree: "{{ step_2_result.sub_question_tree | default([]) }}"
      topological_order: "{{ step_2_result.topological_order | default([]) }}"
      outcome_node_id: "{{ step_2_result.outcome_node_id | default('') }}"

  - ordinal: 10
    action: compute
    description: >
      Deterministic conditional-tree combine — replaces stage_3's former
      "Aggregate hypothesis probabilities into a single combined_probability"
      heuristic with the exact chain-rule computation. Walks the tree emitted
      by stage_3 in topological order via
      hkask_forecast::combine_tree_probabilities (which delegates per-node to
      marginalize, the single source of truth for joint marginalization, and
      combines multi-entry dependencies by product). Produces
      tree_combined_probability, the inside-view posterior consumed by stage_4
      as its prior. No independence heuristic is applied across a node's
      parents — the conditioning is encoded in each conditional table.
    compute_ref: combine_tree_probabilities
    timeout_seconds: 5
    input_mapping:
      nodes: "{{ step_9_result.tree_nodes | default([]) }}"
      topological_order: "{{ step_2_result.topological_order | default([]) }}"
      outcome_id: "{{ step_2_result.outcome_node_id | default('') }}"

  - ordinal: 11
    action: select
    description: Apply Bayesian updates from incoming evidence.
    renderer: minijinja
    template_ref: superforecasting/stage_4_evidence_update
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      prior_probability: "{{ step_10_result.tree_combined_probability | default(step_9_result.hypothesis_probabilities.combined_probability | default(step_6_result.calibrated | default(0.5))) }}"
      hypothesis_analysis: "{{ step_9_result.hypothesis_probabilities | default({}) }}"
      new_evidence: "{{ new_evidence | default([]) }}"
      market_context: "{{ step_4_result | default([]) }}"
      expert_prior: "{{ expert_prior | default([]) }}"

  - ordinal: 12
    action: compute
    description: >
      Deterministic Bayesian update — applies Bayes' theorem using the LLM's
      evidence assessment (evidence_likelihood = P(E|H), evidence_base_rate =
      P(E)) and the prior from the tree-combine step. Uses
      hkask_forecast::bayesian_update. Replaces the LLM's arithmetic with
      canonical math. The LLM's updated_probability is retained in step_11_result
      for cross-validation against this deterministic posterior.
    compute_ref: bayesian_update
    timeout_seconds: 5
    input_mapping:
      prior: "{{ step_10_result.tree_combined_probability | default(step_6_result.calibrated | default(0.5)) }}"
      evidence_likelihood: "{{ step_11_result.evidence_likelihood | default(0.5) }}"
      evidence_base_rate: "{{ step_11_result.evidence_base_rate | default(0.5) }}"

  - ordinal: 13
    action: select
    description: Synthesize multi-model dragonfly-eye view.
    renderer: minijinja
    template_ref: superforecasting/stage_5_synthesis
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      updated_probability: "{{ step_12_result.posterior | default(0.5) }}"
      hypothesis_analysis: "{{ step_9_result.hypothesis_probabilities | default({}) }}"
      inside_view_output: "{{ step_9_result }}"

  - ordinal: 14
    action: select
    description: Calibrate final probability and confidence level.
    renderer: minijinja
    template_ref: superforecasting/stage_6_calibration
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      synthesized_probability: "{{ step_13_result.synthesized_probability | default(step_12_result.posterior | default(0.5)) }}"
      synthesis_output: "{{ step_13_result }}"
      pipeline_outputs: "{{ {'triage': step_1_result, 'outside': step_5_result, 'inside': step_9_result, 'evidence': step_11_result, 'synthesis': step_13_result} }}"

  - ordinal: 15
    action: select
    description: Record structured forecast for later scoring/post-mortem.
    renderer: minijinja
    template_ref: superforecasting/stage_7_record
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      final_probability: "{{ step_14_result.final_probability | default(step_13_result.synthesized_probability | default(0.5)) }}"
      confidence_level: "{{ step_14_result.confidence_level | default('medium') }}"
      pipeline_summary: "{{ {'triage_difficulty': step_1_result.difficulty_level | default('unknown'), 'sub_question_count': step_2_result.sub_questions | default([]) | length, 'reference_class_count': step_5_result.reference_classes | default([]) | length, 'hypothesis_count': step_7_result.hypotheses | default([]) | length, 'evidence_count': step_11_result.evidence_items | default([]) | length} }}"
      resolution_criteria: "{{ resolution_criteria | default('Outcome judged against explicit public evidence.') }}"
      expiration_date: "{{ expiration_date | default(null) }}"

  # ── Forecast persistence (native MCP execute step) ──
  # Persists the forecast to the scenarios MCP forecast store via
  # scenario_score with empty outcomes. scenario_score inserts each event as a
  # pending StoredForecastRecord (outcome: None) — durable via journal append.
  # When the forecast later resolves, a subsequent scenario_score call with
  # outcomes populated resolves the records and computes the Brier score.
  # This closes the persistence half of the calibration loop: the forecast is
  # now in the store where scenario_calibration can read it on the next
  # invocation.
  - ordinal: 16
    action: execute
    description: >
      Persist the forecast to the scenarios MCP forecast store via
      scenario_score (hkask-mcp-scenarios) with empty outcomes. The forecast is
      inserted as a pending record for later resolution and Brier scoring.
      Closes the persistence half of the calibration loop.
    mcp: scenario_score
    timeout_seconds: 60
    input_mapping:
      forecast_id: "{{ step_15_result.tracking_id | default(forecasting_question) }}"
      events:
        - id: "{{ step_15_result.tracking_id | default(forecasting_question) }}"
          name: "{{ step_15_result.forecast_record.question | default(forecasting_question) }}"
          question: "{{ step_15_result.forecast_record.question | default(forecasting_question) }}"
          deadline: "{{ step_15_result.forecast_record.expiration_date | default(expiration_date) | default('2030-01-01') }}"
          time_horizon: "{{ step_1_result.time_horizon | default(time_horizon) | default('strategic') }}"
          scenario_type: "{{ step_1_result.scenario_type | default('emerging_economic') }}"
          subject: "{{ domain | default(forecasting_question) }}"
          probability: "{{ step_15_result.forecast_record.probability | default(step_14_result.final_probability | default(0.5)) }}"
          depends_on: []
          sub_questions: []
          base_rate: null
          reference_class: null
          brier_score: null
          update_count: 0
      outcomes: []
    on_failure:
      action: report
      resume: >
        scenario_score failed to persist the forecast — the scenarios MCP
        server may be down or the forecast store may be unwritable. Restart
        the server via sync_kask_mcp_servers and re-invoke. The forecast is
        still valid (in step_15_result) but will not be available for future
        Brier scoring until persisted.

  - ordinal: 17
    action: select
    description: Independent quality gate — evaluates calibration realism, confidence, evidence trail, and record completeness.
    renderer: minijinja
    template_ref: superforecasting/forecast-quality-gate
    timeout_seconds: 120
    input_mapping:
      forecasting_question: "{{ forecasting_question }}"
      calibration_result: "{{ step_14_result }}"
      record_result: "{{ step_15_result }}"
      synthesis_output: "{{ step_13_result }}"

  # ── Calibration curve fetch (native MCP execute step) ──
  # Fetches the forecaster's calibration curve from the scenarios MCP via
  # scenario_calibration. The curve is computed from resolved forecasts in the
  # store — the same store that step 16 persists to. The overconfidence_score
  # from this curve feeds the apply_calibration_adjustment compute step,
  # closing the calibration loop: prior forecasts → Brier scores →
  # overconfidence bias → adjusted prior for this forecast.
  #
  # CRITICAL (.rules trap): this step must NOT collapse a failed fetch to
  # overconfidence_bias: 0.0 — that would silently disable calibration. The
  # on_failure config escalates so the operator knows the calibration curve is
  # unavailable, rather than the skill proceeding as if the forecaster were
  # perfectly calibrated.
  - ordinal: 18
    action: execute
    description: >
      Fetch the forecaster's calibration curve from the scenarios MCP via
      scenario_calibration (hkask-mcp-scenarios). Returns overall_brier,
      overconfidence_score, and per-bin calibration data from resolved
      forecasts. The overconfidence_score feeds the
      apply_calibration_adjustment compute step (20), closing the Brier
      feedback loop. On the first invocation with no resolved forecasts, the
      tool returns overconfidence_score: 0.0 with guidance noting insufficient
      data — this is a valid result, not a failure.
    mcp: scenario_calibration
    timeout_seconds: 60
    input_mapping:
      subject: "{{ domain | default(null) }}"
    on_failure:
      action: report
      resume: >
        scenario_calibration failed — the scenarios MCP server may be down or
        the forecast store may be corrupt. Restart the server via
        sync_kask_mcp_servers and re-invoke. Do NOT proceed with
        overconfidence_bias: 0.0 — that silently disables calibration. If the
        server cannot be restored, the operator may manually pass
        overconfidence_bias as a cascade input to proceed without the curve.

  - ordinal: 19
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence score from the forecast-quality-gate step's
      actual output. The quality-gate template produces four 0–1 dimension
      scores (calibration_realism, confidence_justification, evidence_trail,
      record_completeness, each 1.0 = optimal). The score is
      (4 - sum(scores)) / 4 so lower = more converged. Any missing dimension
      degrades to 1.0 (not converged). Replaces the phantom
      `convergence_metric` binding that silently defaulted to 1.0.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((cr (assoc "calibration_realism_score" step_17_result))
              (cj (assoc "confidence_justification_score" step_17_result))
              (et (assoc "evidence_trail_score" step_17_result))
              (rc (assoc "record_completeness_score" step_17_result)))
          (if (is_null cr) 1.0
            (if (is_null cj) 1.0
              (if (is_null et) 1.0
                (if (is_null rc) 1.0
                  (let ((cr-n (if (numberp cr) cr 1.0))
                        (cj-n (if (numberp cj) cj 1.0))
                        (et-n (if (numberp et) et 1.0))
                        (rc-n (if (numberp rc) rc 1.0)))
                    (/ (- 4.0 (+ cr-n cj-n et-n rc-n)) 4.0)))))))
      env:
        step_17_result: "{{ step_17_result }}"

  - ordinal: 20
    action: compute
    description: >
      Apply the learned calibration bias to the prior probability before
      re-entering the loop. Uses hkask_forecast::apply_calibration_adjustment
      — the canonical primitive that closes the Brier feedback loop. The
      overconfidence_bias input is sourced from the scenario_calibration
      execute step (18) when available, falling back to the cascade input
      overconfidence_bias (from the eqm skill or operator) when the
      calibration curve has insufficient data.
    compute_ref: apply_calibration_adjustment
    timeout_seconds: 5
    input_mapping:
      prior: "{{ step_14_result.final_probability | default(0.5) }}"
      overconfidence_bias: "{{ step_18_result.overconfidence_score | default(overconfidence_bias | default(0.0)) }}"

  - ordinal: 21
    action: loop
    description: >
      Re-enter forecasting refinement cycle if convergence is not met.
      NOTE: Triage (step 1) is skipped on re-entry because the question
      has already been classified as Goldilocks on the first pass. The
      loop restarts at Fermi decomposition (step 2). The prior iteration's
      calibration-adjusted probability is carried forward as prior_probability
      so the convergence check's materiality guard can detect vacuous
      iterations (delta < 0.02 with no new evidence). The market_match (4),
      scenario_score (16), and scenario_calibration (18) execute steps also
      re-run on each iteration — the market anchor and calibration curve are
      fresh on every pass.
    input_mapping:
      loop_target: "{{ 2 }}"
      prior_probability: "{{ step_20_result.adjusted | default(step_14_result.final_probability | default(0.5)) }}"
      # Push the forecast quality signal into convergence_signal so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      convergence_signal: "{{ step_19_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
