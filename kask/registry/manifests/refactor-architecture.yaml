# Refactor Architecture Process Manifest
# hKask v0.31.0 — End-to-end architecture refactoring as convergent PDCA
#
# Merged from improve-codebase-architecture (discover phase) + refactor-service-layer (execution phase).
# Unified flow: explore -> candidates -> deepen -> route -> audit -> strangle -> verify -> converge
# Includes migration-strategy phase (folded from standalone strangler-fig skill).

manifest:
  id: refactor-architecture
  category: skill
  name: Refactor Architecture
  description: >
    End-to-end architecture refactoring. Explores architectural friction, ranks
    deepening candidates, walks the design tree with human-in-the-loop grilling,
    routes decisions, audits cross-surface duplication, plans strangler-fig
    migration, verifies integrity, computes convergence, and iterates until
    extraction risks are reduced. Merged from improve-codebase-architecture
    (discover phase) and refactor-service-layer (execution phase). Includes
    migration-strategy phase (folded from strangler-fig). Composes tdd,
    coding-guidelines, pragmatic-semantics, graph-audit, deep-module,
    essentialist, and pragmatic-cybernetics as methodological guidance.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: focus_area
    type: string
    required: true
  - name: code_context
    type: object
    required: false
  - name: known_adrs
    type: array
    required: false
  - name: constraint_forces
    type: array
    required: false
  - name: domain
    type: string
    required: false
  - name: service_module_name
    type: string
    required: false
  - name: current_cli_path
    type: string
    required: false
  - name: current_api_path
    type: string
    required: false
  - name: service_context_design
    type: object
    required: false
  - name: migration_phase
    type: string
    required: false

steps:
  # === DISCOVER PHASE (folded from improve-codebase-architecture) ===
  - ordinal: 1
    action: select
    description: Explore architecture friction and shallow-module patterns.
    renderer: minijinja
    template_ref: refactor-architecture/ra-explore
    gas_cap: 7000
    timeout_seconds: 60
    input_mapping:
      focus_area: "{{ focus_area }}"
      code_context: "{{ code_context | default({}) }}"
      known_adrs: "{{ known_adrs | default([]) }}"

  - ordinal: 2
    action: select
    description: Rank deepening candidates from exploration findings.
    renderer: minijinja
    template_ref: refactor-architecture/ra-candidates
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      friction_points: "{{ step_1_result.friction_points | default([]) }}"
      shallow_modules: "{{ step_1_result.shallow_modules | default([]) }}"
      focus_area: "{{ focus_area }}"
      known_adrs: "{{ known_adrs | default([]) }}"

  - ordinal: 3
    action: select
    description: Walk the design tree for the user-selected candidate — define deepened module shape, identify seams, confirm test surface. Human-in-the-loop grilling.
    renderer: minijinja
    template_ref: refactor-architecture/ra-deepen
    gas_cap: 8000
    timeout_seconds: 120
    condition: "{{ (step_2_result.candidates | default([])) | length > 0 }}"
    input_mapping:
      selected_candidate: "{{ step_2_result.selected_candidate | default(step_2_result.candidates[0] | default({})) }}"
      friction_points: "{{ step_1_result.friction_points | default([]) }}"
      focus_area: "{{ focus_area }}"
      known_adrs: "{{ known_adrs | default([]) }}"

  - ordinal: 4
    action: select
    description: Route the deepened design — proceed to refactor (audit), need more data (diagnose), or defer.
    renderer: minijinja
    template_ref: refactor-architecture/ra-route
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      deepened_design: "{{ step_3_result }}"

  # === EXECUTION PHASE (folded from refactor-service-layer) ===
  # Runs when route decision is proceed_to_refactor.
  - ordinal: 5
    action: select
    description: Audit cross-surface duplication and extraction viability.
    renderer: minijinja
    template_ref: refactor-architecture/ra-audit
    gas_cap: 7000
    timeout_seconds: 60
    condition: "step_4_result.decision == 'proceed_to_refactor'"
    input_mapping:
      focus_area: "{{ focus_area }}"
      code_context: "{{ code_context | default({}) }}"
      known_adrs: "{{ known_adrs | default([]) }}"
      constraint_forces: "{{ constraint_forces | default([]) }}"
      deepened_design: "{{ step_3_result }}"

  - ordinal: 6
    action: select
    description: Plan strangler-fig migration for selected service domain.
    renderer: minijinja
    template_ref: refactor-architecture/ra-strangle
    gas_cap: 7000
    timeout_seconds: 60
    condition: "step_4_result.decision == 'proceed_to_refactor'"
    input_mapping:
      domain: "{{ domain | default(step_5_result.top_recommendation | default('')) }}"
      service_module_name: "{{ service_module_name | default('ExtractedService') }}"
      current_cli_path: "{{ current_cli_path | default('') }}"
      current_api_path: "{{ current_api_path | default('') }}"
      service_context_design: "{{ service_context_design | default({}) }}"
      known_adrs: "{{ known_adrs | default([]) }}"
      constraint_forces: "{{ constraint_forces | default([]) }}"

  - ordinal: 7
    action: select
    description: Verify migration completeness and boundary discipline.
    renderer: minijinja
    template_ref: refactor-architecture/ra-verify
    gas_cap: 5000
    timeout_seconds: 60
    condition: "step_4_result.decision == 'proceed_to_refactor'"
    input_mapping:
      domain: "{{ domain | default('') }}"
      migration_phase: "{{ migration_phase | default('domain_migration') }}"
      code_context: "{{ code_context | default(step_6_result) }}"
      known_adrs: "{{ known_adrs | default([]) }}"

  - ordinal: 8
    action: compute
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 9
    action: loop
    description: Re-enter architecture refactoring cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      kata_hypotenuse: "{{ step_8_result.convergence_metric | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.refactor-architecture
  telemetry_namespace: hkask.template.refactor-architecture
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
