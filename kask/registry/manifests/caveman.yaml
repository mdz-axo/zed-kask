# Caveman Process Manifest
# ℏKask v0.35.0 — Compression mode as convergent PDCA

manifest:
  id: caveman
  category: skill
  name: Caveman
  description: >
    Convergent compression process. Compresses a draft response into caveman mode,
    computes convergence from compression quality and clarity exceptions, and
    iterates until concise output is stable.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: ""
  # No convergence-check compute step: the loop runs N iterations then escalates.
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: draft_response
    type: string
    required: false
  - name: context_topic
    type: string
    required: false

ledger:
  span_namespace: reg.skill.caveman

steps:
  - ordinal: 1
    action: select
    description: Compress draft response into caveman mode.
    renderer: minijinja
    template_ref: caveman/caveman-compress
    timeout_seconds: 30
    input_mapping:
      draft_response: "{{ task | default(draft_response) }}"
      context_topic: "{{ context_topic | default('general') }}"

  - ordinal: 2
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the compression ratio from the
      compress step. Lower signal variance across iterations = convergence
      (Cauchy). Using lisp.eval instead of a Jinja expression makes the
      computation explicitly deterministic, budgeted (gas_cap: 100), and
      observable via a reg.skill.caveman span. Guards against a missing
      compression_ratio field by returning 0 when absent.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((ratio (assoc "compression_ratio" step_1_result)))
          (if (is_null ratio) 0 ratio))
      env:
        step_1_result: "{{ step_1_result | default({}) }}"

  - ordinal: 3
    action: loop
    description: Re-enter caveman cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 2). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_2_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
