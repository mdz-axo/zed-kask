# Caveman Process Manifest
# ℏKask v0.32.0 — Compression mode as convergent PDCA

manifest:
  id: caveman
  category: skill
  name: Caveman
  description: >
    Convergent compression process. Compresses a draft response into caveman mode,
    computes convergence from compression quality and clarity exceptions, and
    iterates until concise output is stable.
  functional_role: flowdef
  version: 0.32.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  # target_artifacts_field removed — no compute step to consume it
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: draft_response
    type: string
    required: true
  - name: context_topic
    type: string
    required: false

ledger:
  span_namespace: reg.skill.caveman

steps:
  - ordinal: 1
    action: select
    description: Compress draft response into caveman mode.
    renderer: minijinja
    template_ref: caveman/caveman-compress
    gas_cap: 3000
    timeout_seconds: 30
    input_mapping:
      draft_response: "{{ draft_response }}"
      context_topic: "{{ context_topic | default('general') }}"

  - ordinal: 2
    action: compute
    compute_ref: kata.convergence_check
    description: >
      CHECK CONVERGENCE: Cauchy criterion on the compression ratio. The
      caveman mode has converged when the compression ratio stops
      changing across iterations.
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 3
    action: loop
    description: Re-enter caveman cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the compression ratio into kata_hypotenuse so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      kata_hypotenuse: "{{ step_1_result.compression_ratio | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
