# Caveman Process Manifest
# ℏKask v0.31.0 — Compression mode as convergent PDCA

manifest:
  id: caveman
  category: skill
  name: Caveman
  description: >
    Convergent compression process. Compresses a draft response into caveman mode,
    computes convergence from compression quality and clarity exceptions, and
    iterates until concise output is stable.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  target_artifacts_field: step_1_result.compressed_response
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: draft_response
    type: string
    required: true
  - name: context_topic
    type: string
    required: false

steps:
  - ordinal: 1
    action: select
    description: Compress draft response into caveman mode.
    renderer: minijinja
    template_ref: caveman/caveman-compress
    gas_cap: 3000
    timeout_seconds: 30
    input_mapping:
      draft_response: "{{ draft_response }}"
      context_topic: "{{ context_topic | default('general') }}"

  - ordinal: 2
    action: loop
    description: Re-enter caveman cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the compression ratio into kata_hypotenuse so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      kata_hypotenuse: "{{ step_1_result.compression_ratio | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: caveman/caveman-compress
      gas_budget: 3000
    - resource: manifest
      action: execute
      template_id: caveman
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true
