# Skill Maintenance Process Manifest
# hKask v0.31.0 — Registry health maintenance as PDCA
#
# Two modes:
#   maintenance (default) — audit staleness, coverage gaps, convergence
#   logic_audit            — bounded dual-layer logic audit of .j2 templates
#                           against stated goals (folded from skill-logic-audit)

manifest:
  id: skill-maintenance
  category: skill
  name: Skill Maintenance
  description: >
    Convergent maintenance process for the skill corpus. Audits staleness,
    checks coverage gaps, computes convergence, and iterates until critical
    maintenance blockers are reduced below threshold. Includes logic_audit
    mode (folded from skill-logic-audit): bounded dual-layer logic audit of
    .j2 templates against stated goals — load goal, critique, filter for
    soundness, compose revised artifact, drive user-review loop.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  threshold: 0.15
  improvement_gate: threshold_only
  max_iterations: 3
  min_iterations: 1
  convergence_field: convergence_metric
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: mode
    type: string
    required: false
    default: "maintenance"
    description: >
      Mode: "maintenance" (default — staleness/coverage audit) or
      "logic_audit" (bounded dual-layer logic audit of .j2 templates).
  - name: skill_name
    type: string
    description: "Optional specific skill to audit"
    required: false
  - name: workspace_context
    type: object
    description: "Workspace metadata and known references"
    required: false
  - name: skill_catalog
    type: array
    description: "Installed skill catalog (same array passed to skill-discovery and skill-router)"
    required: false
  - name: task_patterns
    type: array
    description: "Task patterns to map against corpus"
    required: false
  # ── logic_audit mode inputs ──
  - name: target_path
    type: string
    required: false
    description: "Path to the .j2 or manifest.yaml file to audit (logic_audit mode)."
  - name: target_content
    type: string
    required: false
    description: "Raw content of the target file (logic_audit mode)."
  - name: template_type
    type: string
    required: false
    description: "File type: j2 or manifest (logic_audit mode)."

steps:
  # === MAINTENANCE MODE (default) ===
  - ordinal: 1
    action: select
    condition: "{{ mode | default('maintenance') == 'maintenance' }}"
    description: Run staleness and health audit for target scope.
    renderer: minijinja
    template_ref: skill-maintenance/skill-maintenance-audit
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      skill_name: "{{ skill_name | default('') }}"
      workspace_context: "{{ workspace_context | default({}) }}"

  - ordinal: 2
    action: select
    condition: "{{ mode | default('maintenance') == 'maintenance' }}"
    description: Run corpus coverage analysis for uncovered/partial capabilities.
    renderer: minijinja
    template_ref: skill-maintenance/skill-maintenance-coverage
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      skill_catalog: "{{ skill_catalog | default([]) }}"
      task_patterns: "{{ task_patterns | default([]) }}"

  - ordinal: 3
    action: select
    condition: "{{ mode | default('maintenance') == 'maintenance' }}"
    description: Compute normalized convergence metric for maintenance cycle.
    renderer: minijinja
    template_ref: skill-maintenance/skill-maintenance-convergence-check
    gas_cap: 2000
    timeout_seconds: 30
    input_mapping:
      audit_result: "{{ step_1_result }}"
      coverage_result: "{{ step_2_result }}"

  # === LOGIC_AUDIT MODE (folded from skill-logic-audit) ===
  - ordinal: 4
    action: select
    condition: "{{ mode == 'logic_audit' }}"
    description: >
      LOGIC LOAD-GOAL: Parse the annotated goal: block from the target .j2
      or manifest.yaml file. Strip comment markers, preserve exact goal text.
    renderer: minijinja
    template_ref: skill-maintenance/logic-load-goal
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      target_path: "{{ target_path }}"
      target_content: "{{ target_content }}"
      template_type: "{{ template_type }}"

  - ordinal: 5
    action: select
    condition: "{{ mode == 'logic_audit' }}"
    description: >
      LOGIC CRITIQUE: Adversarial critique of the template body against its
      stated goal. For each flaw, provide location, claim, anchor to goal,
      severity, and suggested fix.
    renderer: minijinja
    template_ref: skill-maintenance/logic-critique-template
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      target_path: "{{ target_path }}"
      target_content: "{{ target_content }}"
      template_type: "{{ template_type }}"
      goal: "{{ step_4_result.goal }}"

  - ordinal: 6
    action: select
    condition: "{{ mode == 'logic_audit' }}"
    description: >
      LOGIC SOUNDNESS FILTER: Review the critique for soundness — separate
      valid, goal-anchored concerns from spurious ones.
    renderer: minijinja
    template_ref: skill-maintenance/logic-critique-critique
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      goal: "{{ step_4_result.goal }}"
      prior_critique: "{{ step_5_result }}"

  - ordinal: 7
    action: select
    condition: "{{ mode == 'logic_audit' }}"
    description: >
      LOGIC COMPOSE: Compose a concrete revised artifact and unified diff
      from the calibrated concerns.
    renderer: minijinja
    template_ref: skill-maintenance/logic-compose-proposal
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      target_path: "{{ target_path }}"
      original_content: "{{ target_content }}"
      goal: "{{ step_4_result.goal }}"
      calibrated_verdict: "{{ step_6_result.calibrated_verdict }}"
      valid_concerns: "{{ step_6_result.valid_concerns }}"

  - ordinal: 8
    action: select
    condition: "{{ mode == 'logic_audit' }}"
    description: >
      LOGIC USER-CHOICE: Present the proposal to the user and capture
      accept/reject/counter-proposal.
    renderer: minijinja
    template_ref: skill-maintenance/logic-user-choice
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      target_path: "{{ target_path }}"
      proposal: "{{ step_7_result.revised_content }}"
      diff: "{{ step_7_result.diff }}"

  - ordinal: 9
    action: select
    condition: "{{ mode == 'logic_audit' }}"
    description: >
      LOGIC CONVERGENCE: Compute normalized convergence metric for the audit
      cycle. Converged when no material flaws remain.
    renderer: minijinja
    template_ref: skill-maintenance/logic-convergence-check
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      calibrated_verdict: "{{ step_6_result.calibrated_verdict }}"
      valid_concerns: "{{ step_6_result.valid_concerns }}"
      loop_depth: "{{ loop_depth | default(0) }}"

  - ordinal: 10
    action: loop
    condition: "{{ mode | default('maintenance') == 'maintenance' }}"
    description: Re-enter maintenance cycle if convergence is not met.
    input_mapping:
      loop_target: 1
      convergence_metric: "{{ step_3_result.convergence_metric | default(1.0) }}"

  - ordinal: 11
    action: loop
    condition: "{{ mode == 'logic_audit' }}"
    description: Re-enter logic audit cycle if convergence is not met.
    input_mapping:
      loop_target: 4
      convergence_metric: "{{ step_9_result.convergence_metric | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    # Maintenance mode templates
    - resource: template
      action: render
      template_id: skill-maintenance/skill-maintenance-audit
      gas_budget: 6000
    - resource: template
      action: render
      template_id: skill-maintenance/skill-maintenance-coverage
      gas_budget: 6000
    - resource: template
      action: render
      template_id: skill-maintenance/skill-maintenance-convergence-check
      gas_budget: 2000
    # Logic audit mode templates (folded from skill-logic-audit)
    - resource: template
      action: render
      template_id: skill-maintenance/logic-load-goal
      gas_budget: 2048
    - resource: template
      action: render
      template_id: skill-maintenance/logic-critique-template
      gas_budget: 4096
    - resource: template
      action: render
      template_id: skill-maintenance/logic-critique-critique
      gas_budget: 2048
    - resource: template
      action: render
      template_id: skill-maintenance/logic-compose-proposal
      gas_budget: 4096
    - resource: template
      action: render
      template_id: skill-maintenance/logic-user-choice
      gas_budget: 2048
    - resource: template
      action: render
      template_id: skill-maintenance/logic-convergence-check
      gas_budget: 2048
    - resource: manifest
      action: execute
      template_id: skill-maintenance
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true

ledger:
  emit_spans: true
  span_namespace: hkask.template.skill-maintenance
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
