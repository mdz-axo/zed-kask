# Skill Maintenance Process Manifest
# hKask v0.35.0 — Registry health maintenance as PDCA
#
# Corpus-level maintenance: audit staleness, check coverage gaps, compute
# convergence, iterate until critical maintenance blockers are reduced.
# The logic_audit mode was unfolded into skill-logic-audit (2026-08-14)
# because the two modes shared no steps, no data flow, and no convergence
# logic — folding them caused systematic off-by-one step_N_result references.

manifest:
  id: skill-maintenance
  category: skill
  name: Skill Maintenance
  description: >
    Convergent maintenance process for the skill corpus. Audits staleness,
    checks coverage gaps, computes convergence, and iterates until critical
    maintenance blockers are reduced below threshold.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: skill_name
    type: string
    description: "Optional specific skill to audit"
    required: false
  - name: workspace_context
    type: object
    description: "Workspace metadata and known references"
    required: false
  - name: skill_catalog
    type: array
    description: "Installed skill catalog (same array passed to skill-discovery and skill-router)"
    required: false
  - name: task_patterns
    type: array
    description: "Task patterns to map against corpus"
    required: false

steps:
  - ordinal: 1
    action: select
    description: Run staleness and health audit for target scope.
    renderer: minijinja
    template_ref: skill-maintenance/skill-maintenance-audit
    gas_cap: 6000
    timeout_seconds: 150
    input_mapping:
      skill_name: "{{ skill_name | default('') }}"
      workspace_context: "{{ workspace_context | default({}) }}"

  - ordinal: 2
    action: select
    description: Run corpus coverage analysis for uncovered/partial capabilities.
    renderer: minijinja
    template_ref: skill-maintenance/skill-maintenance-coverage
    gas_cap: 6000
    timeout_seconds: 150
    input_mapping:
      skill_catalog: "{{ skill_catalog | default([]) }}"
      task_patterns: "{{ task_patterns | default([]) }}"

  - ordinal: 3
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence score from the coverage step's actual output.
      The skill-maintenance-coverage template produces `uncovered_patterns`
      and `partial_coverage` arrays; the sum of their lengths is the distance
      from full corpus coverage. Lower = more converged.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((u (length (assoc "uncovered_patterns" step_2_result)))
              (p (length (assoc "partial_coverage" step_2_result))))
          (+ 0.0 (+ u p)))
      env:
        step_2_result: "{{ step_2_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 4
    action: loop
    description: Re-enter maintenance cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_3_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.skill-maintenance
  telemetry_namespace: hkask.template.skill-maintenance
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
