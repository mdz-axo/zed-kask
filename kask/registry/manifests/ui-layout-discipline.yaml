# UI Layout Discipline Process Manifest
# hKask v0.35.0 — Measured layout discipline as phased PDCA
# Sense → Orient → Decide → Act → Review → Convergence
#
# The skill enforces a measurement-first discipline: no element is added
# to a card or panel renderer without first measuring the container,
# counting the elements, checking the text column, and matching codebase
# patterns. The convergence signal is the layout_health vector stabilizing
# (all gates pass) across adversarial probes.

manifest:
  id: ui-layout-discipline
  category: skill
  name: UI Layout Discipline
  description: >
    Enforces measured layout discipline for GPUI card/panel renderers. Runs
    a Sense → Orient → Decide → Act → Review loop: measures the container
    and children, counts actions against a budget, gates on hard constraints
    (no overflow, primary action visible, text column ≥ min width, on-grid
    spacing), applies progressive disclosure remedies (PopoverMenu overflow,
    truncate, flex_shrink_0, min_w_0), and runs an adversarial review
    (long-label, narrow-container, localized-text, high-count probes).
    Emits reg.ui_layout.* spans. Any userpod may invoke this skill.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 5
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "layout_health"


rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: target
    type: object
    required: false
    description: >
      The card or panel renderer being reviewed. Must include the file path,
      the render function name, and the element tree (or a description of
      the elements: buttons, labels, icons, their styles and flex properties).
  - name: container_width
    type: string
    required: false
    default: "dock"
    description: >
      The container context: "dock" (~300-400px), "center" (~600px+), or
      a specific pixel width. Defaults to "dock" (the narrowest common case).
  - name: codebase_context
    type: object
    required: false
    description: >
      Sibling card/panel components in the same crate, with their action
      counts and layout patterns. Used by the Orient phase for Nielsen
      consistency checking.

ledger:
  span_namespace: reg.skill.ui-layout-discipline

steps:
  - ordinal: 1
    action: select
    description: >
      SENSE: Measure the container's available width and each child element's
      minimum width. Compute whether sum(min_widths) + gaps exceeds the
      container. If a text column (flex_1) is present, compute its residual
      width after fixed-width children claim their space. Grounded in
      Fitts's Law (minimum target width ~32px mouse, ~44px touch) and the
      CSS flexbox overflow invariant.
    renderer: minijinja
    template_ref: ui-layout-discipline/sense
    timeout_seconds: 120
    input_mapping:
      target: "{{ task | default(target) }}"
      container_width: "{{ container_width | default('dock') }}"

  - ordinal: 2
    action: select
    description: >
      ORIENT: Count the interactive elements in the container. Compare to
      the action budget (≤5 primary, per Hick's Law). Grep the crate for
      sibling card/panel components and compare action-count/spacing
      conventions (Nielsen consistency). Compute the feature congestion
      score (Rosenholtz) and the action-to-content ratio (Tufte data-ink).
    renderer: minijinja
    template_ref: ui-layout-discipline/orient
    timeout_seconds: 120
    input_mapping:
      target: "{{ target }}"
      sense_result: "{{ step_1_result }}"
      codebase_context: "{{ codebase_context | default({}) }}"

  - ordinal: 3
    action: select
    description: >
      DECIDE: Apply the Fagan-style inspection checklist as hard gates:
      (1) no overflow — sum(min_widths) + gaps ≤ container, (2) primary
      action visible — exactly one Filled/primary button, (3) text column
      ≥ min width — residual ≥ 20em, (4) on-grid spacing — gaps on 4px/8px
      grid, (5) action count ≤ budget — ≤5 primary. Each gate is a yes/no
      verdict. Produce a layout_health vector and a pass/fail decision.
    renderer: minijinja
    template_ref: ui-layout-discipline/decide
    timeout_seconds: 120
    input_mapping:
      target: "{{ target }}"
      sense_result: "{{ step_1_result }}"
      orient_result: "{{ step_2_result }}"

  - ordinal: 4
    action: select
    description: >
      ACT: For each failing gate, prescribe the canonical GPUI remedy:
      secondary actions behind a PopoverMenu with IconName::Ellipsis
      trigger (Nielsen progressive disclosure), truncate() on text labels,
      flex_shrink_0 on fixed elements, min_w_0 on flexible text columns,
      or explicit hide-secondary. Reference the agent_panel.rs
      render_panel_options_menu PopoverMenu + ContextMenu::build + WeakEntity
      handler pattern.
    renderer: minijinja
    template_ref: ui-layout-discipline/act
    timeout_seconds: 150
    input_mapping:
      target: "{{ target }}"
      decide_result: "{{ step_3_result }}"

  - ordinal: 5
    action: select
    description: >
      REVIEW: Run adversarial probes against the proposed layout: a
      40-character button label, a localized German string (~30% longer),
      a 320px container, 7 actions. If any probe breaks a gate, the layout
      is rejected and the loop re-enters at Decide. Grounded in Klein's
      premortem and the squint test for visual hierarchy (strip color/weight
      to size-only, check if exactly one element remains dominant).
    renderer: minijinja
    template_ref: ui-layout-discipline/review
    timeout_seconds: 120
    input_mapping:
      target: "{{ target }}"
      act_result: "{{ step_4_result }}"
      decide_result: "{{ step_3_result }}"

  - ordinal: 6
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute the layout_health score from the review's gate verdicts.
      The convergence signal is the count of failing gates: 0 = converged
      (all gates pass under adversarial probes), >0 = not converged.
      If the review result is absent, the form errors (no silent default).
    timeout_seconds: 10
    input_mapping:
      form: "(assoc \"failing_gates\" step_5_result)"
      env:
        step_5_result: "{{ step_5_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 7
    action: loop
    description: >
      Re-enter the Decide → Act → Review cycle if convergence is not met.
      Routes the failing gates back to step 3 for re-evaluation after the
      Act phase's remedies are applied.
    input_mapping:
      loop_target: "{{ 3 }}"
      convergence_signal: "{{ step_6_result }}"
      failing_gates: "{{ step_6_result }}"
      prior_act_result: "{{ step_4_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
