# TDD Process Manifest
# ℏKask v0.33.5 — Contract-anchored TDD as convergent PDCA

manifest:
  id: tdd
  category: skill
  name: TDD
  description: >
    Convergent contract-anchored TDD process. Plans from requirements,
    executes a tracer bullet, proposes refactors, verifies quality,
    checks requirement coverage, computes convergence, and iterates.
  functional_role: flowdef
  version: "0.33.5"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: task_description
    type: string
    required: true
  - name: crate_scope
    type: string
    required: true
  - name: code_context
    type: object
    required: false
  - name: spec_context
    type: string
    required: false
  # Harness-integration inputs (optional — consumed when available from prior
  # harness-evolve-cycle runs or bug-hunt expeditions).
  - name: surviving_mutants
    type: array
    required: false
  - name: bug_hunt_findings
    type: array
    required: false

ledger:
  span_namespace: reg.skill.tdd

steps:
  - ordinal: 1
    action: select
    description: Plan contract-anchored TDD behaviors and seams.
    renderer: minijinja
    template_ref: tdd/tdd-plan
    gas_cap: 6000
    timeout_seconds: 90
    input_mapping:
      task_description: "{{ task_description }}"
      crate_scope: "{{ crate_scope }}"
      code_context: "{{ code_context | default({}) }}"
      spec_context: "{{ spec_context | default('') }}"
      surviving_mutants: "{{ surviving_mutants | default([]) }}"

  - ordinal: 2
    action: select
    description: Execute one tracer bullet (contract → test → minimal implementation).
    renderer: minijinja
    template_ref: tdd/tdd-tracer
    gas_cap: 8000
    timeout_seconds: 120
    input_mapping:
      behavior_description: "{{ step_1_result.behaviors_to_test[0].behavior | default(task_description) }}"
      user_expectation: "{{ step_1_result.functional_requirements[0].user_expectation | default(task_description) }}"
      goal_principle: "{{ step_1_result.functional_requirements[0].goal_principle | default({}) }}"
      constraining_principles: "{{ step_1_result.behaviors_to_test[0].constraining_principles | default([]) }}"
      seam: "{{ step_1_result.behaviors_to_test[0].seam | default('public API') }}"
      crate_scope: "{{ crate_scope }}"
      test_style: "{{ step_1_result.behaviors_to_test[0].test_type | default('integration') }}"

  - ordinal: 3
    action: select
    description: >
      Strengthen the GREEN tracer bullet by dispatching to the proptest skill for
      the universal test (contract post:/inv: across the input space). A proptest
      fail is a second source of RED routing back to the tracer (impl) or the
      plan (contract). Skips cleanly for hardcoded (fixed-value) contracts.
    renderer: minijinja
    template_ref: tdd/tdd-strengthen
    gas_cap: 8000
    timeout_seconds: 180
    input_mapping:
      contract_code: "{{ step_2_result.contract_code | default('') }}"
      oracle_type: "{{ step_2_result.oracle_type | default('hardcoded') }}"
      crate_scope: "{{ crate_scope }}"
      behavior_description: "{{ step_2_result.user_expectation | default(task_description) }}"
      test_style: "{{ step_1_result.behaviors_to_test[0].test_type | default('integration') }}"
    branching:
      proceed: 4
      retracer: 2
      replan: 1

  - ordinal: 4
    action: select
    description: Propose safe GREEN-phase refactors.
    renderer: minijinja
    template_ref: tdd/tdd-refactor
    gas_cap: 5000
    timeout_seconds: 90
    input_mapping:
      crate_scope: "{{ crate_scope }}"
      passing_tests: "{{ [step_2_result] }}"
      refactor_candidates: "{{ step_1_result.public_interface | default([]) }}"

  - ordinal: 5
    action: select
    description: >
      Verify TDD completion quality and contract discipline. Runs the suite with
      trace collection (./scripts/test --trace) so the run is visible to the
      suite-level harness-optimize loop. Consumes the proptest verdict from
      step 3 to confirm the universal test passes.
    renderer: minijinja
    template_ref: tdd/tdd-verify
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      crate_scope: "{{ crate_scope }}"
      behaviors_tested: "{{ [step_2_result] }}"
      proptest_verdict: "{{ step_3_result.proptest_verdict | default('skipped') }}"
      universal_test_file_path: "{{ step_3_result.universal_test_file_path | default('') }}"
      test_commands: "{{ ['./scripts/test --trace'] }}"
      clippy_commands: "{{ ['cargo clippy -p ' ~ crate_scope ~ ' -- -D warnings'] }}"

  - ordinal: 6
    action: select
    description: >
      Analyze requirement coverage gaps and deferrals. Consumes bug-hunt
      findings (if provided as input) and surviving mutants (if available from
      a prior harness-evolve-cycle run) as additional gap sources.
    renderer: minijinja
    template_ref: tdd/tdd-gap-check
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      spec_requirements: "{{ step_1_result.functional_requirements | default([]) }}"
      tested_behaviors: "{{ step_5_result.behavior_coverage | default([]) }}"
      crate_scope: "{{ crate_scope }}"
      collection_coherence: "{{ {} }}"
      bug_hunt_findings: "{{ bug_hunt_findings | default([]) }}"
      surviving_mutants: "{{ surviving_mutants | default([]) }}"

  - ordinal: 7
    action: select
    description: >
      Explore for spec blind spots by dispatching to the bug-hunt skill with a
      charter scoped to the slice's code. Findings not covered by an existing
      tracer bullet become new functional requirements routing back to the
      plan. Dispatches only when coverage is thin OR the slice touches Trust
      (P0) — not on every low-risk slice.
    renderer: minijinja
    template_ref: tdd/tdd-explore
    gas_cap: 8000
    timeout_seconds: 180
    input_mapping:
      crate_scope: "{{ crate_scope }}"
      risk_profile: "{{ step_1_result.risk_profile | default('') }}"
      gaps: "{{ step_6_result.gaps | default([]) }}"
      behaviors_tested: "{{ step_5_result.behavior_coverage | default([]) }}"
    branching:
      replan: 1
      converge: 9

  - ordinal: 8
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 6's actual gap-check
      output. The convergence signal combines open gaps with coverage
      shortfall: length(gaps) + (100 - coverage_percentage) / 100.
      Lower = more converged (zero gaps and 100% coverage = fully covered).
      If gaps or coverage_percentage is absent, the form errors (no silent
      default), surfacing a broken gap-check step rather than masking it
      with a flat 1.0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: "(let ((g (assoc \"gaps\" step_6_result)) (c (assoc \"coverage_percentage\" step_6_result))) (let ((gc (if (is_null g) 0 (length g))) (cc (if (numberp c) c 0.0))) (+ gc (/ (- 100 cc) 100))))"
      env:
        step_6_result: "{{ step_6_result }}"

  - ordinal: 9
    action: loop
    description: Re-enter TDD cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_8_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
