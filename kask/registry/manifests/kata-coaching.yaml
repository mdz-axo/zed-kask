# Coaching Kata Process Manifest
# ℏKask v0.33.0 — Coaching dialogue as convergent PDCA

manifest:
  id: kata-coaching
  category: skill
  name: Kata Coaching
  description: >
    Convergent five-question coaching process. Runs the coaching kata
    dialogue, computes coaching-cycle convergence, and iterates until
    target/current/obstacle/next-step clarity is sufficient.
  functional_role: flowdef
  version: 0.33.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: challenge
    type: string
    required: true
  - name: current_condition
    type: string
    required: false
  - name: target_condition
    type: string
    required: false

steps:
  - ordinal: 1
    action: select
    description: Q1 — establish target condition.
    renderer: minijinja
    template_ref: kata-coaching/coaching-q1-target.j2
    gas_cap: 2500
    timeout_seconds: 30
    input_mapping:
      challenge: "{{ challenge }}"
      target_condition: "{{ target_condition | default('') }}"

  - ordinal: 2
    action: select
    description: Q2 — clarify actual condition.
    renderer: minijinja
    template_ref: kata-coaching/coaching-q2-actual.j2
    gas_cap: 2500
    timeout_seconds: 30
    input_mapping:
      challenge: "{{ challenge }}"
      current_condition: "{{ current_condition | default('') }}"
      target_condition: "{{ target_condition | default(step_1_result.target_condition | default('')) }}"

  - ordinal: 3
    action: select
    description: Q3 — identify obstacles and focus obstacle.
    renderer: minijinja
    template_ref: kata-coaching/coaching-q3-obstacles.j2
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"
      target_condition: "{{ target_condition | default(step_1_result.target_condition | default('')) }}"
      current_condition: "{{ current_condition | default(step_2_result.actual_condition | default('')) }}"

  - ordinal: 4
    action: select
    description: Q4 — define next experiment and prediction.
    renderer: minijinja
    template_ref: kata-coaching/coaching-q4-experiment.j2
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"
      focus_obstacle: "{{ step_3_result.focus_obstacle | default('') }}"

  - ordinal: 5
    action: select
    description: Q5 — define feedback loop timing and learning checkpoint.
    renderer: minijinja
    template_ref: kata-coaching/coaching-q5-learn.j2
    gas_cap: 2500
    timeout_seconds: 30
    input_mapping:
      challenge: "{{ challenge }}"
      next_experiment: "{{ step_4_result.next_experiment | default('') }}"
      prediction: "{{ step_4_result.prediction | default('') }}"

  - ordinal: 6
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 5's actual Q5 output.
      The convergence signal is the feedback-loop tightness: 0.0 if
      coach_assessment is "tight-loop" (time-bound check committed), 1.0 if
      "open-loop" (vague timing, not yet converged). Lower = more converged.
      If coach_assessment is absent, the form errors (no silent default),
      surfacing a broken Q5 step rather than masking it with a flat 1.0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: "(if (string= (assoc \"coach_assessment\" step_5_result) \"tight-loop\") 0.0 1.0)"
      env:
        step_5_result: "{{ step_5_result }}"

  - ordinal: 7
    action: loop
    description: Re-enter coaching cycle if convergence is not met.
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the coaching quality signal into convergence_signal so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      convergence_signal: "{{ step_6_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

# Recommends: improv skill for constructive coaching postures.
# - Q4 (Next step? What do you expect?) → Yes But
# - Q5 (How quickly can we go and see?) → Plussing

ledger:
  emit_spans: true
  span_namespace: reg.skill.kata-coaching
  telemetry_namespace: hkask.template.kata-coaching
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
