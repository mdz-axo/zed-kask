# QA Condenser Health Check — v0.31.0
#
# Verifies hkask-mcp-condenser invariants by running the qa_contract.rs test
# suite (MCP tool contracts) and the hkask-condenser engine unit tests,
# then classifying failures.
#
# Open questions addressed:
#   8.1  — Condenser completion (regression protection)
#   4.2  — Context window channel capacity SLA enforcement
#         (compressed_bytes <= original_bytes)
#
# Cybernetic feedback loop:
#   Sensor → cargo test output for qa_contract + engine unit tests
#   Comparator → classify step evaluates failure patterns
#   Actuator → terminal step reports health status
#
# Test coverage:
#   - hkask-mcp-condenser qa_contract.rs (11 tests): condenser_ping,
#     condenser_persist, condenser_thread_summary, condenser_score_saliency
#     (happy paths, schema violations, error propagation, adversarial injection)
#   - hkask-condenser engine unit tests: compress returns content, profile
#     switching, classify mapping, passthrough when budget exceeds input
#
# Runner readiness: PARTIAL — run_command steps executable today;
#   classify step requires QaScriptRunner.

manifest:
  id: qa-condenser-health-check
  category: qa-script
  name: QA Condenser Health Check
  version: 0.31.0
  visibility: Private
  description: >
    Verifies hkask-mcp-condenser invariants through the qa_contract.rs test
    suite (11 MCP tool contract tests) and the hkask-condenser engine unit
    tests. Classifies failures for regressions in compression, persistence,
    thread summarization, or saliency scoring.

gas:
  cap: 20000
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true

steps:
  # Step 1: Run condenser contract tests
  - ordinal: 1
    action: execute
    command: "cargo test -p hkask-mcp-condenser -p hkask-condenser --no-fail-fast 2>&1 | tail -25"
    description: "Run condenser MCP contract tests + engine unit tests"
    retries: 0
    branching:
      success: 2
      failure: 4

  # Step 2: Classify the test output
  # Requires QaScriptRunner — receives step 1 stdout.
  - ordinal: 2
    action: select
    classifier: qa-triage
    description: "Test suites: hkask-mcp-condenser qa_contract.rs (11 tests covering condenser_ping, condenser_persist, condenser_thread_summary, condenser_score_saliency — happy paths, schema violations, error propagation, adversarial injection) and hkask-condenser engine unit tests (compress, profile, classify). All tests passing indicates condenser health."
    retries: 0
    branching:
      high_confidence: 3
      medium_confidence: 3
      low_confidence: 5
      flake: 2
      unparseable: 5
      classifier_unavailable: 5

  # Step 3: PASS — all condenser invariants hold
  - ordinal: 3
    action: execute
    command: "echo '[QA:condenser] PASS — MCP contract tests + engine unit tests verified'"
    description: "All condenser tests pass"
    retries: 0
    terminal: true

  # Step 4: Test failure — regression detected
  - ordinal: 4
    action: execute
    command: "echo '[QA:condenser] FAIL — condenser tests failed. Possible regression in compression, persistence, thread summarization, or saliency scoring.'"
    description: "Condenser test failure — regression may be present"
    retries: 0
    terminal: true

  # Step 5: Classification low confidence / unparseable
  - ordinal: 5
    action: execute
    command: "echo '[QA:condenser] WARN — classifier could not evaluate test output with confidence. Manual review recommended.'"
    description: "Classifier returned low confidence or unparseable result"
    retries: 0
    terminal: true

ledger:
  span_namespace: reg.skill.qa-condenser-health-check

  emit_spans: true
