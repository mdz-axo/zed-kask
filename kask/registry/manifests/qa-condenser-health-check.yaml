manifest:
  id: qa-condenser-health-check
  category: qa-script
  name: QA Condenser Health Check
  version: 0.31.0
  visibility: Private
  description: 'Verifies hkask-mcp-condenser compression engine invariants through the condenser_contract.rs
    test suite (11 tests). Classifies failures for regressions in compression SLA, health signals, or
    profile handling.

    '
gas:
  cap: 20000
  alert_threshold: 0.8
  hard_limit: true
rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: cargo test -p hkask-mcp-condenser --test condenser_contract -- --nocapture 2>&1 | tail -25
  description: 'Run condenser engine contract tests: compression SLA, health signals, classification,
    profiles'
  retries: 0
  branching:
    success: 2
    failure: 4
- ordinal: 2
  action: classify
  classifier: qa-triage
  description: 'Test suite: hkask-mcp-condenser contract tests. Verify compression engine invariants:
    compressed_bytes <= original_bytes for all inputs, empty input handling, category passthrough, cumulative
    statistics, profile switching (set_profile_changes_behavior), tool classification (chat/test/shell/unknown),
    and health signal detection. All 11 contract tests passing indicates condenser SLA compliance.'
  retries: 0
  branching:
    high_confidence: 3
    medium_confidence: 3
    low_confidence: 5
    flake: 2
    unparseable: 5
    classifier_unavailable: 5
- ordinal: 3
  action: run_command
  command: "echo '[QA:condenser] PASS \u2014 compression SLA, health signals verified (11/11)'"
  description: All condenser contract tests pass
  retries: 0
  terminal: true
- ordinal: 4
  action: run_command
  command: "echo '[QA:condenser] FAIL \u2014 condenser contract tests failed. Possible SLA violation:\
    \ negative_compression, low_signal, or broken profile switching.'"
  description: "Condenser contract test failure \u2014 compression engine SLA may be violated"
  retries: 0
  terminal: true
- ordinal: 5
  action: run_command
  command: "echo '[QA:condenser] WARN \u2014 classifier could not evaluate test output with confidence.\
    \ Manual review recommended.'"
  description: Classifier returned low confidence or unparseable result
  retries: 0
  terminal: true
ledger:
  emit_spans: true
  alert: qa.condenser.health
  span_namespace: reg.skill.qa-condenser-health-check
