# Deep Module Process Manifest
# ℏKask v0.31.0 — Module depth evaluation as convergent PDCA

manifest:
  id: deep-module
  category: skill
  name: Deep Module
  description: >
    Convergent module-depth process. Assesses module depth, applies Ousterhout's
    deletion test in both directions, designs a deepened interface from results,
    computes convergence, and iterates until depth recommendations are stable.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  target_artifacts_field: step_3_result.public_interface
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: module_path
    type: string
    required: true
  - name: module_source
    type: string
    required: true
  - name: caller_paths
    type: array
    required: false
  - name: caller_code
    type: object
    required: false
  - name: dependency_code
    type: object
    required: false
  - name: codebase_context
    type: object
    required: false
  - name: domain_requirements
    type: object
    required: false
  - name: dependency_interfaces
    type: object
    required: false
  - name: constraint_classification
    type: object
    required: false

# Fusion: omitted — defers to operator's global kask.fusion settings.
# Recommended: mode "synthesis" with skills: [deep-module].
# Model names are not hardcoded here because models evolve quickly.

steps:
  - ordinal: 1
    action: select
    description: Assess module depth and deletion-test indicators.
    renderer: minijinja
    template_ref: deep-module/deep-module-assess
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      module_path: "{{ module_path }}"
      module_source: "{{ module_source }}"
      caller_paths: "{{ caller_paths | default([]) }}"
      codebase_context: "{{ codebase_context | default({}) }}"

  - ordinal: 2
    action: select
    description: Execute Ousterhout's deletion test in both directions.
    renderer: minijinja
    template_ref: deep-module/deep-module-delete
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      module_assessment: "{{ step_1_result }}"
      caller_code: "{{ caller_code | default({}) }}"
      dependency_code: "{{ dependency_code | default({}) }}"
      codebase_context: "{{ codebase_context | default({}) }}"

  - ordinal: 3
    action: select
    description: >
      Design a deep module interface from deletion test results.
      Gated on step 2's recommendation — only runs when the deletion test
      verdict is EXTRACT or DEEPEN. Skipped for DELETE/MERGE (designing a
      module that should not exist is undefined behavior). When skipped,
      step_3_result is undefined; downstream steps use default({}) which is
      falsy in Jinja2, so the Cauchy tracker sees a 0 kata_hypotenuse reading.
    renderer: minijinja
    template_ref: deep-module/deep-module-design
    gas_cap: 6000
    timeout_seconds: 60
    condition: "step_2_result.recommendation == 'EXTRACT' OR step_2_result.recommendation == 'DEEPEN'"
    input_mapping:
      deletion_test_result: "{{ step_2_result }}"
      domain_requirements: "{{ domain_requirements | default({}) }}"
      dependency_interfaces: "{{ dependency_interfaces | default({}) }}"
      constraint_classification: "{{ constraint_classification | default({}) }}"

  - ordinal: 4
    action: compute
    compute_ref: kata.convergence_check
    description: >
      CHECK CONVERGENCE: Cauchy criterion on the public interface count.
      The depth assessment has converged when the interface stops changing
      across iterations.
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 5
    action: loop
    description: >
      Re-enter depth cycle if convergence is not met. The loop_target is
      fixed at step 1 (assess) — the Cauchy criterion detects when the
      design output has stopped moving, replacing the old dynamic
      re_entry_target routing.

      STATE PERSISTENCE: Step results from the prior iteration persist
      across loop iterations. When the loop re-enters, all prior
      step_N_result values remain available for input_mapping references.
      This is required because step 2 (delete) consumes step_1_result,
      step 3 (design) consumes step_2_result. If the executor does not
      persist step results, re-entry will fail.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the public-interface item count into kata_hypotenuse so the
      # Cauchy criterion can detect when the design has stopped moving.
      # When step 3 (design) is skipped (DELETE/MERGE recommendation),
      # the value defaults to 0 — stable, so Cauchy fires after min_iterations.
      kata_hypotenuse: "{{ step_3_result.public_interface | default([]) | length }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: deep-module/deep-module-assess
      gas_budget: 6000
    - resource: template
      action: render
      template_id: deep-module/deep-module-delete
      gas_budget: 6000
    - resource: template
      action: render
      template_id: deep-module/deep-module-design
      gas_budget: 6000
    - resource: manifest
      action: execute
      template_id: deep-module
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true
