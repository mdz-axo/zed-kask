# MCDA Process Manifest
# ℏKask v0.35.0 — Multi-criteria analysis as convergent PDCA

manifest:
  id: mcda
  category: skill
  name: MCDA
  description: >
    Convergent MCDA process. Identifies criteria, weights and scores alternatives,
    ranks options, runs sensitivity analysis, computes convergence, and iterates
    until decision robustness is stable.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: decision_question
    type: string
    required: false
  - name: alternatives
    type: array
    required: true
  - name: criteria_hints
    type: array
    required: false
  - name: weighting_method
    type: string
    required: false

ledger:
  span_namespace: reg.skill.mcda

steps:
  - ordinal: 1
    action: select
    description: Identify and classify decision criteria.
    renderer: minijinja
    template_ref: mcda/identify-criteria.j2
    timeout_seconds: 120
    input_mapping:
      decision_question: "{{ task | default(decision_question) }}"
      alternatives: "{{ alternatives }}"
      criteria_hints: "{{ criteria_hints | default([]) }}"

  - ordinal: 2
    action: select
    description: Assign weights and score alternatives.
    renderer: minijinja
    template_ref: mcda/weight-and-score.j2
    timeout_seconds: 120
    input_mapping:
      decision_question: "{{ decision_question }}"
      alternatives: "{{ alternatives }}"
      criteria: "{{ step_1_result.criteria | default([]) }}"
      weighting_method: "{{ weighting_method | default('direct') }}"

  - ordinal: 3
    action: select
    description: Rank alternatives and detect compensation masking.
    renderer: minijinja
    template_ref: mcda/rank-alternatives.j2
    timeout_seconds: 120
    input_mapping:
      decision_question: "{{ decision_question }}"
      composite_scores: "{{ step_2_result.composite_scores | default([]) }}"
      normalized_scores: "{{ step_2_result.normalized_scores | default([]) }}"
      criteria: "{{ step_1_result.criteria | default([]) }}"

  - ordinal: 4
    action: select
    description: Perform sensitivity analysis and robustness checks.
    renderer: minijinja
    template_ref: mcda/sensitivity-analysis.j2
    timeout_seconds: 120
    input_mapping:
      decision_question: "{{ decision_question }}"
      ranking: "{{ step_3_result.ranking | default([]) }}"
      weights: "{{ step_2_result.weights | default([]) }}"
      normalized_scores: "{{ step_2_result.normalized_scores | default([]) }}"

  - ordinal: 5
    action: compute
    compute_ref: lisp.eval
    description: >
      COMPUTE ROBUSTNESS SCORE: Deterministic Lisp computation that turns
      the sensitivity-analysis output into a scalar convergence signal.
      Lower = more converged (more robust decision). The score is the
      count of rank reversals plus the count of critical weights, capped
      at 1.0 — a robust decision (empty rank_reversals, empty
      critical_weights) scores 0.0; a fragile one approaches 1.0. No
      `default(1.0)` fallback: if the sensitivity step omitted a field,
      the Lisp `assoc` returns nil and `length` of nil is 0, which is a
      real measurement ("no reversals found"), not a phantom 1.0.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((reversals (assoc "rank_reversals" step_4_result))
              (critical (assoc "critical_weights" step_4_result)))
          (let ((r (if (is_null reversals) 0 (length reversals)))
                (c (if (is_null critical) 0 (length critical))))
            (let ((raw (+ r c)))
              (if (> raw 1) 1.0 raw))))
      env:
        step_4_result: "{{ step_4_result }}"

  - ordinal: 6
    action: loop
    description: Re-enter MCDA cycle if convergence is not met.
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the robustness score from the lisp.eval step (ordinal 5) into
      # convergence_signal so the Cauchy criterion can detect when the
      # iterates have stopped moving. No default(1.0): a Lisp failure must
      # surface, not be masked as a phantom 1.0.
      convergence_signal: "{{ step_5_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
