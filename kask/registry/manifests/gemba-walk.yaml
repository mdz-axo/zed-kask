# Gemba Walk Process Manifest
# ℏKask v0.35.0 — Human-in-the-loop guided evolution of the cybernetic regulation system.
#
# Implements the Prepare and Present phases of the gemba loop
# (docs/reports/gemba-loop-specification.md). A single-pass briefing
# generator — not an interactive session. The operator asks follow-up
# questions in the regular agent conversation after the skill completes.
#
# Design references:
# - Microsoft "Continuous improvement with agentic AI: Conducting a virtual
#   gemba walk" — 7-step workflow maps to the cascade steps.
# - Greenham "Gemba AI Framework" — TAPOIF lifecycle (Thought → Action →
#   Pause → Observation → Inform → Follow-up) maps to the cascade.
# - Meyer "The Gemba Was Always There" — flow kaizen, not point kaizen.
# - GembaCore — two-plane architecture (WorkPlane + OrchestrationPlane).
# - C.H. Robinson "What Is Lean AI?" — start with a real problem, test
#   solutions, integrate human oversight, measure results.
#
# The skill calls existing curator MCP tools and synthesizes a briefing.
# Skill feedback spans (outcome, operator_feedback, convergence) live in
# the in-memory RegulationLedger and are not yet exposed via MCP — the
# briefing notes this gap when relevant. The skill-use issue reports
# (curator_report_skill_use_issue) ARE queryable via curator_memory_recall
# with entity "skill_use_issue:<skill_name>", so the briefing includes
# accumulated skill-use issues as a proxy signal for skill health.

manifest:
  id: gemba-walk
  category: skill
  name: Gemba Walk
  description: >
    Human-in-the-loop guided review of the cybernetic regulation system.
    Queries algedonic alerts, pending escalations, and the curator's memory
    for skill performance patterns, then synthesizes a structured briefing
    with per-skill digest and proposed refinement actions for operator
    approval. Implements the Prepare and Present phases of the gemba loop.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.05
  cauchy_window: 2
  max_iterations: 3
  min_iterations: 1
  on_not_reached: escalate
  target_artifacts_field: "briefing"


rjoule:
  cap: 5
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: task
    type: string
    required: false
    description: >
      The operator's gemba walk request (e.g. "show me the system health" or
      "review skill X"). Carried as context so templates can reference the
      operator's intent.
  - name: focus_skill
    type: string
    required: false
    description: >
      Optional skill ID to focus the gemba walk on (e.g. "superforecasting").
      When empty, the walk reviews all skills with curator memory signals.
  - name: algedonic_hours
    type: integer
    required: false
    description: >
      Lookback window for algedonic alerts (hours). Default 24.

ledger:
  span_namespace: reg.skill.gemba-walk
  emit_spans: true
  telemetry_namespace: hkask.template.gemba-walk
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

steps:
  # ── SENSE+GATHER: Five independent curator queries run concurrently ─────
  # TAPOIF Thought+Action: collect all signal channels in one batch.
  # All five calls are independent — no inter-step dependencies, no
  # conditions. Running them concurrently cuts wall-clock time from
  # 180s to 60s. Results are keyed by algedonic, escalations, memory,
  # grounding_trend, and grounding_coverage in step_1_result.
  - ordinal: 1
    action: execute
    description: >
      Query five independent curator signal channels concurrently via
      mcp_batch: algedonic log, pending escalations, curator memory
      consultation, grounding trend, and grounding coverage. All five
      are independent inputs to the briefing synthesis. Results are keyed
      by algedonic, escalations, memory, grounding_trend, and
      grounding_coverage in step_1_result.
    mcp_batch:
      - mcp: curator_algedonic_log
        key: algedonic
        input_mapping:
          hours: "{{ algedonic_hours | default(24) }}"
      - mcp: curator_escalations
        key: escalations
        input_mapping: {}
      - mcp: curator_consult
        key: memory
        input_mapping:
          query: >
            {% if focus_skill %}skill performance issues and patterns for skill "{{ focus_skill }}"{% else %}recent skill performance issues, skill-use failures, and drift patterns across all skills{% endif %}
          limit: 20
      - mcp: curator_grounding_trend
        key: grounding_trend
        input_mapping:
          scope: "global"
      - mcp: curator_grounding_coverage
        key: grounding_coverage
        input_mapping: {}
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        One or more curator signal channel queries failed. The curator MCP
        server may be down or partially degraded. The briefing synthesis
        proceeds with whichever results are available; missing channels are
        noted as gaps. Check curator_status and retry.

  # ── ANALYZE: Synthesize the structured briefing ──────────────────────
  # TAPOIF Observation: retrieve and structure the answers from the five
  # signal channels into a coherent briefing.
  - ordinal: 2
    action: select
    description: >
      Synthesize the five signal channels (algedonic, escalations, memory,
      grounding trend, grounding coverage) into a structured briefing. The
      briefing has five sections: (1) system health summary, (2) algedonic
      alert digest, (3) escalation backlog digest, (4) per-skill performance
      digest, (5) grounding health digest. Each per-skill entry includes
      issue count, recent failure patterns, and a health classification
      (healthy / watch / intervene). The grounding health digest includes
      clean_rate, coverage_rate, trend direction, and top coverage gaps.
      The briefing explicitly notes when skill feedback spans (outcome,
      operator_feedback) are not available via MCP — this is a known gap,
      not a silent omission.
    renderer: minijinja
    template_ref: gemba-walk/synthesize-briefing
    timeout_seconds: 120
    input_mapping:
      task: "{{ task | default('show me the system health') }}"
      focus_skill: "{{ focus_skill | default('') }}"
      algedonic_result: "{{ step_1_result.algedonic | default({}) }}"
      escalations_result: "{{ step_1_result.escalations | default([]) }}"
      memory_result: "{{ step_1_result.memory | default({}) }}"
      grounding_trend_result: "{{ step_1_result.grounding_trend | default({}) }}"
      grounding_coverage_result: "{{ step_1_result.grounding_coverage | default({}) }}"

  # ── PRESENT: Render the conversational briefing ──────────────────────
  # TAPOIF Inform: present the findings to the operator as a readable
  # summary with structured tables.
  - ordinal: 3
    action: select
    description: >
      Render the structured briefing as a conversational summary with
      structured tables per skill. The summary opens with a one-paragraph
      system health overview, then the algedonic alert table, then the
      escalation backlog table, then the per-skill performance table, then
      the grounding health table. Each table is followed by a brief
      narrative interpretation. The presentation closes with a prompt for
      the operator to ask follow-up questions in the regular conversation
      (the Observe phase happens outside the skill cascade).
    renderer: minijinja
    template_ref: gemba-walk/present-briefing
    timeout_seconds: 120
    input_mapping:
      task: "{{ task }}"
      focus_skill: "{{ focus_skill | default('') }}"
      briefing: "{{ step_2_result }}"

  # ── RECOMMEND: Propose actions for operator approval ─────────────────
  # TAPOIF Follow-up: track decisions. The skill proposes, the operator
  # decides (human-in-the-loop design principle).
  - ordinal: 4
    action: select
    description: >
      Propose refinement actions for operator approval. For each skill with
      a "watch" or "intervene" classification, propose one of: curator_directive
      (threshold/budget adjustment), skill-maintenance (artifact refinement),
      validate_golden_outputs (for deterministic skills), direct edit
      (manifest/template fix), or no action (observe further). Additionally,
      propose grounding-specific actions: register a contract for agent
      types with delegations but no contract, review recent violations
      when the clean rate dropped, or investigate narrative leaks. The
      proposals are recommendations, not autonomous actions — the operator
      reviews and decides which to execute in the regular conversation.
    renderer: minijinja
    template_ref: gemba-walk/recommend-actions
    timeout_seconds: 120
    input_mapping:
      task: "{{ task }}"
      focus_skill: "{{ focus_skill | default('') }}"
      briefing: "{{ step_2_result }}"

  # ── LOOP: Convergence check ─────────────────────────────────────────
  - ordinal: 5
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the briefing_complete flag from the
      synthesize step (step 6), as a numeric value (1 = complete, 0 =
      incomplete). Lower signal variance across iterations = convergence
      (Cauchy). Using lisp.eval instead of a Jinja expression makes the
      computation explicitly deterministic, budgeted (timeout_seconds: 10), and
      observable via a reg.skill.gemba-walk span. Guards against a missing
      briefing_complete field by returning 0 when absent — the previous
      Jinja default(true) would silently report convergence on a missing
      field; this surfaces the failure.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((bc (assoc "briefing_complete" step_2_result)))
          (if (is_null bc) 0 (if (string= bc "true") 1 (if (= bc true) 1 0))))
      env:
        step_2_result: "{{ step_2_result | default({}) }}"

  - ordinal: 6
    action: loop
    description: >
      Re-enter the cascade if the briefing has not converged (the synthesize
      step produced an incomplete briefing or the present step flagged
      missing signal channels). Bounded by max_iterations (3) — a gemba
      walk that cannot produce a briefing in 3 passes escalates.
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 2 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 5). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_5_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

# The gemba walk is itself a skill tracked by the regulation system.
# BridgeManifestExecutor::execute_skill records reg.skill.gemba-walk.outcome
# and reg.skill.gemba-walk.convergence spans after each invocation, so the
# next gemba walk can review the previous walk's outcome — the loop closes
# on itself.
#
# Open infrastructure gap: skill feedback spans (outcome, operator_feedback,
# convergence) live in the in-memory RegulationLedger and are not yet
# exposed via MCP. The gemba-walk skill uses curator_consult as a proxy
# signal (skill-use issue reports are persisted to the curator's memory).
# Exposing skill feedback aggregates via MCP is a follow-up task — see
# docs/reports/gemba-loop-specification.md "What Needs to Be Built".
