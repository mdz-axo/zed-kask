# Pragmatic Semantics Process Manifest
# ℏKask v0.35.0 — Epistemic classification as convergent PDCA
# EXTENDED: Wired provenance-trace and conflict-resolve templates (previously orphaned).

manifest:
  id: pragmatic-semantics
  category: skill
  name: Pragmatic Semantics
  description: >
    Convergent epistemic-classification process. Classifies statement semantics,
    traces provenance, resolves conflicts via OT ranking, computes convergence,
    and iterates until certainty/provenance classification is stable for decision
    support.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: ""
  # No convergence-check compute step: the loop runs N iterations then escalates.
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: statement
    type: string
    required: false
  - name: system_context
    type: string
    required: false

ledger:
  span_namespace: reg.skill.pragmatic-semantics

steps:
  - ordinal: 1
    action: select
    description: Classify ontological/epistemic mode and provenance.
    renderer: minijinja
    template_ref: pragmatic-semantics/semantics-classify-statement
    timeout_seconds: 120
    input_mapping:
      statement: "{{ task | default(statement) }}"
      system_context: "{{ system_context | default('') }}"

  - ordinal: 2
    action: select
    description: Trace provenance of the classified claim through hKask's data layers.
    renderer: minijinja
    template_ref: pragmatic-semantics/semantics-provenance-trace
    timeout_seconds: 150
    input_mapping:
      classification_result: "{{ step_1_result }}"
      statement: "{{ statement }}"
      system_context: "{{ system_context | default('') }}"

  - ordinal: 3
    action: select
    description: Resolve conflicts between statements using OT ranking.
    renderer: minijinja
    template_ref: pragmatic-semantics/semantics-conflict-resolve
    timeout_seconds: 150
    condition: "step_2_result.conflicts_detected == true"
    # When condition is false, step_3_result is undefined. Downstream steps
    # must use `step_3_result | default({})` to handle the skipped case.
    input_mapping:
      provenance_result: "{{ step_2_result }}"
      classification_result: "{{ step_1_result }}"

  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the provenance-chain length from
      the classification step. Lower signal variance across iterations =
      convergence (Cauchy). Using lisp.eval instead of a Jinja expression
      makes the computation explicitly deterministic, budgeted
      (timeout_seconds: 10), and observable via a reg.skill.pragmatic-semantics
      span. Guards against a missing provenance_chain field by returning 0
      when absent.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((pc (assoc "provenance_chain" step_2_result)))
          (if (is_null pc) 0 (length pc)))
      env:
        step_2_result: "{{ step_2_result | default({}) }}"

  - ordinal: 5
    action: loop
    description: Re-enter semantics cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 4). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_4_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
