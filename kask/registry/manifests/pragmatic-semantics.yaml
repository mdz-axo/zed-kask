# Pragmatic Semantics Process Manifest
# ℏKask v0.31.0 — Epistemic classification as convergent PDCA
# EXTENDED: Wired provenance-trace and conflict-resolve templates (previously orphaned).

manifest:
  id: pragmatic-semantics
  category: skill
  name: Pragmatic Semantics
  description: >
    Convergent epistemic-classification process. Classifies statement semantics,
    traces provenance, resolves conflicts via OT ranking, computes convergence,
    and iterates until certainty/provenance classification is stable for decision
    support.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  # target_artifacts_field removed — no compute step to consume it
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: statement
    type: string
    required: true
  - name: system_context
    type: string
    required: false

steps:
  - ordinal: 1
    action: select
    description: Classify ontological/epistemic mode and provenance.
    renderer: minijinja
    template_ref: pragmatic-semantics/semantics-classify-statement
    gas_cap: 5000
    timeout_seconds: 45
    input_mapping:
      statement: "{{ statement }}"
      system_context: "{{ system_context | default('') }}"

  - ordinal: 2
    action: select
    description: Trace provenance of the classified claim through hKask's data layers.
    renderer: minijinja
    template_ref: pragmatic-semantics/semantics-provenance-trace
    gas_cap: 4000
    timeout_seconds: 45
    input_mapping:
      classification_result: "{{ step_1_result }}"
      statement: "{{ statement }}"
      system_context: "{{ system_context | default('') }}"

  - ordinal: 3
    action: select
    description: Resolve conflicts between statements using OT ranking.
    renderer: minijinja
    template_ref: pragmatic-semantics/semantics-conflict-resolve
    gas_cap: 4000
    timeout_seconds: 45
    condition: "step_2_result.conflicts_detected | default(false) == true"
    # When condition is false, step_3_result is undefined. Downstream steps
    # must use `step_3_result | default({})` to handle the skipped case.
    input_mapping:
      provenance_result: "{{ step_2_result }}"
      classification_result: "{{ step_1_result }}"

  - ordinal: 4
    action: compute
    compute_ref: kata.convergence_check
    description: >
      CHECK CONVERGENCE: Cauchy criterion on the provenance-chain length.
      The semantics classification has converged when the provenance chain
      stops changing across iterations.
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 5
    action: loop
    description: Re-enter semantics cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the provenance-chain length into kata_hypotenuse so the Cauchy
      # criterion can detect when the classification has stopped moving.
      kata_hypotenuse: "{{ step_2_result.provenance_chain | default([]) | length }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: pragmatic-semantics/semantics-classify-statement
      gas_budget: 5000
    - resource: template
      action: render
      template_id: pragmatic-semantics/semantics-provenance-trace
      gas_budget: 4000
    - resource: template
      action: render
      template_id: pragmatic-semantics/semantics-conflict-resolve
      gas_budget: 4000
    - resource: manifest
      action: execute
      template_id: pragmatic-semantics
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true
