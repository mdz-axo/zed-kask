# Self-Improvement Skill Manifest
# ℏKask v0.32.0 — Unified self-induced update operator with nested PDCA + outer Kata
# Implements: Ren et al. (2026, arXiv:2607.13104) "Self-Improvements in Modern Agentic Systems: A Survey"

manifest:
  id: self-improvement
  category: skill
  name: Self-Improvement
  description: >
    General multi-purpose self-improvement skill for FM-based agents. Implements
    the unified self-induced update operator from Ren et al. (2026, arXiv:2607.13104).
    Drives persistent, endogenous adaptation across two pathways — Foundation Model
    Improvement (θ) and Scaffolding Improvement (Σ) — through intrinsic generative
    demonstrations, intrinsic evaluative feedback, and extrinsic exploratory
    experience. Embeds its own PDCA loops at the improvement-cycle level and wraps
    an outer Improvement Kata loop around all algorithmic approaches.
  functional_role: flowdef
  version: 0.32.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 200000
  cost_per_iteration: 200
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 5
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: challenge
    type: string
    required: true
    description: The capability the agent should build or improve.
  - name: current_metrics
    type: object
    required: false
    description: Baseline metrics for the current agent configuration.
  - name: pathway_preference
    type: string
    required: false
    description: Preferred pathway — "theta" (FM improvement) or "sigma" (scaffolding). Defaults to "sigma".
  - name: signal_preference
    type: string
    required: false
    description: Preferred signal — "demos" (intrinsic generative), "feedback" (intrinsic evaluative), or "experience" (extrinsic exploratory).
  - name: scaffold_component
    type: string
    required: false
    description: If pathway is "sigma", which component — "prompt", "memory", "tool", or "full".
  - name: budget
    type: object
    required: false
    description: Resource budget — compute, tokens, wall-clock time, human input.
  - name: acceptance_criteria
    type: object
    required: false
    description: Criteria for committing an update — performance threshold, regression tolerance, safety constraints.

steps:
  # ─── OUTER KATA: Steps 1-3 (Direction → Current → Target) ───
  - ordinal: 1
    action: select
    description: "Outer Kata Step 1 — Understand direction: what capability are we building?"
    renderer: minijinja
    template_ref: self-improvement/si-kata-direction.j2
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"

  - ordinal: 2
    action: select
    description: "Outer Kata Step 2 — Grasp current condition: baseline measurement."
    renderer: minijinja
    template_ref: self-improvement/si-kata-current.j2
    gas_cap: 3500
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"
      current_metrics: "{{ current_metrics | default({}) }}"
      direction: "{{ step_1_result }}"

  - ordinal: 3
    action: select
    description: "Outer Kata Step 3 — Establish target condition: measurable, time-bounded."
    renderer: minijinja
    template_ref: self-improvement/si-kata-target.j2
    gas_cap: 3500
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"
      current_condition: "{{ step_2_result }}"

  # ─── INNER PDCA: Steps 4-7 (Plan → Do → Check → Act) ───
  # Max 5 iterations of the inner PDCA per Kata step 4 experiment.
  - ordinal: 4
    action: select
    description: "PDCA Plan — Select pathway (θ or Σ), signal type, and generate improvement plan."
    renderer: minijinja
    template_ref: self-improvement/si-select-pathway.j2
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      challenge: "{{ challenge }}"
      current_condition: "{{ step_2_result }}"
      target_condition: "{{ step_3_result }}"
      pathway_preference: "{{ pathway_preference | default('sigma') }}"
      signal_preference: "{{ signal_preference | default('') }}"
      scaffold_component: "{{ scaffold_component | default('') }}"
      budget: "{{ budget | default({}) }}"
      acceptance_criteria: "{{ acceptance_criteria | default({}) }}"

  - ordinal: 5
    action: select
    description: "PDCA Do — Execute the improvement operator 𝒰 on the selected target."
    renderer: minijinja
    template_ref: self-improvement/si-execute-improvement.j2
    gas_cap: 8000
    timeout_seconds: 120
    input_mapping:
      improvement_plan: "{{ step_4_result }}"
      current_config: "{{ step_2_result }}"

  - ordinal: 6
    action: select
    description: "PDCA Check — Evaluate updated agent on held-out tasks."
    renderer: minijinja
    template_ref: self-improvement/si-evaluate-improvement.j2
    gas_cap: 5000
    timeout_seconds: 90
    input_mapping:
      updated_config: "{{ step_5_result }}"
      improvement_plan: "{{ step_4_result }}"
      current_condition: "{{ step_2_result }}"

  - ordinal: 7
    action: select
    description: "PDCA Act — Commit or rollback the update based on acceptance criteria."
    renderer: minijinja
    template_ref: self-improvement/si-commit-or-rollback.j2
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      evaluation_result: "{{ step_6_result }}"
      improvement_plan: "{{ step_4_result }}"
      proposed_artifact: "{{ step_5_result }}"

  # ─── INNER PDCA CONVERGENCE CHECK ───
  # Deterministic Cauchy convergence — no LLM, no timeout.
  - ordinal: 8
    action: compute
    compute_ref: kata.convergence_check
    description: "Inner PDCA Convergence — Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  # ─── INNER PDCA LOOP: Re-enter Plan if not converged ───
  - ordinal: 9
    action: loop
    description: "Re-enter PDCA Plan if not converged (max 5 inner iterations)."
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: 4
      kata_hypotenuse: "{{ step_7_result.convergence_metric | default(1.0) }}"
      max_iterations: 5

  # ─── OUTER KATA CONVERGENCE ───
  # Deterministic Cauchy convergence — no LLM, no timeout.
  - ordinal: 10
    action: compute
    compute_ref: kata.convergence_check
    description: "Outer Kata Convergence — Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  # ─── OUTER KATA LOOP: Re-enter Current Condition if not converged ───
  - ordinal: 11
    action: loop
    description: "Re-enter Kata Step 2 (current condition) if not converged (max 10 outer iterations)."
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: 2  # Re-enter at Kata Step 2 (current condition)
      kata_hypotenuse: "{{ step_7_result.convergence_metric | default(1.0) }}"
      max_iterations: 10

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

# Safety governance (Section 9.1 of the paper):
# - Verifier-gated updates: all updates must pass verifier checks before commitment
# - Critic decoupling: evaluator must be decoupled from generator
# - Layered gating: strict permission system for self-modification
# - Version history for rollback: both pathways maintain version history
# - Fast-to-slow consolidation: scaffold improvements validated before parametric consolidation

ledger:
  emit_spans: true
  span_namespace: reg.skill.self-improvement
  telemetry_namespace: hkask.template.self-improvement
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
