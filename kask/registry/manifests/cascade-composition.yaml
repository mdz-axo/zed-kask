# Cascade Composition Configuration
# ℏKask v0.31.0 - A Minimal Viable Container for UserPods

manifest:
  id: cascade-composition
  category: runtime-config
  name: Cascade Composition
  description: >
    Cascade composition configuration for template execution limits,
    cycle detection, and template pre/post processing.
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

gas:
  cap: 50000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 0
  alert_threshold: 0.8
  hard_limit: true


