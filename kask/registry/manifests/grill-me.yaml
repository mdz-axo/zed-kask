# Grill-Me Process Manifest
# ℏKask v0.33.0 — Socratic interrogation as convergent PDCA

manifest:
  id: grill-me
  category: skill
  name: Grill-Me
  description: >
    Convergent interrogation process. Calibrates questioning level,
    generates Socratic challenge rounds, synthesizes assessment,
    computes convergence, and iterates until coverage is sufficient.
  functional_role: flowdef
  version: 0.33.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  target_artifacts_field: step_3_result.overall_assessment
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: topic
    type: string
    required: true
  - name: start_level
    type: integer
    required: false

ledger:
  span_namespace: reg.skill.grill-me

steps:
  - ordinal: 1
    action: select
    description: Calibrate initial interrogation level.
    renderer: minijinja
    template_ref: grill-me/grill-me-escalate
    gas_cap: 3000
    timeout_seconds: 30
    input_mapping:
      topic: "{{ topic }}"
      current_level: "{{ start_level | default(1) }}"
      solid_ratio: 0.0
      total_questions: 0

  - ordinal: 2
    action: select
    description: Generate and evaluate a Socratic interrogation round.
    renderer: minijinja
    template_ref: grill-me/grill-me-round
    gas_cap: 7000
    timeout_seconds: 90
    input_mapping:
      topic: "{{ topic }}"
      current_level: "{{ step_1_result.new_level | default(start_level | default(1)) }}"
      round_number: 1
      mode: "interrogate"
      previous_answers: "{{ [] }}"
      assessment_so_far: "{{ {} }}"

  - ordinal: 3
    action: select
    description: Synthesize final assessment and recommendations.
    renderer: minijinja
    template_ref: grill-me/grill-me-assess
    gas_cap: 4000
    timeout_seconds: 45
    input_mapping:
      topic: "{{ topic }}"
      all_answers: "{{ step_2_result.all_answers | default(step_2_result.evaluations | default([])) }}"
      assessment: "{{ step_2_result.assessment | default({}) }}"

  - ordinal: 4
    action: compute
    compute_ref: kata.convergence_check
    description: >
      CHECK CONVERGENCE: Cauchy criterion on the recommendation count. The
      interrogation has converged when recommendations stop changing across
      iterations.
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 5
    action: loop
    description: Re-enter interrogation cycle if convergence is not met, recalibrating difficulty from assessment.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the recommendation count into kata_hypotenuse so the Cauchy
      # criterion can detect when the assessment has stopped moving.
      kata_hypotenuse: "{{ step_3_result.recommendations | default([]) | length }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
