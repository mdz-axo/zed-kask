# Grill-Me Process Manifest
# ℏKask v0.34.0 — Socratic interrogation as convergent PDCA

manifest:
  id: grill-me
  category: skill
  name: Grill-Me
  description: >
    Convergent interrogation process. Calibrates questioning level,
    generates Socratic challenge rounds, synthesizes assessment,
    computes convergence, and iterates until coverage is sufficient.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  target_artifacts_field: step_3_result.overall_assessment
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: topic
    type: string
    required: false
  - name: start_level
    type: integer
    required: false

ledger:
  span_namespace: reg.skill.grill-me

steps:
  - ordinal: 1
    action: select
    description: Calibrate initial interrogation level.
    renderer: minijinja
    template_ref: grill-me/grill-me-escalate
    gas_cap: 3000
    timeout_seconds: 30
    input_mapping:
      topic: "{{ task | default(topic) }}"
      current_level: "{{ start_level | default(1) }}"
      solid_ratio: 0.0
      total_questions: 0

  - ordinal: 2
    action: select
    description: Generate and evaluate a Socratic interrogation round.
    renderer: minijinja
    template_ref: grill-me/grill-me-round
    gas_cap: 7000
    timeout_seconds: 150
    input_mapping:
      topic: "{{ topic }}"
      current_level: "{{ step_1_result.new_level | default(start_level | default(1)) }}"
      round_number: 1
      mode: "interrogate"
      previous_answers: "{{ [] }}"
      assessment_so_far: "{{ {} }}"

  # ── Step 3: Lisp deterministic step — question-level coverage check ──
  # The LLM generates questions across 5 difficulty levels (Recall, Mechanism,
  # Rationale, Edge Cases, Synthesis) but is unreliable at checking whether its
  # question set actually spans enough levels — it often reports "covers 4 levels"
  # when all questions are Recall-level. This Lisp step deterministically counts
  # distinct levels present in the generated questions and flags insufficient
  # coverage (< 3 distinct levels). Returns a list of defect strings — empty =
  # passed, non-empty = step 4 (assess) notes the coverage gap.
  #
  # This is the symbolic-neural scaffolding pattern: deterministic Lisp prunes
  # the LLM's probabilistic question generation by checking structural diversity
  # the LLM cannot reliably self-evaluate.
  - ordinal: 3
    action: compute
    compute_ref: lisp.eval
    description: >
      Lisp question-level coverage check. Deterministically counts distinct
      difficulty levels (Recall, Mechanism, Rationale, Edge Cases, Synthesis)
      present in the generated questions. Flags insufficient coverage (< 3
      distinct levels). Returns a list of defect strings. No LLM round-trip.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((questions (assoc "questions" step_2_result)))
          (if (is_null questions)
              (list "no_questions_field")
              (begin
                (define count-level
                  (lambda (qs level-name count)
                    (if (is_null qs)
                        count
                        (let ((q (car qs)))
                          (let ((ql (assoc "level" q)))
                            (let ((ql-str (if (is_null ql) "" ql)))
                              (count-level
                                (cdr qs)
                                level-name
                                (if (string= ql-str level-name) (+ count 1) count))))))))
                (define n-recall (count-level questions "Recall" 0))
                (define n-mechanism (count-level questions "Mechanism" 0))
                (define n-rationale (count-level questions "Rationale" 0))
                (define n-edge (count-level questions "Edge Cases" 0))
                (define n-synthesis (count-level questions "Synthesis" 0))
                (define distinct
                  (+ (if (> n-recall 0) 1 0)
                     (if (> n-mechanism 0) 1 0)
                     (if (> n-rationale 0) 1 0)
                     (if (> n-edge 0) 1 0)
                     (if (> n-synthesis 0) 1 0)))
                (if (< distinct 3)
                    (list "insufficient_level_coverage_below_3")
                    (list)))))
      env:
        step_2_result: "{{ step_2_result }}"

  - ordinal: 4
    action: select
    description: Synthesize final assessment and recommendations.
    renderer: minijinja
    template_ref: grill-me/grill-me-assess
    gas_cap: 4000
    timeout_seconds: 150
    input_mapping:
      topic: "{{ topic }}"
      all_answers: "{{ step_2_result.all_answers | default(step_2_result.evaluations | default([])) }}"
      assessment: "{{ step_2_result.assessment | default({}) }}"
      level_coverage_defects: "{{ step_3_result | default([]) }}"

  - ordinal: 5
    action: loop
    description: >
      Re-enter interrogation cycle if convergence is not met, recalibrating
      difficulty from assessment. If the Lisp level-coverage check (step 3)
      found insufficient coverage, the loop re-enters at step 2 (question
      generation) so the LLM generates questions at the missing levels.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the recommendation count into convergence_signal so the Cauchy
      # criterion can detect when the assessment has stopped moving.
      convergence_signal: "{{ step_4_result.recommendations | default([]) | length }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
