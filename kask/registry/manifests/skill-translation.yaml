# Skill Translation Process Manifest
# ℏKask v0.34.0 — Skill translation as convergent PDCA

manifest:
  id: skill-translation
  category: pipeline
  name: Skill Translation
  description: >
    Convergent translation process for importing external skill definitions
    into hKask-compatible structures with iterative normalization and
    convergence-based completion rails.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: source_format
    type: string
    required: true
  - name: source_definition
    type: object
    required: true
  - name: target_format
    type: string
    required: false
  - name: mapping_rules
    type: object
    required: false

ledger:
  span_namespace: reg.skill.skill-translation

steps:
  - ordinal: 1
    action: select
    description: Translate and normalize source skill definition.
    renderer: minijinja
    template_ref: skill-translator/translate-skill
    gas_cap: 5000
    timeout_seconds: 60
    input_mapping:
      source_format: "{{ source_format }}"
      source_definition: "{{ source_definition }}"
      target_format: "{{ target_format | default('hkask') }}"
      mapping_rules: "{{ mapping_rules | default({}) }}"

  # ── Deterministic compute: lisp.eval is available for custom logic ──
  #
  # In addition to the built-in compute_refs (lisp.eval for signal computation,
  # kata.object_gap, kata.process_gap, kata.hypotenuse, etc.), skill
  # authors can use `compute_ref: lisp.eval` to write custom deterministic
  # logic inline in the manifest — no Rust change needed. The sandboxed
  # Lisp interpreter supports arithmetic, conditionals, list ops, and
  # lambda. Supports infix: `a + b` = `(+ a b)`. Example:
  #
  #   - ordinal: N
  #     action: compute
  #     compute_ref: lisp.eval
  #     input_mapping:
  #       form: "(if (< gap 0.1) 1 0)"  # prefix; also supports infix: "gap < 0.1"
  #       env:
  #         gap: "{{ step_1_result.convergence_metric }}"
  #       max_steps: 10000
  #       max_depth: 32
  #
  # Use cases: custom convergence formulas, weighted scoring, data
  # transformation between steps, filtering findings by threshold.
  # Security: gated to category: skill manifests only (human-reviewed).
  - ordinal: 2
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence score from the translation step's actual
      output. The translate-skill template produces `unresolved_items` (a
      list of fields that could not be mapped); the count is the distance from
      a complete translation. Lower = more converged. Replaces the phantom
      `convergence_metric` binding that silently defaulted to 1.0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((u (length (assoc "unresolved_items" step_1_result))))
          (+ 0.0 u))
      env:
        step_1_result: "{{ step_1_result }}"

  - ordinal: 3
    action: loop
    description: Re-enter translation cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the translation quality signal into convergence_signal so the
      # Cauchy criterion can detect when the iterates have stopped moving.
      convergence_signal: "{{ step_2_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
