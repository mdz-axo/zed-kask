# Skill Translation Process Manifest
# ℏKask v0.31.0 — Skill translation as convergent PDCA

manifest:
  id: skill-translation
  category: pipeline
  name: Skill Translation
  description: >
    Convergent translation process for importing external skill definitions
    into hKask-compatible structures with iterative normalization and
    convergence-based completion rails.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: source_format
    type: string
    required: true
  - name: source_definition
    type: object
    required: true
  - name: target_format
    type: string
    required: false
  - name: mapping_rules
    type: object
    required: false

steps:
  - ordinal: 1
    action: select
    description: Translate and normalize source skill definition.
    renderer: minijinja
    template_ref: skill-translator/translate-skill
    gas_cap: 5000
    timeout_seconds: 60
    input_mapping:
      source_format: "{{ source_format }}"
      source_definition: "{{ source_definition }}"
      target_format: "{{ target_format | default('hkask') }}"
      mapping_rules: "{{ mapping_rules | default({}) }}"

  - ordinal: 2
    action: compute
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 3
    action: loop
    description: Re-enter translation cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the translation quality signal into kata_hypotenuse so the
      # Cauchy criterion can detect when the iterates have stopped moving.
      kata_hypotenuse: "{{ step_1_result.convergence_metric | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: skill-translator/translate-skill
      gas_budget: 5000
    - resource: manifest
      action: execute
      template_id: skill-translation
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true
