# Swarm Steering Process Manifest
# hKask v0.35.0 — Focused local-swarm steering (execute-and-feed-back loop)
#
# Ontological anchors:
#   - PKO (Carriero et al. 2025): the plan is a Procedure; this skill produces
#     the StepExecution sequence + the result collection (delegate_results).
#   - Conant-Ashby Good Regulator (1970): the steering directive must model the
#     swarm it steers (roster, plan, credit budget).
#
# PDCA shape (emergent): Receive (the plan + state + budget) -> Direct (the
# execution directive) -> Collect (the delegate_results shape) -> Feedback
# (the re-invoke instruction). One-shot directive producer — the Curator/human
# executes the directive; this skill does not execute delegations itself.
#
# Pairs with swarm-intelligence (the planner). swarm-intelligence in
# steering_mode produces a steering_directive; this skill is the focused
# codification of the execute-and-feed-back loop a Curator or human runs. The
# delegate_results contract (an array of LocalDelegateResult-shaped objects)
# is what activates C5 (fault attribution) + C6 (reconfigure) in the next
# swarm-intelligence invocation.

manifest:
  id: swarm-steering
  category: skill
  name: Swarm Steering
  description: >
    Focused local-swarm steering skill for the Kask Curator or a human in the
    loop. Codifies the execute-and-feed-back loop: take a swarm-intelligence
    plan (emitted_calls), produce the swarm_execute_plan_local delegation
    sequence + the delegate_results collection shape (LocalDelegateResult
    array with task_success verdicts) + the re-invoke instruction. The
    Curator/human calls swarm_execute_plan_local and feeds delegate_results
    back to swarm-intelligence, closing the C5/C6 feedback loop. Anchored to
    PKO (procedure execution) and the Conant-Ashby Good Regulator (the actuator
    must model the swarm it steers). Pairs with swarm-intelligence (the
    planner). Emits reg.skill.swarm-steering.* spans.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: ""
  max_iterations: 1
  min_iterations: 0
  on_not_reached: proceed
  target_artifacts_field: "current_artifacts"

gas:
  cap: 20000
  cost_per_iteration: 150
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: emitted_calls
    type: array
    required: true
    description: >
      The swarm-intelligence plan's emitted_calls (from ACT's output) — the
      delegate calls to execute. Each entry: { move_type, agent, tool_name,
      credits_authorized }. Only move_type "delegate" entries produce
      LocalDelegateResult telemetry; composition changes (hire/remove/
      reconfigure_agent/create) are noted but not executed for telemetry.
  - name: task
    type: string
    required: true
    description: >
      The target task the swarm is being steered toward. Used to derive the
      per-delegation task text.
  - name: swarm_id
    type: string
    required: true
    description: >
      The local swarm id (session identifier). Passed through to the
      feedback_instruction for the re-invoke context.
  - name: credits_authorized
    type: number
    required: false
    description: >
      The per-dispatch credit ceiling (HKASK_ABW_MAX_CREDITS, default 50). Each
      execution_sequence entry's credits_authorized is capped at this. Default
      50 when omitted.

steps:
  - ordinal: 1
    action: select
    description: >
      DIRECT: Produce the local-swarm steering directive. Take the
      swarm-intelligence plan (emitted_calls) + the task + the credit budget,
      and produce a structured steering directive: pre-flight checks (agents exist
      via swarm_list_local_agents; NO ledger-funding check — local delegation
      is never gated on funds),
      the swarm_execute_plan_local delegation sequence (with optional
      deterministic evaluators), the delegate_results collection shape
      (LocalDelegateResult array with task_success verdicts), and the re-invoke
      instruction (re-invoke swarm-intelligence with delegate_results +
      steering_mode: steering). The Curator/human calls swarm_execute_plan_local.
    renderer: minijinja
    template_ref: swarm-steering/swarm-steering-direct
    gas_cap: 5000
    timeout_seconds: 150
    input_mapping:
      emitted_calls: "{{ emitted_calls }}"
      task: "{{ task }}"
      swarm_id: "{{ swarm_id }}"
      credits_authorized: "{{ credits_authorized | default(50) }}"

  # ─── STEP 2: PRE-FLIGHT VALIDATION (deterministic lisp.eval) ───
  # Symbolic-neural scaffolding (de la Torre 2025, arXiv:2506.10021):
  # the LLM is bad at self-checking structural completeness of the directive
  # it produced. This step deterministically verifies: (1) every entry in
  # execution_sequence has agent_name, task, credits_authorized keys, (2) no
  # credits_authorized exceeds the ceiling, (3) no duplicate agent_name entries.
  # Reference model: Conant-Ashby Good Regulator (1970) — the actuator must
  # model the swarm it steers; a structurally invalid directive cannot model it.
  - ordinal: 2
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic pre-flight validation. Verifies the steering directive's
      execution_sequence entries each have agent_name, task, credits_authorized
      keys; that no credits_authorized exceeds the ceiling; and that no
      duplicate agent_name entries exist. Returns a defects list — empty =
      passed, non-empty = the directive is structurally invalid. No LLM call.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((directive step_1_result))
          (if (is_null directive)
              (list "no_directive_result")
              (let ((seq (assoc "execution_sequence" directive)))
                (if (is_null seq)
                    (list "missing_execution_sequence")
                    (begin
                      (define check-entry
                        (lambda (es idx acc)
                          (if (is_null es)
                              acc
                              (let ((entry (car es)))
                                (let ((agent (assoc "agent_name" entry))
                                      (task (assoc "task" entry))
                                      (credits (assoc "credits_authorized" entry)))
                                  (let ((d1 (if (is_null agent) (list "missing_agent_name") (list)))
                                        (d2 (if (is_null task) (list "missing_task") (list)))
                                        (d3 (if (is_null credits) (list "missing_credits_authorized") (list)))
                                        (d4 (if (and (not (is_null credits))
                                                    (let ((cc (if (numberp credit_ceiling) credit_ceiling 50)))
                                                      (> credits cc)))
                                              (list "credits_exceed_ceiling")
                                              (list))))
                                    (check-entry (cdr es) (+ idx 1)
                                      (append acc d1 d2 d3 d4))))))))
                      (define check-duplicates
                        (lambda (es seen acc)
                          (if (is_null es)
                              acc
                              (let ((entry (car es)))
                                (let ((agent (assoc "agent_name" entry)))
                                  (let ((agent-str (if (is_null agent) "" agent)))
                                    (if (not (is_null (assoc agent-str seen)))
                                        (check-duplicates (cdr es) (cons (list agent-str true) seen)
                                          (cons "duplicate_agent" acc))
                                        (check-duplicates (cdr es) (cons (list agent-str true) seen) acc))))))))
                      (define entry-defects (check-entry seq 0 (list)))
                      (define dup-defects (check-duplicates seq (list) (list)))
                      (append entry-defects dup-defects))))))
      env:
        step_1_result: "{{ step_1_result }}"
        credit_ceiling: "{{ credits_authorized | default(50) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 2
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.swarm-steering
  telemetry_namespace: hkask.template.swarm-steering
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true