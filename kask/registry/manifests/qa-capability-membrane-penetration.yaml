# QA Capability-Match Membrane Penetration Test — v0.31.0
#
# Verifies the capability-match (Object Capability) security membrane by running
# the hkask-capability test suite (8 tests) and classifying results.
#
# The capability system is the enforcement substrate for P4 (Clear Boundaries).
# If the capability-match membrane is compromised, unauthorized tool access becomes possible,
# violating the Magna Carta contract.
#
# Capability invariants (8 tests across 1 test file + 4 #[cfg(test)] modules):
#   - Capability token construction and verification
#   - Tool authorization gating (allowed/denied tools)
#   - Delegation token chain validation
#   - Capability membrane rejection of unauthorized calls
#
# Constraint force: PROHIBITION — capability-match is P4 enforcement substrate.
# A failing gate here is a security incident.
#
# Runner readiness: EXECUTABLE — run_command steps work today;
#   classify step gracefully degrades without DEEPINFRA_API_KEY.

manifest:
  id: qa-capability-membrane-penetration
  category: qa-script
  name: QA Capability-Match Membrane Penetration
  version: "0.33.7"
  visibility: Private
  description: >
    Verifies capability-match security membrane integrity through the hkask-capability
    test suite (8 tests). Ensures capability tokens gate tool access,
    delegation chains validate correctly, and unauthorized calls are
    rejected. PROHIBITION-level — capability-match is P4 enforcement substrate.

gas:
  cap: 15000
  hard_limit: true

rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true

steps:
  # Step 1: Run capability test suite
  - ordinal: 1
    action: execute
    command: "cargo test -p hkask-capability 2>&1 | tail -15"
    description: "Run the hkask-capability test suite (8 tests) and capture the tail of the output."
    branching:
      success: 2
      failure: 4

  # Step 2: Classify test output
  - ordinal: 2
    action: select
    classifier: qa-triage
    description: "Security audit: hkask-capability test suite (8 tests, PROHIBITION-level). Verify capability-match membrane: capability token construction and verification, tool authorization gating (allowed vs denied tools), delegation token chain validation, and unauthorized call rejection. The capability system is the P4 enforcement substrate — any failure is a security incident requiring immediate investigation."
    branching:
      high_confidence: 3
      medium_confidence: 3
      low_confidence: 5
      flake: 2
      unparseable: 5
      classifier_unavailable: 5

  # Step 3: PASS — capability-match membrane intact
  - ordinal: 3
    action: execute
    command: "echo '[QA:ocap] PASS — capability-match membrane intact (8/8 capability tests). P4 boundaries enforced.'"
    description: "Report PASS — capability-match membrane intact (8/8 capability tests). P4 boundaries enforced."
    terminal: true

  # Step 4: FAIL — capability-match membrane breached
  - ordinal: 4
    action: execute
    command: "echo '[QA:ocap] FAIL — capability-match membrane test failed. P4 security boundary may be compromised. Immediate investigation required.'"
    description: "Report FAIL — capability-match membrane test failed. P4 security boundary may be compromised."
    terminal: true

  # Step 5: WARN — classifier uncertain
  - ordinal: 5
    action: execute
    command: "echo '[QA:ocap] WARN — classifier uncertain on capability test output. Manual security review required (PROHIBITION-level).'"
    description: "Report WARN — classifier uncertain on capability test output. Manual security review required."
    terminal: true

ledger:
  span_namespace: reg.skill.qa-capability-membrane-penetration

  emit_spans: true
