# Principle-Constraints Process Manifest
# ℏKask v0.35.0 — compile principles into checkable, code-path-anchored constraints

manifest:
  id: principle-constraints
  category: skill
  name: Principle Constraints
  description: >
    Compiles a stated principle into a set of checkable, code-path-anchored
    constraints with named falsifiers. The output is a *proposed* constraint
    set — a human reviews it before it becomes permanent, the same gate the
    paper (Where Agency Actually Lives, Axolotl Partners, 2026) demands for
    everything that touches permanent memory. Each constraint carries an
    assertion, an enforced_at location (file:line or UNKNOWN), a falsifier
    (test name that must exist and pass), and a status (enforced | gap |
    unverified). Constraints without a located enforcement path are flagged
    as gaps; the gap is the skill's highest-value output. Sibling to
    constraint-forces-recast (which generates concepts satisfying a
    constraint set) — this skill generates the constraint set from a
    principle. Anchored to the paper's own discipline: a constraint that
    isn't tied to a code path or a test is Unsourced — tag it, do not
    promote it.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 2
  max_iterations: 3
  min_iterations: 1
  target_artifacts_field: "constraint_set"
  on_not_reached: escalate

gas:
  cap: 80000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: principle
    type: string
    required: true
  - name: principle_source
    type: string
    required: true
  - name: mode
    type: string
    required: false
  - name: existing_constraints
    type: array
    required: false
  - name: enforcement_hints
    type: array
    required: false

ledger:
  span_namespace: reg.skill.principle-constraints

steps:
  - ordinal: 1
    action: select
    description: >
      Derive (or verify) the constraint set. Routes to principle-derive in
      derive mode, principle-verify in verify mode. The template does the
      enforcement-location work (grep, codegraph, read_file) and emits the
      proposed constraint set with per-constraint status and gaps.
    renderer: minijinja
    template_ref: principle-constraints/principle-derive
    gas_cap: 12000
    timeout_seconds: 240
    input_mapping:
      principle: "{{ principle }}"
      principle_source: "{{ principle_source }}"
      mode: "{{ mode | default('derive') }}"
      existing_constraints: "{{ existing_constraints | default([]) }}"
      enforcement_hints: "{{ enforcement_hints | default([]) }}"

  - ordinal: 2
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the count of constraints with
      status "enforced" plus the count of gaps. A stable reading across
      iterations means the agent has finished locating enforcement and
      flagging gaps — no new constraints or gaps are appearing. Using
      lisp.eval makes the computation deterministic, budgeted (gas_cap:
      100), and observable via a reg.skill.principle-constraints span.
      Guards against missing fields by returning 0 when absent — a stable
      reading that lets Cauchy fire after min_iterations.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (if (listp step_1_result)
            (let ((summary (assoc "summary" step_1_result)))
              (if (is_null summary)
                  0
                  (let ((enforced (assoc "enforced" summary))
                        (gaps (assoc "gaps" summary)))
                    (+ (if (is_null enforced) 0 enforced)
                       (if (is_null gaps) 0 gaps)))))
            0)
      env:
        step_1_result: "{{ step_1_result | default({}) }}"

  - ordinal: 3
    action: loop
    description: >
      Re-enter derivation if convergence is not met — the agent may have
      located additional enforcement paths or gaps on a second pass. Capped
      at max_iterations: 3 to prevent unbounded search.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_2_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort