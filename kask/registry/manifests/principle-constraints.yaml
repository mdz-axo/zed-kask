# Principle-Constraints Process Manifest
# ℏKask v0.35.0 — compile principles into checkable, code-path-anchored constraints

manifest:
  id: principle-constraints
  category: skill
  name: Principle Constraints
  description: >
    Compiles a stated principle into a set of checkable, code-path-anchored
    constraints with named falsifiers. The output is a *proposed* constraint
    set — a human reviews it before it becomes permanent, the same gate the
    paper (Where Agency Actually Lives, Axolotl Partners, 2026) demands for
    everything that touches permanent memory. Each constraint carries an
    assertion, an enforced_at location (file:line or UNKNOWN), a falsifier
    (test name that must exist and pass), and a status (enforced | gap |
    unverified). Constraints without a located enforcement path are flagged
    as gaps; the gap is the skill's highest-value output. Sibling to
    constraint-forces-recast (which generates concepts satisfying a
    constraint set) — this skill generates the constraint set from a
    principle. Anchored to the paper's own discipline: a constraint that
    isn't tied to a code path or a test is Unsourced — tag it, do not
    promote it.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 1
  max_iterations: 1
  min_iterations: 1
  target_artifacts_field: "constraint_set"
  on_not_reached: abort

gas:
  cap: 80000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: principle
    type: string
    required: true
  - name: principle_source
    type: string
    required: true
  - name: mode
    type: string
    required: false
  - name: existing_constraints
    type: array
    required: false
  - name: enforcement_hints
    type: array
    required: false

ledger:
  span_namespace: reg.skill.principle-constraints

steps:
  # ── DERIVE: Compile the principle into a constraint set ──
  # Single-pass LLM inference. The LLM reasons about the enforcement hints
  # and its knowledge of the codebase to produce the proposed constraint
  # set. The LLM does NOT have tool access — it cannot grep or read files.
  # For exact line numbers and test names, the LLM uses UNKNOWN and MISSING:
  # prefixes. The human reviewer verifies the citations.
  - ordinal: 1
    action: select
    description: >
      Derive (or verify) the constraint set. The template receives the
      principle, its source, and enforcement hints, and emits the proposed
      constraint set with per-constraint status and gaps. The LLM reasons
      about the enforcement hints and its knowledge of the codebase. For
      exact file:line locations and test names, the LLM uses UNKNOWN and
      MISSING: prefixes when it cannot verify them. This is the skill's
      own discipline: no fabricated citations.
    renderer: minijinja
    template_ref: principle-constraints/principle-derive
    gas_cap: 12000
    timeout_seconds: 300
    input_mapping:
      principle: "{{ principle }}"
      principle_source: "{{ principle_source }}"
      mode: "{{ mode | default('derive') }}"
      existing_constraints: "{{ existing_constraints | default([]) }}"
      enforcement_hints: "{{ enforcement_hints | default([]) }}"

  - ordinal: 2
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: returns 1 (stable) to let Cauchy
      fire after min_iterations. The derivation is a single-pass operation.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: "1"
      env: {}

  - ordinal: 3
    action: loop
    description: >
      Re-enter derivation if convergence is not met. Capped at
      max_iterations: 1 — single-pass.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_2_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
