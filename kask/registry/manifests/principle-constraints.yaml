# Principle-Constraints Process Manifest
# ℏKask v0.35.0 — compile principles into checkable, code-path-anchored constraints

manifest:
  id: principle-constraints
  category: skill
  name: Principle Constraints
  description: >
    Compiles a stated principle into a set of checkable, code-path-anchored
    constraints with named falsifiers. The output is a *proposed* constraint
    set — a human reviews it before it becomes permanent, the same gate the
    paper (Where Agency Actually Lives, Axolotl Partners, 2026) demands for
    everything that touches permanent memory. Each constraint carries an
    assertion, an enforced_at location (file:line or UNKNOWN), a falsifier
    (test name that must exist and pass), and a status (enforced | gap |
    unverified). Constraints without a located enforcement path are flagged
    as gaps; the gap is the skill's highest-value output. Sibling to
    constraint-forces-recast (which generates concepts satisfying a
    constraint set) — this skill generates the constraint set from a
    principle. Anchored to the paper's own discipline: a constraint that
    isn't tied to a code path or a test is Unsourced — tag it, do not
    promote it.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 1
  max_iterations: 1
  min_iterations: 1
  target_artifacts_field: "constraint_set"
  on_not_reached: abort

gas:
  cap: 80000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: principle
    type: string
    required: true
  - name: principle_source
    type: string
    required: true
  - name: mode
    type: string
    required: false
  - name: existing_constraints
    type: array
    required: false
  - name: enforcement_hints
    type: array
    required: false
  - name: code_context
    type: string
    required: false
    description: >
      Optional: pre-gathered code context (file contents, grep results,
      DIVERGENCE.md excerpts) that the caller provides. When present, the
      LLM uses this context to cite file:line locations and identify
      falsifier tests. When absent, the LLM uses UNKNOWN for locations it
      cannot verify.

ledger:
  span_namespace: reg.skill.principle-constraints

steps:
  # ── DERIVE: Compile the principle into a constraint set ──
  # Single-pass LLM inference. The LLM receives the principle, enforcement
  # hints, and optional code_context (caller-provided file contents, grep
  # results, DIVERGENCE.md excerpts). For exact line numbers and test names
  # the LLM cannot verify, it uses UNKNOWN and MISSING: prefixes.
  #
  # A prior codegraph_query execute step was removed because its on_failure
  # config escalated the entire cascade when the tool was unavailable.
  # To re-add codegraph access, use a separate execute step with
  # on_failure: action: resume (not report) so failures don't escalate.
  - ordinal: 1
    action: select
    description: >
      Derive (or verify) the constraint set. The template receives the
      principle, its source, enforcement hints, and optional code_context.
      Emits the proposed constraint set as a JSON object with per-constraint
      status and gaps.
    renderer: minijinja
    template_ref: principle-constraints/principle-derive
    gas_cap: 12000
    timeout_seconds: 300
    input_mapping:
      principle: "{{ principle }}"
      principle_source: "{{ principle_source }}"
      mode: "{{ mode | default('derive') }}"
      existing_constraints: "{{ existing_constraints | default([]) }}"
      enforcement_hints: "{{ enforcement_hints | default([]) }}"
      code_context: "{{ code_context | default('') }}"
    output_schema:
      type: object
      properties:
        constraint_set:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              assertion:
                type: string
              kind:
                type: string
                enum: [structural, review]
              enforced_at:
                type: string
              enforcement_mechanism:
                type: string
              falsifier:
                type: string
              status:
                type: string
                enum: [enforced, gap, unverified]
              notes:
                type: string
        gaps:
          type: array
          items:
            type: object
            properties:
              gap_id:
                type: string
              principle_asserted:
                type: string
              enforcement_status:
                type: string
              proposed_remediation:
                type: string
              human_decision_required:
                type: boolean
        summary:
          type: object
          properties:
            total_constraints:
              type: integer
            enforced:
              type: integer
            gaps:
              type: integer
            unverified:
              type: integer
            human_review_required:
              type: boolean

  - ordinal: 2
    action: loop
    description: >
      Single-pass derivation. The convergence signal is a constant because
      the derivation is a one-shot LLM inference — there is no iterative
      refinement. max_iterations: 1 ensures exit after one pass.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "1.0"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
