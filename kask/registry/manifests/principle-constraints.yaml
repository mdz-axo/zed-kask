# Principle-Constraints Process Manifest
# ℏKask v0.35.0 — compile principles into checkable, code-path-anchored constraints

manifest:
  id: principle-constraints
  category: skill
  name: Principle Constraints
  description: >
    Compiles a stated principle into a set of checkable, code-path-anchored
    constraints with named falsifiers. The output is a *proposed* constraint
    set — a human reviews it before it becomes permanent, the same gate the
    paper (Where Agency Actually Lives, Axolotl Partners, 2026) demands for
    everything that touches permanent memory. Each constraint carries an
    assertion, an enforced_at location (file:line or UNKNOWN), a falsifier
    (test name that must exist and pass), and a status (enforced | gap |
    unverified). Constraints without a located enforcement path are flagged
    as gaps; the gap is the skill's highest-value output. Sibling to
    constraint-forces-recast (which generates concepts satisfying a
    constraint set) — this skill generates the constraint set from a
    principle. Anchored to the paper's own discipline: a constraint that
    isn't tied to a code path or a test is Unsourced — tag it, do not
    promote it.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 1
  max_iterations: 1
  min_iterations: 1
  target_artifacts_field: "constraint_set"
  on_not_reached: abort

