# Principle-Constraints Process Manifest
# ℏKask v0.35.0 — compile principles into checkable, code-path-anchored constraints

manifest:
  id: principle-constraints
  category: skill
  name: Principle Constraints
  description: >
    Compiles a stated principle into a set of checkable, code-path-anchored
    constraints with named falsifiers. The output is a *proposed* constraint
    set — a human reviews it before it becomes permanent, the same gate the
    paper (Where Agency Actually Lives, Axolotl Partners, 2026) demands for
    everything that touches permanent memory. Each constraint carries an
    assertion, an enforced_at location (file:line or UNKNOWN), a falsifier
    (test name that must exist and pass), and a status (enforced | gap |
    unverified). Constraints without a located enforcement path are flagged
    as gaps; the gap is the skill's highest-value output. Sibling to
    constraint-forces-recast (which generates concepts satisfying a
    constraint set) — this skill generates the constraint set from a
    principle. Anchored to the paper's own discipline: a constraint that
    isn't tied to a code path or a test is Unsourced — tag it, do not
    promote it.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 1
  max_iterations: 1
  min_iterations: 1
  target_artifacts_field: "constraint_set"
  on_not_reached: abort

gas:
  cap: 80000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: principle
    type: string
    required: true
  - name: principle_source
    type: string
    required: true
  - name: mode
    type: string
    required: false
  - name: existing_constraints
    type: array
    required: false
  - name: enforcement_hints
    type: array
    required: false
  - name: code_context
    type: string
    required: false
    description: >
      Optional: pre-gathered code context (file contents, grep results,
      DIVERGENCE.md excerpts) that the caller provides. When present, the
      skill skips the codegraph query step and uses this context directly.

ledger:
  span_namespace: reg.skill.principle-constraints

steps:
  - ordinal: 1
    action: execute
    condition: "code_context == ''"
    description: >
      Query the code graph for symbols matching the enforcement hints.
      Uses codegraph_query with the first enforcement hint as the search
      query. Results include symbol names, file paths, and line numbers.
    mcp: codegraph_query
    gas_cap: 3000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        codegraph_query failed. The derivation proceeds without code graph
        context; the LLM must use UNKNOWN for enforced_at locations.
    input_mapping:
      query: "{{ enforcement_hints.0 | default(principle | default('')) }}"
      limit: 20

  - ordinal: 2
    action: select
    description: >
      Derive (or verify) the constraint set. The template receives the
      principle, its source, enforcement hints, and either codegraph query
      results (step 1) or caller-provided code_context.
    renderer: minijinja
    template_ref: principle-constraints/principle-derive
    gas_cap: 12000
    timeout_seconds: 300
    input_mapping:
      principle: "{{ principle }}"
      principle_source: "{{ principle_source }}"
      mode: "{{ mode | default('derive') }}"
      existing_constraints: "{{ existing_constraints | default([]) }}"
      enforcement_hints: "{{ enforcement_hints | default([]) }}"
      codegraph_results: "{{ step_1_result | default([]) }}"
      code_context: "{{ code_context | default('') }}"

  - ordinal: 3
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: enforced + gaps from the summary.
      Guards against non-object step_2_result with listp.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (if (listp step_2_result)
            (let ((summary (assoc "summary" step_2_result)))
              (if (is_null summary)
                  0
                  (let ((enforced (assoc "enforced" summary))
                        (gaps (assoc "gaps" summary)))
                    (+ (if (is_null enforced) 0 enforced)
                       (if (is_null gaps) 0 gaps)))))
            0)
      env:
        step_2_result: "{{ step_2_result | default({}) }}"

  - ordinal: 4
    action: loop
    description: "Single-pass derivation. max_iterations: 1 ensures exit."
    input_mapping:
      loop_target: "{{ 2 }}"
      convergence_signal: "{{ step_3_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

