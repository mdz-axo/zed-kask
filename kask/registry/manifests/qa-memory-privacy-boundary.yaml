manifest:
  id: qa-memory-privacy-boundary
  category: qa-script
  name: QA Memory Privacy Boundary
  version: 0.31.0
  visibility: Private
  description: 'Verifies hkask-mcp-memory privacy invariants through the memory_contract.rs integration
    tests (6 tests): public triple rejection, perspective enforcement, recall filtering, roundtrip integrity,
    and usage reporting. Exercises the MCP memory tool surface through contract tests.

    '
gas:
  cap: 20000
  alert_threshold: 0.8
  hard_limit: true
rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: cargo test -p hkask-mcp-memory --test memory_contract -- --nocapture 2>&1 | tail -20
  description: 'Run memory contract tests: privacy boundaries, perspective isolation, roundtrip integrity'
  retries: 0
  branching:
    success: 2
    failure: 4
- ordinal: 2
  action: classify
  classifier: qa-triage
  description: 'Test suite: hkask-mcp-memory contract tests. Verify privacy invariants: store_rejects_public_triple
    (P1 User Sovereignty), store_requires_perspective (mandatory perspective), recall_nonexistent_returns_empty
    (graceful miss), store_and_recall_episodic_triple (roundtrip integrity), storage_usage_reports_count
    (usage tracking), recall_filters_by_perspective (cross-perspective isolation, P11 Public/Private Sphere).
    All 6 contract tests passing indicates memory privacy boundaries are intact.'
  retries: 0
  branching:
    high_confidence: 3
    medium_confidence: 3
    low_confidence: 5
    flake: 2
    unparseable: 5
    classifier_unavailable: 5
- ordinal: 3
  action: run_command
  command: "echo '[QA:memory] PASS \u2014 privacy boundaries, perspective isolation verified (6/6)'"
  description: 'All memory contract tests pass: P1/P11 privacy boundaries enforced'
  retries: 0
  terminal: true
- ordinal: 4
  action: run_command
  command: "echo '[QA:memory] FAIL \u2014 memory contract tests failed. Privacy boundary may be breached:\
    \ public triple acceptance, perspective bypass, or cross-perspective leak.'"
  description: "Memory contract test failure \u2014 P1/P11 privacy boundary may be compromised"
  retries: 0
  terminal: true
- ordinal: 5
  action: run_command
  command: "echo '[QA:memory] WARN \u2014 classifier low confidence on test output. Manual review required\
    \ for privacy-critical server.'"
  description: "Classifier returned low confidence \u2014 memory is privacy-critical"
  retries: 0
  terminal: true
ledger:
  emit_spans: true
  alert: qa.memory.privacy
  span_namespace: reg.skill.qa-memory-privacy-boundary
