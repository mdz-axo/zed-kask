# Company Research — Flash Pipeline Process Manifest
# ℏKask v0.35.0 — EFRA-AI main pipeline (agents 01–09) as convergent flowdef
#
# Design: kask/docs/plans/efra-ai-to-kask-company-research-skill.md
# MCP integration: kask/docs/explanation/skill-mcp-integration.md
#
# Sequential pipeline mirroring EFRA-AI's main pipeline:
#   SCOUT(1) → INTEL(2-6) → FORENSIC pre(7) → CRITICAL FACTOR(8-9) →
#   FORENSIC full(10-11) → VALUATION(12-13) → COMMUNICATION(14) →
#   KATA(15-18) → LENS(19-21) → convergence(22) → loop(23) → persist(24)
#
# MCP tool calls are native `action: execute` steps (deterministic, governed,
# testable). LLM synthesis is `action: select` with `template_ref`. Early-
# exit gates (DROP / HALT / BLOCK) are `condition:` on downstream steps.
# Convergence is LENS verdict consistency (CONSISTENT=0.0, PARTIAL=0.5,
# INCONSISTENT=1.0); PARTIAL loops back to VALUATION synthesis (13) with LENS
# tensions injected.
#
# Cross-skill composition:
#   - step 6 reuses `listening/apply-template` (MAIA v3 earnings-call listening)
#   - step 16 reuses `kata-improvement/improvement-step1-direction` (PDCA)
# Same pattern as superforecasting reusing `falsifiability/*` templates.

manifest:
  id: company-research-flash
  category: skill
  name: Company Research — Flash Pipeline
  description: >
    Equity research flash pipeline converted from EFRA-AI (Replicant-
    Partners). Sequential 25-step flowdef: SCOUT alpha score → INTEL
    business context + earnings listening → FORENSIC pre-screen → CRITICAL
    FACTOR Bull/Base/Bear → FORENSIC full audit → VALUATION 8-step (1 native
    mcp_batch of 4 MCP tool calls + LLM synthesis) → COMMUNICATION ENTER gate
    + CASCADE note → KATA PDCA (2 native MCP tool calls + cross-skill reuse)
    → LENS five-framework audit (2 native MCP tool calls + LLM synthesis) →
    convergence check → loop on PARTIAL. MCP tool calls are native
    `action: execute` steps; templates do LLM synthesis over their outputs.
    Early-exit gates (DROP / HALT / BLOCK) are `condition:` on downstream
    steps. Converges on LENS verdict consistency.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.05
  cauchy_window: 2
  max_iterations: 3
  min_iterations: 1
  on_not_reached: escalate
  target_artifacts_field: "lens_verdict"


rjoule:
  cap: 8
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: ticker
    type: string
    required: true
    description: Equity ticker symbol (e.g. "AAPL", "MSFT").
  - name: analyst_id
    type: string
    required: false
    description: >
      Analyst identifier for forecast-ledger attribution and KATA PDCA
      tracking. Persisted with every forecast PT / probability / IMAGINE
      prediction for later Brier scoring. The invoking agent should resolve
      `git config user.name` and pass it for proper attribution; templates
      default to "zed-kask-operator" when absent.
  - name: catalyst
    type: string
    required: false
    description: >
      Optional catalyst note (e.g. "earnings next week", "FDA decision Q3").
      Feeds SCOUT's timeliness scoring and COMMUNICATION's ENTER T criterion.
  - name: idea_source_tag
    type: string
    required: false
    description: >
      Optional tag identifying the idea source (screener / client request /
      news / KATA obstacle). Feeds SCOUT's coverage-gap scoring.
  - name: in_excellence_universe
    type: boolean
    required: false
    description: >
      If true, SCOUT applies the 11-criterion excellence universe (S1–S11)
      deterministic screen. If false or absent, SCOUT uses the alpha-score
      formula only.
  - name: downstream_mode_override
    type: string
    required: false
    description: >
      Force valentine / gunn / dual output mode. Else SCOUT decides based on
      alpha score and horizon fit.
  - name: prior_outcomes
    type: object
    required: false
    description: >
      Prior forecast-ledger outcomes for this ticker + analyst (resolved PTs
      and prediction-market resolutions with Brier scores). Fetched natively
      by the forecast_list execute step (0) from hkask-mcp-companies. This
      input is retained as a cascade-level override — the invoking agent may
      pre-populate it to bypass the fetch. Feeds KATA step 16 PDCA "check".
  - name: now
    type: string
    required: false
    description: >
      Current date in ISO 8601 format (e.g. "2026-08-18"). Populated by the
      invoking agent or the skill tool. Used by forecast_persist (step 22)
      as the forecast_date. If absent, the persist step receives an empty
      string and the forecast is stored without a date.

ledger:
  span_namespace: reg.skill.company-research-flash

steps:
  # ── Step 0: Fetch prior forecasts (persistence-grounded learning) ──
  # Reads prior durable forecasts for this ticker from the companies MCP
  # forecast ledger. Feeds the KATA PDCA "check" step (17) with prior
  # forecast-to-outcome calibration data. Absent on first analysis of a
  # ticker — the tool returns an empty list, not an error.
  - ordinal: 0
    action: execute
    description: >
      Fetch prior durable forecasts for this ticker via forecast_list
      (hkask-mcp-companies). Persistence-grounded learning — the KATA PDCA
      step (17) uses prior forecast outcomes to calibrate process confidence.
      Result lands in step_0_result and feeds the prior_outcomes input of
      step 16.
    mcp: forecast_list
    timeout_seconds: 60
    input_mapping:
      symbol: "{{ ticker }}"
    on_failure:
      action: report
      resume: >
        forecast_list failed — the companies MCP server may be down.
        Restart the server via sync_kask_mcp_servers and re-invoke. The
        pipeline can proceed without prior forecast data (first analysis).

  # ── Step 1: SCOUT — alpha score + excellence universe ──
  - ordinal: 1
    action: select
    description: >
      SCOUT: compute alpha score (coverage gap × 0.30 + market cap fit × 0.20
      + sector relevance × 0.25 + valuation anomaly × 0.25, + EM GDP /
      Bessembinder / low-coverage bonuses up to +25) and apply the 11-
      criterion excellence universe (S1–S11) if in_excellence_universe. Emits
      decision (MUST_COVER / REVIEW_ZONE / DROP — DROP is terminal).
    renderer: minijinja
    template_ref: company-research/scout-alpha-score
    timeout_seconds: 120
    input_mapping:
      ticker: "{{ ticker }}"
      catalyst: "{{ catalyst | default('') }}"
      idea_source_tag: "{{ idea_source_tag | default('') }}"
      in_excellence_universe: "{{ in_excellence_universe | default(false) }}"
      downstream_mode_override: "{{ downstream_mode_override | default('') }}"

  # ── Steps 2–3: INTEL — business context + information mosaic (DEEPEN) ──
  # Step 2 fetches research_search + web_search via mcp_batch, step 3
  # synthesizes. Both are conditioned on SCOUT not DROP.
  - ordinal: 2
    action: execute
    description: >
      INTEL — fetch fundamental research (research_search) and news mosaic
      (web_search) concurrently via mcp_batch. Both calls are independent;
      running them concurrently halves the wall-clock time vs two sequential
      120s timeouts. Results are keyed by `research` and `news` in
      step_2_result and feed INTEL synthesis (step 3).
    mcp_batch:
      - mcp: research_search
        key: research
        input_mapping:
          symbol: "{{ ticker }}"
          query: "{{ step_1_result.research_query | default(ticker ~ ' business model competitive position') }}"
      - mcp: web_search
        key: news
        input_mapping:
          query: "{{ ticker }} {{ catalyst | default('') }} news"
          strategy: "news"
          num_results: 20
    condition: "step_1_result.decision != 'DROP'"
    timeout_seconds: 120
    on_failure:
      action: report
      resume: >
        research_search / web_search batch failed — the companies or web MCP
        server may be down or the credential is missing. INTEL synthesis
        (step 3) proceeds without fundamental research data and/or the news
        mosaic; data_gaps will surface the missing context. Restart the
        server via sync_kask_mcp_servers and re-invoke.

  - ordinal: 3
    action: select
    description: >
      INTEL — business context 8-step + information mosaic synthesis.
      Reasons over research_search and web_search outputs (step 2). Emits
      mosaic_clear (false = MNPI HALT terminal gate), business_model,
      news_items, hypotheses (PENDING / VALIDATED / UNRESOLVABLE lifecycle),
      data_gaps. Per .rules: failed MCP tools surface as data_gaps entries,
      never collapse to None.
    renderer: minijinja
    template_ref: company-research/intel-mosaic
    condition: "step_1_result.decision != 'DROP'"
    timeout_seconds: 180
    input_mapping:
      ticker: "{{ ticker }}"
      horizon_tag: "{{ step_1_result.horizon_tag }}"
      downstream_mode: "{{ step_1_result.downstream_mode }}"
      research_search_result: "{{ step_2_result.research | default({}) }}"
      web_search_result: "{{ step_2_result.news | default({}) }}"

  # ── Step 4: INTEL — pragmatic-semantics certainty classification (v0.36.0) ──
  # Cross-skill adapter: company-research/intel-semantic-classify adapts
  # pragmatic-semantics/semantics-classify-statement to the intel mosaic.
  # Classifies every news_item and hypothesis by IS/OUGHT, declarative/
  # probabilistic/subjunctive, constraint force, and provenance — BEFORE
  # downstream steps (forensic, critical-factor, valuation) consume the
  # intel. Prevents certainty-level drift. Emits semantic_tags and
  # certainty_drift_risk. Downstream templates consume via
  # intel_bundle.semantic_tags (the forensic and critical-factor templates
  # already receive intel_bundle as input — the semantic_tags field rides
  # along without template changes).
  - ordinal: 4
    action: select
    description: >
      INTEL — pragmatic-semantics certainty classification. Adapts
      pragmatic-semantics/semantics-classify-statement to the intel mosaic
      (step 3). Classifies every news_item and hypothesis by ontological
      mode (IS/OUGHT), epistemic mode (declarative/probabilistic/subjunctive),
      constraint force, and provenance. Emits semantic_tags and
      certainty_drift_risk. Prevents certainty-level drift through the
      pipeline — a management quote treated as an ontological fact, a
      scenario treated as a forecast. Result lands in step_4_result.
    renderer: minijinja
    template_ref: company-research/intel-semantic-classify
    condition: "step_1_result.decision != 'DROP' AND step_3_result.mosaic_clear"
    timeout_seconds: 120
    input_mapping:
      ticker: "{{ ticker }}"
      intel_bundle: "{{ step_3_result }}"

  # ── Steps 5–6: INTEL — earnings transcript via listening skill (cross-skill) ──
  # Step 5 fetches the transcript via company_transcript MCP tool (native
  # execute). Step 6 applies the listening/apply-template (MAIA v3 no-
  # fabrication) over the fetched chunks. Cross-skill template_ref — same
  # pattern as superforecasting step 6 reusing falsifiability/* templates.
  - ordinal: 5
    action: execute
    description: >
      INTEL — fetch earnings transcript via company_transcript MCP tool for
      the listening skill. Deterministic. Result lands in step_5_result
      and feeds the listening template (step 6).
    mcp: company_transcript
    condition: "step_1_result.decision != 'DROP'"
    timeout_seconds: 120
    input_mapping:
      symbol: "{{ ticker }}"
      mode: "earnings"
      quarters_back: 4
    on_failure:
      action: report
      resume: >
        company_transcript failed — the companies MCP server may be down or
        the credential is missing. The listening skill (step 6) cannot run
        without the transcript; the forensic full audit will proceed without
        the listening verdict. Restart the server via sync_kask_mcp_servers
        and re-invoke.

  - ordinal: 6
    action: flowdef
    description: >
      INTEL — earnings-call listening via the full listening skill (MAIA v3
      template, no-fabrication invariant). Invoked as a sub-flowdef so the
      listening skill's chunk_transcript compute step runs before the
      template. Consumes the company_transcript output (5). Result feeds
      INTEL business context and FORENSIC full management profile.
    template_ref: listening
    condition: "step_1_result.decision != 'DROP'"
    timeout_seconds: 300
    input_mapping:
      company_symbol: "{{ ticker }}"
      transcript: "{{ step_5_result.transcripts[0].content | default('') }}"
      prior_transcripts: "{{ prior_outcomes.prior_transcripts | default([]) }}"

  # ── Step 7: FORENSIC pre-screen ──
  # Condition: INTEL mosaic_clear (false = MNPI HALT terminal gate).
  - ordinal: 7
    action: select
    description: >
      FORENSIC pre-screen: quick risk scan across accounting red flags,
      governance, going-concern. Emits severity (SEV-1..5), recommendation
      (CLEAR+adj / CONDITIONAL / BLOCK — BLOCK is terminal). FORENSIC cannot
      be skipped (EFRA-AI invariant).
    renderer: minijinja
    template_ref: company-research/forensic-pre-screen
    condition: "step_3_result.mosaic_clear"
    timeout_seconds: 150
    input_mapping:
      ticker: "{{ ticker }}"
      intel_bundle: "{{ step_3_result }}"

  # ── Steps 8–9: CRITICAL FACTOR — Bull/Base/Bear thesis engine ──
  # Step 8 generates the scenario tree via scenario_build MCP tool.
  # Step 9 synthesizes the critical factors and scenarios.
  - ordinal: 8
    action: execute
    description: >
      CRITICAL FACTOR — generate Bull/Base/Bear scenario tree via
      scenario_build MCP tool. Deterministic. Result lands in step_8_result
      and feeds CRITICAL FACTOR synthesis (step 9).
    mcp: scenario_build
    condition: "step_3_result.mosaic_clear AND step_7_result.recommendation != 'BLOCK'"
    timeout_seconds: 120
    input_mapping:
      subject: "{{ ticker }} critical factors Bull Base Bear"
      scenario_type: "equity_thesis"
      context: "{{ step_3_result.business_model | default('') }}"
    on_failure:
      action: report
      resume: >
        scenario_build failed — the scenario MCP server may be down. The
        CRITICAL FACTOR synthesis (step 9) proceeds without the scenario
        tree; the critical-factor template will generate scenarios without
        the structured event tree. Restart the server via
        sync_kask_mcp_servers and re-invoke.

  - ordinal: 9
    action: select
    description: >
      CRITICAL FACTOR: identify 3–5 critical factors and construct Bull/Base/
      Bear scenarios with EPS impact. Reasons over scenario_build output
      (8). Emits factors (empty = DROP terminal gate), scenarios with
      probabilities and EPS impact, impact_mappings (per-node DCF assumption
      deltas for scenario_impact_valuation). Cross-references
      superforecasting/stage_3_probability_estimate methodology for granular
      (0.35) vs round (0.50) probabilities.
    renderer: minijinja
    template_ref: company-research/critical-factor
    condition: "step_3_result.mosaic_clear AND step_7_result.recommendation != 'BLOCK'"
    timeout_seconds: 180
    input_mapping:
      ticker: "{{ ticker }}"
      intel_bundle: "{{ step_3_result }}"
      forensic_profile: "{{ step_7_result }}"
      downstream_mode: "{{ step_1_result.downstream_mode }}"
      horizon_tag: "{{ step_1_result.horizon_tag }}"
      scenario_build_result: "{{ step_8_result }}"

  # ── Steps 10–11: FORENSIC full audit ──
  # Condition: CRITICAL FACTOR produced factors (empty = DROP terminal).
  # Step 10 fetches company_transcript for mgmt quotes. Step 11 synthesizes.
  - ordinal: 10
    action: execute
    description: >
      FORENSIC full — fetch earnings transcript via company_transcript MCP
      tool for management profile (owner-operator, capital allocation track
      record). Deterministic. Result lands in step_10_result.
    mcp: company_transcript
    condition: "step_9_result.factors"
    timeout_seconds: 120
    input_mapping:
      symbol: "{{ ticker }}"
      mode: "earnings"
      quarters_back: 4
    on_failure:
      action: report
      resume: >
        company_transcript failed — the companies MCP server may be down or
        the credential is missing. The FORENSIC full audit (step 11) proceeds
        without the transcript; management profile will rely on intel_bundle
        context only. Restart the server via sync_kask_mcp_servers and
        re-invoke.

  - ordinal: 11
    action: select
    description: >
      FORENSIC full audit: accruals quality, governance (board independence,
      COB/CEO separation), management profile. Reasons over company_transcript
      output (10) and the listening verdict (step 6). Emits severity,
      recommendation (BLOCK terminal gate), management_quality,
      governance_score, accruals_score. FORENSIC cannot be skipped.
    renderer: minijinja
    template_ref: company-research/forensic-full
    condition: "step_9_result.factors"
    timeout_seconds: 180
    input_mapping:
      ticker: "{{ ticker }}"
      intel_bundle: "{{ step_3_result }}"
      listening_verdict: "{{ step_6_result }}"
      transcript_result: "{{ step_10_result }}"

  # ── Steps 12–13: VALUATION — 8-step price target (DEEPEN) ──
  # One native mcp_batch step (12) + LLM synthesis (13).
  # Condition: FORENSIC full did not BLOCK.
  - ordinal: 12
    action: execute
    description: >
      VALUATION — run DCF (dcf_valuation), peer comparables
      (comparable_analysis), expectations gap (expectations_gap), and
      scenario-weighted price target (scenario_impact_valuation) concurrently
      via mcp_batch. All four calls are independent; running them concurrently
      cuts wall-clock time vs four sequential 120s timeouts. Results are keyed
      by `dcf`, `comparables`, `expectations`, and `scenario_pt` in
      step_12_result and feed VALUATION synthesis (step 13).
    mcp_batch:
      - mcp: dcf_valuation
        key: dcf
        input_mapping:
          symbol: "{{ ticker }}"
      - mcp: comparable_analysis
        key: comparables
        input_mapping:
          symbol: "{{ ticker }}"
      - mcp: expectations_gap
        key: expectations
        input_mapping:
          symbol: "{{ ticker }}"
      - mcp: scenario_impact_valuation
        key: scenario_pt
        input_mapping:
          symbol: "{{ ticker }}"
          scenario_tree: "{{ step_8_result | tojson }}"
          impact_mappings: "{{ step_9_result.impact_mappings | default([]) | tojson }}"
    condition: "step_9_result.factors AND step_11_result.recommendation != 'BLOCK'"
    timeout_seconds: 120
    on_failure:
      action: report
      resume: >
        VALUATION mcp_batch (dcf / comparables / expectations / scenario_pt)
        failed — the companies MCP server may be down. The VALUATION
        synthesis (step 13) proceeds without the failed model(s); the
        valuation template will apply the L1/L2 fallback hierarchy per failed
        component. Restart the server via sync_kask_mcp_servers and re-invoke.

  - ordinal: 13
    action: select
    description: >
      VALUATION 8-step synthesis: LLM reasons over the four MCP tool outputs
      (step 12). Emits pt_12m, rr_ratio, rating (BUY/HOLD/UNDERPERFORM), FaVeS
      (variant expectations score), confidence, data_gaps (names any failed
      MCP tool with LLM-derived fallback estimate + confidence penalty per
      EFRA-AI L1/L2 fallback hierarchy). RR < 2:1 + UNDERPERFORM = DROP
      terminal gate.
    renderer: minijinja
    template_ref: company-research/valuation-8step
    condition: "step_9_result.factors AND step_11_result.recommendation != 'BLOCK'"
    timeout_seconds: 240
    input_mapping:
      ticker: "{{ ticker }}"
      forensic_profile: "{{ step_11_result }}"
      cf_scenarios: "{{ step_9_result.scenarios }}"
      intel_bundle: "{{ step_3_result }}"
      downstream_mode: "{{ step_1_result.downstream_mode }}"
      dcf_result: "{{ step_12_result.dcf | default({}) }}"
      comparables_result: "{{ step_12_result.comparables | default({}) }}"
      expectations_result: "{{ step_12_result.expectations | default({}) }}"
      scenario_pt_result: "{{ step_12_result.scenario_pt | default({}) }}"
      lens_tensions: "{{ lens_tensions | default([]) }}"

  # ── Step 14: COMMUNICATION — ENTER gate + CASCADE note ──
  # Condition: VALUATION did not DROP (RR >= 2:1 or rating != UNDERPERFORM).
  - ordinal: 14
    action: select
    description: >
      COMMUNICATION: ENTER gate (Edge / New / Timely / Examples / Revealing —
      5/5 = PUBLISH, 4/5 = ALERT, ≤3/5 = DROP) and CASCADE-format research
      note (Conclusion → Action → Scenarios → Catalysts → Data). Emits
      publication_possible, enter_score, cascade_note, final_confidence.
      Confidence < 0.50 = NO_PUBLISH (EFRA-AI invariant).
    renderer: minijinja
    template_ref: company-research/communication-enter
    condition: "step_13_result AND (step_13_result.rr_ratio >= 2.0 OR step_13_result.rating != 'UNDERPERFORM')"
    timeout_seconds: 180
    input_mapping:
      ticker: "{{ ticker }}"
      valuation_model: "{{ step_13_result }}"
      forensic_profile: "{{ step_11_result }}"
      cf_output: "{{ step_9_result }}"
      intel_bundle: "{{ step_3_result }}"
      downstream_mode: "{{ step_1_result.downstream_mode }}"

  # ── Steps 15–18: KATA — PDCA process audit (cross-skill reuse) ──
  # Two native execute steps (15/16) for forecast-to-outcome calibration loop
  # + cross-skill reuse of kata-improvement (17) + calibration gap (18).
  # ── Steps 15–16: KATA — calibration data fetch (concurrent) ──
  # Two independent MCP calls with the same condition. Running concurrently
  # cuts wall-clock time from 180s to 90s.
  - ordinal: 15
    action: execute
    description: >
      KATA — fetch resolved prediction-market outcomes and calibration Brier
      score concurrently via mcp_batch. market_check_resolutions closes the
      forecast-to-outcome calibration loop; market_calibration provides the
      Brier score for process_confidence adjustment. Both are independent
      and share the same publication condition. Results are keyed by
      resolved_outcomes and calibration_brier in step_15_result.
    mcp_batch:
      - mcp: market_check_resolutions
        key: resolved_outcomes
        input_mapping:
          limit: 50
      - mcp: market_calibration
        key: calibration_brier
        input_mapping:
          bucket: "economics"
    condition: "step_14_result.publication_possible AND step_14_result.final_confidence >= 0.50"
    timeout_seconds: 90
    on_failure:
      action: report
      resume: >
        KATA calibration data fetch failed — the prediction-markets MCP server
        may be down. The KATA calibration loop (step 17) proceeds without
        resolved outcomes and/or Brier score; the calibration gap will surface
        as 1.0 (maximum). Restart the server via sync_kask_mcp_servers and
        re-invoke.

  # ── Step 18: KATA — metacognition calibration gap measurement (v0.36.0) ──
  # Cross-skill adapter: company-research/kata-calibration-measure adapts
  # metacognition/meta-experiment to close the flash pipeline's open kata
  # loop. Step 17 (kata-improvement-step1-direction) sets the direction but
  # never measures the gap. This step measures the analyst's calibration gap
  # using the market_calibration Brier score (step 16) and resolved_outcomes
  # (step 15), then re-measures the current condition. Emits calibration_gap
  # (0.0 calibrated → 1.0 maximum gap) that LENS (step 20) consumes as a 6th
  # axis alongside the existing five frameworks. No prediction recorded by
  # the KATA direction step = maximum gap (1.0) — a broken feedback loop,
  # not a neutral state.
  # ── Steps 17–18: KATA — direction first, then calibration gap measurement ──
  # Ordinals swapped from original: step 16 (direction) must run BEFORE step 17
  # (calibration gap) because step 17 consumes step_16_result.prediction.
  # The original ordering had calibration gap referencing step_16_result before
  # direction ran — a forward-reference bug that always produced
  # calibration_gap = 1.0.
  - ordinal: 16
    action: select
    description: >
      KATA — cross-skill reuse of kata-improvement/improvement-step1-direction
      (Toyota Improvement Kata step 1: Understand Direction). Audits the
      research process: knowledge gaps, untested assumptions, next PDCA
      experiment. Consumes resolved outcomes (15) and calibration Brier (16)
      plus prior_outcomes input. Emits KataBoard with process_confidence,
      next_review_date. Never blocks publication. Result lands in
      step_16_result and feeds step 17 (calibration gap) and LENS (step 20).
    renderer: minijinja
    template_ref: kata-improvement/improvement-step1-direction
    condition: "step_14_result.publication_possible AND step_14_result.final_confidence >= 0.50"
    timeout_seconds: 150
    input_mapping:
      challenge: "Audit the research process for {{ ticker }}: identify knowledge gaps, untested assumptions, and the next PDCA experiment that would move research to higher confidence."
      context:
        ticker: "{{ ticker }}"
        resolved_outcomes: "{{ step_15_result.resolved_outcomes | default([]) }}"
        calibration_brier: "{{ step_15_result.calibration_brier | default({}) }}"
        prior_outcomes: "{{ step_0_result | default(prior_outcomes | default({})) }}"
        valuation: "{{ step_13_result }}"
        communication: "{{ step_14_result }}"

  - ordinal: 17
    action: select
    description: >
      KATA — metacognition calibration gap measurement. Adapts
      metacognition/meta-experiment to close the open kata loop: step 16
      (kata-improvement-step1-direction) sets the direction and emits the
      KataBoard with process_confidence and prediction. This step measures
      the analyst calibration gap using the market_calibration Brier score
      (step 16) and resolved_outcomes (step 15). Emits calibration_gap
      (0.0 calibrated → 1.0 maximum gap) that LENS consumes as a 6th axis.
      No prediction recorded = 1.0 (broken feedback loop, not neutral).
      Result lands in step_17_result and feeds LENS (step 20).
    renderer: minijinja
    template_ref: company-research/kata-calibration-measure
    condition: "step_14_result.publication_possible AND step_14_result.final_confidence >= 0.50"
    timeout_seconds: 150
    input_mapping:
      ticker: "{{ ticker }}"
      goal: "Close the calibration loop for {{ ticker }}: measure whether the analyst's process_confidence matches the market_calibration Brier score."
      current_condition: "{{ step_16_result | default({}) }}"
      prediction: "{{ step_16_result.prediction | default(none) }}"
      calibration_brier: "{{ step_15_result.calibration_brier | default({}) }}"
      resolved_outcomes: "{{ step_15_result.resolved_outcomes | default([]) }}"
      context_text: "{{ step_14_result.cascade_note | default('') }}"

  # ── Steps 18–19: LENS — outside view + evidence quality (concurrent) ──
  # Two independent MCP calls with the same condition. Running concurrently
  # cuts wall-clock time from 210s to 120s.
  - ordinal: 18
    action: execute
    description: >
      LENS — find prediction markets (market_match) and evaluate evidence
      quality (evaluate_evidence) concurrently via mcp_batch. Both are
      independent inputs to the LENS synthesis. Results are keyed by
      market_match and evidence_quality in step_18_result.
    mcp_batch:
      - mcp: market_match
        key: market_match
        input_mapping:
          question: "Will {{ ticker }} outperform the market over the next 12 months?"
          limit: 10
      - mcp: evaluate_evidence
        key: evidence_quality
        input_mapping:
          question: "Is the investment thesis for {{ ticker }} supported by the evidence?"
          artifacts: "{{ step_2_result.news.results | default([]) }}"
    condition: "step_14_result.publication_possible AND step_14_result.final_confidence >= 0.50"
    timeout_seconds: 120
    on_failure:
      action: report
      resume: >
        LENS data fetch failed — the prediction-markets or research MCP server
        may be down. The LENS synthesis (step 20) proceeds with whichever
        results are available; missing channels are noted as gaps. Restart
        the server via sync_kask_mcp_servers and re-invoke.

  # ── Step 20: LENS — five-framework audit (LLM synthesis) ──
  - ordinal: 19
    action: select
    description: >
      LENS five-framework consistency audit: The Loop, Superforecasting,
      Dunning-Kruger, Hidden Champions, Kauffman. Reasons over market_match
      (19) and evaluate_evidence (20) outputs plus all prior pipeline
      outputs. Emits overall_verdict (CONSISTENT / PARTIAL / INCONSISTENT),
      key_tensions, pm_memo (200 words). Never blocks publication.
    renderer: minijinja
    template_ref: company-research/lens-five-frameworks
    condition: "step_14_result.publication_possible AND step_14_result.final_confidence >= 0.50"
    timeout_seconds: 240
    input_mapping:
      ticker: "{{ ticker }}"
      downstream_mode: "{{ step_1_result.downstream_mode }}"
      scout: "{{ step_1_result }}"
      intel: "{{ step_3_result }}"
      forensic: "{{ step_11_result }}"
      cf: "{{ step_9_result }}"
      valuation: "{{ step_13_result }}"
      communication: "{{ step_14_result }}"
      kata: "{{ step_16_result | default({}) }}"
      calibration_gap: "{{ step_17_result.calibration_gap | default(none) }}"
      semantic_tags: "{{ step_4_result | default({}) }}"
      market_outside_view: "{{ step_18_result.market_match | default({}) }}"
      evidence_audit: "{{ step_18_result.evidence_quality | default({}) }}"

  # ── Step 21: Convergence check — LENS verdict consistency ──
  # Deterministic lisp.eval: CONSISTENT=0.0, PARTIAL=0.5, INCONSISTENT=1.0.
  # No unwrap_or(0) on regulation signals — missing verdict surfaces as 1.0
  # (worst case), not silently "converged."
  - ordinal: 20
    action: compute
    compute_ref: lisp.eval
    description: >
      Convergence check — LENS verdict consistency. CONSISTENT=0.0 (fully
      converged), PARTIAL=0.5 (re-enter VALUATION with tensions), 
      INCONSISTENT=1.0 (escalate). Missing verdict surfaces as 1.0 (worst
      case), not silently converged — per .rules no unwrap_or(0) on
      regulation signals.
    timeout_seconds: 10
    input_mapping:
      form: >
        (if (not (listp step_19_result))
            1.0
            (let ((v (assoc "overall_verdict" step_19_result)))
              (cond
                ((eq v "CONSISTENT") 0.0)
                ((eq v "PARTIAL") 0.5)
                ((eq v "INCONSISTENT") 1.0)
                (t 1.0))))
      env:
        step_19_result: "{{ step_19_result | default({}) }}"

  # ── Step 22: Loop back to VALUATION synthesis if LENS flags PARTIAL ──
  # Re-runs valuation (13) with LENS tensions injected. INCONSISTENT (1.0)
  # does not loop — it escalates via on_not_reached. max_iterations: 3
  # bounds the loop.
  - ordinal: 21
    action: loop
    description: >
      Re-enter VALUATION synthesis (step 13) if LENS flags PARTIAL (0.5).
      LENS key_tensions are injected into the next VALUATION pass via the
      loop's input_mapping. INCONSISTENT (1.0) does not loop — it escalates
      via on_not_reached. max_iterations: 3 bounds the loop.
    condition: "step_20_result > 0.0 AND step_20_result < 1.0"
    input_mapping:
      loop_target: "{{ 13 }}"
      lens_tensions: "{{ step_19_result.key_tensions | default([]) }}"
      convergence_signal: "{{ step_20_result }}"

  # ── Step 23: Persist the price target for Brier calibration ──
  # Runs after the convergence loop exits (CONSISTENT or INCONSISTENT) and
  # only when the research was published. Persists the pre-computed PT from
  # the valuation synthesis (step 13) via forecast_persist — stores it without
  # an outcome so forecast_record can close the Brier loop when the horizon
  # passes. Closes the calibration gap identified in follow-up question #1:
  # calibrate_forecast runs its own Fermi model; forecast_record requires the
  # outcome; forecast_persist accepts a pre-computed PT from the flowdef.
  # Conditioned on publication_possible so unpublished research (DROP / HALT /
  # BLOCK) doesn't pollute the forecast store.
  - ordinal: 22
    action: execute
    description: >
      PERSIST — store the valuation price target via forecast_persist MCP
      tool for later Brier scoring. Deterministic. Consumes the valuation
      synthesis PT (step 13) and the communication gate (step 14). The
      stored forecast_id can be passed to forecast_record when the 12-month
      horizon passes to close the calibration loop. Result lands in
      step_22_result.
    mcp: forecast_persist
    condition: "step_14_result.publication_possible AND step_14_result.final_confidence >= 0.50"
    on_failure:
      action: report
      resume: "forecast_persist failed — the price target was not stored for Brier calibration. The research note is still published; calibration will not run for this PT."
    timeout_seconds: 60
    input_mapping:
      symbol: "{{ ticker }}"
      forecast_date: "{{ now | default('') }}"
      horizon: "1yr"
      forecast_price: "{{ step_13_result.pt_12m | default(0) }}"
      current_price: "{{ step_13_result.pt_components.market_price | default(0) }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
