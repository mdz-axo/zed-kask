# Scenario Planning Process Manifest
# ℏKask v0.34.0 — Schwartz scenario planning as convergent PDCA
#
# Co-evolution Phase 1 + Phase 2: three native MCP execute steps close the
# calibration loop and add persistence-grounded learning:
#   - Step 1: scenario_calibration (Phase 2 — read prior calibration curve)
#   - Step 3: market_match (Phase 1 — fetch prediction-market records)
#   - Step 9: scenario_build (Phase 1 — persist generated scenarios)
# The loop: scenarios generated → persist to scenarios MCP → time passes →
#   actual outcomes compared → scenario_score (Brier) →
#     scenario_calibration (step 1) feeds next scenario-builder invocation.

manifest:
  id: scenario-builder
  category: skill
  name: Scenario Builder
  description: >
    Convergent scenario planning process. Refines focal questions, maps forces,
    constructs scenario narratives, runs independent quality gate, extracts
    implications, computes convergence, and iterates until scenario set and
    indicators are decision-ready.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: focal_question
    type: string
    required: false
  - name: planning_horizon
    type: string
    required: false
  - name: domain
    type: string
    required: false
  - name: prior_convergence_metric
    type: number
    required: false
    description: Prior iteration's convergence metric for stall detection
  - name: market_context
    type: array
    required: false
    description: >
      Annotated prediction-market records relevant to the focal question.
      Fetched natively by the market_match execute step (2) from
      hkask-mcp-prediction-markets. Used to pre-weight key forces by
      market-implied likelihood (a Kalshi recession market informs the
      "Economy" STEEP force's uncertainty). This input is retained as a
      cascade-level override — the invoking agent may pre-populate it to
      bypass the market_match step's fetch. When absent, step 2 fetches it
      deterministically.

ledger:
  span_namespace: reg.skill.scenario-builder

steps:
  # ── Persistence-grounded learning (Co-evolution Phase 2, Loop 3) ──
  # Reads prior scenario calibration data from the scenarios MCP before the
  # cascade starts. The calibration curve (Brier score, overconfidence_score,
  # per-bin bias) informs the scenario generation with prior accuracy data —
  # the skill adapts based on accumulated history, not via prompt editing or
  # fine-tuning, but via the persistence layer feeding context into each
  # invocation. On the first invocation with no resolved forecasts, the tool
  # returns overconfidence_score: 0.0 with guidance noting insufficient data.
  - ordinal: 1
    action: execute
    description: >
      Fetch prior calibration curve from the scenarios MCP via
      scenario_calibration (hkask-mcp-scenarios). Returns overall_brier,
      overconfidence_score, and per-bin calibration data from resolved
      forecasts. The calibration data is available to all downstream steps
      as prior_calibration. On the first invocation with no resolved
      forecasts, the tool returns a valid result with guidance noting
      insufficient data — this is not a failure.
    mcp: scenario_calibration
    gas_cap: 2000
    timeout_seconds: 60
    input_mapping:
      subject: "{{ domain | default(null) }}"
    on_failure:
      action: report
      resume: >
        scenario_calibration failed — the scenarios MCP server may be down.
        Restart the server via sync_kask_mcp_servers and re-invoke. Do NOT
        proceed without the calibration data — the skill needs it to adapt
        based on prior accuracy.

  - ordinal: 2
    action: select
    description: Refine and bound focal question.
    renderer: minijinja
    template_ref: scenario-builder/focal-question
    gas_cap: 3000
    timeout_seconds: 120
    input_mapping:
      focal_question: "{{ task | default(focal_question) }}"
      planning_horizon: "{{ planning_horizon | default('5 years') }}"
      domain: "{{ domain | default('general') }}"
      prior_calibration: "{{ step_1_result | default({}) }}"

  # ── Market context fetch (native MCP execute step) ──
  # Fetches prediction-market candidates for the focal question via
  # market_match. The result feeds the key-forces step's market_context input,
  # replacing the former agent-mediated fetch. market_match refuses
  # low-confidence matches — an empty result is a valid signal that no relevant
  # market exists, not an error.
  - ordinal: 3
    action: execute
    description: >
      Fetch prediction-market candidates for the focal question via
      market_match (hkask-mcp-prediction-markets). Deterministic market anchor
      for the key-forces step — market-implied probabilities pre-weight STEEP
      forces by likelihood. Result lands in step_3_result and feeds the
      key-forces step's market_context input.
    mcp: market_match
    gas_cap: 2000
    timeout_seconds: 60
    input_mapping:
      question: "{{ step_2_result.refined_question | default(focal_question) }}"
      limit: 5
    on_failure:
      action: report
      resume: >
        market_match failed — the prediction-markets MCP server may be down
        or the base-events registry may be empty. Restart the server via
        sync_kask_mcp_servers and re-invoke, or proceed without a market
        anchor by passing market_context: [] as a cascade input.

  - ordinal: 4
    action: select
    description: Enumerate key microenvironment forces.
    renderer: minijinja
    template_ref: scenario-builder/key-forces
    gas_cap: 5000
    timeout_seconds: 150
    input_mapping:
      refined_question: "{{ step_2_result.refined_question | default(focal_question) }}"
      planning_horizon: "{{ planning_horizon | default('5 years') }}"
      domain: "{{ domain | default('general') }}"
      market_context: "{{ step_3_result | default([]) }}"

  - ordinal: 5
    action: select
    description: Map macro driving forces and identify critical uncertainties.
    renderer: minijinja
    template_ref: scenario-builder/driving-forces
    gas_cap: 5000
    timeout_seconds: 150
    input_mapping:
      refined_question: "{{ step_2_result.refined_question | default(focal_question) }}"
      key_forces: "{{ step_4_result.key_forces | default([]) }}"

  - ordinal: 6
    action: select
    description: Generate 2x2 axes and scenario narratives.
    renderer: minijinja
    template_ref: scenario-builder/axes-and-narratives
    gas_cap: 8000
    timeout_seconds: 180
    input_mapping:
      refined_question: "{{ step_2_result.refined_question | default(focal_question) }}"
      critical_uncertainties: "{{ step_5_result.critical_uncertainties | default([]) }}"
      planning_horizon: "{{ planning_horizon | default('5 years') }}"

  - ordinal: 7
    action: select
    description: Independent quality gate — evaluates divergence, consistency, and coverage.
    renderer: minijinja
    template_ref: scenario-builder/scenario-quality-gate
    gas_cap: 4000
    timeout_seconds: 150
    input_mapping:
      refined_question: "{{ step_2_result.refined_question | default(focal_question) }}"
      scenarios: "{{ step_6_result.scenarios | default([]) }}"

  - ordinal: 8
    action: select
    description: Extract implications, robust strategies, and indicators.
    renderer: minijinja
    template_ref: scenario-builder/implications-indicators
    gas_cap: 5000
    timeout_seconds: 150
    condition: "step_7_result.gate_pass"
    input_mapping:
      refined_question: "{{ step_2_result.refined_question | default(focal_question) }}"
      scenarios: "{{ step_6_result.scenarios | default([]) }}"

  # ── Scenario persistence (native MCP execute step) ──
  # Persists the generated scenarios to the scenarios MCP via scenario_build
  # for later comparison against actual outcomes. scenario_build creates an
  # event tree scaffold from the scenario narratives — the scenarios are now
  # in the store where scenario_score can later Brier-score them against
  # actual outcomes, and scenario_calibration can read the calibration curve
  # on the next scenario-builder invocation.
  - ordinal: 9
    action: execute
    description: >
      Persist the generated scenarios to the scenarios MCP via scenario_build
      (hkask-mcp-scenarios) for later comparison against actual outcomes.
      Closes the persistence half of the calibration loop — the scenarios are
      now in the forecast store where scenario_score can later Brier-score
      them.
    mcp: scenario_build
    gas_cap: 5000
    timeout_seconds: 120
    input_mapping:
      subject: "{{ step_2_result.refined_question | default(focal_question) }}"
      time_horizon: "{{ planning_horizon | default('5 years') }}"
      scenario_type: "emerging_economic"
      context: "{{ step_8_result | default(step_6_result) | tojson }}"
      max_events: 10
    on_failure:
      action: report
      resume: >
        scenario_build failed to persist the scenarios — the scenarios MCP
        server may be down. Restart the server via sync_kask_mcp_servers and
        re-invoke. The scenarios are still valid (in step_8_result) but will
        not be available for future Brier scoring until persisted.

  - ordinal: 10
    action: compute
    compute_ref: lisp.eval
    description: >
      COMPUTE SCENARIO GAP: Deterministic Lisp computation that turns
      the quality-gate output into a scalar convergence signal.
      Lower = more converged (higher minimum quality dimension).
      The score is `(1 - min(divergence, consistency, coverage)) +
      parametric_penalty` where parametric_penalty is 0.15 when
      parametric_variation_flag is true (the gate's own warning that the
      scenarios are dial-level variants, not distinct worlds). A passing
      gate with no parametric variation scores near 0.0; a failing gate
      approaches 1.0. No `default(1.0)` fallback: missing fields surface
      as nil and are guarded explicitly.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((div (assoc "divergence_score" step_7_result))
              (con (assoc "consistency_score" step_7_result))
              (cov (assoc "coverage_score" step_7_result))
              (pflag (assoc "parametric_variation_flag" step_7_result)))
          (let ((d (if (numberp div) div 0.0))
                (c (if (numberp con) con 0.0))
                (v (if (numberp cov) cov 0.0))
                (pen (if pflag 0.15 0.0)))
            (let ((mn (if (< d c) (if (< d v) d v) (if (< c v) c v))))
              (let ((gap (- 1.0 mn)))
                (if (> (+ gap pen) 1.0) 1.0 (+ gap pen))))))
      env:
        step_7_result: "{{ step_7_result }}"

  - ordinal: 11
    action: loop
    description: >
      Re-enter scenario cycle if convergence is not met. Restarts at narrative
      generation (step 6) so the refined focal question (step 2), calibration
      data (step 1), market context (step 3), key forces (step 4), and
      driving-forces/axes (step 5) are preserved across iterations. The
      quality gate diagnoses narrative divergence, consistency, and coverage
      — all fixed by regenerating scenarios, not by re-rolling the
      already-bounded focal question. The market_match (3) and
      scenario_build (9) execute steps do NOT re-run on loop re-entry (the
      loop target is step 6, past step 3; step 9 is past the loop target).
    input_mapping:
      loop_target: "{{ 6 }}"
      prior_convergence_metric: "{{ step_10_result }}"
      # Push the scenario gap from the lisp.eval step (ordinal 10) into
      # convergence_signal. No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_10_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
