# Scenario Planning Process Manifest
# ℏKask v0.34.0 — Schwartz scenario planning as convergent PDCA

manifest:
  id: scenario-builder
  category: skill
  name: Scenario Builder
  description: >
    Convergent scenario planning process. Refines focal questions, maps forces,
    constructs scenario narratives, runs independent quality gate, extracts
    implications, computes convergence, and iterates until scenario set and
    indicators are decision-ready.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: focal_question
    type: string
    required: true
  - name: planning_horizon
    type: string
    required: false
  - name: domain
    type: string
    required: false
  - name: prior_convergence_metric
    type: number
    required: false
    description: Prior iteration's convergence metric for stall detection
  - name: market_context
    type: array
    required: false
    description: >
      Annotated prediction-market records relevant to the focal question,
      fetched by the invoking agent from hkask-mcp-prediction-markets
      (`market_match`) before cascade invocation. Used to pre-weight key
      forces by market-implied likelihood (a Kalshi recession market
      informs the "Economy" STEEP force's uncertainty). Absent = forces
      ranked on qualitative judgment only.

ledger:
  span_namespace: reg.skill.scenario-builder

steps:
  - ordinal: 1
    action: select
    description: Refine and bound focal question.
    renderer: minijinja
    template_ref: scenario-builder/focal-question
    gas_cap: 3000
    timeout_seconds: 30
    input_mapping:
      focal_question: "{{ focal_question }}"
      planning_horizon: "{{ planning_horizon | default('5 years') }}"
      domain: "{{ domain | default('general') }}"

  - ordinal: 2
    action: select
    description: Enumerate key microenvironment forces.
    renderer: minijinja
    template_ref: scenario-builder/key-forces
    gas_cap: 5000
    timeout_seconds: 60
    input_mapping:
      refined_question: "{{ step_1_result.refined_question | default(focal_question) }}"
      planning_horizon: "{{ planning_horizon | default('5 years') }}"
      domain: "{{ domain | default('general') }}"
      market_context: "{{ market_context | default([]) }}"

  - ordinal: 3
    action: select
    description: Map macro driving forces and identify critical uncertainties.
    renderer: minijinja
    template_ref: scenario-builder/driving-forces
    gas_cap: 5000
    timeout_seconds: 60
    input_mapping:
      refined_question: "{{ step_1_result.refined_question | default(focal_question) }}"
      key_forces: "{{ step_2_result.key_forces | default([]) }}"

  - ordinal: 4
    action: select
    description: Generate 2x2 axes and scenario narratives.
    renderer: minijinja
    template_ref: scenario-builder/axes-and-narratives
    gas_cap: 8000
    timeout_seconds: 120
    input_mapping:
      refined_question: "{{ step_1_result.refined_question | default(focal_question) }}"
      critical_uncertainties: "{{ step_3_result.critical_uncertainties | default([]) }}"
      planning_horizon: "{{ planning_horizon | default('5 years') }}"

  - ordinal: 5
    action: select
    description: Independent quality gate — evaluates divergence, consistency, and coverage.
    renderer: minijinja
    template_ref: scenario-builder/scenario-quality-gate
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      refined_question: "{{ step_1_result.refined_question | default(focal_question) }}"
      scenarios: "{{ step_4_result.scenarios | default([]) }}"

  - ordinal: 6
    action: select
    description: Extract implications, robust strategies, and indicators.
    renderer: minijinja
    template_ref: scenario-builder/implications-indicators
    gas_cap: 5000
    timeout_seconds: 60
    condition: "step_5_result.gate_pass"
    input_mapping:
      refined_question: "{{ step_1_result.refined_question | default(focal_question) }}"
      scenarios: "{{ step_4_result.scenarios | default([]) }}"

  - ordinal: 7
    action: compute
    compute_ref: lisp.eval
    description: >
      COMPUTE SCENARIO GAP: Deterministic Lisp computation that turns
      the quality-gate output into a scalar convergence signal.
      Lower = more converged (higher minimum quality dimension).
      The score is `(1 - min(divergence, consistency, coverage)) +
      parametric_penalty` where parametric_penalty is 0.15 when
      parametric_variation_flag is true (the gate's own warning that the
      scenarios are dial-level variants, not distinct worlds). A passing
      gate with no parametric variation scores near 0.0; a failing gate
      approaches 1.0. No `default(1.0)` fallback: missing fields surface
      as nil and are guarded explicitly.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((div (assoc "divergence_score" step_5_result))
              (con (assoc "consistency_score" step_5_result))
              (cov (assoc "coverage_score" step_5_result))
              (pflag (assoc "parametric_variation_flag" step_5_result)))
          (let ((d (if (numberp div) div 0.0))
                (c (if (numberp con) con 0.0))
                (v (if (numberp cov) cov 0.0))
                (pen (if pflag 0.15 0.0)))
            (let ((mn (if (< d c) (if (< d v) d v) (if (< c v) c v))))
              (let ((gap (- 1.0 mn)))
                (if (> (+ gap pen) 1.0) 1.0 (+ gap pen))))))
      env:
        step_5_result: "{{ step_5_result }}"

  - ordinal: 8
    action: loop
    description: >
      Re-enter scenario cycle if convergence is not met. Restarts at narrative
      generation (step 4) so the refined focal question (step 1), key forces
      (step 2), and driving-forces/axes (step 3) are preserved across
      iterations. The quality gate diagnoses narrative divergence,
      consistency, and coverage — all fixed by regenerating scenarios, not by
      re-rolling the already-bounded focal question.
    input_mapping:
      loop_target: "{{ 4 }}"
      prior_convergence_metric: "{{ step_7_result }}"
      # Push the scenario gap from the lisp.eval step (ordinal 7) into
      # convergence_signal. No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_7_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
