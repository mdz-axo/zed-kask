manifest:
  id: qa-regulation-algedonic-loop
  category: qa-script
  name: QA Regulation Algedonic Loop
  version: 0.31.0
  visibility: Private
  description: 'Verifies Regulation feedback loop integrity through the hkask-regulation test suite (94
    tests). Ensures algedonic signals, variety counters, gas estimation, and governed inference all function
    correctly. Classifier triages failures.

    '
gas:
  cap: 20000
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: cargo test -p hkask-regulation 2>&1 | tail -20
  branching:
    success: 2
    failure: 4
- ordinal: 2
  action: classify
  classifier: qa-triage
  description: "Test suite: hkask-regulation (94 tests). Verify Regulation feedback loop: algedonic signal\
    \ emission, variety counter tracking and deficit detection, gas estimation, energy budget enforcement,\
    \ homeostatic sensor\u2192model\u2192comparator\u2192actuator loop, calibrated energy estimator accuracy,\
    \ and governed inference budget tracking. The Regulation is the VSM S3 regulator \u2014 failures here\
    \ mean the system cannot self-regulate."
  branching:
    high_confidence: 3
    medium_confidence: 3
    low_confidence: 5
    flake: 2
    unparseable: 5
    classifier_unavailable: 5
- ordinal: 3
  action: run_command
  command: "echo '[QA:regulation] PASS \u2014 Regulation feedback loop verified (94 tests)'"
  terminal: true
- ordinal: 4
  action: run_command
  command: "echo '[QA:regulation] FAIL \u2014 Regulation test suite failed. Feedback loop may be broken:\
    \ algedonic signals, variety counters, or gas enforcement.'"
  terminal: true
- ordinal: 5
  action: run_command
  command: "echo '[QA:regulation] WARN \u2014 classifier uncertain on Regulation test output. Manual review\
    \ recommended.'"
  terminal: true
ledger:
  emit_spans: true
  alert: qa.reg.algedonic
  span_namespace: reg.skill.qa-regulation-algedonic-loop
