# LoRA Training Process Manifest
# ℏKask v0.31.0 — Evidence-grounded PEFT recommendation and contract audit
#
# v0.31.0 refinement (self-improvement cycle 1, proposed-not-committed):
#   1. Process manifest created — the skill was previously template-by-template
#      with a conceptual PDCA loop but no mechanical loop closure. This manifest
#      wires select-method → audit-config → report → convergence-check → loop
#      with prior_iteration routing (convergence_metric, blockers, gate_results_summary).
#   2. Deeper capability reasoning: select-method now accepts provider_capabilities
#      and cost_model inputs so G6 (harness capability) can reason over the full
#      capability space (3 harnesses × 6 trainers × 3 hosts × cost models) rather
#      than just harness-method compatibility.
#   3. prior_training_history input: select-method accepts optional prior runs
#      on the same base model (OOM patterns, convergence issues, prior findings)
#      so G2 (memory) and G3 (rank) can refine using operator-specific history
#      (Good Regulator compliance — model the system you regulate).
#   4. Algedonic escalation: audit-config emits refuse_escalation for `refuse`
#      findings so the operator sees safety-boundary violations before the full
#      report/convergence pipeline completes (VSM S1→S5 short-circuit).
#   5. Convergence metric honesty: not_evaluated (coverage gap) now maps to
#      risk 0.5 instead of 1.0, distinguishing "we don't know if this applies"
#      from "we know this applies and it's unmet" (deferred = 1.0).
#   6. Graded critical/high dimension: replaces binary (1 if any, 0 if none)
#      with graded contribution (0→0.6→0.8→1.0) so the metric distinguishes
#      "one thing to fix" from "everything is on fire."
#   7. All-gates-not-applicable edge case handled.
#   8. Evidence-citation enforcement: audit-config rejects findings with
#      config_value/code_presence/code_absence evidence_kind but null
#      config_path/line (no-fiction enforcement, mechanical not voluntary).

manifest:
  id: lora-training
  category: skill
  name: LoRA Training
  description: >
    Evidence-grounded PEFT training configuration skill. Recommends a composable
    LoRA/QLoRA configuration via 8-gate refinement (adapter purpose, dataset
    analysis, inference constraint, memory, task distance, quality/cost,
    knowledge preservation, harness capability), audits the operator-selected
    configuration against 17 phase-aware contract gates, reports findings
    losslessly with regression proposals, and computes phase-aware convergence.
    v0.31.0: evolved from template-by-template invocation into a coordinated
    flow with mechanical PDCA loop closure, deeper capability reasoning over
    the full harness×trainer×host×cost space, prior-training-history consumption
    (Good Regulator), algedonic escalation for safety-boundary violations,
    and honest convergence metrics that distinguish coverage gaps from risks.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  # 0.10 — stricter than bug-hunt (0.25) because training configuration is
  # higher-stakes than exploratory bug hunting. A converged training config
  # has: no critical/high findings, no fail/refuse gates, all applicable
  # math/quant/data/forgetting gates pass or are deferred with a plan.
  # v0.31.0: convergence_field reads the composite convergence_metric which
  # now uses graded critical/high and distinguishes not_evaluated from deferred.
  threshold: 0.10
  improvement_gate: threshold_only
  max_iterations: 3
  min_iterations: 1
  convergence_field: step_4_result.convergence_metric
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: training_config_path
    type: string
    required: true
    description: Path to the declared training config file (YAML for axolotl/ludwig, Python for trl).
  - name: dataset_path
    type: string
    required: false
    description: >
      Path to the actual dataset file for profiling via G-D0. When provided,
      the runtime's training_validate_config MCP tool profiles the dataset
      (format, sample count, content length, token estimates, role distribution,
      multi-turn detection, vision data detection, preference pair balance).
      The profile feeds into G3 (rank refinement), G6 (harness selection),
      and adapter_purpose inference. If absent, G-D0 falls back to
      dataset_format_hint.
  - name: model_size_b
    type: number
    required: true
    description: Base model parameter count in billions.
  - name: memory_budget_gb
    type: number
    required: true
    description: Available VRAM in GB.
  - name: inference_constraint
    type: string
    required: false
    default: "either-ok"
    description: "must-merge | dynamic-switching | either-ok"
  - name: task_distance
    type: string
    required: false
    default: "moderate"
    description: "light | moderate | heavy"
  - name: quality_vs_cost
    type: string
    required: false
    default: "default"
    description: "cost-sensitive | quality-critical | default"
  - name: knowledge_preservation_required
    type: boolean
    required: false
    default: false
  - name: userpod_host
    type: string
    required: true
    description: P12 — mandatory authenticated host identity for every action.
  - name: harness_preference
    type: string
    required: false
    default: "undetermined"
    description: "axolotl | trl | ludwig | undetermined"
  - name: trainer_preference
    type: string
    required: false
    default: "undetermined"
    description: "sft | dpo | kto | orpo | reward | grpo | undetermined"
  - name: adapter_purpose
    type: string
    required: false
    default: "undetermined"
    description: "instruction | reasoning | vision | preference | reward_model | undetermined"
  - name: dataset_format_hint
    type: string
    required: false
    default: "undetermined"
    description: "chatml | preference_dpo | preference_kto | preference_orpo | raw_text | undetermined"
  - name: provider_capabilities
    type: object
    required: false
    description: >
      v0.31.0: Capability matrix for available training hosts and inference
      providers. Enables G6 to reason over the full capability space rather
      than just harness-method compatibility. Includes: available_hosts
      (runpod, deepinfra, nebius), host_gpu_types, host_cost_models
      (gpu_hourly_rate, setup_minutes, teardown_grace), and inference_provider
      capabilities (lora_composition support, cost models). When absent, G6
      falls back to harness-method compatibility only.
  - name: prior_training_history
    type: object
    required: false
    description: >
      v0.31.0: Prior training runs on the same base model or operator setup.
      Enables Good Regulator compliance — the skill models the specific system
      it regulates, not just the generic PEFT contract space. Includes:
      prior_oom_patterns (memory pressure evidence), prior_convergence_issues
      (training instability), prior_findings (recurrent contract violations),
      prior_rank_choices (what worked, what didn't). When absent, the skill
      treats each invocation as a first pass with no operator-specific history.
  - name: prior_iteration
    type: object
    required: false
    description: >
      v0.31.0: Output of the previous PDCA iteration on the same config.
      Closes the feedback loop: select-method consumes
      prior_iteration.convergence_metric and prior_iteration.blockers to
      refine its recommendation. When absent, this is the first iteration.

steps:
  - ordinal: 1
    action: select
    description: >
      Recommend a composable PEFT configuration via 8-gate refinement.
      v0.31.0: G6 now reasons over the full capability space (3 harnesses ×
      6 trainers × 3 hosts × cost models) when provider_capabilities is
      supplied. G2 and G3 refine using prior_training_history when supplied
      (Good Regulator). Consumes prior_iteration when present (loop closure).
    renderer: minijinja
    template_ref: lora-training/select-method
    gas_cap: 6144
    timeout_seconds: 90
    input_mapping:
      training_config_path: "{{ training_config_path }}"
      dataset_path: "{{ dataset_path | default('undetermined') }}"
      model_size_b: "{{ model_size_b }}"
      memory_budget_gb: "{{ memory_budget_gb }}"
      inference_constraint: "{{ inference_constraint | default('either-ok') }}"
      task_distance: "{{ task_distance | default('moderate') }}"
      quality_vs_cost: "{{ quality_vs_cost | default('default') }}"
      knowledge_preservation_required: "{{ knowledge_preservation_required | default(false) }}"
      userpod_host: "{{ userpod_host }}"
      harness_preference: "{{ harness_preference | default('undetermined') }}"
      trainer_preference: "{{ trainer_preference | default('undetermined') }}"
      adapter_purpose: "{{ adapter_purpose | default('undetermined') }}"
      dataset_format_hint: "{{ dataset_format_hint | default('undetermined') }}"
      provider_capabilities: "{{ provider_capabilities | default({}) }}"
      prior_training_history: "{{ prior_training_history | default({}) }}"
      prior_iteration: "{{ prior_iteration | default({}) }}"

  - ordinal: 2
    action: select
    description: >
      Audit the operator-selected method against 17 phase-aware contract gates.
      v0.31.0: Emits refuse_escalation for `refuse` findings (algedonic
      short-circuit). Rejects findings with config_value/code_presence/
      code_absence evidence_kind but null config_path/line (no-fiction
      enforcement, mechanical not voluntary).
    renderer: minijinja
    template_ref: lora-training/audit-config
    gas_cap: 8192
    timeout_seconds: 120
    input_mapping:
      config_paths: "{{ [training_config_path] }}"
      selected_method: "{{ step_1_result.recommendation | default({}) }}"
      existing_regressions: "{{ existing_regressions | default([]) }}"
      userpod_host: "{{ userpod_host }}"
      dataset_profile: "{{ step_1_result.dataset_profile | default({}) }}"

  - ordinal: 3
    action: select
    description: >
      Report phase-aware training findings without changing their schema or
      classification. Preserve the operator-selected method, separate
      recommendations from readiness, propose evidence-backed regressions.
    renderer: minijinja
    template_ref: lora-training/report
    gas_cap: 6144
    timeout_seconds: 90
    input_mapping:
      findings: "{{ step_2_result.findings | default([]) }}"
      gate_results: "{{ step_2_result.gate_results | default({}) }}"
      existing_regressions: "{{ existing_regressions | default([]) }}"
      userpod_host: "{{ userpod_host }}"

  - ordinal: 4
    action: select
    description: >
      Compute phase-aware convergence metric. v0.31.0: not_evaluated now
      maps to risk 0.5 (coverage gap) instead of 1.0 (known risk), graded
      critical/high dimension replaces binary, all-gates-not-applicable
      edge case handled.
    renderer: minijinja
    template_ref: lora-training/convergence-check
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      unresolved_findings: "{{ step_3_result.findings | default(step_2_result.findings | default([])) }}"
      gate_results: "{{ step_2_result.gate_results | default({}) }}"
      current_phase: "{{ current_phase | default('preflight') }}"
      qlora_mode: "{{ step_1_result.recommendation.base_mode | default('') == 'quantized_4bit' }}"
      corda_mode: "{{ step_1_result.recommendation.preservation | default('') == 'corda_kp' }}"
      existing_regressions: "{{ existing_regressions | default([]) }}"
      proposed_regressions: "{{ step_3_result.proposed_regressions | default([]) }}"
      previous_metric: "{{ prior_iteration.convergence_metric | default(none) }}"
      userpod_host: "{{ userpod_host }}"
    fusion: false

  - ordinal: 5
    action: loop
    description: >
      Re-enter PDCA cycle if convergence is not met. v0.31.0: routes
      convergence_metric, blockers, and gate_results_summary back to
      select-method as prior_iteration, closing the feedback loop
      mechanically rather than relying on operator-managed re-invocation.
    input_mapping:
      loop_target: 1
      prior_iteration:
        convergence_metric: "{{ step_4_result.convergence_metric | default(1.0) }}"
        blockers: "{{ step_4_result.blockers | default([]) }}"
        gate_results_summary: "{{ step_4_result.gate_results_summary | default({}) }}"
        converged: "{{ step_4_result.converged | default(false) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: lora-training/select-method
      gas_budget: 6144
    - resource: template
      action: render
      template_id: lora-training/audit-config
      gas_budget: 8192
    - resource: template
      action: render
      template_id: lora-training/report
      gas_budget: 6144
    - resource: template
      action: render
      template_id: lora-training/convergence-check
      gas_budget: 4096
    - resource: manifest
      action: execute
      template_id: lora-training
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true
