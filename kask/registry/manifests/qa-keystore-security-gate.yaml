manifest:
  id: qa-keystore-security-gate
  category: qa-script
  name: QA Keystore Security Gate
  version: 0.31.0
  visibility: Private
  description: "Verifies hkask-keystore security posture: build integrity and test coverage (16 tests:\
    \ encrypt/decrypt roundtrip, key derivation, OS keychain). TQ-8 resolved. Keystore is the OCAP key\
    \ derivation substrate \u2014 regressions here compromise P4.\n"
gas:
  cap: 15000
  alert_threshold: 0.8
  hard_limit: true
rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: cargo build -p hkask-keystore 2>&1 | tail -5
  description: "Build hkask-keystore \u2014 verify compilation"
  retries: 0
  branching:
    success: 2
    failure: 5
- ordinal: 2
  action: run_command
  command: cargo test -p hkask-keystore 2>&1 | tail -15
  description: "Run hkask-keystore tests \u2014 16 tests: encrypt/decrypt roundtrip, key derivation, tamper\
    \ detection, keychain ops"
  retries: 0
  branching:
    success: 3
    failure: 6
- ordinal: 3
  action: classify
  classifier: qa-triage
  description: 'Security audit: hkask-keystore test coverage (PROHIBITION-level, P4 OCAP enforcement substrate).
    Current state: 16 tests pass covering AES-256-GCM encrypt/decrypt roundtrip, HKDF-SHA256 key derivation
    determinism and salt-dependence, ciphertext tampering detection, truncated ciphertext rejection, wrong-key
    rejection, empty plaintext handling, binary data roundtrip, version file integrity, and keychain operations.
    Classify as high-confidence normal if all 16 pass. Flag any failure as critical.'
  retries: 0
  branching:
    high_confidence: 4
    medium_confidence: 4
    low_confidence: 7
    flake: 3
    unparseable: 7
    classifier_unavailable: 7
- ordinal: 4
  action: run_command
  command: "echo '[QA:keystore] PASS \u2014 keystore builds, 16/16 crypto tests pass. TQ-8 resolved.'"
  description: Keystore build and test run successful
  retries: 0
  terminal: true
- ordinal: 5
  action: run_command
  command: "echo '[QA:keystore] FAIL \u2014 keystore crate does not compile. Immediate fix required \u2014\
    \ OCAP key derivation broken.'"
  description: "Keystore compilation failure \u2014 P4 OCAP substrate broken"
  retries: 0
  terminal: true
- ordinal: 6
  action: run_command
  command: "echo '[QA:keystore] FAIL \u2014 keystore test run failed (non-zero exit). Crypto invariants\
    \ may be broken.'"
  description: "Keystore test execution failure \u2014 crypto invariants compromised"
  retries: 0
  terminal: true
- ordinal: 7
  action: run_command
  command: "echo '[QA:keystore] WARN \u2014 classifier low confidence on keystore test status. Manual\
    \ security review required.'"
  description: "Classifier cannot determine keystore test coverage \u2014 manual review needed for security-critical\
    \ crate"
  retries: 0
  terminal: true
ledger:
  emit_spans: true
  alert: qa.keystore.security
  span_namespace: reg.skill.qa-keystore-security-gate
