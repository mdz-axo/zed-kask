# Skill Logic Audit Process Manifest
# hKask v0.35.0 — Bounded dual-layer logic audit of .j2 templates as PDCA
#
# Unfolded from skill-maintenance (originally folded 2026-07-25, unfolded
# 2026-08-14). The two skills share no steps, no data flow, and no convergence
# logic — folding them caused systematic off-by-one step_N_result references
# because the ordinals weren't re-numbered when the cascades were merged.

manifest:
  id: skill-logic-audit
  category: skill
  name: Skill Logic Audit
  description: >
    Bounded dual-layer logic audit of .j2 templates and manifest.yaml files
    against their stated goals. Loads the annotated goal block, generates
    adversarial critique, filters for soundness, composes a revised artifact
    with unified diff, presents to the user for accept/reject/counter-proposal,
    and iterates until the proposal confidence stabilizes.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: target_path
    type: string
    required: true
    description: "Path to the .j2 or manifest.yaml file to audit."
  - name: target_content
    type: string
    required: true
    description: "Raw content of the target file."
  - name: template_type
    type: string
    required: true
    description: "File type: j2 or manifest."

steps:
  - ordinal: 1
    action: select
    description: >
      LOGIC LOAD-GOAL: Parse the annotated goal: block from the target .j2
      or manifest.yaml file. Strip comment markers, preserve exact goal text.
    renderer: minijinja
    template_ref: skill-logic-audit/logic-load-goal
    timeout_seconds: 120
    input_mapping:
      target_path: "{{ target_path }}"
      target_content: "{{ target_content }}"
      template_type: "{{ template_type }}"

  - ordinal: 2
    action: select
    description: >
      LOGIC CRITIQUE: Adversarial critique of the template body against its
      stated goal. For each flaw, provide location, claim, anchor to goal,
      severity, and suggested fix.
    renderer: minijinja
    template_ref: skill-logic-audit/logic-critique-template
    timeout_seconds: 150
    input_mapping:
      target_path: "{{ target_path }}"
      target_content: "{{ target_content }}"
      template_type: "{{ template_type }}"
      goal: "{{ step_1_result.goal }}"

  - ordinal: 3
    action: select
    description: >
      LOGIC SOUNDNESS FILTER: Review the critique for soundness — separate
      valid, goal-anchored concerns from spurious ones.
    renderer: minijinja
    template_ref: skill-logic-audit/logic-critique-critique
    timeout_seconds: 150
    input_mapping:
      goal: "{{ step_1_result.goal }}"
      prior_critique: "{{ step_2_result }}"

  - ordinal: 4
    action: select
    description: >
      LOGIC COMPOSE: Compose a concrete revised artifact and unified diff
      from the calibrated concerns.
    renderer: minijinja
    template_ref: skill-logic-audit/logic-compose-proposal
    timeout_seconds: 150
    input_mapping:
      target_path: "{{ target_path }}"
      original_content: "{{ target_content }}"
      goal: "{{ step_1_result.goal }}"
      calibrated_verdict: "{{ step_3_result.calibrated_verdict }}"
      valid_concerns: "{{ step_3_result.valid_concerns }}"

  - ordinal: 5
    action: select
    description: >
      LOGIC USER-CHOICE: Present the proposal to the user and capture
      accept/reject/counter-proposal.
    renderer: minijinja
    template_ref: skill-logic-audit/logic-user-choice
    timeout_seconds: 120
    input_mapping:
      target_path: "{{ target_path }}"
      goal: "{{ step_1_result.goal }}"
      proposal: "{{ step_4_result.revised_content }}"
      diff: "{{ step_4_result.diff }}"
      rationale: "{{ step_4_result.rationale }}"
      confidence: "{{ step_4_result.confidence }}"

  - ordinal: 6
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence score from the compose-proposal step's actual
      output. The logic-compose-proposal template produces `confidence` (0–1,
      higher = more confident in the revision). The score is 1 - confidence so
      lower = more converged.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((c (assoc "confidence" step_4_result)))
          (if (is_null c) 1.0 (- 1.0 c)))
      env:
        step_4_result: "{{ step_4_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 7
    action: loop
    description: Re-enter logic audit cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_6_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.skill-logic-audit
  telemetry_namespace: hkask.template.skill-logic-audit
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
