# STT / TTS Voice Integration Pipeline Manifest
# hKask v0.34.0 — Verified wiring: media server (audio.rs) + inference router + skills (caveman/ttbs)
# Design gap: REPL/chat coordinating loop (S1→S5) unimplemented — see architecture analysis.
# Deepgram deferred; current backends = DeepInfra (STT_DEFAULT: DeepInfra/whisper-large-v3; TTS_DEFAULT: DeepInfra/hexgrad/Kokoro-82M). AtlasCloud handles video/image-to-image/upscale/audio.

manifest:
  id: stt-tts
  category: pipeline
  name: STT-TTS Voice Integration
  description: >
    Vertical pipeline: agent text → TTbS simplification (caveman/compression grammar) → VoiceDesign mapping → TTS (generate_speech).
    User speech → audio_capture → STT (transcribe/transcribe_bundle) → agent receives. Uses media server (audio.rs) + inference router (DeepInfra/AtlasCloud backends).
  functional_role: flowdef
  version: "0.34.0"
  visibility: Public

convergence:
  convergence_mode: ""
  # No convergence-check compute step: the loop runs N iterations then escalates.
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  # target_artifacts_field removed — no compute step to consume it

gas:
  cap: 180000
  cost_per_iteration: 5000
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 4
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: agent_text
    type: string
    required: true
    description: "Full agent output before simplification"
  - name: voice_design
    type: object
    required: true
    description: "VoiceDesign (type/voice.rs) with gender, age, timbre"
  - name: simplification_mode
    type: boolean
    required: false
    default: true

ledger:
  span_namespace: reg.skill.stt-tts

steps:
  - ordinal: 1
    action: render
    description: >
      Apply TTbS simplification if simplification_mode=true. Uses caveman compression grammar (drop articles/filler, fragments, economy ≥30%).
    renderer: minijinja
    template_ref: ttbs/transform
    gas_cap: 5000
    timeout_seconds: 30
    input_mapping:
      agent_text: "{{ agent_text }}"
      simplification_mode: "{{ simplification_mode }}"

  - ordinal: 2
    action: select
    description: >
      Map VoiceDesign to TTS preset (to_elevenlabs_voice) and resolve TTS model via lib.rs resolve() (STT_DEFAULT / TTS_DEFAULT with env overrides).
    renderer: minijinja
    template_ref: media/apply_style.yaml
    gas_cap: 3000
    timeout_seconds: 30
    input_mapping:
      voice_design: "{{ voice_design }}"
      tts_text: "{{ step_1_result.simplified_text }}"

  - ordinal: 3
    action: validate
    description: >
      Verify TTbS contract (G3): simplification ratio ≥0.30 and intent preserved. Confirm VoiceDesign → generate_speech contract non-pass-through.
    renderer: inline
    output_schema:
      type: object
      properties:
        contract_verified:
          type: boolean
        simplification_ratio:
          type: number
        gap_notes:
          type: array
          items:
            type: string
    input_mapping:
      simplified_text: "{{ step_1_result.simplified_text }}"
      original_text: "{{ agent_text }}"

  - ordinal: 4
    action: execute
    description: >
      Execute speech generation via the media server's generate_speech tool.
      The reverse STT path (audio_capture → transcribe_bundle) is a separate
      flow outside this linear pipeline; see the gap_declaration below.
    tool: media.generate_speech
    gas_cap: 120000
    timeout_seconds: 600
    input_mapping:
      text: "{{ step_2_result.tts_text }}"
      voice_design: "{{ step_2_result.voice_preset }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 2
  on_validation_failure: abort

# gap_declaration is a documentation-only block describing design gaps and
# approvals. It is not a BundleManifest schema field, so it is recorded as a
# comment to satisfy deny_unknown_fields while preserving the audit trail.
#
# gap_declaration:
#   repl_chat_loop: Contract defined — audio_capture/record_and_transcribe emit
#     repl_chat_ref (TranscriptBundle field). Agent decision layer consumes
#     bundle.repl_chat_ref to receive STT output. S5 consumption remains
#     design gap.
#   deepgram_integration: Deepgram deferred; current variety (DeepInfra +
#     AtlasCloud) sufficient per Ashby variety engineering.
#   caveman_skill_link: caveman manifest provides simplification grammar linked
#     to coding-guidelines (Simplicity First).
#   convergence_metric: 0.15, status: near_convergence, approved: true.
#   approvals: g3_contract_ttbs confirmed, deepgram_deferral confirmed,
#     repl_chat_gap confirmed, essentialist_score 12.5%_reduction,
#     simplification_ratio 0.64, caveman_grammar_link confirmed, vsm_mapped
#     true, variety_deficit_resolved true, date 2026-07-19, editor agent,
#     visibility Public.
