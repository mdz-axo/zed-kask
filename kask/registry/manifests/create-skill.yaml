# Create Skill Process Manifest
# ℏKask v0.33.7 — kask-native skill creation with ontological grounding
# Decomposed into: Research → Describe → Scaffold → Validate → Convergence
#
# Overrides the built-in Zed create-skill, which only produces SKILL.md
# files. The kask-native version produces the full registry-first
# structure with ontological grounding: a research phase finds
# academic/industry anchors for the skill's domain, the PDCA shape
# emerges from those anchors (not from a generic template), and the
# artifacts are annotated with ontology references.
#
# Core principle: each skill is idiosyncratic. The PDCA shape emerges
# from the domain's ontological anchors. Do not generalize the shape
# across skills.
#
# Delegates to skill-maintenance-build for scaffolding and
# skill-maintenance-validate for validation.
#
# Feedback loop: research accepts prior_validation_failures
# (next_research_focus, fix_suggestions) and consumes them to amplify the
# next research phase. Convergence check emits next_research_focus when
# not converged.

manifest:
  id: create-skill
  category: skill
  name: Create Skill
  description: >
    Convergent kask-native skill creation process with ontological
    grounding. Searches the academic and industry literature for the
    skill's domain to find ontological anchors (process ontologies,
    quality criteria, entity types, existing ontologies); derives the
    PDCA shape from those anchors (not from a generic template — each
    skill is idiosyncratic); captures the specification (name, purpose,
    delegates, ontology annotations); scaffolds the full registry crate
    (template manifest + .j2 templates + process manifest + SKILL.md
    companion) by delegating to skill-maintenance-build; validates the
    scaffolded crate against R1-R12, Z1-Z8, X1-X4, E1-E11 by delegating
    to skill-maintenance-validate; and iterates until validation passes
    or escalation is required. Overrides the built-in Zed create-skill,
    which only produces SKILL.md files — insufficient for kask, where
    the SKILL.md is a discovery-only catalog entry and the implementation
    lives in the registry.
  functional_role: flowdef
  version: "0.33.7"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 150000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: user_description
    type: string
    required: true
    description: >
      Natural-language description of the skill to create. Should include
      the skill's purpose, target domain, and any structural preferences.
  - name: prior_validation_failures
    type: object
    required: false
    description: >
      Output of a previous create-skill iteration's validation. Closes
      the feedback loop: the research phase consumes
      prior_validation_failures.next_research_focus and
      prior_validation_failures.fix_suggestions to direct the next
      iteration. When absent, the creation runs as a first pass.

ledger:
  span_namespace: reg.skill.create-skill

steps:
  - ordinal: 1
    action: select
    description: >
      Search the academic and industry literature for the skill's domain
      to find ontological anchors — the processes, quality criteria,
      entity types, and existing ontologies that define how the domain
      works. Record each anchor with citation and how it shapes the
      skill. Select the ontology reference set (PKO, Dublin Core, GOLEM,
      MovieLabs OMC, ESO, or domain-specific). Derive the PDCA shape
      from the anchors — the shape emerges from the domain's process
      structure, not from a generic template. The research phase is
      first because the anchors determine everything else. Consumes
      prior_validation_failures when present (feedback loop closure).
    renderer: minijinja
    template_ref: create-skill/create-skill-research
    gas_cap: 6144
    timeout_seconds: 120
    input_mapping:
      user_description: "{{ user_description }}"
      prior_validation_failures: "{{ prior_validation_failures | default({}) }}"

  - ordinal: 2
    action: select
    description: >
      Capture the skill's specification, informed by the research phase's
      ontological anchors. Choose a name. Confirm the PDCA phases — these
      are the phases that emerged from the research, not a generic
      template. Each phase is grounded in an ontological anchor.
      Identify delegates, span namespace, and ontology annotations.
    renderer: minijinja
    template_ref: create-skill/create-skill-describe
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      user_description: "{{ user_description }}"
      research: "{{ step_1_result }}"

  - ordinal: 3
    action: select
    description: >
      Generate the full registry crate structure with ontology-annotated
      artifacts. Delegates to skill-maintenance-build for the mechanical
      scaffolding. Produces: (1) template manifest with ontology-annotated
      template entries; (2) .j2 templates with contracts whose types come
      from the ontology; (3) process manifest with the idiosyncratic PDCA
      shape (not a generic template), gas/rjoule/convergence blocks, capability
      capabilities; (4) SKILL.md companion with ontology references.
    renderer: minijinja
    template_ref: create-skill/create-skill-scaffold
    gas_cap: 8192
    timeout_seconds: 120
    input_mapping:
      skill_spec: "{{ step_2_result }}"

  - ordinal: 4
    action: select
    description: >
      Validate the scaffolded crate against all check categories.
      Delegates to skill-maintenance-validate. Checks R1-R12 (registry),
      Z1-Z8 (companion), X1-X4 (cross-artifact), E1-E11 (executor
      compliance). Produces fix suggestions for any failures.
    renderer: minijinja
    template_ref: create-skill/create-skill-validate
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      scaffolded_crate: "{{ step_3_result }}"

  # ── Deterministic compute: lisp.eval is available for custom logic ──
  #
  # In addition to the built-in compute_refs (lisp.eval for signal computation,
  # kata.object_gap, kata.process_gap, kata.hypotenuse, etc.), skill
  # authors can use `compute_ref: lisp.eval` to write custom deterministic
  # logic inline in the manifest — no Rust change needed. The sandboxed
  # Lisp interpreter supports arithmetic, conditionals, list ops, and
  # lambda. Supports infix: `a + b` = `(+ a b)`. Example:
  #
  #   - ordinal: N
  #     action: compute
  #     compute_ref: lisp.eval
  #     input_mapping:
  #       form: "(+ (* score_a 0.6) (* score_b 0.4))"
  #       env:
  #         score_a: "{{ step_1_result.score | default(0.5) }}"
  #         score_b: "{{ step_2_result.score | default(0.5) }}"
  #       max_steps: 10000
  #       max_depth: 32
  #
  # Use cases: custom convergence formulas, weighted scoring, data
  # transformation between steps, filtering findings by threshold.
  # Security: gated to category: skill manifests only (human-reviewed).

  - ordinal: 5
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 4's actual validation
      output. The convergence signal is fail_count — the number of registry,
      companion, cross-artifact, and executor-compliance checks that failed.
      Lower = more converged (zero failures = scaffolded crate is valid).
      If fail_count is absent, the form errors (no silent default),
      surfacing a broken validation step rather than masking it.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: "(assoc \"fail_count\" step_4_result)"
      env:
        step_4_result: "{{ step_4_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 6
    action: loop
    description: >
      Re-enter create-skill cycle if convergence is not met. Routes
      step_6_result.next_research_focus back to step 1 (research, not
      describe) as prior_validation_failures.next_research_focus, along
      with the validation's fix_suggestions, closing the feedback loop.
      The loop targets research because failures often indicate the
      ontological anchors were insufficient — the research phase needs to
      re-run to find better anchors or derive a better PDCA shape.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_5_result }}"
      prior_validation_failures:
        next_research_focus: "{{ step_6_result.next_research_focus | default('') }}"
        fix_suggestions: "{{ step_4_result.fix_suggestions | default([]) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
