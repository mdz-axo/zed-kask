# Kanban Board Builder Skill
# hKask v0.34.0 — Materialize kanban boards from decomposition plans
#
# The "Act" in the kanban PDCA lifecycle:
#   kanban-task-decomposition (Plan) → kanban-board-builder (Do) →
#   kanban-task-management (Check/Act)
#
# Ontological anchor: PKO (Procedural Knowledge Ontology, Carriero et al. 2025).
# The specification/execution separation maps directly:
#   - Decomposition produces pko:Procedure + pko:Step specifications (the plan)
#   - This skill produces pko:ProcedureExecution + pko:StepExecution (the actuals)
#   - Verification is pko:StepVerification
#
# PDCA shape (emergent from PKO):
#   1. PLAN    — Map decomposed tasks to MCP tool calls (resolve budgets, criteria)
#   2. DO      — Execute: kanban_board_create + kanban_task_create (+ optional spawn)
#   3. CHECK   — Verify: kanban_board_list + kanban_task_list against plan
#   4. ACT     — Render: emit ```kanban block for KanbanWidget

manifest:
  id: kanban-board-builder
  category: skill
  name: Kanban Board Builder
  description: >
    Materialize a kanban board from a decomposition plan or direct task
    specification. Creates the board via kanban_board_create, creates tasks
    via kanban_task_create with criteria and gas budgets, optionally spawns
    subagents via kanban_task_spawn, and emits a kanban block for widget
    rendering. Bridges kanban-task-decomposition (Plan) and
    kanban-task-management (Check) to the actual MCP tools (Do).
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 5
  min_iterations: 1
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 20000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: decomposed_tasks
    type: array
    description: >
      Tasks from kanban-task-decomposition output or a direct task
      specification. Each task should have: title, description, criteria,
      estimated_hours or story_points, priority, dependencies, labels.
    required: true
  - name: project_name
    type: string
    description: "Board name. Defaults to 'Untitled Project' if omitted."
    required: false
  - name: swarm_id
    type: string
    description: >
      Swarm ID to link spawned tasks to. When provided, kanban_task_spawn
      calls include this as the swarm_id parameter, linking the task to
      the swarm for coordination visibility.
    required: false
  - name: spawn_config
    type: object
    description: >
      Optional delegation configuration. When provided, identifies which
      tasks should be spawned to subagents and with what configuration
      (delegation_level, delegated_skills, memory_scope, gas_budget).
    required: false
  - name: custom_columns
    type: array
    description: >
      Optional custom column definitions. Each entry: {name, status, wip_limit}.
      When omitted, the standard 5-column layout is used (Backlog, Ready,
      In Progress, Review, Done).
    required: false

steps:
  - ordinal: 1
    action: select
    description: >
      PLAN — Map decomposed tasks to concrete MCP tool calls. Resolve gas
      budgets from effort estimates, criteria from acceptance criteria,
      and initial column from task status. Identify tasks needing
      subagent delegation.
    renderer: minijinja
    template_ref: kanban-board-builder/plan-creation
    gas_cap: 3000
    timeout_seconds: 30
    input_mapping:
      decomposed_tasks: "{{ decomposed_tasks }}"
      project_name: "{{ project_name | default('Untitled Project') }}"
      swarm_id: "{{ swarm_id | default('') }}"
      spawn_config: "{{ spawn_config | default({}) }}"
      custom_columns: "{{ custom_columns | default([]) }}"

  - ordinal: 2
    action: select
    description: >
      DO — Execute the materialization. Call kanban_board_create to create
      the board, then kanban_task_create for each planned task. Record
      returned board_id and task_ids. Optionally call kanban_task_spawn
      for tasks requiring subagent delegation. Then call kanban_board_list
      and kanban_task_list to verify and collect the data for rendering.
    renderer: minijinja
    template_ref: kanban-board-builder/execute-creation
    gas_cap: 8000
    timeout_seconds: 120
    input_mapping:
      board_name: "{{ step_1_result.board_name | default('Untitled Project') }}"
      columns: "{{ step_1_result.columns | default(None) }}"
      task_creation_plan: "{{ step_1_result.task_creation_plan | default([]) }}"
      spawn_plan: "{{ step_1_result.spawn_plan | default([]) }}"

  - ordinal: 3
    action: select
    description: >
      CHECK + ACT — Verify the board state matches the plan. Call
      kanban_task_list to confirm all tasks are created with correct
      statuses and criteria. Emit the combined result as a kanban fenced
      block for KanbanWidget rendering. The provenance field makes move
      chips clickable in the widget.
    renderer: minijinja
    template_ref: kanban-board-builder/verify-and-render
    gas_cap: 3000
    timeout_seconds: 60
    input_mapping:
      board_id: "{{ step_2_result.board_id | default('') }}"
      board_name: "{{ step_1_result.board_name | default('Untitled Project') }}"
      task_ids: "{{ step_2_result.task_ids | default([]) }}"
      task_creation_plan: "{{ step_1_result.task_creation_plan | default([]) }}"
      spawn_results: "{{ step_2_result.spawn_results | default([]) }}"

  - ordinal: 4
    action: loop
    description: >
      Convergence check. The board is fully materialized when step_3_result.verified
      is true and task_count matches the plan. If not converged, re-enter at
      step 1 with the verification issues as refinement directives.
    compute_ref: kata.convergence_check
    input_mapping:
      current_artifacts: "{{ step_3_result }}"
      prior_artifacts: "{{ step_3_result | default({}) }}"

ledger:
  emit_spans: true
  span_namespace: reg.skill.kanban-board-builder
  variety_monitoring: true
  algedonic_threshold: 3

audit:
  enabled: true
  include_input: true
  include_output: true
  include_gas_cost: true