# Runtime Posture Monitor Process Manifest
# ℏKask v0.35.0 — Runtime security posture observation
# Observes Regulation telemetry (reg.* canonical spans, reg.outcome events).

manifest:
  id: runtime-posture-monitor
  category: skill
  name: Runtime Posture Monitor
  description: >
    Runtime security posture monitoring. Observes Regulation telemetry for endpoint
    abuse, bot traffic, LLM usage anomalies, and dependency behavior.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: workspace_context
    type: string
    required: false
  - name: target_signal
    type: string
    required: false
  - name: existing_regressions
    type: array
    required: false
  - name: userpod_host
    type: string
    required: false
  - name: telemetry_window_seconds
    type: integer
    required: false
    description: >
      Lookback window for reg_query (seconds). Default 3600 (1 hour).

ledger:
  span_namespace: reg.skill.runtime-posture-monitor

steps:
  - ordinal: 1
    action: execute
    description: >
      Fetch real runtime telemetry from the Regulation archive via reg_query.
      A DB outage surfaces as a recorded ok:false tool call — not as silently
      empty telemetry (absence is not a verdict).
    mcp: reg_query
    input_mapping:
      namespace: "reg."
      window_seconds: "{{ telemetry_window_seconds | default(3600) }}"
      limit: 200
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        reg_query failed — the curator's RegulationArchive is unavailable
        (curator.db locked, passphrase unresolved, or server down). Do NOT
        classify threats from assumed telemetry. Fix the curator store and
        re-run.
  - ordinal: 2
    action: select
    description: >
      Select signal sources from the recorded reg_query telemetry (step 1).
      The reg_query return shape is {namespace, window_seconds,
      replayed_count, filtered_count, events: [{timestamp, namespace, path,
      phase, weight, observation}]}. filtered_count is the real signal
      volume (replay_weighted applies the SQL limit BEFORE the namespace
      filter, so replayed_count may exceed filtered_count).
    renderer: minijinja
    template_ref: runtime-posture-monitor/select-signal
    timeout_seconds: 120
    input_mapping:
      target_signal: "{{ target_signal | default('all') }}"
      telemetry_events: "{{ step_1_result.events | default([]) }}"
      filtered_count: "{{ step_1_result.filtered_count | default(0) }}"
      replayed_count: "{{ step_1_result.replayed_count | default(0) }}"
      existing_regressions: "{{ existing_regressions | default([]) }}"
      userpod_host: "{{ userpod_host }}"
  - ordinal: 3
    action: select
    description: >
      Classify runtime threats from the selected telemetry (endpoint abuse,
      bot traffic, LLM anomalies). Consumes step_2_result.signal_sources and
      step_1_result.events — not pre-supplied signal arrays.
    renderer: minijinja
    template_ref: runtime-posture-monitor/classify-threat
    timeout_seconds: 120
    input_mapping:
      signal_sources: "{{ step_2_result.signal_sources | default([]) }}"
      telemetry_events: "{{ step_1_result.events | default([]) }}"
      existing_regressions: "{{ existing_regressions | default([]) }}"
      userpod_host: "{{ userpod_host }}"
  - ordinal: 4
    action: select
    description: >
      Emit regulation events for detected threats and produce the posture report.
    renderer: minijinja
    template_ref: runtime-posture-monitor/emit-regulation
    timeout_seconds: 120
    input_mapping:
      threats: "{{ step_3_result.threats_found | default([]) }}"
      defense_layers_firing: "{{ step_3_result.defense_layers_firing | default([]) }}"
      defense_layers_silent: "{{ step_3_result.defense_layers_silent | default([]) }}"
      existing_regressions: "{{ existing_regressions | default([]) }}"
      userpod_host: "{{ userpod_host }}"
  - ordinal: 5
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the threat count from the report
      step. Lower signal variance across iterations = convergence (Cauchy).
      Using lisp.eval instead of a Jinja expression makes the computation
      explicitly deterministic, budgeted (timeout_seconds: 10), and observable via
      a reg.skill.runtime-posture-monitor span. Guards against a missing
      threats field by returning 0 when absent.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((threats (assoc "threats" step_4_result)))
          (if (is_null threats) 0 (length threats)))
      env:
        step_4_result: "{{ step_4_result | default({}) }}"

  - ordinal: 6
    action: loop
    description: >
      Re-enter posture monitoring cycle if convergence is not met. Routes
      back to step 1 (observe) to re-scan for threats.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 5). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_5_result }}"

