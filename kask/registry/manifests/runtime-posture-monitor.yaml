# Runtime Posture Monitor Process Manifest
# ℏKask v0.34.0 — Runtime security posture observation
# Observes Regulation telemetry (reg.* canonical spans, reg.outcome events).

manifest:
  id: runtime-posture-monitor
  category: skill
  name: Runtime Posture Monitor
  description: >
    Runtime security posture monitoring. Observes Regulation telemetry for endpoint
    abuse, bot traffic, LLM usage anomalies, and dependency behavior.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: telemetry_stream
    type: array
    required: false
  - name: workspace_context
    type: string
    required: false
  - name: target_signal
    type: string
    required: false
  - name: discovered_signals
    type: array
    required: false
  - name: existing_regressions
    type: array
    required: false
  - name: userpod_host
    type: string
    required: true
  - name: threats
    type: array
    required: false
  - name: defense_layers_firing
    type: array
    required: false
  - name: defense_layers_silent
    type: array
    required: false
  - name: signal_sources
    type: array
    required: false
  - name: signal
    type: object
    required: false
  - name: convergence_metric
    type: number
    required: false

ledger:
  span_namespace: reg.skill.runtime-posture-monitor

steps:
  - ordinal: 1
    action: select
    description: >
      Select signal sources and discover runtime telemetry for threat detection.
    renderer: minijinja
    template_ref: runtime-posture-monitor/select-signal
    gas_cap: 2048
    timeout_seconds: 60
  - ordinal: 2
    action: select
    description: >
      Classify runtime threats from telemetry (endpoint abuse, bot traffic, LLM anomalies).
    renderer: minijinja
    template_ref: runtime-posture-monitor/classify-threat
    gas_cap: 2048
    timeout_seconds: 60
    input_mapping:
      signal_sources: "{{ step_1_result.signal_sources | default(signal_sources) | default([]) }}"
      signal: "{{ step_1_result.signal | default(signal) | default({}) }}"
  - ordinal: 3
    action: select
    description: >
      Emit regulation events for detected threats and produce the posture report.
    renderer: minijinja
    template_ref: runtime-posture-monitor/emit-regulation
    gas_cap: 2048
    timeout_seconds: 60
  - ordinal: 4
    action: loop
    description: >
      Re-enter posture monitoring cycle if convergence is not met. Routes
      back to step 1 (observe) to re-scan for threats.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_3_result.threats | default([]) | length }}"

