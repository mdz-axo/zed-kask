# Metacognition Process Manifest
# ℏKask v0.35.0 — Self-reflective reasoning as Improvement Kata PDCA
#
# Generalizable: any userpod — curator, bot, agent, or ensemble member — can
# invoke this skill to perform metacognitive reasoning. The skill follows the
# Toyota Improvement Kata: grasp the current condition, establish a target
# condition, make a prediction, run an experiment (apply a calibration), then
# measure the gap and score the prediction. Convergence is detected
# deterministically via the hypotenuse of object-space (Dublin Core) and
# process-space (PKO) gaps, plus Brier-scored prediction calibration.
#
# This replaces the old self-grade model where an LLM graded its own plan
# quality. The Kata model uses the LLM only for the four Kata steps (grasp,
# target, predict, experiment); the executor computes the gap and Brier score
# deterministically. See the convergence design doc for the mathematical
# grounding (limit of a sequence, Cauchy criterion, Brier scoring).

manifest:
  id: metacognition
  category: skill
  name: Metacognition
  description: >
    Master self-reflection skill following the Toyota Improvement Kata.
    Grasps the current metacognitive condition (meta-knowledge, confidence,
    obstacles), establishes a target condition, makes a prediction about
    which calibration will close the gap, runs the experiment (applies a
    Falstaffian perspective rotation, ellipsis analysis, or strategy
    adjustment), then measures the gap and scores the prediction via Brier.
    Convergence is detected deterministically: gap closure (limit of a
    sequence), iterate stabilization (Cauchy criterion), or prediction
    calibration (Brier score). Any userpod may invoke this skill.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  # ── Kata convergence model ──
  # Three canonical stop conditions (any fires → converged):
  # 1. Gap: hypotenuse < epsilon (target condition reached)
  # 2. Cauchy: iterates stopped moving (learning exhausted)
  # 3. Calibration: Brier score calibrated (predictions accurate)
  convergence_mode: "gap_or_cauchy_or_calibration"
  gap_epsilon: 0.05
  cauchy_epsilon: 0.03
  cauchy_window: 3
  brier_window: 3
  brier_threshold: 0.15
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  # Kata target-condition fields (context keys produced by the steps)
  target_artifacts_field: "target_artifacts"
  current_artifacts_field: "current_artifacts"
  target_procedure_field: "target_procedure"
  current_procedure_field: "current_procedure"
  prediction_field: "prediction"
  result_field: "experiment_result"


rjoule:
  cap: 4
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: goal
    type: string
    required: false
    description: >
      The high-level goal the userpod wants to decompose and assess.
  - name: session_history
    type: string
    required: false
    description: >
      Textual history of the current session — what the userpod has done
      so far, what tools it has called, what results it has seen.
  - name: prior_outcomes
    type: array
    required: false
    description: >
      Array of prior action outcomes for effort calibration. Each item
      should have: action_id, success (bool), duration_ms, error (optional).
  - name: available_tools
    type: array
    required: false
    description: >
      Array of available MCP tools for tool selection. Each item should
      have: name, server, description.
  - name: current_state
    type: object
    required: false
    description: >
      Externally provided current state (e.g., Regulation health snapshot, bot
      status, variety counters). If provided, the grasp-current step uses
      this as ground truth instead of relying solely on session history.
  - name: context_text
    type: string
    required: false
    description: >
      Text of the context to analyze for ellipses (what is missing). When
      provided, the experiment step applies Bloom's five-step method to
      detect gaps, classify them as ellipsis (deliberate) or leak
      (unintentional), and surface what is not inferno.
  - name: perspectives
    type: array
    required: false
    default: ["falstaffian", "ellipsis"]
    description: >
      Perspectives to apply during the experiment step. Each perspective is
      a lens: "falstaffian" (semantic rotation), "ellipsis" (gap detection).
  - name: safety_mode
    type: boolean
    required: false
    default: false
    description: >
      When true, the grasp-current template enforces strict sandbox
      constraints: no file system access, no network calls, no environment
      variable access.
  - name: deterministic_verdict
    type: object
    required: false
    description: >
      Optional deterministic task-success verdict from `swarm_evaluate_local`
      (Slice B5 — deterministic verdict → metacognition Brier). When present
      with `provenance: "deterministic"`, step 8 uses the verdict's `pass`
      (or `score`) as the Brier outcome instead of the LLM-judged
      `actual_delta` (the hypotenuse). This grounds the Brier score in a
      deterministic oracle, not the LLM's self-assessment. When absent or
      `provenance != "deterministic"`, step 8 falls back to the hypotenuse
      (the pre-B5 behavior). Shape: `{ pass: bool, score: Option<f64>,
      detail: Option<String>, provenance: "deterministic"|"llm_judged"|"unknown" }`.

ledger:
  span_namespace: reg.skill.metacognition

steps:
  # ── Phase 3 co-evolution: read prior calibration before Kata cycle ──
  # The calibration loop (2.1): read prior Brier scores from the scenarios
  # MCP forecast store before the Kata cycle starts. The overconfidence_bias
  # from the calibration curve feeds the grasp-current step so the agent
  # knows its historical calibration. on_failure: report surfaces a broken
  # calibration channel to the Curator without blocking the Kata cycle.
  - ordinal: 0
    action: execute
    description: >
      Read prior calibration from the scenarios MCP forecast store via
      scenario_calibration. Deterministic. Returns the calibration curve
      (Brier score history, overconfidence_bias) from all resolved forecasts.
      The overconfidence_bias feeds the grasp-current step (step 1) so the
      agent knows its historical calibration and can adjust its predictions.
    mcp: scenario_calibration
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        scenario_calibration failed — prior Brier scores are not available.
        The Kata cycle proceeds without calibration context; predictions
        will not be informed by historical overconfidence_bias.
    input_mapping:
      subject: "{{ goal | default('metacognition') }}"

  # ── Improvement Kata Step 1: Grasp the Current Condition ──
  # Measure the agent's actual metacognitive state right now. This is the
  # "go and see" step — measure, don't assume. Produces:
  # - current_artifacts: the cognitive artifacts the agent has produced
  #   (decomposition, assessment, obstacle list) and their completeness
  # - current_procedure: which Kata steps have been executed
  # - obstacles: what's preventing progress toward the goal
  # - assumptions_surfaced: assumptions flagged as assumptions (not facts)
  # - claims_grounded: claims backed by evidence from session history
  - ordinal: 1
    action: select
    description: >
      GRASP CURRENT CONDITION: Measure the agent's actual metacognitive
      state. Identify obstacles, surface assumptions, count grounded claims,
      enumerate options. This is the "go and see" step — measure, don't
      assume. Produces the current_artifacts and current_procedure that the
      gap computation measures against the target.
    renderer: minijinja
    template_ref: metacognition/meta-grasp-current
    # thinking_budget = "full" + max_tokens 3000 on a cloud thinking-mode model
    # (GLM-5.2 via OpenRouter) routinely exceeds 60s. 120s matches the default
    # (DEFAULT_STEP_TIMEOUT_SECONDS) and aligns with task-breakdown (90s) and
    # capabilities-reasoner (90-300s) for comparable inference load.
    timeout_seconds: 120
    input_mapping:
      goal: "{{ task | default(goal) }}"
      session_history: "{{ session_history | default('') }}"
      current_state: "{{ current_state | default({}) }}"
      prior_outcomes: "{{ prior_outcomes | default([]) }}"
      safety_mode: "{{ safety_mode | default(false) }}"
      prev_grasp: "{{ prev_step_1_result | default({}) }}"
      prior_calibration: "{{ step_0_result | default({}) }}"

  # ── Improvement Kata Step 2: Establish the Target Condition ──
  # Declare the target metacognitive state — what "sufficient meta-knowledge"
  # looks like for this goal. This is a measurable, specific state, not a
  # vague "understand the problem." Produces:
  # - target_artifacts: the complete artifact spec (what fields should exist)
  # - target_procedure: the complete procedure spec (what steps must be done)
  - ordinal: 2
    action: select
    condition: "NOT target_artifacts AND NOT target_procedure"
    description: >
      ESTABLISH TARGET CONDITION: Declare the target metacognitive state —
      what "sufficient meta-knowledge and calibrated confidence" looks like
      for this goal. Produces the target_artifacts and target_procedure that
      the gap computation measures toward. Only runs on the first cycle
      (condition: target_artifacts not provided as input). On subsequent
      cycles, the target persists.
    renderer: minijinja
    template_ref: metacognition/meta-establish-target
    # thinking_budget = "medium"; 120s aligns with DEFAULT_STEP_TIMEOUT_SECONDS.
    # The 90s override was too tight for cold-cache cloud LLM calls.
    timeout_seconds: 120
    input_mapping:
      goal: "{{ goal }}"
      current_condition: "{{ step_1_result }}"

  # ── Improvement Kata Step 3: Make a Prediction ──
  # Predict what will happen if we apply a specific calibration. The
  # prediction carries a confidence (how sure is the agent that this
  # calibration will close the gap by the predicted amount). This is the
  # hypothesis the experiment tests.
  - ordinal: 3
    action: select
    description: >
      MAKE PREDICTION: Predict which calibration will close the gap and by
      how much. State the hypothesis: "If I apply Falstaffian shape X /
      ellipsis analysis / strategy adjustment Y, the hypotenuse will decrease
      by Z." Carry a confidence in [0,1] — how sure is the agent that this
      prediction is correct? This is the hypothesis the experiment tests;
      the Brier score tracks whether the agent's confidence is calibrated.
    renderer: minijinja
    template_ref: metacognition/meta-predict
    # thinking_budget = "off" (set in the template, not "medium" as the
    # prior comment claimed). 120s aligns with DEFAULT_STEP_TIMEOUT_SECONDS
    # — the 90s override was too tight for cold-cache cloud LLM calls
    # carrying full goal + current/target condition + prior prediction JSON.
    # The on_timeout: retry with max_retries: 1 gives two attempts, but both
    # can exceed 90s on a cold provider node.
    timeout_seconds: 120
    input_mapping:
      goal: "{{ goal }}"
      current_condition: "{{ step_1_result }}"
      target_condition: "{{ target_artifacts | default(step_2_result) }}"
      prev_prediction: "{{ prev_step_3_result | default({}) }}"

  # ── Improvement Kata Step 4: Experiment (Do) ──
  # Apply the predicted calibration. This is the "Do" in PDCA — the actual
  # intervention whose effect we measure. The experiment applies a
  # Falstaffian perspective rotation, an ellipsis analysis, or a strategy
  # adjustment, based on the prediction. Produces the new current condition
  # (re-measured after the experiment).
  - ordinal: 4
    action: select
    description: >
      EXPERIMENT (DO): Apply the predicted calibration — the Falstaffian
      perspective rotation, ellipsis analysis, or strategy adjustment
      identified in the prediction step. This is the actual intervention
      whose effect we measure. After applying the calibration, re-measure
      the current condition (the experiment changed the system). Produces
      the new current_artifacts and current_procedure.
    renderer: minijinja
    template_ref: metacognition/meta-experiment
    # thinking_budget = "full" + max_tokens 3000 — heaviest inference step.
    # 150s matches capabilities-reasoner's heavy step (300s would be safer
    # but the Kata cycle runs this 4-step loop up to 10 times; 150s balances
    # per-step margin against total cascade wall time.
    timeout_seconds: 150
    input_mapping:
      goal: "{{ goal }}"
      current_condition: "{{ step_1_result }}"
      prediction: "{{ step_3_result }}"
      perspectives: "{{ perspectives | default(['falstaffian', 'ellipsis']) }}"
      context_text: "{{ context_text | default('') }}"
      prev_experiment: "{{ prev_step_4_result | default({}) }}"

  # ── Improvement Kata Step 5: Measure Object-Space Gap (Check) ──
  # Compute the Dublin Core object-space gap: how far are the current
  # artifacts from the target spec? This is a deterministic compute step —
  # no inference, no timeout. Counts missing fields and ungrounded fields.
  - ordinal: 5
    action: compute
    compute_ref: kata.object_gap
    description: >
      MEASURE OBJECT GAP (CHECK): Compute the Dublin Core object-space gap
      between the current artifacts (produced by the experiment) and the
      target artifact spec. Deterministic — no inference, no timeout.
    input_mapping:
      current_artifacts: "{{ step_4_result.current_artifacts | default(step_4_result) }}"
      target_artifacts: "{{ target_artifacts | default(step_2_result.target_artifacts | default(step_2_result)) }}"

  # ── Improvement Kata Step 6: Measure Process-Space Gap (Check) ──
  # Compute the PKO process-space gap: how far is the procedure from
  # complete? Deterministic — counts incomplete steps.
  - ordinal: 6
    action: compute
    compute_ref: kata.process_gap
    description: >
      MEASURE PROCESS GAP (CHECK): Compute the PKO process-space gap
      between the current procedure state and the target procedure.
      Deterministic — no inference, no timeout.
    input_mapping:
      current_procedure: "{{ step_4_result.current_procedure | default(step_4_result) }}"
      target_procedure: "{{ target_procedure | default(step_2_result.target_procedure | default(step_2_result)) }}"

  # ── Improvement Kata Step 7: Compute Hypotenuse (Check) ──
  # The total distance to the target: sqrt(object_gap² + process_gap²).
  - ordinal: 7
    action: compute
    compute_ref: kata.hypotenuse
    description: >
      COMPUTE HYPOTENUSE: The total distance to the target in the combined
      object-process space: sqrt(object_gap² + process_gap²). This is the
      gap the Kata is trying to close.
    input_mapping:
      object_gap: "{{ step_5_result.object_gap }}"
      process_gap: "{{ step_6_result.process_gap }}"

  # ── Improvement Kata Step 8: Score the Prediction (Check) ──
  # Brier score: did the prediction match the result? The prediction said
  # "the hypotenuse will decrease by Z with confidence C." The result is
  # the actual decrease. The Brier score tracks calibration.
  - ordinal: 8
    action: compute
    compute_ref: kata.prediction_vs_result
    description: >
      SCORE PREDICTION (CHECK): Brier score for this cycle's prediction.
      The prediction said the hypotenuse would decrease by a predicted
      amount with a stated confidence. The result is the actual decrease.
      The Brier score tracks whether the agent's confidence is calibrated.
    input_mapping:
      prediction: "{{ step_3_result }}"
      result:
        # B5: when a deterministic verdict is present with provenance
        # "deterministic", use its pass as the Brier outcome (a deterministic
        # oracle, not the LLM's self-assessment). The compute step tries
        # `occurred` (bool) first, then `actual_delta` (f64). When
        # `deterministic_verdict` is absent, `deterministic_verdict.pass`
        # renders to null (via | tojson), `as_bool()` returns None, and the
        # compute step falls back to `actual_delta` (the hypotenuse — the
        # pre-B5 behavior).
        occurred: "{{ deterministic_verdict.pass }}"
        actual_delta: "{{ step_7_result.hypotenuse }}"

  # ── Improvement Kata Step 9: Check Convergence (Act) ──
  # The full convergence decision: gap < epsilon? Cauchy (iterates
  # stabilized)? Brier calibrated? Deterministic — no LLM, no timeout.
  - ordinal: 9
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the hypotenuse value from the
      kata.hypotenuse compute step (step 7). Lower signal variance across
      iterations = convergence (Cauchy). Using lisp.eval instead of a Jinja
      expression makes the computation explicitly deterministic, budgeted
      (gas_cap: 100), and observable via a reg.skill.metacognition span.
      Guards against a missing hypotenuse field by returning 0 when absent.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((h (assoc "hypotenuse" step_7_result)))
          (if (is_null h) 0 h))
      env:
        step_7_result: "{{ step_7_result | default({}) }}"

  - ordinal: 10
    action: loop
    description: >
      Re-enter Kata cycle if not converged. The executor automatically
      snapshots prev_step_N_result values so the next iteration's
      templates can reference the prior iteration's artifacts and refine
      them (Self-Refine pattern) rather than regenerating from scratch.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 9). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_9_result }}"

error_handling:
  on_gas_exceeded: abort
  # on_timeout: retry is now enforced — StepMachine::dispatch_with_retry
  # retries a TemplateError::Timeout up to max_retries times with
  # retry_backoff_seconds between attempts. A thinking-mode model that
  # streams long reasoning chains may time out on a cold cache and succeed
  # on retry once the cache warms.
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
