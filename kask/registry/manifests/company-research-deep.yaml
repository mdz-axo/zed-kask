# Company Research — Deep Pipeline Process Manifest
# ℏKask v0.35.0 — EFRA-AI research pipeline (agents 10–13) as convergent flowdef
#
# Design: kask/docs/plans/efra-ai-to-kask-company-research-skill.md
#
# Sequential pipeline mirroring EFRA-AI's research pipeline:
#   COMPANY(1-3) → FALSTAFFIAN(3b) → GORILLA(5-7) → IMAGINE(8-10) → THESIS(11) →
#   goal-analysis gate(13) → convergence(14) → loop(15)
#
# Each agent feeds the next, building a comprehensive investment thesis.
# COMPANY is a DEEPEN agent — it consumes company_transcript, dcf_valuation,
# comparable_analysis, web_search, fetch MCP tool outputs (native execute
# steps) and does LLM synthesis over them. FALSTAFFIAN (3b) rotates the
# competitive framing before GORILLA scores it — structural defense against
# frame capture by analyst narratives. IMAGINE consumes scenario_build and
# the economic_trajectory probe (6b) which anchors imagination on falling
# costs, constraint removal, and the Kauffman adjacent possible. THESIS's
# investment_grade / needs_work / incomplete verdict is the
# convergence signal; needs_work loops back to COMPANY with THESIS gaps
# injected. Per .rules (LLM-improves-against-LLM-scored-target trap): the
# THESIS quality gate uses goal-analysis semantic evaluation (cross-skill
# select step), not self-assessment inside the thesis template.
#
# v0.35.0 changes: Added FALSTAFFIAN competitive rotation (step 3b) and
# ECONOMIC TRAJECTORY probe (step 6b). GORILLA now consumes the rotated
# board. IMAGINE now consumes the economic trajectory and the Falstaffian
# rotations — scenarios are anchored on the trajectory and challenged by
# the rotations. Anchored to MAIA Substack methodology: "Focus and
# Imagination", "Falstaff: Give Me Life", "Competition: Readings vs
# Reality", "Stuart A. Kauffman Readings", "More From Less", "The Future
# Is Faster Than You Think", "Bottlenecks and Critical Mass".

manifest:
  id: company-research-deep
  category: skill
  name: Company Research — Deep Pipeline
  description: >
    Equity research deep pipeline converted from EFRA-AI (Replicant-
    Partners). Sequential flowdef: COMPANY deep 8-part analysis (6 native
    MCP tool calls + LLM synthesis) → FALSTAFFIAN competitive perspective
    rotation (cross-skill metacognition, anchored to MAIA "Falstaff: Give
    Me Life" + "Competition: Readings vs Reality") → WARDLEY compressed
    value-chain map (v0.36.0, cross-skill adapter compressing wardley-mapper's
    6-step cascade into one LLM call over the rotated board) → GORILLA 4-
    dimension framework (fixed weights, lisp.eval scoring, consumes rotated
    board + Wardley map) → ECONOMIC TRAJECTORY probe (falling costs, Coasean
    shifts, Kauffman adjacent possible, anchored to MAIA "Focus and
    Imagination" + "More From Less" + "Kauffman Readings", consumes Wardley
    commoditization candidates) → IMAGINE 5/10/20Y scenarios anchored on the
    economic trajectory and challenged by the Falstaffian rotations + digital
    stage (scenario_build MCP tool call + LLM synthesis) → THESIS three-pillar
    synthesis (cross-skill goal-analysis quality gate) → convergence check →
    loop on needs_work. MCP tool calls are native `action: execute` steps;
    templates do LLM synthesis over their outputs. Converges on THESIS
    investment_grade verdict.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.05
  cauchy_window: 2
  max_iterations: 3
  min_iterations: 1
  on_not_reached: escalate
  target_artifacts_field: "thesis_verdict"


rjoule:
  cap: 12
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: ticker
    type: string
    required: true
    description: Equity ticker symbol.
  - name: analyst_id
    type: string
    required: false
    description: >
      Analyst identifier for forecast-ledger attribution. Persisted with
      IMAGINE's 3–5 falsifiable predictions (tagged by 5/10/20Y horizon) for
      later Brier scoring — the IMAGINE kata loop. The invoking agent should
      resolve `git config user.name` and pass it for proper attribution;
      templates default to "zed-kask-operator" when absent.
  - name: flash_pipeline_output
    type: object
    required: false
    description: >
      Optional output of the flash pipeline (company-research-flash) for the
      same ticker. When present, the deep pipeline reuses SCOUT, INTEL,
      FORENSIC, CRITICAL FACTOR, VALUATION outputs rather than re-fetching.
      When absent, the deep pipeline runs standalone (COMPANY fetches its
      own context).
  - name: prior_outcomes
    type: object
    required: false
    description: >
      Prior forecast-ledger outcomes for this ticker + analyst. Feeds the
      IMAGINE kata loop (falsifiable predictions scored against realized
      outcomes).
  - name: prior_rotated_board
    type: object
    required: false
    description: >
      Advisory: the rotated board from the previous PDCA iteration's
      FALSTAFFIAN step (4). Carried forward by the loop (15) so the next
      FALSTAFFIAN pass can detect whether the COMPANY revision addressed the
      framing gaps or re-encoded the same analyst framing. Absent on first
      iteration.
  - name: prior_economic_trajectory
    type: object
    required: false
    description: >
      Advisory: the economic trajectory from the previous PDCA iteration's
      ECONOMIC TRAJECTORY step (10). Carried forward by the loop (16) so the
      next trajectory pass can detect whether the COMPANY revision addressed
      the trajectory gaps or re-encoded the same cost assumptions. Absent on
      first iteration.
  - name: prior_wardley_map
    type: object
    required: false
    description: >
      Advisory: the Wardley map from the previous PDCA iteration's WARDLEY
      step (5). Carried forward by the loop (16) so the next WARDLEY pass
      can detect whether the COMPANY revision addressed the value-chain
      gaps or re-encoded the same evolution classifications. Absent on
      first iteration.

ledger:
  span_namespace: reg.skill.company-research-deep

steps:
  # ── Steps 1–3: COMPANY — deep 8-part analysis (DEEPEN) ──
  # One native mcp_batch execute step (1) + web_extract (2) + LLM synthesis (3).
  - ordinal: 1
    action: execute
    description: >
      COMPANY — batch fetch: earnings transcript via company_transcript,
      DCF via dcf_valuation, peer comparables via comparable_analysis, and
      IR pages via web_search. Deterministic. Results land in
      step_1_result (transcript, dcf, comparables, web_search keys).
    mcp_batch:
      - mcp: company_transcript
        key: transcript
        input_mapping:
          symbol: "{{ ticker }}"
          mode: "earnings"
          quarters_back: 4
      - mcp: dcf_valuation
        key: dcf
        input_mapping:
          symbol: "{{ ticker }}"
      - mcp: comparable_analysis
        key: comparables
        input_mapping:
          symbol: "{{ ticker }}"
      - mcp: web_search
        key: web_search
        input_mapping:
          query: "{{ ticker }} investor relations about company business"
          num_results: 10
    timeout_seconds: 300
    on_failure:
      action: report
      resume: >
        mcp_batch failed — one or more companies/web MCP servers may be down
        or credentials are missing. The COMPANY synthesis (step 3) proceeds
        without the failed tool's output; the missing section will surface
        as a data_gap. Restart the servers via sync_kask_mcp_servers and
        re-invoke.

  - ordinal: 2
    action: execute
    description: >
      COMPANY — fetch IR page content via web_extract MCP tool for Self-View
      verbatim company description. Deterministic. Result lands in
      step_2_result. Conditioned on web_search returning a URL.
    mcp: web_extract
    condition: "step_1_result.web_search"
    timeout_seconds: 90
    input_mapping:
      url: "{{ step_1_result.web_search.results[0].url }}"
    on_failure:
      action: report
      resume: >
        web_extract failed — the web MCP server may be down. The COMPANY
        synthesis (step 3) proceeds without the verbatim IR page content;
        Self-View will rely on web_search snippets only. Restart the server
        via sync_kask_mcp_servers and re-invoke.

  - ordinal: 3
    action: select
    description: >
      COMPANY 8-part synthesis: Self-View, Business Franchise, Management
      Skill (CEO long-term + CFO working capital scorecards), Financial
      Profile (signposts + 3-stage valuation), Invisible Layer, Turd
      Blossom, Value Gorilla Elevator Pitch, Investment Thesis Statement.
      Reasons over company_transcript, dcf_valuation, comparable_analysis,
      and web_search outputs (all from step 1 batch) plus web_extract
      (step 2) and flash_pipeline_output if present. Emits CompanyBoard
      with all 8 sections, data_gaps. Per .rules: failed MCP tools surface
      as data_gaps entries, never collapse to None.
    renderer: minijinja
    template_ref: company-research/company-8part
    timeout_seconds: 300
    input_mapping:
      ticker: "{{ ticker }}"
      transcript_result: "{{ step_1_result.transcript | default({}) }}"
      dcf_result: "{{ step_1_result.dcf | default({}) }}"
      comparables_result: "{{ step_1_result.comparables | default({}) }}"
      web_search_result: "{{ step_1_result.web_search | default({}) }}"
      fetch_result: "{{ step_2_result }}"
      flash_pipeline_output: "{{ flash_pipeline_output | default({}) }}"
      thesis_gaps: "{{ thesis_gaps | default([]) }}"

  # ── Step 4: FALSTAFFIAN — competitive perspective rotation ──
  # Cross-skill metacognition step. Rotates the competitive framing before
  # GORILLA scores it. Prevents GORILLA from scoring a frame-contaminated
  # board. Anchored to MAIA "Falstaff: Give Me Life", "Competition: Readings
  # vs Reality", "Company Analysis", "Thinking Like an Owner".
  - ordinal: 4
    action: select
    description: >
      FALSTAFFIAN — rotate the competitive framing of the Company Board
      before GORILLA scores it. Applies Falstaffian semantic rotation
      shapes (predicate hollow, subject expansion, object inversion,
      direction reversal) to expose framing errors in the analyst
      narrative. Emits rotated_board with competitor-complement analysis,
      market creator vs participant classification, framing errors
      detected, and rotated competitive position. GORILLA consumes the
      rotated board, not the raw Company Board.
    renderer: minijinja
    template_ref: company-research/falstaffian-competitive-rotation
    timeout_seconds: 300
    input_mapping:
      ticker: "{{ ticker }}"
      company_board: "{{ step_3_result }}"
      prior_rotated_board: "{{ prior_rotated_board | default(none) }}"

  # ── Step 5: WARDLEY — compressed value-chain map (v0.36.0) ──
  # Cross-skill adapter: company-research/wardley-anchor compresses
  # wardley-mapper's 6-step cascade (inventory → classify → map → movement
  # → recommendations → present) into a single LLM call over the rotated
  # Company Board. Emits wardley_map with components, evolution classifications,
  # movements, commoditization_candidates, choke_points, and
  # invisible_gorillas. GORILLA (step 6) consumes choke_points and
  # invisible_gorillas to ground its Invisible Gorilla and Choke Point
  # dimensions. ECONOMIC TRAJECTORY (step 10) consumes commoditization_candidates
  # as the falling-cost anchor. The full wardley-mapper skill is available for
  # standalone use — this adapter exists to ground the deep pipeline's
  # strategic analysis without adding a 6-step sub-cascade.
  - ordinal: 5
    action: select
    description: >
      WARDLEY — compressed value-chain map of the rotated Company Board.
      Single LLM call that inventories components, classifies each on the
      Wardley evolution axis (Genesis → Custom → Product → Commodity), maps
      them on the value chain (visibility vs evolution), identifies strategic
      movement, and surfaces commoditization candidates, choke points, and
      invisible gorillas. Consumes the rotated board (step 4) — the map
      reflects the ROTATED competitive framing, not the raw analyst narrative.
      GORILLA (step 6) and ECONOMIC TRAJECTORY (step 10) consume the output.
    renderer: minijinja
    template_ref: company-research/wardley-anchor
    timeout_seconds: 200
    input_mapping:
      ticker: "{{ ticker }}"
      rotated_board: "{{ step_4_result.rotated_board | default(step_3_result) }}"
      business_franchise: "{{ step_3_result.company_board.business_franchise | default('') }}"

  # ── Steps 6–7: GORILLA — 4-dimension framework ──
  # Fixed weights (25/30/25/20) — mcda rejected (essentialist Surface gate:
  # adds ceremony for fixed weights). Scoring is a lisp.eval compute step
  # (8), not an mcda call. GORILLA consumes the ROTATED board (step 4),
  # not the raw Company Board (step 3) — the rotation corrects framing
  # errors before scoring. v0.36.0: GORILLA also consumes the Wardley map
  # (step 5) to ground its Invisible Gorilla and Choke Point dimensions.
  - ordinal: 6
    action: select
    description: >
      GORILLA — assess the 4 dimensions (Obvious Problem, Invisible Gorilla,
      Combinatorial Solution, Choke Point) against the ROTATED Company
      Board and the Wardley map. The Wardley map's invisible_gorillas and
      choke_points fields ground the Invisible Gorilla and Choke Point
      dimensions — the LLM reasons over Wardley's value-chain substrate
      instead of free-form. Emits per-dimension qualitative assessments (0–100)
      that the lisp.eval step (8) weights to the final gorilla_score.
    renderer: minijinja
    template_ref: company-research/gorilla-4dim
    timeout_seconds: 150
    input_mapping:
      ticker: "{{ ticker }}"
      company_board: "{{ step_4_result.rotated_board | default(step_3_result) }}"
      wardley_map: "{{ step_5_result.wardley_map | default(none) }}"

  # ── Step 7: GORILLA — capabilities-reasoner floor/ceiling/maturity (v0.36.0) ──
  # Cross-skill adapter: company-research/gorilla-capability-reason adapts
  # capabilities-reasoner/capability-reason to the GORILLA 4-dim framework.
  # Types each GORILLA dimension against a capability registry with floor,
  # ceiling, and maturity-gate limits. The GORILLA score (0–100) is the
  # elicited potential; the capability assessment determines whether that
  # score is credible against the company's observed behavior and maturity.
  # Emits capability_assessments, floor_violations, ceiling_violations,
  # maturity_blocks. A maturity block on a dimension means the lisp.eval
  # scoring step (now step 8) should treat that dimension's score as nil.
  - ordinal: 7
    action: select
    description: >
      GORILLA — capabilities-reasoner floor/ceiling/maturity assessment.
      Adapts capabilities-reasoner/capability-reason to the GORILLA 4-dim
      framework (step 6). Types each dimension (Obvious Problem, Invisible
      Gorilla, Combinatorial Solution, Choke Point) against a capability
      registry with floor, ceiling, and maturity-gate limits. Evaluates
      whether the GORILLA scores are defensible given the company's
      capability maturity. Emits capability_assessments, floor_violations,
      ceiling_violations, maturity_blocks. A maturity block means the
      lisp.eval scoring step should treat that dimension as nil. Result
      lands in step_7_result and feeds the lisp.eval scoring step (step 8).
    renderer: minijinja
    template_ref: company-research/gorilla-capability-reason
    timeout_seconds: 180
    input_mapping:
      ticker: "{{ ticker }}"
      company_board: "{{ step_4_result.rotated_board | default(step_3_result.company_board) }}"
      gorilla_scores: "{{ step_6_result }}"
      wardley_map: "{{ step_5_result.wardley_map | default(none) }}"

  # ── Step 8: GORILLA — deterministic weighted score with capability gates ──
  # v0.36.0: now also consumes step_7_result (gorilla-capability-reason) to
  # nil out dimensions with maturity blocks. A maturity block means the
  # dimension's score is not credible without its prerequisite — the lisp.eval
  # form treats it as nil, not as the elicited value.
  - ordinal: 8
    action: compute
    compute_ref: lisp.eval
    description: >
      GORILLA — deterministic weighted score. Fixed methodology weights
      (Obvious Problem 25% / Invisible Gorilla 30% / Combinatorial Solution
      25% / Choke Point 20%). Verdict: GORILLA ≥75 / SMALL_ANIMAL 50-74 /
      PEDESTRIAN <50. No unwrap_or(0) — if any dimension score is missing
      (not a number), the form emits nil for gorilla_score and a data_gaps
      list naming the missing dimensions, rather than silently computing
      from zero. v0.36.0: dimensions with maturity blocks (from
      step_7_result) are treated as nil — a blocked dimension's score is
      not credible. The convergence check treats nil as 1.0 (escalate).
    timeout_seconds: 10
    input_mapping:
      form: >
        (if (not (listp step_6_result))
            (list (list "gorilla_score" nil)
                  (list "verdict" "DATA_MISSING")
                  (list "data_gaps" (list "step_6_result_not_object")))
            (let ((op (assoc "obvious_problem" step_6_result))
                  (ig (assoc "invisible_gorilla" step_6_result))
                  (cs (assoc "combinatorial_solution" step_6_result))
                  (cp (assoc "choke_point" step_6_result))
                  (maturity-blocks (if (listp step_7_result) (assoc "maturity_blocks" step_7_result) nil)))
              (let ((op-blocked (member "obvious_problem" maturity-blocks))
                    (ig-blocked (member "invisible_gorilla" maturity-blocks))
                    (cs-blocked (member "combinatorial_solution" maturity-blocks))
                    (cp-blocked (member "choke_point" maturity-blocks)))
                (let ((op-val (if op-blocked nil op))
                      (ig-val (if ig-blocked nil ig))
                      (cs-val (if cs-blocked nil cs))
                      (cp-val (if cp-blocked nil cp)))
                  (let ((op-ok (numberp op-val))
                        (ig-ok (numberp ig-val))
                        (cs-ok (numberp cs-val))
                        (cp-ok (numberp cp-val)))
                    (if (not (and op-ok ig-ok cs-ok cp-ok))
                        (list (list "gorilla_score" nil)
                              (list "verdict" "DATA_MISSING")
                              (list "data_gaps"
                                (list (if (not op-ok) "obvious_problem" nil)
                                      (if (not ig-ok) "invisible_gorilla" nil)
                                      (if (not cs-ok) "combinatorial_solution" nil)
                                      (if (not cp-ok) "choke_point" nil))))
                        (let ((score (+ (* op-val 0.25) (* ig-val 0.30) (* cs-val 0.25) (* cp-val 0.20))))
                          (let ((verdict (if (>= score 75) "GORILLA"
                                            (if (>= score 50) "SMALL_ANIMAL" "PEDESTRIAN"))))
                            (list (list "gorilla_score" score)
                                  (list "verdict" verdict)
                                  (list "obvious_problem" op-val)
                                  (list "invisible_gorilla" ig-val)
                                  (list "combinatorial_solution" cs-val)
                                  (list "choke_point" cp-val))))))))))
      env:
        step_6_result: "{{ step_6_result | default({}) }}"
        step_7_result: "{{ step_7_result | default({}) }}"

  # ── Step 9: IMAGINE — scenario_build MCP tool ──
  # Step 9 generates the scenario tree via scenario_build MCP tool.
  # Step 10 (economic trajectory) and step 11 (IMAGINE synthesis) follow.
  - ordinal: 9
    action: execute
    description: >
      IMAGINE — generate 5/10/20Y scenario tree via scenario_build MCP tool.
      Deterministic. Result lands in step_9_result and feeds IMAGINE
      synthesis (11).
    mcp: scenario_build
    timeout_seconds: 120
    input_mapping:
      subject: "{{ ticker }} 5 10 20 year future scenarios digital transformation"
      time_horizon: "20 years"
      context: "{{ step_4_result.rotated_board.business_franchise | default(step_3_result.company_board.business_franchise) | default('') }}"
    on_failure:
      action: report
      resume: >
        scenario_build failed — the scenario MCP server may be down. The
        IMAGINE synthesis (step 11) proceeds without the structured scenario
        tree; the economic trajectory (step 10) and IMAGINE template will
        generate scenarios without the event-tree scaffold. Restart the server
        via sync_kask_mcp_servers and re-invoke.

  # ── Step 10: ECONOMIC TRAJECTORY — falling-cost / Coase / adjacent possible ──
  # Economically-anchored imagination scaffold. Identifies the falling cost,
  # the constraint being removed, the Coasean firm-boundary shifts, and the
  # Kauffman adjacent possible. IMAGINE (11) consumes this as the anchor for
  # its 5/10/20Y scenarios. v0.36.0: also consumes the Wardley map's
  # commoditization_candidates (step 5) as the falling-cost anchor — what's
  # becoming commodity IS the falling-cost trajectory, named differently.
  # Anchored to MAIA "Focus and Imagination", "More From Less", "Kauffman
  # Readings", "The Future Is Faster", "Bottlenecks and Critical Mass".
  - ordinal: 10
    action: select
    description: >
      ECONOMIC TRAJECTORY — identify the falling-cost trajectory in the
      subject's industry, the design constraint being removed, the Coasean
      firm-boundary shifts, and the Kauffman adjacent possible nodes.
      Consumes the Company Board, the rotated board (if available), and the
      Wardley map's commoditization_candidates (step 5) as the falling-cost
      anchor. Emits economic_trajectory with falling_cost,
      constraint_being_removed, coasean_shifts, adjacent_possible_nodes,
      convergence_vectors, and implications_for_subject. IMAGINE (11)
      consumes this as the anchor.
    renderer: minijinja
    template_ref: company-research/economic-trajectory
    timeout_seconds: 200
    input_mapping:
      ticker: "{{ ticker }}"
      company_board: "{{ step_3_result }}"
      rotated_board: "{{ step_4_result.rotated_board | default(none) }}"
      wardley_map: "{{ step_5_result.wardley_map | default(none) }}"
      prior_economic_trajectory: "{{ prior_economic_trajectory | default(none) }}"

  # ── Step 11: IMAGINE — 5/10/20Y scenarios + digital stage ──
  # Step 11 synthesizes the 5/10/20Y scenarios and falsifiable predictions.
  # Scenarios are ANCHORED on the economic trajectory (step 10) and
  # CHALLENGED by the Falstaffian rotations (step 4). The economic
  # trajectory is the focus that anchors imagination in reality (MAIA:
  # "Focus and Imagination"). The Falstaffian rotations are the perspective
  # shifts that a rapidly evolving trajectory demands.
  - ordinal: 11
    action: select
    description: >
      IMAGINE — project the business at 5, 10, 20 years and walk it back
      analytically. Digital Transformation Stages (MODEL / SHADOW / TWIN /
      SOURCE), Growth Driver Classification (innovation / demographic /
      both / neither). Reasons over scenario_build output (9) and the
      economic_trajectory probe (10). Scenarios MUST be anchored on the
      economic trajectory and challenged by the Falstaffian rotations (4).
      Emits ImagineBoard with digital stage, growth driver, 3 scenarios,
      3–5 falsifiable predictions (tagged by 5/10/20Y horizon for the
      forecast-ledger), what's not on the page (anchored on the adjacent
      possible), what's not in the price (anchored on the trajectory's
      implications), trajectory_anchoring, falstaffian_challenge.
    renderer: minijinja
    template_ref: company-research/imagine-longrange
    timeout_seconds: 300
    input_mapping:
      ticker: "{{ ticker }}"
      company_board: "{{ step_3_result }}"
      scenario_build_result: "{{ step_9_result }}"
      economic_trajectory: "{{ step_10_result | default(none) }}"
      falstaffian_rotations: "{{ step_4_result | default(none) }}"
      prior_outcomes: "{{ prior_outcomes | default({}) }}"

  # ── Step 12: THESIS — three-pillar synthesis ──
  - ordinal: 12
    action: select
    description: >
      THESIS — synthesize all prior research into a formal investment thesis
      covering the three pillars: Business Franchise (moat strength, value
      creation, durability), Management Quality (capital allocation,
      leadership), Valuation (3-stage: consensus → normalization →
      terminal). Emits thesis with the three pillars, but NOT the quality
      gate verdict — the verdict comes from the cross-skill goal-analysis
      step (14) to avoid the LLM-improves-against-LLM-scored-target trap per
      .rules. v0.36.0: also consumes the Wardley map (step 5) to ground the
      Business Franchise pillar's moat analysis in the value-chain structure.
    renderer: minijinja
    template_ref: company-research/thesis-three-pillars
    timeout_seconds: 240
    input_mapping:
      ticker: "{{ ticker }}"
      company_board: "{{ step_3_result }}"
      gorilla_verdict: "{{ step_8_result }}"
      gorilla_capability: "{{ step_7_result | default({}) }}"
      imagine_board: "{{ step_11_result }}"
      rotated_board: "{{ step_4_result.rotated_board | default(none) }}"
      economic_trajectory: "{{ step_10_result | default(none) }}"
      wardley_map: "{{ step_5_result.wardley_map | default(none) }}"

  # ── Steps 13–14: THESIS quality gate — cross-skill goal-analysis ──
  # Per .rules: LLM-improves-against-LLM-scored-target loops must be grounded
  # in real sources. The quality gate uses goal-analysis/judge (semantic
  # evaluator), not LLM self-assessment inside the thesis template.
  # ── Step 13: THESIS — essentialist 3-gate eliminative interrogation (v0.36.0) ──
  # Cross-skill adapter: company-research/thesis-essentialist adapts
  # essentialist/essentialist-flow to the three-pillar investment thesis.
  # Runs a single pass of the 3-gate protocol (Exist, Surface, Contract) on
  # the thesis to enforce parsimony. Mode is autonomous. The elimination_report
  # feeds the goal-analysis quality gate (now step 14) as additional evidence.
  - ordinal: 13
    action: select
    description: >
      THESIS — essentialist 3-gate eliminative interrogation. Adapts
      essentialist/essentialist-flow to the three-pillar investment thesis
      (step 12). Runs a single pass of the 3-gate protocol (Exist, Surface,
      Contract) to enforce parsimony — does each pillar earn its place? Is
      the thesis at the right abstraction level? Can it be stated more
      tersely? Mode is autonomous (no human in the loop). The
      elimination_report feeds the goal-analysis quality gate (step 14) as
      additional evidence — it does not block the thesis directly. Result
      lands in step_13_result.
    renderer: minijinja
    template_ref: company-research/thesis-essentialist
    timeout_seconds: 150
    input_mapping:
      ticker: "{{ ticker }}"
      thesis: "{{ step_12_result }}"
      company_board: "{{ step_3_result.company_board }}"

  - ordinal: 14
    action: select
    description: >
      THESIS quality gate — cross-skill goal-analysis/judge semantic
      evaluation. Evaluates the thesis against the three-pillar
      investment_grade criteria using goal-analysis's semantic evaluator,
      not LLM self-assessment. Emits investment_grade / needs_work /
      incomplete verdict plus gap analysis. This is the deep pipeline
      convergence signal.
    renderer: minijinja
    template_ref: goal-analysis/judge
    timeout_seconds: 150
    input_mapping:
      goal_text: "Three-pillar investment thesis for {{ ticker }}: Business Franchise (moat strength, value creation, durability), Management Quality (capital allocation, leadership), Valuation (3-stage: consensus → normalization → terminal). Verdict: investment_grade / needs_work / incomplete."
      criteria:
        - "Business Franchise pillar covers moat source, value creation mechanism, and durability (10Y+ / 5-10Y / < 5Y) and reflects the Falstaffian rotated competitive framing (does not reproduce framing errors the rotation corrected)"
        - "Management Quality pillar covers capital allocation verdict (created/destroyed/mixed) and leadership assessment with evidence"
        - "Valuation pillar covers all 3 stages (consensus, normalization, terminal) with the terminal stage cross-referencing the IMAGINE 20Y scenario and consistent with the economic trajectory's implications for the subject"
        - "Thesis statement is durable, timeless, and covers all three pillars"
        - "If economic trajectory is present: the thesis is consistent with the falling-cost trajectory and the adjacent possible — it does not project a steady-state terminal that ignores the trajectory's impact"
        - "If Falstaffian rotation is present: the thesis does not reproduce framing errors the rotation corrected (e.g., calling a market creator a competitor)"
        - "If wardley_map is present: the thesis is consistent with the value-chain movement — it does not project a terminal value for a component the map classifies as commodity-bound, and the moat analysis reflects the Wardley evolution classifications"
        - "If essentialist_report is present: no gate failed (G1 Exist, G2 Surface, G3 Contract) — no decorative pillars, no restatement risk, no label abstractions, no hedge verdicts. A failed gate means the thesis has parsimony issues and is needs_work, not investment_grade."
      outcome_summary: "{{ step_12_result.thesis_statement }}"
      essentialist_report: "{{ step_13_result | default({}) }}"
      artifacts:
        - "{{ step_12_result.business_franchise }}"
        - "{{ step_12_result.management_quality }}"
        - "{{ step_12_result.valuation }}"

  # ── Step 15: Convergence check — THESIS verdict ──
  # goal-analysis/judge emits "done|continue|blocked". Map: done=0.0
  # (converged), continue=0.5 (loop), blocked=1.0 (escalate). No
  # unwrap_or(0) — missing verdict surfaces as 1.0.
  - ordinal: 15
    action: compute
    compute_ref: lisp.eval
    description: >
      Convergence check — THESIS quality gate verdict. goal-analysis/judge
      emits done|continue|blocked. Map: done=0.0 (fully converged),
      continue=0.5 (re-enter COMPANY with gaps), blocked=1.0 (escalate).
      Missing verdict surfaces as 1.0 (worst case), not silently converged
      — per .rules no unwrap_or(0) on regulation signals.
    timeout_seconds: 10
    input_mapping:
      form: >
        (if (not (listp step_14_result))
            1.0
            (let ((v (assoc "verdict" step_14_result)))
              (cond
                ((eq v "done") 0.0)
                ((eq v "continue") 0.5)
                ((eq v "blocked") 1.0)
                (t 1.0))))
      env:
        step_14_result: "{{ step_14_result | default({}) }}"

  # ── Step 16: Loop back to COMPANY if THESIS flags needs_work ──
  # Re-runs COMPANY (3) with THESIS gaps injected. incomplete (1.0) does
  # not loop — it escalates via on_not_reached. max_iterations: 3 bounds.
  # Carries prior rotation, trajectory, and wardley map forward so the PDCA
  # loop has memory of its own perspective-shifts — the next FALSTAFFIAN (4),
  # WARDLEY (5), and ECONOMIC TRAJECTORY (10) passes can detect whether the
  # COMPANY revision addressed the framing/trajectory/value-chain gaps or
  # re-encoded them.
  - ordinal: 16
    action: loop
    description: >
      Re-enter COMPANY synthesis (step 3) if THESIS flags needs_work (0.5).
      THESIS gap analysis is injected into the next COMPANY pass via the
      loop's input_mapping. Prior rotated board, economic trajectory, and
      wardley map are carried forward as advisory context for the next
      FALSTAFFIAN (4), WARDLEY (5), and ECONOMIC TRAJECTORY (10) passes.
      incomplete (1.0) does not loop — it escalates via on_not_reached.
      max_iterations: 3 bounds the loop.
    condition: "step_15_result > 0.0 AND step_15_result < 1.0"
    input_mapping:
      loop_target: "{{ 3 }}"
      thesis_gaps: "{{ step_14_result.gap_analysis | default([]) }}"
      convergence_signal: "{{ step_15_result }}"
      prior_rotated_board: "{{ step_4_result.rotated_board | default(none) }}"
      prior_economic_trajectory: "{{ step_10_result | default(none) }}"
      prior_wardley_map: "{{ step_5_result.wardley_map | default(none) }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
