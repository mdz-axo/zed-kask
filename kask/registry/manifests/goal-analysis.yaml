# Goal Analysis Process Manifest
# ℏKask v0.35.0 — Goal lifecycle as convergent PDCA
# Consolidates: goal_lifecycle.yaml (Regulation, storage, matryoshka)
#               goal_verification.yaml (error handling, human review)
# Both superseded manifests are now deprecated — this is canonical.

manifest:
  id: goal-analysis
  category: skill
  name: Goal Analysis
  description: >
    Convergent goal lifecycle process. Extracts structured goals from user intent,
    activates them with Regulation tracking, judges completion against explicit criteria,
    computes convergence, and iterates until goal status is confidently resolved
    (done, continue, or blocked). Includes storage integration, Regulation variety tracking,
    matryoshka depth enforcement, and human-review escalation on low confidence.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: user_intent
    type: string
    required: false
  - name: context
    type: object
    required: false
  - name: outcome_summary
    type: string
    required: false
  - name: artifacts
    type: array
    required: false

ledger:
  span_namespace: reg.skill.goal-analysis
  # variety_monitoring config (metric: active_goals_per_user, threshold: 10,
  # alert: "User has >10 concurrent active goals — consider delegation or abandonment")
  # is recorded here for reference; the schema field is a boolean toggle.
  variety_monitoring: true

steps:
  - ordinal: 1
    action: select
    description: Extract structured goal from user intent with explicit completion criteria.
    renderer: minijinja
    template_ref: goal-analysis/create
    timeout_seconds: 120
    input_mapping:
      user_intent: "{{ task | default(user_intent) }}"
      context: "{{ context | default({}) }}"

  - ordinal: 2
    action: select
    description: Emit Regulation span for goal creation and attach criteria. Tracks goal in storage.
    renderer: minijinja
    template_ref: goal-analysis/goal-activate
    timeout_seconds: 30
    input_mapping:
      goal: "{{ step_1_result }}"
    reg_spans:
      - reg.goal.create

  - ordinal: 3
    action: select
    description: Judge goal completion against explicit criteria, outcome summary, and artifacts.
    renderer: minijinja
    template_ref: goal-analysis/judge
    timeout_seconds: 120
    input_mapping:
      goal_text: "{{ step_1_result.goal_text | default(user_intent) }}"
      criteria: "{{ step_1_result.criteria | default([]) }}"
      outcome_summary: "{{ outcome_summary | default('') }}"
      artifacts: "{{ artifacts | default([]) }}"

  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 3's actual judge output.
      The convergence signal is the confidence gap: score = 1.0 - confidence.
      Lower = more converged (a confident verdict moves toward 0). If
      confidence is absent, the form errors (no silent default), surfacing
      a broken judge step rather than masking it with a flat 1.0.
    timeout_seconds: 10
    input_mapping:
      form: "(let ((c (assoc \"confidence\" step_3_result))) (if (is_null c) 1.0 (let ((c-n (if (numberp c) c 1.0))) (- 1.0 c-n))))"
      env:
        step_3_result: "{{ step_3_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 5
    action: select
    description: Resolve goal state and emit Regulation spans based on verdict.
    renderer: minijinja
    template_ref: goal-analysis/goal-resolve
    timeout_seconds: 30
    input_mapping:
      verdict: "{{ step_3_result.verdict }}"
      confidence: "{{ step_3_result.confidence }}"
      reason: "{{ step_3_result.reason }}"
      goal: "{{ step_1_result }}"
    reg_spans:
      - reg.goal.verify
      - reg.goal.complete
      - reg.goal.block
      - reg.goal.transition

  - ordinal: 6
    action: loop
    description: Re-enter goal cycle if convergence is not met or verdict is continue.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the judge confidence gap into convergence_signal so the Cauchy
      # criterion can detect when the iterates have stopped moving. The
      # score is computed by the lisp.eval step (step 4) from step 3's
      # actual confidence field — no phantom convergence_metric default.
      convergence_signal: "{{ step_4_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
