# CSP Stage Isolation Configuration
# ℏKask v0.34.0 - A Minimal Viable Container for UserPods

manifest:
  id: csp-stage-isolation
  category: runtime-config
  name: CSP Stage Isolation
  description: >
    Stage isolation configuration for Cybernetic Service Process pipelines,
    including timeouts, backpressure, retry policy, and pre/post stages.
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

gas:
  cap: 10000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 0
  alert_threshold: 0.8
  hard_limit: true

ledger:
  span_namespace: reg.skill.csp-stage-isolation
