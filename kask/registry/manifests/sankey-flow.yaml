# Sankey Flow Process Manifest
# hKask v0.33.0 — Example-anchored Sankey diagramming
# Anchored in PKO (Procedural Knowledge Ontology), PROV-O, FIBO, Mermaid sankey-beta
# Canonical references: Schmidt (2008) J. Industrial Ecology 12(1):82–94, 12(2):173–185
#
# Architecture: example-anchored match-adapt-render
#   1. MATCH  — classify domain + match against canonical example library + extract user data
#   2. ADAPT  — fill user data into matched example structure, render Mermaid + markdown
#   3. RENDER — deterministic Jinja2 render to surface the markdown (no LLM call)
#
# The old 7-step PDCA loop (classify → gather → draft → evaluate → converge → loop → write)
# was overengineered: it made up to 21 LLM calls and never converged because the evaluate
# step kept flagging intentional design choices (e.g., non-conserving loss-making income
# statements) as quality gaps. The example-anchored approach converges in 2 LLM calls
# because the adapt step self-corrects against the matched example's structure in a
# single pass, rather than iterating through an abstract quality scoring loop.
#
# Ontological grounding:
#   A Sankey is a visualization of a PKO Procedure — nodes are Steps, edges are
#   nextStep flows, weights are StepExecution quantities, conservation is
#   StepVerification. Weight sources are prov:wasDerivedFrom.
#   State axis: output is a bibo:Document, Mermaid source is a dcterms:Dataset.
#   Domain supplements: FIBO for financial domains.

manifest:
  id: sankey-flow
  category: skill
  name: Sankey Flow
  description: >
    Dynamic Sankey flow diagramming. Takes a natural-language prompt, matches it
    against a library of canonical Sankey examples (income statement, budget,
    data pipeline, funnel, balance sheet, process flow), adapts the matched
    example's structure to the user's actual data, and renders a Mermaid
    sankey-beta diagram that renders natively in Zed. Anchors flows to PKO
    (a Sankey is a visualization of a PKO Procedure). Per-domain conservation
    modes (mandatory/asserted/none). Hard rule: never fabricate weights.
    Example-anchored convergence: the adapt step self-corrects against the
    matched example's structure in a single pass — no multi-iteration PDCA loop.
  functional_role: flowdef
  version: 0.33.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "fixed"
  max_iterations: 1
  on_not_reached: escalate

gas:
  # 2 LLM calls (match + adapt) + 1 deterministic render. Much lower than the
  # old 7-step PDCA loop (up to 21 LLM calls).
  cap: 20000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: prompt
    type: string
    description: "The natural-language prompt describing the flow to visualize."
    required: true
  - name: source_ref
    type: string
    description: >
      Optional reference to an external source (URL, file path, crate path).
      When present, the match step notes it and the adapt step includes it in
      data source provenance.
    required: false
  - name: hint
    type: string
    description: "Optional hint: preferred domain, audience, or context."
    required: false

steps:
  - ordinal: 1
    action: select
    description: >
      MATCH the prompt against the canonical example library. Classify the
      domain, find the closest structural example (income statement, budget,
      data pipeline, funnel, balance sheet, process flow), and extract the
      user's actual nodes, edges, and weights in a single pass. If data is
      missing, mark weights as 1 (placeholder) and note it — do NOT interrogate
      the user. For income statements with losses, negative profits flow into
      the Total Revenue node as sources (Revenue + |Loss| = Total Expenses).
    renderer: minijinja
    template_ref: sankey-flow/sankey-match
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      prompt: "{{ prompt }}"
      hint: "{{ hint | default('') }}"

  - ordinal: 2
    action: select
    description: >
      ADAPT the user's data into the matched example's structure. Verify
      structure against the example (node count, edge pattern, conservation
      mode). Render the Mermaid sankey-beta CSV with front-matter config. Wrap
      in a markdown document with description, conservation check, data
      sources with PROV-O provenance, and references. Single pass — no
      iteration, no quality scoring loop. Self-correct against the example
      structure if the draft deviates.
    renderer: minijinja
    template_ref: sankey-flow/sankey-adapt
    gas_cap: 8192
    timeout_seconds: 60
    input_mapping:
      domain: "{{ step_1_result.domain }}"
      matched_example: "{{ step_1_result.matched_example }}"
      conservation_mode: "{{ step_1_result.conservation_mode }}"
      ontology_anchor: "{{ step_1_result.ontology_anchor }}"
      weight_unit: "{{ step_1_result.weight_unit }}"
      subject: "{{ step_1_result.subject }}"
      nodes: "{{ step_1_result.nodes | default([]) }}"
      edges: "{{ step_1_result.edges | default([]) }}"
      source_ref: "{{ source_ref | default(step_1_result.source_ref | default('')) }}"
      match_notes: "{{ step_1_result.match_notes | default('') }}"

  - ordinal: 3
    action: render
    description: >
      FORMAT and surface the finalized Sankey as the cascade's final output.
      Wraps the adapt step's mermaid source in a titled, annotated markdown
      document with a title, description, the mermaid diagram, a conservation
      check, a data table annotating each flow with its weight and provenance,
      and references. Deterministic (no LLM call) — pure Jinja2 formatting.
    renderer: minijinja
    template_ref: sankey-flow/present-sankey
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      mermaid_source: "{{ step_2_result.mermaid_source }}"
      output_path: "{{ step_2_result.output_path }}"
      node_count: "{{ step_2_result.node_count }}"
      edge_count: "{{ step_2_result.edge_count }}"
      conservation_check: "{{ step_2_result.conservation_check }}"
      adapt_notes: "{{ step_2_result.adapt_notes | default('') }}"
      domain: "{{ step_1_result.domain }}"
      subject: "{{ step_1_result.subject }}"
      weight_unit: "{{ step_1_result.weight_unit }}"
      conservation_mode: "{{ step_1_result.conservation_mode }}"
      nodes: "{{ step_1_result.nodes | default([]) }}"
      edges: "{{ step_1_result.edges | default([]) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.sankey-flow
  telemetry_namespace: hkask.template.sankey-flow
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true