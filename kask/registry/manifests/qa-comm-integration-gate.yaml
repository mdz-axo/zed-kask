manifest:
  id: qa-comm-integration-gate
  category: qa-script
  name: QA Comm Integration Gate
  version: 0.31.0
  visibility: Private
  description: "Verifies hkask-mcp-communication agent registry invariants through the communication_contract.rs\
    \ integration tests. Ensures agent registration\u2192resolution\u2192deregistration cycle integrity.\n"
gas:
  cap: 20000
  alert_threshold: 0.8
  hard_limit: true
rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: cargo test -p hkask-mcp-communication --test communication_contract -- --nocapture 2>&1 | tail
    -20
  description: "Run communication contract tests: agent registry record\u2192resolve\u2192deregister cycle"
  retries: 0
  branching:
    success: 2
    failure: 4
- ordinal: 2
  action: classify
  classifier: qa-triage
  description: "Test suite: hkask-mcp-communication contract tests. Verify agent registry integrity: record_mapping\
    \ stores WebID\u2192UserID, lookup_unregistered returns None, deregister removes mappings, both deregister_nonexistent\
    \ and record_mapping are idempotent. All 5 contract tests passing indicates communication layer is\
    \ functional for same-process agent coordination."
  retries: 0
  branching:
    high_confidence: 3
    medium_confidence: 3
    low_confidence: 5
    flake: 2
    unparseable: 5
    classifier_unavailable: 5
- ordinal: 3
  action: run_command
  command: "echo '[QA:communication] PASS \u2014 agent registry contract tests verified (5/5)'"
  description: 'All communication contract tests pass: registry lifecycle verified'
  retries: 0
  terminal: true
- ordinal: 4
  action: run_command
  command: "echo '[QA:communication] FAIL \u2014 contract tests failed. Agent registry or messaging types\
    \ may be broken.'"
  description: "Communication contract test failure \u2014 agent coordination may be compromised"
  retries: 0
  terminal: true
- ordinal: 5
  action: run_command
  command: "echo '[QA:communication] WARN \u2014 classifier low confidence on test output. Manual review\
    \ recommended.'"
  description: "Classifier returned low confidence \u2014 manual review needed"
  retries: 0
  terminal: true
ledger:
  emit_spans: true
  alert: qa.comm.integration
  span_namespace: reg.skill.qa-comm-integration-gate
