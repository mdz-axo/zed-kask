# Sequential Inquiry Process Manifest
# ℏKask v0.32.0 — Compound inquiry as Improvement Kata PDCA
#
# The inquiry follows the Toyota Improvement Kata: grasp the current
# understanding, establish the target understanding, predict which
# deep-dive (hypothesis-framer, mcda, diagnose, falsifiability) will
# close the gap, run the inquiry engine + delegation, measure the gap,
# and score the prediction via Brier. Convergence is detected
# deterministically via the hypotenuse of object-space (thought chain
# completeness) and process-space (delegation resolution), plus Brier-scored
# prediction calibration.

manifest:
  id: sequential-inquiry
  category: skill
  name: Sequential Inquiry
  description: >
    Compound convergent inquiry process following the Toyota Improvement
    Kata. Grasps the current understanding, establishes a target
    understanding, predicts which deep-dive (hypothesis-framer, mcda,
    diagnose, falsifiability) will close the gap, runs the inquiry engine
    with delegation, measures the gap (thought chain completeness +
    delegation resolution), and scores the prediction via Brier.
    Convergence is detected deterministically: gap closure, Cauchy
    (iterates stabilized), or calibration (Brier score).
  functional_role: flowdef
  version: 0.32.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "gap_or_cauchy_or_calibration"
  hypotenuse_epsilon: 0.05
  cauchy_epsilon: 0.03
  cauchy_window: 3
  brier_window: 3
  brier_threshold: 0.15
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "target_artifacts"
  current_artifacts_field: "current_artifacts"
  target_procedure_field: "target_procedure"
  current_procedure_field: "current_procedure"
  prediction_field: "prediction"
  result_field: "experiment_result"

gas:
  cap: 120000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 4
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: problem
    type: string
    required: true
  - name: domain
    type: string
    required: false
  - name: constraints
    type: array
    required: false
  - name: max_thoughts
    type: integer
    required: false
  - name: thinking_budget
    type: string
    required: false
  - name: skill_router_catalog
    type: array
    required: false
    description: >
      Installed skill catalog for skill-router matching. Injected by the
      executor from the runtime skill registry.

steps:
  # ── Kata Step 1: Grasp Current Condition ──
  # Measure the agent's current understanding of the problem. What thoughts
  # have been generated? What delegations have been resolved? What's the
  # current confidence?
  - ordinal: 1
    action: select
    description: >
      GRASP CURRENT CONDITION: Measure the agent's current understanding of
      the problem. What thoughts have been generated? What delegations have
      been resolved? What's the current confidence? Produces current_artifacts
      (thought chain completeness) and current_procedure (which inquiry steps
      have been executed).
    renderer: minijinja
    template_ref: sequential-inquiry/sequential-inquiry-grasp
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      problem: "{{ problem }}"
      domain: "{{ domain | default('') }}"
      constraints: "{{ constraints | default([]) }}"
      prev_grasp: "{{ prev_step_1_result | default({}) }}"

  # ── Kata Step 2: Establish Target Condition ──
  # Declare the target understanding — what "sufficient understanding" looks
  # like for this problem.
  - ordinal: 2
    action: select
    condition: "{{ target_artifacts | default('') | length == 0 }}"
    description: >
      ESTABLISH TARGET CONDITION: Declare the target understanding — what
      "sufficient understanding" looks like for this problem. Produces
      target_artifacts (what the thought chain should contain) and
      target_procedure (which inquiry steps must be complete).
    renderer: minijinja
    template_ref: sequential-inquiry/sequential-inquiry-target
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      problem: "{{ problem }}"
      current_condition: "{{ step_1_result }}"

  # ── Kata Step 3: Make a Prediction ──
  # Predict which deep-dive delegation will close the gap. Carry a confidence.
  - ordinal: 3
    action: select
    description: >
      MAKE PREDICTION: Predict which deep-dive delegation (hypothesis-framer,
      mcda, diagnose, falsifiability) will close the gap and by how much.
      Carry a confidence in [0,1]. The Brier score tracks calibration.
    renderer: minijinja
    template_ref: sequential-inquiry/sequential-inquiry-predict
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      problem: "{{ problem }}"
      current_condition: "{{ step_1_result }}"
      target_condition: "{{ target_artifacts | default(step_2_result) }}"
      prev_prediction: "{{ prev_step_3_result | default({}) }}"

  # ── Kata Step 4: Experiment (Do) ──
  # Run the inquiry engine with the predicted delegation. This is the actual
  # thinking + delegation. Re-measure the current condition after.
  - ordinal: 4
    action: select
    description: >
      EXPERIMENT (DO): Run the inquiry engine with the predicted delegation.
      Generate, branch, revise, hypothesize, and verify thoughts. Dispatch
      to the predicted deep-dive skill (hypothesis-framer, mcda, diagnose, or
      falsifiability). Re-measure the current condition after the experiment.
    renderer: minijinja
    template_ref: sequential-inquiry/sequential-inquiry-engine
    gas_cap: 9000
    timeout_seconds: 90
    input_mapping:
      problem: "{{ problem }}"
      domain: "{{ domain | default('') }}"
      constraints: "{{ constraints | default([]) }}"
      max_thoughts: "{{ max_thoughts | default(12) }}"
      thinking_budget: "{{ thinking_budget | default('full') }}"
      prediction: "{{ step_3_result }}"
      prev_chain: "{{ prev_step_4_result.thought_chain | default([]) }}"
      prev_delegation_results: "{{ prev_step_4_result.delegation_results | default({}) }}"

  # ── Kata Step 5: Skill-Router Dispatch (conditional) ──
  # If the engine emitted skill_match_queries, dispatch them.
  - ordinal: 5
    action: select
    description: >
      Dispatch skill_match_queries emitted by the engine to the skill-router.
      If the engine emitted no queries, this step returns an empty result.
    renderer: minijinja
    template_ref: skill-router/skill-router-match
    gas_cap: 2000
    timeout_seconds: 30
    input_mapping:
      task_description: "{{ step_4_result.skill_match_queries[0].query | default('') }}"
      task_context: "{{ step_4_result.skill_match_queries | map(attribute='reason') | join('; ') | default('') }}"
      skill_catalog: "{{ skill_router_catalog | default([]) }}"
      max_recommendations: 3
    condition: "step_4_result.skill_match_queries"

  # ── Kata Step 6: Measure Object-Space Gap (Check) ──
  - ordinal: 6
    action: compute
    compute_ref: kata.object_gap
    description: >
      MEASURE OBJECT GAP: Dublin Core object-space gap between current thought
      chain artifacts and the target spec. Deterministic.
    input_mapping:
      current_artifacts: "{{ step_4_result.current_artifacts | default(step_4_result) }}"
      target_artifacts: "{{ target_artifacts | default(step_2_result.target_artifacts | default(step_2_result)) }}"

  # ── Kata Step 7: Measure Process-Space Gap (Check) ──
  - ordinal: 7
    action: compute
    compute_ref: kata.process_gap
    description: >
      MEASURE PROCESS GAP: PKO process-space gap between current inquiry
      procedure state and target. Deterministic.
    input_mapping:
      current_procedure: "{{ step_4_result.current_procedure | default(step_4_result) }}"
      target_procedure: "{{ target_procedure | default(step_2_result.target_procedure | default(step_2_result)) }}"

  # ── Kata Step 8: Compute Hypotenuse (Check) ──
  - ordinal: 8
    action: compute
    compute_ref: kata.hypotenuse
    description: >
      COMPUTE HYPOTENUSE: Total distance to target in combined space.
    input_mapping:
      object_gap: "{{ step_6_result.object_gap }}"
      process_gap: "{{ step_7_result.process_gap }}"

  # ── Kata Step 9: Score Prediction (Check) ──
  - ordinal: 9
    action: compute
    compute_ref: kata.prediction_vs_result
    description: >
      SCORE PREDICTION: Brier score for this cycle's prediction.
    input_mapping:
      prediction: "{{ step_3_result }}"
      result:
        actual_delta: "{{ step_8_result.hypotenuse }}"

  # ── Kata Step 10: Check Convergence (Act) ──
  - ordinal: 10
    action: compute
    compute_ref: kata.convergence_check
    description: >
      CHECK CONVERGENCE: Gap, Cauchy, or calibration convergence.
      Deterministic — no LLM, no timeout.
    input_mapping:
      hypotenuse: "{{ step_8_result.hypotenuse }}"
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "{{ _convergence.convergence_mode | default('gap_or_cauchy_or_calibration') }}"

  # ── Kata Step 11: Loop ──
  - ordinal: 11
    action: loop
    description: >
      Re-enter Kata cycle if not converged. The executor automatically
      snapshots prev_step_N_result values for refinement.
    input_mapping:
      loop_target: "{{ 1 }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: sequential-inquiry/sequential-inquiry-grasp
      gas_budget: 6000
    - resource: template
      action: render
      template_id: sequential-inquiry/sequential-inquiry-target
      gas_budget: 4096
    - resource: template
      action: render
      template_id: sequential-inquiry/sequential-inquiry-predict
      gas_budget: 4096
    - resource: template
      action: render
      template_id: sequential-inquiry/sequential-inquiry-engine
      gas_budget: 9000
    - resource: template
      action: render
      template_id: skill-router/skill-router-match
      gas_budget: 2000
    - resource: inference
      action: call
      gas_budget: 9000
    - resource: manifest
      action: execute
      template_id: sequential-inquiry
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true
