# Coding Guidelines Process Manifest
# ℏKask v0.35.0 — Coding discipline as convergent PDCA

manifest:
  id: coding-guidelines
  category: skill
  name: Coding Guidelines
  description: >
    Convergent coding-discipline process. Assesses a task against Karpathy-style
    constraints, applies guardrails, verifies proposed implementation quality,
    computes convergence, and iterates until violations are reduced.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  target_artifacts_field: step_3_result.compliance_score
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: task_description
    type: string
    required: false
  - name: code_context
    type: object
    required: false
  - name: diff_preview
    type: string
    required: false

ledger:
  span_namespace: reg.skill.coding-guidelines

steps:
  - ordinal: 1
    action: select
    description: Assess the task against coding principles before implementation.
    renderer: minijinja
    template_ref: coding-guidelines/guidelines-assess
    timeout_seconds: 150
    input_mapping:
      task_description: "{{ task | default(task_description) }}"
      code_context: "{{ code_context | default({}) }}"

  - ordinal: 2
    action: select
    description: Apply guardrails and generate constrained implementation directives.
    renderer: minijinja
    template_ref: coding-guidelines/guidelines-apply
    timeout_seconds: 150
    input_mapping:
      task_description: "{{ task_description }}"
      assumptions: "{{ step_1_result.assumptions | default([]) }}"
      simplicity_risks: "{{ step_1_result.simplicity_risks | default([]) }}"
      scope_creep_warnings: "{{ step_1_result.scope_creep_warnings | default([]) }}"
      success_criteria: "{{ step_1_result.success_criteria | default([]) }}"
      plan: "{{ step_1_result.plan | default([]) }}"

  - ordinal: 3
    action: select
    description: Verify the implementation plan/diff against coding principles.
    renderer: minijinja
    template_ref: coding-guidelines/guidelines-verify
    timeout_seconds: 150
    input_mapping:
      task_description: "{{ task_description }}"
      assumptions: "{{ step_1_result.assumptions | default([]) }}"
      success_criteria: "{{ step_1_result.success_criteria | default([]) }}"
      constrained_plan: "{{ step_2_result.constrained_plan | default([]) }}"
      diff_preview: "{{ diff_preview | default('') }}"

  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the violation count from the
      verification step. Lower signal variance across iterations =
      convergence (Cauchy). Using lisp.eval instead of a Jinja expression
      makes the computation explicitly deterministic, budgeted
      (timeout_seconds: 10), and observable via a reg.skill.coding-guidelines span.
      Guards against a missing violations field by returning 0 when absent.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((violations (assoc "violations" step_3_result)))
          (if (is_null violations) 0 (length violations)))
      env:
        step_3_result: "{{ step_3_result | default({}) }}"

  - ordinal: 5
    action: loop
    description: Re-enter coding-guidelines cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 4). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_4_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
