# Supply Chain Sentinel Process Manifest
# ℏKask v0.35.0 — Dependency manifest audit (Cargo.toml, deny.toml, lockfiles)
# Anchored to MITRE CWE (CWE-1104, CWE-829, CWE-1357), OWASP Supply Chain taxonomy, OSC&R framework.

manifest:
  id: supply-chain-sentinel
  category: skill
  name: Supply Chain Sentinel
  description: >
    Dependency and software supply chain audit. Probes dependency manifests
    for version pinning, registry verification, license conflicts, unmaintained
    indicators, and transitive dependency visibility.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: manifest_path
    type: string
    required: false

ledger:
  span_namespace: reg.skill.supply-chain-sentinel

steps:
  - ordinal: 1
    action: select
    description: >
      Select dependency manifest surfaces to audit (Cargo.toml, deny.toml, lockfiles).
    renderer: minijinja
    template_ref: supply-chain-sentinel/select-surface
    timeout_seconds: 120
  - ordinal: 2
    action: select
    description: >
      Probe manifests for version pinning, registry verification, license conflicts,
      unmaintained indicators, and transitive dependency visibility.
    renderer: minijinja
    template_ref: supply-chain-sentinel/probe
    timeout_seconds: 120
  - ordinal: 3
    action: select
    description: >
      Report supply-chain findings with CWE-mapped evidence and proposed regressions.
    renderer: minijinja
    template_ref: supply-chain-sentinel/report
    timeout_seconds: 120
  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the findings count from the report
      step PLUS the count of structural defects in proposed_regressions
      (bad severity, bad detection.kind, or empty pattern). Lower signal
      variance across iterations = convergence (Cauchy). Using lisp.eval
      instead of a Jinja expression makes the computation explicitly
      deterministic, budgeted (timeout_seconds: 10), and observable via
      a reg.skill.supply-chain-sentinel span. A hallucinated RR proposal
      (e.g., severity 'blocker', detection.kind 'runtime') is now a
      cascade defect instead of prose a human must hand-check. Guards
      against a missing findings field by returning 0 when absent.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((findings (assoc "findings" step_3_result))
              (proposed (assoc "proposed_regressions" step_3_result)))
          (begin
            (define valid-sev
              (lambda (s)
                (if (string= s "critical") true
                (if (string= s "high") true
                (if (string= s "medium") true
                (if (string= s "low") true false))))))
            (define valid-kind
              (lambda (k)
                (if (string= k "grep") true
                (if (string= k "cargo-test") true
                (if (string= k "skill-probe") true
                (if (string= k "reg-span") true false))))))
            (define check-rr
              (lambda (rs acc)
                (if (is_null rs)
                    acc
                    (let ((r (car rs))
                          (sev (assoc "severity" r))
                          (det (assoc "detection" r))
                          (kind (if (is_null det) (list) (assoc "kind" det)))
                          (pat (if (is_null det) (list) (assoc "pattern" det))))
                      (let ((sev-ok (valid-sev sev))
                            (kind-ok (valid-kind kind))
                            (pat-ok (not (is_null pat))))
                        (check-rr
                          (cdr rs)
                          (+ acc
                             (if (not sev-ok) 1 0)
                             (if (not kind-ok) 1 0)
                             (if (not pat-ok) 1 0))))))))
            (define rr-defects
              (if (is_null proposed) 0 (check-rr proposed 0)))
            (define findings-count
              (if (is_null findings) 0 (length findings)))
            (+ findings-count rr-defects)))
      env:
        step_3_result: "{{ step_3_result | default({}) }}"

  - ordinal: 5
    action: loop
    description: >
      Re-enter supply chain audit cycle if convergence is not met. Routes
      back to step 1 (scan manifests) to re-check dependencies.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 4). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_4_result }}"

