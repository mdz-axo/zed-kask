# Supply Chain Sentinel Process Manifest
# ℏKask v0.34.0 — Dependency manifest audit (Cargo.toml, deny.toml, lockfiles)
# Anchored to MITRE CWE (CWE-1104, CWE-829, CWE-1357), OWASP Supply Chain taxonomy, OSC&R framework.

manifest:
  id: supply-chain-sentinel
  category: skill
  name: Supply Chain Sentinel
  description: >
    Dependency and software supply chain audit. Probes dependency manifests
    for version pinning, registry verification, license conflicts, unmaintained
    indicators, and transitive dependency visibility.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: manifest_path
    type: string
    required: true

ledger:
  span_namespace: reg.skill.supply-chain-sentinel

steps:
  - ordinal: 1
    action: select
    description: >
      Select dependency manifest surfaces to audit (Cargo.toml, deny.toml, lockfiles).
    renderer: minijinja
    template_ref: supply-chain-sentinel/select-surface
    gas_cap: 2048
    timeout_seconds: 60
  - ordinal: 2
    action: select
    description: >
      Probe manifests for version pinning, registry verification, license conflicts,
      unmaintained indicators, and transitive dependency visibility.
    renderer: minijinja
    template_ref: supply-chain-sentinel/probe
    gas_cap: 2048
    timeout_seconds: 60
  - ordinal: 3
    action: select
    description: >
      Report supply-chain findings with CWE-mapped evidence and proposed regressions.
    renderer: minijinja
    template_ref: supply-chain-sentinel/report
    gas_cap: 2048
    timeout_seconds: 60
  - ordinal: 4
    action: loop
    description: >
      Re-enter supply chain audit cycle if convergence is not met. Routes
      back to step 1 (scan manifests) to re-check dependencies.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_3_result.findings | default([]) | length }}"

