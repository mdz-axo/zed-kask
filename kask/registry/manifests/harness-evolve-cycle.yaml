manifest:
  id: harness-evolve-cycle
  category: qa-script
  name: Harness Evolve Cycle
  version: "0.33.7"
  # BROKEN since 009b04066a (2026-08-04): step 1 `command` references
  # `./scripts/test --trace`, but `kask/scripts/test` was deleted in that
  # commit. The cycle will fail at step 1 until `scripts/test` is rebuilt
  # per kask/docs/plans/evolving-test-harness.md §2.2. The
  # `hkask-test-harness` crate and `stability-gate.sh` survive. See the plan
  # doc's 2026-08-04 status revision for the revival path.
  description: >
    Orchestrates the test harness self-improvement loop. Runs tests with
    trace collection, splits failures and classifies them via qa-triage,
    evaluates the stability gate (ECR/EIR + mutation score + cost axis +
    regression-prevention guard), branches on the verdict, invokes the
    harness-optimize skill (proposer, terminal disabled) when proceeding,
    and escalates to the human operator via the algedonic channel when
    halted or stalled. Max 5 iterations with Cauchy convergence on
    (coverage, mutation-score, cost).
  editor: system
  visibility: Public

gas:
  cap: 120000
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

steps:
  - ordinal: 1
    action: execute
    command: "./scripts/test --trace"
    description: "Run all kask tests with trace collection to traces/<run-id>/"
    branching:
      success: 2
      failure: 2

  - ordinal: 2
    action: execute
    command: "qa-triage classify: parse nextest-output.json, split failures into failures/<test>/output.txt, run the qa-triage classifier on each, write failures/<test>/classifier.json"
    description: >
      Split failed tests into per-failure directories and classify each via
      the qa-triage classifier (failure_type, root_cause, confidence,
      is_real_bug). Consumes the existing nextest-output.json from step 1 —
      does NOT re-run tests. Degrades gracefully if the classifier or
      credentials are unavailable (no classifier.json written; the stability
      gate's eir_classifier component stays 0).
    branching:
      success: 3
      failure: 3

  - ordinal: 3
    action: execute
    command: "./scripts/stability-gate.sh <run-id-N> <run-id-N-1> [<run-id-N-2>] [<run-id-N-3>]"
    description: >
      Compute ECR/EIR/Acc from mutation testing (non-degenerate oracle) +
      regression-prevention guard (RR-*.yaml) + classifier (EIR secondary,
      diffs latest-vs-N-1) + cost axis (wall-clock duration normalized by
      HKASK_MAX_COST_SECONDS). Emits verdict: proceed, halt_escalate,
      stalled_escalate, regression_violated, or converged.
    branching:
      proceed: 4
      halt_escalate: 5
      stalled_escalate: 5
      regression_violated: 5
      converged: 6

  - ordinal: 4
    action: execute
    command: "Invoke harness-optimize skill with trace_dir_n and trace_dir_n_minus_1 as context."
    description: >
      Suite-level proposer reads raw traces, identifies under-tested areas,
      and proposes test improvements. Dispatches to proptest in generate_only
      mode for specific functions. Returns a proposed test diff. The proposer
      MUST NOT evaluate its own tests (self-confirming loop anti-pattern) —
      the profile binding below mechanically enforces terminal disabled.
    profile: ask
    branching:
      success: 7
      failure: 5

  - ordinal: 5
    action: execute
    command: "Emit RuntimeAlert{severity: Critical, escalated: true, domain: test-harness} via algedonic channel"
    description: >
      Algedonic escalation to the human operator via the MetacognitionLoop
      (toast + email). The alert distinguishes halt_escalate (EIR > 0),
      stalled_escalate (coverage climbing, mutation score flat), and
      regression_violated (an RR-*.yaml entry broke).
    terminal: true

  - ordinal: 6
    action: execute
    command: "echo '[harness] Converged — Cauchy criterion met on (coverage, mutation-score)'"
    description: >
      The test harness has stabilized — the weighted norm of
      (coverage, mutation-score) has been below epsilon for W=3
      consecutive iterations. Emit reg.harness.converged span.
    terminal: true

  - ordinal: 7
    action: loop
    command: "Increment iteration counter; if iteration < 5, re-enter at step 1"
    description: >
      Loop back to step 1 for the next improvement iteration. Max 5
      iterations — if the cap is reached without convergence, go to step 8.
    max_iterations: 5
    branching:
      success: 1
      loop_exhausted: 8

  - ordinal: 8
    action: execute
    command: "echo '[harness] Iteration cap (5) reached without Cauchy convergence'"
    description: >
      Unbounded improvement without convergence is an algedonic event, not a
      success. Emit reg.harness.iteration_cap_reached span + Critical
      RuntimeAlert. The operator must review the improvement trajectory.
    terminal: true

ledger:
  span_namespace: reg.skill.harness-evolve-cycle
  emit_spans: true