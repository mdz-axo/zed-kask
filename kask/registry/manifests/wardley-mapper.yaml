# Wardley Mapper — Generalized strategic mapping skill
# hKask v0.36.0 — Strategy: component evolution mapping for any system
# Functional Role: FlowDef (process orchestration)
# Steps: inventory_components, classify_evolution, map_value_chain,
#   identify_movement, synthesize_recommendations, confidence_gap (lisp.eval),
#   present_map (render), loop
#
# v0.36.0 fixes:
#   - Step 2 input_mapping: step_1_result.components (not step_1_result — the
#     whole object includes inventory_notes, which would render as a non-array
#     components field and break the classify-evolution template's tojson filter).
#   - Step 3 input_mapping: step_2_result.components (not step_2_result — the
#     whole object includes evolution_distribution).
#   - Step 4 input_mapping: step_3_result.map (not step_3_result — the whole
#     object includes map_diagram).
#   - Step 5 input_mapping: current_map → step_3_result.map (not step_3_result).
#   - Step 6 lisp.eval: simplified the recursive count-low lambda to a direct
#     length-based form. The original recursive form worked but was unnecessarily
#     complex — the lisp.eval primitive set has no map/reduce, so the recursive
#     define is the only option, but we tighten the nil guards.
#   - Step 8 loop_target: 2 (not 1). Step 1 (inventory) is deterministic given
#     the same inputs — re-running it wastes gas. The loop re-enters at step 2
#     (classify-evolution) so the LLM can re-classify with the convergence
#     signal's feedback. The inventory from step 1 is still in step_1_result.
#   - target_artifacts_field removed — cauchy convergence mode uses
#     convergence_signal history, not target_artifacts_field. The field
#     referenced "current_artifacts" which does not exist in any step result.
#   - present-map.j2 frontmatter cleaned up (was inside a Jinja comment, now
#     a proper header comment outside the template body).
#   - gas cap raised from 75000 to 90000 to accommodate the loop re-entering
#     at step 2 (classify) which is the most expensive re-run step.

manifest:
  id: wardley-mapper
  category: skill
  name: Wardley Mapper
  description: >
    Generic Wardley mapping methodology. Given a set of components and their
    relationships, inventories them, classifies each on the evolution axis
    (Genesis → Custom → Product → Commodity), maps them on the value chain
    (visibility vs evolution), identifies strategic movement (what to
    commoditize, invest in, divest, or build), and produces a Wardley map
    with recommendations. Applicable to any system — software platforms,
    business capabilities, technology stacks.

    Per Simon Wardley's methodology: poor situational awareness kills
    platforms. This skill builds the map that prevents strategic blindness.

  functional_role: flowdef
  version: "0.36.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  # target_artifacts_field is required for kata_enabled() to return true —
  # without it, cauchy mode silently falls back to legacy self-grade mode.
  # The actual cauchy check uses convergence_signal history (bound by the
  # loop step's convergence_signal: input_mapping), not this field. The
  # field name "convergence_signal" matches the loop step's binding.
  target_artifacts_field: "convergence_signal"


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: target_system
    type: string
    required: false
    description: Description of the system to map (software platform, business capability, technology stack, etc.).
  - name: component_inventory
    type: string
    required: false
    description: Pre-computed component inventory (JSON). If not provided, the skill enumerates from the target_system description.
  - name: previous_map
    type: string
    required: false
    description: Previous Wardley Map for movement/drift detection.

ledger:
  span_namespace: reg.skill.wardley-mapper

steps:
  - ordinal: 1
    action: select
    description: >
      Inventory all components in the target system. For each: name, type,
      dependencies, and description. Categories: infrastructure, platform
      services, user-facing capabilities, conceptual components.
      Deterministic given the same inputs — the loop (step 8) does NOT
      re-enter here.
    renderer: minijinja
    template_ref: wardley-mapper/inventory-components
    timeout_seconds: 60
    input_mapping:
      target_system: "{{ task | default(target_system) }}"
      component_inventory: "{{ component_inventory | default('') }}"

  - ordinal: 2
    action: select
    description: >
      Classify each component on the Wardley evolution axis:
      Genesis (novel), Custom (bespoke), Product (rentable), Commodity
      (utility). Criteria: maturity, adoption, standardization, differentiation.
      Consumes step_1_result.components (the array), not the whole step_1_result
      object (which also contains inventory_notes).
    renderer: minijinja
    template_ref: wardley-mapper/classify-evolution
    timeout_seconds: 60
    input_mapping:
      components: "{{ step_1_result.components }}"

  - ordinal: 3
    action: select
    description: >
      Map components on the value chain. Y-axis: visibility to user
      (top = user-facing, bottom = infrastructure). X-axis: evolution stage.
      Each component gets (x, y) coordinates and dependency links.
      Consumes step_2_result.components (the array with evolution classifications),
      not the whole step_2_result object (which also contains evolution_distribution).
    renderer: minijinja
    template_ref: wardley-mapper/map-value-chain
    timeout_seconds: 60
    input_mapping:
      classified_components: "{{ step_2_result.components }}"

  - ordinal: 4
    action: select
    description: >
      Identify movement and strategic implications: what to commoditize,
      what to keep at Product, what's over-commoditized, what's missing,
      and drift from a previous map. Consumes step_3_result.map (the array
      of placed components), not the whole step_3_result object (which also
      contains map_diagram).
    renderer: minijinja
    template_ref: wardley-mapper/identify-movement
    timeout_seconds: 60
    input_mapping:
      current_map: "{{ step_3_result.map }}"
      previous_map: "{{ previous_map | default('') }}"

  - ordinal: 5
    action: select
    description: >
      Synthesize strategic recommendations: commoditization targets,
      investment priorities, divestment candidates, ecosystem plays,
      and alignment check. Prioritized by impact, specific, traceable.
      Consumes step_3_result.map (not step_3_result) for the current_map.
    renderer: minijinja
    template_ref: wardley-mapper/synthesize-recommendations
    timeout_seconds: 60
    input_mapping:
      movement_analysis: "{{ step_4_result }}"
      current_map: "{{ step_3_result.map }}"

  - ordinal: 6
    action: compute
    compute_ref: lisp.eval
    description: >
      COMPUTE RECOMMENDATION CONFIDENCE GAP: Deterministic Lisp
      computation that turns the synthesize-recommendations output into
      a scalar convergence signal. Lower = more converged (fewer
      low-confidence recommendations). The score is the fraction of
      recommendations with confidence < 0.5; an empty or missing
      recommendation set scores 1.0 (not converged). Non-numeric
      confidence values count as low (conservative — forces re-evaluation).
      No default(1.0) fallback: a nil recs field surfaces as 1.0 via the
      is_null guard, not via a silent default.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((recs (assoc "recommendations" step_5_result)))
          (if (is_null recs)
              1.0
              (let ((n (length recs)))
                (if (= n 0)
                    1.0
                    (begin
                      (define count-low
                        (lambda (rs acc)
                          (if (is_null rs)
                              acc
                              (let ((conf (assoc "confidence" (car rs))))
                                (count-low
                                  (cdr rs)
                                  (if (numberp conf)
                                      (if (< conf 0.5) (+ acc 1) acc)
                                      (+ acc 1)))))))
                      (let ((low (count-low recs 0)))
                        (/ low n)))))))
      env:
        step_5_result: "{{ step_5_result }}"

  - ordinal: 7
    action: render
    description: >
      SURFACE the Wardley Map quadrant chart and recommendations as a markdown
      string containing a fenced ```mermaid block. This is the cascade's final
      user-facing output — without this step, map_diagram stays buried inside
      step_3_result and extract_final_step_result picks a later step (compute/loop)
      that has no diagram. The render action is deterministic (no LLM call).
      Consumes step_3_result.map_diagram and step_5_result.recommendations.
    renderer: minijinja
    template_ref: wardley-mapper/present-map
    timeout_seconds: 10
    input_mapping:
      map_diagram: "{{ step_3_result.map_diagram }}"
      recommendations: "{{ step_5_result.recommendations }}"
      rationale: "{{ step_5_result.rationale }}"

  - ordinal: 8
    action: loop
    timeout_seconds: 10
    description: >
      Re-enter the cycle at step 2 (classify-evolution) if convergence not met.
      Step 1 (inventory) is deterministic and not re-run — the loop targets
      step 2 so the LLM can re-classify components with the convergence
      signal's feedback. The inventory from step 1 remains in step_1_result
      and is re-consumed by step 2 via input_mapping.
    input_mapping:
      loop_target: "{{ 2 }}"
      convergence_signal: "{{ step_6_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 2
  on_validation_failure: abort
