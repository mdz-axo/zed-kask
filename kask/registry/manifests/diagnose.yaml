# Diagnose Process Manifest
# ℏKask v0.33.3 — Diagnosis as convergent PDCA

manifest:
  id: diagnose
  category: skill
  name: Diagnose
  description: >
    Convergent diagnosis process. Anchors the bug to functional requirements
    (MDS categories, FR# references), builds a deterministic feedback loop
    to reproduce the bug, generates ranked falsifiable hypotheses, instruments
    code with targeted probes, applies the fix with regression test, computes
    convergence, and iterates until root cause is confirmed and fix is validated.
  functional_role: flowdef
  version: "0.33.3"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: bug_description
    type: string
    required: true
  - name: crate_scope
    type: string
    required: false
  - name: symptom
    type: string
    required: false
  - name: code_context
    type: object
    required: false
  - name: spec_reference
    type: string
    required: false
  - name: fix_description
    type: string
    required: false
  - name: has_correct_seam
    type: boolean
    required: false

ledger:
  span_namespace: reg.skill.diagnose

steps:
  - ordinal: 1
    action: select
    description: >
      Anchor the bug to functional requirements: classify by MDS category,
      map symptom to FR# references, flag spec gaps.
    renderer: minijinja
    template_ref: diagnose/diagnose-spec-anchor.j2
    gas_cap: 3072
    timeout_seconds: 45
    input_mapping:
      bug_description: "{{ bug_description }}"
      symptom: "{{ symptom | default('') }}"
      code_context: "{{ code_context | default({}) }}"
      spec_reference: "{{ spec_reference | default('') }}"

  - ordinal: 2
    action: select
    description: Build deterministic repro loop for the target bug.
    renderer: minijinja
    template_ref: diagnose/diagnose-loop.j2
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      bug_description: "{{ bug_description }}"
      crate_scope: "{{ crate_scope | default('') }}"
      symptom: "{{ symptom | default('') }}"
      code_context: "{{ code_context | default({}) }}"

  - ordinal: 3
    action: select
    description: >
      Delegate falsifiable root-cause hypothesis generation to the falsifiability
      skill's hypothesize stage (the shared Chamberlin/Platt method). Generates
      3-7 ranked candidate root causes with forced diversity, Platt-form
      predictions, and falsifiers; discards vibes at generation.
    renderer: minijinja
    template_ref: falsifiability/falsifiability-hypothesize
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      admitted_target: "{{ symptom | default(bug_description, true) }}"
      domain: "bug diagnosis"
      context: "{{ code_context | default({}) }}"
      # Carry prior Lisp defects forward so the LLM repairs cumulatively.
      prior_defects: "{{ step_4_result | default([]) }}"

  # ── Step 4: Lisp deterministic step — hypothesis structural invariant check ──
  # Same four-invariant check as falsifiability/lisp-scaffold-reasoning:
  # count (3-7), completeness (prediction + falsifier keys), diversity
  # (>=2 distinct likelihoods), mutual exclusivity (no duplicate text).
  # Gates the instrumentation step (step 5) on structural validity — no point
  # instrumenting code for a hypothesis set missing falsifiers or with
  # insufficient diversity.
  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Lisp hypothesis invariant check. Deterministically evaluates all four
      structural invariants on the root-cause hypothesis set: count (3-7),
      completeness (every hypothesis has prediction + falsifier keys), diversity
      (>=2 distinct likelihoods), mutual exclusivity (no duplicate hypothesis
      text). Returns a list of defect strings. No LLM round-trip.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((hyps (assoc "hypotheses" step_3_result)))
          (if (is_null hyps)
              (list "no_hypotheses_field")
              (let ((n (length hyps)))
                (begin
                  (define count-defects
                    (if (< n 3)
                        (list "insufficient_count_below_3")
                        (if (> n 7)
                            (list "excessive_count_above_7")
                            (list))))
                  (define check-completeness
                    (lambda (hs acc)
                      (if (is_null hs)
                          acc
                          (let ((h (car hs)))
                            (let ((acc2 (if (is_null (assoc "prediction" h))
                                            (cons "missing_prediction" acc)
                                            acc)))
                              (let ((acc3 (if (is_null (assoc "falsifier" h))
                                              (cons "missing_falsifier" acc2)
                                              acc2)))
                                (check-completeness (cdr hs) acc3)))))))
                  (define completeness-defects (check-completeness hyps (list)))
                  (define check-diversity
                    (lambda (hs nh nm nl)
                      (if (is_null hs)
                          (let ((distinct (+ (if (> nh 0) 1 0) (if (> nm 0) 1 0) (if (> nl 0) 1 0))))
                            (if (< distinct 2)
                                (list "insufficient_diversity_below_2")
                                (list)))
                          (let ((h (car hs)))
                            (let ((lk (assoc "likelihood" h)))
                              (let ((is-high (string= lk "high")))
                                (let ((is-med (string= lk "medium")))
                                  (let ((is-low (string= lk "low")))
                                    (check-diversity
                                      (cdr hs)
                                      (if is-high (+ nh 1) nh)
                                      (if is-med (+ nm 1) nm)
                                      (if is-low (+ nl 1) nl))))))))))
                  (define diversity-defects (check-diversity hyps 0 0 0))
                  (define check-duplicates
                    (lambda (hs seen)
                      (if (is_null hs)
                          (list)
                          (let ((h (car hs)))
                            (let ((hyp-text (assoc "hypothesis" h)))
                              (let ((hyp-str (if (is_null hyp-text) "" hyp-text)))
                                (if (not (is_null (assoc hyp-str seen)))
                                    (cons "duplicate_hypothesis" (check-duplicates (cdr hs) seen))
                                    (check-duplicates (cdr hs) (cons (list hyp-str true) seen)))))))))
                  (define duplicate-defects (check-duplicates hyps (list)))
                  (append
                    count-defects completeness-defects
                    diversity-defects duplicate-defects)))))
      env:
        step_3_result: "{{ step_3_result }}"

  # ── Step 5: LLM probabilistic step — instrumentation, gated on Lisp verdict ──
  - ordinal: 5
    action: select
    condition: "{{ step_4_result | length == 0 }}"
    description: >
      Instrument code with targeted probes mapped to the top-ranked hypothesis.
      Gated on the Lisp hypothesis invariant check (step 4) — only runs when
      the hypothesis set is structurally valid.
    renderer: minijinja
    template_ref: diagnose/diagnose-instrument.j2
    gas_cap: 4096
    timeout_seconds: 45
    input_mapping:
      bug_description: "{{ bug_description }}"
      hypotheses: "{{ step_3_result.hypotheses | default([]) }}"
      selected_hypothesis: "{{ step_3_result.hypotheses[0].hypothesis | default('') }}"
      crate_scope: "{{ crate_scope | default('') }}"
      hypothesis_defects: "{{ step_4_result | default([]) }}"

  - ordinal: 6
    action: select
    description: Apply fix with regression test, verify repro no longer reproduces, clean up instrumentation.
    renderer: minijinja
    template_ref: diagnose/diagnose-fix.j2
    gas_cap: 6144
    timeout_seconds: 60
    input_mapping:
      bug_description: "{{ bug_description }}"
      hypothesis: "{{ step_3_result.hypotheses[0].hypothesis | default('') }}"
      fix_description: "{{ fix_description | default('') }}"
      crate_scope: "{{ crate_scope | default('') }}"
      has_correct_seam: "{{ has_correct_seam | default(true) }}"

  - ordinal: 7
    action: loop
    description: >
      Re-enter diagnosis cycle if convergence is not met; re-hypothesise on
      falsification. If the Lisp hypothesis check (step 4) found defects,
      re-enters at step 3 (hypothesize) so the LLM repairs the structural
      defects before instrumentation runs.
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 3 if (step_4_result | default([]) | length > 0) else 5 }}"
      # The convergence signal is the hypothesis-defect count from the Lisp
      # invariant check (step 4). Cauchy converges when the defect count
      # stabilizes (ideally at 0 — structurally sound hypotheses). Step 4
      # always runs, so the signal is always present; no default needed.
      convergence_signal: "{{ step_4_result | default([]) | length }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
