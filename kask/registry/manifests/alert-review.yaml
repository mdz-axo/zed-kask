# Alert Review — v0.33.0
#
# Closes the cybernetic feedback loop for algedonic alerts:
#   sense (CyberneticsLoop detects variety deficit / call-cap exhaustion /
#         regulatory plateau / action blocked) →
#   store (EscalationQueue on curator pod.db, wired via
#          BridgeAlertEscalationSink) →
#   review (this flowdef reads pending alerts + recent algedonic log) →
#   act (the resulting chat with the Curator resolves/dismisses alerts via
#        curator_escalation_resolve / curator_escalation_dismiss) →
#   close (EscalationStatus::Resolved/Dismissed + Regulation audit trail).
#
# The flowdef produces a triage report presented to the user. Further actions
# (resolve, dismiss, investigate) happen in the resulting chat with the
# Curator, who has the curator_escalation_resolve / curator_escalation_dismiss
# tools available.
#
# Runner readiness: PARTIAL — the select steps require runner with MCP tool
#   call support (curator_escalations, curator_algedonic_log). The report
#   step is a minijinja render executable today.

manifest:
  id: alert-review
  category: pipeline
  name: Alert Review
  functional_role: flowdef
  description: >
    Review pending algedonic alerts from the escalation queue and recent
    algedonic events from the RegulationArchive. Produces a triage report
    with issue, severity, proposed action, and status for each pending
    alert. The report is presented to the user; further actions (resolve,
    dismiss, investigate) happen in the resulting chat with the Curator.
  version: 0.33.0
  editor: system
  visibility: Public

# Energy Budget Configuration
gas:
  cap: 8192
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true

# Process Steps
steps:
  # Step 1: Gather pending alerts from the escalation queue.
  # Calls the curator MCP server's curator_escalations tool, which reads
  # the `escalations` table on the curator's pod.db (the same DB the
  # CyberneticsLoop writes to via BridgeAlertEscalationSink).
  - ordinal: 1
    action: select
    description: >
      List all pending escalations requiring review from the escalation
      queue. Each entry carries the alert message (output), structured
      alert fields (error_context JSON: domain/deficit/threshold/severity),
      confidence, and created_at timestamp.
    mcp: hkask-mcp-curator
    tool: curator_escalations
    gas_cap: 1000
    timeout_seconds: 10
    output_schema:
      type: object
      properties:
        count:
          type: integer
        escalations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              output:
                type: string
              confidence:
                type: number
              error_context:
                type: string
              created_at:
                type: string

  # Step 2: Gather recent algedonic events from the RegulationArchive for
  # context. This shows the recent alert history (last 24h) so the reviewer
  # can see patterns (repeated deficits, recurring plateaus).
  - ordinal: 2
    action: select
    description: >
      Read the algedonic event log for the last 24 hours from the
      RegulationArchive. Provides context for the pending alerts —
      recurring patterns, recent escalations, and the variety-deficit
      trajectory.
    mcp: hkask-mcp-curator
    tool: curator_algedonic_log
    bindings:
      hours: 24
    gas_cap: 1000
    timeout_seconds: 10
    output_schema:
      type: object
      properties:
        window_hours:
          type: integer
        count:
          type: integer
        events:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
              span:
                type: string
              phase:
                type: string
              observation:
                type: object

  # Step 3: Render the triage report from the gathered alerts and context.
  # The report is presented to the user; further actions happen in the
  # resulting chat with the Curator.
  - ordinal: 3
    action: populate
    description: >
      Compile the pending alerts and recent algedonic context into a
      markdown triage report. For each pending alert: issue, severity,
      proposed action (investigate / adjust threshold / dismiss), and
      status. The report is presented to the user.
    renderer: minijinja
    template_ref: regulation/alert-review-report.j2
    gas_cap: 2048
    timeout_seconds: 15
    output_schema:
      type: object
      properties:
        report:
          type: string
        pending_count:
          type: integer
        critical_count:
          type: integer
        warning_count:
          type: integer

# Error Handling
error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 2
  retry_backoff_seconds: 1
  on_capability_denied: escalate

# Regulation Monitoring
ledger:
  emit_spans: true
  span_namespace: reg.skill.alert-review
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

# Audit Trail
audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
