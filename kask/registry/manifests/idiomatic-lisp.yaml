# Idiomatic Lisp Process Manifest
# hKask v0.35.0 — Convergent Lisp design inquiry as PDCA
#
# Anchors a Lisp design problem against McCarthy/Sussman/Graham principles,
# proposes idiomatic solutions, adversarially challenges the proposal with
# REPL-grounded critique, and iterates until the critique score stabilizes.
# The loop re-enters at step 2 (Design), preserving the initial assessment
# from step 1 (Inquiry) across all iterations — the design problem and its
# principle-level assessment are frozen; only the proposed solution evolves.

manifest:
  id: idiomatic-lisp
  category: skill
  name: Idiomatic Lisp
  description: >
    Idiomatic Lisp design through the lens of McCarthy, Sussman, and Graham.
    Convergent inquiry loop: anchor design problems against Lisp's founding
    principles (homoiconicity, metacircularity, data-as-program), propose
    macro- and data-driven solutions with code examples, challenge and refine
    through adversarial review with REPL evaluation as the extrinsic oracle,
    and converge toward deeper, more idiomatic designs. Sibling to
    lean-prover — where lean-prover constructs machine-checked proofs,
    idiomatic-lisp constructs idiomatic designs verified by the REPL.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  target_artifacts_field: "idiomatic_lisp_verdict"
  on_not_reached: escalate


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: design_problem
    type: string
    required: false
  - name: design_constraints
    type: object
    required: false
  - name: code_context
    type: object
    required: false
  - name: lisp_dialect
    type: string
    required: false

steps:
  - ordinal: 1
    action: select
    description: >
      Assess the design problem against McCarthy/Sussman/Graham principles.
      Identify invariants, invalid states, evaluation models, and macro vs.
      function decisions. Produce a scored design assessment with specific
      improvement targets.
    renderer: minijinja
    template_ref: idiomatic-lisp/idiomatic-lisp-inquiry
    timeout_seconds: 180
    input_mapping:
      design_problem: "{{ task | default(design_problem) }}"
      design_constraints: "{{ design_constraints | default({}) }}"
      code_context: "{{ code_context | default({}) }}"
      lisp_dialect: "{{ lisp_dialect | default('common-lisp') }}"

  - ordinal: 2
    action: select
    description: >
      Propose idiomatic Lisp solutions with code examples. Apply homoiconicity,
      metacircular evaluation, data-as-program patterns, hygienic macros, and
      proper use of special forms. Reference CLHS, SRFI, and ecosystem best
      practices. Consumes the assessment from step 1.
    renderer: minijinja
    template_ref: idiomatic-lisp/idiomatic-lisp-design
    timeout_seconds: 180
    input_mapping:
      design_problem: "{{ design_problem }}"
      assessment: "{{ step_1_result }}"
      design_constraints: "{{ design_constraints | default({}) }}"
      lisp_dialect: "{{ lisp_dialect | default('common-lisp') }}"

  - ordinal: 3
    action: select
    description: >
      Adversarial review of the Lisp design proposal. Find gaps, test edge
      cases (tail-call depth, multiple-values, restarts, macro hygiene),
      challenge assumptions, identify deeper connections. Produce a scored
      critique with specific refinement directives. If the critique score is
      below threshold, the loop returns to step 2 (Design) with concrete
      targets.
    renderer: minijinja
    template_ref: idiomatic-lisp/idiomatic-lisp-challenge
    timeout_seconds: 180
    input_mapping:
      design_problem: "{{ design_problem }}"
      design_proposal: "{{ step_2_result }}"
      assessment: "{{ step_1_result }}"
      design_constraints: "{{ design_constraints | default({}) }}"

  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the critique score from the
      adversarial review step. Lower signal variance across iterations =
      convergence (Cauchy). Using lisp.eval instead of a Jinja expression
      makes the computation explicitly deterministic, budgeted
      (timeout_seconds: 10), and observable via a reg.skill.idiomatic-lisp span.
      Guards against a missing critique_score field by returning 0 when
      absent.
    timeout_seconds: 10
    input_mapping:
      # Guards against the step-3 LLM output not being a JSON object —
      # `assoc` errors with "type error: expected list, got string" when
      # step_3_result is prose/markdown (observed live: the skill returned a
      # degenerate signal instead of a report). Same guard class as the
      # essentialist convergence form (see essentialist_manifest_test.rs).
      form: >
        (if (not (listp step_3_result))
            0
            (let ((score (assoc "critique_score" step_3_result)))
              (if (is_null score) 0 score)))
      env:
        step_3_result: "{{ step_3_result | default({}) }}"

  - ordinal: 5
    action: loop
    description: Re-enter design cycle if the critique score has not stabilized.
    input_mapping:
      loop_target: "{{ 2 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 4). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_4_result }}"

error_handling:
  on_error: retry
  max_retries: 1
  retry_backoff_seconds: 1

ledger:
  emit_spans: true
  span_namespace: reg.skill.idiomatic-lisp
  telemetry_namespace: hkask.template.idiomatic-lisp
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_reg_events: true
