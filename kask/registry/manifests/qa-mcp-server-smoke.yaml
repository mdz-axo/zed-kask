manifest:
  id: qa-mcp-server-smoke
  category: qa-script
  name: QA Mcp Server Smoke
  version: 0.31.0
  visibility: Private
  description: 'Generic MCP server smoke test. Verifies binary existence, server startup, and graceful
    shutdown. Parameterized via CRATE_NAME environment variable. Default target: hkask-mcp-condenser.

    '
gas:
  cap: 15000
  alert_threshold: 0.8
  hard_limit: true
rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: 'CRATE=${CRATE_NAME:-hkask-mcp-condenser}; BIN=./target/debug/$CRATE; if [ -x "$BIN" ]; then
    echo "BINARY_OK: $BIN"; else echo "BINARY_MISSING: $BIN not found or not executable"; exit 1; fi'
  description: Verify MCP server binary exists and is executable
  retries: 0
  branching:
    success: 2
    failure: 6
- ordinal: 2
  action: run_command
  command: 'CRATE=${CRATE_NAME:-hkask-mcp-condenser}; BIN=./target/debug/$CRATE; $BIN & PID=$!; sleep
    2; if kill -0 $PID 2>/dev/null; then echo "SERVER_STARTED: pid=$PID"; kill $PID 2>/dev/null; wait
    $PID 2>/dev/null; else echo "SERVER_FAILED_TO_START"; exit 1; fi'
  description: Start MCP server, verify process is alive, then clean shutdown
  retries: 0
  branching:
    success: 3
    failure: 7
- ordinal: 3
  action: classify
  classifier: qa-triage
  description: MCP server smoke test result. Server binary exists, started successfully within 2 seconds,
    and accepted SIGTERM for clean shutdown. Classify as high-confidence normal if server startup and
    shutdown are nominal.
  retries: 0
  branching:
    high_confidence: 4
    medium_confidence: 4
    low_confidence: 5
    flake: 3
    unparseable: 5
- ordinal: 4
  action: run_command
  command: "echo \"[QA:smoke] PASS \u2014 ${CRATE_NAME:-hkask-mcp-condenser} binary OK, startup OK, shutdown\
    \ OK\""
  description: 'MCP server smoke test passed: binary + startup + shutdown all nominal'
  retries: 0
  terminal: true
- ordinal: 5
  action: run_command
  command: "echo \"[QA:smoke] WARN \u2014 classifier uncertain about ${CRATE_NAME:-hkask-mcp-condenser}\
    \ health. Manual review recommended.\""
  description: "Classifier returned low confidence on server health \u2014 manual review needed"
  retries: 0
  terminal: true
- ordinal: 6
  action: run_command
  command: "echo \"[QA:smoke] FAIL \u2014 ${CRATE_NAME:-hkask-mcp-condenser} binary not found. Run cargo\
    \ build -p ${CRATE_NAME:-hkask-mcp-condenser} first.\""
  description: "MCP server binary missing \u2014 build first"
  retries: 0
  terminal: true
- ordinal: 7
  action: run_command
  command: "echo \"[QA:smoke] FAIL \u2014 ${CRATE_NAME:-hkask-mcp-condenser} failed to start or died within\
    \ 2 seconds.\""
  description: "MCP server startup failure \u2014 check server logs for panic or bind errors"
  retries: 0
  terminal: true
ledger:
  emit_spans: true
  alert: qa.mcp.smoke
  span_namespace: reg.skill.qa-mcp-server-smoke
