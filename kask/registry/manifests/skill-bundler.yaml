# Skill Bundler Process Manifest
# ℏKask v0.33.0 — PKO RDF graph synthesis: decimate + fuse + recompose PDCA loops
# Template type: FlowDef — goal → compose → synthesize → validate → converge → evolve → loop
# Dual-axis ontological anchoring per P5.4 (PKO + DC+BIBO)

manifest:
  id: skill-bundler
  category: skill
  name: Skill Bundler
  description: >
    PKO RDF graph synthesis engine. Extracts a structured goal from user intent,
    composes skills into a candidate set, synthesizes them into a single optimized
    composite PKO Procedure through RDF graph decimation and recomposition,
    validates structural and ontological rules, computes convergence, evolves on
    goal delta, and iterates until the composite is optimally formed.
  functional_role: flowdef
  version: 0.33.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: skill_names
    type: array
    description: "Skills to compose"
    required: true
  - name: user_intent
    type: string
    description: "User intent — what the bundle should achieve. Feeds goal extraction."
    required: true
  - name: existing_bundles
    type: array
    description: "Existing bundle manifests for smart matching"
    required: false
  - name: skill_manifests
    type: array
    description: "Pre-loaded skill FlowDef manifests for RDF graph synthesis. Absent when manifests are unavailable (graceful degradation)."
    required: false
  - name: goal_verdict
    type: object
    description: "Previous goal verdict from bundle execution (for recomposition). Absent on initial composition."
    required: false

steps:
  - ordinal: 1
    action: select
    description: Extract structured goal from user intent with explicit completion criteria.
    renderer: minijinja
    template_ref: goal-analysis/create
    gas_cap: 5000
    timeout_seconds: 60
    input_mapping:
      user_intent: "{{ user_intent }}"

  - ordinal: 2
    action: select
    description: Compose a candidate skill set with PKO-anchored ordering from provided skills and goal context. On recomposition iterations, uses the evolved manifest as a base.
    renderer: minijinja
    template_ref: skill-bundler/bundler-compose
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      skill_names: "{{ skill_names }}"
      existing_bundles: "{{ existing_bundles | default([]) }}"
      goal: "{{ step_1_result }}"
      previous_manifest: "{{ step_7_result.evolved_manifest | default(none) }}"

  - ordinal: 3
    action: select
    description: Synthesize the composed skills into a single optimized composite PKO Procedure. Parse each skill's PDCA graph into RDF triples, detect isomorphic substructures, decimate redundant nodes, fuse shared patterns, and generate novel loop structures.
    renderer: minijinja
    template_ref: skill-bundler/bundler-synthesize
    gas_cap: 8192
    timeout_seconds: 90
    input_mapping:
      composed_skills: "{{ step_2_result.bundle_manifest.skills }}"
      goal: "{{ step_1_result }}"
      skill_manifests: "{{ skill_manifests | default([]) }}"

  - ordinal: 4
    action: select
    description: Validate the synthesized composite manifest against composition rules and ontological anchoring requirements.
    renderer: minijinja
    template_ref: skill-bundler/bundler-validate
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      bundle_manifest: "{{ step_3_result.candidates[0].composite_manifest }}"

  # ── Deterministic compute: lisp.eval is available for custom logic ──
  #
  # In addition to the built-in compute_refs (lisp.eval for signal computation,
  # kata.object_gap, kata.process_gap, kata.hypotenuse, etc.), skill
  # authors can use `compute_ref: lisp.eval` to write custom deterministic
  # logic inline in the manifest — no Rust change needed. The sandboxed
  # Lisp interpreter supports arithmetic, conditionals, list ops, and
  # lambda. Supports infix: `a + b` = `(+ a b)`. Example:
  #
  #   - ordinal: N
  #     action: compute
  #     compute_ref: lisp.eval
  #     input_mapping:
  #       form: "(if (< gap 0.1) 1 0)"  # prefix; also supports infix: "gap < 0.1"
  #       env:
  #         gap: "{{ step_1_result.convergence_metric }}"
  #       max_steps: 10000
  #       max_depth: 32
  #
  # Use cases: custom convergence formulas, weighted scoring, data
  # transformation between steps, filtering findings by threshold.
  # Security: gated to category: skill manifests only (human-reviewed).
  - ordinal: 5
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence score from the validation step's actual
      output. The bundler-validate template produces `violations`, `warnings`,
      and `ontology_gaps` arrays; the sum of their lengths is the distance from
      a valid, fully-anchored composite. Lower = more converged. Replaces the
      phantom `convergence_metric` binding that silently defaulted to 1.0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((v (length (assoc "violations" step_4_result)))
              (w (length (assoc "warnings" step_4_result)))
              (o (length (assoc "ontology_gaps" step_4_result))))
          (+ 0.0 (+ v w) o))
      env:
        step_4_result: "{{ step_4_result }}"

  - ordinal: 6
    action: select
    description: Evolve the composite via goal-delta-driven recomposition when convergence has not been met.
    renderer: minijinja
    template_ref: skill-bundler/bundler-evolve
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      bundle_name: "{{ step_3_result.candidates[0].name | default('composite-skill') }}"
      current_manifest: "{{ step_3_result.candidates[0].composite_manifest }}"
      changed_skills: "{{ step_2_result.bundle_manifest.skills }}"
      goal_context: "{{ step_1_result }}"
      goal_delta: "{{ step_6_result.goal_delta | default(1.0) }}"
      convergence_failure_reason: "{{ step_6_result.rationale }}"

  - ordinal: 7
    action: loop
    description: Re-enter composition cycle if convergence threshold was not met after evolution.
    input_mapping:
      loop_target: "{{ 2 }}"
      convergence_signal: "{{ step_5_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.skill-bundler
  telemetry_namespace: hkask.template.skill-bundler
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
