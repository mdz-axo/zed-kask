# Skill Bundler Process Manifest
# hKask v0.35.0 — Parallel fan-out + merge
#
# The bundler runs each skill concurrently, then merges their outputs into a
# single unified report. There is no iterative composition, PKO graph
# synthesis, or convergence loop — the parallel execution happens in Rust
# (BridgeManifestExecutor::compose_and_execute_bundle), and this manifest
# handles only the merge step.

manifest:
  id: skill-bundler
  category: skill
  name: Skill Bundler
  description: >
    Run peer-level skills concurrently and merge their outputs into a single
    unified report. The bundler does not compose or iterate — it dispatches
    each skill in parallel, collects results, and synthesizes them.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  # Single-pass merge — no PDCA loop. Legacy mode (empty convergence_mode)
  # with max_iterations: 1 so the executor runs once and exits. The
  # parallel fan-out happens in Rust (BridgeManifestExecutor::compose_and_execute_bundle);
  # this manifest only renders the merge step.
  convergence_mode: ""
  max_iterations: 1
  min_iterations: 1
  on_not_reached: proceed


rjoule:
  cap: 5
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: skill_names
    type: array
    description: "Skills that were executed in parallel"
    required: true
  - name: task
    type: string
    description: "The user's task — what the bundle was asked to achieve"
    required: true
  - name: skill_outputs
    type: array
    description: "Outputs from each skill, in the same order as skill_names"
    required: true

steps:
  - ordinal: 1
    action: select
    description: >
      Merge the parallel skill outputs into a single unified report with
      per-skill summaries, cross-skill insights, conflicts, and prioritized
      recommendations.
    renderer: minijinja
    template_ref: skill-bundler/bundler-merge
    timeout_seconds: 180
    input_mapping:
      skill_names: "{{ skill_names }}"
      task: "{{ task }}"
      skill_outputs: "{{ skill_outputs }}"

error_handling:
  on_timeout: retry
  on_parse_failure: retry
  max_retries: 2
  retry_backoff_seconds: 2
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.skill-bundler
  telemetry_namespace: hkask.template.skill-bundler
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_reg_events: true