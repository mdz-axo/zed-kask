# Replica Discovery Manifest
# hKask v0.34.0 — Replica Corpus Discovery & Generation Pipeline
#
# Composable skill for discovering an author's body of work across multiple
# sources and generating a corpus.yaml for corpus_build_persona. Supports
# single-author and compound (mashup) replicas across three classes:
# academic, literary, and exemplar/theme.
#
# Supports two modes:
#   - agentic: Fully automated discovery → corpus generation
#   - curated: Human-in-the-loop — presents candidates for confirmation at each phase
#
# PDCA loop: disambiguate → enumerate (Semantic Scholar, arXiv, web, YouTube)
#   → extract content → cache to disk → extract transcripts
#   → extract concepts (LLM dedup) → infer methods (LLM)
#   → generate corpus.yaml → validate against CorpusConfig → Curator gate
#   → Regulation feedback → (iterate if Curator modifies or validation fails)
#
# Budget policy: Infrastructure activities (template rendering, YAML
# generation, validation) are budgeted generously — they are cheap, local,
# and load-bearing for downstream quality. Search/extraction (network I/O)
# remains tightly budgeted. See gas/rjoule blocks below.
#
# NOTE (2026-08-08): This manifest was rewritten to match the executor's
# actual schema. The prior version used `arguments:`/`tool:`/`loop_over:`
# fields that `BundleManifestStep` does not define (serde silently drops
# unknown fields), and `${input.*}` interpolation that the executor never
# performs (only `{{ }}` and `$ref` are resolved). Every `execute` step
# was silently no-op'ing its tool call (no `input_mapping` → empty input)
# and every condition was always-false (literal `${...}` never matched).
# The rewrite:
#   - `arguments:` → `input_mapping:` (the executor's binding field)
#   - `tool:` + `mcp: server` → `mcp: "server/tool"` (the executor's mcp ref)
#   - `${input.x}` → `{{ input.x }}` (the executor's interpolation form)
#   - `loop_over:` removed — the executor does not support per-item
#     iteration in `execute` steps. Steps 6/7/8 now operate on the full
#     merged array (the tool receives the array; per-item fan-out is the
#     MCP server's responsibility, not the executor's).
#   - `feedback:` field on ordinal 16 removed — not a `BundleManifestStep`
#     field. The `feedback` action alias routes to `execute_tool_invoke`,
#     which uses `mcp:` + `input_mapping:`.

manifest:
  id: mcp/replica-discovery
  category: pipeline
  name: Replica Discovery
  description: >
    Multi-source replica discovery pipeline. Given an author name (or a set
    of author names for compound replicas), disambiguates identity, enumerates
    works across Semantic Scholar, arXiv, web search, and YouTube transcripts,
    extracts and caches content, extracts key concepts and methodological
    patterns via LLM, generates a corpus.yaml, validates it against the
    CorpusConfig contract, and presents it for Curator approval. Supports
    three replica classes: academic, literary, and exemplar/theme.
  version: "0.34.0"
  functional_role: flowdef
  editor: curator-or-human-admin
  visibility: Public

# ── Convergence (PDCA loop control) ─────────────────────────────────────────
# The pipeline iterates if the Curator modifies the corpus (Phase 11) or if
# validation fails (Phase 10.5). Convergence is reached when the corpus.yaml
# validates and the Curator approves (or agentic mode skips the gate).
# Effort scales max_iterations: low=1, medium=3, high=5.
convergence:
  convergence_mode: ""
  # No convergence-check compute step: the loop runs N iterations then escalates.
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  # target_artifacts_field removed — no compute step to consume it

# ── Budget policy ───────────────────────────────────────────────────────────
# Infrastructure activities (template rendering, YAML generation, validation)
# are budgeted generously — they are cheap, local, and load-bearing for
# downstream quality. Network I/O (search, extraction) remains tightly
# budgeted. The total cap accommodates the validation step and iteration loop.
#
# Effort scales the gas cap: low=30000, medium=40000, high=60000.
# Per-step infrastructure caps (render, validate, converge) get 2× the prior
# cap at medium, 3× at high. Network steps keep their existing caps regardless.
gas:
  cap: 150000
  alert_threshold: 0.85
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.85
  hard_limit: true

steps:
  # ── Phase 1: Name Disambiguation ────────────────────────────────────────
  - ordinal: 1
    action: execute
    description: >
      Phase 1: Disambiguate author identity. Search across multiple sources
      to confirm the correct person. In curated mode, present candidates to
      the Curator for confirmation.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-research/web_search"
    gas_cap: 4096
    timeout_seconds: 30
    input_mapping:
      query: "{{ input.author_name }} academic publications university"
      strategy: "deep"
      num_results: 10
    output_schema:
      results: array
      answer_box: object

  # ── Phase 2: Academic Paper Search ───────────────────────────────────────
  - ordinal: 2
    action: execute
    description: >
      Phase 2a: Search Semantic Scholar for papers by this author.
      Returns structured paper metadata with abstracts, citations, and PDF links.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-research/web_search"
    gas_cap: 4096
    timeout_seconds: 30
    input_mapping:
      query: "{{ input.author_name }}"
      strategy: "web"
      num_results: "{{ input.max_works }}"
    output_schema:
      results: array

  - ordinal: 3
    action: execute
    description: >
      Phase 2b: Search arXiv for preprints by this author.
      Uses arXiv's author search syntax.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-research/web_search"
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      query: "au:{{ input.author_name_lower }}"
      strategy: "web"
      num_results: "{{ input.max_works }}"
    output_schema:
      results: array

  # ── Phase 3: Web + Institutional Content ─────────────────────────────────
  - ordinal: 4
    action: execute
    description: >
      Phase 3 (conditional): Search the open web for institutional pages,
      interviews, and other content by or about the author.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-research/web_search"
    condition: "{{ input.include_web }}"
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      query: "{{ input.author_name }} faculty page institutional profile"
      strategy: "web"
      num_results: 5
    output_schema:
      results: array

  # ── Phase 4: YouTube Transcript Discovery ─────────────────────────────────
  - ordinal: 5
    action: execute
    description: >
      Phase 4 (conditional): Search for YouTube videos featuring the author
      (talks, interviews, lectures). Returns video URLs that can be fed to
      the transcript extraction step.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-research/web_search"
    condition: "{{ input.include_transcripts }}"
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      query: "{{ input.author_name }} interview talk lecture"
      strategy: "web"
      num_results: 5
      include_domains: ["youtube.com"]
    output_schema:
      results: array

  # ── Phase 5: Content Extraction ──────────────────────────────────────────
  - ordinal: 6
    action: execute
    description: >
      Phase 5: Extract full content from discovered works.
      The merged results from phases 2-4 are passed as an array; the research
      server's extraction pipeline handles per-work fan-out. PDFs are handled
      by the research server's extraction pipeline.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-research/web_extract"
    gas_cap: 8192
    timeout_seconds: 120
    input_mapping:
      urls: "{{ [step_2_result.results, step_3_result.results, step_4_result.results] | flatten }}"
      format: "markdown"
      main_content_only: true
    output_schema:
      extracted_pages: array

  # ── Phase 6: Cache Extracted Content to Disk ─────────────────────────────
  - ordinal: 7
    action: execute
    description: >
      Phase 6: Write extracted content to the cache directory so corpus_build_persona
      can skip re-downloading. The corpus server handles per-work caching from
      the extracted_pages array.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-corpus/corpus_cache_work"
    gas_cap: 2048
    timeout_seconds: 30
    input_mapping:
      works: "{{ step_6_result.extracted_pages }}"
      cache_dir: "{{ input.cache_dir }}"
    output_schema:
      cached_works: array

  # ── Phase 7: Transcript Extraction ───────────────────────────────────────
  - ordinal: 8
    action: execute
    description: >
      Phase 7 (conditional): Extract transcripts from discovered YouTube videos.
      The research server handles per-video fan-out from the youtube_urls array.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-research/web_search"
    condition: "{{ input.include_transcripts }}"
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      youtube_urls: "{{ step_5_result.results | selectattr('url', 'match', 'youtube.com') | map(attribute='url') | list }}"
      strategy: "quick"
      num_results: 1
    output_schema:
      transcripts: array

  # ── Phase 8: Concept Extraction ──────────────────────────────────────────
  - ordinal: 9
    action: select
    description: >
      Phase 8: Extract key concepts, places, and events from paper metadata
      using LLM semantic deduplication. Renders the extract-concepts template
      with paper titles and abstracts, then calls inference to produce
      structured entities for the corpus YAML.
    renderer: minijinja
    template_ref: replica/extract-concepts
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      papers: "{{ [step_2_result.results, step_3_result.results] | flatten }}"
      author_name: "{{ input.author_name }}"
    output_schema:
      concepts: array
      places: array
      events: array

  # ── Phase 9: Method Inference ────────────────────────────────────────────
  - ordinal: 10
    action: select
    description: >
      Phase 9 (default on): Infer methodological and stylistic patterns from
      representative passages of the author's work. Renders the infer-methods
      template with sample passages, then calls inference to produce method
      definitions with stylometric signal thresholds.
    renderer: minijinja
    template_ref: replica/infer-methods
    condition: "{{ input.include_methods }}"
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      passages: "{{ step_6_result.extracted_pages }}"
      author_name: "{{ input.author_name }}"
    output_schema:
      methods: array

  # ── Phase 10: Corpus YAML Generation ─────────────────────────────────────
  - ordinal: 11
    action: populate
    description: >
      Phase 10: Generate corpus.yaml from all discovered works, extracted
      concepts, and inferred methods. Renders the class-appropriate template
      (academic-corpus, literary-corpus, or exemplar-corpus) with collected
      metadata. For compound replicas, merges works from all authors and
      combines foundational_rules and dimension_centroids per the mashup
      spec. In curated mode, presents the generated config for Curator
      approval before proceeding to build.
    renderer: minijinja
    template_ref: "{{ input.replica_class_template | default('replica/academic-corpus') }}"
    gas_cap: 4000
    timeout_seconds: 15
    input_mapping:
      works: "{{ [step_2_result.results, step_3_result.results, step_4_result.results] | flatten }}"
      concepts: "{{ step_9_result.concepts | default([]) }}"
      methods: "{{ step_10_result.methods | default([]) }}"
      author_name: "{{ input.author_name }}"
    output_schema:
      corpus_yaml: string
      works_count: integer
      sources: array

  # ── Phase 10.5: Corpus Validation (Check phase of PDCA) ──────────────────
  # Validates the generated corpus.yaml against the CorpusConfig contract.
  # This is the automated quality gate that runs regardless of mode — even
  # in agentic mode, a malformed corpus.yaml is caught here before it reaches
  # corpus_build_persona. The validation calls EmbedService::parse_config on
  # the rendered YAML and reports parse success/failure plus field coverage.
  - ordinal: 12
    action: execute
    description: >
      Phase 10.5: Validate the generated corpus.yaml against the CorpusConfig
      contract. Parses the rendered YAML via EmbedService::parse_config and
      reports whether it conforms to #[serde(deny_unknown_fields)]. This is
      the automated Check phase of the PDCA loop — it catches template drift,
      missing required fields, and shape mismatches before the corpus reaches
      corpus_build_persona.
    renderer: minijinja
    template_ref: replica/validate-corpus
    mcp: "hkask-mcp-corpus/validate_corpus"
    gas_cap: 4000
    timeout_seconds: 15
    input_mapping:
      corpus_yaml: "{{ step_11_result.corpus_yaml }}"
    output_schema:
      parse_success: boolean
      error_message: string
      fields_present: array
      fields_missing: array
      convergence_metric: number

  # ── Phase 11: Curator Confirmation Gate (curated mode only) ──────────────
  # NOTE: This step was previously `action: choice` with a `choices:` field and
  # `condition: ${input.mode == 'curated'}`. Both were silently dropped:
  # `BundleManifestStep` has no `choices` field (serde drops unknown fields),
  # and the condition renderer only handles `{{ }}`, not `${ }`. The step was
  # always skipped (condition always false) and never branched. Rewritten to
  # use the executor's production routing mechanism: `select` + `branching`,
  # which 12 manifests in the registry use successfully. The `condition` uses
  # `{{ }}` rendering so the gate fires when `input.mode` is `curated`.
  - ordinal: 13
    action: select
    description: >
      Phase 11 (curated mode only): Present discovered works, extracted
      concepts, inferred methods, generated corpus.yaml, and validation
      results to the Curator for review. Curator can approve, modify (loops
      back to Phase 10), or abort. In agentic mode, this step is skipped and
      the pipeline proceeds to Regulation feedback if validation passed.
    renderer: minijinja
    template_ref: replica/curator-confirmation-gate
    condition: "{{ input.mode }} == 'curated'"
    gas_cap: 500
    timeout_seconds: 300
    input_mapping:
      works: "{{ [step_2_result.results, step_3_result.results, step_4_result.results] | flatten }}"
      concepts: "{{ step_9_result.concepts | default([]) }}"
      methods: "{{ step_10_result.methods | default([]) }}"
      corpus_yaml: "{{ step_11_result.corpus_yaml }}"
      validation: "{{ step_12_result }}"
    output_schema:
      decision: string
      approved_works: array
      convergence_metric: number
    branching:
      approve: 14
      modify: 11
      abort: 16

  # ── Phase 12.5: Convergence Score Computation ────────────────────────────
  # Computes a real structural-validity score from the validation step's
  # actual output (fields_missing count), replacing the phantom
  # convergence_metric binding that silently defaulted to 1.0.
  - ordinal: 14
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 12's actual validation
      output. The convergence signal is the count of missing required
      fields: length(fields_missing). Lower = more converged (zero missing
      = corpus.yaml validates against the CorpusConfig contract). If
      fields_missing is absent, the form errors (no silent default),
      surfacing a broken validation step rather than masking it with a
      flat 1.0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: "(let ((m (assoc \"fields_missing\" step_12_result))) (if (is_null m) 0 (length m)))"
      env:
        step_12_result: "{{ step_12_result }}"

  # ── Phase 13: Convergence Check ──────────────────────────────────────────
  # Convergence is determined by the Cauchy criterion on the validation
  # convergence_metric. If validation failed or the Curator chose modify,
  # the pipeline loops back to Phase 10 (corpus generation). If validation
  # passed and the Curator approved (or agentic mode skipped the gate), the
  # pipeline proceeds to Regulation feedback.
  - ordinal: 15
    action: loop
    description: >
      Phase 13: Convergence check. If the corpus validated successfully and
      the Curator approved (or agentic mode), proceed to Regulation feedback.
      If validation failed or the Curator chose modify, re-enter at Phase 10
      (corpus generation) with the prior results preserved.
    input_mapping:
      loop_target: "{{ 11 }}"
      # Push the validation convergence metric into convergence_signal so the
      # Cauchy criterion can detect when the iterates have stopped moving.
      convergence_signal: "{{ step_14_result }}"

  # ── Phase 14: Regulation Feedback ─────────────────────────────────────────
  - ordinal: 16
    action: feedback
    description: >
      Emit discovery outcome to Regulation. Track variety, source coverage,
      works discovered, concepts extracted, and methods inferred.
      The `feedback` action alias routes to `execute_tool_invoke`, which
      uses `mcp:` + `input_mapping:`. The prior `feedback:` field was not a
      `BundleManifestStep` field and was silently dropped.
    renderer: null
    template_ref: null
    mcp: "hkask-mcp-regulation/record_outcome"
    gas_cap: 500
    timeout_seconds: 5
    input_mapping:
      variety_delta: "{{ step_9_result.concepts | length | default(0) }}"
      works_discovered: "{{ [step_2_result.results, step_3_result.results, step_4_result.results] | flatten | length | default(0) }}"
      concepts_extracted: "{{ step_9_result.concepts | length | default(0) }}"
      methods_inferred: "{{ step_10_result.methods | length | default(0) }}"
      sources_used: ["semantic_scholar", "arxiv", "web", "youtube"]
    output_schema:
      reg_event_id: string
      outcome_recorded: boolean

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 2
  retry_backoff_seconds: 2
  on_capability_denied: escalate

ledger:
  emit_spans: true
  span_namespace: reg.skill.mcp-replica-discovery
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
