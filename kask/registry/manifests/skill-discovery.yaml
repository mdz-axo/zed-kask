# Skill Discovery Process Manifest
# ℏKask v0.31.0 — Gap discovery and candidate evaluation as PDCA
# Template type: FlowDef — detect gap + evaluate + convergence loop

manifest:
  id: skill-discovery
  category: skill
  name: Skill Discovery
  description: >
    Convergent discovery process for capability gaps. Detects gaps in the
    skill corpus, searches the catalog for candidates, evaluates candidates
    against format/quality/safety criteria, computes convergence, and iterates
    until the gap is sufficiently resolved.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: task_patterns
    type: array
    description: "Task patterns requiring coverage"
    required: false
  - name: skill_catalog
    type: array
    description: "Installed skill catalog (same array passed to skill-router and skill-discovery-search)"
    required: false
  - name: candidate_skill_content
    type: string
    description: "Candidate skill content to evaluate"
    required: false

steps:
  - ordinal: 1
    action: select
    description: Detect and prioritize capability gaps in the corpus.
    renderer: minijinja
    template_ref: skill-discovery/skill-discovery-detect-gap
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      task_patterns: "{{ task_patterns | default([]) }}"
      skill_catalog: "{{ skill_catalog | default([]) }}"

  - ordinal: 2
    action: select
    description: Search the skill catalog for candidates matching the top-priority gap.
    renderer: minijinja
    template_ref: skill-discovery/skill-discovery-search
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      gap_description: "{{ step_1_result.gap_list[0].description | default('') }}"
      skill_catalog: "{{ skill_catalog | default([]) }}"
      max_candidates: 5

  - ordinal: 3
    action: select
    description: Evaluate a candidate skill against format/quality/safety gates.
    renderer: minijinja
    template_ref: skill-discovery/skill-discovery-evaluate
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      candidate_skill_content: "{{ candidate_skill_content | default('') }}"

  # ── Deterministic compute: lisp.eval is available for custom logic ──
  #
  # In addition to the built-in compute_refs (kata.convergence_check,
  # kata.object_gap, kata.process_gap, kata.hypotenuse, etc.), skill
  # authors can use `compute_ref: lisp.eval` to write custom deterministic
  # logic inline in the manifest — no Rust change needed. The sandboxed
  # Lisp interpreter supports arithmetic, conditionals, list ops, and
  # lambda. Example:
  #
  #   - ordinal: N
  #     action: compute
  #     compute_ref: lisp.eval
  #     input_mapping:
  #       form: "(if (< gap 0.1) 1 0)"  # prefix; also supports infix: "gap < 0.1"
  #       env:
  #         gap: "{{ step_1_result.convergence_metric | default(1.0) }}"
  #       max_steps: 10000
  #       max_depth: 32
  #
  # Use cases: custom convergence formulas, weighted scoring, data
  # transformation between steps, filtering findings by threshold.
  # Security: gated to category: skill manifests only (human-reviewed).
  - ordinal: 4
    action: compute
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 5
    action: loop
    description: Re-enter discovery cycle if convergence threshold is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Carry convergence context into the next iteration.
      kata_hypotenuse: "{{ step_3_result.convergence_metric | default(1.0) }}"
      previous_blockers: "{{ step_3_result.blockers | default([]) }}"
      previous_metric: "{{ step_3_result.convergence_metric | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: skill-discovery/skill-discovery-detect-gap
      gas_budget: 6000
    - resource: template
      action: render
      template_id: skill-discovery/skill-discovery-evaluate
      gas_budget: 6000
    - resource: manifest
      action: execute
      template_id: skill-discovery
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true

ledger:
  emit_spans: true
  span_namespace: reg.skill.skill-discovery
  telemetry_namespace: hkask.template.skill-discovery
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
