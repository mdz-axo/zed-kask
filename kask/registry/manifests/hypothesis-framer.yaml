# Hypothesis Framer Process Manifest
# ℏKask v0.34.0 — FINER + PICO research framing as convergent PDCA

manifest:
  id: hypothesis-framer
  category: skill
  name: Hypothesis Framer
  description: >
    Convergent research framing process. Evaluates broad topics against FINER
    criteria (Feasible, Interesting, Novel, Ethical, Relevant), structures
    questions via PICO (Population, Intervention, Comparison, Outcome),
    formulates testable hypotheses with null hypothesis derivation, operationalizes
    into aims and objectives with alignment verification, computes convergence,
    and iterates until the question-hypothesis-aims chain is coherent and
    decision-ready.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: broad_topic
    type: string
    required: false
  - name: domain
    type: string
    required: true
  - name: research_context
    type: string
    required: false
  - name: question_hint
    type: string
    required: false
  - name: population_hints
    type: string
    required: false

ledger:
  span_namespace: reg.skill.hypothesis-framer

steps:
  - ordinal: 1
    action: select
    description: >
      Apply FINER criteria to evaluate and refine the broad research topic
      into a well-formed research question. Assess feasibility, interest,
      novelty, ethics, and relevance. Produce per-dimension scores with
      rationale and refinement suggestions.
    renderer: minijinja
    template_ref: hypothesis-framer/finer-evaluate
    gas_cap: 6000
    timeout_seconds: 180
    input_mapping:
      broad_topic: "{{ task | default(broad_topic) }}"
      domain: "{{ domain }}"
      research_context: "{{ research_context | default('') }}"
      question_hint: "{{ question_hint | default('') }}"

  - ordinal: 2
    action: select
    description: >
      Apply PICO framework to structure the refined research question.
      Identify Population characteristics, Intervention/exposure,
      Comparison/control, and Outcome measures. Produce a structured
      question and completeness assessment.
    renderer: minijinja
    template_ref: hypothesis-framer/pico-structure
    gas_cap: 6000
    timeout_seconds: 180
    input_mapping:
      research_question: "{{ step_1_result.research_question | default('') }}"
      domain: "{{ domain }}"
      finer_result: "{{ step_1_result | default({}) }}"
      population_hints: "{{ population_hints | default('') }}"

  # ── Step 3: Lisp deterministic step — PICO structural completeness check ──
  # The LLM self-assesses PICO completeness in step 2's `pico_completeness`
  # field, but LLMs are unreliable at checking their own output for structural
  # completeness (they often report "complete" when a field is empty or
  # generic). This Lisp step deterministically verifies that all four PICO
  # keys (population, intervention, comparison, outcome) are present and
  # non-null in step_2_result. Returns a list of defect strings — empty =
  # passed, non-empty = step 4 (operationalize) is gated on the LLM repairing
  # the missing elements first.
  #
  # This is the symbolic-neural scaffolding pattern from lisp-scaffold-reasoning
  # applied to PICO: deterministic Lisp prunes the LLM's probabilistic PICO
  # output before the expensive operationalize step runs.
  - ordinal: 3
    action: compute
    compute_ref: lisp.eval
    description: >
      Lisp PICO completeness check. Deterministically verifies all four PICO
      elements (population, intervention, comparison, outcome) are present and
      non-null in the PICO step's output. Returns a list of defect strings.
      No LLM round-trip.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (begin
          (define check-key
            (lambda (key)
              (let ((val (assoc key step_2_result)))
                (if (is_null val)
                    (list (concat "missing_" key))
                    (list)))))
          (append
            (check-key "population")
            (check-key "intervention")
            (check-key "comparison")
            (check-key "outcome")))
      env:
        step_2_result: "{{ step_2_result }}"

  # ── Step 4: LLM probabilistic step — operationalize, gated on Lisp verdict ──
  # Only runs if the Lisp PICO check passed (no missing elements). If the Lisp
  # step found defects, the loop (step 6) re-enters at step 2 (PICO) so the LLM
  # can repair the missing elements. This gates the expensive operationalize
  # step on structural validity — no point deriving hypotheses from an
  # incomplete PICO frame.
  - ordinal: 4
    action: select
    condition: "{{ step_3_result | length == 0 }}"
    description: >
      Single cognitive act: derive a testable hypothesis, formulate the null
      hypothesis, classify type, operationalize into research aims and
      objectives, assess testability against the specified objectives, verify
      five-link alignment, and recheck feasibility. Merged step — because you
      cannot assess testability without knowing the objectives. Gated on the
      Lisp PICO completeness check (step 3) — only runs when all four PICO
      elements are structurally present.
    renderer: minijinja
    template_ref: hypothesis-framer/hypothesis-operationalize
    gas_cap: 8000
    timeout_seconds: 180
    input_mapping:
      structured_question: "{{ step_2_result.structured_question | default('') }}"
      pico_elements: "{{ step_2_result | default({}) }}"
      domain: "{{ domain }}"
      finer_result: "{{ step_1_result | default({}) }}"
      pico_defects: "{{ step_3_result | default([]) }}"

  - ordinal: 5
    action: loop
    description: >
      Re-enter hypothesis-framer cycle if convergence is not met. NOTE: FINER (step 1)
      is skipped on re-entry — the topic has already been evaluated as FINER-viable on
      the first pass; re-running it every iteration is wasteful (mirrors superforecasting's
      triage-skip). PICO (step 2) and operationalize (step 4) are where blockers live, and
      finer_result persists in context for operationalize to read. If FINER itself is the
      blocker (a dimension < 4), the loop cannot fix it -> escalate to human.
      If the Lisp PICO check (step 3) found defects, the loop re-enters at step 2
      (PICO) so the LLM repairs the missing elements before operationalize runs.
    input_mapping:
      # If PICO check failed, re-enter at PICO (step 2); else re-enter at
      # operationalize (step 4) for convergence-driven refinement.
      loop_target: "{{ 2 if (step_3_result | default([]) | length > 0) else 4 }}"
      # The convergence signal is the misalignment count from the
      # operationalize step's alignment_check. Cauchy converges when the
      # misalignment count stabilizes. When step 4 was skipped (PICO
      # defects), the default([]) yields 0 — the loop re-enters at step 2
      # via loop_target, so the 0 does not cause false convergence.
      convergence_signal: "{{ step_4_result.alignment_check.misalignments | default([]) | length }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
