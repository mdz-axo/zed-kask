# Constraint-Forces Recast Process Manifest
# ℏKask v0.33.0 — Concept generation as convergent PDCA
# Decomposed into: Represent → Violate → Project → Control → Three-Criterion → Compare → Frontier → Convergence
#
# Substrate ontology: Popper falsifiability (the three-criterion test is the
# falsifier), Platt strong inference (the relabel control is the
# discriminating test), Pearl counterfactuals (the relabel is the do(not
# recast) counterfactual), Chamberlin multiple hypotheses (the recast vs
# relabel is the M1 vs M2 hypothesis pair).
#
# Forcing operator: minimal-satisfiability projection — the mutant is the
# nearest model of B to c, measured by structural delta (graph-edit distance).
# Not entailment (too strong, projection not generation) and not bare
# satisfiability (too weak, doesn't discriminate M1 from M2). The minimality
# is what forces mutation.
#
# Weakened thesis T1': constraint-forces recasting is *a* mechanism for
# interdisciplinary *concept generation*, distinct from
# retrieval-and-grounding (evidence assembly, e.g. Elicit) and analogy
# (communication). Does not claim to be the only interdisciplinary operation.
#
# Scope boundary: translational research moves insights into the target
# vocabulary (translation); CFR keeps the mutant in the source vocabulary
# (recast). Different operations — CFR operates within translational steps
# but does not constitute translation.

manifest:
  id: constraint-forces-recast
  category: skill
  name: Constraint-Forces Recast
  description: >
    Core generative process for interdisciplinary concept generation. Recasts
    a seed concept from a source ontology A into a target ontology B's
    constraint context via minimal-satisfiability projection (the mutant is
    the nearest model of B to the seed concept, measured by structural delta).
    Produces a three-criterion mutant that is (i) expressible in A's
    signature, (ii) absent from A, (iii) consistent under B's axioms.
    Generates a relabel control and compares structural deltas — a valid
    mutant must outperform the relabel, discriminating constraint-forces
    from random perturbation. Runs an evolutionary loop over a seed set,
    keeping the Pareto frontier on (novelty, validity, cost-inverted) stable
    for ≥2 iterations. The forcing operator is minimal-satisfiability
    projection. Scope boundary: translational research moves insights into
    the target vocabulary; CFR keeps the mutant in the source vocabulary.
    Different operations — CFR operates within translational steps but
    does not constitute translation.
  functional_role: flowdef
  version: 0.33.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 5
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 150000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 4
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: seed_concepts
    type: array
    required: true
    description: >
      Seed concepts to recast. Each entry carries the concept (with its
      axiom graph), the source ontology A (with its signature), and the
      target ontology B (with its axioms). When gradient-seeded-recombination
      has been run, this is its seed_concepts output. When CFR runs
      standalone, the seed is the most-central concept in A (highest graph
      degree) and B is an ontology with high gradient from A (per GSR) or,
      if no gradient map, an ontology with strict axioms (strict targets
      produce larger mutations; permissive targets produce trivial mutants).
  - name: rater
    type: string
    required: false
    description: >
      The rater mode: "human" (default) or "reasoner". In "human" mode, the
      three-criterion test is judged by a human rater approximating the
      argmin of the minimal-satisfiability projection. In "reasoner" mode,
      an OWL reasoner (Hermit, Pellet) checks satisfiability mechanically;
      the minimality still requires a distance metric on concept structures
      (graph-edit distance), which the reasoner does not provide — reasoner
      mode is therefore partial and falls back to human judgment for the
      minimality step. Consumed by the three-criterion step (ordinal 5).

ledger:
  span_namespace: reg.skill.constraint-forces-recast

steps:
  - ordinal: 1
    action: select
    description: >
      Represent the seed concept c as an axiom graph: nodes are c's structural
      elements (classes, properties, relations); edges are the axioms
      connecting them. This is the input to the minimal-satisfiability
      projection.
    renderer: minijinja
    template_ref: constraint-forces-recast/cfr-represent
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      # Use the loop-carried seed_index to advance through the seed set.
      # The loop step binds seed_index as a top-level context key (not
      # _loop.seed_index — the executor binds loop mappings as top-level
      # keys). On first iteration, seed_index is 0 (default).
      seed_concept: "{{ seed_concepts[seed_index | default(0)] | default(seed_concepts[0]) | default({}) }}"
      source_ontology: "{{ seed_concepts[seed_index | default(0)].source_ontology | default(seed_concepts[0].source_ontology) | default({}) }}"

  - ordinal: 2
    action: select
    description: >
      Identify B's axioms that c violates. For each of B's axioms, check
      whether c's structure satisfies it. Record the violations. If no
      violations, c already satisfies B — the minimal-satisfiability
      projection is the identity (no mutant; the degenerate recast-into-self
      case). Report honestly; do not fabricate a mutation.
    renderer: minijinja
    template_ref: constraint-forces-recast/cfr-violate
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      axiom_graph: "{{ step_1_result.axiom_graph | default({}) }}"
      target_ontology: "{{ seed_concepts[seed_index | default(0)].target_ontology | default(seed_concepts[0].target_ontology) | default({}) }}"

  - ordinal: 3
    action: select
    description: >
      Find the minimal structural modification of c that resolves all
      violations — the mutant m = argmin_{m ∈ Models(B)} Δ(c, m), where Δ
      is graph-edit distance. The minimality is what forces mutation. This
      is the forcing operator: minimal-satisfiability projection.
    renderer: minijinja
    template_ref: constraint-forces-recast/cfr-project
    gas_cap: 6144
    timeout_seconds: 90
    input_mapping:
      axiom_graph: "{{ step_1_result.axiom_graph | default({}) }}"
      violations: "{{ step_2_result.violations | default([]) }}"
      target_ontology: "{{ seed_concepts[seed_index | default(0)].target_ontology | default(seed_concepts[0].target_ontology) | default({}) }}"
      source_ontology: "{{ seed_concepts[seed_index | default(0)].source_ontology | default(seed_concepts[0].source_ontology) | default({}) }}"

  - ordinal: 4
    action: select
    description: >
      Generate the relabel control: swap c's vocabulary to B's terms without
      applying B's axioms. This is the M2 (random perturbation) control and
      the do(not recast) counterfactual.
    renderer: minijinja
    template_ref: constraint-forces-recast/cfr-control
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      axiom_graph: "{{ step_1_result.axiom_graph | default({}) }}"
      target_ontology: "{{ seed_concepts[seed_index | default(0)].target_ontology | default(seed_concepts[0].target_ontology) | default({}) }}"

  - ordinal: 5
    action: select
    description: >
      Check the three criteria: (i) expressible in A's signature (novel
      compounds permitted iff compositional — no new axioms), (ii) absent
      from A (not subsumed by any existing A concept), (iii) consistent
      under B's axioms. This is the falsifier.
    renderer: minijinja
    template_ref: constraint-forces-recast/cfr-three-criterion
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      mutant: "{{ step_3_result.mutant | default({}) }}"
      source_ontology: "{{ seed_concepts[_loop.seed_index | default(0)].source_ontology | default(seed_concepts[0].source_ontology) | default({}) }}"
      target_ontology: "{{ seed_concepts[_loop.seed_index | default(0)].target_ontology | default(seed_concepts[0].target_ontology) | default({}) }}"
      rater: "{{ rater | default('human') }}"

  - ordinal: 6
    action: select
    description: >
      Compare the mutant's structural delta to the relabel control's
      structural delta. The mutant must have a larger structural delta than
      the relabel. If mutant Δ ≤ relabel Δ, the recast did not mutate — it
      only relabeled. Report falsification of M1 for this cell. This is the
      discriminating test (Platt) between M1 (constraint forces) and M2
      (random perturbation).
    renderer: minijinja
    template_ref: constraint-forces-recast/cfr-compare
    gas_cap: 3072
    timeout_seconds: 45
    input_mapping:
      mutant: "{{ step_3_result.mutant | default({}) }}"
      structural_delta: "{{ step_3_result.structural_delta | default(0) }}"
      relabel: "{{ step_4_result.relabel | default({}) }}"
      relabel_delta: "{{ step_4_result.relabel_delta | default(0) }}"
      three_criterion_mutant: "{{ step_5_result.three_criterion_mutant | default(false) }}"

  - ordinal: 7
    action: select
    description: >
      Update the Pareto frontier on (novelty, validity, cost-inverted).
      Novelty = 1 - (max subsumption by A); validity = fraction of B's
      axioms satisfied; cost-inverted = 1 - (rater/reasoner effort,
      normalized). Merge current frontier with newly tested variants, keep
      non-dominated members, prune by crowding distance if frontier exceeds
      size limit.
    renderer: minijinja
    template_ref: constraint-forces-recast/cfr-frontier
    gas_cap: 3072
    timeout_seconds: 60
    input_mapping:
      current_frontier: "{{ _convergence.frontier_history | default([]) | last | default([]) }}"
      new_variants:
        - mutant: "{{ step_3_result.mutant | default({}) }}"
          structural_delta: "{{ step_3_result.structural_delta | default(0) }}"
          three_criterion_mutant: "{{ step_5_result.three_criterion_mutant | default(false) }}"
          m1_corroborated: "{{ step_6_result.m1_corroborated | default(false) }}"
          novelty: "{{ step_5_result.absent_from_A | default(false) | ternary(0.9, 0.1) }}"
          validity: "{{ step_5_result.consistent_under_B | default(false) | ternary(0.9, 0.1) }}"
          cost_inverted: 0.6
        - relabel: "{{ step_4_result.relabel | default({}) }}"
          structural_delta: "{{ step_4_result.relabel_delta | default(0) }}"
          three_criterion_mutant: false
          m1_corroborated: false
          novelty: 0.1
          validity: 0.4
          cost_inverted: 0.9
      frontier_size: 10

  - ordinal: 8
    action: compute
    compute_ref: lisp.eval
    description: >
      CHECK CONVERGENCE: Pareto-frontier stability. Computes hypervolume
      delta + 0.05 × new non-dominated members. Converged when metric ≤
      0.10 and iteration ≥ 2. Encoded in lisp per the manifest's
      capability to encode custom convergence formulas. The lisp.eval
      compute_ref expects `form` (the Lisp expression string) and `env`
      (a JSON object whose keys become top-level bindings).
    input_mapping:
      form: "hypervolume_delta + 0.05 * new_non_dominated"
      env:
        hypervolume_delta: "{{ step_7_result.frontier_changed | default(true) | ternary(1.0, 0.0) }}"
        new_non_dominated: "{{ step_7_result.new_non_dominated | default(1) }}"

  - ordinal: 9
    action: loop
    description: >
      Re-enter the CFR cycle if convergence is not met. On re-entry, advance
      to the next seed concept in the seed set (or generate a mutation
      testing a reflected rule from the prior iteration). The loop closes
      the evolutionary feedback: the frontier update's lessons feed the
      next iteration's seed selection.
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 1 }}"
      kata_hypotenuse: "{{ step_8_result.result | default(1.0) }}"
      # Advance the seed index on each loop iteration so the evolutionary
      # loop processes the next seed concept. When all seeds are exhausted,
      # the loop tests mutations from reflected rules (per the Phase F
      # evolution design). The seed_index is carried forward as a loop
      # variable; the Represent step (ordinal 1) uses it to select
      # seed_concepts[seed_index].
      seed_index: "{{ _loop.seed_index | default(0) + 1 }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort