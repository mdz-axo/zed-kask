manifest:
  id: qa-ocap-membrane-penetration
  category: qa-script
  name: QA OCAP Membrane Penetration
  version: 0.31.0
  visibility: Private
  description: "Verifies OCAP security membrane integrity through the hkask-capability test suite (8 tests).\
    \ Ensures capability tokens gate tool access, delegation chains validate correctly, and unauthorized\
    \ calls are rejected. PROHIBITION-level \u2014 OCAP is P4 enforcement substrate.\n"
gas:
  cap: 15000
  hard_limit: true
steps:
- ordinal: 1
  action: run_command
  command: cargo test -p hkask-capability 2>&1 | tail -15
  branching:
    success: 2
    failure: 4
- ordinal: 2
  action: classify
  classifier: qa-triage
  description: "Security audit: hkask-capability test suite (8 tests, PROHIBITION-level). Verify OCAP\
    \ membrane: capability token construction and verification, tool authorization gating (allowed vs\
    \ denied tools), delegation token chain validation, and unauthorized call rejection. The capability\
    \ system is the P4 enforcement substrate \u2014 any failure is a security incident requiring immediate\
    \ investigation."
  branching:
    high_confidence: 3
    medium_confidence: 3
    low_confidence: 5
    flake: 2
    unparseable: 5
    classifier_unavailable: 5
- ordinal: 3
  action: run_command
  command: "echo '[QA:ocap] PASS \u2014 OCAP membrane intact (8/8 capability tests). P4 boundaries enforced.'"
  terminal: true
- ordinal: 4
  action: run_command
  command: "echo '[QA:ocap] FAIL \u2014 OCAP membrane test failed. P4 security boundary may be compromised.\
    \ Immediate investigation required.'"
  terminal: true
- ordinal: 5
  action: run_command
  command: "echo '[QA:ocap] WARN \u2014 classifier uncertain on capability test output. Manual security\
    \ review required (PROHIBITION-level).'"
  terminal: true
ledger:
  emit_spans: true
  alert: qa.ocap.membrane
  span_namespace: reg.skill.qa-ocap-membrane-penetration
