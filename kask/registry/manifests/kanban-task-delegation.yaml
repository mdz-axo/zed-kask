manifest:
  id: kanban-task-delegation
  category: pipeline
  name: Kanban Task Delegation
  version: 0.31.0
  description: 'Delegate kanban tasks to sub-userpods. Configure spawn parameters (delegation level, skills,
    memory scope, tool servers, gas budget, timeout) and execute the task. The spawned agent works on
    the task, producing deliverables and appending progress notes to the comment thread. Ongoing coordination
    (verification, feedback, board flow) is handled by kanban-task-management.

    '
  editor: Curator
  visibility: Public
gas:
  cap: 12000
  alert_threshold: 0.7
  hard_limit: true
rjoule:
  cap: 1
  alert_threshold: 0.8
  hard_limit: true
steps:
- ordinal: 1
  action: populate
  description: "Configure spawn for a task. Determine delegation level (minimal, standard, maximal), skills\
    \ to delegate, memory scope, tool servers, gas budget, and timeout. The userpod chooses what to delegate\
    \ \u2014 spawning is consent-mediated (P1).\n"
  renderer: minijinja
  template_ref: kanban-task-delegation/configure-spawn
  gas_cap: 3000
  timeout_seconds: 30
  output_schema:
    type: object
    properties:
      delegation_level:
        type: string
        enum:
        - minimal
        - standard
        - maximal
      delegated_skills:
        type: array
        items:
          type: string
      memory_scope:
        type: string
        enum:
        - none
        - episodic
        - full
      tool_servers:
        type: array
        items:
          type: string
      gas_budget:
        type: integer
      timeout_seconds:
        type: integer
- ordinal: 2
  action: populate
  description: 'Execute the spawned task. The userpod works on the task, producing deliverables and appending
    progress notes to the task''s comment thread. The coordinator monitors progress through the kanban-task-management
    skill.

    '
  renderer: minijinja
  template_ref: kanban-task-delegation/execute-task
  gas_cap: 5000
  timeout_seconds: 120
ledger:
  emit_spans: true
  span_namespace: reg.skill.kanban-task-delegation
  variety_monitoring: true
  algedonic_threshold: 3
audit:
  enabled: true
  include_input: true
  include_output: true
  include_gas_cost: true
