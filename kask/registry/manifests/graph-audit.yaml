# Graph Audit Process Manifest
# hKask v0.35.0 — Unified graph analysis (code + semantic + dual) as convergent PDCA
#
# Merged from codegraph + semantic-graph-audit + zoom-out (context-expansion).
# Three modes selected by the `mode` input:
#   code     -> discover, query, analyze, context, converge (orchestrates MCP tools)
#   semantic -> classify, analyze, detect, report (no MCP tools; accepts any graph)
#   dual     -> code steps 1-4 to extract graph, then semantic steps 1-4 to audit it

manifest:
  id: graph-audit
  category: skill
  name: Graph Audit
  description: >
    Unified graph analysis with three modes. Code mode: query, traverse,
    analyze, and assemble context from the code graph via hkask-mcp-codegraph
    MCP tools. Semantic mode: domain-agnostic dependency graph health analysis
    through pragmatic-semantics, pragmatic-cybernetics, essentialist, and
    grill-me lenses. Dual mode: extract code graph then audit its health.
    Any userpod may invoke this skill.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 180000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: mode
    type: string
    required: false
    description: >
      Analysis mode: code, semantic, or dual.
      code: query/traverse/analyze the codebase graph via MCP tools.
      semantic: audit any directed graph for health (no MCP tools).
      dual: extract code graph then audit its health.
  - name: target
    type: object
    required: false
    description: >
      Target specification for code/dual mode. Can be a crate name, file path,
      symbol name, or a structured object with { crate, module, symbol } fields.
  - name: goal
    type: string
    required: false
    description: >
      What the userpod wants to understand (code/dual mode). Examples: "impact
      of changing the inference router", "find dead code in hkask-mcp".
  - name: depth
    type: string
    required: false
    default: "immediate-neighbors"
    description: >
      Traversal depth for code/dual mode. immediate-neighbors (default),
      transitive (2-hop), or full (recursive CTE).
  - name: analysis_types
    type: array
    required: false
    default: ["complexity", "dead_code"]
    description: >
      Which analyses to run in code/dual mode. Options: complexity,
      dead_code, impact.
  - name: context_budget
    type: string
    required: false
    default: "standard"
    description: >
      Token budget for context assembly in code/dual mode. minimal (512),
      focused (2048), standard (4096), full (8192).
  - name: requires_context
    type: boolean
    required: false
    default: true
    description: >
      Whether to assemble token-budgeted context in code/dual mode step 4.
  - name: nodes
    type: array
    required: false
    description: "Graph nodes with domain metadata (semantic mode)."
  - name: edges
    type: array
    required: false
    description: "Directed edges (source, target, label, semantics) (semantic mode)."
  - name: domain
    type: string
    required: false
    description: "Domain context - what do the nodes represent? (semantic mode)"
  - name: workspace_context
    type: object
    required: false
    description: "Workspace metadata and known references."

steps:
  # === CODE MODE (steps 1-9) — also used by DUAL mode for graph extraction ===
  - ordinal: 1
    action: execute
    condition: "mode != 'semantic'"
    description: >
      CODE INDEX PRELUDE: Fetch codegraph index statistics and top symbols
      concurrently via mcp_batch. Both calls are independent — codegraph_stats
      returns total symbols/files/edges, codegraph_structure returns PageRank
      top symbols. Running them concurrently halves the wall-clock time
      vs two sequential 30s timeouts. Results are keyed by `project_stats`
      and `structure_overview` in step_1_result.
    mcp_batch:
      - mcp: codegraph_stats
        key: project_stats
        input_mapping:
          include_health: false
          include_meta: false
      - mcp: codegraph_structure
        key: structure_overview
        input_mapping:
          limit: 20
    gas_cap: 4000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        codegraph index tools failed — index statistics and structure
        overview are not available. The code discovery step proceeds
        without index data.

  - ordinal: 2
    action: select
    condition: "mode != 'semantic'"
    description: >
      CODE DISCOVER: Index the target codebase (if needed) and get a project
      structure overview. The userpod invokes codegraph_reindex (if needed),
      codegraph_stats, and codegraph_structure to build an initial map.
    renderer: minijinja
    template_ref: graph-audit/code-discover
    gas_cap: 4096
    timeout_seconds: 120
    input_mapping:
      mode: "{{ task | default(mode) }}"
      target: "{{ target }}"
      goal: "{{ goal }}"
      project_stats: "{{ step_1_result.project_stats | default({}) }}"
      structure_overview: "{{ step_1_result.structure_overview | default([]) }}"
  - ordinal: 3
    action: execute
    condition: "mode != 'semantic'"
    description: >
      CODE QUERY: Search the code graph for symbols relevant to the goal via
      codegraph_query MCP tool. Deterministic. Uses the goal as the search
      query and the entry symbols from the discovery step (step 3) as the
      name parameter. Feeds the code-query step (step 5) as query_results.
    mcp: codegraph_query
    gas_cap: 3000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        codegraph_query failed — symbol search results are not available.
        The code-query step proceeds without structured query results.
    input_mapping:
      query: "{{ goal | default('') }}"
      limit: 20

  - ordinal: 4
    action: select
    condition: "mode != 'semantic'"
    description: >
      CODE QUERY: Search the code graph for symbols relevant to the goal.
      The userpod invokes codegraph_query with keyword/name/semantic queries.
    renderer: minijinja
    template_ref: graph-audit/code-query
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      goal: "{{ goal }}"
      discovery: "{{ step_2_result }}"
      query_results: "{{ step_3_result | default([]) }}"

  - ordinal: 5
    action: execute
    condition: "mode != 'semantic'"
    description: >
      CODE TRAVERSE: Traverse the dependency graph (forward and reverse) for
      matched symbols via codegraph_traverse MCP tool. Deterministic. Uses
      the top symbol from the query results (step 5) as the traversal root.
      Feeds the code-analyze step (step 8) as traverse_results.
    mcp: codegraph_traverse
    gas_cap: 3000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        codegraph_traverse failed — dependency traversal results are not
        available. The code-analyze step proceeds without traversal data.
    input_mapping:
      symbol: "{{ step_4_result.matched_symbols[0].name | default(step_2_result.entry_symbols[0].name | default('')) }}"
      direction: "forward"
      max_depth: 3

  - ordinal: 6
    action: execute
    condition: "mode != 'semantic'"
    description: >
      CODE ANALYSIS: Run quality analysis (complexity, dead_code) via
      codegraph_analysis MCP tool. Deterministic. Feeds the code-analyze
      step (step 8) as analysis_results.
    mcp: codegraph_analysis
    gas_cap: 3000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        codegraph_analysis failed — quality analysis results are not
        available. The code-analyze step proceeds without complexity/dead
        code data.
    input_mapping:
      kind: "complexity"

  - ordinal: 7
    action: select
    condition: "mode != 'semantic'"
    description: >
      CODE ANALYZE: Traverse the dependency graph (forward and reverse) for
      matched symbols, run quality analysis (complexity, dead code, impact),
      and synthesize findings.
    renderer: minijinja
    template_ref: graph-audit/code-analyze
    gas_cap: 6144
    timeout_seconds: 150
    input_mapping:
      goal: "{{ goal }}"
      discovery: "{{ step_2_result }}"
      query_results: "{{ step_4_result }}"
      traverse_results: "{{ step_5_result | default({}) }}"
      analysis_results: "{{ step_6_result | default({}) }}"

  - ordinal: 8
    action: execute
    condition: "mode != 'semantic' AND requires_context"
    description: >
      CODE CONTEXT: Assemble token-budgeted context from the gathered
      analysis via codegraph_context MCP tool. Deterministic. Uses the goal
      as the query and the analysis result (step 8) for context. Feeds the
      code-context step (step 10) as context_result.
    mcp: codegraph_context
    gas_cap: 3000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: >
        codegraph_context failed — token-budgeted context is not available.
        The code-context step proceeds without assembled context.
    input_mapping:
      query: "{{ goal | default('') }}"
      budget: "{{ context_budget | default('standard') }}"

  - ordinal: 9
    action: select
    condition: "mode != 'semantic' AND requires_context"
    description: >
      CODE CONTEXT: Assemble token-budgeted context from the gathered analysis
      for downstream use. Conditional - runs only when requires_context is true.
    renderer: minijinja
    template_ref: graph-audit/code-context
    gas_cap: 2048
    timeout_seconds: 120
    input_mapping:
      goal: "{{ goal }}"
      context_result: "{{ step_8_result | default({}) }}"
      analysis_result: "{{ step_7_result }}"
      budget: "{{ context_budget | default('standard') }}"

  # === SEMANTIC MODE (steps 11-14) ===
  - ordinal: 10
    action: select
    condition: "mode == 'semantic'"
    description: >
      SEMANTIC CLASSIFY: Force-classify every edge using the pragmatic-semantics
      constraint hierarchy (Prohibition > Guardrail > Guideline > Evidence > Hypothesis).
    renderer: minijinja
    template_ref: graph-audit/semantic-classify
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      nodes: "{{ nodes }}"
      edges: "{{ edges }}"
      domain: "{{ domain }}"

  - ordinal: 11
    action: select
    condition: "mode == 'semantic'"
    description: >
      SEMANTIC ANALYZE: Evaluate graph health through four lenses -
      pragmatic-cybernetics, essentialist, grill-me, pragmatic-semantics.
    renderer: minijinja
    template_ref: graph-audit/semantic-analyze
    gas_cap: 8192
    timeout_seconds: 180
    input_mapping:
      nodes: "{{ nodes }}"
      edges: "{{ edges }}"
      classified_edges: "{{ step_10_result }}"
      domain: "{{ domain }}"

  - ordinal: 12
    action: select
    condition: "mode == 'semantic'"
    description: >
      SEMANTIC DETECT: Detect structural pathologies (cycles, redundancies,
      gaps, orphans, fan-in/out anomalies, force/structure mismatches).
    renderer: minijinja
    template_ref: graph-audit/semantic-detect
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      nodes: "{{ nodes }}"
      edges: "{{ edges }}"
      classified_edges: "{{ step_10_result }}"
      analysis: "{{ step_11_result }}"

  - ordinal: 13
    action: select
    condition: "mode == 'semantic'"
    description: >
      SEMANTIC REPORT: Synthesize classification, four-lens analysis, and
      structural detection into a graph-health convergence metric + markdown report.
    renderer: minijinja
    template_ref: graph-audit/semantic-report
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      nodes: "{{ nodes }}"
      edges: "{{ edges }}"
      classified_edges: "{{ step_10_result }}"
      analysis: "{{ step_11_result }}"
      structural_issues: "{{ step_12_result }}"
      domain: "{{ domain }}"

  # === DUAL MODE — semantic audit on extracted code graph ===
  - ordinal: 14
    action: select
    condition: "mode == 'dual'"
    description: >
      DUAL SEMANTIC CLASSIFY: Force-classify edges extracted from the code graph
      analysis (steps 1-4). Nodes = discovered symbols; edges = dependency/caller
      relationships from traversal results.
    renderer: minijinja
    template_ref: graph-audit/semantic-classify
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      nodes: "{{ step_7_result.symbols | default([]) }}"
      edges: "{{ step_7_result.dependencies | default([]) }}"
      domain: "code: {{ goal | default('codebase') }}"

  - ordinal: 15
    action: select
    condition: "mode == 'dual'"
    description: >
      DUAL SEMANTIC ANALYZE: Evaluate the extracted code graph through four lenses.
    renderer: minijinja
    template_ref: graph-audit/semantic-analyze
    gas_cap: 8192
    timeout_seconds: 180
    input_mapping:
      nodes: "{{ step_7_result.symbols | default([]) }}"
      edges: "{{ step_7_result.dependencies | default([]) }}"
      classified_edges: "{{ step_14_result }}"
      domain: "code: {{ goal | default('codebase') }}"

  - ordinal: 16
    action: select
    condition: "mode == 'dual'"
    description: >
      DUAL SEMANTIC DETECT: Detect structural pathologies in the extracted code graph.
    renderer: minijinja
    template_ref: graph-audit/semantic-detect
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      nodes: "{{ step_7_result.symbols | default([]) }}"
      edges: "{{ step_7_result.dependencies | default([]) }}"
      classified_edges: "{{ step_14_result }}"
      analysis: "{{ step_15_result }}"

  - ordinal: 17
    action: select
    condition: "mode == 'dual'"
    description: >
      DUAL SEMANTIC REPORT: Synthesize graph-health report for the extracted code graph.
    renderer: minijinja
    template_ref: graph-audit/semantic-report
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      nodes: "{{ step_7_result.symbols | default([]) }}"
      edges: "{{ step_7_result.dependencies | default([]) }}"
      classified_edges: "{{ step_14_result }}"
      analysis: "{{ step_15_result }}"
      structural_issues: "{{ step_16_result }}"
      domain: "code: {{ goal | default('codebase') }}"

  # === CONVERGENCE — mode-specific ===
  # Code mode: lisp.eval computes a structural score from step 8's
  # quality_findings count, then the ConvergenceTracker checks it (Cauchy criterion).
  - ordinal: 18
    action: compute
    condition: "mode != 'semantic' AND mode != 'dual'"
    compute_ref: lisp.eval
    description: >
      COMPUTE CODE-ANALYSIS GAP (code mode): Deterministic Lisp
      computation that turns the code-analyze step's output into a
      scalar convergence signal. Lower = more converged (fewer quality
      findings). The score is `min(quality_findings_count / 10, 1.0)` —
      capped at 1.0 so a flood of findings doesn't overflow. No
      `default(1.0)` fallback: a missing `quality_findings` field
      surfaces as nil and is guarded to 0 ("no findings reported"),
      which is a real measurement, not a phantom 1.0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((findings (assoc "quality_findings" step_7_result)))
          (let ((n (if (is_null findings) 0 (length findings))))
            (let ((raw (/ n 10)))
              (if (> raw 1.0) 1.0 raw))))
      env:
        step_7_result: "{{ step_7_result }}"

  - ordinal: 19
    action: select
    condition: "mode == 'semantic'"
    description: >
      SEMANTIC CONVERGENCE: The semantic-report step (ordinal 14) already computes
      the graph-health convergence metric. This step passes it through.
    renderer: minijinja
    template_ref: graph-audit/semantic-report
    gas_cap: 2000
    timeout_seconds: 150
    input_mapping:
      nodes: "{{ nodes }}"
      edges: "{{ edges }}"
      classified_edges: "{{ step_10_result }}"
      analysis: "{{ step_11_result }}"
      structural_issues: "{{ step_12_result }}"
      domain: "{{ domain }}"

  # Semantic mode: lisp.eval computes a structural score from the
  # semantic-report's blockers array length (deterministic count),
  # replacing the phantom LLM-generated convergence_metric.
  - ordinal: 20
    action: compute
    condition: "mode == 'semantic'"
    compute_ref: lisp.eval
    description: >
      COMPUTE SEMANTIC-REPORT GAP (semantic mode): Deterministic Lisp
      computation that turns the semantic-report step's output into a
      scalar convergence signal. Lower = more converged (fewer blockers).
      The score is `min(blockers_count / 5, 1.0)` — capped at 1.0. No
      `default(1.0)` fallback: a missing `blockers` field surfaces as
      nil and is guarded to 0 ("no blockers reported"), which is a real
      measurement, not a phantom 1.0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((blockers (assoc "blockers" step_19_result)))
          (let ((n (if (is_null blockers) 0 (length blockers))))
            (let ((raw (/ n 5)))
              (if (> raw 1.0) 1.0 raw))))
      env:
        step_19_result: "{{ step_19_result }}"

  # Dual mode: lisp.eval computes a structural score from the dual
  # semantic-report's blockers array length.
  - ordinal: 21
    action: compute
    condition: "mode == 'dual'"
    compute_ref: lisp.eval
    description: >
      COMPUTE DUAL-REPORT GAP (dual mode): Deterministic Lisp
      computation that turns the dual semantic-report step's (ordinal 18)
      output into a scalar convergence signal. Lower = more converged
      (fewer blockers). The score is `min(blockers_count / 5, 1.0)` —
      capped at 1.0. No `default(1.0)` fallback: a missing `blockers`
      field surfaces as nil and is guarded to 0.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((blockers (assoc "blockers" step_17_result)))
          (let ((n (if (is_null blockers) 0 (length blockers))))
            (let ((raw (/ n 5)))
              (if (> raw 1.0) 1.0 raw))))
      env:
        step_17_result: "{{ step_17_result }}"

  - ordinal: 22
    action: loop
    condition: "mode != 'semantic' AND mode != 'dual'"
    description: Re-enter code mode cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 3 }}"
      # Push the code-analysis gap from the lisp.eval step (ordinal 19)
      # into convergence_signal. No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_18_result }}"

  - ordinal: 23
    action: loop
    condition: "mode == 'semantic'"
    description: Re-enter semantic mode cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 11 }}"
      # Push the semantic-report gap from the lisp.eval step (ordinal 21)
      # into convergence_signal. No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_20_result }}"

  - ordinal: 24
    action: loop
    condition: "mode == 'dual'"
    description: Re-enter dual mode cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 3 }}"
      # Push the dual-report gap from the lisp.eval step (ordinal 22)
      # into convergence_signal. No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_21_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.graph-audit
  telemetry_namespace: hkask.template.graph-audit
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
