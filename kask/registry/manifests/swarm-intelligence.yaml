# Swarm Intelligence Process Manifest
# ℏKask v0.31.0 — Swarm composition as convergent PDCA
# Decomposed into: SENSE → ORIENT → DECIDE → ACT → CHECK → CONVERGE → LOOP
#
# Substrate ontology: Agent Bestiary World (ABW) swarm semantics. A swarm is
# an ABW workspace with hired agents. Compound agents orchestrate via
# execute_agent (text consult) and delegate_to_agent (full tool access, 1 cr
# + tokens, delegation chains forbidden — delegates lose
# delegate_to_agent/execute_agent). Gas (verified live 2026-08-02): own-
# agent hire is a flat 2 cr /add fee, @mention 1 cr + tokens, delegation 1
# cr + tokens; third-party /hire fee unverified. Compound agents declare
# dependencies { required, optional } and auto-hire their team. Thagard
# coherence scoring on workspaces. (Source:
# kask/docs/plans/abw-swarm-intelligence.md §0, verified live 2026-08-01.)
#
# Surface ontologies:
#   - Onto4MAT (Kiesel et al. 2022): Team { hasAlignmentWithTeam,
#     hasCohesionWithTeam, hasTeamSeparation, hasInfluence }, Agent {
#     hasSpeed, hasHeading, hasEnergy, hasDistanceToGoal }, Formation.
#   - Reynolds (1987) flocking: separation / alignment / cohesion.
#   - PSO (Kennedy & Eberhart 1995): v ← ωv + c1·r1·(pbest−x) + c2·r2·(gbest−x).
#   - ACO (Dorigo 1992): pheromone deposition / evaporation (stigmergy).
#   - W3C SSN/SOSA: observable properties for swarm-state sensing.
#   - Ashby requisite variety; cybernetic 5-property loop assessment.
#
# Feedback loop: SENSE consumes prior_iteration.next_focus (emitted by the
# CONVERGE check when not converged) to direct the next iteration. The loop is
# autopoietic at the heuristic layer (Maturana & Varela; Luhmann) — each
# iteration's composition recommendation is a function of the prior measured
# swarm state and prior heuristics, not external directives.
#
# Convergence: Cauchy criterion on the swarm-state distance d. d is a
# composite of (1 - variety_coverage), (diversity_floor - diversity), and
# (1 - loop_closure); plus (1 - s)^2 when a deterministic task_success
# verdict is supplied (C0). d = 0 means the target condition is met on all
# axes. Algedonic override: a 402 or un-acknowledged curator dispatch
# escalates regardless of d (the .rules "unwrap_or(0) on regulation-loop
# sense inputs" trap enforced as a convergence invariant).
#
# Cybernetic Swarm Plan components integrated (Appendix C records the
# foundation slice C0/C4/C8):
#   C1 second-order monitor + converge_accumulate  — steps 7-8 (compute)
#   C2 Go See scheduled loop                    — SENSE surfaces the go_see
#       directive from the monitor; the operator descends Steer with the §5
#       checklist. The cadence is event-driven (on sensor-truth divergence)
#       plus iteration-bounded (max_iterations caps the human-check cadence).
#   C3 failed-edit memory                       — converge_accumulate + DECIDE guard
#   C5 deterministic fault attribution          — ORIENT + CHECK blame aggregation
#   C6 reconfigure_agent DECIDE action         — swarm_reconfigure_local_agent tool
#   C7 influence-weighted rejection             — converge_accumulate + DECIDE guard

manifest:
  id: swarm-intelligence
  category: skill
  name: Swarm Intelligence
  description: >
    Convergent swarm-composition process for Agent Bestiary World (ABW) agent
    swarms. Senses current swarm state against the Onto4MAT multi-agent
    teaming ontology (alignment, cohesion, separation) and the ABW
    workspace/wallet APIs; orients by classifying the gap (variety deficit,
    coherence deficit, loop-break) via Ashby's requisite variety and PSO
    cognitive/social balance; decides composition adjustments isomorphic to
    PSO velocity tuning (c1/c2/omega), ACO pheromone deposition/evaporation,
    and Reynolds separation/alignment/cohesion; acts via gated
    swarm_hire/swarm_delegate calls (consent-gated through
    swarm_request_consent); checks by reconciling actual spend and
    curator data-sharing against the algedonic channel; and converges via a
    Cauchy criterion on the swarm-state distance metric. Anchored to Reynolds (1987) flocking,
    Kennedy-Eberhart PSO, Dorigo ACO, Onto4MAT (Kiesel et al. 2022), W3C
    SSN/SOSA, Thagard coherence, Ashby requisite variety, and the ABW
    integration plan (zed-kask 2026-08-01). Composes pragmatic-cybernetics,
    kata-improvement, and essentialist. Emits reg.skill.swarm-intelligence.* spans.
  functional_role: flowdef
  version: 0.1.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 120000
  cost_per_iteration: 150
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: swarm_id
    type: string
    required: true
    description: >
      The ABW workspace id (= swarm) to compose/steer. Resolved via
      hkask-mcp-swarm's swarm_get_swarm.
  - name: task
    type: string
    required: true
    description: >
      The target task the swarm must be composed for. Drives the
      required_transforms set in the variety check.
  - name: target_condition
    type: object
    required: false
    description: >
      Operator-specified target. Defaults: variety_coverage >= 0.9,
      diversity >= 0.25, loop_closure = 1.0. Each field overrides a default.
  - name: prior_iteration
    type: object
    required: false
    description: >
      Output of a previous swarm-intelligence iteration on the same swarm.
      Closes the feedback loop: SENSE consumes prior_iteration.next_focus.
  - name: task_success
    type: object
    required: false
    description: >
      Optional deterministic task-success verdict (Cybernetic Swarm Plan
      component C0). A deterministic evaluator's verdict on whether the
      swarm's last output solved the task: { "pass": bool, "score":
      0.0..1.0|null, "detail": string|null, "evaluator": string }. The
      judge MUST be deterministic (test pass/fail, schema validation, exit
      code, regex/reference match) — NOT an LLM score. When null (open tasks
      with no oracle), d uses the three swarm-health axes only and the human
      Go See loop (component C2) covers the task-success gap. Do NOT
      fabricate a verdict; a missing task_success means "not measured", not
      "passed" (the .rules `unwrap_or(0)` trap on regulation signals).

steps:
  - ordinal: 1
    action: select
    description: >
      SENSE: Measure current swarm state. Fetch the workspace roster
      (agents[], their accepts[]/produces[]/capabilities/dependencies) and
      the wallet balance/transactions via hkask-mcp-swarm. Compute Onto4MAT
      team properties: alignment (delegation-graph density from produces/
      accepts overlap), cohesion (fraction of required dependencies
      satisfied by hired agents), separation (distinct (agent_type, model,
      temperature) tuples / agent count). Record required_transforms derived
      from the task. Consumes prior_iteration.next_focus when present.
      Vacuous-truth defaults: empty required_transforms → variety_coverage
      1.0 + trivial_task flag; empty swarm → diversity 0.0, variety 0.0.
    renderer: minijinja
    template_ref: swarm-intelligence/swarm-sense
    gas_cap: 4096
    timeout_seconds: 120
    input_mapping:
      swarm_id: "{{ swarm_id }}"
      task: "{{ task }}"
      mode: "{{ mode | default('abw') }}"
      target_condition: "{{ target_condition | default({}) }}"
      prior_iteration: "{{ prior_iteration | default({}) }}"

  - ordinal: 2
    action: select
    description: >
      ORIENT: Classify the gap between sensed state and target condition into
      one of three deficit classes (or on-target): (a) variety deficit —
      required_transforms not covered by hired agents' accepts/produces;
      (b) coherence deficit — Thagard coherence flat or declining, OR
      diversity below floor (premature convergence, the PSO/ACO failure
      mode); (c) loop-break — un-reconciled dispatches or un-acknowledged
      curator data-sharing. Delegates to pragmatic-cybernetics for the
      5-property assessment (polarity, delay, gain, closure, fidelity) when
      the deficit is a loop-break. Classifies the coordination problem
      (Axelrod): is this a cooperation problem (repeated interaction, shadow
      of the future) or a division-of-labor problem (one-shot, complementary
      capabilities)?
    renderer: minijinja
    template_ref: swarm-intelligence/swarm-orient
    gas_cap: 4096
    timeout_seconds: 90
    input_mapping:
      swarm_state: "{{ step_1_result }}"
      task: "{{ task }}"
      target_condition: "{{ target_condition | default({}) }}"
      # Cybernetic Swarm Plan C5: the prior iteration's ACT trace (the executor
      # snapshots prev_step_N_result at the loop step) carries the delegate
      # results ORIENT attributes fault from. Absent on iteration 1 (no prior).
      prior_act: "{{ prev_step_5_result | default(none) }}"

  - ordinal: 3
    action: select
    description: >
      DECIDE: Propose composition adjustments isomorphic to swarm-algorithm
      tuning, mapped onto ABW's hire/delegate/fire vocabulary (fire is
      `swarm_fire`, verified live 2026-08-02 — roster removal, no credit
      cost):
        - Variety deficit → hire agents whose accepts/produces cover the
          missing transforms (ACO pheromone deposition: strengthen the path
          to the uncovered region).
        - Coherence deficit + low diversity → hire a diverse agent (raise
          PSO c1 cognitive / lower omega inertia — broaden the search);
          flag a redundant duplicate and prune it with `swarm_fire` (abw) /
          `swarm_remove_local` (local).
        - Coherence deficit + high diversity but low alignment → hire/assign
          a coordinator compound agent (raise PSO c2 social — pull toward
          gbest; Reynolds alignment rule).
        - Loop-break → do NOT change composition; emit a reconciliation
          repair (re-query /api/wallet/transactions for the un-reconciled
          dispatch) and a curator-consent backfill.
      Recommendations reference the ABW compound-agent dependencies model
      (required/optional) and the no-delegation-chains invariant.
    renderer: minijinja
    template_ref: swarm-intelligence/swarm-decide
    gas_cap: 6144
    timeout_seconds: 90
    input_mapping:
      swarm_state: "{{ step_1_result }}"
      orientation: "{{ step_2_result }}"
      task: "{{ task }}"
      # Cybernetic Swarm Plan C3/C7: deterministic guards threaded from the
      # CONVERGE accumulator (via the loop step). failed_edits = the anti-loop
      # set DECIDE rejects re-proposals against; influence_scores = the
      # per-agent_type running sum DECIDE rejects re-hire of negatively-
      # influential types against. second_order = the C1 monitor recommendation
      # (go_see | diversify_action | none). Absent on iteration 1.
      failed_edits: "{{ failed_edits | default([]) }}"
      influence_scores: "{{ influence_scores | default({}) }}"
      second_order: "{{ second_order | default({}) }}"

  - ordinal: 4
    action: compute
    compute_ref: swarm.filter_proposed_moves
    description: >
      FILTER (Cybernetic Swarm Plan C3/C7 — deterministic enforcement). A
      compute step between DECIDE and ACT that deterministically enforces the
      guards the plan calls for: (1) C3 — drop a proposed move whose
      (move_type, swarm_state_signature) matches a prior failed-edit entry
      (the anti-loop set); (2) C7 — drop a hire of an agent_type whose
      influence score is <= 0 (measured to degrade the swarm). The
      accumulators (failed_edits, influence_scores) are threaded from CONVERGE
      via the loop. This is the deterministic enforcement point — without it
      the guards would be LLM-instructed in DECIDE (degraded fidelity). An
      empty filtered result is the correct cybernetic response: a stuck swarm
      that only re-proposes known-bad edits should stall, at which point the
      second-order monitor's diversify/Go See fires.
    input_mapping:
      proposed_moves: "{{ step_3_result.proposed_moves | default([]) }}"
      failed_edits: "{{ failed_edits | default([]) }}"
      influence_scores: "{{ influence_scores | default({}) }}"
      deficit_class: "{{ step_2_result.deficit_class | default('') }}"
      swarm_state: "{{ step_1_result | default({}) }}"

  - ordinal: 5
    action: select
    description: >
      ACT: Emit the gated composition change. For each proposed hire/
      delegate, construct a consent request via swarm_request_consent
      { action: "hire"|"delegate", target: agent_name|workspace_id,
      credits_authorized: estimated_credits (from ABW dependencies cost
      estimate), curator_involved (default false per plan §3.7),
      data_shared (derived from the agents' accepts[] and the task) }.
      The consent gate is mandatory: no swarm_hire or swarm_delegate call
      is emitted without a valid consent_token from swarm_request_consent.
      If the operator Aborts, the
      phase records the abort reason and emits no spend. This phase enforces
      the .rules "Advertised invariants need enforcement points" trap: the
      consent gate must actually block, not just warn.
    renderer: minijinja
    template_ref: swarm-intelligence/swarm-act
    gas_cap: 4096
    timeout_seconds: 120
    input_mapping:
      decisions: "{{ step_4_result }}"
      swarm_id: "{{ swarm_id }}"
      task: "{{ task }}"
      mode: "{{ mode | default('abw') }}"

  - ordinal: 6
    action: select
    description: >
      CHECK: Re-measure the swarm state post-Act (re-fetch workspace +
      wallet). Compute the convergence metric: composite swarm-state
      distance d = sqrt( (1 - variety_coverage)^2 + max(0, diversity_floor -
      diversity)^2 + (1 - loop_closure)^2 ). d = 0 means the target
      condition is met on all three axes. Emit next_focus: if variety is the
      largest term, focus next iteration on hiring; if diversity, on
      diversification; if loop_closure, on reconciliation. Also emit the
      algedonic signal: any 402 / un-acknowledged curator dispatch is
      surfaced as a loop-break regardless of d. Vacuous-truth default: zero
      dispatches → loop_closure 1.0. When the caller supplies a deterministic
      `task_success` verdict (Cybernetic Swarm Plan component C0), d gains a
      fourth axis `(1 - s)^2` (s = task_success.score, or pass→1.0 / fail→0.0);
      when `task_success` is null (open tasks with no oracle), d uses the three
      swarm-health axes only — the human Go See loop (C2) covers the task-success
      gap, never an LLM judge.
    renderer: minijinja
    template_ref: swarm-intelligence/swarm-check
    gas_cap: 4096
    timeout_seconds: 120
    input_mapping:
      pre_act_state: "{{ step_1_result }}"
      act_result: "{{ step_5_result }}"
      swarm_id: "{{ swarm_id }}"
      mode: "{{ mode | default('abw') }}"
      target_condition: "{{ target_condition | default({}) }}"
      task_success: "{{ task_success | default(none) }}"
      # Cybernetic Swarm Plan C5: blame aggregation. agent_at_fault is the prior
      # ORIENT's attribution (prev_step_2_result); blame_count is the carried
      # running map (threaded via the loop). Absent on iteration 1.
      agent_at_fault: "{{ prev_step_2_result.agent_at_fault | default(none) }}"
      blame_count: "{{ blame_count | default({}) }}"

  - ordinal: 7
    action: compute
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion on the swarm-state distance d. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 8
    action: compute
    compute_ref: swarm.converge_accumulate
    description: >
      CONVERGE ACCUMULATE (Cybernetic Swarm Plan C1/C3/C7): deterministic
      per-iteration accumulator. An LLM template cannot reliably maintain a
      running set/sum across LOOP iterations, so this pure-function compute
      step maintains three accumulators: (1) iteration_log — the
      (d, s, deficit_class, decision_action) record per iteration, fed to the
      second-order monitor; (2) failed_edits — the C3 anti-loop set of
      (decision_action, swarm_state_signature, d_delta) entries recorded when
      an edit did not improve d (d_delta <= 0) and s did not improve, which
      DECIDE rejects re-proposals against; (3) influence_scores — the C7
      per-agent_type running sum of d_delta, which DECIDE rejects re-hire of
      negatively-influential types against. The accumulators are threaded back
      through the loop step's input_mapping so the next iteration's DECIDE can
      read them. No LLM; no sensor-truth fabrication (null s means not measured).
    input_mapping:
      iteration_log: "{{ iteration_log | default([]) }}"
      failed_edits: "{{ failed_edits | default([]) }}"
      influence_scores: "{{ influence_scores | default({}) }}"
      d: "{{ step_6_result.convergence_metric | default(0.0) }}"
      task_success: "{{ step_6_result.task_success | default(none) }}"
      deficit_class: "{{ step_2_result.deficit_class | default('') }}"
      decisions: "{{ step_4_result | default({}) }}"
      swarm_state: "{{ step_1_result | default({}) }}"

  - ordinal: 9
    action: compute
    compute_ref: swarm.second_order_monitor
    description: >
      CONVERGE SECOND-ORDER MONITOR (Cybernetic Swarm Plan C1 — S1 §5.4): two
      deterministic statistical signals over the iteration_log, no LLM.
      (1) reasoning_loop — (deficit_class, decision_action) repeated for
      loop_window iterations with no d improvement; (2) sensor_truth_divergence
      — d improving while the deterministic task-success s declines (the Go See
      diagnosis automated as a cheap statistic). The recommendation
      (go_see | diversify_action | none) is threaded to the next iteration so
      DECIDE can diversify a stuck action and the Go See cadence (C2) can fire
      on the divergence trigger.
    input_mapping:
      iteration_log: "{{ step_8_result.iteration_log | default([]) }}"
      loop_window: 3
      # Cybernetic Swarm Plan C2 — scheduled Go See cadence: force a human
      # Go See check every 3 convergences regardless of the monitor's signals.
      # The event triggers (sensor_truth_divergence, reasoning_loop) have high
      # variety for the failures they measure but cannot detect failures
      # outside their programmed variety (§5.1: Go See cannot be fully
      # automated). The cadence is the irreducible human check for the
      # unknown-unknowns.
      cadence_every: 3

  - ordinal: 10
    action: loop
    description: >
      Re-enter the swarm-intelligence cycle if convergence is not met. Routes
      the prior CHECK's lessons_learned and next_focus back to step 1 as
      prior_iteration, AND threads the deterministic accumulators (C1/C3/C7)
      and the second-order monitor's recommendation back so the next
      iteration's DECIDE can apply the failed-edit and influence guards and
      diversify a stuck action. Closes the feedback loop.
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        lessons_learned: "{{ step_6_result.lessons_learned | default([]) }}"
        next_focus: "{{ step_6_result.next_focus | default('') }}"
        second_order: "{{ step_9_result | default({}) }}"
      kata_hypotenuse: "{{ step_7_result.hypotenuse | default(1.0) }}"
      iteration_log: "{{ step_8_result.iteration_log | default([]) }}"
      failed_edits: "{{ step_8_result.failed_edits | default([]) }}"
      influence_scores: "{{ step_8_result.influence_scores | default({}) }}"
      second_order: "{{ step_9_result | default({}) }}"
      blame_count: "{{ step_6_result.blame_count | default({}) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 2
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.swarm-intelligence
  telemetry_namespace: hkask.template.swarm-intelligence
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
