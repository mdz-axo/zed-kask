# Kali Audit Process Manifest
# ℏKask v0.35.0 — Security review as convergent PDCA
# Phased: select-surface → audit → report → convergence-check → loop
#
# Standards: OWASP LLM Top 10 (2025), MITRE ATLAS v5.1, NIST SSDF SP 800-218A
# Sources: Microsoft Research (FIDES), OpenAI (Instruction Hierarchy),
#   ANSSI Secure Rust Guidelines, RustSec, Trail of Bits
#
# Forward-adaptable design:
# - Audit template consumes regression library at runtime (coverage grows with library)
# - Defense layers are parameters, not hardcoded (new layers added without template changes)
# - Surface discovery is dynamic (new crates/MCP servers auto-discovered)

manifest:
  id: kali-audit
  category: skill
  name: Kali Audit
  description: >
    Convergent security review process. Runs a structured, phased audit against
    a target surface (code, template, supply-chain, mcp, config, llm-io):
    discovers the surface and defense-layer coverage, executes agent-coordinated
    probes with MCP tools, classifies findings by CWE/OWASP LLM 2025/ATLAS/NIST
    SSDF, and produces a structured report with proposed regression entries.
    Computes convergence via defense-layer coverage and residual risk, and
    iterates until critical/high findings are resolved or escalation is required.
    Consumes the security regression library (security/regressions/) as input
    to skip already-enforced checks. Forward-adaptable: new attack vectors,
    defenses, and surfaces are added as regression entries and defense layers
    without template changes.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: target_surface
    type: string
    required: false
    description: >
      The surface to audit: `code`, `template`, `supply-chain`, `mcp`, `config`,
      `llm-io`, or `auto` (discover from filesystem).
  - name: target_path
    type: string
    required: true
    description: >
      Filesystem path to the target (crate path, template dir, or "workspace"
      for supply-chain/config/llm-io audits).
  - name: regression_library
    type: array
    required: false
    description: >
      Pre-loaded regression library entries (from security/regressions/RR-*.yaml).
      If not provided, the select-surface step will output guidance for the agent
      to read the library before re-invoking.

steps:
  - ordinal: 1
    action: select
    description: >
      Select the audit target surface, discover defense-layer coverage, and map
      to the applicable check catalog. Reads the regression library to identify
      already-enforced checks and excludes them. If target_surface is "auto",
      discovers surfaces from the filesystem.
    renderer: minijinja
    template_ref: kali-audit/select-surface
    timeout_seconds: 120
    input_mapping:
      target_surface: "{{ task | default(target_surface) }}"
      target_path: "{{ target_path }}"
      regression_library: "{{ regression_library | default([]) }}"

  - ordinal: 2
    action: execute
    description: >
      Probe wave: run the check catalog as declared, concurrent MCP calls.
      Every probe is recorded in the grounding ledger (tool, ok, result).
      Partial failures preserved via allSettled — a failed probe is a
      recorded ok:false, not silence.
    mcp_batch:
      - mcp: codegraph_query
        key: symbol_search
        input_mapping:
          query: "{{ step_1_result.probe_query | default('security sensitive symbols') }}"
          limit: 50
      - mcp: codegraph_analysis
        key: dead_code
        input_mapping:
          kind: "dead_code"
      - mcp: codegraph_stats
        key: index_stats
        input_mapping: {}
    input_mapping:
      join: allSettled
    timeout_seconds: 120
    on_failure:
      action: report
      resume: >
        Probe wave failed entirely — codegraph server may be down or
        unindexed. Run codegraph_reindex, then retry. Do NOT proceed to
        the audit step with zero probe results: an audit with no recorded
        tool calls is narration, not evidence.

  - ordinal: 3
    action: select
    description: >
      AUDIT: interpret the recorded probe wave (step 2) against the selected
      surface's check catalog. Findings cite probe_results evidence or are
      marked deferred with a reason — never fabricated. Verifies defense-layer
      presence from the probe output, not from LLM imagination.
    renderer: minijinja
    template_ref: kali-audit/audit
    timeout_seconds: 300
    input_mapping:
      selected_surface: "{{ step_1_result.selected_surface | default(target_surface) }}"
      target_path: "{{ target_path }}"
      checks_to_run: "{{ step_1_result.checks_to_run | default([]) }}"
      known_regressions: "{{ step_1_result.known_regressions | default([]) }}"
      defense_layers: "{{ step_1_result.defense_layers | default([]) }}"
      probe_results: "{{ step_2_result }}"

  - ordinal: 4
    action: select
    description: >
      Synthesize findings into a structured report. Produce verdict (Pass/
      Conditional/Fail) based on findings AND defense-layer coverage. Propose
      regression entries with source citations (OWASP 2025, ATLAS, NIST SSDF).
      Identify top 3 fixes and defense-layer gaps.
    renderer: minijinja
    template_ref: kali-audit/report
    timeout_seconds: 150
    input_mapping:
      findings: "{{ step_3_result.findings | default([]) }}"
      coverage: "{{ step_3_result.coverage | default({}) }}"
      selected_surface: "{{ step_1_result.selected_surface | default(target_surface) }}"
      target_path: "{{ target_path }}"

  - ordinal: 5
    action: select
    description: >
      TAXONOMY_MAP (folded from attack-taxonomy-mapper): Map findings to the
      OSC&R attack taxonomy (dependency confusion, typosquatting, malicious
      commit injection, build pipeline compromise, unmaintained component,
      unverified registry). Adds an optional, backward-compatible
      `taxonomy_mapping` field to existing `surface: supply-chain` regression
      YAML entries. Skipped for non-supply-chain surfaces.
    renderer: minijinja
    template_ref: kali-audit/taxonomy-map
    timeout_seconds: 120
    condition: "step_1_result.selected_surface == 'supply-chain'"
    input_mapping:
      findings: "{{ step_3_result.findings | default([]) }}"
      coverage: "{{ step_3_result.coverage | default({}) }}"
      selected_surface: "{{ step_1_result.selected_surface | default(target_surface) }}"

  - ordinal: 6
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 4's actual report output.
      The convergence signal is the count of open critical + high findings
      PLUS the count of structural defects in proposed_regressions (bad
      severity, bad detection.kind, or empty pattern). Lower = more
      converged (zero = clean findings AND valid RR proposals). A
      hallucinated RR proposal (e.g., severity 'blocker', detection.kind
      'runtime') is now a cascade defect instead of prose a human must
      hand-check. If report or any severity array is absent, the form
      errors (no silent default), surfacing a broken report step rather
      than masking it with a flat 1.0.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((report (assoc "report" step_4_result))
              (proposed (assoc "proposed_regressions" step_4_result)))
          (begin
            (define valid-sev
              (lambda (s)
                (if (string= s "critical") true
                (if (string= s "high") true
                (if (string= s "medium") true
                (if (string= s "low") true false))))))
            (define valid-kind
              (lambda (k)
                (if (string= k "grep") true
                (if (string= k "cargo-test") true
                (if (string= k "skill-probe") true
                (if (string= k "reg-span") true false))))))
            (define check-rr
              (lambda (rs acc)
                (if (is_null rs)
                    acc
                    (let ((r (car rs))
                          (sev (assoc "severity" r))
                          (det (assoc "detection" r))
                          (kind (if (is_null det) (list) (assoc "kind" det)))
                          (pat (if (is_null det) (list) (assoc "pattern" det))))
                      (let ((sev-ok (valid-sev sev))
                            (kind-ok (valid-kind kind))
                            (pat-ok (not (is_null pat))))
                        (check-rr
                          (cdr rs)
                          (+ acc
                             (if (not sev-ok) 1 0)
                             (if (not kind-ok) 1 0)
                             (if (not pat-ok) 1 0))))))))
            (define rr-defects
              (if (is_null proposed) 0 (check-rr proposed 0)))
            (define crit (length (assoc "critical" (assoc "findings_by_severity" report))))
            (define high (length (assoc "high" (assoc "findings_by_severity" report))))
            (+ crit high rr-defects)))
      env:
        step_4_result: "{{ step_4_result }}"

  - ordinal: 7
    action: loop
    description: Re-enter audit cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_6_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.kali-audit
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_reg_events: true
