# Code Review Process Manifest
# hKask v0.35.0 — Convergent code review as phased PDCA
# Phased: scope → perspectives → adjudicate → report → implement (gated) → convergence-check → loop
#
# Ontological anchors (the shape emerges from these, NOT from a generic template):
#   - Fagan (1976) "Design and code inspections to reduce errors in program
#     development" — the original phased inspection ontology
#     (Planning → defect detection → defect collection → follow-up).
#     scope = Planning, perspectives = defect detection, adjudicate = collection,
#     report = outputs, implement/convergence = follow-up (loop closure).
#   - Bacchelli & Bird (2013), Sadowski & Stolee (2015) — modern code review
#     (tool-mediated, asynchronous, lightweight) → review-first, ask-before-implement.
#   - Sauer et al. (2000) — key process conditions for review effectiveness →
#     detection (perspectives) is separated from collection (adjudicate).
#   - PKO (Carriero et al. 2025) — review IS a Procedure: perspectives = pko:Step,
#     adjudicate = pko:StepVerification, lessons_learned = pko:IssueOccurrence.
#
# Design: comprehensive-by-default. The four candidate modes (adversarial,
# multi-perspective, refactoring, generative) are inline reasoning lenses, NOT
# orthogonal toggleable invocations (essentialist deletion test: deleting
# "modes" does not re-introduce complexity). Variety comes from delegation to
# specialist skills (Ashby's requisite variety). "Generative" (implement fixes)
# is gated by fix_mode (default 'none' = review-only); setting it is the user's
# consent to modify code.

manifest:
  id: code-review
  category: skill
  name: Code Review
  description: >
    Convergent code review of a change against its stated spec. Computes the
    real diff (Fagan sizing), builds a change model (Good Regulator), runs
    multi-axis defect DETECTION across PERFECT-ordered axes intersected with
    the addyosmani five-axis with optional delegation to kali-audit (security),
    bug-hunt (deep defects), and refactor-architecture/deep-module/essentialist
    (architecture), then performs defect COLLECTION with pragmatic-semantics
    IS/OUGHT + epistemic mode + provenance + constraint-force severity + a
    falsifier + grill-me self-challenge + file:line no-fiction citation.
    Produces a verdict (Approve/Request changes/Comment) with named structural
    remedies and coverage honesty, an optional user-gated fix implementation,
    and lessons_learned/next_review_focus for loop closure. Convergence is
    blocker_delta stabilization (Cauchy). Comprehensive-by-default; variety via
    delegation, not modes. Emits reg.codereview.* spans. capability-gated.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  # Layer A opt-in: enforce the declared `inputs` contract at the skill-execution
  # boundary. A code-review invocation that omits a required input
  # (`change_spec`/`diff_base`) or passes a wrong-typed `context` value is
  # rejected with a structured error instead of running the cascade on empty /
  # wrong inputs. See hkask_templates::validate_inputs.
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: change_spec
    type: string
    required: false
    description: >
      The stated spec / intent the change implements. The review judges the
      change against this. Referenced by scope (intent vs change) and
      adjudicate (does the code do what the spec claims?).
  - name: diff_base
    type: string
    required: true
    description: >
      Git ref to diff against (e.g. "main", "origin/main", a commit SHA). The
      scope step computes `git diff <diff_base>...HEAD` from real git output —
      do not estimate sizes from the spec.
  - name: focus
    type: array
    required: false
    default: []
    description: >
      Axes to restrict the review to (empty = comprehensive, the default).
      Members from {purpose, edge_cases, reliability, form, evidence, clarity,
      taste} (PERFECT) intersected with {correctness, readability, architecture,
      security, performance} (addyosmani five-axis). Security always gets at
      least a basic pass even when focus is non-empty.
  - name: delegate_security
    type: boolean
    required: false
    default: false
    description: >
      Emit a delegation instruction to invoke kali-audit (surface=code) for the
      security axis. The inline pass always covers security basics; delegation
      adds depth. Essentialist G1: re-use kali-audit rather than reimplement.
  - name: delegate_bug_hunt
    type: boolean
    required: false
    default: false
    description: >
      Emit a delegation instruction to invoke bug-hunt for deep defect-finding
      against this change's quality criteria.
  - name: delegate_architecture
    type: boolean
    required: false
    default: false
    description: >
      Emit a delegation instruction to invoke refactor-architecture /
      deep-module / essentialist (advisory mode) for architecture findings.
  - name: fix_mode
    type: string
    required: false
    default: "none"
    description: >
      Controls the optional Act (implement) phase. `none` (default) = review
      only — the review is review-first. `blockers` = implement Blocker fixes;
      `should_fix` = Blocker + Should-fix; `all` = every actionable finding
      (skip pure taste/FYI with no concrete remedy). Setting a non-`none` value
      IS the user's consent to modify code. This is the "generative" mode,
      gated and AFTER the review.
  - name: prior_review
    type: object
    required: false
    description: >
      Output of a previous code-review pass on the same change. Closes the
      feedback loop: scope consumes prior_review.next_review_focus as the
      primary emphasis; adjudicate uses prior_review.blockers to compute
      blocker_delta; the loop step routes report's next_review_focus and
      lessons_learned back here. Absent on first pass.
  - name: probe_findings
    type: string
    required: false
    description: >
      Raw findings from agent-orchestrated delegate-skill invocation, populated
      by the agent between step 2 (perspectives) and step 3 (adjudicate). In
      pure FlowDef execution, pre-populate this; in Zed sessions the agent
      invokes kali-audit/bug-hunt/refactor-architecture between the calls and
      folds the returned findings into raw_findings with `source` set.

steps:
  - ordinal: 1
    action: select
    description: >
      SCOPE (Fagan Planning). Compute the real diff from git output, classify
      change size (Fagan sizing: ~100 good, ~300 acceptable, ~1000 too large),
      identify critical paths (auth/payments/data writes/concurrency/unsafe/
      FFI/secrets/external data boundaries), and build a lightweight change
      model (Good Regulator). Consumes prior_review.next_review_focus as the
      primary emphasis for this pass.
    renderer: minijinja
    template_ref: code-review/code-review-scope
    timeout_seconds: 150
    input_mapping:
      change_spec: "{{ task | default(change_spec) }}"
      diff_base: "{{ diff_base }}"
      focus: "{{ focus | default([]) }}"
      prior_review: "{{ prior_review | default({}) }}"

  - ordinal: 2
    action: select
    description: >
      PERSPECTIVES (Fagan defect detection). Multi-axis DETECTION only across
      PERFECT-ordered axes (Purpose → Edge cases → Reliability → Form →
      Evidence → Clarity → Taste) intersected with the addyosmani five-axis
      (correctness, readability, architecture, security, performance). Records
      raw, unverdicted findings with file:line + verbatim evidence (no-fiction).
      Respects focus. For each enabled delegate flag, emits a delegation
      instruction for the agent to invoke the specialist skill between this
      step and adjudicate. Accepts pre-populated probe_findings for the FlowDef
      path.
    renderer: minijinja
    template_ref: code-review/code-review-perspectives
    timeout_seconds: 300
    input_mapping:
      change_model: "{{ step_1_result.change_model | default({}) }}"
      focus: "{{ focus | default([]) }}"
      focus_axes: "{{ step_1_result.focus_axes | default([]) }}"
      critical_paths: "{{ step_1_result.critical_paths | default([]) }}"
      delegate_security: "{{ delegate_security | default(false) }}"
      delegate_bug_hunt: "{{ delegate_bug_hunt | default(false) }}"
      delegate_architecture: "{{ delegate_architecture | default(false) }}"
      probe_findings: "{{ probe_findings | default('') }}"

  - ordinal: 3
    action: parallel
    condition: "delegate_security == true OR delegate_bug_hunt == true OR delegate_architecture == true"
    description: >
      PARALLEL DELEGATION: Run delegated specialist skills concurrently. Each
      branch invokes one specialist skill (kali-audit for security, bug-hunt for
      deep defects, refactor-architecture for architecture) against the change
      model from step 1. Results join into a single object keyed by delegate
      name. join: allSettled — a failed delegate does not abort the others;
      its error is captured in the errors sidecar. The adjudicate step (step 4)
      consumes the joined findings as supplementary raw_findings alongside the
      inline perspectives from step 2.

      This replaces the agent-mediated sequential delegation path (where the
      agent invokes specialist skills one at a time between steps 2 and 3).
      Concurrent execution reduces wall-clock time when multiple delegates are
      enabled. When no delegates are enabled, the condition skips this step
      and the cascade proceeds directly from perspectives to adjudicate.
    timeout_seconds: 300
    input_mapping:
      join: "allSettled"
      branches:
        - branch_id: "security"
          template_ref: "kali-audit"
          condition: "delegate_security == true"
          input_mapping:
            surface: "code"
            target_files: "{{ step_1_result.changed_files | default([]) }}"
        - branch_id: "bug_hunt"
          template_ref: "bug-hunt"
          condition: "delegate_bug_hunt == true"
          input_mapping:
            target: "{{ step_1_result.change_model | default({}) }}"
            quality_criteria: "{{ change_spec | default('') }}"
        - branch_id: "architecture"
          template_ref: "refactor-architecture"
          condition: "delegate_architecture == true"
          input_mapping:
            target: "{{ step_1_result.change_model | default({}) }}"

  - ordinal: 4
    action: select
    description: >
      ADJUDICATE (Fagan defect collection). Turn raw observations into tiered,
      evidence-backed verdicts. Applies pragmatic-semantics IS/OUGHT + epistemic
      mode + provenance, frames each as a falsifiable hypothesis (H0/H1 +
      falsifier), derives severity from constraint force (Prohibition→Blocker,
      Guideline→Should-fix, Preference→Nit, Informational→FYI), runs grill-me
      self-challenge, and enforces file:line no-fiction citation (uncited
      findings rejected, not dropped). Computes blocker_delta vs prior_review.
      Detection/collection separation (Sauer) — does NOT re-scan the code.
    renderer: minijinja
    template_ref: code-review/code-review-adjudicate
    timeout_seconds: 180
    input_mapping:
      raw_findings: "{{ step_2_result.raw_findings | default([]) }}"
      change_spec: "{{ change_spec }}"
      critical_paths: "{{ step_1_result.critical_paths | default([]) }}"
      prior_review: "{{ prior_review | default({}) }}"
      # Findings from parallel delegation (step 3). Each key holds the
      # specialist skill's cascade output. Empty when no delegates were
      # enabled (step 3 was skipped) or a delegate errored (allSettled
      # captures the error in the errors sidecar, not here).
      delegate_findings: "{{ step_3_result | default({}) }}"

  - ordinal: 5
    action: compute
    compute_ref: lisp.eval
    description: >
      SEVERITY CONSISTENCY CHECK: verify that severity_counts internal
      totals match the adjudicated_findings length. The sum of blockers +
      should_fix + nit + fyi must equal adjudicated_findings.length. A
      mismatch means the adjudicate step lost or invented findings — a
      broken feedback loop. Returns 0 = consistent, 1 = inconsistent.
      An inconsistent result pollutes the convergence signal, forcing a
      re-run of the adjudicate step.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((findings (assoc "adjudicated_findings" step_4_result))
              (counts (assoc "severity_counts" step_4_result)))
          (let ((sum (+ (+ (assoc "blockers" counts) (assoc "should_fix" counts))
                         (+ (assoc "nit" counts) (assoc "fyi" counts)))))
            (if (= sum (length findings)) 0 1)))
      env:
        step_4_result: "{{ step_4_result }}"

  - ordinal: 6
    action: select
    description: >
      REPORT (Fagan outputs). Produce a verdict driven by Blocker presence
      (not nit count): Approve / Request changes / Comment. Group findings by
      severity, lead with what matters, attach a NAMED structural remedy to
      every architectural/structural finding, rank the 3 highest-leverage top
      fixes, and emit coverage honesty (checked / not_checked / residual_risk —
      never a bare "LGTM"). Emits lessons_learned and next_review_focus for
      loop closure.
    renderer: minijinja
    template_ref: code-review/code-review-report
    timeout_seconds: 150
    input_mapping:
      adjudicated_findings: "{{ step_4_result.adjudicated_findings | default([]) }}"
      change_model: "{{ step_1_result.change_model | default({}) }}"
      size_class: "{{ step_1_result.size_class | default('') }}"
      rejected_findings: "{{ step_4_result.rejected_findings | default([]) }}"
      severity_counts: "{{ step_4_result.severity_counts | default({}) }}"
      blocker_delta: "{{ step_4_result.blocker_delta | default(0) }}"
      prior_review: "{{ prior_review | default({}) }}"

  - ordinal: 7
    action: select
    description: >
      IMPLEMENT (Fagan rework — Act phase). Caller-gated via fix_mode. SKIPPED
      by step.condition unless fix_mode is one of blockers/should_fix/all
      (default-deny: absence and 'none' both skip — the review is review-first).
      The executor cannot obtain interactive consent mid-cascade, so enabling
      requires a caller that passes fix_mode into context (programmatic/CI, or a
      future SkillToolInput params extension); the interactive skill tool passes
      only {name, task} today, so this step is inert on that path. For each finding
      at/above the requested tier with
      a concrete remedy, produce ONE surgical edit (file, location, exact
      verbatim old_text read from the actual file, new_text). Reuses the
      report's structural remedies. Honors project conventions and .rules.
      Never fabricates old_text — skips findings it cannot ground.
    renderer: minijinja
    template_ref: code-review/code-review-implement
    timeout_seconds: 180
    condition: "fix_mode == 'blockers' OR fix_mode == 'should_fix' OR fix_mode == 'all'"
    input_mapping:
      adjudicated_findings: "{{ step_4_result.adjudicated_findings | default([]) }}"
      review: "{{ step_6_result.review | default({}) }}"
      fix_mode: "{{ fix_mode | default('none') }}"
      change_model: "{{ step_1_result.change_model | default({}) }}"

  - ordinal: 8
    action: compute
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 3's actual adjudicate
      output. The convergence signal is the weighted count of open findings:
      severity_counts.blockers + 0.5 * severity_counts.should_fix, plus the
      consistency penalty from step 4 (0 = consistent, 1 = inconsistent).
      An inconsistent adjudicate adds 100 to the signal, forcing a re-run.
      If severity_counts or any count is absent, the form errors (no silent
      default), surfacing a broken adjudicate step rather than masking it.
    timeout_seconds: 10
    input_mapping:
      form: "(+ (+ (assoc \"blockers\" (assoc \"severity_counts\" step_4_result)) (* 0.5 (assoc \"should_fix\" (assoc \"severity_counts\" step_4_result)))) (* 100 step_5_result))"
      env:
        step_4_result: "{{ step_4_result }}"
        step_5_result: "{{ step_5_result }}"

  - ordinal: 9
    action: loop
    description: >
      Re-enter the review cycle if convergence is not met. Routes the report's
      next_review_focus (and lessons_learned) and the prior pass's blocker
      count back to scope as prior_review, closing the feedback loop. The next
      pass's scope consumes next_review_focus as its primary emphasis and
      adjudicate computes a fresh blocker_delta against the updated baseline.
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_review:
        next_review_focus: "{{ step_6_result.next_review_focus | default('') }}"
        lessons_learned: "{{ step_6_result.lessons_learned | default([]) }}"
        blockers: "{{ step_4_result.severity_counts.blockers | default(0) }}"
      convergence_signal: "{{ step_8_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.code-review
  telemetry_namespace: hkask.template.code-review
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_reg_events: true
