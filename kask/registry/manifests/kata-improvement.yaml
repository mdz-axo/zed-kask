# Improvement Kata Process Manifest
# ℏKask v0.35.0 — Improvement cycle as convergent PDCA
#
# Two modes:
#   improvement (default) — 4-step PDCA: direction → current → target → experiment
#   beginner              — Foundational drills: Five Questions, PDCA Cycle, Observation Drill
#                          Agents graduate when automaticity > 0.5.

manifest:
  id: kata-improvement
  category: skill
  name: Kata Improvement
  description: >
    Convergent four-step improvement kata. Establishes direction, assesses
    current condition, sets target condition, defines next experiment, then
    computes convergence and iterates. Includes beginner_mode (folded from
    kata-starter): foundational drills for habit-building — Five Questions,
    PDCA Cycle, and Observation Drill. Agents graduate when automaticity > 0.5.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: mode
    type: string
    required: false
    default: "improvement"
    description: >
      Kata mode: "improvement" (default — 4-step PDCA cycle) or "beginner"
      (foundational drills for habit-building).
  - name: challenge
    type: string
    required: false
    description: >
      The strategic challenge (improvement mode). Required when mode is
      "improvement"; ignored in beginner mode.
  - name: current_metrics
    type: object
    required: false
  - name: learner_profile
    type: object
    required: false
    description: >
      Learner profile for beginner mode — practice history, automaticity
      scores, and current drill focus.

steps:
  # ── Phase 3 co-evolution: read prior PDCA cycles before Kata ──
  # The persistence loop (2.3): read prior PDCA cycles from the kata-kanban
  # MCP before the Kata cycle starts. The prior tasks feed the direction step
  # so the agent knows what experiments have already been run and what
  # was learned. on_failure: report surfaces a broken kanban channel
  # to the Curator without blocking the Kata cycle.
  - ordinal: 1
    action: execute
    description: >
      Read prior kanban boards via kanban_board_list MCP tool. Deterministic.
      Returns all boards owned by the caller. The first board's ID feeds
      step 2 (kanban_task_list) to read prior PDCA tasks.
    mcp: kanban_board_list
    timeout_seconds: 30
    on_failure:
      action: report
      resume: >
        kanban_board_list failed — prior PDCA boards are not available.
        The Kata cycle proceeds without prior experiment context.
    input_mapping: {}

  - ordinal: 2
    action: execute
    description: >
      Read prior PDCA tasks from the first kanban board via kanban_task_list
      MCP tool. Deterministic. Returns all tasks (PDCA cycles) on the board.
      The tasks feed the direction step (step 7) so the agent knows what
      experiments have already been run.
    mcp: kanban_task_list
    condition: "step_1_result.boards"
    timeout_seconds: 30
    on_failure:
      action: report
      resume: >
        kanban_task_list failed — prior PDCA tasks are not available.
        The Kata cycle proceeds without prior experiment context.
    input_mapping:
      board_id: "{{ step_1_result.boards[0].board_id | default('') }}"

  # === BEGINNER MODE (folded from kata-starter) ===
  - ordinal: 3
    action: select
    condition: "mode == 'beginner'"
    description: >
      BEGINNER SELECTOR: Select appropriate starter drill based on learner
      profile and practice history. If no history, start with Observation
      Drill. If automaticity is low in a specific drill, target that drill.
      If 7+ days since last practice, restart with Observation Drill.
    renderer: minijinja
    template_ref: kata-improvement/beginner-selector
    timeout_seconds: 120
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      practice_goal: "{{ practice_goal | default('foundational scientific thinking') }}"

  - ordinal: 4
    action: select
    condition: "mode == 'beginner' AND step_3_result.selected_drill == 'five-questions'"
    description: >
      BEGINNER FIVE QUESTIONS DRILL: Practice asking the 5 coaching questions
      in order on a trivial process (making toast, brewing coffee).
    renderer: minijinja
    template_ref: kata-improvement/beginner-five-questions
    timeout_seconds: 120
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      selector_result: "{{ step_3_result }}"

  - ordinal: 5
    action: select
    condition: "mode == 'beginner' AND step_3_result.selected_drill == 'pdca-cycle'"
    description: >
      BEGINNER PDCA CYCLE DRILL: Practice Plan-Do-Check-Act on a trivial
      measurable process.
    renderer: minijinja
    template_ref: kata-improvement/beginner-pdca-cycle
    timeout_seconds: 120
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      selector_result: "{{ step_3_result }}"

  - ordinal: 6
    action: select
    condition: "mode == 'beginner' AND step_3_result.selected_drill == 'observation-drill'"
    description: >
      BEGINNER OBSERVATION DRILL: Practice separating observed facts (IS) from
      interpretations (OUGHT).
    renderer: minijinja
    template_ref: kata-improvement/beginner-observation-drill
    timeout_seconds: 120
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      selector_result: "{{ step_3_result }}"

  - ordinal: 7
    action: compute
    condition: "mode == 'beginner'"
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from the beginner drill's actual
      output. Only one of steps 2/3/4 runs (selected by step 1); the others
      are null. The convergence signal is the graduation criterion:
      1.0 - automaticity_self_assess from the five-questions drill (step 2).
      If the five-questions drill did not run (step_2_result is null) or
      automaticity_self_assess is absent, the form returns 1.0 (not yet
      graduated — pdca-cycle and observation-drill do not measure
      automaticity directly). Lower = more converged.
    timeout_seconds: 10
    input_mapping:
      form: "(if (is_null step_2_result) 1.0 (let ((a (assoc \"automaticity_self_assess\" step_2_result))) (if (is_null a) 1.0 (- 1.0 a))))"
      env:
        step_2_result: "{{ step_4_result }}"

  - ordinal: 8
    action: select
    condition: "mode != 'beginner'"
    description: Step 1 — understand direction/challenge.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step1-direction.j2
    timeout_seconds: 120
    input_mapping:
      challenge: "{{ challenge }}"
      prior_kanban: "{{ step_2_result | default({}) }}"
      prior_boards: "{{ step_1_result | default({}) }}"

  - ordinal: 9
    action: select
    condition: "mode != 'beginner'"
    description: Step 2 — grasp current condition with data.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step2-current.j2
    timeout_seconds: 120
    input_mapping:
      challenge: "{{ challenge }}"
      current_metrics: "{{ current_metrics | default({}) }}"
      direction: "{{ step_8_result }}"

  - ordinal: 10
    action: select
    condition: "mode != 'beginner'"
    description: Step 3 — establish target condition.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step3-target.j2
    timeout_seconds: 120
    input_mapping:
      challenge: "{{ challenge }}"
      current_condition: "{{ step_9_result }}"

  - ordinal: 11
    action: select
    condition: "mode != 'beginner'"
    description: Step 4 — define next experiment.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step4-experiment.j2
    timeout_seconds: 120
    input_mapping:
      challenge: "{{ challenge }}"
      current_condition: "{{ step_9_result }}"
      target_condition: "{{ step_10_result }}"

  - ordinal: 12
    action: compute
    condition: "mode != 'beginner'"
    compute_ref: lisp.eval
    description: >
      Compute structural-validity score from step 10's actual experiment
      output. The convergence signal is the count of missing core experiment
      fields (obstacle, next_experiment, prediction, measurement_method,
      success_criterion, learning_commitment, when_to_check): 7 minus the
      number present. Lower = more converged (zero missing = well-defined
      experiment). If step_9_result is null or a core field is absent, the
      form counts it as missing (no silent default that masks a broken
      experiment step).
    timeout_seconds: 10
    input_mapping:
      form: "(- 7 (+ (if (is_null (assoc \"obstacle\" step_9_result)) 0 1) (if (is_null (assoc \"next_experiment\" step_9_result)) 0 1) (if (is_null (assoc \"prediction\" step_9_result)) 0 1) (if (is_null (assoc \"measurement_method\" step_9_result)) 0 1) (if (is_null (assoc \"success_criterion\" step_9_result)) 0 1) (if (is_null (assoc \"learning_commitment\" step_9_result)) 0 1) (if (is_null (assoc \"when_to_check\" step_9_result)) 0 1)))"
      env:
        step_9_result: "{{ step_11_result }}"

  - ordinal: 13
    action: loop
    condition: "mode == 'beginner'"
    description: Re-enter beginner kata cycle if convergence is not met.
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 3 }}"
      # Push the drill quality signal into convergence_signal so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      convergence_signal: "{{ step_7_result }}"

  - ordinal: 14
    action: loop
    condition: "mode != 'beginner'"
    description: Re-enter improvement kata cycle if convergence is not met.
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 8 }}"
      # Push the experiment quality signal into convergence_signal so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      convergence_signal: "{{ step_12_result }}"

error_handling:
  on_error: retry
  max_retries: 1
  retry_backoff_seconds: 1

# Recommends: improv skill for self-directed coaching posture during Step 4.
# - Plan (design experiment) → Yes But
# - Check (compare prediction to actual) → Plussing
# Beginner mode recommends: improv for constructive interaction postures.
# - Observation Drill → Plussing
# - Five Questions Drill → Yes And

ledger:
  emit_spans: true
  span_namespace: reg.skill.kata-improvement
  telemetry_namespace: hkask.template.kata-improvement
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_reg_events: true
