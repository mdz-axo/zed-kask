# Improvement Kata Process Manifest
# ℏKask v0.31.0 — Improvement cycle as convergent PDCA
#
# Two modes:
#   improvement (default) — 4-step PDCA: direction → current → target → experiment
#   beginner              — Foundational drills: Five Questions, PDCA Cycle, Observation Drill
#                          Agents graduate when automaticity > 0.5.

manifest:
  id: kata-improvement
  category: skill
  name: Kata Improvement
  description: >
    Convergent four-step improvement kata. Establishes direction, assesses
    current condition, sets target condition, defines next experiment, then
    computes convergence and iterates. Includes beginner_mode (folded from
    kata-starter): foundational drills for habit-building — Five Questions,
    PDCA Cycle, and Observation Drill. Agents graduate when automaticity > 0.5.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 3
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: mode
    type: string
    required: false
    default: "improvement"
    description: >
      Kata mode: "improvement" (default — 4-step PDCA cycle) or "beginner"
      (foundational drills for habit-building).
  - name: challenge
    type: string
    required: false
    description: >
      The strategic challenge (improvement mode). Required when mode is
      "improvement"; ignored in beginner mode.
  - name: current_metrics
    type: object
    required: false
  - name: learner_profile
    type: object
    required: false
    description: >
      Learner profile for beginner mode — practice history, automaticity
      scores, and current drill focus.

steps:
  # === BEGINNER MODE (folded from kata-starter) ===
  - ordinal: 1
    action: select
    condition: "{{ mode | default('improvement') == 'beginner' }}"
    description: >
      BEGINNER SELECTOR: Select appropriate starter drill based on learner
      profile and practice history. If no history, start with Observation
      Drill. If automaticity is low in a specific drill, target that drill.
      If 7+ days since last practice, restart with Observation Drill.
    renderer: minijinja
    template_ref: kata-improvement/beginner-selector
    gas_cap: 2500
    timeout_seconds: 30
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      practice_goal: "{{ practice_goal | default('foundational scientific thinking') }}"

  - ordinal: 2
    action: select
    condition: "{{ mode | default('improvement') == 'beginner' and step_1_result.selected_drill == 'five-questions' }}"
    description: >
      BEGINNER FIVE QUESTIONS DRILL: Practice asking the 5 coaching questions
      in order on a trivial process (making toast, brewing coffee).
    renderer: minijinja
    template_ref: kata-improvement/beginner-five-questions
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      selector_result: "{{ step_1_result }}"

  - ordinal: 3
    action: select
    condition: "{{ mode | default('improvement') == 'beginner' and step_1_result.selected_drill == 'pdca-cycle' }}"
    description: >
      BEGINNER PDCA CYCLE DRILL: Practice Plan-Do-Check-Act on a trivial
      measurable process.
    renderer: minijinja
    template_ref: kata-improvement/beginner-pdca-cycle
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      selector_result: "{{ step_1_result }}"

  - ordinal: 4
    action: select
    condition: "{{ mode | default('improvement') == 'beginner' and step_1_result.selected_drill == 'observation-drill' }}"
    description: >
      BEGINNER OBSERVATION DRILL: Practice separating observed facts (IS) from
      interpretations (OUGHT).
    renderer: minijinja
    template_ref: kata-improvement/beginner-observation-drill
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      learner_profile: "{{ learner_profile | default({}) }}"
      selector_result: "{{ step_1_result }}"

  - ordinal: 5
    action: compute
    condition: "{{ mode | default('improvement') == 'beginner' }}"
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  # === IMPROVEMENT MODE (default) ===
  - ordinal: 6
    action: select
    condition: "{{ mode | default('improvement') == 'improvement' }}"
    description: Step 1 — understand direction/challenge.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step1-direction.j2
    gas_cap: 3000
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"

  - ordinal: 7
    action: select
    condition: "{{ mode | default('improvement') == 'improvement' }}"
    description: Step 2 — grasp current condition with data.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step2-current.j2
    gas_cap: 3500
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"
      current_metrics: "{{ current_metrics | default({}) }}"
      direction: "{{ step_6_result }}"

  - ordinal: 8
    action: select
    condition: "{{ mode | default('improvement') == 'improvement' }}"
    description: Step 3 — establish target condition.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step3-target.j2
    gas_cap: 3500
    timeout_seconds: 45
    input_mapping:
      challenge: "{{ challenge }}"
      current_condition: "{{ step_7_result }}"

  - ordinal: 9
    action: select
    condition: "{{ mode | default('improvement') == 'improvement' }}"
    description: Step 4 — define next experiment.
    renderer: minijinja
    template_ref: kata-improvement/improvement-step4-experiment.j2
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      challenge: "{{ challenge }}"
      current_condition: "{{ step_7_result }}"
      target_condition: "{{ step_8_result }}"

  - ordinal: 10
    action: compute
    condition: "{{ mode | default('improvement') == 'improvement' }}"
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 11
    action: loop
    condition: "{{ mode | default('improvement') == 'beginner' }}"
    description: Re-enter beginner kata cycle if convergence is not met.
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the drill quality signal into kata_hypotenuse so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      kata_hypotenuse: "{{ step_4_result.convergence_metric | default(step_3_result.convergence_metric | default(step_2_result.convergence_metric | default(1.0))) }}"

  - ordinal: 12
    action: loop
    condition: "{{ mode | default('improvement') == 'improvement' }}"
    description: Re-enter improvement kata cycle if convergence is not met.
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 7 }}"
      # Push the experiment quality signal into kata_hypotenuse so the Cauchy
      # criterion can detect when the iterates have stopped moving.
      kata_hypotenuse: "{{ step_9_result.convergence_metric | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    # Beginner mode templates
    - resource: template
      action: render
      template_id: kata-improvement/beginner-selector
      gas_budget: 2500
    - resource: template
      action: render
      template_id: kata-improvement/beginner-five-questions
      gas_budget: 3000
    - resource: template
      action: render
      template_id: kata-improvement/beginner-pdca-cycle
      gas_budget: 3000
    - resource: template
      action: render
      template_id: kata-improvement/beginner-observation-drill
      gas_budget: 3000
    # Improvement mode templates
    - resource: template
      action: render
      template_id: kata-improvement/improvement-step1-direction
      gas_budget: 3000
    - resource: template
      action: render
      template_id: kata-improvement/improvement-step2-current
      gas_budget: 3500
    - resource: template
      action: render
      template_id: kata-improvement/improvement-step3-target
      gas_budget: 3500
    - resource: template
      action: render
      template_id: kata-improvement/improvement-step4-experiment
      gas_budget: 4000
    - resource: manifest
      action: execute
      template_id: kata-improvement
      gas_budget: 1000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 3600
  template_scoped: true

# Recommends: improv skill for self-directed coaching posture during Step 4.
# - Plan (design experiment) → Yes But
# - Check (compare prediction to actual) → Plussing
# Beginner mode recommends: improv for constructive interaction postures.
# - Observation Drill → Plussing
# - Five Questions Drill → Yes And

ledger:
  emit_spans: true
  span_namespace: reg.skill.kata-improvement
  telemetry_namespace: hkask.template.kata-improvement
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
