# Listening Process Manifest
# ℏKask v0.34.0 — MAIA v3 listening skill as a retrieve-cite-verify process
# Design: kask/docs/explanation/earnings-transcript-analysis-design.md §(b), §(c)
#
# No-fabrication design (process-embedded, not instruction-embedded):
# The transcript is pre-split into numbered chunks (step 1). The model
# searches the chunks and cites what it found (step 2). A post-processing
# step verifies each cited substring is present in the referenced chunk
# (step 3). The model cannot fabricate a quote because the process never
# gives it a "write a quote" step — only a "find a quote and point to it"
# step. The verification is mechanical (substring match), not model-mediated.

manifest:
  id: listening
  category: skill
  name: Listening
  description: >
    Applies the MAIA v3 listening template to an earnings-call transcript.
    Retrieve-cite-verify process: the transcript is split into numbered
    chunks, the model searches the chunks for evidence and cites what it
    found (chunk_id + substring), and a post-processing step verifies each
    cited substring is present in the referenced chunk. The no-fabrication
    invariant is enforced by the process, not by the prompt.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  # Single-pass: the design (§(c) pragmatic-cybernetics) says "the loop
  # terminates per quarter (one pass over one transcript, fixed template, no
  # iteration) — it is a sense→act loop, not an optimizing loop." So
  # min=max=1; convergence is trivially satisfied on the first pass.
  convergence_mode: ""
  max_iterations: 1
  min_iterations: 1
  on_not_reached: escalate

gas:
  cap: 120000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: transcript
    type: string
    required: true
  - name: prior_transcripts
    type: array
    required: false
  - name: company_symbol
    type: string
    required: false

ledger:
  span_namespace: reg.skill.listening

steps:
  - ordinal: 1
    action: compute
    compute_ref: listening.chunk_transcript
    description: >
      Split the transcript into numbered chunks (by speaker turns or
      paragraph boundaries). This is the pre-splitting step that makes the
      retrieve-cite-verify process possible — the model searches numbered
      chunks, not raw text, so each piece of evidence can reference a
      specific chunk_id for mechanical verification.
    input_mapping:
      transcript: "{{ transcript }}"
      prior_transcripts: "{{ prior_transcripts | default([]) }}"

  - ordinal: 2
    action: select
    description: >
      Apply the v3 listening template to the chunked transcript. The model
      searches the chunks for evidence, cites what it found (chunk_id +
      substring + char_start), and emits per-section verdicts with the
      checkpoint map and ignored_short_term.
    renderer: minijinja
    template_ref: listening/apply-template
    gas_cap: 100000
    timeout_seconds: 60
    input_mapping:
      transcript_chunks: "{{ step_1_result.transcript_chunks | default([]) }}"
      prior_transcript_chunks: "{{ step_1_result.prior_transcript_chunks | default([]) }}"
      company_symbol: "{{ company_symbol | default('UNKNOWN') }}"

  - ordinal: 3
    action: compute
    compute_ref: listening.verify_citations
    description: >
      VERIFY CITATIONS: for every evidence item in the model's output, check
      that the `quote` is a substring of the chunk referenced by `chunk_id`.
      Reject any verdict whose evidence fails the substring check. This is
      the mechanical enforcement of the no-fabrication invariant — the
      process verifies, not the model.
    input_mapping:
      model_output: "{{ step_2_result }}"
      transcript_chunks: "{{ step_1_result.transcript_chunks | default([]) }}"

  - ordinal: 4
    action: loop
    description: Single-pass — no loop (max_iterations=1).
    input_mapping:
      loop_target: "{{ 1 }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: abort
  max_retries: 0
  retry_backoff_seconds: 1
  on_validation_failure: abort
