manifest:
  id: bootstrap-sequence
  category: runtime-config
  name: Bootstrap Sequence
  description: 'Ordered system initialization with dependency resolution. Topological sort ensures no
    circular dependencies.

    '
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public
error_handling:
  on_critical_failure: abort
  on_non_critical_failure: continue_with_warning
  on_timeout: retry_then_abort
  max_retries: 2
  retry_backoff_seconds: 10
  diagnostic_output:
  - failed_component
  - dependency_tree
  - readiness_probe_output
  - reg_span_ref
ledger:
  emit_bootstrap_spans: true
  span_namespace: reg.skill.bootstrap-sequence
audit:
  enabled: true
  log_level: info
  include_timestamps: true
  include_dependency_tree: true
  git_snapshot: true
  git_path: registry/bootstrap-archives
