# Bootstrap Sequence — hKask System Initialization
# ℏKask v0.33.3 - A Minimal Viable Container for UserPods

manifest:
  id: bootstrap-sequence
  category: runtime-config
  name: Bootstrap Sequence
  description: >
    Ordered system initialization with dependency resolution.
    Topological sort ensures no circular dependencies.
  version: "0.33.3"
  editor: curator-or-human-admin
  visibility: Public

gas:
  cap: 50000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 0
  alert_threshold: 0.8
  hard_limit: true

# Error Handling
error_handling:
  on_timeout: retry_then_abort
  max_retries: 2
  retry_backoff_seconds: 10

# Regulation Integration
ledger:
  span_namespace: reg.skill.bootstrap-sequence

# Audit Trail
audit:
  enabled: true
  log_level: info
