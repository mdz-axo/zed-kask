# Falsifiability Process Manifest
# ℏKask v0.35.0 — Eliminative inference as convergent PDCA
# Popper (admissibility) → Chamberlin (multiple hypotheses) → Pearl/Halpern
# (counterfactuals) → Platt (discriminating tests) → eliminate → converge.

manifest:
  id: falsifiability
  category: skill
  name: Falsifiability
  description: >
    Domain-agnostic eliminative inference process. Admits the target through
    a Popper falsifiability gate, generates multiple working hypotheses
    (Chamberlin), constructs minimal counterfactuals (Pearl do-operator),
    designs discriminating tests (Platt), eliminates the hypotheses whose
    falsifiable predictions fail, and converges when one corroborated survivor
    remains with all alternatives eliminated — or when the irreducible
    remainder is honestly reported. A delegation target for diagnose,
    hypothesis-framer, superforecasting, and sequential-inquiry.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: target
    type: string
    required: false
  - name: domain
    type: string
    required: false
  - name: context
    type: object
    required: false
  - name: observations
    type: array
    required: false
  - name: prior_metric
    type: number
    required: false

ledger:
  span_namespace: reg.skill.falsifiability

steps:
  - ordinal: 1
    action: select
    description: >
      Popper admissibility gate. Test whether the target claim or question is
      testable at all — state the concrete observation that would contradict
      it. Rule out tautologies, pure OUGHTs, and unfalsifiable-by-construction
      claims; propose a refined testable reformulation if salvageable.
    renderer: minijinja
    template_ref: falsifiability/falsifiability-admit
    timeout_seconds: 120
    input_mapping:
      target: "{{ task | default(target) }}"
      domain: "{{ domain | default('') }}"
      context: "{{ context | default({}) }}"

  - ordinal: 2
    action: select
    description: >
      Chamberlin multiple working hypotheses. Generate 3–7 ranked candidate
      explanations with forced diversity, each carrying a Platt-form prediction
      and a falsifier; discard vibes at generation. Uses the admitted target
      (refined reformulation if the admit gate produced one, else the original).
    renderer: minijinja
    template_ref: falsifiability/falsifiability-hypothesize
    timeout_seconds: 150
    input_mapping:
      admitted_target: "{{ step_1_result.refined_target | default(target, true) }}"
      domain: "{{ domain | default('') }}"
      context: "{{ context | default({}) }}"
      # Carry prior Lisp defects forward so the LLM repairs cumulatively across
      # loop iterations. step_3_result is the bare defect list from the Lisp
      # invariant check (not an object with a .defects field).
      prior_defects: "{{ prev_step_3_result | default([]) }}"

  # ── Step 3: Lisp deterministic step — hypothesis structural invariant check ──
  # The LLM generates 3-7 hypotheses in step 2, but LLMs are unreliable at
  # counting their own outputs, checking every hypothesis has both a prediction
  # and a falsifier, forcing diversity, and detecting duplicates. This Lisp step
  # deterministically checks all four invariants (count, completeness, diversity,
  # mutual exclusivity) — the same four-invariant form used in
  # lisp-scaffold-reasoning, validated by the
  # `dispatch_lisp_eval_hypothesis_four_invariants` test in compute.rs.
  #
  # Returns a list of defect strings — empty = passed, non-empty = step 4
  # (counterfactual generation) is gated on the LLM repairing the defects first.
  # This is the symbolic-neural scaffolding pattern: deterministic Lisp prunes
  # the LLM's probabilistic hypothesis output before the expensive counterfactual
  # step runs. No point constructing counterfactuals for structurally invalid
  # hypotheses (missing falsifier, duplicate, insufficient diversity).
  - ordinal: 3
    action: compute
    compute_ref: lisp.eval
    description: >
      Lisp hypothesis invariant check. Deterministically evaluates all four
      structural invariants on the Chamberlin hypothesis set: count (3-7),
      completeness (every hypothesis has prediction + falsifier keys), diversity
      (>=2 distinct likelihoods), mutual exclusivity (no duplicate hypothesis
      text). Returns a list of defect strings. No LLM round-trip.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((hyps (assoc "hypotheses" step_2_result)))
          (if (is_null hyps)
              (list "no_hypotheses_field")
              (let ((n (length hyps)))
                (begin
                  (define count-defects
                    (if (< n 3)
                        (list "insufficient_count_below_3")
                        (if (> n 7)
                            (list "excessive_count_above_7")
                            (list))))
                  (define check-completeness
                    (lambda (hs acc)
                      (if (is_null hs)
                          acc
                          (let ((h (car hs)))
                            (let ((acc2 (if (is_null (assoc "prediction" h))
                                            (cons "missing_prediction" acc)
                                            acc)))
                              (let ((acc3 (if (is_null (assoc "falsifier" h))
                                              (cons "missing_falsifier" acc2)
                                              acc2)))
                                (check-completeness (cdr hs) acc3)))))))
                  (define completeness-defects (check-completeness hyps (list)))
                  (define check-diversity
                    (lambda (hs nh nm nl)
                      (if (is_null hs)
                          (let ((distinct (+ (if (> nh 0) 1 0) (if (> nm 0) 1 0) (if (> nl 0) 1 0))))
                            (if (< distinct 2)
                                (list "insufficient_diversity_below_2")
                                (list)))
                          (let ((h (car hs)))
                            (let ((lk (assoc "likelihood" h)))
                              (let ((is-high (string= lk "high")))
                                (let ((is-med (string= lk "medium")))
                                  (let ((is-low (string= lk "low")))
                                    (check-diversity
                                      (cdr hs)
                                      (if is-high (+ nh 1) nh)
                                      (if is-med (+ nm 1) nm)
                                      (if is-low (+ nl 1) nl))))))))))
                  (define diversity-defects (check-diversity hyps 0 0 0))
                  (define check-duplicates
                    (lambda (hs seen)
                      (if (is_null hs)
                          (list)
                          (let ((h (car hs)))
                            (let ((hyp-text (assoc "hypothesis" h)))
                              (let ((hyp-str (if (is_null hyp-text) "" hyp-text)))
                                (if (not (is_null (assoc hyp-str seen)))
                                    (cons "duplicate_hypothesis" (check-duplicates (cdr hs) seen))
                                    (check-duplicates (cdr hs) (cons (list hyp-str true) seen)))))))))
                  (define duplicate-defects (check-duplicates hyps (list)))
                  (append
                    count-defects completeness-defects
                    diversity-defects duplicate-defects)))))
      env:
        step_2_result: "{{ step_2_result }}"

  # ── Step 4: LLM probabilistic step — counterfactual generation, gated on Lisp verdict ──
  # Only runs if the Lisp hypothesis check passed (no structural defects). If
  # the Lisp step found defects, the loop (step 8) re-enters at step 2
  # (hypothesize) so the LLM repairs the defects before counterfactuals are
  # constructed. This gates the expensive counterfactual step on structural
  # validity — no point constructing counterfactuals for hypotheses missing a
  # falsifier or with insufficient diversity.
  - ordinal: 4
    action: select
    condition: "NOT step_3_result"
    description: >
      Pearl/Halpern counterfactual generation. For each surviving hypothesis
      construct the minimal do(not X) counterfactual, hold confounders fixed,
      derive the testable consequence, flag irreducible causes. Gated on the
      Lisp hypothesis invariant check (step 3) — only runs when the hypothesis
      set is structurally valid.
    renderer: minijinja
    template_ref: falsifiability/falsifiability-counterfactual
    timeout_seconds: 150
    input_mapping:
      hypotheses: "{{ step_2_result.hypotheses | default([]) }}"
      admitted_target: "{{ step_1_result.refined_target | default(target, true) }}"
      domain: "{{ domain | default('') }}"
      hypothesis_defects: "{{ step_3_result | default([]) }}"

  - ordinal: 5
    action: select
    description: >
      Platt discriminating-test design. Design tests that rule out at least one
      hypothesis; build the coverage matrix; flag irreducible pairs. Each
      surviving hypothesis must be falsifiable by at least one designed test.
    renderer: minijinja
    template_ref: falsifiability/falsifiability-discriminate
    timeout_seconds: 150
    input_mapping:
      hypotheses: "{{ step_2_result.hypotheses | default([]) }}"
      counterfactuals: "{{ step_4_result.counterfactuals | default([]) }}"
      domain: "{{ domain | default('') }}"

  - ordinal: 6
    action: select
    description: >
      Apply evidence and eliminate. Hypotheses whose falsifiable predictions
      are contradicted by observations are ruled out (hard, not probabilistic).
      Survivors are corroborated, never confirmed. If no observations are
      supplied, returns the discriminating-test design with verdict
      tests_pending.
    renderer: minijinja
    template_ref: falsifiability/falsifiability-eliminate
    timeout_seconds: 150
    input_mapping:
      hypotheses: "{{ step_2_result.hypotheses | default([]) }}"
      discriminating_tests: "{{ step_5_result.discriminating_tests | default([]) }}"
      observations: "{{ observations | default([]) }}"

  - ordinal: 7
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the eliminated-hypothesis count from
      the elimination step. Lower signal variance across iterations =
      convergence (Cauchy). Using lisp.eval instead of a Jinja expression
      makes the computation explicitly deterministic, budgeted
      (gas_cap: 100), and observable via a reg.skill.falsifiability span.
      Guards against a missing eliminated field by returning 0 when absent —
      when step 6 was skipped (hypothesis defects), the 0 does not cause
      false convergence because loop_target re-enters at step 2.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((eliminated (assoc "eliminated" step_6_result)))
          (if (is_null eliminated) 0 (length eliminated)))
      env:
        step_6_result: "{{ step_6_result | default({}) }}"

  - ordinal: 8
    action: loop
    description: >
      Re-enter the elimination cycle if convergence is not met. On re-entry,
      carry the prior iteration's eliminated set so elimination is cumulative
      and the materiality guard can detect a plateau. If the Lisp hypothesis
      check (step 3) found defects, re-enter at step 2 (hypothesize) so the LLM
      repairs the structural defects before counterfactuals are constructed.
    timeout_seconds: 30
    input_mapping:
      # If hypothesis check failed, re-enter at hypothesize (step 2); else
      # re-enter at counterfactual (step 4) for convergence-driven refinement.
      loop_target: "{{ 2 if (step_3_result | default([]) | length > 0) else 4 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 7). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_7_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
