# Pragmatic Cybernetics Process Manifest
# ℏKask v0.35.0 — Loop diagnostics as convergent PDCA
# EXTENDED: Wired variety-check and vsm-map templates (previously orphaned).

manifest:
  id: pragmatic-cybernetics
  category: skill
  name: Pragmatic Cybernetics
  description: >
    Convergent cybernetic-analysis process. Analyzes feedback-loop properties,
    evaluates variety balance via Ashby's Law, maps system to VSM S1–S5,
    computes convergence, and iterates until diagnostic recommendations are
    stable for intervention design.
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: ""
  # No convergence-check compute step: the loop runs N iterations then escalates.
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: loop_description
    type: string
    required: false
  - name: system_context
    type: string
    required: false

ledger:
  span_namespace: reg.skill.pragmatic-cybernetics

steps:
  - ordinal: 1
    action: select
    description: Analyze loop properties and failure modes on 5 properties.
    renderer: minijinja
    template_ref: pragmatic-cybernetics/cybernetics-analyze-loop
    timeout_seconds: 150
    input_mapping:
      loop_description: "{{ task | default(loop_description) }}"
      system_context: "{{ system_context | default('') }}"

  - ordinal: 2
    action: select
    description: Evaluate variety balance using Ashby's Law of Requisite Variety.
    renderer: minijinja
    template_ref: pragmatic-cybernetics/cybernetics-variety-check
    timeout_seconds: 150
    input_mapping:
      loop_analysis: "{{ step_1_result }}"
      system_context: "{{ system_context | default('') }}"

  - ordinal: 3
    action: select
    description: Map components to VSM S1–S5 and assess system viability.
    renderer: minijinja
    template_ref: pragmatic-cybernetics/cybernetics-vsm-map
    timeout_seconds: 150
    input_mapping:
      loop_analysis: "{{ step_1_result }}"
      variety_result: "{{ step_2_result | default({}) }}"
      system_context: "{{ system_context | default('') }}"

  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the unviable-component count from
      the diagnostic step. Lower signal variance across iterations =
      convergence (Cauchy). Using lisp.eval instead of a Jinja expression
      makes the computation explicitly deterministic, budgeted
      (timeout_seconds: 10), and observable via a reg.skill.pragmatic-cybernetics
      span. Guards against a missing unviable_components field by returning
      0 when absent.
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((uc (assoc "unviable_components" step_3_result)))
          (if (is_null uc) 0 (length uc)))
      env:
        step_3_result: "{{ step_3_result | default({}) }}"

  - ordinal: 5
    action: loop
    description: Re-enter cybernetics cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 4). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_4_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
