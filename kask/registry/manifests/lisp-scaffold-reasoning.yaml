# Lisp-Scaffold-Reasoning Process Manifest
# ℏKask v0.34.0
#
# Demonstrates deterministic Lisp scaffolding of LLM probabilistic reasoning,
# after de la Torre (2025, arXiv:2506.10021). The paper proposes a live SBCL
# REPL with middleware-intercepted <lisp> tags and persistent state across
# turns. kask realizes the same symbolic-neural scaffolding via stateless
# `lisp.eval` compute steps interleaved between LLM `select` steps:
#
#   LLM propose  →  Lisp invariant check  →  LLM refine (gated)  →  Lisp score  →  converge
#
# State lives in the manifest's step-result chain (auditable YAML), not in a
# persistent REPL (attack surface — see .rules "Manifest `ocap:` is declared
# config, not a security gate" and hkask-lisp/README.md security model). The
# interpreter is stateless, sandboxed (#![forbid(unsafe_code)], no I/O/FS/
# network/eval, bounded steps+depth), and gated to `category: skill`.
#
# Why this is the right trade-off vs. the paper's persistent REPL:
#   - The paper's value is symbolic scaffolding of probabilistic compute, NOT
#     REPL persistence per se. Persistence is the paper's mechanism for
#     accumulating tools; kask's mechanism is the step-result chain.
#   - Every Lisp form is a static YAML field, not a runtime-emitted string —
#     auditable in code review, not just at runtime.
#   - The stateless interpreter cannot accumulate malicious `define`s across
#     turns; the paper's persistent SBCL can (§7 acknowledges this risk).
#
# The Lisp forms below check invariants the LLM cannot reliably self-evaluate:
#   - count: 3-7 hypotheses present (LLMs miscount their own outputs)
#   - completeness: every hypothesis has both `prediction` and `falsifier` keys
#     (structural presence, not non-empty value — an empty-string falsifier is a
#     semantic defect the LLM should catch, not a structural one Lisp flags)
#   - diversity: at least 2 distinct `likelihood` values (high/medium/low)
#   - mutual_exclusivity: no two hypotheses are textually identical
# These are exactly the structural checks the LLM is bad at and Lisp is good at.
#
# Interpreter constraints honored by the form (verified by
# `dispatch_lisp_eval_hypothesis_four_invariants` test in compute.rs):
#   - `define` inside `begin` at the `let` scope mutates the let's child env
#     (works — define mutates the env it receives).
#   - `define` inside a called lambda mutates the call_env (child), NOT the
#     closure env, so recursive helpers accumulate via return values.
#   - `=` is numeric-only; string equality is done via `assoc` (which uses
#     LispValue PartialEq, and String vs String is structural).
#   - `append` is a builtin that joins N lists (all args must be lists).
#     The form uses it directly to compose the four defect lists.
#   - Boolean literals are `true`/`false`/`nil` (not #t/#f).

manifest:
  id: lisp-scaffold-reasoning
  category: skill
  name: Lisp-Scaffold-Reasoning
  description: >
    Demonstrates deterministic Lisp scaffolding of LLM probabilistic reasoning.
    Interleaves LLM hypothesis-generation steps with stateless `lisp.eval`
    compute steps that check structural invariants the LLM cannot reliably
    self-evaluate (count, completeness, diversity, mutual exclusivity). Realizes
    the symbolic-neural scaffolding thesis of de la Torre (2025,
    arXiv:2506.10021) via kask's manifest cascade rather than a persistent REPL.
    A reference skill — read its manifest to see the `lisp.eval` pattern.
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: target
    type: string
    required: true
  - name: domain
    type: string
    required: false
  - name: context
    type: object
    required: false
  - name: task
    type: string
    required: false
    description: The user's task description (injected per .rules skill-cascade-context rule).

ledger:
  span_namespace: reg.skill.lisp-scaffold-reasoning

steps:
  # ── Step 1: LLM probabilistic step — propose hypotheses ──
  # This is the connectionist compute the Lisp steps scaffold.
  - ordinal: 1
    action: select
    description: >
      LLM proposes 3-7 candidate hypotheses. Each carries a prediction,
      falsifier, and likelihood. The LLM is good at generation, bad at
      counting its own outputs and checking structural completeness — the
      Lisp step (ordinal 2) catches those deterministically.
    renderer: minijinja
    template_ref: lisp-scaffold-reasoning/propose-hypotheses
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      target: "{{ target }}"
      domain: "{{ domain | default('') }}"
      context: "{{ context | default({}) }}"
      task: "{{ task | default('') }}"
      # step_2_result is a bare list of defect strings (not an object with a
      # .defects field). Bind it directly so the LLM sees the actual defects
      # from the prior iteration — this closes the feedback loop (cybernetics
      # closure property). The `default([])` handles the first iteration where
      # step_2_result does not yet exist.
      prior_defects: "{{ step_2_result | default([]) }}"

  # ── Step 2: Lisp deterministic step — structural invariant check ──
  # This is the symbolic scaffolding. The Lisp form walks the hypothesis set
  # and returns a list of defect strings — empty list = passed, non-empty =
  # LLM must refine (step 3 condition gates on this).
  #
  # All four advertised invariants are implemented (verified by the
  # `dispatch_lisp_eval_hypothesis_four_invariants` test):
  #   - count: 3-7 hypotheses (LLMs miscount their own outputs)
  #   - completeness: every hypothesis has `prediction` and `falsifier` keys
  #     (structural presence; empty-string values are semantic, not structural)
  #   - diversity: ≥2 distinct likelihood values (high/medium/low)
  #   - mutual_exclusivity: no duplicate `hypothesis` text
  #
  # The form uses `let`+`begin`+`define` to define recursive helpers, then
  # composes the four defect lists via a recursive `append2` helper. String
  # equality is done via `assoc` (the interpreter's `=` is numeric-only).
  # `define` inside a called lambda mutates the call_env, not the closure env,
  # so helpers accumulate via return values, not outer mutation.
  - ordinal: 2
    action: compute
    compute_ref: lisp.eval
    description: >
      Lisp invariant check. Deterministically evaluates all four structural
      invariants: count (3-7), completeness (every hypothesis has prediction +
      falsifier keys), diversity (≥2 distinct likelihoods), mutual exclusivity
      (no duplicate hypothesis text). Returns a list of defect strings — empty
      list = passed; non-empty = LLM must refine (step 3 condition gates on
      this). No LLM round-trip.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      # The form walks the hypothesis set and returns a list of defect strings.
      # Empty list = passed; non-empty = LLM must refine (step 3 condition gates on this).
      #
      # JSON shape: step_1_result is { "hypotheses": [{rank, hypothesis, prediction,
      #   falsifier, likelihood}, ...], "notes": "..." }. from_json converts the
      # object to an alist of (String, value) pairs; the array becomes a Lisp list.
      # `assoc "hypotheses" step_1_result` pulls the array; `length` counts it.
      form: >
        (let ((hyps (assoc "hypotheses" step_1_result)))
          (if (is_null hyps)
              (list "no_hypotheses_field")
              (let ((n (length hyps)))
                (begin
                  (define count-defects
                    (if (< n 3)
                        (list "insufficient_count_below_3")
                        (if (> n 7)
                            (list "excessive_count_above_7")
                            (list))))
                  (define check-completeness
                    (lambda (hs acc)
                      (if (is_null hs)
                          acc
                          (let ((h (car hs))
                                (acc2 (if (is_null (assoc "prediction" h))
                                          (cons "missing_prediction" acc)
                                          acc)))
                            (let ((acc3 (if (is_null (assoc "falsifier" h))
                                            (cons "missing_falsifier" acc2)
                                            acc2)))
                              (check-completeness (cdr hs) acc3))))))
                  (define completeness-defects (check-completeness hyps (list)))
                  (define check-diversity
                    (lambda (hs nh nm nl)
                      (if (is_null hs)
                          (let ((distinct (+ (if (> nh 0) 1 0) (if (> nm 0) 1 0) (if (> nl 0) 1 0))))
                            (if (< distinct 2)
                                (list "insufficient_diversity_below_2")
                                (list)))
                          (let ((h (car hs))
                                (lk (assoc "likelihood" h))
                                (is-high (string= lk "high"))
                                (is-med (string= lk "medium"))
                                (is-low (string= lk "low")))
                            (check-diversity
                              (cdr hs)
                              (if is-high (+ nh 1) nh)
                              (if is-med (+ nm 1) nm)
                              (if is-low (+ nl 1) nl))))))
                  (define diversity-defects (check-diversity hyps 0 0 0))
                  (define check-duplicates
                    (lambda (hs seen)
                      (if (is_null hs)
                          (list)
                          (let ((h (car hs))
                                (hyp-text (assoc "hypothesis" h))
                                (hyp-str (if (is_null hyp-text) "" hyp-text)))
                            (if (not (is_null (assoc hyp-str seen)))
                                (cons "duplicate_hypothesis" (check-duplicates (cdr hs) seen))
                                (check-duplicates (cdr hs) (cons (list hyp-str true) seen)))))))
                  (define duplicate-defects (check-duplicates hyps (list)))
                  (append
                    count-defects completeness-defects
                    diversity-defects duplicate-defects)))))
      env:
        step_1_result: "{{ step_1_result }}"

  # ── Step 3: LLM probabilistic step — refine, gated on Lisp verdict ──
  # Only runs if the Lisp step found defects (step_2_result is a non-empty list).
  # This is the feedback loop: Lisp finds a structural defect, LLM repairs it.
  # The condition uses the executor's step.condition evaluator (==, !=, <, etc.)
  # — but since step_2_result is a list, we check its length via a Jinja
  # expression that resolves before the condition evaluator sees it.
  - ordinal: 3
    action: select
    condition: "{{ step_2_result | length > 0 }}"
    description: >
      LLM refines the hypothesis set in response to the Lisp invariant verdict.
      Gated — only runs if the Lisp step found structural defects. This is the
      symbolic→neural feedback loop: deterministic Lisp finds a defect the LLM
      cannot reliably self-detect, the LLM repairs it, the next iteration's
      Lisp step re-checks.
    renderer: minijinja
    template_ref: lisp-scaffold-reasoning/refine-hypotheses
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      target: "{{ target }}"
      hypotheses: "{{ step_1_result.hypotheses | default([]) }}"
      task: "{{ task | default('') }}"
      lisp_verdict:
        passed: "{{ step_2_result | length == 0 }}"
        defect_count: "{{ step_2_result | length }}"
      lisp_defects: "{{ step_2_result }}"

  # ── Step 4: Lisp deterministic step — convergence score ──
  # Computes a scalar convergence metric from the defect list produced by
  # step 2. The score is `1.0 - (defect_count / (n * 4))` where `n` is the
  # hypothesis count and 4 is the number of invariants — so the score is
  # sensitive to all four invariant classes (count, completeness, diversity,
  # duplicates), not just count. 1.0 = no defects; lower = more defects.
  # This feeds the Cauchy criterion in step 5.
  #
  # Pure prefix notation. The infix expander only handles `atom op atom` (no
  # nested parens in the operand position — `1.0 - (x / y)` would NOT expand
  # because `(` is not an infix context per `is_infix_context`). Mixing infix
  # with nested parens requires explicit prefix: `(- 1.0 (/ defect_count (* n 4)))`.
  #
  # The score is computed from step_3_result if step 3 ran (refinement), else
  # from step_1_result (no defects, first iteration passed). The Jinja
  # `default` filter falls back to step_1_result when step_3_result is absent
  # (step 3 was skipped by the condition). The defect_count comes from
  # step_2_result (the Lisp invariant check) — it is the authoritative defect
  # count regardless of whether refinement ran.
  - ordinal: 4
    action: compute
    compute_ref: lisp.eval
    description: >
      Lisp convergence score. Deterministically computes a scalar from the
      defect count and hypothesis count: 1.0 minus defect rate normalized by
      the four-invariant maximum. Sensitive to all four invariant classes.
      Feeds the Cauchy criterion. No LLM round-trip.
    gas_cap: 100
    timeout_seconds: 10
    input_mapping:
      form: >
        (let ((hyps (assoc "hypotheses" current)))
          (if (is_null hyps)
              0.0
              (let ((n (length hyps)))
                (if (= n 0)
                    0.0
                    (- 1.0 (/ defect_count (* n 4)))))))
      env:
        current: "{{ step_3_result | default(step_1_result) }}"
        defect_count: "{{ step_2_result | length | default(0) }}"

  # ── Step 5: Convergence check (built-in compute) ──
  # Standard Cauchy criterion check. The Lisp score from step 4 is the
  # hypotenuse signal — when it stops moving across iterations, the cascade
  # has converged.
  - ordinal: 5
    action: loop
    description: >
      Re-enter the propose→check→refine cycle if convergence is not met.
      Carries the prior Lisp defects so the LLM repairs cumulatively.
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 1 }}"
      convergence_signal: "{{ step_4_result }}"

  # ── Step 7: Final report ──
  # Runs after convergence (the loop action exits when converged). Synthesizes
  # the surviving hypothesis set with the Lisp verdict and convergence score.
  - ordinal: 6
    action: select
    description: >
      Final report. Synthesizes the surviving hypothesis set, the final Lisp
      invariant verdict, and the convergence score. Makes the symbolic
      scaffolding auditable — which defects did Lisp catch that the LLM missed?
    renderer: minijinja
    template_ref: lisp-scaffold-reasoning/report
    gas_cap: 2048
    timeout_seconds: 60
    input_mapping:
      target: "{{ target }}"
      hypotheses: "{{ step_3_result.hypotheses | default(step_1_result.hypotheses | default([])) }}"
      task: "{{ task | default('') }}"
      lisp_verdict:
        passed: "{{ step_2_result | length == 0 }}"
        defect_count: "{{ step_2_result | length }}"
        defects: "{{ step_2_result }}"
      convergence_score: "{{ step_4_result | default(0.0) }}"
      iterations: "{{ _convergence.iteration | default(1) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: abort
  max_retries: 0
  retry_backoff_seconds: 1
  on_validation_failure: abort
