# Dispatch manifest for inference-curator-bot
# Orchestrates LLM inference with model tier selection

manifest:
  id: inference-dispatch
  category: pipeline
  name: inference-dispatch
  version: "0.33.0"
  description: Inference orchestration with model tier balancing
  functional_role: flowdef
  visibility: Public

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

steps:
  - ordinal: 1
    action: select
    description: Select the inference model tier (fast_local, balanced, high_quality) based on the prompt and context.
    template_ref: inference/selectors/model-selector.j2
    renderer: minijinja
    output_schema:
      type: object
      properties:
        model_tier:
          type: string
          enum: [fast_local, balanced, high_quality]
        model_name:
          type: string
        rationale:
          type: string

  - ordinal: 2
    action: populate
    description: Render the inference prompt template with system prompt, user prompt, and context.
    template_ref: inference/templates/prompt.j2
    renderer: minijinja
    bindings:
      system_prompt: "${input.system_prompt}"
      user_prompt: "${input.user_prompt}"
      context: "${input.context}"

  - ordinal: 3
    action: select
    description: Send the populated prompt to the inference endpoint and parse the response.
    target: inference_call
    renderer: inline
    template_ref: "{{ step_2_populated }}"
    output_schema:
      type: object
      properties:
        response:
          type: string
        tokens_used:
          type: integer
        latency_ms:
          type: number

ledger:
  span_namespace: reg.skill.inference-dispatch
