# Essentialist Process Manifest
# ℏKask v0.35.0 — 3-gate elimination as convergent PDCA

manifest:
  id: essentialist
  category: skill
  name: Essentialist
  description: >
    Convergent eliminative interrogation process. Runs the G1→G2→G3 gate flow,
    computes convergence, and iterates until no material eliminations or
    contract violations remain.
  functional_role: flowdef
  version: "0.35.0"  # synced with hKask release; SKILL.md lacks version field — should be added for traceability
  editor: curator-or-human-admin
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  target_artifacts_field: "essentialist_verdict"
  on_not_reached: escalate


rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: artifact
    type: object
    required: false
  - name: code_context
    type: object
    required: false
  - name: mode
    type: string
    required: false

ledger:
  span_namespace: reg.skill.essentialist

steps:
  - ordinal: 1
    action: select
    description: Run essentialist 3-gate eliminative interrogation loop.
    renderer: minijinja
    template_ref: essentialist/essentialist-flow
    timeout_seconds: 180
    input_mapping:
      artifact: "{{ task | default(artifact) }}"
      code_context: "{{ code_context | default({}) }}"
      mode: "{{ mode | default('advisory') }}"
      max_rounds: 10
      max_retries_per_gate: 3

  - ordinal: 2
    action: compute
    compute_ref: lisp.eval
    description: >
      Deterministic convergence signal: the items-removed count from the
      essentialist 3-gate elimination report. Lower signal variance across
      iterations = convergence (Cauchy). Using lisp.eval instead of a Jinja
      expression makes the computation explicitly deterministic, budgeted
      (timeout_seconds: 10), and observable via a reg.skill.essentialist span.
      Guards against missing nested fields (elimination_report /
      essentialism_score / items_removed) by returning 0 when absent — a
      stable reading that lets Cauchy fire after min_iterations.
    timeout_seconds: 10
    input_mapping:
      # Idiomatic refinement (McCarthy/Sussman data-as-program): the lookup
      # path is DATA and one recursive walker guards every hop — replaces the
      # former 4-level is_null/let pyramid that repeated the same "0 on
      # missing" pattern per level and crashed with "type error: expected
      # list, got string" when step_1_result was not a JSON object (LLM
      # prose / markdown-wrapped output / error envelope). Non-list at any
      # hop → nil → stable 0 reading, same contract as before (see
      # essentialist_manifest_test.rs for the pinned cases).
      form: >
        (begin
          (define walk
            (lambda (keys data)
              (if (is_null keys)
                  data
                  (if (listp data)
                      (walk (cdr keys) (assoc (car keys) data))
                      nil))))
          (let ((removed (walk (list "elimination_report" "essentialism_score" "items_removed") step_1_result)))
            (if (is_null removed) 0 removed)))
      env:
        step_1_result: "{{ step_1_result | default({}) }}"

  - ordinal: 3
    action: loop
    description: Re-enter elimination cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Convergence signal from the deterministic lisp.eval compute step
      # (step 2). No default(1.0): a Lisp failure must surface.
      convergence_signal: "{{ step_2_result }}"

error_handling:
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
