# Essentialist Process Manifest
# ℏKask v0.32.0 — 3-gate elimination as convergent PDCA

manifest:
  id: essentialist
  category: skill
  name: Essentialist
  description: >
    Convergent eliminative interrogation process. Runs the G1→G2→G3 gate flow,
    computes convergence, and iterates until no material eliminations or
    contract violations remain.
  functional_role: flowdef
  version: 0.32.0  # synced with hKask release; SKILL.md lacks version field — should be added for traceability
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  target_artifacts_field: step_1_result.surviving_artifact
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate

gas:
  cap: 100000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: artifact
    type: object
    required: true
  - name: code_context
    type: object
    required: false
  - name: mode
    type: string
    required: false

ledger:
  span_namespace: reg.skill.essentialist

steps:
  - ordinal: 1
    action: select
    description: Run essentialist 3-gate eliminative interrogation loop.
    renderer: minijinja
    template_ref: essentialist/essentialist-flow
    gas_cap: 9000
    timeout_seconds: 70
    input_mapping:
      artifact: "{{ artifact }}"
      code_context: "{{ code_context | default({}) }}"
      mode: "{{ mode | default('advisory') }}"
      max_rounds: "{{ convergence.max_iterations | default(3) }}"
      max_retries_per_gate: 3
      # Cross-guard: total gate attempts ≤ max_rounds × gates (3 gates) × retries (3) = 27 max.
      # Budget is enforced by gas cap (100000) and rjoule cap (2); no explicit cross-guard was present.
      # Added: retry exhaustion on any gate triggers immediate escalation (see SKILL.md step 10).
      budget_guard: "retry_exhaustion → escalate; zero_delta → abort"
      scope: auto

  - ordinal: 2
    action: compute
    compute_ref: kata.convergence_check
    description: >
      CHECK CONVERGENCE: Cauchy criterion on the items-removed count. The
      elimination has converged when items stop being removed across
      iterations — the artifact is essential.
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 3
    action: loop
    description: Re-enter elimination cycle if convergence is not met.
    input_mapping:
      loop_target: "{{ 1 }}"
      # Push the items-removed count into kata_hypotenuse so the Cauchy
      # criterion can detect when eliminations have stopped.
      kata_hypotenuse: "{{ step_1_result.elimination_report.essentialism_score.items_removed | default(0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
