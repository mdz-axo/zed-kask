manifest:
  id: harness-optimize
  category: skill
  name: Harness Optimize
  description: >
    Suite-level test harness proposer. Reads raw execution traces from the
    trace filesystem, identifies under-tested areas via mutation analysis,
    and proposes test improvements. Dispatches to proptest in generate_only
    mode. Cannot run tests (terminal disabled — proposer/evaluator separation).
  functional_role: flowdef
  version: "0.35.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 1
  min_iterations: 1
  on_not_reached: abort
  target_artifacts_field: "proposed_diff"

gas:
  cap: 120000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: trace_dir_n
    type: string
    required: true
    description: >
      Path to the latest trace directory (revision N).
  - name: trace_dir_n_minus_1
    type: string
    required: true
    description: >
      Path to the previous trace directory (revision N-1).
  - name: task
    type: string
    required: true
    description: >
      The user's task or the harness-evolve-cycle's improvement request.

steps:
  - ordinal: 1
    action: select
    description: >
      Identify under-tested areas by reading trace filesystem for revisions N
      and N-1. Compare mutation scores, failure patterns, and bug-hunt findings.
    renderer: minijinja
    template_ref: harness-optimize/harness-optimize-identify
    gas_cap: 8000
    timeout_seconds: 180
    input_mapping:
      trace_dir_n: "{{ trace_dir_n }}"
      trace_dir_n_minus_1: "{{ trace_dir_n_minus_1 }}"
      task: "{{ task }}"

  - ordinal: 2
    action: select
    description: >
      Propose test improvement diff based on gap analysis. Dispatch to proptest
      in generate_only mode for under-tested functions with surviving mutants.
    renderer: minijinja
    template_ref: harness-optimize/harness-optimize-propose
    gas_cap: 12000
    timeout_seconds: 180
    input_mapping:
      trace_dir_n: "{{ trace_dir_n }}"
      trace_dir_n_minus_1: "{{ trace_dir_n_minus_1 }}"
      task: "{{ task }}"
      gap_analysis: "{{ step_1_result.gap_analysis | default([]) }}"
      surviving_mutants: "{{ step_1_result.surviving_mutants | default([]) }}"
      target_functions: "{{ step_1_result.target_functions | default([]) }}"

  - ordinal: 3
    action: select
    description: >
      Compile structured report of proposed test changes with rationale,
      evidence, and expected impact.
    renderer: minijinja
    template_ref: harness-optimize/harness-optimize-report
    gas_cap: 4000
    timeout_seconds: 120
    input_mapping:
      trace_dir_n: "{{ trace_dir_n }}"
      task: "{{ task }}"
      gap_analysis: "{{ step_1_result.gap_analysis | default([]) }}"
      proposed_diff: "{{ step_2_result.proposed_diff | default([]) }}"
      proptest_dispatches: "{{ step_2_result.proptest_dispatches | default([]) }}"
      evidence_cited: "{{ step_2_result.evidence_cited | default([]) }}"
      rationale: "{{ step_2_result.rationale | default('') }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  span_namespace: reg.skill.harness-optimize
  emit_spans: true