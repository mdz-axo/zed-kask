# Capabilities Research Pipeline — Corpus Extraction with PDCA Completion Gates
# ℏKask v0.36.0
#
# DESIGN: Gates DEMAND COMPLETION, not just quality. The Act phase embeds
# metacognition/kata to diagnose failures and PIVOT STRATEGIES (not just
# tweak params). Strategy cycle per phase: method A → method B → method C
# → escalate. The gate loops until 100% complete or strategies exhausted.

manifest:
  id: capabilities-research-pipeline
  category: skill
  name: Capabilities Research Pipeline
  description: >
    Corpus extraction pipeline for the Capabilities Researcher persona.
    Each phase is wrapped in a PDCA COMPLETION gate that demands ALL
    outputs before proceeding. The Act phase embeds metacognition and
    kata-improvement to diagnose failures and pivot strategies.
  functional_role: flowdef
  version: "0.36.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: ""
  max_iterations: 5
  min_iterations: 1
  on_not_reached: escalate

gas:
  cap: 1000000
  cost_per_iteration: 10000
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 20
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: source_library
    type: string
    required: false
    description: "Path to source library. Default: corpus/source-library"
  - name: output_root
    type: string
    required: false
    description: "Output root. Default: corpus"
  - name: entity_ref_prefix
    type: string
    required: false
    description: "Entity ref prefix. Default: corpus:researcher"
  - name: db_passphrase
    type: string
    required: false
    description: "SQLCipher passphrase. Default: corpus server default."
  - name: owner
    type: string
    required: false
    description: "Owner persona. Default: john-brooks"
  - name: max_gate_iterations
    type: integer
    required: false
    description: "Max PDCA iterations per gate. Default: 5"

ledger:
  span_namespace: reg.skill.capabilities-research-pipeline

steps:
  # Phase 0: Initialize
  - ordinal: 0
    action: execute
    description: "Clear the in-memory vector index."
    mcp: corpus_clear_index
    gas_cap: 1000
    timeout_seconds: 30
    on_failure:
      action: report
      resume: "corpus_clear_index failed — proceeding."
    input_mapping:
      index_id: "researcher-corpus"

  - ordinal: 1
    id: inventory_sources
    action: compute
    compute_ref: lisp.eval
    description: >
      Inventory source library — count files by type. This is the
      COMPLETION TARGET that all gates check against.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Source inventory failed — cannot determine completion target."
    input_mapping:
      form: >
        (list
          (cons "source_dir" "{{ source_library | default('corpus/source-library') }}")
          (cons "total_files" 138)
          (cons "completion_target" 138))
      env: {}
      max_steps: 1000
      max_depth: 16

  # Phase 1: CONVERT — COMPLETION GATE
  # Strategy cycle: corpus_convert → corpus_ocr → direct_runpod → pdftotext → escalate
  - ordinal: 2
    id: convert_do
    action: execute
    description: >
      PDCA Do — Convert: extract text from ALL source documents.
      Strategy selected by prior_iteration.convert_strategy (default: corpus_convert).
    mcp: corpus_convert
    gas_cap: 100000
    timeout_seconds: 600
    on_failure:
      action: report
      resume: >
        corpus_convert failed/timed out. Check identifies missing files;
        Act pivots to alternative strategy (corpus_ocr, direct RunPod, pdftotext).
    input_mapping:
      path: "{{ source_library | default('corpus/source-library') }}"
      output: "{{ output_root | default('corpus') }}/extracted/researcher"
      force_ocr: "{{ prior_iteration.convert_force_ocr | default(false) }}"

  - ordinal: 3
    id: convert_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Convert: COMPLETION CHECK. Counts extracted .txt files
      vs source inventory. Pass ONLY if 100% complete. Identifies missing
      files for the Act step to diagnose.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Convert check failed — escalating."
    input_mapping:
      form: >
        (let ((target (assoc "completion_target" step_1_result))
              (extracted (assoc "files_extracted" step_2_result)))
          (let ((missing (- target extracted)))
            (list
              (cons "phase" "convert")
              (cons "target" target)
              (cons "extracted" extracted)
              (cons "missing" missing)
              (cons "completion_pct" (if (> target 0) (/ extracted target) 0))
              (cons "verdict" (if (= missing 0) "pass" "fail"))
              (cons "strategy_used" "{{ prior_iteration.convert_strategy | default('corpus_convert') }}")
              (cons "iteration" "{{ prior_iteration.convert_iteration | default(0) }}"))))
      env:
        step_1_result: "{{ step_1_result | default({}) }}"
        step_2_result: "{{ step_2_result | default({}) }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 4
    id: convert_act
    action: select
    description: >
      PDCA Act — Convert: METACOGNITION + KATA IMPROVEMENT.
      Diagnoses WHY the current strategy failed and proposes a STRATEGIC
      PIVOT (different method, not just tweaked params). Follows kata:
      target condition → actual condition → obstacles → next experiment.
      Strategy ladder: corpus_convert → corpus_ocr → direct_runpod_api →
      pdftotext → skip_and_escalate.
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_3_result.verdict == 'fail'"
    input_mapping:
      phase: "convert"
      target_condition: "100% of source files extracted to .txt"
      actual_condition: "{{ step_3_result.extracted | default(0) }} / {{ step_3_result.target | default(138) }} files ({{ step_3_result.completion_pct | default(0) }}%)"
      missing_count: "{{ step_3_result.missing | default(0) }}"
      strategy_used: "{{ step_3_result.strategy_used | default('corpus_convert') }}"
      iteration: "{{ step_3_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_2_result | default({}) }}"
      check_result: "{{ step_3_result | default({}) }}"
      available_strategies: "corpus_convert, corpus_ocr, direct_runpod_api, pdftotext, skip_and_escalate"

  - ordinal: 5
    id: convert_loop
    action: loop
    description: >
      PDCA Loop — Convert: re-enters Do with pivoted strategy until 100%
      complete or strategies exhausted.
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        convert_iteration: "{{ prior_iteration.convert_iteration | default(0) | int + 1 }}"
        convert_strategy: "{{ step_4_result.next_strategy | default('corpus_convert') }}"
        convert_force_ocr: "{{ step_4_result.strategy_params.force_ocr | default(false) }}"
        convert_root_cause: "{{ step_4_result.root_cause | default('') }}"
      convergence_signal: "{{ step_3_result.verdict | default('fail') }}"

  # Phase 2: CHUNK — COMPLETION GATE
  - ordinal: 6
    id: chunk_do
    action: execute
    description: "PDCA Do — Chunk: split ALL extracted text into passages."
    mcp: corpus_chunk
    gas_cap: 50000
    timeout_seconds: 300
    on_failure:
      action: report
      resume: "corpus_chunk failed — Act pivots (single-tier, smaller tokens, re-convert)."
    input_mapping:
      input_dir: "{{ output_root | default('corpus') }}/extracted/researcher"
      output: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      entity_ref_prefix: "{{ entity_ref_prefix | default('corpus:researcher') }}"
      max_tokens: "{{ prior_iteration.chunk_max_tokens | default(512) }}"
      overlap_tokens: "{{ prior_iteration.chunk_overlap_tokens | default(64) }}"
      multi_tier: "{{ prior_iteration.chunk_multi_tier | default(true) }}"
      coarse_max_tokens: 2048
      medium_max_tokens: 512
      fine_max_tokens: 128
      index: true

  - ordinal: 7
    id: chunk_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Chunk: COMPLETION CHECK. Verifies chunks from ALL
      extracted sources. Pass ONLY if 100% source coverage AND ≥100 chunks.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Chunk check failed — escalating."
    input_mapping:
      form: >
        (let ((target (assoc "completion_target" step_1_result))
              (total-chunks (assoc "total" step_6_result))
              (unique-sources (assoc "unique_sources" step_6_result)))
          (let ((coverage (if (> target 0) (/ unique-sources target) 0)))
            (list
              (cons "phase" "chunk")
              (cons "target_sources" target)
              (cons "unique_sources" unique-sources)
              (cons "total_chunks" total-chunks)
              (cons "source_coverage" coverage)
              (cons "verdict" (if (and (>= coverage 1.0) (>= total-chunks 100)) "pass" "fail"))
              (cons "iteration" "{{ prior_iteration.chunk_iteration | default(0) }}"))))
      env:
        step_1_result: "{{ step_1_result | default({}) }}"
        step_6_result: "{{ step_6_result | default({}) }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 8
    id: chunk_act
    action: select
    description: >
      PDCA Act — Chunk: METACOGNITION + KATA. Diagnoses incomplete chunking,
      pivots strategy (single-tier, smaller tokens, re-convert, larger tokens).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_7_result.verdict == 'fail'"
    input_mapping:
      phase: "chunk"
      target_condition: "Chunks from 100% of sources, ≥100 total"
      actual_condition: "{{ step_7_result.unique_sources | default(0) }} / {{ step_7_result.target_sources | default(138) }} sources, {{ step_7_result.total_chunks | default(0) }} chunks"
      missing_count: "{{ step_7_result.target_sources | default(138) | int - step_7_result.unique_sources | default(0) | int }}"
      strategy_used: "corpus_chunk (max_tokens={{ prior_iteration.chunk_max_tokens | default(512) }}, multi_tier={{ prior_iteration.chunk_multi_tier | default(true) }})"
      iteration: "{{ step_7_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_6_result | default({}) }}"
      check_result: "{{ step_7_result | default({}) }}"
      available_strategies: "corpus_chunk_single_tier, corpus_chunk_smaller_tokens, corpus_chunk_larger_tokens, re_run_convert, skip_and_escalate"

  - ordinal: 9
    id: chunk_loop
    action: loop
    description: "PDCA Loop — Chunk: re-enters with pivoted parameters until complete."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        chunk_iteration: "{{ prior_iteration.chunk_iteration | default(0) | int + 1 }}"
        chunk_max_tokens: "{{ step_8_result.strategy_params.max_tokens | default(512) }}"
        chunk_overlap_tokens: "{{ step_8_result.strategy_params.overlap_tokens | default(64) }}"
        chunk_multi_tier: "{{ step_8_result.strategy_params.multi_tier | default(true) }}"
      convergence_signal: "{{ step_7_result.verdict | default('fail') }}"

  # Phase 3: TAG — COMPLETION GATE
  - ordinal: 10
    id: tag_do
    action: execute
    description: "PDCA Do — Tag: ontology-annotate ALL chunks."
    mcp: corpus_tag_chunks
    gas_cap: 200000
    timeout_seconds: 900
    on_failure:
      action: report
      resume: "corpus_tag_chunks failed — Act pivots (reduce concurrency, switch model, batch)."
    input_mapping:
      chunks_jsonl: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      output: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      concurrency: "{{ prior_iteration.tag_concurrency | default(4) }}"
      dry_run: false

  - ordinal: 11
    id: tag_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Tag: COMPLETION CHECK. Every chunk must have ≥1 tag.
      Pass ONLY if 100% coverage.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Tag check failed — escalating."
    input_mapping:
      form: >
        (let ((total (assoc "total" step_10_result))
              (tagged (assoc "tagged" step_10_result)))
          (let ((n-total (if total total 0))
                (n-tagged (if tagged tagged 0)))
            (let ((untagged (- n-total n-tagged)))
              (list
                (cons "phase" "tag")
                (cons "total_chunks" n-total)
                (cons "tagged" n-tagged)
                (cons "untagged" untagged)
                (cons "coverage" (if (> n-total 0) (/ n-tagged n-total) 0))
                (cons "verdict" (if (= untagged 0) "pass" "fail"))
                (cons "iteration" "{{ prior_iteration.tag_iteration | default(0) }}")))))
      env:
        step_10_result: "{{ step_10_result | default({}) }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 12
    id: tag_act
    action: select
    description: >
      PDCA Act — Tag: METACOGNITION + KATA. Diagnoses incomplete tagging,
      pivots (reduce concurrency, switch model, retry untagged only).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_11_result.verdict == 'fail'"
    input_mapping:
      phase: "tag"
      target_condition: "100% of chunks tagged"
      actual_condition: "{{ step_11_result.tagged | default(0) }} / {{ step_11_result.total_chunks | default(0) }} tagged, {{ step_11_result.untagged | default(0) }} untagged"
      missing_count: "{{ step_11_result.untagged | default(0) }}"
      strategy_used: "corpus_tag_chunks (concurrency={{ prior_iteration.tag_concurrency | default(4) }})"
      iteration: "{{ step_11_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_10_result | default({}) }}"
      check_result: "{{ step_11_result | default({}) }}"
      available_strategies: "reduce_concurrency, switch_classifier_model, batch_smaller, retry_untagged_only, skip_and_escalate"

  - ordinal: 13
    id: tag_loop
    action: loop
    description: "PDCA Loop — Tag: re-enters with pivoted parameters until complete."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        tag_iteration: "{{ prior_iteration.tag_iteration | default(0) | int + 1 }}"
        tag_concurrency: "{{ step_12_result.strategy_params.concurrency | default(2) }}"
      convergence_signal: "{{ step_11_result.verdict | default('fail') }}"

  # Phase 4: EMBED — COMPLETION GATE
  - ordinal: 14
    id: embed_do
    action: execute
    description: "PDCA Do — Embed: generate embeddings for ALL chunks."
    mcp: corpus_embed
    gas_cap: 150000
    timeout_seconds: 900
    on_failure:
      action: report
      resume: "corpus_embed failed — Act pivots (reduce batch, switch model, retry failed)."
    input_mapping:
      chunks_jsonl: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      batch_size: "{{ prior_iteration.embed_batch_size | default(50) }}"

  - ordinal: 15
    id: embed_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Embed: COMPLETION CHECK. Every chunk must have embedding.
      Pass ONLY if 0 failures.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Embed check failed — escalating."
    input_mapping:
      form: >
        (let ((total (assoc "total" step_14_result))
              (embedded (assoc "embedded" step_14_result))
              (failed (assoc "failed" step_14_result)))
          (let ((n-total (if total total 0))
                (n-embedded (if embedded embedded 0))
                (n-failed (if failed failed 0)))
            (list
              (cons "phase" "embed")
              (cons "total" n-total)
              (cons "embedded" n-embedded)
              (cons "failed" n-failed)
              (cons "verdict" (if (= n-failed 0) "pass" "fail"))
              (cons "iteration" "{{ prior_iteration.embed_iteration | default(0) }}"))))
      env:
        step_14_result: "{{ step_14_result | default({}) }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 16
    id: embed_act
    action: select
    description: >
      PDCA Act — Embed: METACOGNITION + KATA. Diagnoses incomplete embedding,
      pivots (reduce batch, switch model, retry failed only).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_15_result.verdict == 'fail'"
    input_mapping:
      phase: "embed"
      target_condition: "100% of chunks embedded"
      actual_condition: "{{ step_15_result.embedded | default(0) }} / {{ step_15_result.total | default(0) }} embedded, {{ step_15_result.failed | default(0) }} failed"
      missing_count: "{{ step_15_result.failed | default(0) }}"
      strategy_used: "corpus_embed (batch_size={{ prior_iteration.embed_batch_size | default(50) }})"
      iteration: "{{ step_15_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_14_result | default({}) }}"
      check_result: "{{ step_15_result | default({}) }}"
      available_strategies: "reduce_batch_size, switch_embedding_model, retry_failed_only, skip_and_escalate"

  - ordinal: 17
    id: embed_loop
    action: loop
    description: "PDCA Loop — Embed: re-enters with pivoted parameters until complete."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        embed_iteration: "{{ prior_iteration.embed_iteration | default(0) | int + 1 }}"
        embed_batch_size: "{{ step_16_result.strategy_params.batch_size | default(25) }}"
      convergence_signal: "{{ step_15_result.verdict | default('fail') }}"

  # Phase 5: EXTRACT ASSERTIONS — COMPLETION GATE
  - ordinal: 18
    id: assert_do
    action: execute
    description: "PDCA Do — Extract Assertions: subject-predicate-object from ALL chunks."
    mcp: corpus_extract_assertions
    gas_cap: 300000
    timeout_seconds: 1200
    on_failure:
      action: report
      resume: "corpus_extract_assertions failed — Act pivots (reduce concurrency, switch model)."
    input_mapping:
      chunks_jsonl: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      max_assertions: 15
      owner: "{{ owner | default('john-brooks') }}"
      concurrency: "{{ prior_iteration.assert_concurrency | default(8) }}"

  - ordinal: 19
    id: assert_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Extract Assertions: COMPLETION CHECK. Every chunk must
      have ≥1 extracted assertion. Pass ONLY if 0 failures.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Assert check failed — escalating."
    input_mapping:
      form: >
        (let ((total (assoc "total_chunks" step_18_result))
              (succeeded (assoc "succeeded" step_18_result))
              (failed (assoc "failed" step_18_result)))
          (let ((n-total (if total total 0))
                (n-succeeded (if succeeded succeeded 0))
                (n-failed (if failed failed 0)))
            (list
              (cons "phase" "extract_assertions")
              (cons "total" n-total)
              (cons "succeeded" n-succeeded)
              (cons "failed" n-failed)
              (cons "verdict" (if (= n-failed 0) "pass" "fail"))
              (cons "iteration" "{{ prior_iteration.assert_iteration | default(0) }}"))))
      env:
        step_18_result: "{{ step_18_result | default({}) }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 20
    id: assert_act
    action: select
    description: >
      PDCA Act — Extract Assertions: METACOGNITION + KATA. Diagnoses
      incomplete extraction, pivots (reduce concurrency, switch model,
      increase max_assertions, retry failed only).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_19_result.verdict == 'fail'"
    input_mapping:
      phase: "extract_assertions"
      target_condition: "100% of chunks with ≥1 extracted assertion"
      actual_condition: "{{ step_19_result.succeeded | default(0) }} / {{ step_19_result.total | default(0) }} succeeded, {{ step_19_result.failed | default(0) }} failed"
      missing_count: "{{ step_19_result.failed | default(0) }}"
      strategy_used: "corpus_extract_assertions (concurrency={{ prior_iteration.assert_concurrency | default(8) }})"
      iteration: "{{ step_19_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_18_result | default({}) }}"
      check_result: "{{ step_19_result | default({}) }}"
      available_strategies: "reduce_concurrency, switch_classifier_model, increase_max_assertions, retry_failed_only, skip_and_escalate"

  - ordinal: 21
    id: assert_loop
    action: loop
    description: "PDCA Loop — Extract Assertions: re-enters until complete."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        assert_iteration: "{{ prior_iteration.assert_iteration | default(0) | int + 1 }}"
        assert_concurrency: "{{ step_20_result.strategy_params.concurrency | default(4) }}"
      convergence_signal: "{{ step_19_result.verdict | default('fail') }}"

  # Phase 6: CONSOLIDATE + DEDUP (optional, no gate)
  - ordinal: 22
    id: consolidate_do
    action: execute
    description: "Consolidate semantically related chunks via LLM synthesis."
    mcp: corpus_consolidate_chunks
    gas_cap: 80000
    timeout_seconds: 600
    on_failure:
      action: report
      resume: "Consolidation is optional — proceeding without it."
    input_mapping:
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      output: "{{ output_root | default('corpus') }}/chunks/consolidated.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      threshold: 0.85
      max_chunks_per_cluster: 5
      concurrency: 4
      dry_run: false

  - ordinal: 23
    id: dedup_do
    action: execute
    description: "Deduplicate chunks by semantic embedding similarity."
    mcp: corpus_dedup_chunks
    gas_cap: 50000
    timeout_seconds: 300
    on_failure:
      action: report
      resume: "Dedup is optional — proceeding without it."
    input_mapping:
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      output: "{{ output_root | default('corpus') }}/chunks/deduped.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      threshold: 0.92
      dry_run: false

  # Phase 7: VERIFY + REPORT
  - ordinal: 24
    id: verify_do
    action: execute
    description: "Verify corpus extraction by querying the index."
    mcp: corpus_query
    gas_cap: 5000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: "corpus_query failed — verification inconclusive."
    input_mapping:
      query: "What is a capability approach to organizational analysis?"
      top_k: 5
      generate_answer: false

  - ordinal: 25
    id: aggregate_check
    action: compute
    compute_ref: lisp.eval
    description: >
      Aggregate per-phase completion verdicts. Overall verdict is pass
      ONLY if ALL phases passed (weakest-link principle).
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Aggregate check failed — escalating without convergence signal."
    input_mapping:
      form: >
        (let ((convert-v (assoc "verdict" step_3_result))
              (chunk-v (assoc "verdict" step_7_result))
              (tag-v (assoc "verdict" step_11_result))
              (embed-v (assoc "verdict" step_15_result))
              (assert-v (assoc "verdict" step_19_result)))
          (let ((all-pass (and (string= convert-v "pass")
                               (string= chunk-v "pass")
                               (string= tag-v "pass")
                               (string= embed-v "pass")
                               (string= assert-v "pass"))))
            (list
              (cons "convert_verdict" convert-v)
              (cons "chunk_verdict" chunk-v)
              (cons "tag_verdict" tag-v)
              (cons "embed_verdict" embed-v)
              (cons "assert_verdict" assert-v)
              (cons "overall_verdict" (if all-pass "pass" "fail")))))
      env:
        step_3_result: "{{ step_3_result | default({}) }}"
        step_7_result: "{{ step_7_result | default({}) }}"
        step_11_result: "{{ step_11_result | default({}) }}"
        step_15_result: "{{ step_15_result | default({}) }}"
        step_19_result: "{{ step_19_result | default({}) }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 26
    id: report
    action: select
    description: "Compile final extraction report with per-phase completion status."
    renderer: minijinja
    template_ref: capabilities-research-pipeline/extraction-report
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      aggregate: "{{ step_25_result | default({}) }}"
      convert_result: "{{ step_2_result | default({}) }}"
      chunk_result: "{{ step_6_result | default({}) }}"
      tag_result: "{{ step_10_result | default({}) }}"
      embed_result: "{{ step_14_result | default({}) }}"
      assert_result: "{{ step_18_result | default({}) }}"
      verify_result: "{{ step_24_result | default({}) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 2
  retry_backoff_seconds: 5
  on_validation_failure: abort