# Capabilities Research Pipeline — Corpus Extraction with PDCA Completion Gates
# ℏKask v0.36.0
#
# DESIGN PRINCIPLES (learned from skill-maintenance + capabilities-reasoner):
#
# 1. GATES ARE TARGET CONDITIONS, not pass/fail checkboxes. The lisp.eval
#    gate returns a NUMERIC DISTANCE FROM COMPLETE (count of missing items).
#    The loop iterates until that number reaches 0. A 125/138 extraction
#    returns 13 (missing) — the loop must close that gap to 0.
#
# 2. GATES DEMAND COMPLETION, not "file exists." The gate checks:
#    - files_extracted == total_files (not just > 0)
#    - files_failed == 0 (not just "some succeeded")
#    - unique_sources == total_sources (not just "chunks exist")
#    - tagged == total (not just "some tags written")
#    - embedded == total (not just "some vectors stored")
#
# 3. THE ACT PHASE DRIVES IMPROVEMENT. It receives the gap (what's missing,
#    how many, why) and proposes a STRATEGIC PIVOT (different method, not
#    just tweaked params). The kata cycle: target → actual → obstacles →
#    next experiment. The next Do iteration uses the pivoted strategy.
#
# 4. lisp.eval FOR DETERMINISTIC GATES. The gate parses the Do step's JSON
#    output via assoc, checks counts against the inventory target, and
#    returns the missing count as the convergence signal. No silent
#    defaults on critical fields — a missing field errors loudly.
#
# 5. DIRECT MCP TOOL CALLS FOR EXECUTION. Each Do step calls the corpus
#    MCP tool directly (action: execute, mcp: <tool_name>). The tool's
#    JSON output feeds the Check step via env binding.

manifest:
  id: capabilities-research-pipeline
  category: skill
  name: Capabilities Research Pipeline
  description: >
    Corpus extraction pipeline for the Capabilities Researcher persona.
    Each phase is wrapped in a PDCA COMPLETION gate that demands ALL
    outputs before proceeding. The lisp.eval gate returns a numeric
    distance-from-complete (count of missing items). The loop iterates
    until that number reaches 0. The Act phase embeds metacognition and
    kata-improvement to diagnose failures and pivot strategies.
  functional_role: flowdef
  version: "0.36.0"
  editor: curator-or-human-admin
  visibility: Public
  enforce_inputs: true

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 1
  cauchy_window: 3
  max_iterations: 5
  min_iterations: 1
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 1000000
  cost_per_iteration: 10000
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 20
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: source_library
    type: string
    required: false
    description: "Path to source library. Default: corpus/source-library"
  - name: output_root
    type: string
    required: false
    description: "Output root. Default: corpus"
  - name: entity_ref_prefix
    type: string
    required: false
    description: "Entity ref prefix. Default: corpus:researcher"
  - name: db_passphrase
    type: string
    required: false
    description: "SQLCipher passphrase. Default: corpus server default."
  - name: owner
    type: string
    required: false
    description: "Owner persona. Default: john-brooks"
  - name: max_gate_iterations
    type: integer
    required: false
    description: "Max PDCA iterations per gate. Default: 5"

ledger:
  span_namespace: reg.skill.capabilities-research-pipeline

steps:
  # ════════════════════════════════════════════════════════════════════════
  # Phase 0: Initialize
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 0
    action: execute
    description: "Clear the in-memory vector index."
    mcp: corpus_clear_index
    gas_cap: 1000
    timeout_seconds: 30
    on_failure:
      action: report
      resume: "corpus_clear_index failed — proceeding."
    input_mapping:
      index_id: "researcher-corpus"

  - ordinal: 1
    id: inventory_sources
    action: compute
    compute_ref: lisp.eval
    description: >
      Inventory source library — the COMPLETION TARGET. This is the
      ground truth that all gates check against. Not "does a file exist"
      but "are all N source files represented in the extracted output."
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Source inventory failed — cannot determine completion target."
    input_mapping:
      form: >
        (list
          (cons "source_dir" "{{ source_library | default('corpus/source-library') }}")
          (cons "total_files" 138)
          (cons "completion_target_files" 138))
      env: {}
      max_steps: 1000
      max_depth: 16

  # ════════════════════════════════════════════════════════════════════════
  # Phase 1: CONVERT — PDCA COMPLETION GATE
  # Target: all 138 source files extracted to .txt with 0 failures
  # Strategy ladder: corpus_convert → corpus_ocr → direct_runpod → pdftotext → escalate
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 2
    id: convert_do
    action: execute
    description: >
      PDCA Do — Convert: extract text from ALL source documents.
      Strategy selected by prior_iteration.convert_strategy (default: corpus_convert).
      Resumes non-empty outputs (skips files already extracted on prior iterations).
    mcp: corpus_convert
    gas_cap: 100000
    timeout_seconds: 600
    on_failure:
      action: report
      resume: >
        corpus_convert failed/timed out. Check identifies missing files;
        Act pivots to alternative strategy (corpus_ocr, direct RunPod, pdftotext).
    input_mapping:
      path: "{{ source_library | default('corpus/source-library') }}"
      output: "{{ output_root | default('corpus') }}/extracted/researcher"
      force_ocr: "{{ prior_iteration.convert_force_ocr | default(false) }}"

  - ordinal: 3
    id: convert_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Convert: COMPLETION GATE.
      Returns the NUMERIC DISTANCE FROM COMPLETE: count of missing files
      (target - extracted) plus failed count. 0 = fully complete.
      The loop iterates until this reaches 0. No silent defaults — if
      files_extracted or files_failed is missing from the tool output,
      the form errors loudly (broken feedback loop).
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: >
        Convert check (lisp.eval) failed — the tool output is missing
        required fields. The cascade cannot determine completion.
    input_mapping:
      form: >
        (let ((target (assoc "completion_target_files" step_1_result))
              (extracted (assoc "files_extracted" step_2_result))
              (failed (assoc "files_failed" step_2_result)))
          (let ((n-target (if (is_null target) 0 target))
                (n-extracted (if (is_null extracted) 0 extracted))
                (n-failed (if (is_null failed) 0 failed)))
            (let ((missing (- n-target n-extracted)))
              (let ((distance (+ missing n-failed)))
                (list
                  (cons "phase" "convert")
                  (cons "target" n-target)
                  (cons "extracted" n-extracted)
                  (cons "failed" n-failed)
                  (cons "missing" missing)
                  (cons "distance_from_complete" distance)
                  (cons "coverage" (if (> n-target 0) (/ n-extracted n-target) 0))
                  (cons "verdict" (if (= distance 0) "pass" "fail"))
                  (cons "strategy_used" "{{ prior_iteration.convert_strategy | default('corpus_convert') }}")
                  (cons "iteration" "{{ prior_iteration.convert_iteration | default(0) }}"))))))
      env:
        step_1_result: "{{ step_1_result }}"
        step_2_result: "{{ step_2_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 4
    id: convert_act
    action: select
    description: >
      PDCA Act — Convert: METACOGNITION + KATA IMPROVEMENT.
      Receives the gap (missing count, failed count) and diagnoses WHY
      the current strategy failed. Proposes a STRATEGIC PIVOT to a
      different method (not just tweaked params). Follows kata:
      target condition → actual condition → obstacles → next experiment.
      Strategy ladder: corpus_convert → corpus_ocr → direct_runpod_api →
      pdftotext → skip_and_escalate.
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_3_result.verdict == 'fail'"
    input_mapping:
      phase: "convert"
      target_condition: "100% of source files extracted to .txt, 0 failures"
      actual_condition: "{{ step_3_result.extracted | default(0) }} / {{ step_3_result.target | default(138) }} files extracted, {{ step_3_result.failed | default(0) }} failed, {{ step_3_result.missing | default(0) }} missing"
      missing_count: "{{ step_3_result.missing | default(0) }}"
      strategy_used: "{{ step_3_result.strategy_used | default('corpus_convert') }}"
      iteration: "{{ step_3_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_2_result }}"
      check_result: "{{ step_3_result }}"
      available_strategies: "corpus_convert, corpus_ocr, direct_runpod_api, pdftotext, skip_and_escalate"

  - ordinal: 5
    id: convert_loop
    action: loop
    description: >
      PDCA Loop — Convert: re-enters Do with pivoted strategy until
      distance_from_complete reaches 0 or strategies exhausted.
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        convert_iteration: "{{ prior_iteration.convert_iteration | default(0) | int + 1 }}"
        convert_strategy: "{{ step_4_result.next_strategy | default('corpus_convert') }}"
        convert_force_ocr: "{{ step_4_result.strategy_params.force_ocr | default(false) }}"
        convert_root_cause: "{{ step_4_result.root_cause | default('') }}"
      convergence_signal: "{{ step_3_result.distance_from_complete | default(999) }}"

  # ════════════════════════════════════════════════════════════════════════
  # Phase 2: CHUNK — PDCA COMPLETION GATE
  # Target: chunks from 100% of extracted sources, >=100 total, 0 empty
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 6
    id: chunk_do
    action: execute
    description: "PDCA Do — Chunk: split ALL extracted text into passages."
    mcp: corpus_chunk
    gas_cap: 50000
    timeout_seconds: 300
    on_failure:
      action: report
      resume: "corpus_chunk failed — Act pivots (single-tier, smaller tokens, re-convert)."
    input_mapping:
      input_dir: "{{ output_root | default('corpus') }}/extracted/researcher"
      output: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      entity_ref_prefix: "{{ entity_ref_prefix | default('corpus:researcher') }}"
      max_tokens: "{{ prior_iteration.chunk_max_tokens | default(512) }}"
      overlap_tokens: "{{ prior_iteration.chunk_overlap_tokens | default(64) }}"
      multi_tier: "{{ prior_iteration.chunk_multi_tier | default(true) }}"
      coarse_max_tokens: 2048
      medium_max_tokens: 512
      fine_max_tokens: 128
      index: true

  - ordinal: 7
    id: chunk_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Chunk: COMPLETION GATE.
      Returns numeric distance from complete: missing sources + empty chunks.
      0 = fully complete. Checks unique_sources against the inventory target
      and empty_chunks against 0. No silent defaults.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Chunk check (lisp.eval) failed — tool output missing required fields."
    input_mapping:
      form: >
        (let ((target (assoc "completion_target_files" step_1_result))
              (total (assoc "total" step_6_result))
              (unique (assoc "unique_sources" step_6_result))
              (empty (assoc "empty_chunks" step_6_result)))
          (let ((n-target (if (is_null target) 0 target))
                (n-total (if (is_null total) 0 total))
                (n-unique (if (is_null unique) 0 unique))
                (n-empty (if (is_null empty) 0 empty)))
            (let ((missing-sources (- n-target n-unique)))
              (let ((distance (+ missing-sources n-empty)))
                (list
                  (cons "phase" "chunk")
                  (cons "target_sources" n-target)
                  (cons "unique_sources" n-unique)
                  (cons "missing_sources" missing-sources)
                  (cons "total_chunks" n-total)
                  (cons "empty_chunks" n-empty)
                  (cons "distance_from_complete" distance)
                  (cons "verdict" (if (and (= distance 0) (>= n-total 100)) "pass" "fail"))
                  (cons "iteration" "{{ prior_iteration.chunk_iteration | default(0) }}"))))))
      env:
        step_1_result: "{{ step_1_result }}"
        step_6_result: "{{ step_6_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 8
    id: chunk_act
    action: select
    description: >
      PDCA Act — Chunk: METACOGNITION + KATA. Diagnoses incomplete chunking,
      pivots strategy (single-tier, smaller tokens, re-convert, larger tokens).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_7_result.verdict == 'fail'"
    input_mapping:
      phase: "chunk"
      target_condition: "Chunks from 100% of sources, >=100 total, 0 empty"
      actual_condition: "{{ step_7_result.unique_sources | default(0) }} / {{ step_7_result.target_sources | default(138) }} sources, {{ step_7_result.total_chunks | default(0) }} chunks, {{ step_7_result.empty_chunks | default(0) }} empty"
      missing_count: "{{ step_7_result.missing_sources | default(0) }}"
      strategy_used: "corpus_chunk (max_tokens={{ prior_iteration.chunk_max_tokens | default(512) }}, multi_tier={{ prior_iteration.chunk_multi_tier | default(true) }})"
      iteration: "{{ step_7_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_6_result }}"
      check_result: "{{ step_7_result }}"
      available_strategies: "corpus_chunk_single_tier, corpus_chunk_smaller_tokens, corpus_chunk_larger_tokens, re_run_convert, skip_and_escalate"

  - ordinal: 9
    id: chunk_loop
    action: loop
    description: "PDCA Loop — Chunk: re-enters until distance_from_complete reaches 0."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        chunk_iteration: "{{ prior_iteration.chunk_iteration | default(0) | int + 1 }}"
        chunk_max_tokens: "{{ step_8_result.strategy_params.max_tokens | default(512) }}"
        chunk_overlap_tokens: "{{ step_8_result.strategy_params.overlap_tokens | default(64) }}"
        chunk_multi_tier: "{{ step_8_result.strategy_params.multi_tier | default(true) }}"
      convergence_signal: "{{ step_7_result.distance_from_complete | default(999) }}"

  # ════════════════════════════════════════════════════════════════════════
  # Phase 3: TAG — PDCA COMPLETION GATE
  # Target: 100% of chunks tagged with >=1 ontology dimension, 0 untagged
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 10
    id: tag_do
    action: execute
    description: "PDCA Do — Tag: ontology-annotate ALL chunks."
    mcp: corpus_tag_chunks
    gas_cap: 200000
    timeout_seconds: 900
    on_failure:
      action: report
      resume: "corpus_tag_chunks failed — Act pivots (reduce concurrency, switch model, batch)."
    input_mapping:
      chunks_jsonl: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      output: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      concurrency: "{{ prior_iteration.tag_concurrency | default(4) }}"
      dry_run: false

  - ordinal: 11
    id: tag_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Tag: COMPLETION GATE.
      Returns numeric distance: untagged count + skipped count. 0 = complete.
      Checks tagged against total and skipped against 0. No silent defaults.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Tag check (lisp.eval) failed — tool output missing required fields."
    input_mapping:
      form: >
        (let ((total (assoc "total" step_10_result))
              (tagged (assoc "tagged" step_10_result))
              (skipped (assoc "skipped" step_10_result)))
          (let ((n-total (if (is_null total) 0 total))
                (n-tagged (if (is_null tagged) 0 tagged))
                (n-skipped (if (is_null skipped) 0 skipped)))
            (let ((untagged (- n-total n-tagged)))
              (let ((distance (+ untagged n-skipped)))
                (list
                  (cons "phase" "tag")
                  (cons "total_chunks" n-total)
                  (cons "tagged" n-tagged)
                  (cons "untagged" untagged)
                  (cons "skipped" n-skipped)
                  (cons "distance_from_complete" distance)
                  (cons "verdict" (if (= distance 0) "pass" "fail"))
                  (cons "iteration" "{{ prior_iteration.tag_iteration | default(0) }}"))))))
      env:
        step_10_result: "{{ step_10_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 12
    id: tag_act
    action: select
    description: >
      PDCA Act — Tag: METACOGNITION + KATA. Diagnoses incomplete tagging,
      pivots (reduce concurrency, switch model, retry untagged only).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_11_result.verdict == 'fail'"
    input_mapping:
      phase: "tag"
      target_condition: "100% of chunks tagged, 0 untagged, 0 skipped"
      actual_condition: "{{ step_11_result.tagged | default(0) }} / {{ step_11_result.total_chunks | default(0) }} tagged, {{ step_11_result.untagged | default(0) }} untagged, {{ step_11_result.skipped | default(0) }} skipped"
      missing_count: "{{ step_11_result.untagged | default(0) }}"
      strategy_used: "corpus_tag_chunks (concurrency={{ prior_iteration.tag_concurrency | default(4) }})"
      iteration: "{{ step_11_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_10_result }}"
      check_result: "{{ step_11_result }}"
      available_strategies: "reduce_concurrency, switch_classifier_model, batch_smaller, retry_untagged_only, skip_and_escalate"

  - ordinal: 13
    id: tag_loop
    action: loop
    description: "PDCA Loop — Tag: re-enters until distance_from_complete reaches 0."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        tag_iteration: "{{ prior_iteration.tag_iteration | default(0) | int + 1 }}"
        tag_concurrency: "{{ step_12_result.strategy_params.concurrency | default(2) }}"
      convergence_signal: "{{ step_11_result.distance_from_complete | default(999) }}"

  # ════════════════════════════════════════════════════════════════════════
  # Phase 4: EMBED — PDCA COMPLETION GATE
  # Target: 100% of chunks embedded, 0 failures
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 14
    id: embed_do
    action: execute
    description: "PDCA Do — Embed: generate embeddings for ALL chunks."
    mcp: corpus_embed
    gas_cap: 150000
    timeout_seconds: 900
    on_failure:
      action: report
      resume: "corpus_embed failed — Act pivots (reduce batch, switch model, retry failed)."
    input_mapping:
      chunks_jsonl: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      batch_size: "{{ prior_iteration.embed_batch_size | default(50) }}"

  - ordinal: 15
    id: embed_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Embed: COMPLETION GATE.
      Returns numeric distance: failed count. 0 = complete.
      Checks embedded against total and failed against 0. No silent defaults.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Embed check (lisp.eval) failed — tool output missing required fields."
    input_mapping:
      form: >
        (let ((total (assoc "total" step_14_result))
              (embedded (assoc "embedded" step_14_result))
              (failed (assoc "failed" step_14_result)))
          (let ((n-total (if (is_null total) 0 total))
                (n-embedded (if (is_null embedded) 0 embedded))
                (n-failed (if (is_null failed) 0 failed)))
            (let ((distance n-failed))
              (list
                (cons "phase" "embed")
                (cons "total" n-total)
                (cons "embedded" n-embedded)
                (cons "failed" n-failed)
                (cons "distance_from_complete" distance)
                (cons "verdict" (if (= distance 0) "pass" "fail"))
                (cons "iteration" "{{ prior_iteration.embed_iteration | default(0) }}")))))
      env:
        step_14_result: "{{ step_14_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 16
    id: embed_act
    action: select
    description: >
      PDCA Act — Embed: METACOGNITION + KATA. Diagnoses incomplete embedding,
      pivots (reduce batch, switch model, retry failed only).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_15_result.verdict == 'fail'"
    input_mapping:
      phase: "embed"
      target_condition: "100% of chunks embedded, 0 failures"
      actual_condition: "{{ step_15_result.embedded | default(0) }} / {{ step_15_result.total | default(0) }} embedded, {{ step_15_result.failed | default(0) }} failed"
      missing_count: "{{ step_15_result.failed | default(0) }}"
      strategy_used: "corpus_embed (batch_size={{ prior_iteration.embed_batch_size | default(50) }})"
      iteration: "{{ step_15_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_14_result }}"
      check_result: "{{ step_15_result }}"
      available_strategies: "reduce_batch_size, switch_embedding_model, retry_failed_only, skip_and_escalate"

  - ordinal: 17
    id: embed_loop
    action: loop
    description: "PDCA Loop — Embed: re-enters until distance_from_complete reaches 0."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        embed_iteration: "{{ prior_iteration.embed_iteration | default(0) | int + 1 }}"
        embed_batch_size: "{{ step_16_result.strategy_params.batch_size | default(25) }}"
      convergence_signal: "{{ step_15_result.distance_from_complete | default(999) }}"

  # ════════════════════════════════════════════════════════════════════════
  # Phase 5: EXTRACT ASSERTIONS — PDCA COMPLETION GATE
  # Target: 100% of chunks with >=1 assertion, 0 failures
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 18
    id: assert_do
    action: execute
    description: "PDCA Do — Extract Assertions: subject-predicate-object from ALL chunks."
    mcp: corpus_extract_assertions
    gas_cap: 300000
    timeout_seconds: 1200
    on_failure:
      action: report
      resume: "corpus_extract_assertions failed — Act pivots (reduce concurrency, switch model)."
    input_mapping:
      chunks_jsonl: "{{ output_root | default('corpus') }}/chunks/chunks.jsonl"
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      max_assertions: 15
      owner: "{{ owner | default('john-brooks') }}"
      concurrency: "{{ prior_iteration.assert_concurrency | default(8) }}"

  - ordinal: 19
    id: assert_check
    action: compute
    compute_ref: lisp.eval
    description: >
      PDCA Check — Extract Assertions: COMPLETION GATE.
      Returns numeric distance: failed count. 0 = complete.
      Checks succeeded against total and failed against 0. No silent defaults.
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Assert check (lisp.eval) failed — tool output missing required fields."
    input_mapping:
      form: >
        (let ((total (assoc "total_chunks" step_18_result))
              (succeeded (assoc "succeeded" step_18_result))
              (failed (assoc "failed" step_18_result)))
          (let ((n-total (if (is_null total) 0 total))
                (n-succeeded (if (is_null succeeded) 0 succeeded))
                (n-failed (if (is_null failed) 0 failed)))
            (let ((distance n-failed))
              (list
                (cons "phase" "extract_assertions")
                (cons "total" n-total)
                (cons "succeeded" n-succeeded)
                (cons "failed" n-failed)
                (cons "distance_from_complete" distance)
                (cons "verdict" (if (= distance 0) "pass" "fail"))
                (cons "iteration" "{{ prior_iteration.assert_iteration | default(0) }}")))))
      env:
        step_18_result: "{{ step_18_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 20
    id: assert_act
    action: select
    description: >
      PDCA Act — Extract Assertions: METACOGNITION + KATA. Diagnoses
      incomplete extraction, pivots (reduce concurrency, switch model,
      increase max_assertions, retry failed only).
    renderer: minijinja
    template_ref: capabilities-research-pipeline/pdca-kata-pivot
    gas_cap: 8192
    timeout_seconds: 180
    condition: "step_19_result.verdict == 'fail'"
    input_mapping:
      phase: "extract_assertions"
      target_condition: "100% of chunks with >=1 assertion, 0 failures"
      actual_condition: "{{ step_19_result.succeeded | default(0) }} / {{ step_19_result.total | default(0) }} succeeded, {{ step_19_result.failed | default(0) }} failed"
      missing_count: "{{ step_19_result.failed | default(0) }}"
      strategy_used: "corpus_extract_assertions (concurrency={{ prior_iteration.assert_concurrency | default(8) }})"
      iteration: "{{ step_19_result.iteration | default(0) }}"
      max_iterations: "{{ max_gate_iterations | default(5) }}"
      step_output: "{{ step_18_result }}"
      check_result: "{{ step_19_result }}"
      available_strategies: "reduce_concurrency, switch_classifier_model, increase_max_assertions, retry_failed_only, skip_and_escalate"

  - ordinal: 21
    id: assert_loop
    action: loop
    description: "PDCA Loop — Extract Assertions: re-enters until distance_from_complete reaches 0."
    input_mapping:
      loop_target: "{{ 1 }}"
      prior_iteration:
        assert_iteration: "{{ prior_iteration.assert_iteration | default(0) | int + 1 }}"
        assert_concurrency: "{{ step_20_result.strategy_params.concurrency | default(4) }}"
      convergence_signal: "{{ step_19_result.distance_from_complete | default(999) }}"

  # ════════════════════════════════════════════════════════════════════════
  # Phase 6: CONSOLIDATE + DEDUP (optional, no gate)
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 22
    id: consolidate_do
    action: execute
    description: "Consolidate semantically related chunks via LLM synthesis."
    mcp: corpus_consolidate_chunks
    gas_cap: 80000
    timeout_seconds: 600
    on_failure:
      action: report
      resume: "Consolidation is optional — proceeding without it."
    input_mapping:
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      output: "{{ output_root | default('corpus') }}/chunks/consolidated.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      threshold: 0.85
      max_chunks_per_cluster: 5
      concurrency: 4
      dry_run: false

  - ordinal: 23
    id: dedup_do
    action: execute
    description: "Deduplicate chunks by semantic embedding similarity."
    mcp: corpus_dedup_chunks
    gas_cap: 50000
    timeout_seconds: 300
    on_failure:
      action: report
      resume: "Dedup is optional — proceeding without it."
    input_mapping:
      tagged_jsonl: "{{ output_root | default('corpus') }}/chunks/tagged_ontology.jsonl"
      output: "{{ output_root | default('corpus') }}/chunks/deduped.jsonl"
      db_path: "{{ output_root | default('corpus') }}/memory/researcher.db"
      passphrase: "{{ db_passphrase | default('') }}"
      threshold: 0.92
      dry_run: false

  # ════════════════════════════════════════════════════════════════════════
  # Phase 7: VERIFY + AGGREGATE + REPORT
  # ════════════════════════════════════════════════════════════════════════
  - ordinal: 24
    id: verify_do
    action: execute
    description: "Verify corpus extraction by querying the index."
    mcp: corpus_query
    gas_cap: 5000
    timeout_seconds: 60
    on_failure:
      action: report
      resume: "corpus_query failed — verification inconclusive."
    input_mapping:
      query: "What is a capability approach to organizational analysis?"
      top_k: 5
      generate_answer: false

  - ordinal: 25
    id: aggregate_check
    action: compute
    compute_ref: lisp.eval
    description: >
      Aggregate per-phase distances into overall distance from complete.
      Sum of all phase distances. 0 = fully complete pipeline.
      Uses is_null guards — a missing phase result is treated as 999
      (maximally incomplete), not 0 (silently passing).
    gas_cap: 100
    timeout_seconds: 10
    on_failure:
      action: report
      resume: "Aggregate check (lisp.eval) failed — escalating without convergence signal."
    input_mapping:
      form: >
        (let ((convert-d (assoc "distance_from_complete" step_3_result))
              (chunk-d (assoc "distance_from_complete" step_7_result))
              (tag-d (assoc "distance_from_complete" step_11_result))
              (embed-d (assoc "distance_from_complete" step_15_result))
              (assert-d (assoc "distance_from_complete" step_19_result)))
          (let ((cd (if (is_null convert-d) 999 convert-d))
                (kd (if (is_null chunk-d) 999 chunk-d))
                (td (if (is_null tag-d) 999 tag-d))
                (ed (if (is_null embed-d) 999 embed-d))
                (ad (if (is_null assert-d) 999 assert-d)))
            (let ((total (+ (+ (+ cd kd) (+ td ed)) ad)))
              (list
                (cons "convert_distance" cd)
                (cons "chunk_distance" kd)
                (cons "tag_distance" td)
                (cons "embed_distance" ed)
                (cons "assert_distance" ad)
                (cons "total_distance" total)
                (cons "verdict" (if (= total 0) "pass" "fail"))))))
      env:
        step_3_result: "{{ step_3_result }}"
        step_7_result: "{{ step_7_result }}"
        step_11_result: "{{ step_11_result }}"
        step_15_result: "{{ step_15_result }}"
        step_19_result: "{{ step_19_result }}"
      max_steps: 10000
      max_depth: 32

  - ordinal: 26
    id: report
    action: select
    description: "Compile final extraction report with per-phase completion status."
    renderer: minijinja
    template_ref: capabilities-research-pipeline/extraction-report
    gas_cap: 4096
    timeout_seconds: 150
    input_mapping:
      aggregate: "{{ step_25_result }}"
      convert_result: "{{ step_2_result }}"
      chunk_result: "{{ step_6_result }}"
      tag_result: "{{ step_10_result }}"
      embed_result: "{{ step_14_result }}"
      assert_result: "{{ step_18_result }}"
      verify_result: "{{ step_24_result }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 2
  retry_backoff_seconds: 5
  on_validation_failure: abort
