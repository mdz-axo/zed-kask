# Gradient-Seeded Recombination Process Manifest
# ℏKask v0.33.0 — Cross-ontology recombination-site analysis as phased PDCA
# Decomposed into: Inventory → Prior → Map → Detect → Hypothesize → Prioritize → Select-Seeds → Convergence
#
# Substrate ontology: Parisi spin glass theory (non-ergodicity, frustration,
# metastable valleys) — the same substrate as gradient-hunter, but applied to
# cross-ontology recombination sites rather than codebase/telemetry fields.
#
# Surface ontologies: the gradient-hunter eight-shape taxonomy (sharp cliff,
# roof edge, wombling boundary, regression discontinuity, topological hole,
# oracle gap, frustrated landscape, allosteric population shift) + the seven-class
# reason taxonomy (Rubin MCAR/MAR/MNAR + spin glass metastable trap + allostery
# broken coupling).
#
# Distinct from gradient-hunter: GSR hunts gradients BETWEEN ontologies
# (cross-ontology recombination sites), while gradient-hunter hunts gradients
# WITHIN a codebase or telemetry field. The substrate is ontology namespaces,
# not code artifacts. GSR adds an Inventory phase (enumerate ontologies) and a
# Select-Seeds phase (pick most-central concept) that gradient-hunter lacks.
#
# Feedback loop: prior accepts prior_iteration (lessons_learned,
# pattern_signatures, next_prior_focus) and consumes it to amplify the next
# prior. Convergence check emits next_prior_focus when not converged.

manifest:
  id: gradient-seeded-recombination
  category: skill
  name: Gradient-Seeded Recombination
  description: >
    Convergent substrate-analysis process for interdisciplinary concept
    generation. Inventories a set of ontology namespaces (the project's 6
    domain-supplement namespaces + 2 universal axes + 5W1H core, or extended
    via OBO Foundry / OntoBee / BioPortal with per-ontology license check),
    builds a complete-graph prior (every ontology should have a recombination
    surface with every other), maps the actual recombination field, detects
    gradients between populated and unpopulated regions using the gradient-hunter
    eight-shape taxonomy, generates reason hypotheses via the seven-class
    taxonomy, prioritizes sites, and selects seed concepts (most central by
    graph degree). Produces a reusable gradient map consumed by
    constraint-forces-recast. Distinct from gradient-hunter: GSR hunts
    gradients between ontologies, while gradient-hunter hunts gradients
    within a codebase or telemetry field.
  functional_role: flowdef
  version: 0.33.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 3
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 80000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: ontology_registry
    type: object
    required: true
    description: >
      The set of ontology namespaces to inventory. Each entry carries the
      namespace id (fibo, eso, golem, mlschema, omc, sumo, pko, dc_bibo, or
      a BioPortal/OBO Foundry acronym), its axioms, its term signature, and
      its key concepts. The project's default registry is the 6
      domain-supplement namespaces + 2 universal axes; external extensions
      require per-ontology license check.
  - name: ontology_sources
    type: array
    required: false
    description: >
      External ontology sources to extend the registry. Each entry names a
      provider ("obo_foundry" | "ontobee" | "bioportal") and optional auth.
      OBO Foundry is the default (no auth, direct OWL at
      http://purl.obolibrary.org/obo/{acronym}.owl, ~200+ ontologies,
      per-ontology license visible in the registry YAML). OntoBee mirrors
      OBO Foundry with a SPARQL endpoint. BioPortal aggregates 1,288
      ontologies but requires an apikey (config_env, not credentials).
      Per-ontology license checking is a Guardrail enforced in the Inventory
      phase regardless of provider — OBO Foundry licenses span CC-BY 4.0,
      CC-BY 3.0, CC0, Apache 2.0, GPL-3.0, Artistic-2.0; do not assume
      blanket CC-BY.
  - name: bioportal_apikey
    type: string
    required: false
    description: >
      Optional BioPortal API key (free NCBO registration). Only used when
      ontology_sources includes "bioportal". config_env entry, not a
      credential.
  - name: prior_iteration
    type: object
    required: false
    description: >
      Output of a previous GSR iteration on the same registry. Closes the
      feedback loop: the prior phase consumes prior_iteration.lessons_learned
      and prior_iteration.pattern_signatures to amplify the next prior, and
      consumes prior_iteration.next_prior_focus (emitted by the convergence
      check when not converged) to direct the next iteration. When absent,
      GSR runs as a first pass with no prior context.

ledger:
  span_namespace: reg.skill.gradient-seeded-recombination

steps:
  - ordinal: 1
    action: select
    description: >
      Inventory the ontology namespaces in the registry. Enumerate each
      namespace's id, axioms, signature, and key concepts. When external
      sources are configured (OBO Foundry, OntoBee, BioPortal), fetch and
      parse the registry YAML / OWL, checking per-ontology license before
      caching. Per-ontology license check is a Guardrail — do not assume
      blanket CC-BY (OBO Foundry licenses span CC-BY 4.0, CC-BY 3.0, CC0,
      Apache 2.0, GPL-3.0, Artistic-2.0).
    renderer: minijinja
    template_ref: gradient-seeded-recombination/gsr-inventory
    gas_cap: 4096
    timeout_seconds: 120
    input_mapping:
      ontology_registry: "{{ ontology_registry }}"
      ontology_sources: "{{ ontology_sources | default([]) }}"
      bioportal_apikey: "{{ bioportal_apikey | default('') }}"

  - ordinal: 2
    action: select
    description: >
      Build the expected-field model: the complete graph K_n on the n
      ontologies, where every ontology should have a populated recombination
      surface with every other. The prior is the gradient-hunter convention
      prior. Consumes prior_iteration when present (feedback loop closure).
    renderer: minijinja
    template_ref: gradient-seeded-recombination/gsr-prior
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      namespaces: "{{ step_1_result.namespaces | default([]) }}"
      prior_iteration: "{{ prior_iteration | default({}) }}"

  - ordinal: 3
    action: select
    description: >
      Map the actual recombination field with the same granularity as the
      prior. For each ordered pair (A, B), check whether a recombination
      surface exists — i.e., whether any concept in A has been recast into
      B's constraint context. Granularity match is mandatory — granularity
      mismatch produces false gradients.
    renderer: minijinja
    template_ref: gradient-seeded-recombination/gsr-map
    gas_cap: 4096
    timeout_seconds: 300
    input_mapping:
      namespaces: "{{ step_1_result.namespaces | default([]) }}"
      prior_graph: "{{ step_2_result.prior_graph | default({}) }}"

  - ordinal: 4
    action: select
    description: >
      Compare prior to actual. Classify each gradient by its shape using the
      eight ontological anchors. Record location, shape, scale, domain,
      fractal recurrence, populated side, desert side, magnitude. The fractal
      recurrence check is mandatory — a shape that recurs at multiple
      scales/domains is the system's characteristic pattern.
    renderer: minijinja
    template_ref: gradient-seeded-recombination/gsr-detect
    gas_cap: 6144
    timeout_seconds: 90
    input_mapping:
      prior_graph: "{{ step_2_result.prior_graph | default({}) }}"
      actual_field: "{{ step_3_result.actual_field | default([]) }}"
      namespaces: "{{ step_1_result.namespaces | default([]) }}"

  - ordinal: 5
    action: select
    description: >
      For each detected gradient, generate multiple hypotheses for why it
      exists using the seven-class reason taxonomy. Delegates to
      falsifiability for counterfactual discrimination and to metacognition
      for prior perspective rotation. Special cases: non-monotonic gradients
      (frustrated landscape) require identifying the competing constraints;
      allosteric gradients require restoring the distal coupling.
    renderer: minijinja
    template_ref: gradient-seeded-recombination/gsr-hypothesize
    gas_cap: 6144
    timeout_seconds: 90
    input_mapping:
      gradients: "{{ step_4_result.gradients | default([]) }}"
      prior_graph: "{{ step_2_result.prior_graph | default({}) }}"
      namespaces: "{{ step_1_result.namespaces | default([]) }}"

  - ordinal: 6
    action: select
    description: >
      Compile detected gradients and their reason hypotheses into a
      structured, prioritized report. Prioritizes by reason class (broken
      allosteric coupling > metastable trap > MNAR > MAR > MCAR), then
      fractal recurrence, then magnitude, then populated-side criticality.
      Emits lessons_learned and pattern_signatures for the next iteration's
      prior (feedback loop closure).
    renderer: minijinja
    template_ref: gradient-seeded-recombination/gsr-prioritize
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      gradients: "{{ step_4_result.gradients | default([]) }}"
      gradient_hypotheses: "{{ step_5_result.gradient_hypotheses | default([]) }}"
      prior_graph: "{{ step_2_result.prior_graph | default({}) }}"

  - ordinal: 7
    action: select
    description: >
      For each high-priority recombination site (rank ≤ 5), select the seed
      concept as the most central concept in the source ontology — the
      concept with the highest degree in the ontology's concept graph.
      Central concepts have the richest structure to mutate; peripheral
      concepts produce trivial mutants.
    renderer: minijinja
    template_ref: gradient-seeded-recombination/gsr-select-seeds
    gas_cap: 4096
    timeout_seconds: 60
    input_mapping:
      priority_ranking: "{{ step_6_result.priority_ranking | default([]) }}"
      namespaces: "{{ step_1_result.namespaces | default([]) }}"

  - ordinal: 8
    action: compute
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  - ordinal: 9
    action: loop
    description: >
      Re-enter GSR cycle if convergence is not met. Routes
      step_8_result.next_prior_focus back to step 2 as
      prior_iteration.next_prior_focus, along with the prior report's
      lessons_learned and pattern_signatures, closing the feedback loop.
    input_mapping:
      loop_target: "{{ 2 }}"
      prior_iteration:
        lessons_learned: "{{ step_6_result.lessons_learned | default([]) }}"
        pattern_signatures: "{{ step_6_result.pattern_signatures | default([]) }}"
        next_prior_focus: "{{ step_8_result.next_prior_focus | default('') }}"
      kata_hypotenuse: "{{ step_8_result.convergence_metric | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort