# File: registry/manifests/memory_remember.yaml
# Memory encoding workflow — extracts hMems from agent operations.
#
# P3.1 Social Generativity: memory extraction runs the classification and
# extraction steps over the agent operation; both episodic (first-person)
# and semantic (perspective-free) viewpoints are preserved.

manifest:
  id: process/memory/remember
  category: pipeline
  name: Memory Remember
  description: Extracts episodic and semantic hMems from agent operations
  functional_role: flowdef
  version: "0.34.0"
  editor: curator-or-human-admin
  visibility: Public

gas:
  cap: 20000
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

ledger:
  span_namespace: reg.skill.process-memory-remember

steps:
  - ordinal: 1
    action: select
    description: Classify operation and route to episodic or semantic extraction
    template_ref: memory/templates/remember
    renderer: minijinja

  - ordinal: 2
    action: select
    description: Extract episodic hMems (first-person, agent perspective)
    template_ref: memory/templates/remember-episodic
    renderer: minijinja

  - ordinal: 3
    action: select
    description: Extract semantic hMems (third-person, perspective-free)
    template_ref: memory/templates/remember-semantic
    renderer: minijinja