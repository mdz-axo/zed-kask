# Prompt-Enhance Skill Manifest
# hKask v0.34.0 — Streamlined typed prompt enhancement
#
# General-purpose prompt enhancement for prompts destined for the zed-kask
# platform. Typed routing over a 7-type prompt taxonomy (coding, reasoning,
# creative, classification, extraction, agent-task, meta) with a 3-tier
# effort knob (low/medium/high).
#
# Streamlined from the former 15-step / 13-template / PDCA-loop design to a
# 4-step / 4-template single-pass pipeline. The former design made 6+ LLM
# calls per iteration with min_iterations=2 (12+ calls minimum) and crashed
# the host editor. The audit is now folded into the rewrite step; the 7 typed
# rewrites are unified into one template; the collector, evolve, convergence
# check, and PDCA loop are removed.
#
# Steps:
#   1. Classify  — type + effort + output format (select, 1 LLM call)
#   2. Rewrite   — inline audit + typed rewrite (select, 1 LLM call)
#   3. Verify    — decoupled grill-me critic (select, 1 LLM call, medium/high only)
#   4. Output    — format and deliver (select, 1 LLM call)
#
# Max LLM calls: 4 (medium/high), 3 (low — verify skipped). No loop.

manifest:
  id: prompt-enhance
  category: skill
  name: Prompt-Enhance
  description: >
    General-purpose prompt enhancement skill for prompts destined for the
    zed-kask platform. Typed routing over a 7-type prompt taxonomy (coding,
    reasoning, creative, classification, extraction, agent-task, meta) with
    a 3-tier effort knob (low/medium/high). Single-pass pipeline: classify,
    rewrite (with inline audit), verify (decoupled critic at medium/high),
    output. Default output is the enhanced prompt returned inline in a
    copyable code block; optional file save or both.
  functional_role: flowdef
  version: 0.34.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  # Single-pass skill — no PDCA loop. max_iterations=1 prevents re-entry.
  # The convergence block is retained because the compliance test requires
  # it for skill-category manifests (threshold > 0, max_iterations > 0,
  # non-empty convergence_field, non-empty on_not_reached).
  convergence_mode: ""
  max_iterations: 1
  min_iterations: 1
  on_not_reached: proceed
  target_artifacts_field: "current_artifacts"
  threshold: 0.5
  convergence_field: "composite"

gas:
  cap: 30000
  cost_per_iteration: 200
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: prompt
    type: string
    required: true
    description: 'The input prompt to enhance.'
  - name: effort
    type: string
    required: false
    description: 'Effort tier — low (classify + rewrite + output), medium (+ verify), high (same as medium with deeper verify). Defaults to medium.'
  - name: output_format
    type: string
    required: false
    description: 'inline (default — return in fenced code block), file (write to disk), or both.'
  - name: output_path
    type: string
    required: false
    description: 'Explicit file path for file/both output. If omitted, derived as tasks/enhanced-<type>-<timestamp>.md.'
  - name: context
    type: object
    required: false
    description: 'Optional context — target model, intended consumer (skill .j2, agent system prompt, chat, infra template), existing eval set if any.'

steps:
  # ─── STEP 1: CLASSIFY ───
  # Classify prompt type, validate effort tier, resolve output format.
  # Produces the routing decision consumed by step 2.
  - ordinal: 1
    action: select
    description: >
      Classify prompt against the 7-type taxonomy, validate effort tier and
      output format. Produces prompt_type, effort_tier, output_format_resolved,
      and type-specific risks.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-classify.j2
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      prompt: "{{ prompt }}"
      effort: "{{ effort | default('medium') }}"
      output_format: "{{ output_format | default('inline') }}"
      output_path: "{{ output_path | default('') }}"
      context: "{{ context | default({}) }}"

  # ─── STEP 2: REWRITE (inline audit + typed rewrite) ───
  # Folds the former audit (step 2) + 7-way typed rewrite branch (steps 3-9)
  # + collector (step 10) into a single LLM call. The template performs the
  # audit internally and applies type-specific moves based on prompt_type.
  - ordinal: 2
    action: select
    description: >
      Inline audit + typed rewrite. Scans for unresolved placeholders, semantic
      fragility, and structural accretion, then applies type-specific rewrite
      moves to produce the enhanced prompt. Single LLM call.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite.j2
    gas_cap: 9000
    timeout_seconds: 120
    input_mapping:
      prompt: "{{ prompt }}"
      prompt_type: "{{ step_1_result.prompt_type }}"
      effort_tier: "{{ step_1_result.effort_tier }}"
      risks: "{{ step_1_result.risks | default([]) }}"

  # ─── STEP 3: VERIFY (medium/high only) ───
  # Decoupled grill-me critic. Skipped at low tier. Single round at medium,
  # three escalating rounds at high (the template scales internally based on
  # effort_tier). Verdict is informational — no PDCA re-entry. If the verdict
  # is fail, the output step surfaces it in the change log.
  - ordinal: 3
    action: select
    description: >
      Decoupled critic via grill-me self-challenge. Verdict: pass, rewrite_needed,
      or fail. No re-entry — the verdict is surfaced in the output change log.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-verify.j2
    gas_cap: 6000
    timeout_seconds: 90
    input_mapping:
      enhanced_prompt: "{{ step_2_result.enhanced_prompt }}"
      original_prompt: "{{ prompt }}"
      prompt_type: "{{ step_1_result.prompt_type }}"
      effort_tier: "{{ step_1_result.effort_tier }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set | default([]) }}"
      acceptance_criteria: "{{ step_2_result.acceptance_criteria | default([]) }}"
      round: 1
    condition: "step_1_result.effort_tier != 'low'"

  # ─── STEP 4: OUTPUT ───
  # Format per output_format: inline (fenced code block, default),
  # file (write to path), or both. Always include change log.
  - ordinal: 4
    action: select
    description: >
      Format and deliver the enhanced prompt per output_format
      (inline/file/both). Always include a change log with audit findings,
      grill verdict, mutations applied, and deferred findings.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-output.j2
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      enhanced_prompt: "{{ step_2_result.enhanced_prompt }}"
      original_prompt: "{{ prompt }}"
      prompt_type: "{{ step_1_result.prompt_type }}"
      effort_tier: "{{ step_1_result.effort_tier }}"
      output_format_resolved: "{{ step_1_result.output_format_resolved }}"
      output_path_resolved: "{{ step_1_result.output_path_resolved }}"
      phases_run: "{{ step_1_result.routing | default({}) }}"
      audit_findings: "{{ step_2_result.audit_findings | default([]) }}"
      grill_ratings: "{{ step_3_result.ratings | default([]) }}"
      grill_verdict: "{{ step_3_result.verdict | default('skipped') }}"
      mutations_applied: "{{ step_2_result.mutations_applied | default([]) }}"
      mutations_deferred: "{{ step_2_result.mutations_deferred | default([]) }}"
      convergence_metric: 0.0

error_handling:
  on_gas_exceeded: abort
  on_timeout: abort
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ledger:
  emit_spans: true
  span_namespace: reg.skill.prompt-enhance
  telemetry_namespace: hkask.template.prompt-enhance
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: false
  include_output: true
  include_gas_cost: true
  include_reg_events: true
