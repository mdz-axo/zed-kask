# Prompt-Enhance Skill Manifest
# ℏKask v0.31.0 — Typed prompt enhancement as convergent PDCA
#
# General-purpose prompt enhancement for prompts destined for the zed-kask
# platform. Typed routing over a 7-type prompt taxonomy (coding, reasoning,
# creative, classification, extraction, agent-task, meta) with a 3-tier
# effort knob (low/medium/high). Composes pragmatic-semantics (classifier +
# provenance), pragmatic-cybernetics (loop diagnosis), essentialist (deletion
# test on prompt sections), grill-me (decoupled critic), and gpa-evolution
# (high-effort evolutionary optimization) as phase delegates.
#
# Specialized leaf of the self-improvement family tree (Σ-pathway,
# p-component, intrinsic evaluative feedback signal). Borrows the Kata shape
# (baseline → target → experiment → measure) but not the 10-iteration outer
# loop — prompt-enhance is a single-shot service skill.
#
# EXECUTOR NOTES (learned from reading executor.rs):
# - Step field is `condition:` (not `skip_condition:`). Step runs when condition
#   is true. Supported: ==, !=, <, <=, >, >=, AND, OR, NOT, dot-paths.
# - Loop steps do NOT evaluate `loop_condition`. They check convergence_field
#   + threshold + max_iterations only. Carried state must be bound via
#   input_mapping (keys other than loop_target are written into context).
# - `condition:` on a loop step is evaluated like any other step; if false,
#   the loop is skipped (treated as a no-op). We use this to gate the PDCA
#   loop on the convergence-check's next_action verdict.

manifest:
  id: prompt-enhance
  category: skill
  name: Prompt-Enhance
  description: >
    General-purpose prompt enhancement skill for prompts destined for the
    zed-kask platform. Typed routing over a 7-type prompt taxonomy (coding,
    reasoning, creative, classification, extraction, agent-task, meta) with
    a 3-tier effort knob (low/medium/high). Composes pragmatic-semantics,
    pragmatic-cybernetics, essentialist, grill-me, and gpa-evolution as
    phase delegates. Default output is the enhanced prompt returned inline
    in a copyable code block; optional file save or both.
  functional_role: flowdef
  version: 0.31.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 3
  max_iterations: 10
  min_iterations: 2
  on_not_reached: escalate
  target_artifacts_field: "current_artifacts"

gas:
  cap: 150000              # High-tier evolutionary runs are gas-heavy. Calibrate after first run.
  cost_per_iteration: 200
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 4                   # Reflection + critique + evolution is inference-heavy.
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: prompt
    type: string
    required: true
    description: 'The input prompt to enhance.'
  - name: effort
    type: string
    required: false
    description: 'Effort tier — low (single rewrite), medium (audit + rewrite + 1 grill round), high (full evolution). Defaults to medium.'
  - name: output_format
    type: string
    required: false
    description: 'inline (default — return in fenced code block), file (write to disk), or both.'
  - name: output_path
    type: string
    required: false
    description: 'Explicit file path for file/both output. If omitted, derived as tasks/enhanced-<type>-<timestamp>.md.'
  - name: context
    type: object
    required: false
    description: 'Optional context — target model, intended consumer (skill .j2, agent system prompt, chat, infra template), existing eval set if any.'

fusion:
  judge: KC/z-ai/glm-5.2
  panel:
    - Kimi2.7
    - Qwen3.7 Max
    - GLM5.2
  mode: critique
  skills:
    - essentialist
    - grill-me
  max_rounds: 3

steps:
  # ─── PHASE 1: CLASSIFY ───
  # Classify prompt type, validate effort tier, resolve output format,
  # synthesize proxy eval set (medium/high). Produces the routing decision.
  - ordinal: 1
    action: select
    description: >
      Phase 1 — Classify prompt against the 7-type taxonomy, validate effort
      tier and output format, synthesize proxy eval set for medium/high tiers.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-classify.j2
    gas_cap: 6000
    timeout_seconds: 60
    input_mapping:
      prompt: "{{ prompt }}"
      effort: "{{ effort | default('medium') }}"
      output_format: "{{ output_format | default('inline') }}"
      output_path: "{{ output_path | default('') }}"
      context: "{{ context | default({}) }}"

  # ─── PHASE 2: AUDIT (medium/high only) ───
  # condition: run when effort is NOT low. Three lenses: pragmatic-semantics
  # (always at medium/high), pragmatic-cybernetics (high only), essentialist
  # G1+G2 (medium) / G1+G2+G3 (high).
  - ordinal: 2
    action: select
    description: >
      Phase 2 — Audit prompt health via pragmatic-semantics (provenance tracing),
      pragmatic-cybernetics (loop diagnosis, high only), and essentialist
      (deletion test on prompt sections). Produces constraint-force-labeled
      findings that drive Phase 3 mutations.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-audit.j2
    gas_cap: 7000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      prompt_type: "{{ step_1_result.prompt_type }}"
      effort_tier: "{{ step_1_result.effort_tier }}"
      semantic_classification: "{{ step_1_result.semantic_classification }}"
      risks: "{{ step_1_result.risks }}"
    condition: "step_1_result.effort_tier != 'low'"

  # ─── PHASE 3: TYPED REWRITE ───
  # Routes to one of 7 typed templates based on prompt_type from step 1.
  # Each step has a condition that runs it only when prompt_type matches.
  # Only one of steps 3-9 will execute per cascade pass.
  - ordinal: 3
    action: select
    description: "Phase 3 (coding) — Typed rewrite for coding prompts."
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite-coding.j2
    gas_cap: 7000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      findings: "{{ step_2_result.findings | default([]) }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      iteration: "{{ pdca_iteration | default(1) }}"
      grill_feedback: "{{ step_11_result | default({}) }}"
    condition: "step_1_result.prompt_type == 'coding'"

  - ordinal: 4
    action: select
    description: "Phase 3 (reasoning) — Typed rewrite for reasoning prompts."
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite-reasoning.j2
    gas_cap: 6000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      findings: "{{ step_2_result.findings | default([]) }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      iteration: "{{ pdca_iteration | default(1) }}"
      grill_feedback: "{{ step_11_result | default({}) }}"
    condition: "step_1_result.prompt_type == 'reasoning'"

  - ordinal: 5
    action: select
    description: "Phase 3 (creative) — Typed rewrite for creative prompts."
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite-creative.j2
    gas_cap: 6000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      findings: "{{ step_2_result.findings | default([]) }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      iteration: "{{ pdca_iteration | default(1) }}"
      grill_feedback: "{{ step_11_result | default({}) }}"
    condition: "step_1_result.prompt_type == 'creative'"

  - ordinal: 6
    action: select
    description: "Phase 3 (classification) — Typed rewrite for classification prompts."
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite-classification.j2
    gas_cap: 6000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      findings: "{{ step_2_result.findings | default([]) }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      iteration: "{{ pdca_iteration | default(1) }}"
      grill_feedback: "{{ step_11_result | default({}) }}"
    condition: "step_1_result.prompt_type == 'classification'"

  - ordinal: 7
    action: select
    description: "Phase 3 (extraction) — Typed rewrite for extraction prompts."
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite-extraction.j2
    gas_cap: 6000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      findings: "{{ step_2_result.findings | default([]) }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      iteration: "{{ pdca_iteration | default(1) }}"
      grill_feedback: "{{ step_11_result | default({}) }}"
    condition: "step_1_result.prompt_type == 'extraction'"

  - ordinal: 8
    action: select
    description: "Phase 3 (agent-task) — Typed rewrite for agent task prompts."
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite-agent-task.j2
    gas_cap: 7000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      findings: "{{ step_2_result.findings | default([]) }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      iteration: "{{ pdca_iteration | default(1) }}"
      grill_feedback: "{{ step_11_result | default({}) }}"
    condition: "step_1_result.prompt_type == 'agent-task'"

  - ordinal: 9
    action: select
    description: "Phase 3 (meta) — Typed rewrite for meta-prompts."
    renderer: minijinja
    template_ref: prompt-enhance/enhance-rewrite-meta.j2
    gas_cap: 7000
    timeout_seconds: 90
    input_mapping:
      prompt: "{{ prompt }}"
      findings: "{{ step_2_result.findings | default([]) }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      iteration: "{{ pdca_iteration | default(1) }}"
      grill_feedback: "{{ step_11_result | default({}) }}"
    condition: "step_1_result.prompt_type == 'meta'"

  # ─── COLLECTOR (step 10) ───
  # Canonicalizes the rewrite output into a single context key so downstream
  # steps don't need nested default() chains across steps 3-9. Uses a select
  # action with a minimal Jinja template that picks the non-empty result.
  # The executor stores the result as step_10_result.
  - ordinal: 10
    action: select
    description: >
      Collector — canonicalize the active rewrite step's output into
      enhanced_prompt and acceptance_criteria context keys. Minimal LLM call;
      pure context coalescing.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-collector.j2
    gas_cap: 1024
    timeout_seconds: 15
    input_mapping:
      candidates:
        - step_3_result
        - step_4_result
        - step_5_result
        - step_6_result
        - step_7_result
        - step_8_result
        - step_9_result

  # ─── PHASE 4: VERIFY (medium/high only) ───
  # Decoupled grill-me critic. Tier-scaled rounds: 1 (Recall+Mechanism) at
  # medium, 3 escalating at high. Verdict drives the convergence metric
  # (step 13 incorporates grill verdict into re-enter decision).
  - ordinal: 11
    action: select
    description: >
      Phase 4 — Decoupled critic via grill-me self-challenge across Recall,
      Mechanism, Rationale, Edge Cases, Synthesis. Tier-scaled rounds.
      Verdict: pass → proceed; rewrite_needed → convergence metric stays
      high, forcing PDCA re-entry; fail → escalate to user.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-verify.j2
    gas_cap: 6000
    timeout_seconds: 90
    input_mapping:
      enhanced_prompt: "{{ step_10_result.enhanced_prompt }}"
      original_prompt: "{{ prompt }}"
      prompt_type: "{{ step_1_result.prompt_type }}"
      effort_tier: "{{ step_1_result.effort_tier }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      acceptance_criteria: "{{ step_10_result.acceptance_criteria }}"
      round: "{{ pdca_iteration | default(1) }}"
    condition: "step_1_result.effort_tier != 'low'"

  # ─── PHASE 5: EVOLVE (high only) ───
  # Delegates to gpa-evolution's pattern: sample trajectories → reflect
  # (textual gradient) → propose mutations + crossover → test → update
  # Pareto frontier. Min 2 iterations. Returns frontier's best member.
  - ordinal: 12
    action: select
    description: >
      Phase 5 — Evolutionary optimization via gpa-evolution delegate. Fires
      only at high tier. Multi-objective (quality, cost). Min 2 iterations.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-evolve.j2
    gas_cap: 8000
    timeout_seconds: 180
    input_mapping:
      enhanced_prompt: "{{ step_10_result.enhanced_prompt }}"
      prompt_type: "{{ step_1_result.prompt_type }}"
      proxy_eval_set: "{{ step_1_result.proxy_eval_set }}"
      objectives:
        - name: quality
          maximize: true
        - name: cost
          maximize: false
      iteration: "{{ pdca_iteration | default(1) }}"
      frontier: "{{ step_12_result.frontier | default([]) }}"
    condition: "step_1_result.effort_tier == 'high'"

  # ─── CONVERGENCE CHECK (step 13) ───
  # Cauchy criterion: iterates stabilized. Deterministic compute step —
  # no LLM, no timeout. Replaces the former tier-scaled self-grade gate.
  - ordinal: 13
    action: compute
    compute_ref: kata.convergence_check
    description: "CHECK CONVERGENCE: Cauchy criterion. Deterministic."
    input_mapping:
      hypotenuse: 0.0
      hypotenuse_epsilon: "{{ _convergence.hypotenuse_epsilon | default(0.05) }}"
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(3) }}"
      brier_history: "{{ _convergence.brier_history | default([]) }}"
      hypotenuse_history: "{{ _convergence.hypotenuse_history | default([]) }}"
      brier_threshold: "{{ _convergence.brier_threshold | default(0.15) }}"
      brier_window: "{{ _convergence.brier_window | default(3) }}"
      mode: "cauchy"

  # ─── PDCA LOOP (step 14) ───
  # The executor checks the Cauchy convergence criterion (via
  # kata_hypotenuse pushed into context) + max_iterations. Carried state is
  # bound via input_mapping (keys other than loop_target are written into
  # context by the executor):
  #   - prior_convergence_metric: feeds the materiality guard next iteration
  #   - pdca_iteration: increments the iteration counter
  #   - phases_completed: accumulates which phases have run
  #   - kata_hypotenuse: the quality signal the Cauchy criterion tracks
  - ordinal: 14
    action: loop
    description: >
      Re-enter PDCA cycle from Phase 1 if not converged. Carries
      prior_convergence_metric and increments pdca_iteration. The Cauchy
      criterion detects when the iterates have stopped moving.
    gas_cap: 1000
    timeout_seconds: 30
    input_mapping:
      loop_target: "{{ 1 }}"
      kata_hypotenuse: "{{ step_12_result.convergence_metric | default(step_10_result.convergence_metric | default(1.0)) }}"
      prior_convergence_metric: "{{ step_13_result.hypotenuse | default(1.0) }}"
      pdca_iteration: "{{ (pdca_iteration | default(1)) + 1 }}"

  # ─── OUTPUT (step 15) ───
  # Format per output_format: inline (fenced code block, default),
  # file (write to path), or both. Always include change log.
  - ordinal: 15
    action: select
    description: >
      ACT phase — Format and deliver the enhanced prompt per output_format
      (inline/file/both). Always include a change log with audit findings
      table, grill ratings, mutations applied, deferred findings, residual
      risks.
    renderer: minijinja
    template_ref: prompt-enhance/enhance-output.j2
    gas_cap: 4000
    timeout_seconds: 60
    input_mapping:
      enhanced_prompt: "{{ step_12_result.best_member | default(step_10_result.enhanced_prompt) }}"
      original_prompt: "{{ prompt }}"
      prompt_type: "{{ step_1_result.prompt_type }}"
      effort_tier: "{{ step_1_result.effort_tier }}"
      output_format_resolved: "{{ step_1_result.output_format_resolved }}"
      output_path_resolved: "{{ step_1_result.output_path_resolved }}"
      phases_completed: "{{ phases_completed | default([]) }}"
      audit_findings: "{{ step_2_result.findings | default([]) }}"
      grill_ratings: "{{ step_11_result.ratings | default([]) }}"
      mutations_applied: "{{ step_10_result.mutations_applied | default([]) }}"
      mutations_deferred: "{{ step_10_result.mutations_deferred | default([]) }}"
      convergence_metric: "{{ step_13_result.hypotenuse | default(1.0) }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort

ocap:
  required_capabilities:
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-classify
      gas_budget: 6000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-audit
      gas_budget: 7000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-rewrite-coding
      gas_budget: 7000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-rewrite-reasoning
      gas_budget: 6000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-rewrite-creative
      gas_budget: 6000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-rewrite-classification
      gas_budget: 6000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-rewrite-extraction
      gas_budget: 6000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-rewrite-agent-task
      gas_budget: 7000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-rewrite-meta
      gas_budget: 7000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-collector
      gas_budget: 1024
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-verify
      gas_budget: 6000
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-evolve
      gas_budget: 4096
    - resource: template
      action: render
      template_id: prompt-enhance/enhance-output
      gas_budget: 4000
    - resource: manifest
      action: execute
      template_id: prompt-enhance
      gas_budget: 2000
  delegation_chain_required: true
  signature_algorithm: ed25519
  capability_expiry_seconds: 7200    # High-tier evolutionary runs take longer
  template_scoped: true

# Regulation: prompt-enhance is a curation activity — the Curator optimizes
# prompts. Uses the canonical reg.skill namespace. Emits tracing events
# under reg.skill.prompt-enhance with operation fields specific to the
# enhancement pipeline.
ledger:
  emit_spans: true
  span_namespace: reg.skill.prompt-enhance
  telemetry_namespace: hkask.template.prompt-enhance
  variety_monitoring: true
  algedonic_threshold: 100
  escalation_target: Curator

audit:
  enabled: true
  log_level: info
  include_input: true
  include_output: true
  include_gas_cost: true
  include_reg_events: true
