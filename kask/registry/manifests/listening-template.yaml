# Listening Template Process Manifest
# ℏKask v0.33.0 — MAIA v3 listening template as a single-pass KnowAct
# Design: kask/docs/explanation/earnings-transcript-analysis-design.md §(b), §(c)

manifest:
  id: listening-template
  category: skill
  name: Listening Template
  description: >
    Applies the MAIA v3 listening template to an earnings-call transcript.
    Single-pass extraction: per-section verdicts with verbatim evidence quotes,
    horizon classification (seam checkpoint / tactical / strategic /
    short-term-only), and the checkpoint map. Enforces the no-fabrication
    invariant — every evidence field is a verbatim substring of the source.
  functional_role: flowdef
  version: 0.33.0
  editor: curator-or-human-admin
  visibility: Public

convergence:
  # Single-pass: the design (§(c) pragmatic-cybernetics) says "the loop
  # terminates per quarter (one pass over one transcript, fixed template, no
  # iteration) — it is a sense→act loop, not an optimizing loop." So
  # min=max=1; convergence is trivially satisfied on the first pass.
  convergence_mode: "cauchy"
  cauchy_epsilon: 0.03
  cauchy_window: 1
  max_iterations: 1
  min_iterations: 1
  on_not_reached: escalate

gas:
  cap: 120000
  cost_per_iteration: 100
  alert_threshold: 0.8
  hard_limit: true

rjoule:
  cap: 2
  alert_threshold: 0.8
  hard_limit: true

inputs:
  - name: transcript
    type: string
    required: true
  - name: prior_transcripts
    type: array
    required: false
  - name: company_symbol
    type: string
    required: false

ledger:
  span_namespace: reg.skill.listening-template

steps:
  - ordinal: 1
    action: select
    description: >
      Apply the v3 listening template to the transcript. Extract per-section
      verdicts with verbatim evidence, classify claims by horizon, emit the
      checkpoint map and ignored_short_term.
    renderer: minijinja
    template_ref: listening-template/apply-template
    gas_cap: 100000
    timeout_seconds: 60
    input_mapping:
      transcript: "{{ transcript }}"
      prior_transcripts: "{{ prior_transcripts | default([]) }}"
      company_symbol: "{{ company_symbol | default('UNKNOWN') }}"

  - ordinal: 2
    action: compute
    compute_ref: kata.convergence_check
    description: >
      CHECK CONVERGENCE: single-pass — convergence is trivially satisfied
      (min=max=1). The compute step records the pass for the trace.
    input_mapping:
      hypotenuse: 0.0
      cauchy_epsilon: "{{ _convergence.cauchy_epsilon | default(0.03) }}"
      cauchy_window: "{{ _convergence.cauchy_window | default(1) }}"
      cauchy_mode: "cauchy"

  - ordinal: 3
    action: loop
    description: Single-pass — no loop (max_iterations=1).
    input_mapping:
      loop_target: "{{ 1 }}"

error_handling:
  on_gas_exceeded: abort
  on_timeout: retry
  max_retries: 1
  retry_backoff_seconds: 1
  on_validation_failure: abort
