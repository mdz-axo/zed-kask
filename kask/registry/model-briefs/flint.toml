# Model brief — Flint (M9 deterministic core, 2026-11-05)
#
# Sourced from: unsloth/flint-GGUF `flint-UD-Q4_K_XL.gguf`
# (25,054,688,704 bytes, single file), verified live 2026-11-05 by the
# crate's own GGUF header parse (tests/fleet_parse.rs): expert_count
# 256, expert_used_count 6, block_count 49, native context 262,144,
# expert_bytes 21.47 GiB / dense_bytes 1.86 GiB. Maker: Recursive
# (recursive.com), Apache 2.0 — 39.8B total, ~2.5B active (baseline
# record §6; research runs df2d619d64dc29b4 + 8d71a88a57a0dc74).

model_id = "flint"
display_name = "Flint"

[model]
total_params = 39_800_000_000
active_params = 2_500_000_000
expert_count = 256
expert_used_count = 6

[placement]
# MoE without a per-layer n-gram/PLE-style table: the relocation-era
# emit specimen showed a dead --override-tensor on Flint (the pattern
# matched no tensors), so the pin pattern is empty — the routed experts
# stay in RAM via --cpu-moe while the dense layers offload.
ple_pin_pattern = ""

[recommendations]
kv_cache_type = "q8_0"
flash_attn = true
# Native context 262,144 (the parse); the recommended serving context
# follows the measured configuration class (65,536 — the P0 matrix legs
# and the KV budget that fits the 8 GB card).
context_length = 65_536
