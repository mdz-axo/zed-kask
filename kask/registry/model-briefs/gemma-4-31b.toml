# Model brief — Gemma 4 31B (M9 deterministic core, 2026-11-04)
#
# Per-model metadata for the Gemma 4 31B dense model.
# Gemma 4 is a dense (non-MoE) architecture — the PLE pin
# pattern targets the MoE expert weights that stay in RAM.

model_id = "gemma-4-31b"
display_name = "Gemma 4 31B"

[model]
total_params = 31_000_000_000
active_params = 31_000_000_000  # dense: all params active
expert_count = 0                # dense: no routed experts
expert_used_count = 0           # dense: no expert selection

[placement]
# Gemma 4 is dense — no PLE table, no MoE expert split.
# The whole model fits the VRAM budget on an 8 GB card
# in Q4_K_XL (~18.8 GiB), so the pin pattern is empty.
ple_pin_pattern = ""

[recommendations]
# Dense model at Q4_K_XL (~18.8 GiB): fits the 8 GB card
# with room for the KV cache at q8_0.
kv_cache_type = "q8_0"
flash_attn = true
context_length = 32_768
