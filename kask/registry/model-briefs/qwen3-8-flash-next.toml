# Model brief — Qwen3.8-Flash-Next (M9 deterministic core, 2026-11-04)
#
# Per-model metadata the placement compiler composes with the hardware
# probe and the engine manifest. The GGUF parse supplies the tensor
# structure; this brief supplies the model-level policy that the parse
# cannot infer (the PLE pin pattern, the recommended KV type, the
# streaming floor context).
#
# Sourced from: unsloth/Qwen3.8-Flash-Next-GGUF, verified live
# 2026-11-04 (all four shards downloaded, GGUF parsed, matrix measured).

model_id = "qwen3-8-flash-next"
display_name = "Qwen3.8 Flash Next"

[location]
dir = "qwen38-flash-next"
artifact = "UD-Q2_K_XL"

[model]
# Total parameters in the MoE (from the GGUF metadata).
total_params = 125_000_000_000
# Active parameters per token (from the GGUF metadata).
active_params = 6_000_000_000
# Routed experts (from the GGUF `expert_count`).
expert_count = 512
# Experts used per token (from the GGUF `expert_used_count`).
expert_used_count = 10

[placement]
# The n-gram/PLE table tensor (28.8 GiB) stays on CPU while layers
# offload. This is the tensor-name prefix that matches the PLE family
# — confirmed by the live parse (1224 tensors) and the matrix.
#
# Other MoE models need different patterns:
#   - Gemma 4 31B:   "model.layers.*.mlp.experts." (dense MoE, no PLE)
#   - Muse Glimmer:   "model.layers.*.moe." (varies by architecture)
#
# The compiler emits `--override-tensor <pattern>=CPU`.
ple_pin_pattern = "per_layer_token_embd"

[recommendations]
# The measured best on the matrix (§4): HIP + fa-on + KV q8_0
# at 65536 context.
kv_cache_type = "q8_0"
flash_attn = true
context_length = 65_536

[draft]
# The shared MTP draft module (the MTP head excluding embed_tokens,
# shared with the main model — saves 1-2 GB vs the general module).
# Sourced from unsloth/Qwen3.8-Flash-Next-GGUF MTP/, verified
# 2026-11-04: 2,786,568,256 bytes, sha256
# 5ff54097406a905cf3a724c709124ceb0e3e10235ee862298969e91c96fa96e6
# (matches the HF LFS oid). Resolved against the model GGUF's
# directory — the MTP/ sibling of the shard dir (the same-dir
# convention). unsloth's guidance: 1.3-1.7x decode on GPU, gains
# smaller on low-memory-bandwidth devices; --spec-draft-n-max start
# at 2, tune 1-6 per hardware (the pre-registered experiment pins 2).
module_file = "MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf"
spec_type = "draft-mtp"
draft_n_max = 2
draft_bytes = 2_786_568_256
# MTP record §7 item 1 (2026-11-06): the spec-decode VERIFY workspace —
# GPU-side whenever a draft is asked, INDEPENDENT of the draft module's
# placement (a CPU-routed draft still verifies in GPU memory; the D-B
# finding: the verify path OOM'd ctx 65536 on the 8 GB card with
# 0.9-1.2 GB free). Unsloth's guidance: prepare 1-2 GB extra headroom —
# the brief declares the conservative upper bound (2 GiB).
verify_workspace_bytes = 2_147_483_648
