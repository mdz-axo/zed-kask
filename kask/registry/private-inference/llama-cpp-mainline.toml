# L1 engine-surface manifest — llama.cpp mainline at 9e2a04a, the P0
# surface: CPU control + the measured GPU tier (Vulkan/HIP, plan §11,
# baseline record §4/§5). The flag spellings and constraint parameters below
# are the drift layer: a llama.cpp release that renames flags or changes
# constraint semantics is absorbed HERE, plus fixture updates — zero Rust
# changes (hypothesis H2). The startup probe refuses engine builds whose
# `--version` commit is not the pinned one — exact-commit, not "older
# than": commit hashes are not orderable, so any other commit is an
# unverified surface, newer included (slice plan D-S2). The manifest is
# never trusted alone (Good Regulator).

surface_id = "llama-cpp-mainline-cpu-p0"
engine_version_pin = "v0.9.0-dev mainline, commit 9e2a04a — builds: CPU (build/), Vulkan (build-vulkan/), HIP gfx1102 (build-hip/)"

# The structured pin the startup probe enforces (the probe parses the
# binary's `--version` line: "version: 0.9.0-dev (build 236, commit
# 9e2a04a)", verified live 2026-11-06 against build-hip/bin/llama-server —
# the probe pins the COMMIT, never the build number).
[version_pin]
commit = "9e2a04a"
version = "0.9.0-dev"

# The endpoints the supervisor polls (verified live at P0: the measure-leg
# harness polls /health with a 20-minute bound on every leg).
[probe]
health_path = "/health"
models_path = "/v1/models"

# --- flags: intent -> concrete spellings for THIS pinned build. The KV
# cache-type intent carries TWO spellings: v0.9.0-dev (commit 9e2a04a)
# split the old `--kv-cache-type` into `--cache-type-k`/`--cache-type-v`
# (verified against the installed binary's --help, 2026-11-04 — the plan
# emission with the old spelling fails with `invalid argument`). ---

[flags]
binary = "llama-server"
model = "--model"
n_gpu_layers = "-ngl"
cpu_moe = "--cpu-moe"
override_tensor = "--override-tensor"
kv_cache_type = ["--cache-type-k", "--cache-type-v"]
ctx_size = "--ctx-size"
flash_attn = "--flash-attn"
host = "--host"
port = "--port"
threads = "--threads"
# The served-model alias: the server answers /v1/models under the brief's
# model_id, matching the provider cards' names (verified live 2026-11-04:
# "-a, --alias STRING (env: LLAMA_ARG_ALIAS)").
alias = "--alias"
# The token file: "--api-key-file FNAME — path to file containing API keys"
# (verified live 2026-11-04; no env var exists for the key).
api_key_file = "--api-key-file"
# The no-mmap intent (2026-11-07 dGPU link-loss investigation): the full
# argv fragment that loads weights WITHOUT memory mapping. Verified live
# 2026-11-07 against build-hip/bin/llama-server --help: this pin replaced
# the classic --no-mmap with "-lm, --load-mode MODE" whose `none` value is
# "no special loading mode". A plan carrying the fragment counts its
# weights as resident RAM in the headroom guard (model_mmap=false) — the
# mmap'd-weights path under the HIP backend is what drives the KFD
# userptr/SVM churn that preceded every dGPU PCIe link loss (2026-11-07
# diagnosis).
no_mmap = ["--load-mode", "none"]

# --- constraints (closed vocabulary; every one gated by the fixtures below) ---

[[constraints]]
kind = "available_ram_headroom"
# 15% of available RAM must stay free after the anonymous class
# (KV + compute buffers). File-backed weights are evictable and excluded
# unless a plan stops mmap-ing them.
headroom_factor = 0.15

[[constraints]]
kind = "vram_dense_fit"

[[constraints]]
kind = "expert_slot_floor"
# PR #25294's documented abort class: multi-pass expert GEMMs need at
# least 3 × n_expert_used dynamic slots. Streaming (P2) is unroutable in
# v1; this ships so the surface is gated the day it activates.
floor_mult = 3

[[constraints]]
kind = "mutually_exclusive"
# The streaming mode auto-disables mmap (PR #25294); --mlock and
# --moe-stream can never co-occur on one plan.
a = "--mlock"
b = "--moe-stream"

[[constraints]]
kind = "expr"
# Native context ceiling (262,144); YaRN extension to 1M is a deliberate
# policy change, not an accident this guard should wave through.
form = "(<= context_length 262144)"

