# L1 engine-surface manifest — the ServeurpersoCom moe-stream-partition fork:
# the P2 streaming experiment engine (three-tier expert streaming: VRAM expert
# cache + pinned-RAM mirror + SSD pread), the pinned fork the operator
# approved 2026-11-05 (local-leg plan §12 item 2 — its own engagement; the P2
# streaming-parity plan is the engagement record).
#
# Provenance: ServeurpersoCom/llama.cpp branch `moe-stream-partition`, tip
# 7174388895e8471a8bf2869e34d6a61e33f4b84c (BUILD_PIN.txt at
# engines/serveurperso-moe-stream-partition; git ls-remote and the clone's
# rev-parse HEAD agree — the exact-commit discipline, D-S2). Built HIP gfx1102
# on this machine (ROCm 7.2, the build-hip.sh recipe), verified live 2026-11-05.
#
# Every spelling below was verified live 2026-11-05 against the built binary's
# --help. The fork's own --version line: "version: 0.3.0-dev (build 1, commit
# 7174388)" — the fork branches from an OLDER upstream than mainline
# (0.3.0-dev vs the mainline pin's 0.9.0-dev), which is why nothing is assumed
# from the other surfaces' spellings.
#
# The streaming vocabulary (--moe-stream, --moe-stream-cache <NG|Ns>,
# --moe-stream-ram N, --moe-stream-io-threads N, --moe-stream-direct) is
# verified on this binary but CANNOT ride [flags]: FlagVocabulary has no
# streaming intent, by design — streaming is UNROUTABLE in v1 (compile_placement
# leaves the slot fields None; pinned by streaming_mode_stays_unroutable_in_v1).
# The experiment legs pass the streaming flags by hand under the P0
# hand-launch discipline; the band, and only the band, earns routability.
# This surface is an EXPERIMENT manifest — never the shipped surface.

surface_id = "llama-cpp-serveurperso-moe-stream-p2"
engine_version_pin = "0.3.0-dev serveurperso moe-stream-partition, commit 7174388 (HIP gfx1102)"

# The structured pin the startup probe enforces (the probe parses the binary's
# --version line: "version: 0.3.0-dev (build 1, commit 7174388)", verified
# live 2026-11-05).
[version_pin]
commit = "7174388"
version = "0.3.0-dev"

[probe]
health_path = "/health"
models_path = "/v1/models"

# --- flags: intent -> concrete spellings for THIS pinned build. Verified
# live 2026-11-05 against the built binary's --help. --kv-cache-type does NOT
# exist on this fork (0 hits) — the split -ctk/-ctv form is the verified one. ---

[flags]
binary = "llama-server"
model = "--model"
n_gpu_layers = "-ngl"
cpu_moe = "--cpu-moe"
override_tensor = "--override-tensor"
kv_cache_type = ["--cache-type-k", "--cache-type-v"]
ctx_size = "--ctx-size"
flash_attn = "--flash-attn"
host = "--host"
port = "--port"
threads = "--threads"
alias = "--alias"
api_key_file = "--api-key-file"
# The draft vocabulary exists on this fork (verified live 2026-11-05:
# "--spec-draft-model"; "--spec-type"; "--spec-draft-n-max N";
# "--spec-draft-ngl, -ngld, --gpu-layers-draft"). Recorded so the surface's
# vocabulary is complete; the P2 parity legs run WITHOUT the draft (the
# streaming-vs-resident question is isolated from the draft axis).
model_draft = "--spec-draft-model"
spec_type = "--spec-type"
spec_draft_n_max = "--spec-draft-n-max"
spec_draft_ngl = "--spec-draft-ngl"

# --- constraints (the same closed set as the other surfaces: the guard
# arithmetic is engine-independent; the parameters are the drift layer). ---

[[constraints]]
kind = "available_ram_headroom"
headroom_factor = 0.15

[[constraints]]
kind = "vram_dense_fit"

[[constraints]]
kind = "expert_slot_floor"
floor_mult = 3

[[constraints]]
kind = "mutually_exclusive"
a = "--mlock"
b = "--moe-stream"

[[constraints]]
kind = "expr"
form = "(<= context_length 262144)"

