# slot class this surface exists for (slot floors, the mlock/moe-stream
# exclusivity, and the half-declared refusal). --moe-stream as a planned flag
# here is FIXTURE DATA for the guard arithmetic, never emission vocabulary —
# v1 routing cannot emit it (the pin). ---

