# L1 engine-surface manifest — the Unsloth prebuilt engine: their own
# llama.cpp fork, shipped for the gfx110X class, carrying the MTP draft
# surface (unsloth transfer plan T4, the pre-registered paired experiment).
#
# Every spelling below was verified live 2026-11-04 against the installed
# binary's --help (UNSLOTH_PREBUILT_INFO.json provenance: release
# b11160-mix-a6922cc, source commit a3c12db9dfc9a5bdf93df199ec370e9faf117c69
# from unslothai/llama.cpp, asset sha256
# 0bc43f5b5f14f5df1cdb9e07e39015cc44e3e1ec18e1de4b93638ac5f202361c,
# ROCM gfx110X build at ~/.unsloth/llama.cpp/build/bin/llama-server).
#
# This surface exists for the paired MTP experiment: both legs run this
# one engine, differing only by the draft flags (isolation). The mainline
# surface (llama-cpp-mainline.toml) stays the production pin and spells
# NO draft vocabulary — its pinned binary is not on disk to verify
# against, and an unverified spelling is never claimed.

surface_id = "llama-cpp-unsloth-prebuilt-mtp"
engine_version_pin = "0.5.0-dev unsloth prebuilt, commit a3c12db9 — release b11160-mix-a6922cc (ROCM gfx110X)"

# The structured pin the startup probe enforces (the probe parses the
# binary's --version line: "version: 0.5.0-dev (build 11160, commit
# a3c12db9d)", verified live 2026-11-04).
[version_pin]
commit = "a3c12db9"
version = "0.5.0-dev"

# The endpoints the supervisor polls (llama-server's standard surface;
# exercised at the experiment run).
[probe]
health_path = "/health"
models_path = "/v1/models"

# --- flags: intent -> concrete spellings for THIS pinned build. Verified
# live 2026-11-04 against the installed binary's --help. ---

[flags]
binary = "llama-server"
model = "--model"
n_gpu_layers = "-ngl"
cpu_moe = "--cpu-moe"
override_tensor = "--override-tensor"
kv_cache_type = ["--cache-type-k", "--cache-type-v"]
ctx_size = "--ctx-size"
flash_attn = "--flash-attn"
host = "--host"
port = "--port"
threads = "--threads"
alias = "--alias"
api_key_file = "--api-key-file"
# The speculative-decoding draft flags (verified live 2026-11-04:
# "--spec-draft-model, -md, --model-draft FNAME";
# "--spec-type none,draft-simple,draft-eagle3,draft-mtp,draft-dflash,draft-dspark,ngram-simple,...";
# "--spec-draft-n-max N"; "--spec-draft-ngl, -ngld, --gpu-layers-draft").
# The mainline surface omits all four — absence is the honest
# no-verified-spelling state, and a draft ask against it is a typed
# refusal (fail-closed, never a silently omitted draft).
model_draft = "--spec-draft-model"
spec_type = "--spec-type"
spec_draft_n_max = "--spec-draft-n-max"
spec_draft_ngl = "--spec-draft-ngl"

# --- constraints (the same closed set as the mainline surface: the guard
# arithmetic is engine-independent; the parameters are the drift layer). ---

[[constraints]]
kind = "available_ram_headroom"
headroom_factor = 0.15

[[constraints]]
kind = "vram_dense_fit"

[[constraints]]
kind = "expert_slot_floor"
floor_mult = 3

[[constraints]]
kind = "mutually_exclusive"
a = "--mlock"
b = "--moe-stream"

[[constraints]]
kind = "expr"
form = "(<= context_length 262144)"

# --- fixtures: the admission gate — every constraint evaluates against
# every fixture env. The first nine carry the mainline's engine-independent
# admission shapes verbatim; the last four gate the draft extension
# (draft bytes enter the resident sum under !mmap, and the VRAM channel
# only when the draft is GPU-placed). ---

