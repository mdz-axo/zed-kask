# hKask — cargo-deny configuration for supply-chain audit
# REQ: SHOULD-5 — cargo-deny in CI for dependency license and security auditing
#
# Run from repo root: cargo deny --config kask/deny.toml check
# (cargo-deny only auto-discovers deny.toml at the workspace root; running
# bare `cargo deny check` here silently falls back to default config and
# reports the ignored advisories as errors.)

[graph]
all-features = true
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but has no safe upgrade; transitive dep of utoipa-axum. Reviewed 2026-07-22 — re-review 2026-10-22." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained; transitive dep of aquamarine. No safe upgrade. Reviewed 2026-07-22 — re-review 2026-10-22. (hkask-communication was deleted; this advisory may be removable if no other dep pulls aquamarine.)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained but has no safe upgrade; required transitively by current lopdf and imageproc for PDF/font processing. Reviewed 2026-07-22 — re-review 2026-10-22." },
    # Upstream-Zed transitive advisories (verified 2026-08-04: every reverse-dep
    # chain terminates in an upstream Zed crate — rpc, language_models, gpui, agent,
    # xtask, xcb/zed-scap — none introduced by kask crates). Track upstream for fixes.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack; transitive via upstream crates/rpc. Not kask-introduced." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive via xtask (merge/gh-workflow). Not kask-introduced." },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitive via upstream workspace crates. Not kask-introduced." },
    { id = "RUSTSEC-2025-0052", reason = "async-std discontinued; transitive via runtimelib (upstream). Not kask-introduced." },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained; transitive via upstream zed crate. Not kask-introduced." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via rustls 0.21 (upstream aws-smithy chain). Not kask-introduced." },
    { id = "RUSTSEC-2026-0058", reason = "quick-xml 0.30 quadratic duplicate-attr check; build-dep of xcb/zed-scap (upstream git pin). Not kask-introduced." },
    { id = "RUSTSEC-2026-0098", reason = "quick-xml 0.38 quadratic duplicate-attr check; transitive via upstream crates/agent. Not kask-introduced." },
    { id = "RUSTSEC-2026-0099", reason = "quick-xml unbounded namespace allocation DoS; same chains as 2026-0058/0098. Not kask-introduced." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101 URI name constraints; transitive via rustls 0.21 (upstream aws-smithy chain). Not kask-introduced." },
    { id = "RUSTSEC-2026-0194", reason = "rustls-webpki wildcard name constraints; same chain as 2026-0104. Not kask-introduced." },
    { id = "RUSTSEC-2026-0195", reason = "rustls-webpki CRL parsing panic; same chain as 2026-0104. Not kask-introduced." },
    { id = "RUSTSEC-2026-0196", reason = "cgmath unmaintained; transitive via upstream mermaid_render dev-dep. Not kask-introduced." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitive via resvg/gpui (upstream). Not kask-introduced." },
    { id = "RUSTSEC-2026-0199", reason = "tokio-io unmaintained; transitive via upstream crates. Not kask-introduced." },
]

[licenses]
# face_id and nom-exif lack Cargo.toml license fields but are functionally
# permissive (face_id: BSD-style, nom-exif: MIT — verified via repo LICENSE files).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "ring", allow = ["ISC", "MIT", "OpenSSL"] },
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "warn"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    { crate = "libsodium", reason = "wallet spec §4.5: use RustCrypto crates" },
    { crate = "libsodium-sys", reason = "wallet spec §4.5: use RustCrypto crates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
