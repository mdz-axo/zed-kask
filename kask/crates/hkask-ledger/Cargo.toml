[package]
name = "hkask-ledger"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "Double-entry accounting ledger — immutable transactions for cost, crypto, and securities tracking"
publish = false

[lib]
name = "hkask_ledger"
path = "src/lib.rs"

[dependencies]
hkask-types = { path = "../hkask-types" }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
