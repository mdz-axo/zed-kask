[package]
name = "hkask-lisp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandboxed Lisp interpreter for deterministic manifest compute steps — no I/O, no filesystem, no network, bounded recursion"

[lib]
path = "src/hkask_lisp.rs"

[dependencies]
# float_roundtrip: the receipts contract compares env results for exact
# equality, so receipt floats must parse to the exact authored double —
# without this feature serde_json can land 1 ULP off 17-digit literals
# (observed: PS-1 checked-above-floor expected 0.9500000000000001 parsed
# as 0.95 and red against its own captured result).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
stacksafe.workspace = true

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
smol = { workspace = true }

[[bin]]
name = "check-skill-lisp-forms"
path = "src/bin/check_skill_lisp_forms.rs"

[[bench]]
name = "engine_bench"
harness = false

[lints]
workspace = true
