[package]
name = "hkask-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP runtime and governance for hKask"


[lib]
path = "src/hkask_mcp.rs"

[dependencies]
hkask-types.workspace = true
hkask-capability.workspace = true
hkask-regulation.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io", "client", "transport-child-process"] }
tokio-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "process", "time"] }
# `reconnect_integration` SIGKILLs the fixture child directly; the repo lint bans
# the blocking `Command::status` that shelling out to `kill` would need.
libc = { workspace = true }

# A real child process is the thing under test for connection healing, so the
# reconnect integration test needs a controllable MCP server binary. Gated to
# `required-features` so a normal build does not produce it.
[[bin]]
name = "mcp-test-fixture"
path = "src/bin/mcp_test_fixture.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []

[[test]]
name = "tool_input_fuzz"
path = "tests/tool_input_fuzz.rs"

[[test]]
name = "invoke_gate"
path = "tests/invoke_gate.rs"

[[test]]
name = "mcp_lifecycle_integration"
path = "tests/mcp_lifecycle_integration.rs"

[[test]]
name = "reconnect_integration"
path = "tests/reconnect_integration.rs"
required-features = ["test-fixture"]