[package]
name = "hkask-regulation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cybernetic Nervous System for hKask"


[lib]
path = "src/hkask_regulation.rs"

[dependencies]
hkask-types = { path = "../hkask-types" }
# Regulation defines WalletBudgetPort; regulation::WalletManager implements it
# directly (gas/rJoule tracking without chain/wallet infrastructure).
hkask-storage = { path = "../hkask-storage" }

serde.workspace = true
serde_json.workspace = true
serde_yaml_neo.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
chrono.workspace = true

parking_lot = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
hkask-storage = { path = "../hkask-storage" }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
