[package]
name = "hkask-bridge-ontology"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ontology bridge — Dublin Core + BIBO + CiTO + PKO core vocabulary and domain supplements (FIBO, SEPIO, GOLEM, ML-Schema, SDMX, OMC, SUMO, schema.org, RDF 1.1). Single source of truth for ontology URIs and the dual-axis domain-selection logic."

[lib]
path = "src/hkask_bridge_ontology.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true }

[dev-dependencies]
# The literal guard test (tests/ontology_literal_guard.rs) scans source
# trees for ontology-shaped string literals.
regex.workspace = true

[lints]
workspace = true
