[package]
name = "hkask-types"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "ID types, nu-event, and visibility types for hKask"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
dirs.workspace = true
zeroize.workspace = true
hex.workspace = true
futures-util.workspace = true
async-trait.workspace = true
blake3 = "1"
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_yaml_neo = "0.11"
tokio = { workspace = true, features = ["macros", "rt"] }
proptest = "1"
tempfile = "3"

[features]
default = []
# sql feature + rusqlite deferred: hkask-storage will be rewritten to use zed's
# sqlez (libsqlite3-sys 0.30.1) instead of rusqlite. See DIVERGENCE.md + plan §14.
