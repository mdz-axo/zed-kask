[package]
name = "hkask-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ID types, nu-event, and visibility types for hKask"


[lib]
path = "src/hkask_types.rs"

[dependencies]
# NOTE: hkask-types must NOT depend on hkask-capability (would create a cycle).
# Modules that need capability types (kanban, goal, loops/curation) are being
# migrated to their domain crates.
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
dirs = { workspace = true }
zeroize.workspace = true
hex.workspace = true
futures-util.workspace = true
async-trait.workspace = true
blake3.workspace = true
sha2.workspace = true
tracing.workspace = true

rusqlite = { workspace = true, optional = true }

[dev-dependencies]
serde_yaml_neo.workspace = true
hkask-capability = { path = "../hkask-capability" }
tokio = { workspace = true, features = ["macros", "rt"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
sql = ["dep:rusqlite"]
