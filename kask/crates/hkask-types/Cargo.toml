[package]
name = "hkask-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Foundation types for the hKask platform — IDs, errors, events, visibility, hexagonal ports, and shared domain primitives"


[lib]
path = "src/hkask_types.rs"

[dependencies]
# NOTE: hkask-types must NOT depend on hkask-capability (would create a cycle).
# Modules that need capability types (kanban, goal, loops/curation) are being
# migrated to their domain crates.
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
zeroize.workspace = true
hex.workspace = true
futures-util.workspace = true
sha2.workspace = true
tracing.workspace = true

rusqlite = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
sql = ["dep:rusqlite"]
