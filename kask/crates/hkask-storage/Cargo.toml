[package]
name = "hkask-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite + SQLCipher storage for hKask"


[lib]
path = "src/hkask_storage.rs"

[dependencies]

hkask-types = { workspace = true, features = ["sql"] }

hkask-keystore.workspace = true
rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
hex.workspace = true
# Argon2id — used ONLY by the legacy-KDF migration (rotation.rs), which
# re-encrypts pre-native databases. Deletable together with that migration
# once no `.salt` files remain.
argon2.workspace = true
rand.workspace = true
base64.workspace = true
aes-gcm.workspace = true
sqlite-vec.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

