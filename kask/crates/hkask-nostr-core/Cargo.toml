[package]
name = "hkask-nostr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Public Nostr operations: event ids, event and signature verification, and bech32 identifiers. Holds no secret-key code of its own, so a package that depends only on this crate cannot link key decryption."

[lib]
path = "src/hkask_nostr_core.rs"

[dependencies]
bech32.workspace = true
hex.workspace = true
k256.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
