[package]
name = "hkask-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server utilities, daemon transport, and startup verification for hKask MCP servers"

[lib]
path = "src/hkask_mcp_server.rs"

[dependencies]
hkask-types.workspace = true
hkask-inference.workspace = true
hkask-keystore.workspace = true
hkask-memory.workspace = true
hkask-storage.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
tokio.workspace = true
# `O_NOFOLLOW` for `write_contained`'s symlink-resistant open (F4). Unix-only;
# already a workspace dependency (transitively present via libsqlite3-sys).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

