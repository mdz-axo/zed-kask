[package]
name = "hkask-mcp-server"
version = "0.31.0"
edition = "2024"
license = "MIT"
description = "MCP server utilities, daemon transport, and startup verification for hKask MCP servers"
publish = false

[dependencies]
hkask-types = { path = "../hkask-types" }
hkask-keystore = { path = "../hkask-keystore" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio.workspace = true
reqwest = { workspace = true, features = ["json"] }
hex.workspace = true
async-trait.workspace = true
dirs = "6"

[features]
default = []
