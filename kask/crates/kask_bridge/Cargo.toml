[package]
name = "kask_bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The bidirectional seam between hKask port traits and zed-kask facilities (D8)"

[dependencies]
# hKask side — port traits only (never concrete zed crates)
hkask-types = { path = "../hkask-types" }
hkask-capability = { path = "../hkask-capability" }
hkask-templates = { path = "../hkask-templates" }
hkask-mcp = { path = "../hkask-mcp" }
hkask-memory = { path = "../hkask-memory" }
hkask-storage = { path = "../hkask-storage" }
hkask-inference = { path = "../hkask-inference" }
hkask-keystore = { path = "../hkask-keystore" }
hkask-services-core = { path = "../hkask-services-core" }
hkask-condenser = { path = "../hkask-condenser" }

# zed-kask side — the facilities the bridge adapts over
credentials_provider = { path = "../../../crates/credentials_provider" }
language_model = { path = "../../../crates/language_model" }
language_model_core = { path = "../../../crates/language_model_core" }
gpui = { path = "../../../crates/gpui" }
agent = { path = "../../../crates/agent" }
settings = { path = "../../../crates/settings" }
settings_content = { path = "../../../crates/settings_content" }
collections = { path = "../../../crates/collections" }
schemars = { workspace = true }

# Shared
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
