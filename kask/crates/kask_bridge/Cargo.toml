[package]
name = "kask_bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The bidirectional seam between hKask port traits and zed-kask facilities (D8)"


[lib]
path = "src/kask_bridge.rs"

[dependencies]
# hKask side — port traits only (never concrete zed crates)
hkask-types.workspace = true
hkask-capability.workspace = true
hkask-templates.workspace = true
hkask-memory.workspace = true
hkask-storage.workspace = true
hkask-inference.workspace = true
hkask-keystore.workspace = true
hkask-regulation.workspace = true
hkask-verification.workspace = true
hkask-email.workspace = true
hkask-services-core.workspace = true
hkask-condenser.workspace = true
hkask_tool_invoker.workspace = true

# zed-kask side — the facilities the bridge adapts over
language_model.workspace = true
language_model_core.workspace = true
http_client.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
agent.workspace = true
agent_skills.workspace = true
settings.workspace = true
settings_content.workspace = true
credentials_provider.workspace = true
fs.workspace = true
collections.workspace = true
schemars = { workspace = true }
edit_prediction.workspace = true

# Shared
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
futures-util.workspace = true
rand.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde_yaml_neo.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[lints]
workspace = true

[features]
test-utils = []

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true
hkask-test-harness.workspace = true
hkask-mcp-swarm = { workspace = true, features = ["test-utils"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "bridge_gap_properties"
path = "tests/bridge_gap_properties.rs"
required-features = ["test-utils"]

[[test]]
name = "swarm_default_drift"
path = "tests/swarm_default_drift.rs"
required-features = ["test-utils"]
